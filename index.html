หรือกำหนดเวลาเก้าสิบวันนับแต่วันที่เด็กหรือมารดาเด็กแจ้งต่อนายทะเบียนว่าผู้ขอจดทะเบียนรับเด็กเป็นบุตรไม่สมควรใช้อำนาจปกครองบางส่วนหรือทั้งหมดนั้นได้ล่วงพ้นไปโดยเด็กหรือมารดาเด็กมิได้ร้องขอต่อศาลให้พิพากษาว่าผู้ขอจดทะเบียนรับเด็กเป็นบุตรไม่เป็นผู้สมควรใช้อำนาจปกครองบางส่วนหรือทั้งหมด\nในคดีที่ศาลพิพากษาว่าผู้ขอจดทะเบียนรับเด็กเป็นบุตรเป็นผู้ไม่สมควรใช้อำนาจปกครองบางส่วนหรือทั้งหมด ศาลจะพิพากษาในคดีเดียวกันนั้นให้ผู้ใดเป็นผู้ใช้อำนาจปกครองหรือเป็นผู้ปกครองเพื่อการปกครองบางส่วนหรือทั้งหมดก็ได้"],["1550","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๕๐ (ยกเลิก)"],["1551","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๕๑ ในกรณีที่มีการคัดค้านว่าผู้ซึ่งขอจดทะเบียนรับเด็กเป็นบุตรมิใช่บิดาของเด็ก เมื่อผู้ซึ่งขอจดทะเบียนรับเด็กเป็นบุตรนำคดีไปสู่ศาลขอให้ศาลพิพากษาว่าผู้ขอจดทะเบียนรับเด็กเป็นบุตรเป็นบิดาของเด็ก เด็กหรือมารดาเด็กจะขอให้ศาลพิพากษาในคดีเดียวกันนั้นก็ได้ว่า ผู้ขอจดทะเบียนรับเด็กเป็นบุตรแม้จะเป็นบิดาของเด็ก ก็เป็นผู้ไม่สมควรใช้อำนาจปกครองบางส่วนหรือทั้งหมด ในกรณีเช่นว่านี้ให้นำความในวรรคสามของมาตรา ๑๕๔๙ มาใช้บังคับโดยอนุโลม"],["1552","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๕๒ ในกรณีที่เด็กไม่มีมารดาหรือมีมารดาแต่มารดาถูกถอนอำนาจปกครองบางส่วนหรือทั้งหมดและศาลได้ตั้งผู้อื่นเป็นผู้ปกครองบางส่วนหรือทั้งหมดไว้ก่อนมีการจดทะเบียนรับเด็กเป็นบุตร บิดาซึ่งจดทะเบียนรับเด็กเป็นบุตรชอบด้วยกฎหมายแล้วจะร้องขอต่อศาลให้มีคำสั่งถอนความเป็นผู้ปกครองบางส่วน หรือทั้งหมดของผู้ปกครองและให้บิดาเป็นผู้ใช้อำนาจปกครองก็ได้ ถ้าศาลเห็นว่าบิดาอาจใช้อำนาจปกครองเพื่อความผาสุกและประโยชน์ของเด็กได้ดียิ่งกว่าผู้ปกครอง ศาลจะมีคำสั่งถอนความเป็นผู้ปกครองบางส่วนหรือทั้งหมดของผู้ปกครองและให้บิดาเป็นผู้ใช้อำนาจปกครองก็ได้"],["1553","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๕๓ (ยกเลิก)"],["1554","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๕๔ ผู้มีส่วนได้เสียจะขอให้ศาลถอนการจดทะเบียนรับเด็กเป็นบุตร เพราะเหตุว่าผู้ขอให้จดทะเบียนนั้นมิใช่บิดาก็ได้ แต่ต้องฟ้องภายในสามเดือนนับแต่วันที่รู้การจดทะเบียนนั้น อนึ่ง ห้ามมิให้ฟ้องเมื่อพ้นสิบปีนับแต่วันจดทะเบียน"],["1555","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๕๕ ในคดีฟ้องขอให้รับเด็กเป็นบุตรชอบด้วยกฎหมาย ให้สันนิษฐานไว้ก่อนว่าเด็กเป็นบุตรชอบด้วยกฎหมายของชายเมื่อปรากฏข้อเท็จจริงอย่างหนึ่งอย่างใดดังต่อไปนี้\n(๑) เมื่อมีการข่มขืนกระทำชำเรา ฉุดคร่า หรือหน่วงเหนี่ยวกักขังหญิงมารดาโดยมิชอบด้วยกฎหมายในระยะเวลาซึ่งหญิงนั้นอาจตั้งครรภ์ได้\n(๒) เมื่อมีการลักพาหญิงมารดาไปในทางชู้สาวหรือมีการล่อลวงร่วมประเวณีกับหญิงมารดาในระยะเวลาซึ่งหญิงนั้นอาจตั้งครรภ์ได้\n(๓) เมื่อมีเอกสารของบิดาแสดงว่าเด็กนั้นเป็นบุตรของตน\n(๔) เมื่อปรากฏในทะเบียนคนเกิดว่าเด็กเป็นบุตรโดยมีหลักฐานว่าบิดาเป็นผู้แจ้งการเกิดหรือรู้เห็นยินยอมในการแจ้งนั้น\n(๕) เมื่อบิดามารดาได้อยู่กินด้วยกันอย่างเปิดเผยในระยะเวลาซึ่งหญิงมารดาอาจตั้งครรภ์ได้\n(๖) เมื่อได้มีการร่วมประเวณีกับหญิงมารดาในระยะเวลาซึ่งหญิงนั้นอาจตั้งครรภ์ได้ และมีเหตุอันควรเชื่อได้ว่าเด็กนั้นมิได้เป็นบุตรของชายอื่น\n(๗) เมื่อมีพฤติการณ์ที่รู้กันทั่วไปตลอดมาว่าเป็นบุตร\nพฤติการณ์ที่รู้กันทั่วไปตลอดมาว่าเป็นบุตรนั้น ให้พิจารณาข้อเท็จจริงที่แสดงความเกี่ยวข้องฉันบิดากับบุตรซึ่งปรากฏในระหว่างตัวเด็กกับครอบครัวที่เด็กอ้างว่าตนสังกัดอยู่ เช่น บิดาให้การศึกษา ให้ความอุปการะเลี้ยงดูหรือยอมให้เด็กนั้นใช้ชื่อสกุลของตนหรือโดยเหตุประการอื่น\nในกรณีใดกรณีหนึ่งดังกล่าวข้างต้น ถ้าปรากฏว่าชายไม่อาจเป็นบิดาของเด็กนั้นได้ ให้ยกฟ้องเสีย"],["1556","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๕๖ การฟ้องคดีขอให้รับเด็กเป็นบุตรในระหว่างที่เด็กเป็นผู้เยาว์ ถ้าเด็กมีอายุยังไม่ครบสิบห้าปีบริบูรณ์ ผู้แทนโดยชอบธรรมของเด็กเป็นผู้ฟ้องแทน ในกรณีที่เด็กไม่มีผู้แทนโดยชอบธรรม หรือมีแต่ผู้แทนโดยชอบธรรมไม่สามารถทำหน้าที่ได้ ญาติสนิทของเด็กหรืออัยการอาจร้องขอต่อศาลให้ตั้งผู้แทนเฉพาะคดีเพื่อทำหน้าที่ฟ้องคดีแทนเด็กก็ได้\nเมื่อเด็กมีอายุสิบห้าปีบริบูรณ์ เด็กต้องฟ้องเอง ทั้งนี้ โดยไม่จำต้องได้รับความยินยอมของผู้แทนโดยชอบธรรม\nในกรณีที่เด็กบรรลุนิติภาวะแล้ว จะต้องฟ้องคดีภายในหนึ่งปีนับแต่วันบรรลุนิติภาวะ\nในกรณีที่เด็กตายในระหว่างที่เด็กนั้นยังมีสิทธิฟ้องคดีขอให้รับเด็กเป็นบุตรอยู่ ผู้สืบสันดานของเด็กจะฟ้องคดีขอให้รับเด็กเป็นบุตรก็ได้ ถ้าผู้สืบสันดานของเด็กได้รู้เหตุที่อาจขอให้รับเด็กเป็นบุตรมาก่อนวันที่เด็กนั้นตาย ผู้สืบสันดานของเด็กจะต้องฟ้องภายในหนึ่งปีนับแต่วันที่เด็กนั้นตาย ถ้าผู้สืบสันดานของเด็กได้รู้เหตุที่อาจขอให้รับเด็กเป็นบุตรภายหลังที่เด็กนั้นตายผู้สืบสันดานของเด็กจะต้องฟ้องภายในหนึ่งปีนับแต่วันที่รู้เหตุดังกล่าว แต่ทั้งนี้ ต้องไม่พ้นสิบปีนับแต่วันที่เด็กนั้นตาย\nการฟ้องคดีขอให้รับเด็กเป็นบุตรในระหว่างที่ผู้สืบสันดานของเด็กเป็นผู้เยาว์ ให้นำความในวรรคหนึ่งและวรรคสองมาใช้บังคับโดยอนุโลม"],["1557","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๕๗ การเป็นบุตรชอบด้วยกฎหมายตามมาตรา ๑๕๔๗ ให้มีผลนับแต่วันที่เด็กเกิด แต่ทั้งนี้จะอ้างเป็นเหตุเสื่อมสิทธิของบุคคลภายนอกผู้ทำการโดยสุจริตในระหว่างเวลาตั้งแต่เด็กเกิดจนถึงเวลาที่บิดามารดาได้สมรสกันหรือบิดาได้จดทะเบียนว่าเป็นบุตรหรือศาลพิพากษาถึงที่สุดว่าเป็นบุตรไม่ได้"],["1558","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๕๘ การฟ้องคดีขอให้รับเด็กเป็นบุตรของผู้ตายที่ได้ฟ้องภายในกำหนดอายุความมรดก ถ้าศาลได้พิพากษาว่าเด็กเป็นบุตรชอบด้วยกฎหมายของผู้ตาย เด็กนั้นมีสิทธิรับมรดกในฐานะทายาทโดยธรรม\nในกรณีที่ได้มีการแบ่งมรดกไปแล้ว ให้นำบทบัญญัติแห่งประมวลกฎหมายนี้ว่าด้วยเรื่องลาภมิควรได้มาใช้บังคับโดยอนุโลม"],["1559","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๕๙ เมื่อได้จดทะเบียนเด็กเป็นบุตรแล้วจะถอนมิได้"],["1560","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๖๐ บุตรเกิดระหว่างสมรสซึ่งศาลพิพากษาให้เพิกถอนภายหลังนั้นให้ถือว่าเป็นบุตรชอบด้วยกฎหมาย"],["1561","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๖๑ บุตรมีสิทธิใช้ชื่อสกุลของบิดา\nในกรณีที่บิดาไม่ปรากฏ บุตรมีสิทธิใช้ชื่อสกุลของมารดา"],["1562","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๖๒ ผู้ใดจะฟ้องบุพการีของตนเป็นคดีแพ่งหรือคดีอาญามิได้ แต่เมื่อผู้นั้นหรือญาติสนิทของผู้นั้นร้องขอ อัยการจะยกคดีขึ้นว่ากล่าวก็ได้"],["1563","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๖๓ บุตรจำต้องอุปการะเลี้ยงดูบิดามารดา"],["1564","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๖๔ บิดามารดาจำต้องอุปการะเลี้ยงดูและให้การศึกษาตามสมควรแก่บุตรในระหว่างที่เป็นผู้เยาว์\nบิดามารดาจำต้องอุปการะเลี้ยงดูบุตรซึ่งบรรลุนิติภาวะแล้วแต่เฉพาะผู้ทุพพลภาพและหาเลี้ยงตนเองมิได้"],["1565","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๖๕ การร้องขอค่าอุปการะเลี้ยงดูบุตรหรือขอให้บุตรได้รับการอุปการะเลี้ยงดูโดยประการอื่น นอกจากอัยการจะยกคดีขึ้นว่ากล่าวตามมาตรา ๑๕๖๒ แล้ว บิดาหรือมารดาจะนำคดีขึ้นว่ากล่าวก็ได้"],["1566","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๖๖ บุตรซึ่งยังไม่บรรลุนิติภาวะต้องอยู่ใต้อำนาจปกครองของบิดามารดา\nอำนาจปกครองอยู่กับบิดาหรือมารดาในกรณีดังต่อไปนี้\n(๑) มารดาหรือบิดาตาย\n(๒) ไม่แน่นอนว่ามารดาหรือบิดามีชีวิตอยู่หรือตาย\n(๓) มารดาหรือบิดาถูกศาลสั่งให้เป็นคนไร้ความสามารถหรือเสมือนไร้ความสามารถ\n(๔) มารดาหรือบิดาต้องเข้ารักษาตัวในโรงพยาบาลเพราะจิตฟั่นเฟือน\n(๕) ศาลสั่งให้อำนาจปกครองอยู่กับบิดาหรือมารดา\n(๖) บิดาและมารดาตกลงกันตามที่มีกฎหมายบัญญัติไว้ให้ตกลงกันได้"],["1567","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๖๗ ผู้ใช้อำนาจปกครองมีสิทธิ\n(๑) กำหนดที่อยู่ของบุตร\n(๒) ทำโทษบุตรเพื่อว่ากล่าวสั่งสอนหรือปรับพฤติกรรม โดยต้องไม่เป็นการกระทำทารุณกรรมหรือทำร้ายด้วยความรุนแรงต่อร่างกายหรือจิตใจ หรือกระทำโดยมิชอบ\n(๓) ให้บุตรทำการงานตามสมควรแก่ความสามารถและฐานานุรูป\n(๔) เรียกบุตรคืนจากบุคคลอื่นซึ่งกักบุตรไว้โดยมิชอบด้วยกฎหมาย"],["1568","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๖๘ เมื่อบุคคลใดมีบุตรติดมาได้สมรสกับบุคคลอื่น อำนาจปกครองที่มีต่อบุตรอยู่กับผู้ที่บุตรนั้นติดมา"],["1569","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๖๙ ผู้ใช้อำนาจปกครองเป็นผู้แทนโดยชอบธรรมของบุตรในกรณีที่บุตรถูกศาลสั่งให้เป็นคนไร้ความสามารถหรือเสมือนไร้ความสามารถ ผู้ใช้อำนาจปกครองย่อมเป็นผู้อนุบาลหรือผู้พิทักษ์ แล้วแต่กรณี"],["1569/1","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๖๙/๑ ในกรณีที่ผู้เยาว์ถูกศาลสั่งให้เป็นคนไร้ความสามารถและศาลมีคำสั่งตั้งบุคคลอื่นซึ่งมิใช่ผู้ใช้อำนาจปกครองหรือผู้ปกครองเป็นผู้อนุบาลให้คำสั่งนั้นมีผลเป็นการถอนผู้ใช้อำนาจปกครอง หรือผู้ปกครองที่เป็นอยู่ในขณะนั้น\nในกรณีที่บุคคลซึ่งบรรลุนิติภาวะและไม่มีคู่สมรสถูกศาลสั่งให้เป็นคนไร้ความสามารถหรือเสมือนไร้ความสามารถ ให้บิดามารดา หรือบิดาหรือมารดาเป็นผู้อนุบาลหรือผู้พิทักษ์ แล้วแต่กรณี เว้นแต่ศาลจะสั่งเป็นอย่างอื่น"],["1570","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๗๐ คำบอกกล่าวที่ผู้ใช้อำนาจปกครองตามมาตรา ๑๕๖๖ หรือมาตรา ๑๕๖๘ แจ้งไปหรือรับแจ้งมาให้ถือว่าเป็นคำบอกกล่าวที่บุตรได้แจ้งไปหรือรับแจ้งมา"],["1571","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๗๑ อำนาจปกครองนั้น รวมทั้งการจัดการทรัพย์สินของบุตรด้วย และให้จัดการทรัพย์สินนั้นด้วยความระมัดระวังเช่นวิญญูชนจะพึงกระทำ"],["1572","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๗๒ ผู้ใช้อำนาจปกครองจะทำหนี้ที่บุตรจะต้องทำเองโดยมิได้รับความยินยอมของบุตรไม่ได้"],["1573","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๗๓ ถ้าบุตรมีเงินได้ ให้ใช้เงินนั้นเป็นค่าอุปการะเลี้ยงดูและการศึกษาก่อน ส่วนที่เหลือผู้ใช้อำนาจปกครองต้องเก็บรักษาไว้เพื่อส่งมอบแก่บุตร แต่ถ้าผู้ใช้อำนาจปกครองไม่มีเงินได้เพียงพอแก่การครองชีพตามสมควรแก่ฐานะ ผู้ใช้อำนาจปกครองจะใช้เงินนั้นตามสมควรก็ได้ เว้นแต่จะเป็นเงินได้ที่เกิดจากทรัพย์สินโดยการให้โดยเสน่หาหรือพินัยกรรมซึ่งมีเงื่อนไขว่ามิให้ผู้ใช้อำนาจปกครองได้ประโยชน์จากทรัพย์สินนั้น ๆ"],["1574","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๗๔ นิติกรรมใดอันเกี่ยวกับทรัพย์สินของผู้เยาว์ดังต่อไปนี้ ผู้ใช้อำนาจปกครองจะกระทำมิได้ เว้นแต่ศาลจะอนุญาต\n(๑) ขาย แลกเปลี่ยน ขายฝาก ให้เช่าซื้อ จำนอง ปลดจำนอง หรือโอนสิทธิจำนอง ซึ่งอสังหาริมทรัพย์หรือสังหาริมทรัพย์ที่อาจจำนองได้\n(๒) กระทำให้สุดสิ้นลงทั้งหมดหรือบางส่วน ซึ่งทรัพยสิทธิของผู้เยาว์อันเกี่ยวกับอสังหาริมทรัพย์\n(๓) ก่อตั้งภาระจำยอม สิทธิอาศัย สิทธิเหนือพื้นดิน สิทธิเก็บกิน ภาระติดพันในอสังหาริมทรัพย์ หรือทรัพยสิทธิอื่นใดในอสังหาริมทรัพย์\n(๔) จำหน่ายไปทั้งหมดหรือบางส่วนซึ่งสิทธิเรียกร้องที่จะให้ได้มาซึ่งทรัพยสิทธิในอสังหาริมทรัพย์ หรือสังหาริมทรัพย์ที่อาจจำนองได้ หรือสิทธิเรียกร้องที่จะให้ทรัพย์สินเช่นว่านั้นของผู้เยาว์ปลอดจากทรัพยสิทธิที่มีอยู่เหนือทรัพย์สินนั้น\n(๕) ให้เช่าอสังหาริมทรัพย์เกินสามปี\n(๖) ก่อข้อผูกพันใด ๆ ที่มุ่งให้เกิดผลตาม (๑) (๒) หรือ (๓)\n(๗) ให้กู้ยืมเงิน\n(๘) ให้โดยเสน่หา เว้นแต่จะเอาเงินได้ของผู้เยาว์ให้แทนผู้เยาว์เพื่อการกุศลสาธารณะ เพื่อการสังคม หรือตามหน้าที่ธรรมจรรยา ทั้งนี้ พอสมควรแก่ฐานานุรูปของผู้เยาว์\n(๙) รับการให้โดยเสน่หาที่มีเงื่อนไขหรือค่าภาระติดพัน หรือไม่รับการให้โดยเสน่หา\n(๑๐) ประกันโดยประการใด ๆ อันอาจมีผลให้ผู้เยาว์ต้องถูกบังคับชำระหนี้หรือทำนิติกรรมอื่นที่มีผลให้ผู้เยาว์ต้องรับเป็นผู้รับชำระหนี้ของบุคคลอื่นหรือแทนบุคคลอื่น\n(๑๑) นำทรัพย์สินไปแสวงหาผลประโยชน์นอกจากในกรณีที่บัญญัติไว้ในมาตรา ๑๕๙๘/๔ (๑) (๒) หรือ (๓)\n(๑๒) ประนีประนอมยอมความ\n(๑๓) มอบข้อพิพาทให้อนุญาโตตุลาการวินิจฉัย"],["1575","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๗๕ ถ้าในกิจการใด ประโยชน์ของผู้ใช้อำนาจปกครอง หรือประโยชน์ของคู่สมรสหรือบุตรของผู้ใช้อำนาจปกครองขัดกับประโยชน์ของผู้เยาว์ ผู้ใช้อำนาจปกครองต้องได้รับอนุญาตจากศาลก่อนจึงทำกิจการนั้นได้ มิฉะนั้นเป็นโมฆะ"],["1576","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๗๖ ประโยชน์ของผู้ใช้อำนาจปกครอง หรือของคู่สมรสหรือบุตรของผู้ใช้อำนาจปกครองตามมาตรา ๑๕๗๕ ให้หมายความรวมถึงประโยชน์ในกิจการดังต่อไปนี้ด้วย คือ\n(๑) ประโยชน์ในกิจการที่กระทำกับห้างหุ้นส่วนสามัญที่บุคคลดังกล่าวนั้นเป็นหุ้นส่วน\n(๒) ประโยชน์ในกิจการที่กระทำกับห้างหุ้นส่วนจำกัดที่บุคคลดังกล่าวนั้นเป็นหุ้นส่วนจำพวกไม่จำกัดความรับผิด"],["1577","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๗๗ บุคคลใดจะโอนทรัพย์สินให้ผู้เยาว์โดยพินัยกรรมหรือโดยการให้โดยเสน่หาซึ่งมีเงื่อนไขให้บุคคลอื่นนอกจากผู้ใช้อำนาจปกครองเป็นผู้จัดการจนกว่าผู้เยาว์จะบรรลุนิติภาวะก็ได้ ผู้จัดการนั้นต้องเป็นผู้ซึ่งผู้โอนระบุชื่อไว้ หรือถ้ามิได้ระบุไว้ก็ให้ศาลสั่ง แต่การจัดการทรัพย์สินนั้นต้องอยู่ภายในบังคับมาตรา ๕๖ มาตรา ๕๗ มาตรา ๖๐"],["1578","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๗๘ ในกรณีที่อำนาจปกครองสิ้นไปเพราะผู้เยาว์บรรลุนิติภาวะผู้ใช้อำนาจปกครองต้องรีบส่งมอบทรัพย์สินที่จัดการและบัญชีในการนั้นให้ผู้บรรลุนิติภาวะเพื่อรับรอง ถ้ามีเอกสารเกี่ยวกับเรื่องจัดการทรัพย์สินนั้น ก็ให้ส่งมอบพร้อมกับบัญชี\nในกรณีที่อำนาจปกครองสิ้นไปเพราะเหตุอื่นนอกจากที่กล่าวในวรรคหนึ่งให้มอบทรัพย์สิน บัญชี และเอกสารที่เกี่ยวกับเรื่องจัดการทรัพย์สินให้แก่ผู้ใช้อำนาจปกครอง ถ้ามี หรือผู้ปกครอง แล้วแต่กรณี เพื่อรับรอง"],["1579","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๗๙ ในกรณีที่คู่สมรสฝ่ายหนึ่งถึงแก่ความตายและมีบุตรที่เกิดด้วยกันและคู่สมรสอีกฝ่ายหนึ่งจะสมรสใหม่ ถ้าคู่สมรสนั้นได้ครอบครองทรัพย์สินอันเป็นสัดส่วนของบุตรไว้อย่างถูกต้องแล้ว จะส่งมอบทรัพย์สินให้แก่บุตรในเมื่อสามารถจัดการก็ได้ หรือมิฉะนั้นจะเก็บรักษาไว้เพื่อมอบให้บุตรเมื่อถึงเวลาอันสมควรก็ได้ แต่ถ้าทรัพย์สินใดเป็นจำพวกที่ระบุไว้ในมาตรา ๔๕๖ หรือที่มีเอกสารเป็นสำคัญ ให้ลงชื่อบุตรเป็นเจ้าของรวมในเอกสารนั้น ก่อนที่จะจัดการดังกล่าวคู่สมรสนั้นจะทำการสมรสมิได้\nในกรณีที่มีเหตุอันสมควร ศาลจะมีคำสั่งให้คู่สมรสดังกล่าวทำการสมรสไปก่อนก็ได้ คำสั่งศาลเช่นว่านี้ ให้ระบุไว้ด้วยว่าให้คู่สมรสปฏิบัติการแบ่งแยกทรัพย์สินและทำบัญชีทรัพย์สิน ตามความในวรรคหนึ่งภายในกำหนดเวลาเท่าใดภายหลังการสมรสนั้นด้วย\nในกรณีที่การสมรสได้กระทำไปโดยมิได้ปฏิบัติตามวรรคหนึ่ง หรือในกรณีที่คู่สมรสไม่ปฏิบัติตามคำสั่งของศาลดังกล่าวในวรรคสอง เมื่อความปรากฏแก่ศาลเอง หรือเมื่อญาติของผู้เยาว์หรืออัยการร้องขอ ศาลมีอำนาจสั่งให้ถอนอำนาจปกครองจากคู่สมรสนั้น หรือจะมอบให้บุคคลหนึ่งบุคคลใดทำบัญชีและลงชื่อบุตรเป็นเจ้าของรวมในเอกสารดังกล่าวแทนโดยให้คู่สมรสเสียค่าใช้จ่ายก็ได้\nเพื่อประโยชน์แห่งมาตรานี้ ให้ถือว่าบุตรบุญธรรมของคู่สมรสที่ตายไปและที่มีชีวิตอยู่ทั้งสองฝ่ายเป็นบุตรที่เกิดจากคู่สมรส"],["1580","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๘๐ ผู้เยาว์ซึ่งบรรลุนิติภาวะแล้ว ผู้ใช้อำนาจปกครองหรือผู้ปกครองจะให้การรับรองการจัดการทรัพย์สินของผู้เยาว์ได้ต่อเมื่อได้รับมอบทรัพย์สินบัญชีและเอกสารตามมาตรา ๑๕๗๘ แล้ว"],["1581","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๘๑ คดีเกี่ยวกับการจัดการทรัพย์สินในระหว่างผู้เยาว์กับผู้ใช้อำนาจปกครองนั้น ห้ามมิให้ฟ้องเมื่อพ้นหนึ่งปีนับแต่เวลาที่อำนาจปกครองสิ้นไป\nถ้าอำนาจปกครองสิ้นไปขณะบุตรยังเป็นผู้เยาว์อยู่ ให้เริ่มนับอายุความในวรรคหนึ่งตั้งแต่เวลาที่ผู้เยาว์บรรลุนิติภาวะ หรือเมื่อมีผู้แทนโดยชอบธรรมขึ้นใหม่"],["1582","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๘๒ ถ้าผู้ใช้อำนาจปกครองเป็นคนไร้ความสามารถหรือเสมือนไร้ความสามารถโดยคำสั่งของศาลก็ดี ใช้อำนาจปกครองเกี่ยวแก่ตัวผู้เยาว์โดยมิชอบก็ดี ประพฤติชั่วร้ายก็ดี ในกรณีเหล่านี้ศาลจะสั่งเอง หรือจะสั่งเมื่อญาติของผู้เยาว์หรืออัยการร้องขอให้ถอนอำนาจปกครองเสียบางส่วนหรือทั้งหมดก็ได้\nถ้าผู้ใช้อำนาจปกครองล้มละลายก็ดี หรือจัดการทรัพย์สินของผู้เยาว์ในทางที่ผิดจนอาจเป็นภัยก็ดี ศาลจะสั่งตามวิธีในวรรคหนึ่งให้ถอนอำนาจจัดการทรัพย์สินเสียก็ได้"],["1583","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๘๓ ผู้ถูกถอนอำนาจปกครองบางส่วนหรือทั้งหมดนั้น ถ้าเหตุดังกล่าวไว้ในมาตราก่อนสิ้นไปแล้ว และเมื่อตนเองหรือญาติของผู้เยาว์ร้องขอ ศาลจะสั่งให้มีอำนาจปกครองดังเดิมก็ได้"],["1584","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๘๔ การที่ผู้ใช้อำนาจปกครองถูกถอนอำนาจปกครองบางส่วนหรือทั้งหมด ไม่เป็นเหตุให้ผู้นั้นพ้นจากหน้าที่อุปการะเลี้ยงดูผู้เยาว์ตามกฎหมาย"],["1584/1","b5t2","หมวด ๒ สิทธิและหน้าที่ของบิดามารดาและบุตร","","มาตรา ๑๕๘๔/๑ บิดาหรือมารดาย่อมมีสิทธิที่จะติดต่อกับบุตรของตนได้ตามควรแก่พฤติการณ์ ไม่ว่าบุคคลใดจะเป็นผู้ใช้อำนาจปกครองหรือผู้ปกครองก็ตาม"],["1585","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๘๕ บุคคลที่ยังไม่บรรลุนิติภาวะและไม่มีบิดามารดาหรือบิดามารดาถูกถอนอำนาจปกครองเสียแล้วนั้น จะจัดให้มีผู้ปกครองขึ้นในระหว่างที่เป็นผู้เยาว์ก็ได้\nในกรณีที่ผู้ใช้อำนาจปกครองถูกถอนอำนาจปกครองบางส่วนตามมาตรา ๑๕๘๒ วรรคหนึ่ง ศาลจะตั้งผู้ปกครองในส่วนที่ผู้ใช้อำนาจปกครองถูกถอนอำนาจปกครองนั้นก็ได้ หรือในกรณีที่ผู้ใช้อำนาจปกครองถูกถอนอำนาจจัดการทรัพย์สินตามมาตรา ๑๕๘๒ วรรคสอง ศาลจะตั้งผู้ปกครองเพื่อจัดการทรัพย์สินก็ได้"],["1586","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๘๖ ผู้ปกครองตามมาตรา ๑๕๘๕ นั้นให้ตั้งโดยคำสั่งศาลเมื่อมีการร้องขอของญาติของผู้เยาว์ อัยการ หรือผู้ซึ่งบิดาหรือมารดาที่ตายทีหลังได้ระบุชื่อไว้ในพินัยกรรมให้เป็นผู้ปกครอง\nภายใต้บังคับมาตรา ๑๕๙๐ การตั้งผู้ปกครองนั้นถ้ามีข้อกำหนดพินัยกรรมก็ให้ศาลตั้งตามข้อกำหนดพินัยกรรม เว้นแต่พินัยกรรมนั้นไม่มีผลบังคับหรือบุคคลที่ระบุชื่อไว้ในพินัยกรรมนั้นเป็นบุคคลที่ต้องห้ามมิให้เป็นผู้ปกครองตามมาตรา ๑๕๘๗"],["1587","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๘๗ บุคคลที่บรรลุนิติภาวะแล้วอาจถูกตั้งเป็นผู้ปกครองได้ เว้นแต่\n(๑) ผู้ซึ่งศาลสั่งว่าเป็นคนไร้ความสามารถ หรือเสมือนไร้ความสามารถ\n(๒) ผู้ซึ่งเป็นบุคคลล้มละลาย\n(๓) ผู้ซึ่งไม่เหมาะสมที่จะปกครองผู้เยาว์หรือทรัพย์สินของผู้เยาว์\n(๔) ผู้ซึ่งมีหรือเคยมีคดีในศาลกับผู้เยาว์ ผู้บุพการีหรือพี่น้องร่วมบิดามารดาหรือร่วมแต่บิดาหรือมารดากับผู้เยาว์\n(๕) ผู้ซึ่งบิดาหรือมารดาที่ตายได้ทำหนังสือระบุชื่อห้ามไว้มิให้เป็นผู้ปกครอง"],["1588","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๘๘ หากปรากฏว่าบุคคลที่ศาลตั้งให้เป็นผู้ปกครองเป็นผู้ต้องห้ามมิให้เป็นผู้ปกครองตามมาตรา ๑๕๘๗ อยู่ในขณะที่ศาลตั้งให้เป็นผู้ปกครองโดยปรากฏแก่ศาลเองหรือผู้มีส่วนได้เสียหรืออัยการร้องขอ ให้ศาลสั่งเพิกถอนคำสั่งตั้งผู้ปกครองนั้นเสียและมีคำสั่งเกี่ยวกับผู้ปกครองต่อไปตามที่เห็นสมควร\nการเพิกถอนคำสั่งตั้งผู้ปกครองตามวรรคหนึ่ง ไม่กระทบกระเทือนสิทธิของบุคคลภายนอกผู้กระทำการโดยสุจริต เว้นแต่ในกรณีการเพิกถอนคำสั่งตั้งผู้ปกครองที่ต้องห้ามตามมาตรา ๑๕๘๗ (๑) หรือ (๒) การกระทำของผู้ปกครองไม่ผูกพันผู้เยาว์ไม่ว่าบุคคลภายนอกจะได้กระทำการโดยสุจริตหรือไม่"],["1589","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๘๙ (ยกเลิก)"],["1590","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๐ ผู้ปกครองมีได้คราวหนึ่งเพียงคนเดียว แต่ในกรณีมีข้อกำหนดพินัยกรรมให้ตั้งผู้ปกครองหลายคนหรือเมื่อมีผู้ร้องขอโดยมีเหตุผลอันสมควร ให้ศาลมีอำนาจตั้งผู้ปกครองได้ตามจำนวนที่ศาลเห็นว่าจำเป็น ในกรณีที่ตั้งผู้ปกครองหลายคนศาลจะกำหนดให้ผู้ปกครองเหล่านั้นกระทำการร่วมกันหรือกำหนดอำนาจเฉพาะสำหรับคนหนึ่ง ๆ ก็ได้"],["1591","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๑ ความเป็นผู้ปกครองนั้นเริ่มแต่วันทราบคำสั่งตั้งของศาล"],["1592","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๒ ให้ผู้ปกครองรีบทำบัญชีทรัพย์สินของผู้อยู่ในปกครองให้เสร็จภายในสามเดือนนับแต่วันที่ทราบคำสั่งตั้งของศาล แต่ผู้ปกครองจะร้องต่อศาลก่อนสิ้นกำหนดขอให้ยืดเวลาก็ได้\nบัญชีนั้นต้องมีพยานรับรองความถูกต้องอย่างน้อยสองคน พยานสองคนนั้นต้องเป็นผู้บรรลุนิติภาวะและเป็นญาติของผู้อยู่ในปกครอง แต่ถ้าหาญาติไม่ได้จะให้ผู้อื่นเป็นพยานก็ได้"],["1593","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๓ ให้ผู้ปกครองยื่นสำเนาบัญชีทรัพย์สินที่ตนรับรองว่าถูกต้องต่อศาลฉบับหนึ่งภายในสิบวันนับแต่วันที่ได้ทำบัญชีทรัพย์สินแล้ว และศาลจะสั่งให้ผู้ปกครองชี้แจงเพิ่มเติมหรือให้นำเอกสารมาประกอบเพื่อแสดงให้เห็นว่าบัญชีนั้นถูกต้องแล้วก็ได้\nถ้าศาลมิได้มีคำสั่งเป็นอย่างอื่นภายในสิบห้าวันนับแต่วันยื่นบัญชี หรือวันชี้แจงเพิ่มเติม หรือวันนำเอกสารยื่นประกอบ แล้วแต่กรณี ให้ถือว่าศาลยอมรับบัญชีนั้นแล้ว"],["1594","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๔ ถ้าผู้ปกครองไม่ปฏิบัติเกี่ยวแก่การทำบัญชีทรัพย์สินหรือการยื่นบัญชีทรัพย์สินให้ถูกต้องครบถ้วนตามที่บัญญัติไว้ในมาตรา ๑๕๙๒ หรือมาตรา ๑๕๙๓ หรือไม่ปฏิบัติตามคำสั่งศาลซึ่งสั่งตามมาตรา ๑๕๙๓ หรือศาลไม่พอใจในบัญชีทรัพย์สินเพราะทำขึ้นด้วยความเลินเล่ออย่างร้ายแรงหรือไม่สุจริต หรือเห็นได้ชัดว่าผู้ปกครองหย่อนความสามารถ ศาลจะสั่งถอนผู้ปกครองนั้นเสียก็ได้"],["1595","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๕ ก่อนที่ศาลยอมรับบัญชีนั้น ห้ามมิให้ผู้ปกครองทำกิจการใด เว้นแต่เป็นการเร่งร้อนและจำเป็น แต่จะยกข้อห้ามดังกล่าวขึ้นเป็นข้อต่อสู้บุคคลภายนอกผู้กระทำการโดยสุจริตและเสียค่าตอบแทนไม่ได้"],["1596","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๖ ถ้ามีหนี้เป็นคุณแก่ผู้ปกครองแต่เป็นโทษต่อผู้อยู่ในปกครองหรือเป็นคุณแก่ผู้อยู่ในปกครองแต่เป็นโทษต่อผู้ปกครอง ให้ผู้ปกครองแจ้งข้อความเหล่านั้นต่อศาลก่อนลงมือทำบัญชีทรัพย์สิน\nถ้าผู้ปกครองรู้ว่ามีหนี้เป็นคุณแก่ตนแต่เป็นโทษต่อผู้อยู่ในปกครอง และมิได้แจ้งข้อความนั้นต่อศาล หนี้ของผู้ปกครองนั้นย่อมสูญไป\nถ้าผู้ปกครองรู้ว่ามีหนี้เป็นโทษต่อตน แต่เป็นคุณแก่ผู้อยู่ในปกครอง และมิได้แจ้งข้อความนั้นต่อศาล ศาลจะสั่งถอนผู้ปกครองก็ได้"],["1597","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๗ เมื่อศาลเห็นสมควรโดยลำพัง หรือเมื่อผู้มีส่วนได้เสียหรืออัยการร้องขอ ศาลอาจสั่งให้ผู้ปกครอง\n(๑) หาประกันอันสมควรในการจัดการทรัพย์สินของผู้อยู่ในปกครอง ตลอดจนการมอบคืนทรัพย์สินนั้น\n(๒) แถลงถึงความเป็นอยู่แห่งทรัพย์สินของผู้อยู่ในปกครอง"],["1598","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘ ในระหว่างปกครอง ถ้าผู้อยู่ในปกครองได้ทรัพย์สินอันมีค่ามาโดยทางมรดกหรือการให้โดยเสน่หา ให้นำมาตรา ๑๕๙๒ ถึงมาตรา ๑๕๙๗ มาใช้บังคับโดยอนุโลม"],["1598/1","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๑ ให้ผู้ปกครองทำบัญชีทรัพย์สินส่งต่อศาลปีละครั้งนับแต่วันเป็นผู้ปกครอง แต่เมื่อศาลได้รับบัญชีปีแรกแล้วจะสั่งให้ส่งบัญชีเช่นว่านั้นในระยะเวลาเกินหนึ่งปีก็ได้"],["1598/2","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๒ ผู้ปกครองมีสิทธิและหน้าที่เช่นเดียวกับผู้ใช้อำนาจปกครองตามมาตรา ๑๕๖๔ วรรคหนึ่ง และมาตรา ๑๕๖๗"],["1598/3","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๓ ผู้ปกครองเป็นผู้แทนโดยชอบธรรมของผู้อยู่ในปกครอง\nให้นำมาตรา ๑๕๗๐ มาตรา ๑๕๗๑ มาตรา ๑๕๗๒ มาตรา ๑๕๗๔ มาตรา ๑๕๗๕ มาตรา ๑๕๗๖ และมาตรา ๑๕๗๗ มาใช้บังคับแก่ผู้ปกครองและผู้อยู่ในปกครองโดยอนุโลม"],["1598/4","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๔ เงินได้ของผู้อยู่ในปกครองนั้น ผู้ปกครองย่อมใช้ได้ตามสมควรเพื่อการอุปการะเลี้ยงดูและการศึกษาของผู้อยู่ในปกครอง ถ้ามีเหลือให้ใช้เพื่อแสวงหาผลประโยชน์เฉพาะในเรื่องต่อไปนี้\n(๑) ซื้อพันธบัตรรัฐบาลไทยหรือพันธบัตรที่รัฐบาลไทยค้ำประกัน\n(๒) รับขายฝากหรือรับจำนองอสังหาริมทรัพย์ในลำดับแรก แต่จำนวนเงินที่รับขายฝากหรือรับจำนองต้องไม่เกินกึ่งราคาตลาดของอสังหาริมทรัพย์นั้น\n(๓) ฝากประจำในธนาคารที่ได้ตั้งขึ้นโดยกฎหมายหรือที่ได้รับอนุญาตให้ประกอบกิจการในราชอาณาจักร\n(๔) ลงทุนอย่างอื่นซึ่งศาลอนุญาตเป็นพิเศษ"],["1598/5","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๕ ถ้าผู้อยู่ในปกครองรู้จักผิดชอบและมีอายุไม่ต่ำกว่าสิบห้าปีบริบูรณ์เมื่อผู้ปกครองจะทำกิจการใดที่สำคัญ ให้ปรึกษาหารือผู้อยู่ในปกครองก่อนเท่าที่จะทำได้\nการที่ผู้อยู่ในปกครองได้ยินยอมด้วยนั้นหาคุ้มผู้ปกครองให้พ้นจากความรับผิดไม่"],["1598/6","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๖ ความปกครองสิ้นสุดลงเมื่อผู้อยู่ในปกครองตายหรือบรรลุนิติภาวะ"],["1598/7","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๗ ความเป็นผู้ปกครองสิ้นสุดลงเมื่อผู้ปกครอง\n(๑) ตาย\n(๒) ลาออกโดยได้รับอนุญาตจากศาล\n(๓) เป็นคนไร้ความสามารถหรือเสมือนไร้ความสามารถ\n(๔) เป็นบุคคลล้มละลาย\n(๕) ถูกถอนโดยคำสั่งศาล"],["1598/8","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๘ ให้ศาลสั่งถอนผู้ปกครองในกรณี ดังต่อไปนี้\n(๑) ผู้ปกครองละเลยไม่กระทำการตามหน้าที่\n(๒) ผู้ปกครองประมาทเลินเล่ออย่างร้ายแรงในหน้าที่\n(๓) ผู้ปกครองใช้อำนาจหน้าที่โดยมิชอบ\n(๔) ผู้ปกครองประพฤติมิชอบซึ่งไม่สมควรแก่หน้าที่\n(๕) ผู้ปกครองหย่อนความสามารถในหน้าที่จนน่าจะเป็นอันตรายแก่ประโยชน์ของผู้อยู่ในปกครอง\n(๖) มีกรณีดังบัญญัติไว้ในมาตรา ๑๕๘๗ (๓) (๔) หรือ (๕)"],["1598/9","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๙ การร้องขอให้ถอนผู้ปกครองตามมาตรา ๑๕๙๘/๘ นั้น ผู้อยู่ในปกครองซึ่งมีอายุไม่ต่ำกว่าสิบห้าปีบริบูรณ์ หรือญาติของผู้อยู่ในปกครองหรืออัยการจะเป็นผู้ร้องขอก็ได้"],["1598/10","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๑๐ ในระหว่างพิจารณาคำร้องขอให้ถอนผู้ปกครอง ศาลจะตั้งผู้จัดการชั่วคราวให้จัดการทรัพย์สินของผู้อยู่ในปกครองแทนผู้ปกครองก็ได้"],["1598/11","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๑๑ ถ้าความปกครองหรือความเป็นผู้ปกครองสิ้นสุดลง ให้ผู้ปกครองหรือทายาทรีบส่งมอบทรัพย์สินที่จัดการแก่ผู้อยู่ในปกครอง หรือทายาทหรือผู้ปกครองคนใหม่ และให้ทำบัญชีในการจัดการทรัพย์สินส่งมอบภายในเวลาหกเดือน และถ้ามีเอกสารเกี่ยวกับเรื่องจัดการทรัพย์สินนั้นก็ให้ส่งมอบพร้อมกับบัญชี แต่เมื่อผู้ปกครองหรือทายาทร้องขอศาลจะสั่งให้ยืดเวลาก็ได้\nให้นำมาตรา ๑๕๘๐ และมาตรา ๑๕๘๑ มาใช้บังคับโดยอนุโลม"],["1598/12","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๑๒ นับแต่วันส่งมอบบัญชี ให้เริ่มคิดดอกเบี้ยในจำนวนเงินซึ่งผู้ปกครองหรือผู้อยู่ในปกครองจะต้องคืนให้แก่กัน\nถ้าผู้ปกครองใช้เงินของผู้อยู่ในปกครองนอกจากเพื่อประโยชน์ของผู้อยู่ในปกครองแล้ว ให้เสียดอกเบี้ยร้อยละสิบห้าต่อปีในจำนวนเงินนั้นตั้งแต่วันใช้เป็นต้นไป"],["1598/13","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๑๓ ผู้อยู่ในปกครองมีบุริมสิทธิเหนือทรัพย์สินทั้งหมดของผู้ปกครองเพื่อชำระหนี้ซึ่งค้างอยู่แก่ตน\nบุริมสิทธินี้ให้อยู่ในลำดับที่หกถัดจากบุริมสิทธิสามัญอย่างอื่นตามมาตรา ๒๕๓ แห่งประมวลกฎหมายนี้"],["1598/14","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๑๔ ผู้ปกครองไม่มีสิทธิได้รับบำเหน็จ เว้นแต่ในกรณีต่อไปนี้\n(๑) มีข้อกำหนดไว้ในพินัยกรรมให้ผู้ปกครองได้รับบำเหน็จ ในกรณีเช่นว่านี้ ให้ผู้ปกครองได้รับบำเหน็จเท่าที่กำหนดในพินัยกรรม\n(๒) ในกรณีที่พินัยกรรมไม่ได้กำหนดบำเหน็จไว้ แต่ไม่มีข้อกำหนดห้ามผู้ปกครองรับบำเหน็จ ผู้ปกครองจะร้องขอต่อศาลให้กำหนดบำเหน็จในภายหลังก็ได้ ศาลจะกำหนดให้หรือไม่เพียงใดก็ได้\n(๓) ในกรณีที่ไม่มีคำสั่งตั้งผู้ปกครองไว้ในพินัยกรรม และไม่มีข้อกำหนดห้ามผู้ปกครองรับบำเหน็จ ศาลจะกำหนดบำเหน็จให้แก่ผู้ปกครองในคำสั่งตั้งผู้ปกครองก็ได้ หรือถ้าศาลมิได้กำหนด ผู้ปกครองจะร้องขอต่อศาลให้กำหนดบำเหน็จในภายหลังก็ได้ ศาลจะกำหนดให้หรือไม่เพียงใดก็ได้\nในการพิจารณากำหนดบำเหน็จ ให้ศาลพิเคราะห์ถึงพฤติการณ์ รายได้และฐานะความเป็นอยู่ของผู้ปกครองและผู้อยู่ในปกครอง\nถ้าผู้ปกครองหรือผู้อยู่ในปกครองแสดงได้ว่า พฤติการณ์รายได้หรือฐานะความเป็นอยู่ของผู้ปกครองหรือผู้อยู่ในปกครองได้เปลี่ยนแปลงไปภายหลังที่ได้เข้ารับหน้าที่ผู้ปกครอง ศาลจะสั่งให้บำเหน็จ งด ลด เพิ่ม หรือกลับให้บำเหน็จแก่ผู้ปกครองอีกก็ได้ แล้วแต่กรณี ทั้งนี้ ให้ใช้บังคับแก่กรณีที่มีข้อกำหนดห้ามไว้ในพินัยกรรมมิให้ผู้ปกครองได้รับบำเหน็จด้วย"],["1598/15","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๑๕ ในกรณีที่ศาลสั่งให้คู่สมรสฝ่ายใดฝ่ายหนึ่งเป็นคนไร้ความสามารถและคู่สมรสอีกฝ่ายเป็นผู้อนุบาล ให้นำบทบัญญัติว่าด้วยสิทธิและหน้าที่ของผู้ใช้อำนาจปกครองมาใช้บังคับโดยอนุโลม เว้นแต่สิทธิตามมาตรา ๑๕๖๗ (๒) และ (๓)"],["1598/16","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๑๖ คู่สมรสซึ่งเป็นผู้อนุบาลของคู่สมรสที่ถูกศาลสั่งให้เป็นคนไร้ความสามารถมีอำนาจจัดการสินส่วนตัวของคู่สมรสอีกฝ่ายหนึ่งและมีอำนาจจัดการสินสมรสแต่ผู้เดียว แต่การจัดการสินส่วนตัวและสินสมรสตามกรณีที่ระบุไว้ในมาตรา ๑๔๗๖ วรรคหนึ่ง คู่สมรสนั้นจะจัดการไม่ได้ เว้นแต่จะได้รับอนุญาตจากศาล"],["1598/17","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๑๗ ในกรณีที่ศาลสั่งให้คู่สมรสฝ่ายใดฝ่ายหนึ่งเป็นคนไร้ความสามารถและศาลเห็นไม่สมควรให้คู่สมรสอีกฝ่ายเป็นผู้อนุบาล และตั้งบิดาหรือมารดาหรือบุคคลภายนอกเป็นผู้อนุบาล ในกรณีเช่นว่านี้ ให้ผู้อนุบาลเป็นผู้จัดการสินสมรสร่วมกันกับคู่สมรสอีกฝ่ายหนึ่ง เว้นแต่ถ้ามีเหตุสำคัญอันจะเกิดความเสียหายแก่คนไร้ความสามารถ ศาลจะสั่งเป็นอย่างอื่นก็ได้\nอย่างไรก็ตาม เมื่อมีกรณีดังกล่าวตามวรรคหนึ่ง คู่สมรสอีกฝ่ายหนึ่งมีสิทธิร้องขอต่อศาลให้สั่งแยกสินสมรสได้"],["1598/18","b5t2","หมวด ๓ ความปกครอง","","มาตรา ๑๕๙๘/๑๘ ในกรณีที่บิดามารดาเป็นผู้อนุบาลบุตร ถ้าบุตรนั้นยังไม่บรรลุนิติภาวะ ให้นำบทบัญญัติว่าด้วยสิทธิและหน้าที่ของผู้ใช้อำนาจปกครองมาใช้บังคับโดยอนุโลม แต่ถ้าบุตรนั้นบรรลุนิติภาวะแล้ว ให้นำบทบัญญัติว่าด้วยสิทธิและหน้าที่ของผู้ปกครองมาใช้บังคับโดยอนุโลม เว้นแต่สิทธิตามมาตรา ๑๕๖๗ (๒) และ (๓)\nในกรณีที่บุคคลอื่นซึ่งมิใช่บิดามารดาหรือมิใช่คู่สมรสเป็นผู้อนุบาล ให้นำบทบัญญัติว่าด้วยสิทธิและหน้าที่ของผู้ปกครองมาใช้บังคับโดยอนุโลม แต่ถ้าผู้อยู่ในความอนุบาลบรรลุนิติภาวะแล้วจะใช้สิทธิตามมาตรา ๑๕๖๗ (๒) และ (๓) ไม่ได้"],["1598/19","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๑๙ บุคคลที่มีอายุไม่ต่ำกว่ายี่สิบห้าปีจะรับบุคคลอื่นเป็นบุตรบุญธรรมก็ได้ แต่ผู้นั้นต้องมีอายุแก่กว่าผู้ที่จะเป็นบุตรบุญธรรมอย่างน้อยสิบห้าปี"],["1598/20","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๒๐ การรับบุตรบุญธรรม ถ้าผู้ที่จะเป็นบุตรบุญธรรมมีอายุไม่ต่ำกว่าสิบห้าปี ผู้นั้นต้องให้ความยินยอมด้วย"],["1598/21","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๒๑ การรับผู้เยาว์เป็นบุตรบุญธรรมจะกระทำได้ต่อเมื่อได้รับความยินยอมของบิดาและมารดาของผู้จะเป็นบุตรบุญธรรม ในกรณีที่บิดาหรือมารดาคนใดคนหนึ่งตายหรือถูกถอนอำนาจปกครองต้องได้รับความยินยอมของมารดาหรือบิดาซึ่งยังมีอำนาจปกครอง\nถ้าไม่มีผู้มีอำนาจให้ความยินยอมดังกล่าวในวรรคหนึ่ง หรือมีแต่บิดาหรือมารดาคนใดคนหนึ่งหรือทั้งสองคนไม่สามารถแสดงเจตนาให้ความยินยอมได้หรือไม่ให้ความยินยอมและการไม่ให้ความยินยอมนั้นปราศจากเหตุผลอันสมควรและเป็นปฏิปักษ์ต่อสุขภาพความเจริญหรือสวัสดิภาพของผู้เยาว์ มารดาหรือบิดาหรือผู้ประสงค์จะขอรับบุตรบุญธรรมหรืออัยการจะร้องขอต่อศาลให้มีคำสั่งอนุญาตแทนการให้ความยินยอมตามวรรคหนึ่งก็ได้"],["1598/22","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๒๒ ในการรับผู้เยาว์เป็นบุตรบุญธรรม ถ้าผู้เยาว์เป็นผู้ถูกทอดทิ้งและอยู่ในความดูแลของสถานสงเคราะห์เด็กตามกฎหมายว่าด้วยการสงเคราะห์และคุ้มครองเด็ก ให้สถานสงเคราะห์เด็กเป็นผู้ให้ความยินยอมแทนบิดาและมารดา ถ้าสถานสงเคราะห์เด็กไม่ให้ความยินยอม ให้นำความในมาตรา ๑๕๙๘/๒๑ วรรคสอง มาใช้บังคับโดยอนุโลม"],["1598/23","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๒๓ ในกรณีที่ผู้เยาว์มิได้ถูกทอดทิ้งแต่อยู่ในความอุปการะเลี้ยงดูของสถานสงเคราะห์เด็กตามกฎหมายว่าด้วยการสงเคราะห์และคุ้มครองเด็กบิดาและมารดา หรือบิดาหรือมารดาในกรณีที่มารดาหรือบิดาคนใดคนหนึ่งตายหรือถูกถอนอำนาจปกครอง จะทำหนังสือมอบอำนาจให้สถานสงเคราะห์เด็กดังกล่าวเป็นผู้มีอำนาจให้ความยินยอมในการรับผู้เยาว์เป็นบุตรบุญธรรมแทนตนก็ได้ ในกรณีเช่นนั้นให้นำความในมาตรา ๑๕๙๘/๒๒ มาใช้บังคับโดยอนุโลม\nหนังสือมอบอำนาจตามวรรคหนึ่งจะถอนเสียมิได้ตราบเท่าที่ผู้เยาว์ยังอยู่ในความอุปการะเลี้ยงดูของสถานสงเคราะห์เด็กนั้น"],["1598/24","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๒๔ ผู้มีอำนาจให้ความยินยอมแทนสถานสงเคราะห์เด็กในการรับบุตรบุญธรรมตามมาตรา ๑๕๙๘/๒๒ หรือมาตรา ๑๕๙๘/๒๓ จะรับผู้เยาว์ซึ่งอยู่ในความดูแลหรืออยู่ในความอุปการะเลี้ยงดูของสถานสงเคราะห์เด็กนั้นเป็นบุตรบุญธรรมของตนเองได้ต่อเมื่อศาลได้มีคำสั่งอนุญาตตามคำขอของผู้นั้นแทนการให้ความยินยอมของสถานสงเคราะห์เด็ก"],["1598/25","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๒๕ ผู้จะรับบุตรบุญธรรมหรือผู้จะเป็นบุตรบุญธรรม ถ้ามีคู่สมรสอยู่ต้องได้รับความยินยอมจากคู่สมรสก่อน ในกรณีที่คู่สมรสไม่อาจให้ความยินยอมได้หรือไปเสียจากภูมิลำเนาหรือถิ่นที่อยู่และหาตัวไม่พบเป็นเวลาไม่น้อยกว่าหนึ่งปี ต้องร้องขอต่อศาลให้มีคำสั่งอนุญาตแทนการให้ความยินยอมของคู่สมรสนั้น"],["1598/26","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๒๖ ผู้เยาว์ที่เป็นบุตรบุญธรรมของบุคคลใดอยู่จะเป็นบุตรบุญธรรมของบุคคลอื่นอีกในขณะเดียวกันไม่ได้ เว้นแต่เป็นบุตรบุญธรรมของคู่สมรสของผู้รับบุตรบุญธรรม\nถ้าคู่สมรสฝ่ายหนึ่งจะจดทะเบียนรับผู้เยาว์ซึ่งเป็นบุตรบุญธรรมของคู่สมรสอีกฝ่ายหนึ่งเป็นบุตรบุญธรรมของตนด้วยจะต้องได้รับความยินยอมของคู่สมรสซึ่งเป็นผู้รับบุตรบุญธรรมอยู่แล้ว และมิให้นำมาตรา ๑๕๙๘/๒๑ มาใช้บังคับ"],["1598/27","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๒๗ การรับบุตรบุญธรรมจะสมบูรณ์ต่อเมื่อได้จดทะเบียนตามกฎหมาย แต่ถ้าผู้จะเป็นบุตรบุญธรรมนั้นเป็นผู้เยาว์ต้องปฏิบัติตามกฎหมายว่าด้วยการรับเด็กเป็นบุตรบุญธรรมก่อน"],["1598/28","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๒๘ บุตรบุญธรรมย่อมมีฐานะอย่างเดียวกับบุตรชอบด้วยกฎหมายของผู้รับบุตรบุญธรรมนั้น แต่ไม่สูญสิทธิและหน้าที่ในครอบครัวที่ได้กำเนิดมา ในกรณีเช่นนี้ ให้บิดามารดาโดยกำเนิดหมดอำนาจปกครองนับแต่วันเวลาที่เด็กเป็นบุตรบุญธรรมแล้ว\nให้นำบทบัญญัติในลักษณะ ๒ หมวด ๒ แห่งบรรพนี้มาใช้บังคับโดยอนุโลม"],["1598/29","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๒๙ การรับบุตรบุญธรรมไม่ก่อให้เกิดสิทธิรับมรดกของบุตรบุญธรรมในฐานะทายาทโดยธรรมเพราะเหตุการรับบุตรบุญธรรมนั้น"],["1598/30","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๓๐ ถ้าบุตรบุญธรรมซึ่งไม่มีคู่สมรสหรือผู้สืบสันดานตายก่อนผู้รับบุตรบุญธรรม ผู้รับบุตรบุญธรรมมีสิทธิเรียกร้องเอาทรัพย์สินที่ตนได้ให้แก่บุตรบุญธรรมคืนจากกองมรดกของบุตรบุญธรรมเพียงเท่าที่ทรัพย์สินนั้นยังคงเหลืออยู่ภายหลังที่ชำระหนี้ของกองมรดกเสร็จสิ้นแล้ว\nห้ามมิให้ฟ้องคดีเรียกร้องสิทธิตามวรรคหนึ่ง เมื่อพ้นกำหนดหนึ่งปีนับแต่เวลาที่ผู้รับบุตรบุญธรรมได้รู้หรือควรได้รู้ถึงความตายของบุตรบุญธรรมหรือเมื่อพ้นกำหนดสิบปี นับแต่วันที่บุตรบุญธรรมตาย"],["1598/31","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๓๑ การเลิกรับบุตรบุญธรรม ถ้าบุตรบุญธรรมบรรลุนิติภาวะแล้วจะเลิกโดยความตกลงกันในระหว่างผู้รับบุตรบุญธรรมกับบุตรบุญธรรมเมื่อใดก็ได้\nถ้าบุตรบุญธรรมยังไม่บรรลุนิติภาวะ การเลิกรับบุตรบุญธรรมจะทำได้ต่อเมื่อได้รับความยินยอมของบิดาและมารดา และให้นำมาตรา ๑๕๙๘/๒๐ และมาตรา ๑๕๙๘/๒๑ มาใช้บังคับโดยอนุโลม\nในกรณีที่ได้รับผู้เยาว์เป็นบุตรบุญธรรมตามมาตรา ๑๕๙๘/๒๑ วรรคสอง มาตรา ๑๕๙๘/๒๒ มาตรา ๑๕๙๘/๒๓ มาตรา ๑๕๙๘/๒๔ หรือมาตรา ๑๕๙๘/๒๖ วรรคสอง ถ้าบุตรบุญธรรมยังไม่บรรลุนิติภาวะ การเลิกรับบุตรบุญธรรมให้กระทำได้ต่อเมื่อมีคำสั่งศาลโดยคำร้องขอของผู้มีส่วนได้เสียหรืออัยการ\nการเลิกรับบุตรบุญธรรมจะสมบูรณ์ต่อเมื่อได้จดทะเบียนตามกฎหมาย"],["1598/32","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๓๒ การรับบุตรบุญธรรมย่อมเป็นอันยกเลิก เมื่อมีการสมรสฝ่าฝืนมาตรา ๑๔๕๑"],["1598/33","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๓๓ คดีฟ้องเลิกการรับบุตรบุญธรรมนั้นเมื่อ\n(๑) ฝ่ายหนึ่งทำการชั่วร้ายไม่ว่าจะเป็นความผิดอาญาหรือไม่ เป็นเหตุให้อีกฝ่ายหนึ่งอับอายขายหน้าอย่างร้ายแรง หรือถูกเกลียดชัง หรือได้รับความเสียหายหรือเดือดร้อนเกินควร อีกฝ่ายหนึ่งฟ้องเลิกได้\n(๒) ฝ่ายหนึ่งหมิ่นประมาทหรือเหยียดหยามอีกฝ่ายหนึ่งหรือบุพการีของอีกฝ่ายหนึ่งอันเป็นการร้ายแรง อีกฝ่ายหนึ่งฟ้องเลิกได้ ถ้าบุตรบุญธรรมกระทำการดังกล่าวต่อคู่สมรสของผู้รับบุตรบุญธรรม ให้ผู้รับบุตรบุญธรรมฟ้องเลิกได้\n(๓) ฝ่ายหนึ่งกระทำการประทุษร้ายอีกฝ่ายหนึ่งหรือบุพการีหรือคู่สมรสของอีกฝ่ายหนึ่งเป็นเหตุให้เกิดอันตรายแก่กายหรือจิตใจอย่างร้ายแรงและการกระทำนั้นเป็นความผิดที่มีโทษอาญา อีกฝ่ายหนึ่งฟ้องเลิกได้\n(๔) ฝ่ายหนึ่งไม่อุปการะเลี้ยงดูอีกฝ่ายหนึ่ง อีกฝ่ายหนึ่งนั้นฟ้องเลิกได้\n(๕) ฝ่ายหนึ่งจงใจละทิ้งอีกฝ่ายหนึ่งไปเกินหนึ่งปี อีกฝ่ายหนึ่งนั้นฟ้องเลิกได้\n(๖) ฝ่ายหนึ่งต้องคำพิพากษาถึงที่สุดให้จำคุกเกินสามปี เว้นแต่ความผิดที่กระทำโดยประมาท อีกฝ่ายหนึ่งฟ้องเลิกได้\n(๗) ผู้รับบุตรบุญธรรมทำผิดหน้าที่บิดามารดา และการกระทำนั้นเป็นการละเมิดหรือไม่ปฏิบัติตามมาตรา ๑๕๖๔ มาตรา ๑๕๗๑ มาตรา ๑๕๗๓ มาตรา ๑๕๗๔ หรือมาตรา ๑๕๗๕ เป็นเหตุให้เกิดหรืออาจเกิดความเสียหายอย่างร้ายแรงต่อบุตรบุญธรรม บุตรบุญธรรมฟ้องเลิกได้\n(๘) ผู้รับบุตรบุญธรรมผู้ใดถูกถอนอำนาจปกครองบางส่วนหรือทั้งหมด และเหตุที่ถูกถอนอำนาจปกครองนั้นมีพฤติการณ์แสดงให้เห็นว่า ผู้นั้นไม่สมควรเป็นผู้รับบุตรบุญธรรมต่อไป บุตรบุญธรรมฟ้องเลิกได้\n(๙) (ยกเลิก)"],["1598/34","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๓๔ ห้ามมิให้ฟ้องขอเลิกการรับบุตรบุญธรรมเมื่อพ้นกำหนดหนึ่งปีนับแต่วันที่ผู้ขอเลิกการรับบุตรบุญธรรมรู้หรือควรได้รู้ข้อเท็จจริงอันเป็นเหตุให้เลิกการนั้น หรือเมื่อพ้นกำหนดสิบปีนับแต่เหตุนั้นเกิดขึ้น"],["1598/35","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๓๕ การฟ้องเลิกการรับบุตรบุญธรรม ถ้าบุตรบุญธรรมมีอายุไม่ครบสิบห้าปีบริบูรณ์ให้บิดามารดาโดยกำเนิดเป็นผู้มีอำนาจฟ้องแทน แต่ถ้าบุตรบุญธรรมมีอายุสิบห้าปีบริบูรณ์แล้วบุตรบุญธรรมฟ้องได้โดยไม่ต้องได้รับความยินยอมจากผู้ใด\nในกรณีตามวรรคหนึ่ง อัยการจะฟ้องคดีแทนบุตรบุญธรรมก็ได้"],["1598/36","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๓๖ การเลิกรับบุตรบุญธรรมโดยคำพิพากษาของศาล ย่อมมีผลแต่เวลาที่คำพิพากษาถึงที่สุด แต่จะอ้างเป็นเหตุเสื่อมสิทธิของบุคคลภายนอกผู้ทำการโดยสุจริตไม่ได้ เว้นแต่ได้จดทะเบียนแล้ว"],["1598/37","b5t2","หมวด ๔ บุตรบุญธรรม","","มาตรา ๑๕๙๘/๓๗ เมื่อผู้รับบุตรบุญธรรมตายหรือมีการเลิกรับบุตรบุญธรรม ถ้าบุตรบุญธรรมยังไม่บรรลุนิติภาวะ ให้บิดามารดาโดยกำเนิดกลับมีอำนาจปกครองนับแต่เวลาที่ผู้รับบุตรบุญธรรมตายหรือนับแต่เวลาที่จดทะเบียนเลิกการรับบุตรบุญธรรมตามมาตรา ๑๕๙๘/๓๑ หรือนับแต่เวลาที่ศาลมีคำพิพากษาถึงที่สุดให้เลิกการรับบุตรบุญธรรม เว้นแต่ศาลเห็นสมควรสั่งเป็นประการอื่น\nในกรณีที่มีการตั้งผู้ปกครองของผู้เป็นบุตรบุญธรรมไว้ก่อนผู้รับบุตรบุญธรรมตาย หรือก่อนการเลิกรับบุตรบุญธรรม ให้ผู้ปกครองยังคงมีอำนาจหน้าที่เช่นเดิมต่อไป เว้นแต่บิดามารดาโดยกำเนิดจะร้องขอ และศาลมีคำสั่งให้ผู้ร้องขอเป็นผู้มีอำนาจปกครอง\nการเปลี่ยนผู้ใช้อำนาจปกครองตามวรรคหนึ่งหรือผู้ปกครองตามวรรคสองไม่เป็นเหตุเสื่อมสิทธิที่บุคคลภายนอกได้มาโดยสุจริตก่อนผู้รับบุตรบุญธรรมตายหรือก่อนจดทะเบียนเลิกการรับบุตรบุญธรรม\nให้พนักงานอัยการเป็นผู้มีอำนาจร้องขอเพื่อให้ศาลมีคำสั่งเป็นประการอื่นตามวรรคหนึ่ง"],["1598/38","b5t3","","","มาตรา ๑๕๙๘/๓๘ ค่าอุปการะเลี้ยงดูระหว่างคู่สมรส หรือระหว่างบิดามารดากับบุตรนั้น ย่อมเรียกจากกันได้ในเมื่อฝ่ายที่ควรได้รับอุปการะเลี้ยงดูไม่ได้รับการอุปการะเลี้ยงดูหรือได้รับการอุปการะเลี้ยงดูไม่เพียงพอแก่อัตภาพ ค่าอุปการะเลี้ยงดูนี้ศาลอาจให้เพียงใดหรือไม่ให้ก็ได้ โดยคำนึงถึงความสามารถของผู้มีหน้าที่ต้องให้ ฐานะของผู้รับและพฤติการณ์แห่งกรณี"],["1598/39","b5t3","","","มาตรา ๑๕๙๘/๓๙ เมื่อผู้มีส่วนได้เสียแสดงว่าพฤติการณ์รายได้ หรือฐานะของคู่กรณีได้เปลี่ยนแปลงไป ศาลจะสั่งแก้ไขในเรื่องค่าอุปการะเลี้ยงดูโดยให้เพิกถอน ลด เพิ่ม หรือกลับให้ค่าอุปการะเลี้ยงดูอีกก็ได้\nในกรณีที่ศาลไม่พิพากษาให้ค่าอุปการะเลี้ยงดู เพราะเหตุแต่เพียงอีกฝ่ายหนึ่งไม่อยู่ในฐานะที่จะให้ค่าอุปการะเลี้ยงดูได้ในขณะนั้น หากพฤติการณ์ รายได้ หรือฐานะของอีกฝ่ายหนึ่งนั้นได้เปลี่ยนแปลงไป และพฤติการณ์รายได้หรือฐานะของผู้เรียกร้องอยู่ในสภาพที่ควรได้รับค่าอุปการะเลี้ยงดู ผู้เรียกร้องอาจร้องขอให้ศาลเปลี่ยนแปลงคำสั่งในคดีนั้นใหม่ได้"],["1598/40","b5t3","","","มาตรา ๑๕๙๘/๔๐ ค่าอุปการะเลี้ยงดูนั้นให้ชำระเป็นเงิน โดยวิธีชำระเป็นครั้งคราวตามกำหนด เว้นแต่คู่กรณีจะตกลงกันให้ชำระเป็นอย่างอื่นหรือโดยวิธีอื่น ถ้าไม่มีการตกลงกันและมีเหตุพิเศษ เมื่อฝ่ายใดฝ่ายหนึ่งร้องขอและศาลเห็นสมควร จะกำหนดให้ค่าอุปการะเลี้ยงดูเป็นอย่างอื่นหรือโดยวิธีอื่น โดยจะให้ชำระเป็นเงินด้วยหรือไม่ก็ได้\nในกรณีขอค่าอุปการะเลี้ยงดูบุตร เมื่อมีเหตุพิเศษและศาลเห็นเป็นการสมควรเพื่อประโยชน์แก่บุตร จะกำหนดให้บุตรได้รับการอุปการะเลี้ยงดูโดยประการใด ๆ นอกจากที่คู่กรณีตกลงกัน หรือนอกจากที่ฝ่ายใดฝ่ายหนึ่งร้องขอก็ได้ เช่นให้ไปอยู่ในสถานการศึกษาหรือวิชาชีพ โดยให้ผู้ที่มีหน้าที่ต้องชำระค่าอุปการะเลี้ยงดูออกค่าใช้จ่ายในการนี้"],["1598/41","b5t3","","","มาตรา ๑๕๙๘/๔๑ สิทธิที่จะได้ค่าอุปการะเลี้ยงดูนั้น จะสละหรือโอนมิได้และไม่อยู่ในข่ายแห่งการบังคับคดี"],["1599","b6t1","หมวด ๑ การตกทอดแห่งทรัพย์มรดก","","มาตรา ๑๕๙๙ เมื่อบุคคลใดตาย มรดกของบุคคลนั้นตกทอดแก่ทายาท\nทายาทอาจเสียไปซึ่งสิทธิในมรดกได้แต่โดยบทบัญญัติแห่งประมวลกฎหมายนี้หรือกฎหมายอื่น"],["1600","b6t1","หมวด ๑ การตกทอดแห่งทรัพย์มรดก","","มาตรา ๑๖๐๐ ภายใต้บังคับของบทบัญญัติแห่งประมวลกฎหมายนี้ กองมรดกของผู้ตายได้แก่ทรัพย์สินทุกชนิดของผู้ตาย ตลอดทั้งสิทธิหน้าที่และความรับผิดต่าง ๆ เว้นแต่ตามกฎหมายหรือว่าโดยสภาพแล้ว เป็นการเฉพาะตัวของผู้ตายโดยแท้"],["1601","b6t1","หมวด ๑ การตกทอดแห่งทรัพย์มรดก","","มาตรา ๑๖๐๑ ทายาทไม่จำต้องรับผิดเกินกว่าทรัพย์มรดกที่ตกทอดได้แก่ตน"],["1602","b6t1","หมวด ๑ การตกทอดแห่งทรัพย์มรดก","","มาตรา ๑๖๐๒ เมื่อบุคคลใดต้องถือว่าถึงแก่ความตายตามความในมาตรา ๖๒ แห่งประมวลกฎหมายนี้ มรดกของบุคคลนั้นตกทอดแก่ทายาท\nถ้าพิสูจน์ได้ว่าบุคคลนั้นยังคงมีชีวิตอยู่ หรือตายในเวลาอื่นผิดไปจากเวลาดังระบุไว้ในคำสั่งที่สั่งให้เป็นคนสาบสูญ ให้ใช้บทบัญญัติมาตรา ๖๓ แห่งประมวลกฎหมายนี้บังคับแก่ทายาทของบุคคลนั้น"],["1603","b6t1","หมวด ๑ การตกทอดแห่งทรัพย์มรดก","","มาตรา ๑๖๐๓ กองมรดกย่อมตกทอดแก่ทายาทโดยสิทธิตามกฎหมายหรือโดยพินัยกรรม\nทายาทที่มีสิทธิตามกฎหมาย เรียกว่า “ทายาทโดยธรรม”\nทายาทที่มีสิทธิตามพินัยกรรม เรียกว่า “ผู้รับพินัยกรรม”"],["1604","b6t1","หมวด ๒ การเป็นทายาท","","มาตรา ๑๖๐๔ บุคคลธรรมดาจะเป็นทายาทได้ก็ต่อเมื่อมีสภาพบุคคลหรือสามารถมีสิทธิได้ตามมาตรา ๑๕ แห่งประมวลกฎหมายนี้ ในเวลาที่เจ้ามรดกถึงแก่ความตาย\nเพื่อประโยชน์แห่งมาตรานี้ ให้ถือว่าเด็กที่เกิดมารอดอยู่ภายในสามร้อยสิบวันนับแต่เวลาที่เจ้ามรดกถึงแก่ความตายนั้น เป็นทารกในครรภ์มารดาอยู่ในเวลาที่เจ้ามรดกถึงแก่ความตาย"],["1605","b6t1","หมวด ๒ การเป็นทายาท","","มาตรา ๑๖๐๕ ทายาทคนใดยักย้าย หรือปิดบังทรัพย์มรดกเท่าส่วนที่ตนจะได้หรือมากกว่านั้นโดยฉ้อฉลหรือรู้อยู่ว่า ตนทำให้เสื่อมประโยชน์ของทายาทคนอื่น ทายาทคนนั้นต้องถูกกำจัดมิให้ได้มรดกเลย แต่ถ้าได้ยักย้ายหรือปิดบังทรัพย์มรดกน้อยกว่าส่วนที่ตนจะได้ ทายาทคนนั้นต้องถูกกำจัดมิให้ได้มรดกเฉพาะส่วนที่ได้ยักย้ายหรือปิดบังไว้นั้น\nมาตรานี้มิให้ใช้บังคับแก่ผู้รับพินัยกรรม ซึ่งผู้ตายได้ทำพินัยกรรมยกทรัพย์สินให้เฉพาะสิ่งเฉพาะอย่าง ในอันที่จะได้รับทรัพย์สินนั้น"],["1606","b6t1","หมวด ๒ การเป็นทายาท","","มาตรา ๑๖๐๖ บุคคลดังต่อไปนี้ต้องถูกกำจัดมิให้รับมรดกฐานเป็นผู้ไม่สมควร คือ\n(๑) ผู้ที่ต้องคำพิพากษาถึงที่สุดว่าได้เจตนากระทำ หรือพยายามกระทำให้เจ้ามรดกหรือผู้มีสิทธิได้รับมรดกก่อนตนถึงแก่ความตายโดยมิชอบด้วยกฎหมาย\n(๒) ผู้ที่ได้ฟ้องเจ้ามรดกหาว่าทำความผิดโทษประหารชีวิตและตนเองกลับต้องคำพิพากษาถึงที่สุดว่า มีความผิดฐานฟ้องเท็จหรือทำพยานเท็จ\n(๓) ผู้ที่รู้แล้วว่า เจ้ามรดกถูกฆ่าโดยเจตนา แต่มิได้นำข้อความนั้นขึ้นร้องเรียนเพื่อเป็นทางที่จะเอาตัวผู้กระทำผิดมาลงโทษ แต่ข้อนี้มิให้ใช้บังคับถ้าบุคคลนั้นมีอายุยังไม่ครบสิบหกปีบริบูรณ์ หรือเป็นคนวิกลจริตไม่สามารถรู้ผิดชอบ หรือถ้าผู้ที่ฆ่านั้นเป็นคู่สมรสหรือผู้บุพการีหรือผู้สืบสันดานของตนโดยตรง\n(๔) ผู้ที่ฉ้อฉลหรือข่มขู่ให้เจ้ามรดกทำ หรือเพิกถอนหรือเปลี่ยนแปลงพินัยกรรมแต่บางส่วนหรือทั้งหมดซึ่งเกี่ยวกับทรัพย์มรดก หรือไม่ให้กระทำการดังกล่าวนั้น\n(๕) ผู้ที่ปลอม ทำลาย หรือปิดบังพินัยกรรมแต่บางส่วนหรือทั้งหมด\nเจ้ามรดกอาจถอนข้อกำจัดฐานเป็นผู้ไม่สมควรเสียก็ได้โดยให้อภัยไว้เป็นลายลักษณ์อักษร"],["1607","b6t1","หมวด ๒ การเป็นทายาท","","มาตรา ๑๖๐๗ การถูกกำจัดมิให้รับมรดกนั้นเป็นการเฉพาะตัว ผู้สืบสันดานของทายาทที่ถูกกำจัดสืบมรดกต่อไปเหมือนหนึ่งว่าทายาทนั้นตายแล้ว แต่ในส่วนทรัพย์สินซึ่งผู้สืบสันดานได้รับมรดกมาเช่นนี้ ทายาทที่ว่านั้นไม่มีสิทธิที่จะจัดการและใช้ดังที่ระบุไว้ในบรรพ ๕ ลักษณะ ๒ หมวด ๓ แห่งประมวลกฎหมายนี้ ในกรณีเช่นนั้นให้ใช้มาตรา ๑๕๔๘ บังคับโดยอนุโลม"],["1608","b6t1","หมวด ๓ การตัดมิให้รับมรดก","","มาตรา ๑๖๐๘ เจ้ามรดกจะตัดทายาทโดยธรรมของตนคนใดมิให้รับมรดกก็ได้แต่ด้วยแสดงเจตนาชัดแจ้ง\n(๑) โดยพินัยกรรม\n(๒) โดยทำเป็นหนังสือมอบไว้แก่พนักงานเจ้าหน้าที่\nตัวทายาทผู้ถูกตัดมิให้รับมรดกนั้นต้องระบุไว้ให้ชัดเจน\nแต่เมื่อบุคคลใดได้ทำพินัยกรรมจำหน่ายทรัพย์มรดกเสียทั้งหมดแล้ว ให้ถือว่าบรรดาทายาทโดยธรรมผู้ที่มิได้รับประโยชน์จากพินัยกรรม เป็นผู้ถูกตัดมิให้รับมรดก"],["1609","b6t1","หมวด ๓ การตัดมิให้รับมรดก","","มาตรา ๑๖๐๙ การแสดงเจตนาตัดมิให้รับมรดกนั้นจะถอนเสียก็ได้\nถ้าการตัดมิให้รับมรดกนั้นได้ทำโดยพินัยกรรม จะถอนเสียได้ก็แต่โดยพินัยกรรมเท่านั้น แต่ถ้าการตัดมิให้รับมรดกได้ทำเป็นหนังสือมอบไว้แก่พนักงานเจ้าหน้าที่ การถอนจะทำตามแบบใดแบบหนึ่งดังบัญญัติไว้ในมาตรา ๑๖๐๘ (๑) หรือ (๒) ก็ได้"],["1610","b6t1","หมวด ๔ การสละมรดกและอื่น ๆ","","มาตรา ๑๖๑๐ ถ้ามรดกตกทอดแก่ผู้เยาว์ หรือบุคคลวิกลจริต หรือบุคคลผู้ไม่สามารถจะจัดทำการงานของตนเองได้ตามความหมายแห่งมาตรา ๓๒ แห่งประมวลกฎหมายนี้ และบุคคลนั้นยังไม่มีผู้แทนโดยชอบธรรม หรือผู้อนุบาล หรือผู้พิทักษ์ เมื่อผู้มีส่วนได้เสีย หรือพนักงานอัยการร้องขอ ก็ให้ศาลตั้งผู้ปกครอง ผู้อนุบาล หรือผู้พิทักษ์ แล้วแต่กรณี"],["1611","b6t1","หมวด ๔ การสละมรดกและอื่น ๆ","","มาตรา ๑๖๑๑ ทายาทซึ่งเป็นผู้เยาว์ บุคคลวิกลจริตหรือบุคคลผู้ไม่สามารถจะจัดทำการงานของตนเองได้ตามความหมายแห่งมาตรา ๓๒ แห่งประมวลกฎหมายนี้ จะทำการดังต่อไปนี้ไม่ได้ เว้นแต่จะได้รับความยินยอมของบิดามารดา ผู้ปกครอง ผู้อนุบาล หรือผู้พิทักษ์ แล้วแต่กรณี และได้รับอนุมัติจากศาลแล้วคือ\n(๑) สละมรดก\n(๒) รับมรดกอันมีค่าภาระติดพันหรือเงื่อนไข"],["1612","b6t1","หมวด ๔ การสละมรดกและอื่น ๆ","","มาตรา ๑๖๑๒ การสละมรดกนั้น ต้องแสดงเจตนาชัดแจ้งเป็นหนังสือมอบไว้แก่พนักงานเจ้าหน้าที่ หรือทำเป็นสัญญาประนีประนอมยอมความ"],["1613","b6t1","หมวด ๔ การสละมรดกและอื่น ๆ","","มาตรา ๑๖๑๓ การสละมรดกนั้น จะทำแต่เพียงบางส่วน หรือทำโดยมีเงื่อนไข หรือเงื่อนเวลาไม่ได้\nการสละมรดกนั้น จะถอนเสียมิได้"],["1614","b6t1","หมวด ๔ การสละมรดกและอื่น ๆ","","มาตรา ๑๖๑๔ ถ้าทายาทสละมรดกด้วยวิธีใดโดยที่รู้อยู่ว่าการที่ทำเช่นนั้นจะทำให้เจ้าหนี้ของตนเสียเปรียบ เจ้าหนี้มีสิทธิที่จะร้องขอให้เพิกถอนการสละมรดกนั้นเสียได้ แต่ความข้อนี้มิให้ใช้บังคับ ถ้าปรากฏว่าในขณะที่สละมรดกนั้น บุคคลซึ่งเป็นผู้ได้ลาภงอกแต่การนั้นมิได้รู้เท่าถึงข้อความจริงอันเป็นทางให้เจ้าหนี้ต้องเสียเปรียบนั้นด้วย แต่หากกรณีเป็นการสละมรดกโดยเสน่หา เพียงแต่ทายาทผู้สละมรดกเป็นผู้รู้ฝ่ายเดียวเท่านั้นก็พอแล้ว ที่จะขอเพิกถอนได้\nเมื่อได้เพิกถอนการสละมรดกแล้ว เจ้าหนี้จะร้องขอให้ศาลสั่ง เพื่อให้ตนรับมรดกแทนที่ทายาทและในสิทธิของทายาทนั้นก็ได้\nในกรณีเช่นนี้ เมื่อได้ชำระหนี้ของทายาทนั้นให้แก่เจ้าหนี้แล้ว ถ้าส่วนของทายาทนั้นยังมีเหลืออยู่อีก ก็ให้ได้แก่ผู้สืบสันดานของทายาทนั้น หรือทายาทอื่นของเจ้ามรดก แล้วแต่กรณี"],["1615","b6t1","หมวด ๔ การสละมรดกและอื่น ๆ","","มาตรา ๑๖๑๕ การที่ทายาทสละมรดกนั้น มีผลย้อนหลังไปถึงเวลาที่เจ้ามรดกตาย\nเมื่อทายาทโดยธรรมคนใดสละมรดก ผู้สืบสันดานของทายาทคนนั้นสืบมรดกได้ตามสิทธิของตน และชอบที่จะได้รับส่วนแบ่งเท่ากับส่วนแบ่งที่ผู้สละมรดกนั้นจะได้รับ แต่ผู้สืบสันดานนั้นต้องไม่ใช่ผู้ที่บิดามารดา ผู้ปกครอง หรือผู้อนุบาล แล้วแต่กรณี ได้บอกสละมรดกโดยสมบูรณ์ในนามของผู้สืบสันดานนั้น"],["1616","b6t1","หมวด ๔ การสละมรดกและอื่น ๆ","","มาตรา ๑๖๑๖ ถ้าผู้สืบสันดานของผู้สละมรดกได้มรดกมาดังกล่าวไว้ในมาตรา ๑๖๑๕ แล้ว ผู้ที่ได้สละมรดกนั้นไม่มีสิทธิในส่วนทรัพย์สินอันผู้สืบสันดานของตนได้รับมรดกมา ในอันที่จะจัดการและใช้ดังที่ระบุไว้ในบรรพ ๕ ลักษณะ ๒ หมวด ๓ แห่งประมวลกฎหมายนี้ และให้ใช้มาตรา ๑๕๔๘ บังคับโดยอนุโลม"],["1617","b6t1","หมวด ๔ การสละมรดกและอื่น ๆ","","มาตรา ๑๖๑๗ ผู้รับพินัยกรรมคนใดสละมรดก ผู้นั้นรวมตลอดทั้งผู้สืบสันดานไม่มีสิทธิจะรับมรดกที่ได้สละแล้วนั้น"],["1618","b6t1","หมวด ๔ การสละมรดกและอื่น ๆ","","มาตรา ๑๖๑๘ ถ้าทายาทโดยธรรมผู้ที่ได้สละมรดกไม่มีผู้สืบสันดานที่จะรับมรดกได้ หรือผู้รับพินัยกรรมได้สละมรดก ให้ปันส่วนแบ่งของผู้ที่ได้สละมรดกนั้น ๆ แก่ทายาทอื่นของเจ้ามรดกต่อไป"],["1619","b6t1","หมวด ๔ การสละมรดกและอื่น ๆ","","มาตรา ๑๖๑๙ ผู้ใดจะสละหรือจำหน่ายจ่ายโอนโดยประการใด ซึ่งสิทธิอันหากจะมีในภายหน้าในการสืบมรดกผู้ที่ยังมีชีวิตอยู่นั้นไม่ได้"],["1620","b6t2","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๒๐ ถ้าผู้ใดตายโดยไม่ได้ทำพินัยกรรมไว้หรือทำพินัยกรรมไว้แต่ไม่มีผลบังคับได้ ให้ปันทรัพย์มรดกทั้งหมดแก่ทายาทโดยธรรมของผู้ตายนั้นตามกฎหมาย\nถ้าผู้ใดตายโดยได้ทำพินัยกรรมไว้ แต่พินัยกรรมนั้นจำหน่ายทรัพย์หรือมีผลบังคับได้แต่เพียงบางส่วนแห่งทรัพย์มรดก ให้ปันส่วนที่มิได้จำหน่ายโดยพินัยกรรม หรือส่วนที่พินัยกรรมไม่มีผลบังคับให้แก่ทายาทโดยธรรมตามกฎหมาย"],["1621","b6t2","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๒๑ เว้นแต่ผู้ทำพินัยกรรมจะได้แสดงเจตนากำหนดไว้ในพินัยกรรมเป็นอย่างอื่น แม้ทายาทโดยธรรมคนใดจะได้รับทรัพย์สินอย่างหนึ่งอย่างใดตามพินัยกรรม ทายาทคนนั้นก็ยังมีสิทธิที่จะเรียกเอาส่วนโดยธรรมของตนจากทรัพย์มรดกส่วนที่ยังไม่ได้จำหน่ายโดยพินัยกรรมจนเต็มอีกก็ได้"],["1622","b6t2","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๒๒ พระภิกษุนั้น จะเรียกร้องเอาทรัพย์มรดกในฐานะที่เป็นทายาทโดยธรรมไม่ได้ เว้นแต่จะได้สึกจากสมณเพศมาเรียกร้องภายในกำหนดอายุความตามมาตรา ๑๗๕๔\nแต่พระภิกษุนั้น อาจเป็นผู้รับพินัยกรรมได้"],["1623","b6t2","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๒๓ ทรัพย์สินของพระภิกษุที่ได้มาในระหว่างเวลาที่อยู่ในสมณเพศนั้น เมื่อพระภิกษุนั้นถึงแก่มรณภาพให้ตกเป็นสมบัติของวัดที่เป็นภูมิลำเนาของพระภิกษุนั้น เว้นไว้แต่พระภิกษุนั้นจะได้จำหน่ายไปในระหว่างชีวิตหรือโดยพินัยกรรม"],["1624","b6t2","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๒๔ ทรัพย์สินใดเป็นของบุคคลก่อนอุปสมบทเป็นพระภิกษุ ทรัพย์สินนั้นหาตกเป็นสมบัติของวัดไม่ และให้เป็นมรดกตกทอดแก่ทายาทโดยธรรมของบุคคลนั้นหรือบุคคลนั้นจะจำหน่ายโดยประการใดตามกฎหมายก็ได้"],["1625","b6t2","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๒๕ ถ้าผู้ตายเป็นผู้สมรสแล้ว การคิดส่วนแบ่งและการปันทรัพย์สินระหว่างผู้ตายกับคู่สมรสที่ยังมีชีวิตอยู่นั้นให้เป็นไปดังนี้\n(๑) ในเรื่องส่วนแบ่งในทรัพย์สินระหว่างคู่สมรสให้อยู่ในบังคับของบทบัญญัติแห่งประมวลกฎหมายนี้ว่าด้วยการหย่าโดยยินยอมทั้งสองฝ่าย อันมีบทบัญญัติเพิ่มเติมให้บริบูรณ์ในมาตรา ๑๖๓๗ และมาตรา ๑๖๓๘ และโดยเฉพาะต้องอยู่ในบังคับแห่งมาตรา ๑๕๑๓ ถึงมาตรา ๑๕๑๗ แห่งประมวลกฎหมายนี้ แต่การคิดส่วนแบ่งนั้นมีผลตั้งแต่วันที่การสมรสได้สิ้นไปด้วยเหตุความตายนั้น\n(๒) ในเรื่องส่วนแบ่งในทรัพย์มรดกของผู้ตาย ให้อยู่ในบังคับของบทบัญญัติแห่งบรรพนี้ นอกจากมาตรา ๑๖๓๗ และมาตรา ๑๖๓๘"],["1626","b6t2","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๒๖ เมื่อได้ปฏิบัติตามมาตรา ๑๖๒๕ (๑) แล้ว ให้คิดส่วนแบ่งทรัพย์มรดกระหว่างทายาทโดยธรรม ดังต่อไปนี้\n(๑) ทรัพย์มรดกนั้นให้แบ่งแก่ทายาทตามลำดับและชั้นต่าง ๆ ดังที่บัญญัติไว้ในหมวด ๒ แห่งลักษณะนี้\n(๒) ส่วนแบ่งอันจะได้แก่ทายาทในลำดับและชั้นต่าง ๆ นั้น ให้แบ่งในระหว่างบรรดาทายาทในลำดับและชั้นนั้น ๆ ดังที่บัญญัติไว้ในหมวด ๓ แห่งลักษณะนี้"],["1627","b6t2","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๒๗ บุตรนอกกฎหมายที่บิดาได้รับรองแล้วและบุตรบุญธรรมนั้น ให้ถือว่าเป็นผู้สืบสันดาน เหมือนกับบุตรที่ชอบด้วยกฎหมาย ตามความหมายแห่งประมวลกฎหมายนี้"],["1628","b6t2","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๒๘ คู่สมรสที่ร้างกันหรือแยกกันอยู่โดยยังมิได้หย่าขาดจากกันตามกฎหมาย มิได้สิ้นไปซึ่งสิทธิโดยธรรมในการสืบมรดกซึ่งกันและกัน"],["1629","b6t2","หมวด ๒ การแบ่งทรัพย์มรดกระหว่างทายาท โดยธรรมในลำดับและชั้นต่าง ๆ","","มาตรา ๑๖๒๙ ทายาทโดยธรรมมีหกลำดับเท่านั้น และภายใต้บังคับแห่งมาตรา ๑๖๓๐ วรรคสอง แต่ละลำดับมีสิทธิได้รับมรดกก่อนหลังดังต่อไปนี้ คือ\n(๑) ผู้สืบสันดาน\n(๒) บิดามารดา\n(๓) พี่น้องร่วมบิดามารดาเดียวกัน\n(๔) พี่น้องร่วมบิดาหรือร่วมมารดาเดียวกัน\n(๕) ปู่ ย่า ตา ยาย\n(๖) ลุง ป้า น้า อา\nคู่สมรสที่ยังมีชีวิตอยู่นั้นก็เป็นทายาทโดยธรรม ภายใต้บังคับของบทบัญญัติพิเศษแห่งมาตรา ๑๖๓๕"],["1630","b6t2","หมวด ๒ การแบ่งทรัพย์มรดกระหว่างทายาท โดยธรรมในลำดับและชั้นต่าง ๆ","","มาตรา ๑๖๓๐ ตราบใดที่มีทายาทซึ่งยังมีชีวิตอยู่ หรือมีผู้รับมรดกแทนที่ยังไม่ขาดสาย แล้วแต่กรณี ในลำดับหนึ่ง ๆ ที่ระบุไว้ในมาตรา ๑๖๒๙ ทายาทผู้ที่อยู่ในลำดับถัดลงไปไม่มีสิทธิในทรัพย์มรดกของผู้ตายเลย\nแต่ความในวรรคก่อนนี้มิให้ใช้บังคับในกรณีเฉพาะที่มีผู้สืบสันดานคนใดยังมีชีวิตอยู่หรือมีผู้รับมรดกแทนที่กัน แล้วแต่กรณี และมีบิดามารดายังมีชีวิตอยู่ ในกรณีเช่นนั้นให้บิดามารดาได้ส่วนแบ่งเสมือนหนึ่งว่าเป็นทายาทชั้นบุตร"],["1631","b6t2","หมวด ๒ การแบ่งทรัพย์มรดกระหว่างทายาท โดยธรรมในลำดับและชั้นต่าง ๆ","","มาตรา ๑๖๓๑ ในระหว่างผู้สืบสันดานต่างชั้นกันนั้น บุตรของเจ้ามรดกอันอยู่ในชั้นสนิทที่สุดเท่านั้นมีสิทธิรับมรดก ผู้สืบสันดานที่อยู่ในชั้นถัดลงไปจะรับมรดกได้ก็แต่โดยอาศัยสิทธิในการรับมรดกแทนที่"],["1632","b6t2","หมวด ๓ การแบ่งส่วนมรดกของทายาทโดยธรรม ในลำดับและชั้นต่าง ๆ","ส่วนที่ ๑ ญาติ","มาตรา ๑๖๓๒ ภายใต้บังคับแห่งมาตรา ๑๖๒๙ วรรคสุดท้าย การแบ่งส่วนมรดกของทายาทโดยธรรมในลำดับญาติให้เป็นไปตามบทบัญญัติในส่วนที่ ๑ แห่งหมวดนี้"],["1633","b6t2","หมวด ๓ การแบ่งส่วนมรดกของทายาทโดยธรรม ในลำดับและชั้นต่าง ๆ","ส่วนที่ ๑ ญาติ","มาตรา ๑๖๓๓ ทายาทโดยธรรมในลำดับเดียวกัน ในลำดับหนึ่ง ๆ ที่ระบุไว้ในมาตรา ๑๖๒๙ นั้น ชอบที่จะได้รับส่วนแบ่งเท่ากัน ถ้าในลำดับหนึ่งมีทายาทโดยธรรมคนเดียว ทายาทโดยธรรมคนนั้นมีสิทธิได้รับส่วนแบ่งทั้งหมด"],["1634","b6t2","หมวด ๓ การแบ่งส่วนมรดกของทายาทโดยธรรม ในลำดับและชั้นต่าง ๆ","ส่วนที่ ๑ ญาติ","มาตรา ๑๖๓๔ ระหว่างผู้สืบสันดานที่รับมรดกแทนที่กันในส่วนแบ่งของสายหนึ่ง ๆ ตามบทบัญญัติในลักษณะ ๒ หมวด ๔ นั้น ให้ได้รับส่วนแบ่งมรดกดังนี้\n(๑) ถ้ามีผู้สืบสันดานต่างชั้นกัน บุตรของผู้ตายซึ่งอยู่ในชั้นสนิทที่สุดเท่านั้นมีสิทธิรับมรดก ผู้สืบสันดานในชั้นถัดลงไปจะรับมรดกได้ก็แต่โดยอาศัยสิทธิในการรับมรดกแทนที่\n(๒) ผู้สืบสันดานในชั้นเดียวกันได้รับส่วนแบ่งเท่ากัน\n(๓) ถ้าในชั้นหนึ่งมีผู้สืบสันดานคนเดียว ผู้สืบสันดานคนนั้นมีสิทธิได้รับส่วนแบ่งทั้งหมด"],["1635","b6t2","หมวด ๓ การแบ่งส่วนมรดกของทายาทโดยธรรม ในลำดับและชั้นต่าง ๆ","ส่วนที่ ๒ คู่สมรส","มาตรา ๑๖๓๕ ลำดับและส่วนแบ่งของคู่สมรสที่ยังมีชีวิตอยู่ในการรับมรดกของผู้ตายนั้น ให้เป็นไปดังต่อไปนี้\n(๑) ถ้ามีทายาทตามมาตรา ๑๖๒๙ (๑) ซึ่งยังมีชีวิตอยู่หรือมีผู้รับมรดกแทนที่ แล้วแต่กรณี คู่สมรสที่ยังมีชีวิตอยู่นั้น มีสิทธิได้ส่วนแบ่งเสมือนหนึ่งว่าตนเป็นทายาทชั้นบุตร\n(๒) ถ้ามีทายาทตามมาตรา ๑๖๒๙ (๓) และทายาทนั้นยังมีชีวิตอยู่หรือมีผู้รับมรดกแทนที่ หรือถ้าไม่มีทายาทตามมาตรา ๑๖๒๙ (๑) แต่มีทายาทตามมาตรา ๑๖๒๙ (๒) แล้วแต่กรณี คู่สมรสที่ยังมีชีวิตอยู่นั้นมีสิทธิได้รับมรดกกึ่งหนึ่ง\n(๓) ถ้ามีทายาทตามมาตรา ๑๖๒๙ (๔) หรือ (๖) และทายาทนั้นยังมีชีวิตอยู่ หรือมีผู้รับมรดกแทนที่ หรือมีทายาทตามมาตรา ๑๖๒๙ (๕) แล้วแต่กรณี คู่สมรสที่ยังมีชีวิตอยู่ มีสิทธิได้มรดกสองส่วนในสาม\n(๔) ถ้าไม่มีทายาทดังที่ระบุไว้ในมาตรา ๑๖๒๙ คู่สมรสที่ยังมีชีวิตอยู่นั้นมีสิทธิได้รับมรดกทั้งหมด"],["1636","b6t2","หมวด ๓ การแบ่งส่วนมรดกของทายาทโดยธรรม ในลำดับและชั้นต่าง ๆ","ส่วนที่ ๒ คู่สมรส","มาตรา ๑๖๓๖ ถ้าเจ้ามรดกมีภริยาที่ชอบด้วยกฎหมายก่อนใช้ประมวลกฎหมายแพ่งและพาณิชย์บรรพ ๕ หลายคนยังมีชีวิตอยู่ ภริยาเหล่านั้นทั้งหมดรวมกันมีสิทธิได้รับมรดกตามลำดับชั้นและส่วนแบ่งดังระบุไว้ในมาตรา ๑๖๓๕ แต่ในระหว่างกันเองให้ภริยาน้อยแต่ละคนมีสิทธิได้รับมรดกกึ่งส่วนที่ภริยาหลวงจะพึงได้รับ"],["1637","b6t2","หมวด ๓ การแบ่งส่วนมรดกของทายาทโดยธรรม ในลำดับและชั้นต่าง ๆ","ส่วนที่ ๒ คู่สมรส","มาตรา ๑๖๓๗ ถ้าคู่สมรสฝ่ายใดที่ยังมีชีวิตอยู่เป็นผู้รับประโยชน์ตามสัญญาประกันชีวิต คู่สมรสฝ่ายนั้นมีสิทธิรับจำนวนเงินทั้งหมดที่ได้ตกลงไว้กับผู้รับประกันภัย แต่จำต้องเอาจำนวนเบี้ยประกันภัย เพียงเท่าที่พิสูจน์ได้ว่าสูงกว่าจำนวนเงินที่ผู้ตายจะพึงส่งใช้เป็นเบี้ยประกันภัยได้ตามรายได้หรือฐานะของตนโดยปกติไปชดใช้สินเดิมของคู่สมรสอีกฝ่ายหนึ่ง หรือสินสมรส แล้วแต่กรณี\nถึงอย่างไรก็ดี จำนวนเงินเบี้ยประกันภัยซึ่งจะพึงส่งคืนตามบทบัญญัติข้างต้นนั้น รวมทั้งสิ้นต้องไม่เกินจำนวนเงินที่ผู้รับประกันภัยได้ชำระให้"],["1638","b6t2","หมวด ๓ การแบ่งส่วนมรดกของทายาทโดยธรรม ในลำดับและชั้นต่าง ๆ","ส่วนที่ ๒ คู่สมรส","มาตรา ๑๖๓๘ เมื่อคู่สมรสทั้งสองฝ่ายได้ลงทุนออกเงินในการทำสัญญา และตามสัญญานั้นทั้งสองฝ่ายจะต้องได้รับเงินปีในขณะที่ยังมีชีวิตอยู่ร่วมกัน และเมื่อฝ่ายหนึ่งฝ่ายใดตาย ฝ่ายที่ยังมีชีวิตอยู่ยังจะต้องได้รับเงินปีต่อไปตลอดอายุ ฝ่ายที่ยังมีชีวิตอยู่ จำต้องชดใช้สินเดิมของอีกฝ่ายหนึ่ง หรือสินสมรส แล้วแต่กรณี สุดแต่ว่าได้เอาเงินสินเดิม หรือสินสมรสไปใช้ในการลงทุนนั้น เงินที่จะต้องชดใช้สินเดิมหรือสินสมรสดังว่านี้ ให้ชดใช้เท่าจำนวนเงินซึ่งผู้จ่ายเงินรายปีจะเรียกให้ใช้เพิ่มขึ้นเป็นพิเศษ เพื่อผู้จ่ายจะได้จ่ายเงินรายปีให้แก่คู่สมรสฝ่ายที่ยังมีชีวิตอยู่นั้นต่อไป"],["1639","b6t2","หมวด ๔ การรับมรดกแทนที่กัน","","มาตรา ๑๖๓๙ ถ้าบุคคลใดซึ่งจะเป็นทายาทตามมาตรา ๑๖๒๙ (๑) (๓) (๔) หรือ (๖) ถึงแก่ความตาย หรือถูกกำจัดมิให้รับมรดกก่อนเจ้ามรดกตาย ถ้าบุคคลนั้นมีผู้สืบสันดานก็ให้ผู้สืบสันดานรับมรดกแทนที่ ถ้าผู้สืบสันดานคนใดของบุคคลนั้นถึงแก่ความตายหรือถูกกำจัดมิให้รับมรดกเช่นเดียวกัน ก็ให้ผู้สืบสันดานของผู้สืบสันดานนั้นรับมรดกแทนที่ และให้มีการรับมรดกแทนที่กันเฉพาะส่วนแบ่งของบุคคลเป็นราย ๆ สืบต่อกันเช่นนี้ไปจนหมดสาย"],["1640","b6t2","หมวด ๔ การรับมรดกแทนที่กัน","","มาตรา ๑๖๔๐ เมื่อบุคคลใดต้องถือว่าถึงแก่ความตายตามความในมาตรา ๖๕ แห่งประมวลกฎหมายนี้ ให้มีการรับมรดกแทนที่กันได้"],["1641","b6t2","หมวด ๔ การรับมรดกแทนที่กัน","","มาตรา ๑๖๔๑ ถ้าบุคคลใดซึ่งจะเป็นทายาทตามมาตรา ๑๖๒๙ (๒) หรือ (๕) ถึงแก่ความตาย หรือถูกกำจัดมิให้รับมรดกก่อนเจ้ามรดกตาย ถ้ามีทายาทในลำดับเดียวกันยังมีชีวิตอยู่ ก็ให้ส่วนแบ่งทั้งหมดตกได้แก่ทายาทนั้นเท่านั้น ห้ามมิให้มีการรับมรดกแทนที่กันต่อไป"],["1642","b6t2","หมวด ๔ การรับมรดกแทนที่กัน","","มาตรา ๑๖๔๒ การรับมรดกแทนที่กันนั้น ให้ใช้บังคับแต่ในระหว่างทายาทโดยธรรม"],["1643","b6t2","หมวด ๔ การรับมรดกแทนที่กัน","","มาตรา ๑๖๔๓ สิทธิที่จะรับมรดกแทนที่กันนั้นได้เฉพาะผู้สืบสันดานโดยตรง ผู้บุพการีหามีสิทธิดังนั้นไม่"],["1644","b6t2","หมวด ๔ การรับมรดกแทนที่กัน","","มาตรา ๑๖๔๔ ผู้สืบสันดานจะรับมรดกแทนที่ได้ต่อเมื่อมีสิทธิบริบูรณ์ในการรับมรดก"],["1645","b6t2","หมวด ๔ การรับมรดกแทนที่กัน","","มาตรา ๑๖๔๕ การที่บุคคลใดสละมรดกของบุคคลอีกคนหนึ่งนั้น ไม่ตัดสิทธิของผู้สละที่จะรับมรดกแทนที่บุคคลอีกคนหนึ่งนั้นในการสืบมรดกบุคคลอื่น"],["1646","b6t3","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๔๖ บุคคลใดจะแสดงเจตนาโดยพินัยกรรม กำหนดการเผื่อตายในเรื่องทรัพย์สินของตนเอง หรือในการต่าง ๆ อันจะให้เกิดเป็นผลบังคับได้ตามกฎหมายเมื่อตนตายก็ได้"],["1647","b6t3","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๔๗ การแสดงเจตนากำหนดการเผื่อตายนั้นย่อมทำได้ด้วยคำสั่งสุดท้ายกำหนดไว้ในพินัยกรรม"],["1648","b6t3","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๔๘ พินัยกรรมนั้นต้องทำตามแบบซึ่งระบุไว้ในหมวด ๒ แห่งลักษณะนี้"],["1649","b6t3","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๔๙ ผู้จัดการมรดกซึ่งผู้ตายตั้งไว้ย่อมมีอำนาจและหน้าที่ในอันที่จะจัดการทำศพของผู้ตาย เว้นแต่ผู้ตายจะได้ตั้งบุคคลอื่นไว้โดยเฉพาะให้จัดการดังว่านั้น\nถ้าผู้ตายมิได้ตั้งผู้จัดการมรดกหรือบุคคลใดไว้ให้เป็นผู้จัดการทำศพ หรือทายาทมิได้มอบหมายตั้งให้บุคคลใดเป็นผู้จัดการทำศพ บุคคลผู้ได้รับทรัพย์มรดกโดยพินัยกรรมหรือโดยสิทธิโดยธรรมเป็นจำนวนมากที่สุด เป็นผู้มีอำนาจและตกอยู่ในหน้าที่ต้องจัดการทำศพ เว้นแต่ศาลจะเห็นเป็นการสมควรตั้งบุคคลอื่นให้จัดการเช่นนั้น ในเมื่อบุคคลผู้มีส่วนได้เสียคนใดคนหนึ่งร้องขอขึ้น"],["1650","b6t3","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๕๐ ค่าใช้จ่ายเกิดมีหนี้เป็นคุณแก่บุคคลใดในการจัดการทำศพนั้น ให้เรียกเอาได้ตามบุริมสิทธิที่ระบุไว้ในมาตรา ๒๕๓ (๒) แห่งประมวลกฎหมายนี้\nถ้าการจัดการทำศพ ต้องชักช้าไปด้วยประการใด ๆ ให้บุคคลผู้มีอำนาจตามความในมาตราก่อนกันเงินเป็นจำนวนอันสมควรจากสินทรัพย์แห่งกองมรดกเพื่อใช้ในการนี้ โดยให้บุคคลผู้มีส่วนได้เสียคนใดคนหนึ่งร้องต่อศาลได้ในกรณีที่ไม่ตกลงหรือคัดค้านการกันเงินจำนวนนั้น\nกรณีจะเป็นอย่างไรก็ตาม เงินค่าใช้จ่าย หรือเงินที่กันไว้อันเกี่ยวกับการจัดการทำศพนั้น ให้กันไว้ได้แต่เพียงจำนวนตามสมควรแก่ฐานะในสมาคมของผู้ตาย แต่จะต้องไม่เป็นการเสื่อมเสียต่อสิทธิของเจ้าหนี้ของผู้ตาย"],["1651","b6t3","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๕๑ ภายใต้บังคับบทบัญญัติลักษณะ ๔\n(๑) เมื่อตามข้อกำหนดพินัยกรรม บุคคลใดมีสิทธิที่จะได้รับทรัพย์มรดกทั้งหมดของเจ้ามรดก หรือตามเศษส่วน หรือตามส่วนที่เหลือแห่งทรัพย์มรดก ซึ่งมิได้แยกไว้ต่างหากเป็นพิเศษจากกองมรดก บุคคลนั้นเรียกว่าผู้รับพินัยกรรมลักษณะทั่วไป และมีสิทธิและความรับผิดเช่นเดียวกับทายาทโดยธรรม\n(๒) เมื่อตามข้อกำหนดพินัยกรรมบุคคลใดมีสิทธิที่จะได้รับทรัพย์สินเฉพาะสิ่งเฉพาะอย่าง ซึ่งเจาะจงไว้โดยเฉพาะ หรือแยกไว้ต่างหากเป็นพิเศษจากกองมรดก บุคคลนั้นเรียกว่า ผู้รับพินัยกรรมลักษณะเฉพาะ และมีสิทธิและความรับผิดที่เกี่ยวกับทรัพย์สินเท่านั้น\nในกรณีที่มีข้อสงสัย ให้สันนิษฐานไว้ก่อนว่า ผู้รับพินัยกรรมเป็นผู้รับพินัยกรรมลักษณะเฉพาะ"],["1652","b6t3","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๕๒ บุคคลผู้อยู่ในความปกครองนั้น จะทำพินัยกรรมยกทรัพย์มรดกของตนให้แก่ผู้ปกครองหรือคู่สมรส บุพการี หรือผู้สืบสันดาน หรือพี่น้องของผู้ปกครองไม่ได้จนกว่าผู้ปกครองจะได้ทำคำแถลงการณ์ปกครองตามที่บัญญัติไว้ในมาตรา ๑๕๗๗ และมาตราต่อ ๆ ไปแห่งประมวลกฎหมายนี้เสร็จสิ้นแล้ว"],["1653","b6t3","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๕๓ ผู้เขียน หรือพยานในพินัยกรรมจะเป็นผู้รับทรัพย์ตามพินัยกรรมนั้นไม่ได้\nให้ใช้บทบัญญัติในวรรคก่อนบังคับแก่คู่สมรสของผู้เขียนหรือพยานในพินัยกรรมด้วย\nพนักงานเจ้าหน้าที่ซึ่งได้จดข้อความแห่งพินัยกรรมที่พยานนำมาแจ้งตามมาตรา ๑๖๖๓ ให้ถือว่าเป็นผู้เขียนพินัยกรรมตามความหมายแห่งมาตรานี้"],["1654","b6t3","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๖๕๔ ความสามารถของผู้ทำพินัยกรรมนั้น ให้พิจารณาแต่ในเวลาที่ทำพินัยกรรมเท่านั้น\nความสามารถของผู้รับพินัยกรรมนั้น ให้พิจารณาแต่ในเวลาที่ผู้ทำพินัยกรรมตายเท่านั้น"],["1655","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๕๕ พินัยกรรมนั้น จะทำได้ก็แต่ตามแบบใดแบบหนึ่งดังที่บัญญัติไว้ในหมวดนี้"],["1656","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๕๖ พินัยกรรมนั้น จะทำตามแบบดังนี้ก็ได้ กล่าวคือต้องทำเป็นหนังสือลงวัน เดือน ปี ในขณะที่ทำขึ้น และผู้ทำพินัยกรรมต้องลงลายมือชื่อไว้ต่อหน้าพยานอย่างน้อยสองคนพร้อมกัน ซึ่งพยานสองคนนั้นต้องลงลายมือชื่อรับรองลายมือชื่อของผู้ทำพินัยกรรมไว้ในขณะนั้น\nการขูดลบ ตก เติม หรือการแก้ไขเปลี่ยนแปลงอย่างอื่นซึ่งพินัยกรรมนั้นย่อมไม่สมบูรณ์ เว้นแต่จะได้ปฏิบัติตามแบบอย่างเดียวกับการทำพินัยกรรมตามมาตรานี้"],["1657","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๕๗ พินัยกรรมนั้น จะทำเป็นเอกสารเขียนเองทั้งฉบับก็ได้ กล่าวคือผู้ทำพินัยกรรมต้องเขียนด้วยมือตนเองซึ่งข้อความทั้งหมด วัน เดือน ปี และลายมือชื่อของตน\nการขูดลบ ตก เติม หรือการแก้ไขเปลี่ยนแปลงอย่างอื่นซึ่งพินัยกรรมนั้นย่อมไม่สมบูรณ์ เว้นแต่ผู้ทำพินัยกรรมจะได้ทำด้วยมือตนเอง และลงลายมือชื่อกำกับไว้\nบทบัญญัติมาตรา ๙ แห่งประมวลกฎหมายนี้ มิให้ใช้บังคับแก่พินัยกรรมที่ทำขึ้นตามมาตรานี้"],["1658","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๕๘ พินัยกรรมนั้น จะทำเป็นเอกสารฝ่ายเมืองก็ได้ กล่าวคือ\n(๑) ผู้ทำพินัยกรรมต้องไปแจ้งข้อความที่ตนประสงค์จะให้ใส่ไว้ในพินัยกรรมของตนแก่กรมการอำเภอต่อหน้าพยานอีกอย่างน้อยสองคนพร้อมกัน\n(๒) กรมการอำเภอต้องจดข้อความที่ผู้ทำพินัยกรรมแจ้งให้ทราบนั้นลงไว้ และอ่านข้อความนั้นให้ผู้ทำพินัยกรรมและพยานฟัง\n(๓) เมื่อผู้ทำพินัยกรรมและพยานทราบแน่ชัดว่าข้อความที่กรมการอำเภอจดนั้นเป็นการถูกต้องตรงกันกับที่ผู้ทำพินัยกรรมแจ้งไว้แล้ว ให้ผู้ทำพินัยกรรมและพยานลงลายมือชื่อไว้เป็นสำคัญ\n(๔) ข้อความที่กรมการอำเภอจดไว้นั้น ให้กรมการอำเภอลงลายมือชื่อและลงวัน เดือน ปี ทั้งจดลงไว้ด้วยตนเองเป็นสำคัญว่า พินัยกรรมนั้นได้ทำขึ้นถูกต้องตามบทบัญญัติ (๑) ถึง (๓) ข้างต้น แล้วประทับตราตำแหน่งไว้เป็นสำคัญ\nการขูดลบ ตก เติม หรือการแก้ไขเปลี่ยนแปลงอย่างอื่นซึ่งพินัยกรรมนั้นย่อมไม่สมบูรณ์ เว้นแต่ผู้ทำพินัยกรรม พยาน และกรมการอำเภอจะได้ลงลายมือชื่อกำกับไว้"],["1659","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๕๙ การทำพินัยกรรมแบบเอกสารฝ่ายเมืองนั้น จะทำนอกที่ว่าการอำเภอก็ได้ เมื่อมีการร้องขอเช่นนั้น"],["1660","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๖๐ พินัยกรรมนั้น จะทำเป็นเอกสารลับก็ได้ กล่าวคือ\n(๑) ผู้ทำพินัยกรรมต้องลงลายมือชื่อในพินัยกรรม\n(๒) ผู้ทำพินัยกรรมต้องผนึกพินัยกรรมนั้น แล้วลงลายมือชื่อคาบรอยผนึกนั้น\n(๓) ผู้ทำพินัยกรรมต้องนำพินัยกรรมที่ผนึกนั้นไปแสดงต่อกรมการอำเภอ และพยานอีกอย่างน้อยสองคน และให้ถ้อยคำต่อบุคคลทั้งหมดเหล่านั้นว่าเป็นพินัยกรรมของตน ถ้าพินัยกรรมนั้นผู้ทำพินัยกรรมมิได้เป็นผู้เขียนเองโดยตลอด ผู้ทำพินัยกรรมจะต้องแจ้งนามและภูมิลำเนาของผู้เขียนให้ทราบด้วย\n(๔) เมื่อกรมการอำเภอจดถ้อยคำของผู้ทำพินัยกรรมและวัน เดือน ปี ที่นำพินัยกรรมมาแสดงไว้บนซองนั้นและประทับตราตำแหน่งแล้ว ให้กรมการอำเภอผู้ทำพินัยกรรมและพยานลงลายมือชื่อบนซองนั้น\nการขูดลบ ตก เติม หรือการแก้ไขเปลี่ยนแปลงอย่างอื่นซึ่งพินัยกรรมนั้นย่อมไม่สมบูรณ์ เว้นแต่ผู้ทำพินัยกรรมจะได้ลงลายมือชื่อกำกับไว้"],["1661","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๖๑ ถ้าบุคคลผู้เป็นทั้งใบ้และหูหนวกหรือผู้ที่พูดไม่ได้ มีความประสงค์จะทำพินัยกรรมเป็นแบบเอกสารลับ ให้ผู้นั้นเขียนด้วยตนเองบนซองพินัยกรรมต่อหน้ากรมการอำเภอและพยานซึ่งข้อความว่าพินัยกรรมที่ผนึกนั้นเป็นของตนแทนการให้ถ้อยคำดังที่กำหนดไว้ในมาตรา ๑๖๖๐ (๓) และถ้าหากมีผู้เขียนก็ให้เขียนชื่อกับภูมิลำเนาของผู้เขียนพินัยกรรมนั้นไว้ด้วย\nให้กรมการอำเภอจดลงไว้บนซองเป็นสำคัญว่า ผู้ทำพินัยกรรมได้ปฏิบัติตามข้อความในวรรคก่อนแล้ว แทนการจดถ้อยคำของผู้ทำพินัยกรรม"],["1662","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๖๒ พินัยกรรมซึ่งได้ทำเป็นแบบเอกสารฝ่ายเมืองหรือเอกสารลับนั้น กรมการอำเภอจะเปิดเผยแก่บุคคลอื่นใดไม่ได้ในระหว่างที่ผู้ทำพินัยกรรมยังมีชีวิตอยู่ และผู้ทำพินัยกรรมจะเรียกให้กรมการอำเภอส่งมอบพินัยกรรมนั้นแก่ตนในเวลาใด ๆ กรมการอำเภอจำต้องส่งมอบให้\nถ้าพินัยกรรมนั้นทำเป็นแบบเอกสารฝ่ายเมือง ก่อนส่งมอบพินัยกรรมให้กรมการอำเภอคัดสำเนาพินัยกรรมไว้ แล้วลงลายมือชื่อประทับตราตำแหน่งเป็นสำคัญ สำเนาพินัยกรรมนั้นจะเปิดเผยแก่บุคคลอื่นใดไม่ได้ในระหว่างที่ผู้ทำพินัยกรรมยังมีชีวิตอยู่"],["1663","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๖๓ เมื่อมีพฤติการณ์พิเศษซึ่งบุคคลใดไม่สามารถจะทำพินัยกรรมตามแบบอื่นที่กำหนดไว้ได้ เช่น ตกอยู่ในอันตรายใกล้ความตาย หรือเวลามีโรคระบาด หรือสงคราม บุคคลนั้นจะทำพินัยกรรมด้วยวาจาก็ได้\nเพื่อการนี้ ผู้ทำพินัยกรรมต้องแสดงเจตนากำหนดข้อพินัยกรรมต่อหน้าพยานอย่างน้อยสองคนซึ่งอยู่พร้อมกัน ณ ที่นั้น\nพยานสองคนนั้นต้องไปแสดงตนต่อกรมการอำเภอโดยมิชักช้าและแจ้งข้อความที่ผู้ทำพินัยกรรมได้สั่งไว้ด้วยวาจานั้น ทั้งต้องแจ้งวัน เดือน ปี สถานที่ที่ทำพินัยกรรมและพฤติการณ์พิเศษนั้นไว้ด้วย\nให้กรมการอำเภอจดข้อความที่พยานแจ้งนั้นไว้ และพยานสองคนนั้นต้องลงลายมือชื่อไว้ หรือมิฉะนั้น จะให้เสมอกับการลงลายมือชื่อได้ก็แต่ด้วยลงลายพิมพ์นิ้วมือ โดยมีพยานลงลายมือชื่อรับรองสองคน"],["1664","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๖๔ ความสมบูรณ์แห่งพินัยกรรมซึ่งทำขึ้นตามมาตราก่อนนั้นย่อมสิ้นไปเมื่อพ้นกำหนดหนึ่งเดือนนับแต่เวลาผู้ทำพินัยกรรมกลับมาสู่ฐานะที่จะทำพินัยกรรมตามแบบอื่นที่กำหนดไว้ได้"],["1665","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๖๕ เมื่อผู้ทำพินัยกรรมจะต้องลงลายมือชื่อตามมาตรา ๑๖๕๖ มาตรา ๑๖๕๘ มาตรา ๑๖๖๐ จะให้เสมอกับลงลายมือชื่อได้ ก็แต่ด้วยลงลายพิมพ์นิ้วมือโดยมีพยานลงลายมือชื่อรับรองไว้ด้วยสองคนในขณะนั้น"],["1666","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๖๖ บทบัญญัติมาตรา ๙ วรรคสอง แห่งประมวลกฎหมายนี้ มิให้ใช้บังคับแก่พยานผู้ที่จะต้องลงลายมือชื่อตามมาตรา ๑๖๕๖ มาตรา ๑๖๕๘ มาตรา ๑๖๖๐"],["1667","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๖๗ เมื่อคนในบังคับสยามจะทำพินัยกรรมในต่างประเทศ พินัยกรรมนั้นอาจทำตามแบบซึ่งกฎหมายของประเทศที่ทำพินัยกรรมบัญญัติไว้ หรือตามแบบที่กฎหมายสยามบัญญัติไว้ก็ได้\nเมื่อทำพินัยกรรมตามแบบที่กฎหมายสยามบัญญัติไว้ อำนาจและหน้าที่ของกรมการอำเภอตามมาตรา ๑๖๕๘ มาตรา ๑๖๖๐ มาตรา ๑๖๖๑ มาตรา ๑๖๖๒ มาตรา ๑๖๖๓ ให้ตกแก่บุคคลดังต่อไปนี้ คือ\n(๑) พนักงานทูต หรือกงสุลฝ่ายสยาม กระทำการตามขอบอำนาจของตน หรือ\n(๒) พนักงานใด ๆ ซึ่งมีอำนาจตามกฎหมายของต่างประเทศนั้น ๆ ที่จะรับบันทึกข้อแจ้งความไว้เป็นหลักฐานได้"],["1668","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๖๘ ผู้ทำพินัยกรรมไม่จำเป็นต้องเปิดเผยข้อความในพินัยกรรมนั้นให้พยานทราบ เว้นแต่กฎหมายจะได้ระบุไว้เป็นอย่างอื่น"],["1669","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๖๙ ในระหว่างเวลาที่ประเทศตกอยู่ในภาวะการรบหรือการสงคราม บุคคลที่รับราชการทหารหรือทำการเกี่ยวข้องอยู่กับราชการทหาร จะทำพินัยกรรมตามแบบที่บัญญัติไว้ในมาตรา ๑๖๕๘ มาตรา ๑๖๖๐ หรือมาตรา ๑๖๖๓ ก็ได้ ในกรณีเช่นว่านั้น ให้นายทหารหรือข้าราชการฝ่ายทหารชั้นสัญญาบัตรมีอำนาจและหน้าที่เช่นเดียวกับกรมการอำเภอ\nบทบัญญัติวรรคก่อนให้นำมาใช้บังคับแก่กรณีที่บุคคลที่รับราชการทหารหรือทำการเกี่ยวข้องอยู่กับราชการทหารทำพินัยกรรมในต่างประเทศในระหว่างที่ปฏิบัติการเพื่อประเทศในภาวะการรบหรือการสงครามในต่างประเทศโดยอนุโลม และในกรณีเช่นว่านี้ ให้นายทหารหรือข้าราชการฝ่ายทหารชั้นสัญญาบัตรมีอำนาจและหน้าที่เช่นเดียวกับพนักงานทูตหรือกงสุลฝ่ายไทย\nถ้าผู้ทำพินัยกรรมตามความในสองวรรคก่อนนั้นป่วยเจ็บหรือต้องบาดเจ็บ และอยู่ในโรงพยาบาล ให้แพทย์แห่งโรงพยาบาลนั้นมีอำนาจและหน้าที่เช่นเดียวกับกรมการอำเภอหรือพนักงานทูต หรือกงสุลฝ่ายไทย แล้วแต่กรณีด้วย"],["1670","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๗๐ บุคคลต่อไปนี้จะเป็นพยานในการทำพินัยกรรมไม่ได้\n(๑) ผู้ซึ่งยังไม่บรรลุนิติภาวะ\n(๒) บุคคลวิกลจริตหรือบุคคลซึ่งศาลสั่งให้เป็นผู้เสมือนไร้ความสามารถ\n(๓) บุคคลที่หูหนวก เป็นใบ้ หรือจักษุบอดทั้งสองข้าง"],["1671","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๗๑ เมื่อบุคคลใดนอกจากผู้ทำพินัยกรรมเป็นผู้เขียนข้อความแห่งพินัยกรรม บุคคลนั้นต้องลงลายมือชื่อของตนทั้งระบุว่าเป็นผู้เขียน\nถ้าบุคคลนั้นเป็นพยานด้วย ให้เขียนข้อความระบุว่าตนเป็นพยานไว้ต่อท้ายลายมือชื่อของตนเช่นเดียวกับพยานอื่น ๆ"],["1672","b6t3","หมวด ๒ แบบพินัยกรรม","","มาตรา ๑๖๗๒ ให้รัฐมนตรีว่าการกระทรวงมหาดไทย กลาโหม และต่างประเทศ มีอำนาจและหน้าที่เท่าที่เกี่ยวกับกระทรวงนั้น ๆ ที่จะออกกฎกระทรวง เพื่อให้การเป็นไปตามประมวลกฎหมายบรรพนี้ รวมทั้งกำหนดอัตราค่าฤชาธรรมเนียมอันเกี่ยวกับการนั้น"],["1673","b6t3","หมวด ๓ ผลและการตีความแห่งพินัยกรรม","","มาตรา ๑๖๗๓ สิทธิและหน้าที่ใด ๆ อันเกิดขึ้นตามพินัยกรรม ให้มีผลบังคับเรียกร้องกันได้ตั้งแต่ผู้ทำพินัยกรรมตายเป็นต้นไป เว้นแต่ผู้ทำพินัยกรรมจะได้กำหนดเงื่อนไขหรือเงื่อนเวลาให้มีผลบังคับเรียกร้องกันได้ภายหลัง"],["1674","b6t3","หมวด ๓ ผลและการตีความแห่งพินัยกรรม","","มาตรา ๑๖๗๔ ถ้าข้อกำหนดพินัยกรรมมีเงื่อนไข และเงื่อนไขนั้นสำเร็จเสียก่อนเวลาที่ผู้ทำพินัยกรรมตาย หากว่าเป็นเงื่อนไขบังคับก่อน ข้อกำหนดพินัยกรรมนั้นมีผลเมื่อผู้ทำพินัยกรรมตาย หากว่าเป็นเงื่อนไขบังคับหลัง ข้อกำหนดพินัยกรรมนั้นเป็นอันไร้ผล\nถ้าเงื่อนไขบังคับก่อนสำเร็จภายหลังที่ผู้ทำพินัยกรรมตาย ข้อกำหนดพินัยกรรมมีผลตั้งแต่เวลาเงื่อนไขสำเร็จ\nถ้าเงื่อนไขบังคับหลังสำเร็จภายหลังที่ผู้ทำพินัยกรรมตาย ข้อกำหนดพินัยกรรมมีผลตั้งแต่เวลาที่ผู้ทำพินัยกรรมตาย แต่ตกเป็นอันไร้ผลในเมื่อเงื่อนไขนั้นสำเร็จ\nแต่ถ้าผู้ทำพินัยกรรมได้กำหนดไว้ในพินัยกรรมว่า ในกรณีที่กล่าวมาในสองวรรคก่อนนั้น ให้ความสำเร็จแห่งเงื่อนไขมีผลย้อนหลังไปถึงเวลาที่ผู้ทำพินัยกรรมตาย ก็ให้เป็นไปตามเจตนาของผู้ทำพินัยกรรมนั้น"],["1675","b6t3","หมวด ๓ ผลและการตีความแห่งพินัยกรรม","","มาตรา ๑๖๗๕ เมื่อพินัยกรรมมีเงื่อนไขบังคับก่อน ผู้รับประโยชน์ตามข้อความแห่งพินัยกรรมนั้นจะร้องต่อศาลขอให้ตั้งผู้จัดการทรัพย์สินที่ยกให้โดยพินัยกรรมนั้นจนกว่าจะถึงเวลาที่เงื่อนไขสำเร็จ หรือจนกว่าความสำเร็จแห่งเงื่อนไขตกเป็นอันพ้นวิสัยก็ได้\nถ้าศาลเห็นเป็นการสมควร จะตั้งผู้ร้องนั้นเป็นผู้จัดการทรัพย์สินเสียเอง และเรียกให้ผู้ร้องนั้นวางประกันตามที่สมควรก็ได้"],["1676","b6t3","หมวด ๓ ผลและการตีความแห่งพินัยกรรม","","มาตรา ๑๖๗๖ พินัยกรรมจะทำขึ้นโดยให้บุคคลใดตกอยู่ในภาระติดพันที่จะต้องก่อตั้งมูลนิธิ หรือจะสั่งจัดสรรทรัพย์สินไว้โดยตรง เพื่อประโยชน์อย่างใดอย่างหนึ่งตามบทบัญญัติมาตรา ๑๑๐ แห่งประมวลกฎหมายนี้ก็ได้"],["1677","b6t3","หมวด ๓ ผลและการตีความแห่งพินัยกรรม","","มาตรา ๑๖๗๗ เมื่อมีพินัยกรรมก่อตั้งมูลนิธิขึ้นตามมาตราก่อน ให้เป็นหน้าที่ของทายาทหรือผู้จัดการมรดก แล้วแต่กรณี ที่จะต้องร้องขอให้รัฐบาลให้อำนาจจัดตั้งขึ้นเป็นนิติบุคคลตามมาตรา ๑๑๔ แห่งประมวลกฎหมายนี้ เว้นแต่จะได้มีข้อกำหนดไว้ในพินัยกรรมเป็นอย่างอื่น\nถ้าบุคคลดังกล่าวแล้วมิได้ร้องขอให้รัฐบาลให้อำนาจ บุคคลผู้มีส่วนได้เสียคนหนึ่งคนใดหรือพนักงานอัยการจะเป็นผู้ร้องขอก็ได้"],["1678","b6t3","หมวด ๓ ผลและการตีความแห่งพินัยกรรม","","มาตรา ๑๖๗๘ เมื่อมูลนิธิใดซึ่งก่อตั้งขึ้นโดยพินัยกรรมได้ตั้งขึ้นเป็นนิติบุคคลแล้ว ให้ถือว่าทรัพย์สินซึ่งผู้ทำพินัยกรรมจัดสรรไว้เพื่อการนั้น ตกเป็นของนิติบุคคลนั้นตั้งแต่เวลาซึ่งพินัยกรรมมีผล เว้นแต่จะมีข้อกำหนดไว้ในพินัยกรรมเป็นอย่างอื่น"],["1679","b6t3","หมวด ๓ ผลและการตีความแห่งพินัยกรรม","","มาตรา ๑๖๗๙ ถ้าจัดตั้งมูลนิธิขึ้นไม่ได้ตามวัตถุที่ประสงค์ ให้ทรัพย์สินตกทอดไปตามที่ระบุไว้ในพินัยกรรม\nถ้าพินัยกรรมไม่ได้ระบุไว้ เมื่อทายาทหรือผู้จัดการมรดก หรือพนักงานอัยการ หรือบุคคลผู้มีส่วนได้เสียคนใดคนหนึ่งร้องขอ ให้ศาลจัดสรรทรัพย์สินนั้นให้แก่นิติบุคคลอื่น ซึ่งปรากฏว่ามีวัตถุที่ประสงค์ใกล้ชิดที่สุดกับความประสงค์ของผู้ทำพินัยกรรม\nถ้าหากว่าจัดสรรทรัพย์สินอย่างนี้ไม่ได้ก็ดี หรือว่ามูลนิธินั้นตั้งขึ้นไม่ได้ เพราะเป็นการขัดต่อกฎหมาย หรือขัดต่อความสงบเรียบร้อยหรือศีลธรรมอันดีของประชาชนก็ดี ข้อกำหนดพินัยกรรมในการจัดตั้งมูลนิธินั้นเป็นอันไร้ผล"],["1680","b6t3","หมวด ๓ ผลและการตีความแห่งพินัยกรรม","","มาตรา ๑๖๘๐ เจ้าหนี้ของผู้ทำพินัยกรรมมีสิทธิที่จะร้องขอให้เพิกถอนข้อกำหนดพินัยกรรมซึ่งก่อตั้งมูลนิธินั้นได้เพียงเท่าที่ตนต้องเสียประโยชน์เนื่องแต่การนั้น"],["1681","b6t3","หมวด ๓ ผลและการตีความแห่งพินัยกรรม","","มาตรา ๑๖๘๑ ถ้าทรัพย์สินซึ่งเป็นวัตถุแห่งพินัยกรรมนั้น ได้สูญหาย ทำลาย หรือบุบสลายไป และพฤติการณ์ ทั้งนี้ เป็นผลให้ได้ทรัพย์สินอื่นมาแทน หรือได้สิทธิเรียกร้องเอาค่าสินไหมทดแทนทรัพย์สินนั้น ผู้รับพินัยกรรมจะเรียกให้ส่งมอบของแทนซึ่งได้รับมานั้น หรือจะเรียกร้องเอาค่าสินไหมทดแทนเสียเองก็ได้ แล้วแต่กรณี"],["1682","b6t3","หมวด ๓ ผลและการตีความแห่งพินัยกรรม","","มาตรา ๑๖๘๒ เมื่อพินัยกรรมทำขึ้นเป็นการปลดหนี้หรือโอนสิทธิเรียกร้อง พินัยกรรมนั้นมีผลเพียงจำนวนซึ่งคงค้างชำระอยู่ในเวลาที่ผู้ทำพินัยกรรมตาย เว้นแต่ผู้ทำพินัยกรรมจะได้กำหนดไว้เป็นอย่างอื่น\nถ้ามีเอกสารอันเป็นหลักฐานแห่งหนี้ที่ปลดให้หรือสิทธิเรียกร้องที่โอนไปนั้น ก็ให้ส่งมอบแก่ผู้รับพินัยกรรมและให้ใช้มาตรา ๓๐๓ ถึงมาตรา ๓๑๓ มาตรา ๓๔๐ แห่งประมวลกฎหมายนี้บังคับโดยอนุโลม แต่ถ้าผู้ทำพินัยกรรมจะต้องกระทำการหรือดำเนินการอย่างใดอย่างหนึ่งตามมาตรานั้น ๆ แล้ว บุคคลผู้ต้องจัดการตามพินัยกรรมหรือผู้รับพินัยกรรมจะกระทำการหรือดำเนินการนั้น ๆ แทนผู้ทำพินัยกรรมก็ได้"],["1683","b6t3","หมวด ๓ ผลและการตีความแห่งพินัยกรรม","","มาตรา ๑๖๘๓ พินัยกรรมที่บุคคลทำให้แก่เจ้าหนี้คนใดของตนนั้น ให้สันนิษฐานไว้ก่อนว่า มิได้ทำขึ้นเพื่อชำระหนี้อันค้างชำระแก่เจ้าหนี้คนนั้น"],["1684","b6t3","หมวด ๓ ผลและการตีความแห่งพินัยกรรม","","มาตรา ๑๖๘๔ เมื่อความข้อใดข้อหนึ่งในพินัยกรรมอาจตีความได้เป็นหลายนัย ให้ถือเอาตามนัยที่จะสำเร็จผลตามความประสงค์ของผู้ทำพินัยกรรมนั้นได้ดีที่สุด"],["1685","b6t3","หมวด ๓ ผลและการตีความแห่งพินัยกรรม","","มาตรา ๑๖๘๕ ในกรณีที่ผู้ทำพินัยกรรมได้กำหนดผู้รับพินัยกรรมไว้โดยคุณสมบัติที่ทราบตัวแน่นอนได้ ถ้ามีบุคคลหลายคนทรงไว้ซึ่งคุณสมบัติที่จะเป็นผู้รับพินัยกรรมตามที่ผู้ทำพินัยกรรมกำหนดไว้ดังนั้นได้ ในกรณีที่มีข้อสงสัยให้ถือว่าทุกคนมีสิทธิที่จะได้รับส่วนปันเท่า ๆ กัน"],["1686","b6t3","หมวด ๔ พินัยกรรมที่ตั้งผู้ปกครองทรัพย์","","มาตรา ๑๖๘๖ อันว่าทรัสต์นั้น จะก่อตั้งขึ้นโดยตรงหรือโดยทางอ้อมด้วยพินัยกรรมหรือด้วยนิติกรรมใด ๆ ที่มีผลในระหว่างชีวิตก็ดีหรือเมื่อตายแล้วก็ดี หามีผลไม่ เว้นแต่โดยอาศัยอำนาจตามบทบัญญัติแห่งกฎหมายเพื่อการก่อตั้งทรัสต์เท่านั้น"],["1687","b6t3","หมวด ๔ พินัยกรรมที่ตั้งผู้ปกครองทรัพย์","","มาตรา ๑๖๘๗ ถ้าผู้ทำพินัยกรรมประสงค์จะยกทรัพย์สินให้แก่ผู้เยาว์ หรือผู้ซึ่งศาลได้สั่งให้เป็นคนไร้ความสามารถ หรือเสมือนไร้ความสามารถ หรือแก่ผู้ซึ่งต้องรักษาตัวอยู่ในโรงพยาบาลเพราะเหตุวิกลจริต แต่ต้องการมอบการเก็บรักษาและจัดการทรัพย์สินนั้นแก่บุคคลอื่น นอกจากบิดามารดา ผู้ปกครอง ผู้อนุบาล หรือผู้พิทักษ์ของบุคคลเช่นนั้น ผู้ทำพินัยกรรมต้องตั้งผู้ปกครองทรัพย์ขึ้น\nการตั้งผู้ปกครองทรัพย์นี้ ห้ามมิให้ตั้งขึ้นเป็นเวลาเกินกว่ากำหนดแห่งการเป็นผู้เยาว์ หรือกำหนดที่ศาลได้สั่งให้เป็นคนไร้ความสามารถ หรือเสมือนไร้ความสามารถ หรือกำหนดที่ต้องรักษาตัวอยู่ในโรงพยาบาล แล้วแต่กรณี"],["1688","b6t3","หมวด ๔ พินัยกรรมที่ตั้งผู้ปกครองทรัพย์","","มาตรา ๑๖๘๘ การตั้งผู้ปกครองทรัพย์นั้น ในส่วนที่เกี่ยวด้วยอสังหาริมทรัพย์หรือทรัพยสิทธิใด ๆ อันเกี่ยวกับอสังหาริมทรัพย์ ย่อมไม่บริบูรณ์ เว้นแต่จะได้จดทะเบียนต่อพนักงานเจ้าหน้าที่\nบทบัญญัติที่กล่าวมาในวรรคก่อนนี้ ให้ใช้บังคับแก่เรือมีระวางตั้งแต่ห้าตันขึ้นไป ทั้งแพและสัตว์พาหนะด้วย"],["1689","b6t3","หมวด ๔ พินัยกรรมที่ตั้งผู้ปกครองทรัพย์","","มาตรา ๑๖๘๙ นอกจากบุคคลที่ระบุไว้ในมาตรา ๑๕๕๗ แห่งประมวลกฎหมายนี้ นิติบุคคล หรือบุคคลธรรมดาที่มีความสามารถบริบูรณ์ จะรับตั้งเป็นผู้ปกครองทรัพย์ก็ได้"],["1690","b6t3","หมวด ๔ พินัยกรรมที่ตั้งผู้ปกครองทรัพย์","","มาตรา ๑๖๙๐ ผู้ปกครองทรัพย์นั้น ย่อมตั้งขึ้นได้โดย\n(๑) ผู้ทำพินัยกรรม\n(๒) บุคคลซึ่งระบุไว้ในพินัยกรรมให้เป็นผู้ตั้ง"],["1691","b6t3","หมวด ๔ พินัยกรรมที่ตั้งผู้ปกครองทรัพย์","","มาตรา ๑๖๙๑ เว้นแต่ผู้ทำพินัยกรรมจะได้กำหนดไว้เป็นอย่างอื่นในพินัยกรรม ผู้ปกครองทรัพย์จะทำพินัยกรรมตั้งบุคคลอื่นให้ทำการสืบแทนตนก็ได้"],["1692","b6t3","หมวด ๔ พินัยกรรมที่ตั้งผู้ปกครองทรัพย์","","มาตรา ๑๖๙๒ เว้นแต่ผู้ทำพินัยกรรมจะได้กำหนดไว้ในพินัยกรรมเป็นอย่างอื่น ในส่วนที่เกี่ยวด้วยทรัพย์สินที่ได้รับมอบไว้ ผู้ปกครองทรัพย์มีสิทธิและหน้าที่เช่นเดียวกับผู้ปกครองตามความหมายในบรรพ ๕ แห่งประมวลกฎหมายนี้"],["1693","b6t3","หมวด ๕ การเพิกถอนและการตกไปแห่งพินัยกรรม หรือข้อกำหนดพินัยกรรม","","มาตรา ๑๖๙๓ ผู้ทำพินัยกรรมจะเพิกถอนพินัยกรรมของตนเสียทั้งหมด หรือแต่บางส่วนในเวลาใดก็ได้"],["1694","b6t3","หมวด ๕ การเพิกถอนและการตกไปแห่งพินัยกรรม หรือข้อกำหนดพินัยกรรม","","มาตรา ๑๖๙๔ ถ้าจะเพิกถอนพินัยกรรมฉบับก่อนเสียทั้งหมด หรือแต่บางส่วนด้วยพินัยกรรมฉบับหลัง การเพิกถอนจะสมบูรณ์ต่อเมื่อพินัยกรรมฉบับหลังนั้นได้ทำตามแบบใดแบบหนึ่งที่กฎหมายบัญญัติไว้"],["1695","b6t3","หมวด ๕ การเพิกถอนและการตกไปแห่งพินัยกรรม หรือข้อกำหนดพินัยกรรม","","มาตรา ๑๖๙๕ ถ้าพินัยกรรมได้ทำเป็นต้นฉบับแต่ฉบับเดียว ผู้ทำพินัยกรรมอาจเพิกถอนพินัยกรรมนั้นทั้งหมดหรือบางส่วนได้ โดยทำลายหรือขีดฆ่าเสียด้วยความตั้งใจ\nถ้าพินัยกรรมได้ทำเป็นต้นฉบับหลายฉบับ การเพิกถอนนั้นไม่บริบูรณ์ เว้นแต่จะได้กระทำแก่ต้นฉบับเหล่านั้นทุกฉบับ"],["1696","b6t3","หมวด ๕ การเพิกถอนและการตกไปแห่งพินัยกรรม หรือข้อกำหนดพินัยกรรม","","มาตรา ๑๖๙๖ ถ้าผู้ทำพินัยกรรมได้โอนไปโดยสมบูรณ์ซึ่งทรัพย์สินอันเป็นวัตถุแห่งข้อกำหนดพินัยกรรมใดด้วยความตั้งใจ ข้อกำหนดพินัยกรรมนั้นเป็นอันเพิกถอนไป\nวิธีเดียวกันนี้ให้ใช้บังคับ เมื่อผู้ทำพินัยกรรมได้ทำลายทรัพย์สินนั้นด้วยความตั้งใจ"],["1697","b6t3","หมวด ๕ การเพิกถอนและการตกไปแห่งพินัยกรรม หรือข้อกำหนดพินัยกรรม","","มาตรา ๑๖๙๗ ถ้าผู้ทำพินัยกรรมมิได้แสดงเจตนาไว้ในพินัยกรรมเป็นอย่างอื่น และปรากฏว่าพินัยกรรมฉบับก่อนกับฉบับหลังขัดกัน ให้ถือว่าพินัยกรรมฉบับก่อนเป็นอันเพิกถอนโดยพินัยกรรมฉบับหลัง เฉพาะในส่วนที่มีข้อความขัดกันนั้นเท่านั้น"],["1698","b6t3","หมวด ๕ การเพิกถอนและการตกไปแห่งพินัยกรรม หรือข้อกำหนดพินัยกรรม","","มาตรา ๑๖๙๘ ข้อกำหนดพินัยกรรมนั้น ย่อมตกไป\n(๑) เมื่อผู้รับพินัยกรรมตายก่อนผู้ทำพินัยกรรม\n(๒) เมื่อข้อกำหนดพินัยกรรมเป็นผลใช้ได้ต่อเมื่อเงื่อนไขอย่างใดอย่างหนึ่งสำเร็จลง และผู้รับพินัยกรรมตายเสียก่อนเงื่อนไขสำเร็จ หรือปรากฏเป็นที่แน่นอนอยู่แล้วว่าเงื่อนไขนั้นไม่อาจจะสำเร็จได้\n(๓) เมื่อผู้รับพินัยกรรมบอกสละพินัยกรรม\n(๔) เมื่อทรัพย์สินทั้งหมดที่ยกให้สูญหาย หรือถูกทำลายโดยผู้ทำพินัยกรรมมิได้ตั้งใจในระหว่างที่ผู้ทำพินัยกรรมยังมีชีวิตอยู่ และผู้ทำพินัยกรรมมิได้ได้มาซึ่งของแทน หรือซึ่งสิทธิที่จะเรียกค่าทดแทนในการที่ทรัพย์สินนั้นสูญหายไป"],["1699","b6t3","หมวด ๕ การเพิกถอนและการตกไปแห่งพินัยกรรม หรือข้อกำหนดพินัยกรรม","","มาตรา ๑๖๙๙ ถ้าพินัยกรรม หรือข้อกำหนดในพินัยกรรม เกี่ยวกับทรัพย์สินรายใดเป็นอันไร้ผลด้วยประการใด ๆ ทรัพย์สินรายนั้นตกทอดแก่ทายาทโดยธรรมหรือได้แก่แผ่นดิน แล้วแต่กรณี"],["1700","b6t3","หมวด ๖ ความเสียเปล่าแห่งพินัยกรรมหรือข้อกำหนดพินัยกรรม","","มาตรา ๑๗๐๐ ภายใต้บังคับแห่งบทบัญญัติในหมวดนี้ บุคคลจะจำหน่ายทรัพย์สินใด ๆ โดยนิติกรรมที่มีผลในระหว่างชีวิต หรือเมื่อตายแล้ว โดยมีข้อกำหนดห้ามมิให้ผู้รับประโยชน์โอนทรัพย์สินนั้นก็ได้ แต่ต้องมีบุคคลใดบุคคลหนึ่งนอกจากผู้รับประโยชน์กำหนดไว้ สำหรับเป็นผู้จะได้รับทรัพย์สินนั้นเป็นสิทธิเด็ดขาด ในเมื่อมีการละเมิดข้อกำหนดห้ามโอน\nผู้ซึ่งกำหนดขึ้นดังกล่าวนั้นต้องเป็นผู้สามารถจะมีสิทธิต่าง ๆ ได้อยู่ในขณะที่การจำหน่ายทรัพย์สินนั้นมีผลบังคับ\nถ้ามิได้กำหนดบุคคลที่จะเป็นผู้รับทรัพย์สินในเมื่อมีการละเมิดข้อกำหนดห้ามโอนไว้ ให้ถือว่าข้อกำหนดห้ามโอนนั้นเป็นอันไม่มีเลย"],["1701","b6t3","หมวด ๖ ความเสียเปล่าแห่งพินัยกรรมหรือข้อกำหนดพินัยกรรม","","มาตรา ๑๗๐๑ ข้อกำหนดห้ามโอนตามมาตราก่อนนั้น จะให้มีกำหนดเวลาหรือตลอดชีวิตของผู้รับประโยชน์ก็ได้\nถ้าไม่มีกำหนดเวลาห้ามโอนไว้ ในกรณีที่ผู้รับประโยชน์เป็นบุคคลธรรมดา ให้ถือว่าข้อกำหนดห้ามโอนมีระยะเวลาอยู่ตลอดชีวิตของผู้รับประโยชน์ แต่ในกรณีที่ผู้รับประโยชน์เป็นนิติบุคคล ให้มีระยะเวลาเพียงสามสิบปี\nถ้าได้กำหนดเวลาห้ามโอนไว้ กำหนดนั้นมิให้เกินสามสิบปี ถ้ากำหนดไว้นานกว่านั้น ก็ให้ลดลงมาเป็นสามสิบปี"],["1702","b6t3","หมวด ๖ ความเสียเปล่าแห่งพินัยกรรมหรือข้อกำหนดพินัยกรรม","","มาตรา ๑๗๐๒ ข้อกำหนดห้ามโอนอันเกี่ยวกับสังหาริมทรัพย์ซึ่งไม่อาจจดทะเบียนกรรมสิทธิ์ได้นั้น ให้ถือว่าเป็นอันไม่มีเลย\nข้อกำหนดห้ามโอนอันเกี่ยวกับอสังหาริมทรัพย์หรือทรัพยสิทธิอันเกี่ยวกับอสังหาริมทรัพย์นั้น ไม่บริบูรณ์ เว้นแต่จะได้ทำเป็นหนังสือและจดทะเบียนการห้ามโอนต่อพนักงานเจ้าหน้าที่\nบทบัญญัติในวรรคก่อนนี้ ให้ใช้บังคับแก่เรือมีระวางตั้งแต่ห้าตันขึ้นไป ทั้งแพและสัตว์พาหนะด้วย"],["1703","b6t3","หมวด ๖ ความเสียเปล่าแห่งพินัยกรรมหรือข้อกำหนดพินัยกรรม","","มาตรา ๑๗๐๓ พินัยกรรมซึ่งบุคคลที่มีอายุยังไม่ครบสิบห้าปีบริบูรณ์ทำขึ้นนั้น เป็นโมฆะ"],["1704","b6t3","หมวด ๖ ความเสียเปล่าแห่งพินัยกรรมหรือข้อกำหนดพินัยกรรม","","มาตรา ๑๗๐๔ พินัยกรรมซึ่งบุคคลผู้ถูกศาลสั่งให้เป็นคนไร้ความสามารถทำขึ้นนั้น เป็นโมฆะ\nพินัยกรรมซึ่งบุคคลผู้ถูกอ้างว่าเป็นคนวิกลจริต แต่ศาลยังไม่ได้สั่งให้เป็นคนไร้ความสามารถทำขึ้นนั้น จะเป็นอันเสียเปล่าก็แต่เมื่อพิสูจน์ได้ว่าในเวลาที่ทำพินัยกรรมนั้นผู้ทำจริตวิกลอยู่"],["1705","b6t3","หมวด ๖ ความเสียเปล่าแห่งพินัยกรรมหรือข้อกำหนดพินัยกรรม","","มาตรา ๑๗๐๕ พินัยกรรมหรือข้อกำหนดพินัยกรรมนั้น ถ้าได้ทำขึ้นขัดต่อบทบัญญัติแห่งมาตรา ๑๖๕๒ มาตรา ๑๖๕๓ มาตรา ๑๖๕๖ มาตรา ๑๖๕๗ มาตรา ๑๖๕๘ มาตรา ๑๖๖๐ มาตรา ๑๖๖๑ หรือมาตรา ๑๖๖๓ ย่อมเป็นโมฆะ"],["1706","b6t3","หมวด ๖ ความเสียเปล่าแห่งพินัยกรรมหรือข้อกำหนดพินัยกรรม","","มาตรา ๑๗๐๖ ข้อกำหนดพินัยกรรมเป็นโมฆะ\n(๑) ถ้าตั้งผู้รับพินัยกรรมไว้โดยมีเงื่อนไขว่า ให้ผู้รับพินัยกรรมจำหน่ายทรัพย์สินของเขาเองโดยพินัยกรรมให้แก่ผู้ทำพินัยกรรม หรือแก่บุคคลภายนอก\n(๒) ถ้ากำหนดบุคคลซึ่งไม่อาจที่จะทราบตัวแน่นอนได้เป็นผู้รับพินัยกรรม แต่ผู้รับพินัยกรรมตามพินัยกรรมลักษณะเฉพาะนั้น อาจกำหนดโดยให้บุคคลใดคนหนึ่งเป็นผู้ระบุเลือกเอาจากบุคคลอื่นหลายคน หรือจากบุคคลอื่นหมู่ใดหมู่หนึ่ง ซึ่งผู้ทำพินัยกรรมระบุไว้ก็ได้\n(๓) ถ้าทรัพย์สินที่ยกให้โดยพินัยกรรมระบุไว้ไม่ชัดแจ้งจนไม่อาจที่จะทราบแน่นอนได้ หรือถ้าให้บุคคลใดคนหนึ่งกำหนดให้มากน้อยเท่าใดตามแต่ใจ"],["1707","b6t3","หมวด ๖ ความเสียเปล่าแห่งพินัยกรรมหรือข้อกำหนดพินัยกรรม","","มาตรา ๑๗๐๗ ถ้าข้อกำหนดพินัยกรรมตั้งผู้รับพินัยกรรมโดยมีเงื่อนไขว่าให้ผู้รับพินัยกรรมจำหน่ายทรัพย์สินที่ยกให้โดยพินัยกรรมนั้นแก่บุคคลอื่น ให้ถือว่าเงื่อนไขนั้นเป็นอันไม่มีเลย"],["1708","b6t3","หมวด ๖ ความเสียเปล่าแห่งพินัยกรรมหรือข้อกำหนดพินัยกรรม","","มาตรา ๑๗๐๘ เมื่อผู้ทำพินัยกรรมตายแล้ว บุคคลผู้มีส่วนได้เสียคนใดคนหนึ่งจะร้องขอให้ศาลสั่งเพิกถอนพินัยกรรมซึ่งได้ทำขึ้นเพราะเหตุข่มขู่ก็ได้ แต่หากผู้ทำพินัยกรรมยังมีชีวิตอยู่ต่อมาเกินหนึ่งปีนับแต่ผู้ทำพินัยกรรมพ้นจากการข่มขู่แล้ว จะมีการร้องขอเช่นว่านั้นไม่ได้"],["1709","b6t3","หมวด ๖ ความเสียเปล่าแห่งพินัยกรรมหรือข้อกำหนดพินัยกรรม","","มาตรา ๑๗๐๙ เมื่อผู้ทำพินัยกรรมตายแล้ว บุคคลผู้มีส่วนได้เสียคนใดคนหนึ่งจะร้องขอให้ศาลสั่งเพิกถอนพินัยกรรมซึ่งได้ทำขึ้นเพราะสำคัญผิดหรือกลฉ้อฉลได้ก็ต่อเมื่อความสำคัญผิดหรือกลฉ้อฉลนั้นถึงขนาด ซึ่งถ้ามิได้มีความสำคัญผิดหรือกลฉ้อฉลเช่นนั้น พินัยกรรมนั้นก็จะมิได้ทำขึ้น\nความในวรรคก่อนนี้ ให้ใช้บังคับ แม้ถึงว่ากลฉ้อฉลนั้น บุคคลซึ่งมิใช่เป็นผู้รับประโยชน์ตามพินัยกรรมได้ก่อขึ้น\nแต่พินัยกรรมซึ่งได้ทำขึ้นโดยสำคัญผิดหรือกลฉ้อฉลย่อมมีผลบังคับได้ เมื่อผู้ทำพินัยกรรมมิได้เพิกถอนพินัยกรรมนั้นภายในหนึ่งปีนับแต่ที่ได้รู้ถึงการสำคัญผิดหรือกลฉ้อฉลนั้น"],["1710","b6t3","หมวด ๖ ความเสียเปล่าแห่งพินัยกรรมหรือข้อกำหนดพินัยกรรม","","มาตรา ๑๗๑๐ คดีฟ้องขอให้เพิกถอนข้อกำหนดพินัยกรรมนั้น มิให้ฟ้องเมื่อพ้นกำหนดดังนี้\n(๑) สามเดือนภายหลังที่ผู้ทำพินัยกรรมตาย ในกรณีที่โจทก์รู้เหตุแห่งการที่จะขอให้เพิกถอนได้ ในระหว่างที่ผู้ทำพินัยกรรมยังมีชีวิตอยู่ หรือ\n(๒) สามเดือนภายหลังที่โจทก์ได้รู้เหตุเช่นนั้นในกรณีอื่นใด\nแต่ถ้าโจทก์ไม่รู้ว่ามีข้อกำหนดพินัยกรรมอันกระทบกระทั่งถึงส่วนได้เสียของตน แม้ว่าโจทก์จะได้รู้เหตุแห่งการที่จะขอให้เพิกถอนได้ก็ดี อายุความสามเดือนให้เริ่มนับแต่ขณะที่โจทก์รู้หรือควรจะได้รู้ว่ามีข้อกำหนดพินัยกรรมนั้น\nแต่อย่างไรก็ดี ห้ามมิให้ฟ้องคดีเช่นนี้เมื่อพ้นสิบปีนับแต่ผู้ทำพินัยกรรมตาย"],["1711","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๑๑ ผู้จัดการมรดกนั้นรวมตลอดทั้งบุคคลที่ตั้งขึ้นโดยพินัยกรรมหรือโดยคำสั่งศาล"],["1712","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๑๒ ผู้จัดการมรดกโดยพินัยกรรมอาจตั้งขึ้นได้\n(๑) โดยผู้ทำพินัยกรรมเอง\n(๒) โดยบุคคลซึ่งระบุไว้ในพินัยกรรม ให้เป็นผู้ตั้ง"],["1713","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๑๓ ทายาทหรือผู้มีส่วนได้เสียหรือพนักงานอัยการจะร้องต่อศาลขอให้ตั้งผู้จัดการมรดกก็ได้ ในกรณีดังต่อไปนี้\n(๑) เมื่อเจ้ามรดกตาย ทายาทโดยธรรมหรือผู้รับพินัยกรรมได้สูญหายไป หรืออยู่นอกราชอาณาเขต หรือเป็นผู้เยาว์\n(๒) เมื่อผู้จัดการมรดกหรือทายาทไม่สามารถ หรือไม่เต็มใจที่จะจัดการ หรือมีเหตุขัดข้องในการจัดการ หรือในการแบ่งปันมรดก\n(๓) เมื่อข้อกำหนดพินัยกรรมซึ่งตั้งผู้จัดการมรดกไว้ไม่มีผลบังคับได้ด้วยประการใด ๆ\nการตั้งผู้จัดการมรดกนั้น ถ้ามีข้อกำหนดพินัยกรรมก็ให้ศาลตั้งตามข้อกำหนดพินัยกรรม และถ้าไม่มีข้อกำหนดพินัยกรรม ก็ให้ศาลตั้งเพื่อประโยชน์แก่กองมรดกตามพฤติการณ์ และโดยคำนึงถึงเจตนาของเจ้ามรดก แล้วแต่ศาลจะเห็นสมควร"],["1714","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๑๔ เมื่อศาลตั้งให้ผู้ใดเป็นผู้จัดการมรดกเพื่อการใดโดยเฉพาะ ผู้นั้นไม่จำต้องทำบัญชีทรัพย์มรดก เว้นแต่จะจำเป็นเพื่อการนั้น หรือศาลสั่งให้ทำ"],["1715","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๑๕ ผู้ทำพินัยกรรมจะตั้งบุคคลคนเดียวหรือหลายคนให้เป็นผู้จัดการมรดกก็ได้\nเว้นแต่จะมีข้อกำหนดไว้ในพินัยกรรมเป็นอย่างอื่น ถ้ามีผู้จัดการมรดกหลายคน แต่ผู้จัดการเหล่านั้นบางคนไม่สามารถ หรือไม่เต็มใจที่จะจัดการ และยังมีผู้จัดการมรดกเหลืออยู่แต่คนเดียว ผู้นั้นมีสิทธิที่จะจัดการมรดกได้โดยลำพัง แต่ถ้ามีผู้จัดการมรดกเหลืออยู่หลายคน ให้สันนิษฐานไว้ก่อนว่า ผู้จัดการเหล่านั้นแต่ละคนจะจัดการโดยลำพังไม่ได้"],["1716","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๑๖ หน้าที่ผู้จัดการมรดกที่ศาลตั้ง ให้เริ่มนับแต่วันที่ได้ฟังหรือถือว่าได้ฟังคำสั่งศาลแล้ว"],["1717","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๑๗ ในเวลาใด ๆ ภายในหนึ่งปีนับแต่วันที่เจ้ามรดกตาย แต่ต้องเป็นเวลาภายหลังที่เจ้ามรดกตายแล้วสิบห้าวัน ทายาทหรือผู้มีส่วนได้เสียคนใดคนหนึ่ง จะแจ้งความถามไปยังผู้ที่ถูกตั้งเป็นผู้จัดการมรดกโดยพินัยกรรมว่าจะรับเป็นผู้จัดการมรดกหรือไม่ก็ได้\nถ้าผู้ที่ได้รับแจ้งความมิได้ตอบรับเป็นผู้จัดการมรดกภายในหนึ่งเดือนนับแต่วันรับแจ้งความนั้น ให้ถือว่าผู้นั้นปฏิเสธ แต่การรับเป็นผู้จัดการมรดกนั้น จะทำภายหลังหนึ่งปีนับแต่วันที่เจ้ามรดกตายไม่ได้ เว้นแต่ศาลจะอนุญาต"],["1718","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๑๘ บุคคลต่อไปนี้จะเป็นผู้จัดการมรดกไม่ได้\n(๑) ผู้ซึ่งยังไม่บรรลุนิติภาวะ\n(๒) บุคคลวิกลจริต หรือบุคคลซึ่งศาลสั่งให้เป็นผู้เสมือนไร้ความสามารถ\n(๓) บุคคลซึ่งศาลสั่งให้เป็นคนล้มละลาย"],["1719","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๑๙ ผู้จัดการมรดกมีสิทธิและหน้าที่ที่จะทำการอันจำเป็น เพื่อให้การเป็นไปตามคำสั่งแจ้งชัดหรือโดยปริยายแห่งพินัยกรรม และเพื่อจัดการมรดกโดยทั่วไปหรือเพื่อแบ่งปันทรัพย์มรดก"],["1720","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๒๐ ผู้จัดการมรดกต้องรับผิดต่อทายาทตามที่บัญญัติไว้ในมาตรา ๘๐๙ ถึงมาตรา ๘๑๒ มาตรา ๘๑๙ มาตรา ๘๒๓ แห่งประมวลกฎหมายนี้โดยอนุโลม และเมื่อเกี่ยวกับบุคคลภายนอก ให้ใช้มาตรา ๘๓๑ บังคับโดยอนุโลม"],["1721","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๒๑ ผู้จัดการมรดกไม่มีสิทธิที่จ
