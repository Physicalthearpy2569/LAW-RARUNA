้ว คู่สัญญาหาอาจจะเปลี่ยนแปลงหรือระงับสิทธินั้นในภายหลังได้ไม่"],["376","b2t2","หมวด ๒ ผลแห่งสัญญา","","มาตรา ๓๗๖ ข้อต่อสู้อันเกิดแต่มูลสัญญาดังกล่าวมาในมาตรา ๓๗๔ นั้น ลูกหนี้อาจจะยกขึ้นต่อสู้บุคคลภายนอกผู้จะได้รับประโยชน์จากสัญญานั้นได้"],["377","b2t2","หมวด ๓ มัดจำและกำหนดเบี้ยปรับ","","มาตรา ๓๗๗ เมื่อเข้าทำสัญญา ถ้าได้ให้สิ่งใดไว้เป็นมัดจำ ท่านให้ถือว่าการที่ให้มัดจำนั้นย่อมเป็นพยานหลักฐานว่าสัญญานั้นได้ทำกันขึ้นแล้ว อนึ่ง มัดจำนี้ย่อมเป็นประกันการที่จะปฏิบัติตามสัญญานั้นด้วย"],["378","b2t2","หมวด ๓ มัดจำและกำหนดเบี้ยปรับ","","มาตรา ๓๗๘ มัดจำนั้น ถ้ามิได้ตกลงกันไว้เป็นอย่างอื่น ท่านให้เป็นไปดังจะกล่าวต่อไปนี้ คือ\n(๑) ให้ส่งคืน หรือจัดเอาเป็นการใช้เงินบางส่วนในเมื่อชำระหนี้\n(๒) ให้ริบ ถ้าฝ่ายที่วางมัดจำละเลยไม่ชำระหนี้ หรือการชำระหนี้ตกเป็นพ้นวิสัยเพราะพฤติการณ์อันใดอันหนึ่งซึ่งฝ่ายนั้นต้องรับผิดชอบ หรือถ้ามีการเลิกสัญญาเพราะความผิดของฝ่ายนั้น\n(๓) ให้ส่งคืน ถ้าฝ่ายที่รับมัดจำละเลยไม่ชำระหนี้ หรือการชำระหนี้ตกเป็นพ้นวิสัยเพราะพฤติการณ์อันใดอันหนึ่งซึ่งฝ่ายนี้ต้องรับผิดชอบ"],["379","b2t2","หมวด ๓ มัดจำและกำหนดเบี้ยปรับ","","มาตรา ๓๗๙ ถ้าลูกหนี้สัญญาแก่เจ้าหนี้ว่าจะใช้เงินจำนวนหนึ่งเป็นเบี้ยปรับเมื่อตนไม่ชำระหนี้ก็ดี หรือไม่ชำระหนี้ให้ถูกต้องสมควรก็ดี เมื่อลูกหนี้ผิดนัด ก็ให้ริบเบี้ยปรับ ถ้าการชำระหนี้อันจะพึงทำนั้นได้แก่งดเว้นการอันใดอันหนึ่ง หากทำการอันนั้นฝ่าฝืนมูลหนี้เมื่อใด ก็ให้ริบเบี้ยปรับเมื่อนั้น"],["380","b2t2","หมวด ๓ มัดจำและกำหนดเบี้ยปรับ","","มาตรา ๓๘๐ ถ้าลูกหนี้ได้สัญญาไว้ว่าจะให้เบี้ยปรับเมื่อตนไม่ชำระหนี้ เจ้าหนี้จะเรียกเอาเบี้ยปรับอันจะพึงริบนั้นแทนการชำระหนี้ก็ได้ แต่ถ้าเจ้าหนี้แสดงต่อลูกหนี้ว่าจะเรียกเอาเบี้ยปรับฉะนั้นแล้ว ก็เป็นอันขาดสิทธิเรียกร้องชำระหนี้อีกต่อไป\nถ้าเจ้าหนี้มีสิทธิเรียกร้องค่าสินไหมทดแทนเพื่อการไม่ชำระหนี้ จะเรียกเอาเบี้ยปรับอันจะพึงริบนั้นในฐานเป็นจำนวนน้อยที่สุดแห่งค่าเสียหายก็ได้ การพิสูจน์ค่าเสียหายยิ่งกว่านั้น ท่านก็อนุญาตให้พิสูจน์ได้"],["381","b2t2","หมวด ๓ มัดจำและกำหนดเบี้ยปรับ","","มาตรา ๓๘๑ ถ้าลูกหนี้ได้สัญญาไว้ว่าจะให้เบี้ยปรับเมื่อตนไม่ชำระหนี้ให้ถูกต้องสมควร เช่นว่าไม่ชำระหนี้ตรงตามเวลาที่กำหนดไว้เป็นต้น นอกจากเรียกให้ชำระหนี้ เจ้าหนี้จะเรียกเอาเบี้ยปรับอันจะพึงริบนั้นอีกด้วยก็ได้\nถ้าเจ้าหนี้มีสิทธิเรียกร้องค่าสินไหมทดแทนในมูลชำระหนี้ไม่ถูกต้องสมควร ท่านให้บังคับตามบทบัญญัติแห่งมาตรา ๓๘๐ วรรคสอง\nถ้าเจ้าหนี้ยอมรับชำระหนี้แล้ว จะเรียกเอาเบี้ยปรับได้ต่อเมื่อได้บอกสงวนสิทธิไว้เช่นนั้นในเวลารับชำระหนี้"],["382","b2t2","หมวด ๓ มัดจำและกำหนดเบี้ยปรับ","","มาตรา ๓๘๒ ถ้าสัญญาว่าจะทำการชำระหนี้อย่างอื่นให้เป็นเบี้ยปรับ ไม่ใช่ใช้เป็นจำนวนเงินไซร้ ท่านให้นำบทบัญญัติแห่งมาตรา ๓๗๙ ถึงมาตรา ๓๘๑ มาใช้บังคับ แต่ถ้าเจ้าหนี้เรียกเอาเบี้ยปรับแล้ว สิทธิเรียกร้องค่าสินไหมทดแทนก็เป็นอันขาดไป"],["383","b2t2","หมวด ๓ มัดจำและกำหนดเบี้ยปรับ","","มาตรา ๓๘๓ ถ้าเบี้ยปรับที่ริบนั้นสูงเกินส่วน ศาลจะลดลงเป็นจำนวนพอสมควรก็ได้ ในการที่จะวินิจฉัยว่าสมควรเพียงใดนั้น ท่านให้พิเคราะห์ถึงทางได้เสียของเจ้าหนี้ทุกอย่างอันชอบด้วยกฎหมาย ไม่ใช่แต่เพียงทางได้เสียในเชิงทรัพย์สิน เมื่อได้ใช้เงินตามเบี้ยปรับแล้ว สิทธิเรียกร้องขอลดก็เป็นอันขาดไป\nนอกจากกรณีที่กล่าวไว้ในมาตรา ๓๗๙ และมาตรา ๓๘๒ ท่านให้ใช้วิธีเดียวกันนี้บังคับ ในเมื่อบุคคลสัญญาว่าจะให้เบี้ยปรับเมื่อตนกระทำหรืองดเว้นกระทำการอันหนึ่งอันใดนั้นด้วย"],["384","b2t2","หมวด ๓ มัดจำและกำหนดเบี้ยปรับ","","มาตรา ๓๘๔ ถ้าการชำระหนี้ตามที่สัญญาไว้นั้นไม่สมบูรณ์ การที่ตกลงกันด้วยข้อเบี้ยปรับในการไม่ปฏิบัติตามสัญญานั้นก็ย่อมไม่สมบูรณ์ดุจกัน แม้ถึงคู่กรณีจะได้รู้ว่าข้อสัญญานั้นไม่สมบูรณ์"],["385","b2t2","หมวด ๓ มัดจำและกำหนดเบี้ยปรับ","","มาตรา ๓๘๕ ถ้าลูกหนี้โต้แย้งการริบเบี้ยปรับโดยอ้างเหตุว่าตนได้ชำระหนี้แล้วไซร้ ท่านว่าลูกหนี้จะต้องพิสูจน์การชำระหนี้ เว้นแต่การชำระหนี้อันตนจะต้องทำนั้นเป็นการให้งดเว้นการอันใดอันหนึ่ง"],["386","b2t2","หมวด ๔ เลิกสัญญา","","มาตรา ๓๘๖ ถ้าคู่สัญญาฝ่ายหนึ่งมีสิทธิเลิกสัญญาโดยข้อสัญญาหรือโดยบทบัญญัติแห่งกฎหมาย การเลิกสัญญาเช่นนั้นย่อมทำด้วยแสดงเจตนาแก่อีกฝ่ายหนึ่ง\nแสดงเจตนาดังกล่าวมาในวรรคก่อนนั้น ท่านว่าหาอาจจะถอนได้ไม่"],["387","b2t2","หมวด ๔ เลิกสัญญา","","มาตรา ๓๘๗ ถ้าคู่สัญญาฝ่ายหนึ่งไม่ชำระหนี้ อีกฝ่ายหนึ่งจะกำหนดระยะเวลาพอสมควร แล้วบอกกล่าวให้ฝ่ายนั้นชำระหนี้ภายในระยะเวลานั้นก็ได้ ถ้าและฝ่ายนั้นไม่ชำระหนี้ภายในระยะเวลาที่กำหนดให้ไซร้ อีกฝ่ายหนึ่งจะเลิกสัญญาเสียก็ได้"],["388","b2t2","หมวด ๔ เลิกสัญญา","","มาตรา ๓๘๘ ถ้าวัตถุที่ประสงค์แห่งสัญญานั้น ว่าโดยสภาพหรือโดยเจตนาที่คู่สัญญาได้แสดงไว้ จะเป็นผลสำเร็จได้ก็แต่ด้วยการชำระหนี้ ณ เวลามีกำหนดก็ดี หรือภายในระยะเวลาอันใดอันหนึ่งซึ่งกำหนดไว้ก็ดี และกำหนดเวลาหรือระยะเวลานั้นได้ล่วงพ้นไปโดยฝ่ายใดฝ่ายหนึ่งมิได้ชำระหนี้ไซร้ ท่านว่าอีกฝ่ายหนึ่งจะเลิกสัญญานั้นเสียก็ได้ มิพักต้องบอกกล่าวดังว่าไว้ในมาตราก่อนนั้นเลย"],["389","b2t2","หมวด ๔ เลิกสัญญา","","มาตรา ๓๘๙ ถ้าการชำระหนี้ทั้งหมดหรือแต่บางส่วนกลายเป็นพ้นวิสัยเพราะเหตุอย่างใดอย่างหนึ่งอันจะโทษลูกหนี้ได้ไซร้ เจ้าหนี้จะเลิกสัญญานั้นเสียก็ได้"],["390","b2t2","หมวด ๔ เลิกสัญญา","","มาตรา ๓๙๐ ถ้าในสัญญาใดคู่สัญญาเป็นบุคคลหลายคนด้วยกันอยู่ข้างหนึ่งหรืออีกข้างหนึ่ง ท่านว่าจะใช้สิทธิเลิกสัญญาได้ก็แต่เมื่อบุคคลเหล่านั้นทั้งหมดรวมกันใช้ ทั้งใช้ต่อบุคคลเหล่านั้นรวมหมดทุกคนด้วย ถ้าสิทธิเลิกสัญญาอันมีแก่บุคคลคนหนึ่งในจำพวกที่มีสิทธินั้นเป็นอันระงับสิ้นไปแล้ว สิทธิเลิกสัญญาอันมีแก่คนอื่น ๆ ก็ย่อมระงับสิ้นไปด้วย"],["391","b2t2","หมวด ๔ เลิกสัญญา","","มาตรา ๓๙๑ เมื่อคู่สัญญาฝ่ายหนึ่งได้ใช้สิทธิเลิกสัญญาแล้ว คู่สัญญาแต่ละฝ่ายจำต้องให้อีกฝ่ายหนึ่งได้กลับคืนสู่ฐานะดังที่เป็นอยู่เดิม แต่ทั้งนี้จะให้เป็นที่เสื่อมเสียแก่สิทธิของบุคคลภายนอกหาได้ไม่\nส่วนเงินอันจะต้องใช้คืนในกรณีดังกล่าวมาในวรรคต้นนั้น ท่านให้บวกดอกเบี้ยเข้าด้วย คิดตั้งแต่เวลาที่ได้รับไว้\nส่วนที่เป็นการงานอันได้กระทำให้และเป็นการยอมให้ใช้ทรัพย์นั้น การที่จะชดใช้คืน ท่านให้ทำได้ด้วยใช้เงินตามควรค่าแห่งการนั้น ๆ หรือถ้าในสัญญามีกำหนดว่าให้ใช้เงินตอบแทน ก็ให้ใช้ตามนั้น\nการใช้สิทธิเลิกสัญญานั้นหากระทบกระทั่งถึงสิทธิเรียกร้องค่าเสียหายไม่"],["392","b2t2","หมวด ๔ เลิกสัญญา","","มาตรา ๓๙๒ การชำระหนี้ของคู่สัญญาอันเกิดแต่การเลิกสัญญานั้น ให้เป็นไปตามบทบัญญัติแห่งมาตรา ๓๖๙"],["393","b2t2","หมวด ๔ เลิกสัญญา","","มาตรา ๓๙๓ ถ้ามิได้กำหนดระยะเวลาไว้ให้ใช้สิทธิเลิกสัญญา คู่สัญญาอีกฝ่ายหนึ่งจะกำหนดระยะเวลาพอสมควรแล้วบอกกล่าวให้ฝ่ายที่มีสิทธิเลิกสัญญานั้นแถลงให้ทราบภายในระยะเวลานั้นก็ได้ ว่าจะเลิกสัญญาหรือหาไม่ ถ้ามิได้รับคำบอกกล่าวเลิกสัญญาภายในระยะเวลานั้น สิทธิเลิกสัญญาก็เป็นอันระงับสิ้นไป"],["394","b2t2","หมวด ๔ เลิกสัญญา","","มาตรา ๓๙๔ ถ้าทรัพย์อันเป็นวัตถุแห่งสัญญานั้นบุบสลายไปในส่วนสำคัญเพราะการกระทำหรือเพราะความผิดของบุคคลผู้มีสิทธิเลิกสัญญาก็ดี หรือบุคคลนั้นได้ทำให้การคืนทรัพย์กลายเป็นพ้นวิสัยก็ดี เปลี่ยนแปลงทรัพย์นั้นให้ผิดแผกไปเป็นอย่างอื่นด้วยประกอบขึ้นหรือดัดแปลงก็ดี ท่านว่าสิทธิเลิกสัญญานั้นก็เป็นอันระงับสิ้นไป\nแต่ถ้าทรัพย์อันเป็นวัตถุแห่งสัญญาได้สูญหายหรือบุบสลายไปโดยปราศจากการกระทำหรือความผิดของบุคคลผู้มีสิทธิเลิกสัญญาไซร้ สิทธิเลิกสัญญานั้นก็หาระงับสิ้นไปไม่"],["395","b2t3","","","มาตรา ๓๙๕ บุคคลใดเข้าทำกิจการแทนผู้อื่นโดยเขามิได้ว่าขานวานใช้ให้ทำก็ดี หรือโดยมิได้มีสิทธิที่จะทำการงานนั้นแทนผู้อื่นด้วยประการใดก็ดี ท่านว่าบุคคลนั้นจะต้องจัดการงานไปในทางที่จะให้สมประโยชน์ของตัวการ ตามความประสงค์อันแท้จริงของตัวการ หรือตามที่จะพึงสันนิษฐานได้ว่าเป็นความประสงค์ของตัวการ"],["396","b2t3","","","มาตรา ๓๙๖ ถ้าการที่เข้าจัดการงานนั้นเป็นการขัดกับความประสงค์อันแท้จริงของตัวการก็ดี หรือขัดกับความประสงค์ตามที่จะพึงสันนิษฐานได้ก็ดี และผู้จัดการก็ควรจะได้รู้สึกเช่นนั้นแล้วด้วยไซร้ ท่านว่าผู้จัดการจำต้องใช้ค่าสินไหมทดแทนให้แก่ตัวการเพื่อความเสียหายอย่างใด ๆ อันเกิดแต่ที่ได้เข้าจัดการนั้น แม้ทั้งผู้จัดการจะมิได้มีความผิดประการอื่น"],["397","b2t3","","","มาตรา ๓๙๗ ถ้าผู้จัดการทำกิจอันใดซึ่งเป็นหน้าที่บังคับให้ตัวการทำเพื่อสาธารณประโยชน์ก็ดี หรือเป็นหน้าที่ตามกฎหมายที่จะบำรุงรักษาผู้อื่นก็ดี และหากผู้จัดการมิได้เข้าทำแล้ว กิจอันนั้นจะไม่สำเร็จภายในเวลาอันควรไซร้ การที่ได้ทำขัดกับความประสงค์ของตัวการเช่นนั้นท่านมิให้ยกขึ้นเป็นข้อวินิจฉัย"],["398","b2t3","","","มาตรา ๓๙๘ ถ้าผู้จัดการทำกิจอันใดเพื่อประสงค์จะปัดป้องอันตรายอันมีมาใกล้ตัวการ จะเป็นภัยแก่ตัวก็ดี แก่ชื่อเสียงก็ดี หรือแก่ทรัพย์สินก็ดี ท่านว่าผู้จัดการต้องรับผิดชอบแต่เพียงที่จงใจทำผิด หรือที่เป็นความประมาทเลินเล่ออย่างร้ายแรงเท่านั้น"],["399","b2t3","","","มาตรา ๓๙๙ ผู้จัดการต้องบอกกล่าวแก่ตัวการโดยเร็วที่สุดที่จะทำได้ว่าตนได้เข้าจัดการงานแทน และต้องรอฟังคำวินิจฉัยของตัวการ เว้นแต่ภัยจะมีขึ้นเพราะการที่หน่วงเนิ่นไว้ นอกจากนี้ท่านให้นำบทบัญญัติแห่งมาตรา ๘๐๙ ถึงมาตรา ๘๑๑ อันบังคับแก่ตัวแทนนั้นมาใช้บังคับแก่หน้าที่ของผู้จัดการด้วย โดยอนุโลม"],["400","b2t3","","","มาตรา ๔๐๐ ถ้าผู้จัดการเป็นผู้ไร้ความสามารถ ท่านว่าจะต้องรับผิดชอบแต่เพียงตามบทบัญญัติว่าด้วยค่าสินไหมทดแทนเพื่อละเมิด และว่าด้วยการคืนลาภมิควรได้เท่านั้น"],["401","b2t3","","","มาตรา ๔๐๑ ถ้าการที่เข้าจัดการงานนั้นเป็นการสมประโยชน์ของตัวการ และต้องตามความประสงค์อันแท้จริงของตัวการหรือความประสงค์ตามที่จะพึงสันนิษฐานได้นั้นไซร้ ท่านว่าผู้จัดการจะเรียกให้ชดใช้เงินอันตนได้ออกไปคืนแก่ตนเช่นอย่างตัวแทนก็ได้ และบทบัญญัติมาตรา ๘๑๖ วรรคสอง นั้น ท่านก็ให้นำมาใช้บังคับด้วย โดยอนุโลม\nอนึ่ง ในกรณีที่กล่าวมาในมาตรา ๓๙๗ นั้น แม้ถึงว่าที่เข้าจัดการงานนั้นจะเป็นการขัดกับความประสงค์ของตัวการก็ดี ผู้จัดการก็ยังคงมีสิทธิเรียกร้องเช่นนั้นอยู่"],["402","b2t3","","","มาตรา ๔๐๒ ถ้าเงื่อนไขดังว่ามาในมาตราก่อนนั้นมิได้มี ท่านว่าตัวการจำต้องคืนสิ่งทั้งหลายบรรดาที่ได้มาเพราะเขาเข้าจัดการงานนั้นให้แก่ผู้จัดการ ตามบทบัญญัติว่าด้วยการคืนลาภมิควรได้\nถ้าตัวการให้สัตยาบันแก่การที่จัดทำนั้น ท่านให้นำบทบัญญัติทั้งหลายแห่งประมวลกฎหมายนี้ว่าด้วยตัวแทนมาใช้บังคับ แล้วแต่กรณี"],["403","b2t3","","","มาตรา ๔๐๓ ถ้าผู้จัดการมิได้มีบุรพเจตนาจะเรียกให้ตัวการชดใช้คืน ผู้จัดการก็ย่อมไม่มีสิทธิเรียกร้องเช่นนั้น\nการที่บิดามารดา ปู่ ย่า ตา ยาย บำรุงรักษาผู้สืบสันดานเป็นทางอุปการะก็ดี หรือกลับกันเป็นทางปฏิการะก็ดี เมื่อกรณีเป็นที่สงสัย ท่านให้สันนิษฐานไว้ก่อนว่าไม่มีเจตนาจะเรียกให้ผู้รับประโยชน์ชดใช้คืน"],["404","b2t3","","","มาตรา ๔๐๔ ถ้าผู้จัดการทำแทนผู้หนึ่งโดยสำคัญว่าทำแทนผู้อื่นอีกคนหนึ่งไซร้ ท่านว่าผู้เป็นตัวการคนก่อนผู้เดียวมีสิทธิและหน้าที่อันเกิดแต่การที่ได้จัดทำไปนั้น"],["405","b2t3","","","มาตรา ๔๐๕ บทบัญญัติทั้งหลายที่กล่าวมาในสิบมาตราก่อนนั้น ท่านมิให้ใช้บังคับแก่กรณีที่บุคคลคนหนึ่งเข้าทำการงานของผู้อื่นโดยสำคัญว่าเป็นการงานของตนเอง\nถ้าบุคคลใดถือเอากิจการของผู้อื่นว่าเป็นของตนเองทั้งที่รู้แล้วว่าตนไม่มีสิทธิจะทำเช่นนั้นไซร้ ท่านว่าตัวการจะใช้สิทธิเรียกร้องบังคับโดยมูลดังบัญญัติไว้ในมาตรา ๓๙๕ มาตรา ๓๙๖ มาตรา ๓๙๙ และมาตรา ๔๐๐ นั้นก็ได้ แต่เมื่อได้ใช้สิทธิดังว่ามานี้แล้ว ตัวการจะต้องรับผิดต่อผู้จัดการดังบัญญัติไว้ในมาตรา ๔๐๒ วรรคหนึ่ง"],["406","b2t4","","","มาตรา ๔๐๖ บุคคลใดได้มาซึ่งทรัพย์สิ่งใดเพราะการที่บุคคลอีกคนหนึ่งกระทำเพื่อชำระหนี้ก็ดี หรือได้มาด้วยประการอื่นก็ดี โดยปราศจากมูลอันจะอ้างกฎหมายได้ และเป็นทางให้บุคคลอีกคนหนึ่งนั้นเสียเปรียบไซร้ ท่านว่าบุคคลนั้นจำต้องคืนทรัพย์ให้แก่เขา อนึ่ง การรับสภาพหนี้สินว่ามีอยู่หรือหาไม่นั้น ท่านก็ให้ถือว่าเป็นการกระทำเพื่อชำระหนี้ด้วย\nบทบัญญัติอันนี้ท่านให้ใช้บังคับตลอดถึงกรณีที่ได้ทรัพย์มาเพราะเหตุอย่างใดอย่างหนึ่งซึ่งมิได้มีได้เป็นขึ้น หรือเป็นเหตุที่ได้สิ้นสุดไปเสียก่อนแล้วนั้นด้วย"],["407","b2t4","","","มาตรา ๔๐๗ บุคคลใดได้กระทำการอันใดตามอำเภอใจเหมือนหนึ่งว่าเพื่อชำระหนี้โดยรู้อยู่ว่าตนไม่มีความผูกพันที่จะต้องชำระ ท่านว่าบุคคลผู้นั้นหามีสิทธิจะได้รับคืนทรัพย์ไม่"],["408","b2t4","","","มาตรา ๔๐๘ บุคคลดังจะกล่าวต่อไปนี้ไม่มีสิทธิจะได้รับคืนทรัพย์ คือ\n(๑) บุคคลผู้ชำระหนี้อันมีเงื่อนเวลาบังคับเมื่อก่อนถึงกำหนดเวลานั้น\n(๒) บุคคลผู้ชำระหนี้ซึ่งขาดอายุความแล้ว\n(๓) บุคคลผู้ชำระหนี้ตามหน้าที่ศีลธรรม หรือตามควรแก่อัธยาศัยในสมาคม"],["409","b2t4","","","มาตรา ๔๐๙ เมื่อบุคคลผู้หนึ่งผู้ใดซึ่งมิได้เป็นลูกหนี้ได้ชำระหนี้ไปโดยสำคัญผิด เป็นเหตุให้เจ้าหนี้ผู้ทำการโดยสุจริตได้ทำลาย หรือลบล้างเสียซึ่งเอกสารอันเป็นพยานหลักฐานแห่งหนี้ก็ดี ยกเลิกหลักประกันเสียก็ดี สิ้นสิทธิไปเพราะขาดอายุความก็ดี ท่านว่าเจ้าหนี้ไม่จำต้องคืนทรัพย์\nบทบัญญัติที่กล่าวมาในวรรคก่อนนี้ไม่ขัดขวางต่อการที่บุคคลผู้ได้ชำระหนี้นั้นจะใช้สิทธิไล่เบี้ยเอาแก่ลูกหนี้และผู้ค้ำประกัน ถ้าจะพึงมี"],["410","b2t4","","","มาตรา ๔๑๐ บุคคลผู้ใดได้ทำการชำระหนี้โดยมุ่งต่อผลอย่างหนึ่ง แต่มิได้เกิดผลขึ้นเช่นนั้น ถ้าและบุคคลนั้นได้รู้มาแต่แรกว่าการที่จะเกิดผลนั้นเป็นพ้นวิสัยก็ดี หรือได้เข้าป้องปัดขัดขวางเสียมิให้เกิดผลเช่นนั้นโดยอาการอันฝ่าฝืนความสุจริตก็ดี ท่านว่าบุคคลผู้นั้นไม่มีสิทธิจะได้รับคืนทรัพย์"],["411","b2t4","","","มาตรา ๔๑๑ บุคคลใดได้กระทำการเพื่อชำระหนี้ เป็นการอันฝ่าฝืนข้อห้ามตามกฎหมายหรือศีลธรรมอันดี ท่านว่าบุคคลนั้นหาอาจจะเรียกร้องคืนทรัพย์ได้ไม่"],["412","b2t4","","","มาตรา ๔๑๒ ถ้าทรัพย์สินซึ่งได้รับไว้เป็นลาภมิควรได้นั้นเป็นเงินจำนวนหนึ่ง ท่านว่าต้องคืนเต็มจำนวนนั้น เว้นแต่เมื่อบุคคลได้รับไว้โดยสุจริต จึงต้องคืนลาภมิควรได้เพียงส่วนที่ยังมีอยู่ในขณะเมื่อเรียกคืน"],["413","b2t4","","","มาตรา ๔๑๓ เมื่อทรัพย์สินอันจะต้องคืนนั้นเป็นอย่างอื่นนอกจากจำนวนเงิน และบุคคลได้รับไว้โดยสุจริต ท่านว่าบุคคลเช่นนั้นจำต้องคืนทรัพย์สินเพียงตามสภาพที่เป็นอยู่ และมิต้องรับผิดชอบในการที่ทรัพย์นั้นสูญหายหรือบุบสลาย แต่ถ้าได้อะไรมาเป็นค่าสินไหมทดแทนเพื่อการสูญหายหรือบุบสลายเช่นนั้นก็ต้องให้ไปด้วย\nถ้าบุคคลได้รับทรัพย์สินไว้โดยทุจริต ท่านว่าจะต้องรับผิดชอบในการสูญหายหรือบุบสลายนั้นเต็มภูมิ แม้กระทั่งการสูญหายหรือบุบสลายจะเกิดเพราะเหตุสุดวิสัย เว้นแต่จะพิสูจน์ได้ว่าถึงอย่างไรทรัพย์สินนั้นก็คงต้องสูญหายหรือบุบสลายอยู่นั่นเอง"],["414","b2t4","","","มาตรา ๔๑๔ ถ้าการคืนทรัพย์ตกเป็นพ้นวิสัยเพราะสภาพแห่งทรัพย์สินที่ได้รับไว้นั้นเองก็ดี หรือเพราะเหตุอย่างอื่นก็ดี และบุคคลได้รับทรัพย์สินไว้โดยสุจริต ท่านว่าบุคคลเช่นนั้นจำต้องคืนลาภมิควรได้เพียงส่วนที่ยังมีอยู่ในขณะเมื่อเรียกคืน\nถ้าบุคคลได้รับทรัพย์สินนั้นไว้โดยทุจริต ท่านว่าต้องใช้ราคาทรัพย์สินนั้นเต็มจำนวน"],["415","b2t4","","","มาตรา ๔๑๕ บุคคลผู้ได้รับทรัพย์สินไว้โดยสุจริตย่อมจะได้ดอกผลอันเกิดแต่ทรัพย์สินนั้นตลอดเวลาที่ยังคงสุจริตอยู่\nถ้าผู้ที่ได้รับไว้จะต้องคืนทรัพย์สินนั้นเมื่อใด ให้ถือว่าผู้นั้นตกอยู่ในฐานะทุจริตจำเดิมแต่เวลาที่เรียกคืนนั้น"],["416","b2t4","","","มาตรา ๔๑๖ ค่าใช้จ่ายทั้งหลายอันควรแก่การเพื่อรักษา บำรุงหรือซ่อมแซมทรัพย์สินนั้น ท่านว่าต้องชดใช้แก่บุคคลผู้คืนทรัพย์สินนั้นเต็มจำนวน\nแต่บุคคลเช่นว่านี้จะเรียกร้องให้ชดใช้ค่าใช้จ่ายตามธรรมดาเพื่อบำรุง ซ่อมแซมทรัพย์สินนั้น หรือค่าภาระติดพันที่ต้องเสียไปในระหว่างที่ตนคงเก็บดอกผลอยู่นั้นหาได้ไม่"],["417","b2t4","","","มาตรา ๔๑๗ ในส่วนค่าใช้จ่ายอย่างอื่นนอกจากที่กล่าวมาในวรรคต้นแห่งมาตราก่อนนั้น บุคคลผู้คืนทรัพย์สินจะเรียกให้ชดใช้ได้แต่เฉพาะที่เสียไปในระหว่างที่ตนทำการโดยสุจริต และเมื่อทรัพย์สินนั้นได้มีราคาเพิ่มสูงขึ้นเพราะค่าใช้จ่ายนั้นในเวลาที่คืน และจะเรียกได้ก็แต่เพียงเท่าราคาที่เพิ่มขึ้นเท่านั้น\nอนึ่ง บทบัญญัติแห่งมาตรา ๔๑๕ วรรคสอง นั้น ท่านให้นำมาใช้บังคับด้วย แล้วแต่กรณี"],["418","b2t4","","","มาตรา ๔๑๘ ถ้าบุคคลรับทรัพย์สินอันมิควรได้ไว้โดยทุจริต และได้ทำการดัดแปลงหรือต่อเติมขึ้นในทรัพย์สินนั้น ท่านว่าบุคคลเช่นนั้นต้องจัดทำทรัพย์สินนั้นให้คืนคงสภาพเดิมด้วยค่าใช้จ่ายของตนเองแล้วจึงส่งคืน เว้นแต่เจ้าของทรัพย์สินจะเลือกให้ส่งคืนตามสภาพที่เป็นอยู่ ในกรณีเช่นนี้เจ้าของจะใช้ราคาค่าทำดัดแปลงหรือต่อเติม หรือใช้เงินจำนวนหนึ่งเป็นราคาทรัพย์สินเท่าที่เพิ่มขึ้นนั้นก็ได้ แล้วแต่จะเลือก\nถ้าในเวลาที่จะต้องคืนทรัพย์นั้นเป็นพ้นวิสัยจะทำให้ทรัพย์สินคืนคงสภาพเดิมได้ หรือถ้าทำไปทรัพย์สินนั้นจะบุบสลายไซร้ ท่านว่าบุคคลผู้ได้รับไว้จะต้องส่งคืนทรัพย์สินตามสภาพที่เป็นอยู่ และไม่มีสิทธิเรียกค่าสินไหมทดแทนเพื่อราคาทรัพย์สินที่เพิ่มขึ้นเพราะการดัดแปลงหรือต่อเติมนั้นได้"],["419","b2t4","","","มาตรา ๔๑๙ ในเรื่องลาภมิควรได้นั้น ท่านห้ามมิให้ฟ้องคดีเมื่อพ้นกำหนดปีหนึ่งนับแต่เวลาที่ฝ่ายผู้เสียหายรู้ว่าตนมีสิทธิเรียกคืน หรือเมื่อพ้นสิบปีนับแต่เวลาที่สิทธินั้นได้มีขึ้น"],["420","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๒๐ ผู้ใดจงใจหรือประมาทเลินเล่อ ทำต่อบุคคลอื่นโดยผิดกฎหมายให้เขาเสียหายถึงแก่ชีวิตก็ดี แก่ร่างกายก็ดี อนามัยก็ดี เสรีภาพก็ดี ทรัพย์สินหรือสิทธิอย่างหนึ่งอย่างใดก็ดี ท่านว่าผู้นั้นทำละเมิดจำต้องใช้ค่าสินไหมทดแทนเพื่อการนั้น"],["421","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๒๑ การใช้สิทธิซึ่งมีแต่จะให้เกิดเสียหายแก่บุคคลอื่นนั้น ท่านว่าเป็นการอันมิชอบด้วยกฎหมาย"],["422","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๒๒ ถ้าความเสียหายเกิดแต่การฝ่าฝืนบทบังคับแห่งกฎหมายใดอันมีที่ประสงค์ เพื่อจะปกป้องบุคคลอื่น ๆ ผู้ใดทำการฝ่าฝืนเช่นนั้น ท่านให้สันนิษฐานไว้ก่อนว่าผู้นั้นเป็นผู้ผิด"],["423","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๒๓ ผู้ใดกล่าวหรือไขข่าวแพร่หลายซึ่งข้อความอันฝ่าฝืนต่อความจริง เป็นที่เสียหายแก่ชื่อเสียงหรือเกียรติคุณของบุคคลอื่นก็ดี หรือเป็นที่เสียหายแก่ทางทำมาหาได้หรือทางเจริญของเขาโดยประการอื่นก็ดี ท่านว่าผู้นั้นจะต้องใช้ค่าสินไหมทดแทนให้แก่เขาเพื่อความเสียหายอย่างใด ๆ อันเกิดแต่การนั้น แม้ทั้งเมื่อตนมิได้รู้ว่าข้อความนั้นไม่จริง แต่หากควรจะรู้ได้\nผู้ใดส่งข่าวสารอันตนมิได้รู้ว่าเป็นความไม่จริง หากว่าตนเองหรือผู้รับข่าวสารนั้นมีทางได้เสียโดยชอบในการนั้นด้วยแล้ว ท่านว่าเพียงที่ส่งข่าวสารเช่นนั้นหาทำให้ผู้นั้นต้องรับผิดใช้ค่าสินไหมทดแทนไม่"],["424","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๒๔ ในการพิพากษาคดีข้อความรับผิดเพื่อละเมิดและกำหนดค่าสินไหมทดแทนนั้น ท่านว่าศาลไม่จำต้องดำเนินตามบทบัญญัติแห่งกฎหมายลักษณะอาญาอันว่าด้วยการที่จะต้องรับโทษ และไม่จำต้องพิเคราะห์ถึงการที่ผู้กระทำผิดต้องคำพิพากษาลงโทษทางอาญาหรือไม่"],["425","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๒๕ นายจ้างต้องร่วมกันรับผิดกับลูกจ้างในผลแห่งละเมิดซึ่งลูกจ้างได้กระทำไปในทางการที่จ้างนั้น"],["426","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๒๖ นายจ้างซึ่งได้ใช้ค่าสินไหมทดแทนให้แก่บุคคลภายนอกเพื่อละเมิดอันลูกจ้างได้ทำนั้น ชอบที่จะได้ชดใช้จากลูกจ้างนั้น"],["427","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๒๗ บทบัญญัติในมาตราทั้งสองก่อนนั้น ท่านให้ใช้บังคับแก่ตัวการและตัวแทนด้วย โดยอนุโลม"],["428","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๒๘ ผู้ว่าจ้างทำของไม่ต้องรับผิดเพื่อความเสียหายอันผู้รับจ้างได้ก่อให้เกิดขึ้นแก่บุคคลภายนอกในระหว่างทำการงานที่ว่าจ้าง เว้นแต่ผู้ว่าจ้างจะเป็นผู้ผิดในส่วนการงานที่สั่งให้ทำ หรือในคำสั่งที่ตนให้ไว้ หรือในการเลือกหาผู้รับจ้าง"],["429","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๒๙ บุคคลใดแม้ไร้ความสามารถเพราะเหตุเป็นผู้เยาว์หรือวิกลจริตก็ยังต้องรับผิดในผลที่ตนทำละเมิด บิดามารดาหรือผู้อนุบาลของบุคคลเช่นว่านี้ย่อมต้องรับผิดร่วมกับเขาด้วย เว้นแต่จะพิสูจน์ได้ว่าตนได้ใช้ความระมัดระวังตามสมควรแก่หน้าที่ดูแลซึ่งทำอยู่นั้น"],["430","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๓๐ ครูบาอาจารย์ นายจ้าง หรือบุคคลอื่นซึ่งรับดูแลบุคคลผู้ไร้ความสามารถอยู่เป็นนิตย์ก็ดี ชั่วครั้งคราวก็ดี จำต้องรับผิดร่วมกับผู้ไร้ความสามารถในการละเมิดซึ่งเขาได้กระทำลงในระหว่างที่อยู่ในความดูแลของตน ถ้าหากพิสูจน์ได้ว่าบุคคลนั้น ๆ มิได้ใช้ความระมัดระวังตามสมควร"],["431","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๓๑ ในกรณีที่กล่าวมาในสองมาตราก่อนนั้น ท่านให้นำบทบัญญัติแห่งมาตรา ๔๒๖ มาใช้บังคับด้วย โดยอนุโลม"],["432","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๓๒ ถ้าบุคคลหลายคนก่อให้เกิดเสียหายแก่บุคคลอื่นโดยร่วมกันทำละเมิด ท่านว่าบุคคลเหล่านั้นจะต้องร่วมกันรับผิดใช้ค่าสินไหมทดแทนเพื่อความเสียหายนั้น ความข้อนี้ท่านให้ใช้ตลอดถึงกรณีที่ไม่สามารถสืบรู้ตัวได้แน่ว่าในจำพวกที่ทำละเมิดร่วมกันนั้น คนไหนเป็นผู้ก่อให้เกิดเสียหายนั้นด้วย\nอนึ่ง บุคคลผู้ยุยงส่งเสริมหรือช่วยเหลือในการทำละเมิด ท่านก็ให้ถือว่าเป็นผู้กระทำละเมิดร่วมกันด้วย\nในระหว่างบุคคลทั้งหลายซึ่งต้องรับผิดร่วมกันใช้ค่าสินไหมทดแทนนั้น ท่านว่าต่างต้องรับผิดเป็นส่วนเท่า ๆ กัน เว้นแต่โดยพฤติการณ์ ศาลจะวินิจฉัยเป็นประการอื่น"],["433","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๓๓ ถ้าความเสียหายเกิดขึ้นเพราะสัตว์ ท่านว่าเจ้าของสัตว์หรือบุคคลผู้รับเลี้ยงรับรักษาไว้แทนเจ้าของจำต้องใช้ค่าสินไหมทดแทนให้แก่ฝ่ายที่ต้องเสียหายเพื่อความเสียหายอย่างใด ๆ อันเกิดแต่สัตว์นั้น เว้นแต่จะพิสูจน์ได้ว่าตนได้ใช้ความระมัดระวังอันสมควรแก่การเลี้ยงการรักษาตามชนิดและวิสัยของสัตว์ หรือตามพฤติการณ์อย่างอื่น หรือพิสูจน์ได้ว่าความเสียหายนั้นย่อมจะต้องเกิดมีขึ้นทั้งที่ได้ใช้ความระมัดระวังถึงเพียงนั้น\nอนึ่ง บุคคลผู้ต้องรับผิดชอบดังกล่าวมาในวรรคต้นนั้น จะใช้สิทธิไล่เบี้ยเอาแก่บุคคลผู้ที่เร้าหรือยั่วสัตว์นั้นโดยละเมิด หรือเอาแก่เจ้าของสัตว์อื่นอันมาเร้าหรือยั่วสัตว์นั้น ๆ ก็ได้"],["434","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๓๔ ถ้าความเสียหายเกิดขึ้นเพราะเหตุที่โรงเรือน หรือสิ่งปลูกสร้างอย่างอื่นก่อสร้างไว้ชำรุดบกพร่องก็ดี หรือบำรุงรักษาไม่เพียงพอก็ดี ท่านว่าผู้ครองโรงเรือนหรือสิ่งปลูกสร้างนั้น ๆ จำต้องใช้ค่าสินไหมทดแทน แต่ถ้าผู้ครองได้ใช้ความระมัดระวังตามสมควรเพื่อปัดป้องมิให้เกิดเสียหายฉะนั้นแล้ว ท่านว่าผู้เป็นเจ้าของจำต้องใช้ค่าสินไหมทดแทน\nบทบัญญัติที่กล่าวมาในวรรคก่อนนั้นให้ใช้บังคับได้ตลอดถึงความบกพร่องในการปลูกหรือค้ำจุนต้นไม้หรือกอไผ่ด้วย\nในกรณีที่กล่าวมาในสองวรรคข้างต้นนั้น ถ้ายังมีผู้อื่นอีกที่ต้องรับผิดชอบในการก่อให้เกิดเสียหายนั้นด้วยไซร้ ท่านว่าผู้ครองหรือเจ้าของจะใช้สิทธิไล่เบี้ยเอาแก่ผู้นั้นก็ได้"],["435","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๓๕ บุคคลใดจะประสบความเสียหายอันพึงเกิดจากโรงเรือนหรือสิ่งปลูกสร้างอย่างอื่นของผู้อื่น บุคคลผู้นั้นชอบที่จะเรียกให้จัดการตามที่จำเป็นเพื่อบำบัดปัดป้องภยันตรายนั้นเสียได้"],["436","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๓๖ บุคคลผู้อยู่ในโรงเรือนต้องรับผิดชอบในความเสียหายอันเกิดเพราะของตกหล่นจากโรงเรือนนั้น หรือเพราะทิ้งขว้างของไปตกในที่อันมิควร"],["437","b2t5","หมวด ๑ ความรับผิดเพื่อละเมิด","","มาตรา ๔๓๗ บุคคลใดครอบครองหรือควบคุมดูแลยานพาหนะอย่างใด ๆ อันเดินด้วยกำลังเครื่องจักรกล บุคคลนั้นจะต้องรับผิดชอบเพื่อการเสียหายอันเกิดแต่ยานพาหนะนั้น เว้นแต่จะพิสูจน์ได้ว่าการเสียหายนั้นเกิดแต่เหตุสุดวิสัย หรือเกิดเพราะความผิดของผู้ต้องเสียหายนั้นเอง\nความข้อนี้ให้ใช้บังคับได้ตลอดถึงบุคคลผู้มีไว้ในครอบครองของตนซึ่งทรัพย์อันเป็นของเกิดอันตรายได้โดยสภาพ หรือโดยความมุ่งหมายที่จะใช้ หรือโดยอาการกลไกของทรัพย์นั้นด้วย"],["438","b2t5","หมวด ๒ ค่าสินไหมทดแทนเพื่อละเมิด","","มาตรา ๔๓๘ ค่าสินไหมทดแทนจะพึงใช้โดยสถานใดเพียงใดนั้น ให้ศาลวินิจฉัยตามควรแก่พฤติการณ์และความร้ายแรงแห่งละเมิด\nอนึ่ง ค่าสินไหมทดแทนนั้น ได้แก่การคืนทรัพย์สินอันผู้เสียหายต้องเสียไปเพราะละเมิด หรือใช้ราคาทรัพย์สินนั้น รวมทั้งค่าเสียหายอันจะพึงบังคับให้ใช้เพื่อความเสียหายอย่างใด ๆ อันได้ก่อขึ้นนั้นด้วย"],["439","b2t5","หมวด ๒ ค่าสินไหมทดแทนเพื่อละเมิด","","มาตรา ๔๓๙ บุคคลผู้จำต้องคืนทรัพย์อันผู้อื่นต้องเสียไปเพราะละเมิดแห่งตนนั้น ยังต้องรับผิดชอบตลอดถึงการที่ทรัพย์นั้นทำลายลงโดยอุบัติเหตุ หรือการคืนทรัพย์ตกเป็นพ้นวิสัยเพราะเหตุอย่างอื่นโดยอุบัติเหตุ หรือทรัพย์นั้นเสื่อมเสียลงโดยอุบัติเหตุนั้นด้วย เว้นแต่เมื่อการที่ทรัพย์สินทำลาย หรือตกเป็นพ้นวิสัยจะคืน หรือเสื่อมเสียนั้น ถึงแม้ว่าจะมิได้มีการทำละเมิด ก็คงจะต้องตกไปเป็นไปอย่างนั้นอยู่เอง"],["440","b2t5","หมวด ๒ ค่าสินไหมทดแทนเพื่อละเมิด","","มาตรา ๔๔๐ ในกรณีที่ต้องใช้ราคาทรัพย์อันได้เอาของเขาไปก็ดี ในกรณีที่ต้องใช้ราคาทรัพย์อันลดน้อยลงเพราะบุบสลายก็ดี ฝ่ายผู้ต้องเสียหายจะเรียกดอกเบี้ยในจำนวนเงินที่จะต้องใช้ คิดตั้งแต่เวลาอันเป็นฐานที่ตั้งแห่งการประมาณราคานั้นก็ได้"],["441","b2t5","หมวด ๒ ค่าสินไหมทดแทนเพื่อละเมิด","","มาตรา ๔๔๑ ถ้าบุคคลจำต้องใช้ค่าสินไหมทดแทนเพื่อความเสียหายอย่างใด ๆ เพราะเอาสังหาริมทรัพย์ของเขาไปก็ดี หรือเพราะทำของเขาให้บุบสลายก็ดี เมื่อใช้ค่าสินไหมทดแทนให้แก่บุคคลซึ่งเป็นผู้ครองทรัพย์นั้นอยู่ในขณะที่เอาไป หรือขณะที่ทำให้บุบสลายนั้นแล้ว ท่านว่าเป็นอันหลุดพ้นไปเพราะการที่ได้ใช้ให้เช่นนั้น แม้กระทั่งบุคคลภายนอกจะเป็นเจ้าของทรัพย์หรือมีสิทธิอย่างอื่นเหนือทรัพย์นั้น เว้นแต่สิทธิของบุคคลภายนอกเช่นนั้นจะเป็นที่รู้อยู่แก่ตนหรือมิได้รู้เพราะความประมาทเลินเล่ออย่างร้ายแรงของตน"],["442","b2t5","หมวด ๒ ค่าสินไหมทดแทนเพื่อละเมิด","","มาตรา ๔๔๒ ถ้าความเสียหายได้เกิดขึ้นเพราะความผิดอย่างหนึ่งอย่างใดของผู้ต้องเสียหายประกอบด้วยไซร้ ท่านให้นำบทบัญญัติแห่งมาตรา ๒๒๓ มาใช้บังคับ โดยอนุโลม"],["443","b2t5","หมวด ๒ ค่าสินไหมทดแทนเพื่อละเมิด","","มาตรา ๔๔๓ ในกรณีที่ทำให้เขาถึงตายนั้น ค่าสินไหมทดแทนได้แก่ค่าปลงศพรวมทั้งค่าใช้จ่ายอันจำเป็นอย่างอื่น ๆ อีกด้วย\nถ้ามิได้ตายในทันที ค่าสินไหมทดแทนได้แก่ค่ารักษาพยาบาลรวมทั้งค่าเสียหายที่ต้องขาดประโยชน์ทำมาหาได้เพราะไม่สามารถประกอบการงานนั้นด้วย\nถ้าว่าเหตุที่ตายลงนั้นทำให้บุคคลหนึ่งคนใดต้องขาดไร้อุปการะตามกฎหมายไปด้วยไซร้ ท่านว่าบุคคลคนนั้นชอบที่จะได้รับค่าสินไหมทดแทนเพื่อการนั้น"],["444","b2t5","หมวด ๒ ค่าสินไหมทดแทนเพื่อละเมิด","","มาตรา ๔๔๔ ในกรณีทำให้เสียหายแก่ร่างกายหรืออนามัยนั้น ผู้ต้องเสียหายชอบที่จะได้ชดใช้ค่าใช้จ่ายอันตนต้องเสียไป และค่าเสียหายเพื่อการที่เสียความสามารถประกอบการงานสิ้นเชิงหรือแต่บางส่วน ทั้งในเวลาปัจจุบันนั้นและในเวลาอนาคตด้วย\nถ้าในเวลาที่พิพากษาคดี เป็นพ้นวิสัยจะหยั่งรู้ได้แน่ว่าความเสียหายนั้นได้มีแท้จริงเพียงใด ศาลจะกล่าวในคำพิพากษาว่ายังสงวนไว้ซึ่งสิทธิที่จะแก้ไขคำพิพากษานั้นอีกภายในระยะเวลาไม่เกินสองปีก็ได้"],["445","b2t5","หมวด ๒ ค่าสินไหมทดแทนเพื่อละเมิด","","มาตรา ๔๔๕ ในกรณีทำให้เขาถึงตาย หรือให้เสียหายแก่ร่างกายหรืออนามัยก็ดี ในกรณีทำให้เขาเสียเสรีภาพก็ดี ถ้าผู้ต้องเสียหายมีความผูกพันตามกฎหมายจะต้องทำการงานให้เป็นคุณแก่บุคคลภายนอกในครัวเรือน หรืออุตสาหกรรมของบุคคลภายนอกนั้นไซร้ ท่านว่าบุคคลผู้จำต้องใช้ค่าสินไหมทดแทนนั้นจะต้องใช้ค่าสินไหมทดแทนให้แก่บุคคลภายนอกเพื่อที่เขาต้องขาดแรงงานอันนั้นไปด้วย"],["446","b2t5","หมวด ๒ ค่าสินไหมทดแทนเพื่อละเมิด","","มาตรา ๔๔๖ ในกรณีทำให้เขาเสียหายแก่ร่างกายหรืออนามัยก็ดี ในกรณีทำให้เขาเสียเสรีภาพก็ดี ผู้ต้องเสียหายจะเรียกร้องเอาค่าสินไหมทดแทนเพื่อความที่เสียหายอย่างอื่นอันมิใช่ตัวเงินด้วยอีกก็ได้ สิทธิเรียกร้องอันนี้ไม่โอนกันได้ และไม่ตกสืบไปถึงทายาท เว้นแต่สิทธินั้นจะได้รับสภาพกันไว้โดยสัญญาหรือได้เริ่มฟ้องคดีตามสิทธินั้นแล้ว\nอนึ่ง หญิงที่ต้องเสียหายเพราะผู้ใดทำผิดอาญาเป็นทุรศีลธรรมแก่ตนก็ย่อมมีสิทธิเรียกร้องทำนองเดียวกันนี้"],["447","b2t5","หมวด ๒ ค่าสินไหมทดแทนเพื่อละเมิด","","มาตรา ๔๔๗ บุคคลใดทำให้เขาต้องเสียหายแก่ชื่อเสียง เมื่อผู้ต้องเสียหายร้องขอ ศาลจะสั่งให้บุคคลนั้นจัดการตามควรเพื่อทำให้ชื่อเสียงของผู้นั้นกลับคืนดีแทนให้ใช้ค่าเสียหาย หรือทั้งให้ใช้ค่าเสียหายด้วยก็ได้"],["448","b2t5","หมวด ๒ ค่าสินไหมทดแทนเพื่อละเมิด","","มาตรา ๔๔๘ สิทธิเรียกร้องค่าเสียหายอันเกิดแต่มูลละเมิดนั้น ท่านว่าขาดอายุความเมื่อพ้นปีหนึ่งนับแต่วันที่ผู้ต้องเสียหายรู้ถึงการละเมิดและรู้ตัวผู้จะพึงต้องใช้ค่าสินไหมทดแทน หรือเมื่อพ้นสิบปีนับแต่วันทำละเมิด\nแต่ถ้าเรียกร้องค่าเสียหายในมูลอันเป็นความผิดมีโทษตามกฎหมายลักษณะอาญา และมีกำหนดอายุความทางอาญายาวกว่าที่กล่าวมานั้นไซร้ ท่านให้เอาอายุความที่ยาวกว่านั้นมาบังคับ"],["449","b2t5","หมวด ๓ นิรโทษกรรม","","มาตรา ๔๔๙ บุคคลใดเมื่อกระทำการป้องกันโดยชอบด้วยกฎหมายก็ดี กระทำตามคำสั่งอันชอบด้วยกฎหมายก็ดี หากก่อให้เกิดเสียหายแก่ผู้อื่นไซร้ ท่านว่าบุคคลนั้นหาต้องรับผิดใช้ค่าสินไหมทดแทนไม่\nผู้ต้องเสียหายอาจเรียกค่าสินไหมทดแทนจากผู้เป็นต้นเหตุให้ต้องป้องกันโดยชอบด้วยกฎหมาย หรือจากบุคคลผู้ให้คำสั่งโดยละเมิดนั้นก็ได้"],["450","b2t5","หมวด ๓ นิรโทษกรรม","","มาตรา ๔๕๐ ถ้าบุคคลทำบุบสลาย หรือทำลายทรัพย์สิ่งหนึ่งสิ่งใด เพื่อจะบำบัดปัดป้องภยันตรายซึ่งมีมาเป็นสาธารณะโดยฉุกเฉิน ท่านว่าไม่จำต้องใช้ค่าสินไหมทดแทน หากความเสียหายนั้นไม่เกินสมควรแก่เหตุภยันตราย\nถ้าบุคคลทำบุบสลาย หรือทำลายทรัพย์สิ่งหนึ่งสิ่งใด เพื่อจะบำบัดปัดป้องภยันตรายอันมีแก่เอกชนโดยฉุกเฉิน ผู้นั้นจะต้องใช้คืนทรัพย์นั้น\nถ้าบุคคลทำบุบสลาย หรือทำลายทรัพย์สิ่งหนึ่งสิ่งใด เพื่อจะป้องกันสิทธิของตนหรือของบุคคลภายนอกจากภยันตรายอันมีมาโดยฉุกเฉินเพราะตัวทรัพย์นั้นเองเป็นเหตุ บุคคลเช่นว่านี้หาต้องรับผิดใช้ค่าสินไหมทดแทนไม่ หากว่าความเสียหายนั้นไม่เกินสมควรแก่เหตุ แต่ถ้าภยันตรายนั้นเกิดขึ้นเพราะความผิดของบุคคลนั้นเองแล้ว ท่านว่าจำต้องรับผิดใช้ค่าสินไหมทดแทนให้"],["451","b2t5","หมวด ๓ นิรโทษกรรม","","มาตรา ๔๕๑ บุคคลใช้กำลังเพื่อป้องกันสิทธิของตน ถ้าตามพฤติการณ์จะขอให้ศาลหรือเจ้าหน้าที่ช่วยเหลือให้ทันท่วงทีไม่ได้ และถ้ามิได้ทำในทันใด ภัยมีอยู่ด้วยการที่ตนจะได้สมดังสิทธินั้นจะต้องประวิงไปมากหรือถึงแก่สาบสูญได้ไซร้ ท่านว่าบุคคลนั้นหาต้องรับผิดใช้ค่าสินไหมทดแทนไม่\nการใช้กำลังดังกล่าวมาในวรรคก่อนนั้น ท่านว่าต้องจำกัดครัดเคร่งแต่เฉพาะที่จำเป็นเพื่อจะบำบัดปัดป้องภยันตรายเท่านั้น\nถ้าบุคคลผู้ใดกระทำการดังกล่าวมาในวรรคต้น เพราะหลงสันนิษฐานพลาดไปว่ามีเหตุอันจำเป็นที่จะทำได้โดยชอบด้วยกฎหมายไซร้ ท่านว่าผู้นั้นจะต้องรับผิดใช้ค่าสินไหมทดแทนให้แก่บุคคลอื่น แม้ทั้งการที่หลงพลาดไปนั้นจะมิใช่เป็นเพราะความประมาทเลินเล่อของตน"],["452","b2t5","หมวด ๓ นิรโทษกรรม","","มาตรา ๔๕๒ ผู้ครองอสังหาริมทรัพย์ชอบที่จะจับสัตว์ของผู้อื่นอันเข้ามาทำความเสียหายในอสังหาริมทรัพย์นั้น และยึดไว้เป็นประกันค่าสินไหมทดแทนอันจะพึงต้องใช้แก่ตนได้ และถ้าเป็นการจำเป็นโดยพฤติการณ์ แม้จะฆ่าสัตว์นั้นเสียก็ชอบที่จะทำได้\nแต่ว่าผู้นั้นต้องบอกกล่าวแก่เจ้าของสัตว์โดยไม่ชักช้า ถ้าและหาตัวเจ้าของสัตว์ไม่พบ ผู้ที่จับสัตว์ไว้ต้องจัดการตามสมควรเพื่อสืบหาตัวเจ้าของ"],["453","b3t1","หมวด ๑ สภาพและหลักสำคัญของสัญญาซื้อขาย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๔๕๓ อันว่าซื้อขายนั้น คือสัญญาซึ่งบุคคลฝ่ายหนึ่ง เรียกว่าผู้ขาย โอนกรรมสิทธิ์แห่งทรัพย์สินให้แก่บุคคลอีกฝ่ายหนึ่ง เรียกว่าผู้ซื้อ และผู้ซื้อตกลงว่าจะใช้ราคาทรัพย์สินนั้นให้แก่ผู้ขาย"],["454","b3t1","หมวด ๑ สภาพและหลักสำคัญของสัญญาซื้อขาย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๔๕๔ การที่คู่กรณีฝ่ายหนึ่งให้คำมั่นไว้ก่อนว่าจะซื้อหรือขายนั้น จะมีผลเป็นการซื้อขายต่อเมื่ออีกฝ่ายหนึ่งได้บอกกล่าวความจำนงว่าจะทำการซื้อขายนั้นให้สำเร็จตลอดไป และคำบอกกล่าวเช่นนั้นได้ไปถึงบุคคลผู้ให้คำมั่นแล้ว\nถ้าในคำมั่นมิได้กำหนดเวลาไว้เพื่อการบอกกล่าวเช่นนั้นไซร้ ท่านว่าบุคคลผู้ให้คำมั่นจะกำหนดเวลาพอสมควร และบอกกล่าวไปยังคู่กรณีอีกฝ่ายหนึ่งให้ตอบมาเป็นแน่นอนภายในเวลากำหนดนั้นก็ได้ ว่าจะทำการซื้อขายให้สำเร็จตลอดไปหรือไม่ ถ้าและไม่ตอบเป็นแน่นอนภายในกำหนดเวลานั้นไซร้ คำมั่นซึ่งได้ให้ไว้ก่อนนั้นก็เป็นอันไร้ผล"],["455","b3t1","หมวด ๑ สภาพและหลักสำคัญของสัญญาซื้อขาย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๔๕๕ เมื่อกล่าวต่อไปเบื้องหน้าถึงเวลาซื้อขาย ท่านหมายความว่าเวลาซึ่งทำสัญญาซื้อขายสำเร็จบริบูรณ์"],["456","b3t1","หมวด ๑ สภาพและหลักสำคัญของสัญญาซื้อขาย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๔๕๖ การซื้อขายอสังหาริมทรัพย์ ถ้ามิได้ทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่เป็นโมฆะ วิธีนี้ให้ใช้ถึงซื้อขายเรือมีระวางตั้งแต่ห้าตันขึ้นไป ทั้งซื้อขายแพและสัตว์พาหนะด้วย\nสัญญาจะขายหรือจะซื้อ หรือคำมั่นในการซื้อขายทรัพย์สินตามที่ระบุไว้ในวรรคหนึ่ง ถ้ามิได้มีหลักฐานเป็นหนังสืออย่างหนึ่งอย่างใดลงลายมือชื่อฝ่ายผู้ต้องรับผิดเป็นสำคัญ หรือได้วางประจำไว้หรือได้ชำระหนี้บางส่วนแล้ว จะฟ้องร้องให้บังคับคดีหาได้ไม่\nบทบัญญัติที่กล่าวมาในวรรคก่อนนี้ ให้ใช้บังคับถึงสัญญาซื้อขายสังหาริมทรัพย์ซึ่งตกลงกันเป็นราคาสองหมื่นบาท หรือกว่านั้นขึ้นไปด้วย"],["457","b3t1","หมวด ๑ สภาพและหลักสำคัญของสัญญาซื้อขาย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๔๕๗ ค่าฤชาธรรมเนียมทำสัญญาซื้อขายนั้น ผู้ซื้อผู้ขายพึงออกใช้เท่ากันทั้งสองฝ่าย"],["458","b3t1","หมวด ๑ สภาพและหลักสำคัญของสัญญาซื้อขาย","ส่วนที่ ๒ การโอนกรรมสิทธิ์","มาตรา ๔๕๘ กรรมสิทธิ์ในทรัพย์สินที่ขายนั้น ย่อมโอนไปยังผู้ซื้อตั้งแต่ขณะเมื่อได้ทำสัญญาซื้อขายกัน"],["459","b3t1","หมวด ๑ สภาพและหลักสำคัญของสัญญาซื้อขาย","ส่วนที่ ๒ การโอนกรรมสิทธิ์","มาตรา ๔๕๙ ถ้าสัญญาซื้อขายมีเงื่อนไข หรือเงื่อนเวลาบังคับไว้ ท่านว่ากรรมสิทธิ์ในทรัพย์สินยังไม่โอนไปจนกว่าการจะได้เป็นไปตามเงื่อนไข หรือถึงกำหนดเงื่อนเวลานั้น"],["460","b3t1","หมวด ๑ สภาพและหลักสำคัญของสัญญาซื้อขาย","ส่วนที่ ๒ การโอนกรรมสิทธิ์","มาตรา ๔๖๐ ในการซื้อขายทรัพย์สินซึ่งมิได้กำหนดลงไว้แน่นอนนั้น ท่านว่ากรรมสิทธิ์ยังไม่โอนไปจนกว่าจะได้หมาย หรือนับ ชั่ง ตวง วัด หรือคัดเลือก หรือทำโดยวิธีอื่นเพื่อให้บ่งตัวทรัพย์สินนั้นออกเป็นแน่นอนแล้ว\nในการซื้อขายทรัพย์สินเฉพาะสิ่ง ถ้าผู้ขายยังจะต้องนับ ชั่ง ตวง วัด หรือทำการอย่างอื่น หรือทำสิ่งหนึ่งสิ่งใดอันเกี่ยวแก่ทรัพย์สินเพื่อให้รู้กำหนดราคาทรัพย์สินนั้นแน่นอน ท่านว่ากรรมสิทธิ์ยังไม่โอนไปยังผู้ซื้อจนกว่าการหรือสิ่งนั้นได้ทำแล้ว"],["461","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๑ การส่งมอบ","มาตรา ๔๖๑ ผู้ขายจำต้องส่งมอบทรัพย์สินซึ่งขายนั้นให้แก่ผู้ซื้อ"],["462","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๑ การส่งมอบ","มาตรา ๔๖๒ การส่งมอบนั้นจะทำอย่างหนึ่งอย่างใดก็ได้สุดแต่ว่าเป็นผลให้ทรัพย์สินนั้นไปอยู่ในเงื้อมมือของผู้ซื้อ"],["463","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๑ การส่งมอบ","มาตรา ๔๖๓ ถ้าในสัญญากำหนดว่าให้ส่งทรัพย์สินซึ่งขายนั้นจากที่แห่งหนึ่งไปถึงอีกแห่งหนึ่งไซร้ ท่านว่าการส่งมอบย่อมสำเร็จเมื่อได้ส่งมอบทรัพย์สินนั้นให้แก่ผู้ขนส่ง"],["464","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๑ การส่งมอบ","มาตรา ๔๖๔ ค่าขนส่งทรัพย์สินซึ่งได้ซื้อขายกันไปยังที่แห่งอื่น นอกจากสถานที่อันพึงชำระหนี้นั้น ผู้ซื้อพึงออกใช้"],["465","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๑ การส่งมอบ","มาตรา ๔๖๕ ในการซื้อขายสังหาริมทรัพย์นั้น\n(๑) หากว่าผู้ขายส่งมอบทรัพย์สินน้อยกว่าที่ได้สัญญาไว้ ท่านว่าผู้ซื้อจะปัดเสียไม่รับเอาเลยก็ได้ แต่ถ้าผู้ซื้อรับเอาทรัพย์สินนั้นไว้ ผู้ซื้อก็ต้องใช้ราคาตามส่วน\n(๒) หากว่าผู้ขายส่งมอบทรัพย์สินมากกว่าที่ได้สัญญาไว้ ท่านว่าผู้ซื้อจะรับเอาทรัพย์สินนั้นไว้แต่เพียงตามสัญญาและนอกกว่านั้นปัดเสียก็ได้ หรือจะปัดเสียทั้งหมดไม่รับเอาไว้เลยก็ได้ ถ้าผู้ซื้อรับเอาทรัพย์สินอันเขาส่งมอบเช่นนั้นไว้ทั้งหมด ผู้ซื้อก็ต้องใช้ราคาตามส่วน\n(๓) หากว่าผู้ขายส่งมอบทรัพย์สินตามที่ได้สัญญาไว้ ระคนกับทรัพย์สินอย่างอื่นอันมิได้รวมอยู่ในข้อสัญญาไซร้ ท่านว่าผู้ซื้อจะรับเอาทรัพย์สินไว้แต่ตามสัญญา และนอกกว่านั้นปัดเสียก็ได้ หรือจะปัดเสียทั้งหมดก็ได้"],["466","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๑ การส่งมอบ","มาตรา ๔๖๖ ในการซื้อขายอสังหาริมทรัพย์นั้น หากว่าได้ระบุจำนวนเนื้อที่ทั้งหมดไว้ และผู้ขายส่งมอบทรัพย์สินน้อยหรือมากไปกว่าที่ได้สัญญาไซร้ ท่านว่าผู้ซื้อจะปัดเสีย หรือจะรับเอาไว้และใช้ราคาตามส่วนก็ได้ ตามแต่จะเลือก\nอนึ่ง ถ้าขาดตกบกพร่องหรือล้ำจำนวนไม่เกินกว่าร้อยละห้าแห่งเนื้อที่ทั้งหมดอันได้ระบุไว้นั้นไซร้ ท่านว่าผู้ซื้อจำต้องรับเอาและใช้ราคาตามส่วน แต่ว่าผู้ซื้ออาจจะเลิกสัญญาเสียได้ในเมื่อขาดตกบกพร่องหรือล้ำจำนวนถึงขนาดซึ่งหากผู้ซื้อได้ทราบก่อนแล้วคงจะมิได้เข้าทำสัญญานั้น"],["467","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๑ การส่งมอบ","มาตรา ๔๖๗ ในข้อรับผิดเพื่อการที่ทรัพย์ขาดตกบกพร่องหรือล้ำจำนวนนั้น ท่านห้ามมิให้ฟ้องคดีเมื่อพ้นกำหนดปีหนึ่งนับแต่เวลาส่งมอบ"],["468","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๑ การส่งมอบ","มาตรา ๔๖๘ ถ้าในสัญญาไม่มีกำหนดเงื่อนเวลาให้ใช้ราคาไซร้ ผู้ขายชอบที่จะยึดหน่วงทรัพย์สินที่ขายไว้ได้จนกว่าจะใช้ราคา"],["469","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๑ การส่งมอบ","มาตรา ๔๖๙ ถ้าผู้ซื้อล้มละลายก่อนส่งมอบทรัพย์สินก็ดี หรือผู้ซื้อเป็นคนล้มละลายแล้วในเวลาซื้อขายโดยผู้ขายไม่รู้ก็ดี หรือผู้ซื้อกระทำให้หลักทรัพย์ที่ให้ไว้เพื่อประกันการใช้เงินนั้นเสื่อมเสียหรือลดน้อยลงก็ดี ถึงแม้ในสัญญาจะมีกำหนดเงื่อนเวลาให้ใช้ราคา ผู้ขายก็ชอบที่จะยึดหน่วงทรัพย์สินซึ่งขายไว้ได้ เว้นแต่ผู้ซื้อจะหาประกันที่สมควรให้ได้"],["470","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๑ การส่งมอบ","มาตรา ๔๗๐ ถ้าผู้ซื้อผิดนัด ผู้ขายซึ่งได้ยึดหน่วงทรัพย์สินไว้ตามมาตราทั้งหลายที่กล่าวมา อาจจะใช้ทางแก้ต่อไปนี้แทนทางแก้สามัญในการไม่ชำระหนี้ได้ คือมีจดหมายบอกกล่าวไปยังผู้ซื้อให้ใช้ราคากับทั้งค่าจับจ่ายเกี่ยวการภายในเวลาอันควรซึ่งต้องกำหนดลงไว้ในคำบอกกล่าวนั้นด้วย\nถ้าผู้ซื้อละเลยเสียไม่ทำตามคำบอกกล่าว ผู้ขายอาจนำทรัพย์สินนั้นออกขายทอดตลาดได้"],["471","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๑ การส่งมอบ","มาตรา ๔๗๑ เมื่อขายทอดตลาดได้เงินเป็นจำนวนสุทธิเท่าใด ให้ผู้ขายหักเอาจำนวนที่ค้างชำระแก่ตนเพื่อราคาและค่าจับจ่ายเกี่ยวการนั้นไว้ ถ้าและยังมีเงินเหลือ ก็ให้ส่งมอบแก่ผู้ซื้อโดยพลัน"],["472","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๒ ความรับผิดเพื่อชำรุดบกพร่อง","มาตรา ๔๗๒ ในกรณีที่ทรัพย์สินซึ่งขายนั้นชำรุดบกพร่องอย่างหนึ่งอย่างใด อันเป็นเหตุให้เสื่อมราคาหรือเสื่อมความเหมาะสมแก่ประโยชน์อันมุ่งจะใช้เป็นปกติก็ดี ประโยชน์ที่มุ่งหมายโดยสัญญาก็ดี ท่านว่าผู้ขายต้องรับผิด\nความที่กล่าวมาในมาตรานี้ย่อมใช้ได้ ทั้งที่ผู้ขายรู้อยู่แล้วหรือไม่รู้ว่าความชำรุดบกพร่องมีอยู่"],["473","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๒ ความรับผิดเพื่อชำรุดบกพร่อง","มาตรา ๔๗๓ ผู้ขายย่อมไม่ต้องรับผิดในกรณีดังจะกล่าวต่อไปนี้ คือ\n(๑) ถ้าผู้ซื้อได้รู้อยู่แล้วแต่ในเวลาซื้อขายว่ามีความชำรุดบกพร่อง หรือควรจะได้รู้เช่นนั้นหากได้ใช้ความระมัดระวังอันจะพึงคาดหมายได้แต่วิญญูชน\n(๒) ถ้าความชำรุดบกพร่องนั้นเป็นอันเห็นประจักษ์แล้วในเวลาส่งมอบ และผู้ซื้อรับเอาทรัพย์สินนั้นไว้โดยมิได้อิดเอื้อน\n(๓) ถ้าทรัพย์สินนั้นได้ขายทอดตลาด"],["474","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๒ ความรับผิดเพื่อชำรุดบกพร่อง","มาตรา ๔๗๔ ในข้อรับผิดเพื่อชำรุดบกพร่องนั้น ท่านห้ามมิให้ฟ้องคดีเมื่อพ้นเวลาปีหนึ่งนับแต่เวลาที่ได้พบเห็นความชำรุดบกพร่อง"],["475","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๓ ความรับผิดในการรอนสิทธิ","มาตรา ๔๗๕ หากว่าบุคคลผู้ใดมาก่อการรบกวนขัดสิทธิของผู้ซื้อในอันจะครองทรัพย์สินโดยปกติสุข เพราะบุคคลผู้นั้นมีสิทธิเหนือทรัพย์สินที่ได้ซื้อขายกันนั้นอยู่ในเวลาซื้อขายก็ดี เพราะความผิดของผู้ขายก็ดี ท่านว่าผู้ขายจะต้องรับผิดในผลอันนั้น"],["476","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๓ ความรับผิดในการรอนสิทธิ","มาตรา ๔๗๖ ถ้าสิทธิของผู้ก่อการรบกวนนั้นผู้ซื้อรู้อยู่แล้วในเวลาซื้อขาย ท่านว่าผู้ขายไม่ต้องรับผิด"],["477","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๓ ความรับผิดในการรอนสิทธิ","มาตรา ๔๗๗ เมื่อใดการรบกวนขัดสิทธินั้นเกิดเป็นคดีขึ้นระหว่างผู้ซื้อกับบุคคลภายนอก ผู้ซื้อชอบที่จะขอให้ศาลเรียกผู้ขายเข้าเป็นจำเลยร่วมหรือเป็นโจทก์ร่วมกับผู้ซื้อในคดีนั้นได้ เพื่อศาลจะได้วินิจฉัยชี้ขาดข้อพิพาทระหว่างผู้เป็นคู่กรณีทั้งหลายรวมไปเป็นคดีเดียวกัน"],["478","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๓ ความรับผิดในการรอนสิทธิ","มาตรา ๔๗๘ ถ้าผู้ขายเห็นเป็นการสมควร จะสอดเข้าไปในคดีเพื่อปฏิเสธการเรียกร้องของบุคคลภายนอก ก็ชอบที่จะทำได้ด้วย"],["479","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๓ ความรับผิดในการรอนสิทธิ","มาตรา ๔๗๙ ถ้าทรัพย์สินซึ่งซื้อขายกันหลุดไปจากผู้ซื้อทั้งหมดหรือแต่บางส่วน เพราะเหตุการรอนสิทธิก็ดี หรือว่าทรัพย์สินนั้นตกอยู่ในบังคับแห่งสิทธิอย่างหนึ่งอย่างใดซึ่งเป็นเหตุให้เสื่อมราคา หรือเสื่อมความเหมาะสมแก่การที่จะใช้ หรือเสื่อมความสะดวกในการใช้สอย หรือเสื่อมประโยชน์อันจะพึงได้แต่ทรัพย์สินนั้น และซึ่งผู้ซื้อหาได้รู้ในเวลาซื้อขายไม่ก็ดี ท่านว่าผู้ขายต้องรับผิด"],["480","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๓ ความรับผิดในการรอนสิทธิ","มาตรา ๔๘๐ ถ้าอสังหาริมทรัพย์ต้องศาลแสดงว่าตกอยู่ในบังคับแห่งภาระจำยอมโดยกฎหมายไซร้ ท่านว่าผู้ขายไม่ต้องรับผิด เว้นไว้แต่ผู้ขายจะได้รับรองไว้ในสัญญาว่าทรัพย์สินนั้นปลอดจากภาระจำยอมอย่างใด ๆ ทั้งสิ้น หรือปลอดจากภาระจำยอมอันนั้น"],["481","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๓ ความรับผิดในการรอนสิทธิ","มาตรา ๔๘๑ ถ้าผู้ขายไม่ได้เป็นคู่ความในคดีเดิม หรือถ้าผู้ซื้อได้ประนีประนอมยอมความกับบุคคลภายนอก หรือยอมตามที่บุคคลภายนอกเรียกร้องไซร้ ท่านห้ามมิให้ฟ้องคดีในข้อรับผิดเพื่อการรอนสิทธิเมื่อพ้นกำหนดสามเดือนนับแต่วันคำพิพากษาในคดีเดิมถึงที่สุด หรือนับแต่วันประนีประนอมยอมความ หรือวันที่ยอมตามบุคคลภายนอกเรียกร้องนั้น"],["482","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๓ ความรับผิดในการรอนสิทธิ","มาตรา ๔๘๒ ผู้ขายไม่ต้องรับผิดในการรอนสิทธิเมื่อกรณีเป็นดังกล่าวต่อไปนี้ คือ\n(๑) ถ้าไม่มีการฟ้องคดี และผู้ขายพิสูจน์ได้ว่าสิทธิของผู้ซื้อได้สูญไปโดยความผิดของผู้ซื้อเอง หรือ\n(๒) ถ้าผู้ซื้อไม่ได้เรียกผู้ขายเข้ามาในคดี และผู้ขายพิสูจน์ได้ว่า ถ้าได้เรียกเข้ามาในคดีฝ่ายผู้ซื้อจะชนะ หรือ\n(๓) ถ้าผู้ขายได้เข้ามาในคดี แต่ศาลได้ยกคำเรียกร้องของผู้ซื้อเสียเพราะความผิดของผู้ซื้อเอง\nแต่ถึงกรณีจะเป็นอย่างไรก็ดี ถ้าผู้ขายถูกศาลหมายเรียกให้เข้ามาในคดีและไม่ยอมเข้าว่าคดีร่วมเป็นจำเลยหรือร่วมเป็นโจทก์กับผู้ซื้อไซร้ ท่านว่าผู้ขายคงต้องรับผิด"],["483","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๔ ข้อสัญญาว่าจะไม่ต้องรับผิด","มาตรา ๔๘๓ คู่สัญญาซื้อขายจะตกลงกันว่าผู้ขายจะไม่ต้องรับผิดเพื่อความชำรุดบกพร่องหรือเพื่อการรอนสิทธิก็ได้"],["484","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๔ ข้อสัญญาว่าจะไม่ต้องรับผิด","มาตรา ๔๘๔ ข้อสัญญาว่าจะไม่ต้องรับผิดนั้น ย่อมไม่คุ้มผู้ขายให้พ้นจากการต้องส่งเงินคืนตามราคา เว้นแต่จะได้ระบุไว้เป็นอย่างอื่น"],["485","b3t1","หมวด ๒ หน้าที่และความรับผิดของผู้ขาย","ส่วนที่ ๔ ข้อสัญญาว่าจะไม่ต้องรับผิด","มาตรา ๔๘๕ ข้อสัญญาว่าจะไม่ต้องรับผิดนั้น ไม่อาจคุ้มความรับผิดของผู้ขายในผลของการอันผู้ขายได้กระทำไปเอง หรือผลแห่งข้อความจริงอันผู้ขายได้รู้อยู่แล้วและปกปิดเสีย"],["486","b3t1","หมวด ๓ หน้าที่ของผู้ซื้อ","","มาตรา ๔๘๖ ผู้ซื้อจำต้องรับมอบทรัพย์สินที่ตนได้รับซื้อและใช้ราคาตามข้อสัญญาซื้อขาย"],["487","b3t1","หมวด ๓ หน้าที่ของผู้ซื้อ","","มาตรา ๔๘๗ อันราคาทรัพย์สินที่ขายนั้นจะกำหนดลงไว้ในสัญญาก็ได้ หรือจะปล่อยไปให้กำหนดกันด้วยวิธีอย่างใดอย่างหนึ่งดังได้ตกลงกันไว้ในสัญญานั้นก็ได้ หรือจะถือเอาตามทางการที่คู่สัญญาประพฤติต่อกันอยู่นั้นก็ได้\nถ้าราคามิได้กำหนดเด็ดขาดอย่างใดดังว่ามานั้นไซร้ ท่านว่าผู้ซื้อจะต้องใช้ราคาตามสมควร"],["488","b3t1","หมวด ๓ หน้าที่ของผู้ซื้อ","","มาตรา ๔๘๘ ถ้าผู้ซื้อพบเห็นความชำรุดบกพร่องในทรัพย์สินซึ่งตนได้รับซื้อ ผู้ซื้อชอบที่จะยึดหน่วงราคาที่ยังไม่ได้ชำระไว้ได้ทั้งหมดหรือแต่บางส่วน เว้นแต่ผู้ขายจะหาประกันที่สมควรให้ได้"],["489","b3t1","หมวด ๓ หน้าที่ของผู้ซื้อ","","มาตรา ๔๘๙ ถ้าผู้ซื้อถูกผู้รับจำนองหรือบุคคลผู้เรียกร้องเอาทรัพย์สินที่ขายนั้นขู่ว่าจะฟ้องเป็นคดีขึ้นก็ดี หรือมีเหตุอันควรเชื่อว่าจะถูกขู่เช่นนั้นก็ดี ผู้ซื้อก็ชอบที่จะยึดหน่วงราคาไว้ทั้งหมดหรือบางส่วนได้ดุจกัน จนกว่าผู้ขายจะได้บำบัดภัยอันนั้นให้สิ้นไป หรือจนกว่าผู้ขายจะหาประกันที่สมควรให้ได้"],["490","b3t1","หมวด ๓ หน้าที่ของผู้ซื้อ","","มาตรา ๔๙๐ ถ้าได้กำหนดกันไว้ว่าให้ส่งมอบทรัพย์สินซึ่งขายนั้นเวลาใด ท่านให้สันนิษฐานไว้ก่อนว่าเวลาอันเดียวกันนั้นเองเป็นเวลากำหนดใช้ราคา"],["491","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๑ ขายฝาก","มาตรา ๔๙๑ อันว่าขายฝากนั้น คือสัญญาซื้อขายซึ่งกรรมสิทธิ์ในทรัพย์สินตกไปยังผู้ซื้อ โดยมีข้อตกลงกันว่าผู้ขายอาจไถ่ทรัพย์นั้นคืนได้"],["492","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๑ ขายฝาก","มาตรา ๔๙๒ ในกรณีที่มีการไถ่ทรัพย์สินซึ่งขายฝากภายในเวลาที่กำหนดไว้ในสัญญาหรือภายในเวลาที่กฎหมายกำหนด หรือผู้ไถ่ได้วางทรัพย์อันเป็นสินไถ่ต่อสำนักงานวางทรัพย์ภายในกำหนดเวลาไถ่โดยสละสิทธิถอนทรัพย์ที่ได้วางไว้ ให้ทรัพย์สินซึ่งขายฝากตกเป็นกรรมสิทธิ์ของผู้ไถ่ตั้งแต่เวลาที่ผู้ไถ่ได้ชำระสินไถ่หรือวางทรัพย์อันเป็นสินไถ่ แล้วแต่กรณี\nในกรณีที่ได้วางทรัพย์ตามวรรคหนึ่ง ให้เจ้าพนักงานของสำนักงานวางทรัพย์แจ้งให้ผู้รับไถ่ทราบถึงการวางทรัพย์โดยพลัน โดยผู้ไถ่ไม่ต้องปฏิบัติตามมาตรา ๓๓๓ วรรคสาม"],["493","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๑ ขายฝาก","มาตรา ๔๙๓ ในการขายฝาก คู่สัญญาจะตกลงกันไม่ให้ผู้ซื้อจำหน่ายทรัพย์สินซึ่งขายฝากก็ได้ ถ้าและผู้ซื้อจำหน่ายทรัพย์สินนั้นฝ่าฝืนสัญญาไซร้ ก็ต้องรับผิดต่อผู้ขายในความเสียหายใด ๆ อันเกิดแต่การนั้น"],["494","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๑ ขายฝาก","มาตรา ๔๙๔ ท่านห้ามมิให้ใช้สิทธิไถ่ทรัพย์สินซึ่งขายฝากเมื่อพ้นเวลาดังจะกล่าวต่อไปนี้\n(๑) ถ้าเป็นอสังหาริมทรัพย์ กำหนดสิบปีนับแต่เวลาซื้อขาย\n(๒) ถ้าเป็นสังหาริมทรัพย์ กำหนดสามปีนับแต่เวลาซื้อขาย"],["495","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๑ ขายฝาก","มาตรา ๔๙๕ ถ้าในสัญญามีกำหนดเวลาไถ่เกินไปกว่านั้น ท่านให้ลดลงมาเป็นสิบปีและสามปีตามประเภททรัพย์"],["496","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๑ ขายฝาก","มาตรา ๔๙๖ กำหนดเวลาไถ่นั้น อาจทำสัญญาขยายกำหนดเวลาไถ่ได้ แต่กำหนดเวลาไถ่รวมกันทั้งหมด ถ้าเกินกำหนดเวลาตามมาตรา ๔๙๔ ให้ลดลงมาเป็นกำหนดเวลาตามมาตรา ๔๙๔\nการขยายกำหนดเวลาไถ่ตามวรรคหนึ่งอย่างน้อยต้องมีหลักฐานเป็นหนังสือลงลายมือชื่อผู้รับไถ่ ถ้าเป็นทรัพย์สินซึ่งการซื้อขายกันจะต้องทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่ ห้ามมิให้ยกการขยายเวลาขึ้นเป็นข้อต่อสู้บุคคลภายนอกผู้ได้สิทธิมาโดยเสียค่าตอบแทนและโดยสุจริต และได้จดทะเบียนสิทธิโดยสุจริตแล้ว เว้นแต่จะได้นำหนังสือหรือหลักฐานเป็นหนังสือดังกล่าวไปจดทะเบียนหรือจดแจ้งต่อพนักงานเจ้าหน้าที่"],["497","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๑ ขายฝาก","มาตรา ๔๙๗ สิทธิในการไถ่ทรัพย์สินนั้น จะพึงใช้ได้แต่บุคคลเหล่านี้ คือ\n(๑) ผู้ขายเดิม หรือทายาทของผู้ขายเดิม หรือ\n(๒) ผู้รับโอนสิทธินั้น หรือ\n(๓) บุคคลซึ่งในสัญญายอมไว้โดยเฉพาะว่าให้เป็นผู้ไถ่ได้"],["498","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๑ ขายฝาก","มาตรา ๔๙๘ สิทธิในการไถ่ทรัพย์สินนั้น จะพึงใช้ได้เฉพาะต่อบุคคลเหล่านี้ คือ\n(๑) ผู้ซื้อเดิม หรือทายาทของผู้ซื้อเดิม หรือ\n(๒) ผู้รับโอนทรัพย์สิน หรือรับโอนสิทธิเหนือทรัพย์สินนั้น แต่ในข้อนี้ถ้าเป็นสังหาริมทรัพย์จะใช้สิทธิได้ต่อเมื่อผู้รับโอนได้รู้ในเวลาโอน ว่าทรัพย์สินตกอยู่ในบังคับแห่งสิทธิไถ่คืน"],["499","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๑ ขายฝาก","มาตรา ๔๙๙ สินไถ่นั้น ถ้าไม่ได้กำหนดกันไว้ว่าเท่าใดไซร้ ท่านให้ไถ่ตามราคาที่ขายฝาก\nถ้าปรากฏในเวลาไถ่ว่าสินไถ่หรือราคาขายฝากที่กำหนดไว้สูงกว่าราคาขายฝากที่แท้จริงเกินอัตราร้อยละสิบห้าต่อปี ให้ไถ่ได้ตามราคาขายฝากที่แท้จริงรวมประโยชน์ตอบแทนร้อยละสิบห้าต่อปี"],["500","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๑ ขายฝาก","มาตรา ๕๐๐ ค่าฤชาธรรมเนียมการขายฝากซึ่งผู้ซื้อได้ออกไปนั้น ผู้ไถ่ต้องใช้ให้แก่ผู้ซื้อพร้อมกับสินไถ่\nส่วนค่าฤชาธรรมเนียมการไถ่ทรัพย์นั้น ผู้ไถ่พึงออกใช้"],["501","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๑ ขายฝาก","มาตรา ๕๐๑ ทรัพย์สินซึ่งไถ่นั้น ท่านว่าต้องส่งคืนตามสภาพที่เป็นอยู่ในเวลาไถ่ แต่ถ้าหากว่าทรัพย์สินนั้นถูกทำลายหรือทำให้เสื่อมเสียไปเพราะความผิดของผู้ซื้อไซร้ ท่านว่าผู้ซื้อจะต้องใช้ค่าสินไหมทดแทน"],["502","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๑ ขายฝาก","มาตรา ๕๐๒ ทรัพย์สินซึ่งไถ่นั้น ท่านว่าบุคคลผู้ไถ่ย่อมได้รับคืนไปโดยปลอดจากสิทธิใด ๆ ซึ่งผู้ซื้อเดิม หรือทายาท หรือผู้รับโอนจากผู้ซื้อเดิมก่อให้เกิดขึ้นก่อนเวลาไถ่\nถ้าว่าเช่าทรัพย์สินที่อยู่ในระหว่างขายฝากอันได้จดทะเบียนเช่าต่อพนักงานเจ้าหน้าที่แล้วไซร้ ท่านว่าการเช่านั้นหากมิได้ทำขึ้นเพื่อจะให้เสียหายแก่ผู้ขาย กำหนดเวลาเช่ายังคงมีเหลืออยู่อีกเพียงใด ก็ให้คงเป็นอันสมบูรณ์อยู่เพียงนั้น แต่มิให้เกินกว่าปีหนึ่ง"],["503","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๒ ขายตามตัวอย่าง ขายตามคำพรรณนา ขายเผื่อชอบ","มาตรา ๕๐๓ ในการขายตามตัวอย่างนั้น ผู้ขายจำต้องส่งมอบทรัพย์สินให้ตรงตามตัวอย่าง\nในการขายตามคำพรรณนา ผู้ขายจำต้องส่งมอบทรัพย์สินให้ตรงตามคำพรรณนา"],["504","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๒ ขายตามตัวอย่าง ขายตามคำพรรณนา ขายเผื่อชอบ","มาตรา ๕๐๔ ในข้อรับผิดเพื่อการส่งของไม่ตรงตามตัวอย่าง หรือไม่ตรงตามคำพรรณนานั้น ท่านห้ามมิให้ฟ้องคดีเมื่อพ้นกำหนดปีหนึ่งนับแต่เวลาส่งมอบ"],["505","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๒ ขายตามตัวอย่าง ขายตามคำพรรณนา ขายเผื่อชอบ","มาตรา ๕๐๕ อันว่าขายเผื่อชอบนั้น คือการซื้อขายกันโดยมีเงื่อนไขว่าให้ผู้ซื้อได้มีโอกาสตรวจดูทรัพย์สินก่อนรับซื้อ"],["506","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๒ ขายตามตัวอย่าง ขายตามคำพรรณนา ขายเผื่อชอบ","มาตรา ๕๐๖ การตรวจดูทรัพย์สินนั้น ถ้าไม่ได้กำหนดเวลากันไว้ ผู้ขายอาจกำหนดเวลาอันสมควร และบอกกล่าวแก่ผู้ซื้อให้ตอบภายในกำหนดนั้นได้ว่าจะรับซื้อหรือไม่"],["507","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๒ ขายตามตัวอย่าง ขายตามคำพรรณนา ขายเผื่อชอบ","มาตรา ๕๐๗ ทรัพย์สินอันผู้ซื้อจะพึงตรวจดูก่อนที่จะส่งมอบแก่กันนั้น ถ้าผู้ซื้อไม่ตรวจรับภายในเวลาที่กำหนดไว้โดยสัญญา หรือโดยประเพณี หรือโดยคำบอกกล่าวของผู้ขาย ท่านว่าผู้ขายย่อมไม่มีความผูกพันต่อไป"],["508","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๒ ขายตามตัวอย่าง ขายตามคำพรรณนา ขายเผื่อชอบ","มาตรา ๕๐๘ เมื่อทรัพย์สินนั้นได้ส่งมอบแก่ผู้ซื้อเพื่อให้ตรวจดูแล้ว การซื้อขายย่อมเป็นอันบริบูรณ์ในกรณีต่อไปนี้ คือ\n(๑) ถ้าผู้ซื้อมิได้บอกกล่าวว่าไม่ยอมรับซื้อภายในเวลาที่กำหนดไว้โดยสัญญา หรือโดยประเพณี หรือโดยคำบอกกล่าว หรือ\n(๒) ถ้าผู้ซื้อไม่ส่งทรัพย์สินคืนภายในกำหนดเวลาดังกล่าวมานั้น หรือ\n(๓) ถ้าผู้ซื้อใช้ราคาทรัพย์สินนั้นสิ้นเชิง หรือแต่บางส่วน หรือ\n(๔) ถ้าผู้ซื้อจำหน่ายทรัพย์สินนั้น หรือทำประการอื่นอย่างใดอันเป็นปริยายว่ารับซื้อของนั้น"],["509","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๓ ขายทอดตลาด","มาตรา ๕๐๙ การขายทอดตลาดย่อมบริบูรณ์ เมื่อผู้ทอดตลาดแสดงความตกลงด้วยเคาะไม้ หรือด้วยกิริยาอื่นอย่างใดอย่างหนึ่งตามจารีตประเพณีในการขายทอดตลาด ถ้ายังมิได้แสดงเช่นนั้นอยู่ตราบใด ท่านว่าผู้สู้ราคาจะถอนคำสู้ราคาของตนเสียก็ยังถอนได้"],["510","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๓ ขายทอดตลาด","มาตรา ๕๑๐ ผู้ซื้อในการขายทอดตลาดจะต้องทำตามคำโฆษณาบอกขาย และตามความข้ออื่น ๆ ซึ่งผู้ทอดตลาดได้แถลงก่อนประเดิมการสู้ราคาทรัพย์สินเฉพาะรายไป"],["511","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๓ ขายทอดตลาด","มาตรา ๕๑๑ ท่านห้ามมิให้ผู้ทอดตลาดเข้าสู้ราคา หรือใช้ให้ผู้หนึ่งผู้ใดเข้าสู้ราคา ในการทอดตลาดซึ่งตนเป็นผู้อำนวยการเอง"],["512","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๓ ขายทอดตลาด","มาตรา ๕๑๒ ท่านห้ามมิให้ผู้ขายเข้าสู้ราคาเอง หรือใช้ให้ผู้หนึ่งผู้ใดเข้าสู้ราคา เว้นแต่จะได้แถลงไว้โดยเฉพาะในคำโฆษณาบอกการทอดตลาดนั้น ว่าผู้ขายถือสิทธิที่จะเข้าสู้ราคาด้วย"],["513","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๓ ขายทอดตลาด","มาตรา ๕๑๓ เมื่อใดผู้ทอดตลาดเห็นว่าราคาซึ่งมีผู้สู้สูงสุดนั้นยังไม่เพียงพอ ผู้ทอดตลาดอาจถอนทรัพย์สินจากการทอดตลาดได้"],["514","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๓ ขายทอดตลาด","มาตรา ๕๑๔ ผู้สู้ราคาย่อมพ้นความผูกพันในราคาซึ่งตนสู้แต่ขณะเมื่อมีผู้อื่นสู้ราคาสูงขึ้นไป ไม่ว่าการที่ผู้อื่นสู้นั้นจะสมบูรณ์หรือมิสมบูรณ์ประการใด อีกประการหนึ่งเมื่อใดถอนทรัพย์สินรายนั้นจากการทอดตลาด ผู้สู้ราคาก็พ้นความผูกพันแต่ขณะที่ถอนนั้นดุจกัน"],["515","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๓ ขายทอดตลาด","มาตรา ๕๑๕ ผู้สู้ราคาสูงสุดต้องใช้ราคาเป็นเงินสด เมื่อการซื้อขายบริบูรณ์หรือตามเวลาที่กำหนดไว้ในคำโฆษณาบอกขาย"],["516","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๓ ขายทอดตลาด","มาตรา ๕๑๖ ถ้าผู้สู้ราคาสูงสุดละเลยเสียไม่ใช้ราคาไซร้ ท่านให้ผู้ทอดตลาดเอาทรัพย์สินนั้นออกขายอีกซ้ำหนึ่ง ถ้าและได้เงินเป็นจำนวนสุทธิไม่คุ้มราคาและค่าขายทอดตลาดชั้นเดิม ผู้สู้ราคาเดิมคนนั้นต้องรับผิดในส่วนที่ขาด"],["517","b3t1","หมวด ๔ การซื้อขายเฉพาะบางอย่าง","ส่วนที่ ๓ ขายทอดตลาด","มาตรา ๕๑๗ ถ้าเงินรายได้ในการทอดตลาดส่วนหนึ่งส่วนใดค้างชำระอยู่ เพราะเหตุผู้ทอดตลาดละเลยไม่บังคับตามบทในมาตรา ๕๑๕ หรือมาตรา ๕๑๖ ไซร้ ท่านว่าผู้ทอดตลาดจะต้องรับผิด"],["518","b3t2","","","มาตรา ๕๑๘ อันว่าแลกเปลี่ยนนั้น คือสัญญาซึ่งคู่กรณีต่างโอนกรรมสิทธิ์แห่งทรัพย์สินให้กันและกัน"],["519","b3t2","","","มาตรา ๕๑๙ บทบัญญัติทั้งหลายในลักษณะซื้อขายนั้น ท่านให้ใช้ถึงการแลกเปลี่ยนด้วย โดยให้ถือว่าผู้เป็นคู่สัญญาแลกเปลี่ยนเป็นผู้ขายในส่วนทรัพย์สินซึ่งตนได้ส่งมอบ และเป็นผู้ซื้อในส่วนทรัพย์สินซึ่งตนได้รับในการแลกเปลี่ยนนั้น"],["520","b3t2","","","มาตรา ๕๒๐ ถ้าคู่สัญญาฝ่ายหนึ่งในสัญญาแลกเปลี่ยนตกลงจะโอนเงินเพิ่มเข้ากับทรัพย์สินสิ่งอื่นให้แก่อีกฝ่ายหนึ่งไซร้ บททั้งหลายอันว่าด้วยราคาในลักษณะซื้อขายนั้น ให้ใช้ถึงเงินเช่นว่านั้นด้วย"],["521","b3t3","","","มาตรา ๕๒๑ อันว่าให้นั้น คือสัญญาซึ่งบุคคลคนหนึ่งเรียกว่าผู้ให้ โอนทรัพย์สินของตนให้โดยเสน่หาแก่บุคคลอีกคนหนึ่ง เรียกว่าผู้รับ และผู้รับยอมรับเอาทรัพย์สินนั้น"],["522","b3t3","","","มาตรา ๕๒๒ การให้นั้นจะทำด้วยปลดหนี้ให้แก่ผู้รับ หรือด้วยชำระหนี้ซึ่งผู้รับค้างชำระอยู่ก็ได้"],["523","b3t3","","","มาตรา ๕๒๓ การให้นั้น ท่านว่าย่อมสมบูรณ์ต่อเมื่อส่งมอบทรัพย์สินที่ให้"],["524","b3t3","","","มาตรา ๕๒๔ การให้สิทธิอันมีหนังสือตราสารเป็นสำคัญนั้น ถ้ามิได้ส่งมอบตราสารให้แก่ผู้รับ และมิได้มีหนังสือบอกกล่าวแก่ลูกหนี้แห่งสิทธินั้น ท่านว่าการให้ย่อมไม่สมบูรณ์"],["525","b3t3","","","มาตรา ๕๒๕ การให้ทรัพย์สินซึ่งถ้าจะซื้อขายกันจะต้องทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่นั้น ท่านว่าย่อมสมบูรณ์ต่อเมื่อได้ทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่ ในกรณีเช่นนี้ การให้ย่อมเป็นอันสมบูรณ์โดยมิพักต้องส่งมอบ"],["526","b3t3","","","มาตรา ๕๒๖ ถ้าการให้ทรัพย์สินหรือให้คำมั่นว่าจะให้ทรัพย์สินนั้นได้ทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่แล้ว และผู้ให้ไม่ส่งมอบทรัพย์สินนั้นแก่ผู้รับไซร้ ท่านว่าผู้รับชอบที่จะเรียกให้ส่งมอบตัวทรัพย์สินหรือราคาแทนทรัพย์สินนั้นได้ แต่ไม่ชอบที่จะเรียกค่าสินไหมทดแทนอย่างหนึ่งอย่างใดด้วยอีกได้"],["527","b3t3","","","มาตรา ๕๒๗ ถ้าผู้ให้ผูกตนไว้ว่าจะชำระหนี้เป็นคราว ๆ ท่านว่าหนี้นั้นเป็นอันระงับสิ้นไปเมื่อผู้ให้หรือผู้รับตาย เว้นแต่จะขัดกับเจตนาอันปรากฏแต่มูลหนี้"],["528","b3t3","","","มาตรา ๕๒๘ ถ้าทรัพย์สินซึ่งให้นั้นมีค่าภาระติดพัน และผู้รับละเลยเสียไม่ชำระค่าภาระติดพันนั้นไซร้ ท่านว่าโดยเงื่อนไขอันระบุไว้ในกรณีสิทธิเลิกสัญญาต่างตอบแทนกันนั้น ผู้ให้จะเรียกให้ส่งทรัพย์สินที่ให้นั้นคืนตามบทบัญญัติว่าด้วยคืนลาภมิควรได้นั้นก็ได้ เพียงเท่าที่ควรจะเอาทรัพย์นั้นไปใช้ชำระค่าภาระติดพันนั้น\nแต่สิทธิเรียกคืนอันนี้ย่อมเป็นอันขาดไป ถ้าบุคคลภายนอกเป็นผู้มีสิทธิจะเรียกให้ชำระค่าภาระติดพันนั้น"],["529","b3t3","","","มาตรา ๕๒๙ ถ้าทรัพย์สินที่ให้มีราคาไม่พอกับการที่จะชำระค่าภาระติดพันไซร้ ท่านว่าผู้รับจะต้องชำระแต่เพียงเท่าราคาทรัพย์สินเท่านั้น"],["530","b3t3","","","มาตรา ๕๓๐ ถ้าการให้นั้นมีค่าภาระติดพัน ท่านว่าผู้ให้จะต้องรับผิดเพื่อความชำรุดบกพร่องหรือเพื่อการรอนสิทธิเช่นเดียวกันกับผู้ขาย แต่ท่านจำกัดไว้ว่าไม่เกินจำนวนค่าภาระติดพัน"],["531","b3t3","","","มาตรา ๕๓๑ อันผู้ให้จะเรียกถอนคืนการให้เพราะเหตุผู้รับประพฤติเนรคุณนั้น ท่านว่าอาจจะเรียกได้แต่เพียงในกรณีดังจะกล่าวต่อไปนี้\n(๑) ถ้าผู้รับได้ประทุษร้ายต่อผู้ให้เป็นความผิดฐานอาญาอย่างร้ายแรงตามประมวลกฎหมายลักษณะอาญา หรือ\n(๒) ถ้าผู้รับได้ทำให้ผู้ให้เสียชื่อเสียง หรือหมิ่นประมาทผู้ให้อย่างร้ายแรง หรือ\n(๓) ถ้าผู้รับได้บอกปัดไม่ยอมให้สิ่งของจำเป็นเลี้ยงชีวิตแก่ผู้ให้ ในเวลาที่ผู้ให้ยากไร้และผู้รับยังสามารถจะให้ได้"],["532","b3t3","","","มาตรา ๕๓๒ ทายาทของผู้ให้อาจเรียกให้ถอนคืนการให้ได้แต่เฉพาะในเหตุที่ผู้รับได้ฆ่าผู้ให้ตายโดยเจตนาและไม่ชอบด้วยกฎหมาย หรือได้กีดกันผู้ให้ไว้มิให้ถอนคืนการให้\nแต่ว่าผู้ให้ได้ฟ้องคดีไว้แล้วอย่างใดโดยชอบ ทายาทของผู้ให้จะว่าคดีอันนั้นต่อไปก็ได้"],["533","b3t3","","","มาตรา ๕๓๓ เมื่อผู้ให้ได้ให้อภัยแก่ผู้รับในเหตุประพฤติเนรคุณนั้นแล้วก็ดี หรือเมื่อเวลาได้ล่วงไปแล้วหกเดือนนับแต่เหตุเช่นนั้นได้ทราบถึงบุคคลผู้ชอบที่จะเรียกถอนคืนการให้ได้นั้นก็ดี ท่านว่าหาอาจจะถอนคืนการให้ได้ไม่\nอนึ่ง ท่านห้ามมิให้ฟ้องคดีเมื่อพ้นเวลาสิบปีภายหลังเหตุการณ์เช่นว่านั้น"],["534","b3t3","","","มาตรา ๕๓๔ เมื่อถอนคืนการให้ ท่านให้ส่งคืนทรัพย์สินตามบทบัญญัติแห่งประมวลฎหมายนี้ ว่าด้วยลาภมิควรได้"],["535","b3t3","","","มาตรา ๕๓๕ การให้อันจะกล่าวต่อไปนี้ ท่านว่าจะถอนคืนเพราะเหตุเนรคุณไม่ได้ คือ\n(๑) ให้เป็นบำเหน็จสินจ้างโดยแท้\n(๒) ให้สิ่งที่มีค่าภาระติดพัน\n(๓) ให้โดยหน้าที่ธรรมจรรยา\n(๔) ให้ในการสมรส"],["536","b3t3","","","มาตรา ๕๓๖ การให้อันจะให้เป็นผลต่อเมื่อผู้ให้ตายนั้น ท่านให้บังคับด้วยบทกฎหมายว่าด้วยมรดกและพินัยกรรม"],["537","b3t4","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๕๓๗ อันว่าเช่าทรัพย์สินนั้น คือสัญญาซึ่งบุคคลคนหนึ่งเรียกว่า ผู้ให้เช่า ตกลงให้บุคคลอีกคนหนึ่งเรียกว่า ผู้เช่า ได้ใช้หรือได้รับประโยชน์ในทรัพย์สินอย่างใดอย่างหนึ่งชั่วระยะเวลาอันมีจำกัด และผู้เช่าตกลงจะให้ค่าเช่าเพื่อการนั้น"],["538","b3t4","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๕๓๘ เช่าอสังหาริมทรัพย์นั้น ถ้ามิได้มีหลักฐานเป็นหนังสืออย่างหนึ่งอย่างใดลงลายมือชื่อฝ่ายที่ต้องรับผิดเป็นสำคัญ ท่านว่าจะฟ้องร้องให้บังคับคดีหาได้ไม่ ถ้าเช่ามีกำหนดกว่าสามปีขึ้นไป หรือกำหนดตลอดอายุของผู้เช่าหรือผู้ให้เช่าไซร้ หากมิได้ทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่ ท่านว่าการเช่านั้นจะฟ้องร้องให้บังคับคดีได้แต่เพียงสามปี"],["539","b3t4","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๕๓๙ ค่าฤชาธรรมเนียมทำสัญญาเช่านั้น คู่สัญญาพึงออกใช้เสมอกันทั้งสองฝ่าย"],["540","b3t4","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๕๔๐ อันอสังหาริมทรัพย์ ท่านห้ามมิให้เช่ากันเป็นกำหนดเวลาเกินกว่าสามสิบปี ถ้าได้ทำสัญญากันไว้เป็นกำหนดเวลานานกว่านั้น ท่านก็ให้ลดลงมาเป็นสามสิบปี\nอนึ่ง กำหนดเวลาเช่าดังกล่าวมานี้ เมื่อสิ้นลงแล้วจะต่อสัญญาอีกก็ได้ แต่ต้องอย่าให้เกินสามสิบปีนับแต่วันต่อสัญญา"],["541","b3t4","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๕๔๑ สัญญาเช่านั้นจะทำกันเป็นกำหนดว่าตลอดอายุของผู้ให้เช่าหรือของผู้เช่าก็ให้ทำได้"],["542","b3t4","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๕๔๒ บุคคลหลายคนเรียกเอาสังหาริมทรัพย์อันเดียวกันอาศัยมูลสัญญาเช่าต่างราย ท่านว่าทรัพย์ตกไปอยู่ในครอบครองผู้เช่าคนใดก่อนด้วยสัญญาเช่าทรัพย์นั้น คนนั้นมีสิทธิยิ่งกว่าคนอื่น ๆ"],["543","b3t4","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๕๔๓ บุคคลหลายคนเรียกร้องเอาอสังหาริมทรัพย์อันเดียวกันอาศัยมูลสัญญาเช่าต่างราย ท่านให้วินิจฉัย ดังต่อไปนี้\n(๑) ถ้าการเช่านั้นเป็นประเภทซึ่งมิได้บังคับไว้โดยกฎหมายว่าต้องจดทะเบียน ท่านให้ถือว่าผู้เช่าซึ่งได้ทรัพย์สินไปไว้ในครอบครองก่อนด้วยสัญญาเช่าของตนนั้นมีสิทธิยิ่งกว่าคนอื่น ๆ\n(๒) ถ้าการเช่าทุก ๆ รายเป็นประเภทซึ่งบังคับไว้โดยกฎหมายว่าต้องจดทะเบียน ท่านให้ถือว่าผู้เช่าซึ่งได้จดทะเบียนการเช่าของตนก่อนนั้นมีสิทธิยิ่งกว่าคนอื่น ๆ\n(๓) ถ้าการเช่ามีทั้งประเภทซึ่งต้องจดทะเบียนและประเภทซึ่งไม่ต้องจดทะเบียนตามกฎหมายยันกันอยู่ไซร้ ท่านว่าผู้เช่าคนที่ได้จดทะเบียนการเช่าของตนนั้นมีสิทธิยิ่งกว่า เว้นแต่ผู้เช่าคนอื่นจะได้ทรัพย์สินนั้นไปไว้ในครอบครองด้วยการเช่าของตนเสียแต่ก่อนวันจดทะเบียนนั้นแล้ว"],["544","b3t4","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๕๔๔ ทรัพย์สินซึ่งเช่านั้น ผู้เช่าจะให้เช่าช่วงหรือโอนสิทธิของตนอันมีในทรัพย์สินนั้นไม่ว่าทั้งหมดหรือแต่บางส่วนให้แก่บุคคลภายนอก ท่านว่าหาอาจทำได้ไม่ เว้นแต่จะได้ตกลงกันไว้เป็นอย่างอื่นในสัญญาเช่า\nถ้าผู้เช่าประพฤติฝ่าฝืนบทบัญญัติอันนี้ ผู้ให้เช่าจะบอกเลิกสัญญาเสียก็ได้"],["545","b3t4","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๕๔๕ ถ้าผู้เช่าเอาทรัพย์สินซึ่งตนเช่าไปให้ผู้อื่นเช่าช่วงอีกทอดหนึ่งโดยชอบ ท่านว่าผู้เช่าช่วงย่อมต้องรับผิดต่อผู้ให้เช่าเดิมโดยตรง ในกรณีเช่นว่านี้หากผู้เช่าช่วงจะได้ใช้ค่าเช่าให้แก่ผู้เช่าไปก่อน ท่านว่าผู้เช่าช่วงหาอาจจะยกขึ้นเป็นข้อต่อสู้ผู้ให้เช่าได้ไม่\nอนึ่ง บทบัญญัติอันนี้ไม่ห้ามการที่ผู้ให้เช่าจะใช้สิทธิของตนต่อผู้เช่า"],["546","b3t4","หมวด ๒ หน้าที่และความรับผิดชอบของผู้ให้เช่า","","มาตรา ๕๔๖ ผู้ให้เช่าจำต้องส่งมอบทรัพย์สินซึ่งให้เช่านั้นในสภาพอันซ่อมแซมดีแล้ว"],["547","b3t4","หมวด ๒ หน้าที่และความรับผิดชอบของผู้ให้เช่า","","มาตรา ๕๔๗ ผู้เช่าต้องเสียค่าใช้จ่ายไปโดยความจำเป็นและสมควรเพื่อรักษาทรัพย์สินซึ่งเช่านั้นเท่าใด ผู้ให้เช่าจำต้องชดใช้ให้แก่ผู้เช่า เว้นแต่ค่าใช้จ่ายเพื่อบำรุงรักษาตามปกติและเพื่อซ่อมแซมเพียงเล็กน้อย"],["548","b3t4","หมวด ๒ หน้าที่และความรับผิดชอบของผู้ให้เช่า","","มาตรา ๕๔๘ ถ้าผู้ให้เช่าส่งมอบทรัพย์สินซึ่งเช่านั้นโดยสภาพไม่เหมาะแก่การที่จะใช้เพื่อประโยชน์ที่เช่ามา ผู้เช่าจะบอกเลิกสัญญาเสียก็ได้"],["549","b3t4","หมวด ๒ หน้าที่และความรับผิดชอบของผู้ให้เช่า","","มาตรา ๕๔๙ การส่งมอบทรัพย์สินซึ่งเช่าก็ดี ความรับผิดของผู้ให้เช่าในกรณีชำรุดบกพร่องและรอนสิทธิก็ดี ผลแห่งข้อสัญญาว่าจะไม่ต้องรับผิดก็ดี เหล่านี้ ท่านให้บังคับด้วยบทบัญญัติทั้งหลายแห่งประมวลกฎหมายนี้ ว่าด้วยการซื้อขายอนุโลมความตามควร"],["550","b3t4","หมวด ๒ หน้าที่และความรับผิดชอบของผู้ให้เช่า","","มาตรา ๕๕๐ ผู้ให้เช่าย่อมต้องรับผิดในความชำรุดบกพร่องอันเกิดขึ้นในระหว่างเวลาเช่า และผู้ให้เช่าต้องจัดการซ่อมแซมทุกอย่างบรรดาซึ่งเป็นการจำเป็นขึ้น เว้นแต่การซ่อมแซมชนิดซึ่งมีกฎหมายหรือจารีตประเพณีว่าผู้เช่าจะพึงต้องทำเอง"],["551","b3t4","หมวด ๒ หน้าที่และความรับผิดชอบของผู้ให้เช่า","","มาตรา ๕๕๑ ถ้าความชำรุดบกพร่องแห่งทรัพย์สินที่เช่านั้นไม่เป็นเหตุถึงแก่ผู้เช่าจะต้องปราศจากการใช้และประโยชน์ และผู้ให้เช่ายังแก้ไขได้ไซร้ ผู้เช่าต้องบอกกล่าวแก่ผู้ให้เช่าให้จัดการแก้ไขความชำรุดบกพร่องนั้นก่อน ถ้าและผู้ให้เช่าไม่จัดทำให้คืนดีภายในเวลาอันสมควร ผู้เช่าจะบอกเลิกสัญญาเสียก็ได้ หากว่าความชำรุดบกพร่องนั้นร้ายแรงถึงสมควรจะทำเช่นนั้น"],["552","b3t4","หมวด ๓ หน้าที่และความรับผิดของผู้เช่า","","มาตรา ๕๕๒ อันผู้เช่าจะใช้ทรัพย์สินที่เช่าเพื่อการอย่างอื่น นอกจากที่ใช้กันตามประเพณีนิยมปกติ หรือการดังกำหนดไว้ในสัญญานั้น ท่านว่าหาอาจจะทำได้ไม่"],["553","b3t4","หมวด ๓ หน้าที่และความรับผิดของผู้เช่า","","มาตรา ๕๕๓ ผู้เช่าจำต้องสงวนทรัพย์สินที่เช่านั้นเสมอกับที่วิญญูชนจะพึงสงวนทรัพย์สินของตนเอง และต้องบำรุงรักษาทั้งทำการซ่อมแซมเล็กน้อยด้วย"],["554","b3t4","หมวด ๓ หน้าที่และความรับผิดของผู้เช่า","","มาตรา ๕๕๔ ถ้าผู้เช่ากระทำการฝ่าฝืนบทบัญญัติในมาตรา ๕๕๒ มาตรา ๕๕๓ หรือฝ่าฝืนข้อสัญญา ผู้ให้เช่าจะบอกกล่าวให้ผู้เช่าปฏิบัติให้ถูกต้องตามบทกฎหมายหรือข้อสัญญานั้น ๆ ก็ได้ ถ้าและผู้เช่าละเลยเสียไม่ปฏิบัติตาม ท่านว่าผู้ให้เช่าจะบอกเลิกสัญญาเสียก็ได้"],["555","b3t4","หมวด ๓ หน้าที่และความรับผิดของผู้เช่า","","มาตรา ๕๕๕ ผู้เช่าจำต้องยอมให้ผู้ให้เช่าหรือตัวแทนของผู้ให้เช่าเข้าตรวจดูทรัพย์สินที่เช่าเป็นครั้งคราว ในเวลาและระยะอันสมควร"],["556","b3t4","หมวด ๓ หน้าที่และความรับผิดของผู้เช่า","","มาตรา ๕๕๖ ถ้าในระหว่างเวลาเช่ามีเหตุจะต้องซ่อมแซมทรัพย์สินซึ่งเช่านั้นเป็นการเร่งร้อน และผู้ให้เช่าประสงค์จะทำการอันจำเป็นเพื่อที่จะซ่อมแซมเช่นว่านั้นไซร้ ท่านว่าผู้เช่าจะไม่ยอมให้ทำนั้นไม่ได้ แม้ถึงว่าการนั้นจะเป็นความไม่สะดวกแก่ตน ถ้าการซ่อมแซมเป็นสภาพซึ่งต้องกินเวลานานเกินสมควร จนเป็นเหตุให้ทรัพย์สินนั้นไม่เหมาะแก่การที่จะใช้เพื่อประโยชน์ที่เช่ามา ผู้เช่าจะบอกเลิกสัญญาเสียก็ได้"],["557","b3t4","หมวด ๓ หน้าที่และความรับผิดของผู้เช่า","","มาตรา ๕๕๗ ในกรณีอย่างใด ๆ ดังจะกล่าวต่อไปนี้ คือ\n(๑) ถ้าทรัพย์สินที่เช่านั้นชำรุดควรที่ผู้ให้เช่าจะต้องซ่อมแซมก็ดี\n(๒) ถ้าจะต้องจัดการอย่างหนึ่งอย่างใดเพื่อปัดป้องภยันตรายแก่ทรัพย์สินนั้นก็ดี\n(๓) ถ้าบุคคลภายนอกรุกล้ำเข้ามาในทรัพย์สินที่เช่าหรือเรียกอ้างสิทธิอย่างใดอย่างหนึ่งเหนือทรัพย์สินนั้นก็ดี\nในเหตุดังกล่าวนั้นให้ผู้เช่าแจ้งเหตุแก่ผู้ให้เช่าโดยพลัน เว้นแต่ผู้ให้เช่าจะได้ทราบเหตุนั้นอยู่ก่อนแล้ว\nถ้าผู้เช่าละเลยเสียไม่ปฏิบัติตามบทบัญญัตินี้ไซร้ ท่านว่าผู้เช่าจะต้องรับผิดต่อผู้ให้เช่าในเมื่อผู้ให้เช่าต้องเสียหายอย่างใด ๆ เพราะความละเลยชักช้าของผู้เช่านั้น"],["558","b3t4","หมวด ๓ หน้าที่และความรับผิดของผู้เช่า","","มาตรา ๕๕๘ อันทรัพย์สินที่เช่านั้น ถ้ามิได้รับอนุญาตของผู้ให้เช่าก่อน ผู้เช่าจะทำการดัดแปลงหรือต่อเติมอย่างหนึ่งอย่างใดหาได้ไม่ ถ้าและผู้เช่าทำไปโดยมิได้รับอนุญาตของผู้ให้เช่าเช่นนั้นไซร้ เมื่อผู้ให้เช่าเรียกร้อง ผู้เช่าจะต้องทำให้ทรัพย์สินนั้นกลับคืนคงสภาพเดิม ทั้งจะต้องรับผิดต่อผู้ให้เช่าในความสูญหายหรือบุบสลายอย่างใด ๆ อันเกิดแต่การดัดแปลงต่อเติมนั้นด้วย"],["559","b3t4","หมวด ๓ หน้าที่และความรับผิดของผู้เช่า","","มาตรา ๕๕๙ ถ้าไม่มีกำหนดโดยสัญญาหรือโดยจารีตประเพณีว่าจะพึงชำระค่าเช่า ณ เวลาใด ท่านให้ชำระเมื่อสิ้นระยะเวลาอันได้ตกลงกำหนดกันไว้ทุกคราวไป กล่าวคือว่าถ้าเช่ากันเป็นรายปีก็พึงชำระค่าเช่าเมื่อสิ้นปี ถ้าเช่ากันเป็นรายเดือนก็พึงชำระค่าเช่าเมื่อสิ้นเดือน"],["560","b3t4","หมวด ๓ หน้าที่และความรับผิดของผู้เช่า","","มาตรา ๕๖๐ ถ้าผู้เช่าไม่ชำระค่าเช่า ผู้ให้เช่าจะบอกเลิกสัญญาเสียก็ได้\nแต่ถ้าค่าเช่านั้นจะพึงส่งเป็นรายเดือน หรือส่งเป็นระยะเวลายาวกว่ารายเดือนขึ้นไป ผู้ให้เช่าต้องบอกกล่าวแก่ผู้เช่าก่อนว่าให้ชำระค่าเช่าภายในเวลาใด ซึ่งพึงกำหนดอย่าให้น้อยกว่าสิบห้าวัน"],["561","b3t4","หมวด ๓ หน้าที่และความรับผิดของผู้เช่า","","มาตรา ๕๖๑ ถ้ามิได้ทำหนังสือลงลายมือชื่อของคู่สัญญาแสดงไว้ต่อกันว่าทรัพย์สินที่ให้เช่ามีสภาพเป็นอยู่อย่างไร ท่านให้สันนิษฐานไว้ก่อนว่าผู้เช่าได้รับทรัพย์สินที่เช่านั้นไปโดยสภาพอันซ่อมแซมดีแล้ว และเมื่อสัญญาได้เลิกหรือระงับลง ผู้เช่าก็ต้องส่งคืนทรัพย์สินในสภาพเช่นนั้น เว้นแต่จะพิสูจน์ได้ว่าทรัพย์สินนั้นมิได้ซ่อมแซมไว้ดีในขณะที่ส่งมอบ"],["562","b3t4","หมวด ๓ หน้าที่และความรับผิดของผู้เช่า","","มาตรา ๕๖๒ ผู้เช่าจะต้องรับผิดในความสูญหายหรือบุบสลายอย่างใด ๆ อันเกิดขึ้นแก่ทรัพย์สินที่เช่า เพราะความผิดของผู้เช่าเอง หรือของบุคคลซึ่งอยู่กับผู้เช่า หรือของผู้เช่าช่วง\nแต่ผู้เช่าไม่ต้องรับผิดในความสูญหายหรือบุบสลายอันเกิดแต่การใช้ทรัพย์สินนั้นโดยชอบ"],["563","b3t4","หมวด ๓ หน้าที่และความรับผิดของผู้เช่า","","มาตรา ๕๖๓ คดีอันผู้ให้เช่าจะฟ้องผู้เช่าเกี่ยวแก่สัญญาเช่านั้น ท่านห้ามมิให้ฟ้องเมื่อพ้นกำหนดหกเดือนนับแต่วันส่งคืนทรัพย์สินที่เช่า"],["564","b3t4","หมวด ๔ ความระงับแห่งสัญญาเช่า","","มาตรา ๕๖๔ อันสัญญาเช่านั้น ท่านว่าย่อมระงับไปเมื่อสิ้นกำหนดเวลาที่ได้ตกลงกันไว้ มิพักต้องบอกกล่าวก่อน"],["565","b3t4","หมวด ๔ ความระงับแห่งสัญญาเช่า","","มาตรา ๕๖๕ การเช่าถือสวนนั้น ท่านให้สันนิษฐานไว้ก่อนว่าเช่ากันปีหนึ่ง\nการเช่านาก็ให้สันนิษฐานไว้ก่อนว่าเช่ากันตลอดฤดูทำนาปีหนึ่ง"],["566","b3t4","หมวด ๔ ความระงับแห่งสัญญาเช่า","","มาตรา ๕๖๖ ถ้ากำหนดเวลาเช่าไม่ปรากฏในความที่ตกลงกันหรือไม่พึงสันนิษฐานได้ไซร้ ท่านว่าคู่สัญญาฝ่ายใดจะบอกเลิกสัญญาเช่าในขณะเมื่อสุดระยะเวลาอันเป็นกำหนดชำระค่าเช่าก็ได้ทุกระยะ แต่ต้องบอกกล่าวแก่อีกฝ่ายหนึ่งให้รู้ตัวก่อนชั่วกำหนดเวลาชำระค่าเช่าระยะหนึ่งเป็นอย่างน้อย แต่ไม่จำเป็นต้องบอกกล่าวล่วงหน้ากว่าสองเดือน"],["567","b3t4","หมวด ๔ ความระงับแห่งสัญญาเช่า","","มาตรา ๕๖๗ ถ้าทรัพย์สินซึ่งให้เช่าสูญหายไปทั้งหมดไซร้ ท่านว่าสัญญาเช่าก็ย่อมระงับไปด้วย"],["568","b3t4","หมวด ๔ ความระงับแห่งสัญญาเช่า","","มาตรา ๕๖๘ ถ้าทรัพย์สินซึ่งให้เช่าสูญหายไปแต่เพียงบางส่วน และมิได้เป็นเพราะความผิดของผู้เช่า ท่านว่าผู้เช่าจะเรียกให้ลดค่าเช่าลงตามส่วนที่สูญหายก็ได้\nในกรณีเช่นนี้ ถ้าผู้เช่าไม่สามารถใช้สอยทรัพย์สินส่วนที่ยังคงเหลืออยู่นั้นสำเร็จประโยชน์ได้ดังที่ได้มุ่งหมายเข้าทำสัญญาเช่าไซร้ ท่านว่าผู้เช่าจะบอกเลิกสัญญาเสียก็ได้"],["569","b3t4","หมวด ๔ ความระงับแห่งสัญญาเช่า","","มาตรา ๕๖๙ อันสัญญาเช่าอสังหาริมทรัพย์นั้นย่อมไม่ระงับไป เพราะเหตุโอนกรรมสิทธิ์ทรัพย์สินซึ่งให้เช่า\nผู้รับโอนย่อมรับไปทั้งสิทธิและหน้าที่ของผู้โอนซึ่งมีต่อผู้เช่านั้นด้วย"],["570","b3t4","หมวด ๔ ความระงับแห่งสัญญาเช่า","","มาตรา ๕๗๐ ในเมื่อสิ้นกำหนดเวลาเช่าซึ่งได้ตกลงกันไว้นั้น ถ้าผู้เช่ายังคงครองทรัพย์สินอยู่ และผู้ให้เช่ารู้ความนั้นแล้วไม่ทักท้วงไซร้ ท่านให้ถือว่าคู่สัญญาเป็นอันได้ทำสัญญาใหม่ต่อไปไม่มีกำหนดเวลา"],["571","b3t4","หมวด ๔ ความระงับแห่งสัญญาเช่า","","มาตรา ๕๗๑ ถ้าสัญญาเช่าที่นาได้เลิกหรือระงับลง เมื่อผู้เช่าได้เพาะปลูกข้าวลงแล้วไซร้ ท่านว่าผู้เช่าย่อมมีสิทธิที่จะครองนานั้นต่อไปจนกว่าจะเสร็จการเกี่ยวเก็บ แต่ต้องเสียค่าเช่า"],["572","b3t5","","","มาตรา ๕๗๒ อันว่าเช่าซื้อนั้น คือสัญญาซึ่งเจ้าของเอาทรัพย์สินออกให้เช่า และให้คำมั่นว่าจะขายทรัพย์สินนั้นหรือว่าจะให้ทรัพย์สินนั้นตกเป็นสิทธิแก่ผู้เช่า โดยเงื่อนไขที่ผู้เช่าได้ใช้เงินเป็นจำนวนเท่านั้นเท่านี้คราว\nสัญญาเช่าซื้อนั้นถ้าไม่ทำเป็นหนังสือ ท่านว่าเป็นโมฆะ"],["573","b3t5","","","มาตรา ๕๗๓ ผู้เช่าจะบอกเลิกสัญญาในเวลาใดเวลาหนึ่งก็ได้ ด้วยส่งมอบทรัพย์สินกลับคืนให้แก่เจ้าของโดยเสียค่าใช้จ่ายของตนเอง"],["574","b3t5","","","มาตรา ๕๗๔ ในกรณีผิดนัดไม่ใช้เงินสองคราวติด ๆ กัน หรือกระทำผิดสัญญาในข้อที่เป็นส่วนสำคัญ เจ้าของทรัพย์สินจะบอกเลิกสัญญาเสียก็ได้ ถ้าเช่นนั้นบรรดาเงินที่ได้ใช้มาแล้วแต่ก่อน ให้ริบเป็นของเจ้าของทรัพย์สิน และเจ้าของทรัพย์สินชอบที่จะกลับเข้าครองทรัพย์สินนั้นได้ด้วย\nอนึ่ง ในกรณีกระทำผิดสัญญาเพราะผิดนัดไม่ใช้เงินซึ่งเป็นคราวที่สุดนั้น ท่านว่าเจ้าของทรัพย์สินชอบที่จะริบบรรดาเงินที่ได้ใช้มาแล้วแต่ก่อนและกลับเข้าครองทรัพย์สินได้ต่อเมื่อระยะเวลาใช้เงินได้พ้นกำหนดไปอีกงวดหนึ่ง"],["575","b3t6","","","มาตรา ๕๗๕ อันว่าจ้างแรงงานนั้น คือสัญญาซึ่งบุคคลคนหนึ่ง เรียกว่าลูกจ้าง ตกลงจะทำงานให้แก่บุคคลอีกคนหนึ่ง เรียกว่านายจ้าง และนายจ้างตกลงจะให้สินจ้างตลอดเวลาที่ทำงานให้"],["576","b3t6","","","มาตรา ๕๗๖ ถ้าตามพฤติการณ์ไม่อาจจะคาดหมายได้ว่างานนั้นจะพึงทำให้เปล่าไซร้ ท่านย่อมถือเอาโดยปริยายว่ามีคำมั่นจะให้สินจ้าง"],["577","b3t6","","","มาตรา ๕๗๗ นายจ้างจะโอนสิทธิของตนให้แก่บุคคลภายนอกก็ได้เมื่อลูกจ้างยินยอมพร้อมใจด้วย\nลูกจ้างจะให้บุคคลภายนอกทำงานแทนตนก็ได้เมื่อนายจ้างยินยอมพร้อมใจด้วย\nถ้าคู่สัญญาฝ่ายใดทำการฝ่าฝืนบทบัญญัตินี้ คู่สัญญาอีกฝ่ายหนึ่งจะบอกเลิกสัญญาเสียก็ได้"],["578","b3t6","","","มาตรา ๕๗๘ ถ้าลูกจ้างรับรองโดยแสดงออกชัดหรือโดยปริยายว่าตนเป็นผู้มีฝีมือพิเศษ หากมาปรากฏว่าไร้ฝีมือเช่นนั้นไซร้ ท่านว่านายจ้างชอบที่จะบอกเลิกสัญญาเสียได้"],["579","b3t6","","","มาตรา ๕๗๙ การที่ลูกจ้างขาดงานไปโดยเหตุอันสมควรและชั่วระยะเวลาน้อยพอสมควรนั้น ท่านว่าไม่ทำให้นายจ้างมีสิทธิบอกเลิกสัญญาได้"],["580","b3t6","","","มาตรา ๕๘๐ ถ้าไม่มีกำหนดโดยสัญญาหรือจารีตประเพณีว่าจะพึงจ่ายสินจ้างเมื่อไร ท่านว่าพึงจ่ายเมื่องานได้ทำแล้วเสร็จ ถ้าการจ่ายสินจ้างนั้นได้กำหนดกันไว้เป็นระยะเวลา ก็ให้พึงจ่ายเมื่อสุดระยะเวลาเช่นนั้นทุกคราวไป"],["581","b3t6","","","มาตรา ๕๘๑ ถ้าระยะเวลาที่ได้ตกลงว่าจ้างกันนั้นสุดสิ้นลงแล้ว ลูกจ้างยังคงทำงานอยู่ต่อไปอีก และนายจ้างรู้ดังนั้นก็ไม่ทักท้วงไซร้ ท่านให้สันนิษฐานไว้ก่อนว่าคู่สัญญาเป็นอันได้ทำสัญญาจ้างกันใหม่โดยความอย่างเดียวกันกับสัญญาเดิม แต่คู่สัญญาฝ่ายใดฝ่ายหนึ่งอาจจะเลิกสัญญาเสียได้ด้วยการบอกกล่าวตามความในมาตราต่อไปนี้"],["582","b3t6","","","มาตรา ๕๘๒ ถ้าคู่สัญญาไม่ได้กำหนดลงไว้ในสัญญาว่าจะจ้างกันนานเท่าไร ท่านว่าฝ่ายใดฝ่ายหนึ่งจะเลิกสัญญาด้วยการบอกกล่าวล่วงหน้าในเมื่อถึงหรือก่อนจะถึงกำหนดจ่ายสินจ้างคราวใดคราวหนึ่ง เพื่อให้เป็นผลเลิกสัญญากันเมื่อถึงกำหนดจ่ายสินจ้างคราวถัดไปข้างหน้าก็อาจทำได้ แต่ไม่จำต้องบอกกล่าวล่วงหน้ากว่าสามเดือน\nอนึ่ง ในเมื่อบอกกล่าวดังว่านี้ นายจ้างจะจ่ายสินจ้างแก่ลูกจ้างเสียให้ครบจำนวนที่จะต้องจ่ายจนถึงเวลาเลิกสัญญาตามกำหนดที่บอกกล่าวนั้นทีเดียว แล้วปล่อยลูกจ้างจากงานเสียในทันทีก็อาจทำได้"],["583","b3t6","","","มาตรา ๕๘๓ ถ้าลูกจ้างจงใจขัดคำสั่งของนายจ้างอันชอบด้วยกฎหมายก็ดี หรือละเลยไม่นำพาต่อคำสั่งเช่นว่านั้นเป็นอาจิณก็ดี ละทิ้งการงานไปเสียก็ดี กระทำความผิดอย่างร้ายแรงก็ดี หรือทำประการอื่นอันไม่สมแก่การปฏิบัติหน้าที่ของตนให้ลุล่วงไปโดยถูกต้องและสุจริตก็ดี ท่านว่านายจ้างจะไล่ออกโดยมิพักต้องบอกกล่าวล่วงหน้าหรือให้สินไหมทดแทนก็ได้"],["584","b3t6","","","มาตรา ๕๘๔ ถ้าจ้างแรงงานรายใดมีสาระสำคัญอยู่ที่ตัวบุคคลผู้เป็นนายจ้าง ท่านว่าสัญญาจ้างเช่นนั้นย่อมระงับไปด้วยมรณะแห่งนายจ้าง"],["585","b3t6","","","มาตรา ๕๘๕ เมื่อการจ้างแรงงานสุดสิ้นลงแล้ว ลูกจ้างชอบที่จะได้รับใบสำคัญแสดงว่าลูกจ้างนั้นได้ทำงานมานานเท่าไรและงานที่ทำนั้นเป็นงานอย่างไร"],["586","b3t6","","","มาตรา ๕๘๖ ถ้าลูกจ้างเป็นผู้ซึ่งนายจ้างได้จ้างเอามาแต่ต่างถิ่นโดยนายจ้างออกเงินค่าเดินทางให้ไซร้ เมื่อการจ้างแรงงานสุดสิ้นลง และถ้ามิได้กำหนดกันไว้เป็นอย่างอื่นในสัญญาแล้ว ท่านว่านายจ้างจำต้องใช้เงินค่าเดินทางขากลับให้ แต่จะต้องเป็นดังต่อไปนี้ คือ\n(๑) สัญญามิได้เลิกหรือระงับเพราะการกระทำหรือความผิดของลูกจ้าง และ\n(๒) ลูกจ้างกลับไปยังถิ่นที่ได้จ้างเอามาภายในเวลาอันสมควร"],["587","b3t7","","","มาตรา ๕๘๗ อันว่าจ้างทำของนั้น คือสัญญาซึ่งบุคคลคนหนึ่ง เรียกว่าผู้รับจ้าง ตกลงรับจะทำการงานสิ่งใดสิ่งหนึ่งจนสำเร็จให้แก่บุคคลอีกคนหนึ่ง เรียกว่าผู้ว่าจ้าง และผู้ว่าจ้างตกลงจะให้สินจ้างเพื่อผลสำเร็จแห่งการที่ทำนั้น"],["588","b3t7","","","มาตรา ๕๘๘ เครื่องมือต่าง ๆ สำหรับใช้ทำการงานให้สำเร็จนั้น ผู้รับจ้างเป็นผู้จัดหา"],["589","b3t7","","","มาตรา ๕๘๙ ถ้าสัมภาระสำหรับทำการงานที่กล่าวนั้นผู้รับจ้างเป็นผู้จัดหา ท่านว่าต้องจัดหาชนิดที่ดี"],["590","b3t7","","","มาตรา ๕๙๐ ถ้าสัมภาระนั้นผู้ว่าจ้างเป็นผู้จัดหามาส่ง ท่านให้ผู้รับจ้างใช้สัมภาระด้วยความระมัดระวังและประหยัดอย่าให้เปลืองเสียเปล่า เมื่อทำการงานสำเร็จแล้ว มีสัมภาระเหลืออยู่ก็ให้คืนแก่ผู้ว่าจ้าง"],["591","b3t7","","","มาตรา ๕๙๑ ถ้าความชำรุดบกพร่องหรือความชักช้าในการที่ทำนั้นเกิดขึ้นเพราะสภาพแห่งสัมภาระซึ่งผู้ว่าจ้างส่งให้ก็ดี เพราะคำสั่งของผู้ว่าจ้างก็ดี ท่านว่าผู้รับจ้างไม่ต้องรับผิด เว้นแต่จะได้รู้อยู่แล้วว่าสัมภาระนั้นไม่เหมาะ หรือว่าคำสั่งนั้นไม่ถูกต้องและมิได้บอกกล่าวตักเตือน"],["592","b3t7","","","มาตรา ๕๙๒ ผู้รับจ้างจำต้องยอมให้ผู้ว่าจ้างหรือตัวแทนของผู้ว่าจ้างตรวจตราการงานได้ตลอดเวลาที่ทำอยู่นั้น"],["593","b3t7","","","มาตรา ๕๙๓ ถ้าผู้รับจ้างไม่เริ่มทำการในเวลาอันควร หรือทำการชักช้าฝ่าฝืนข้อกำหนดแห่งสัญญาก็ดี หรือทำการชักช้าโดยปราศจากความผิดของผู้ว่าจ้าง จนอาจคาดหมายล่วงหน้าได้ว่าการนั้นจะไม่สำเร็จภายในกำหนดเวลาที่ได้ตกลงกันไว้ก็ดี ผู้ว่าจ้างชอบที่จะเลิกสัญญาเสียได้ มิพักต้องรอคอยให้ถึงเวลากำหนดส่งมอบของนั้นเลย"],["594","b3t7","","","มาตรา ๕๙๔ ถ้าในระหว่างเวลาที่ทำการอยู่นั้นเป็นวิสัยจะคาดหมายล่วงหน้าได้แน่นอนว่า การที่ทำนั้นจะสำเร็จอย่างบกพร่องหรือจะเป็นไปในทางอันฝ่าฝืนข้อสัญญาเพราะความผิดของผู้รับจ้างไซร้ ผู้ว่าจ้างจะบอกกล่าวให้ผู้รับจ้างแก้ไขสิ่งที่บกพร่องให้คืนดี หรือทำการให้เป็นไปตามสัญญา ภายในเวลาอันสมควรซึ่งกำหนดให้ในคำบอกกล่าวนั้นก็ได้ ถ้าและคลาดกำหนดนั้นไป ท่านว่าผู้ว่าจ้างชอบที่จะเอาการนั้นให้บุคคลภายนอกซ่อมแซมหรือทำต่อไปได้ ซึ่งผู้รับจ้างจะต้องเสี่ยงความเสียหายและออกค่าใช้จ่ายทั้งสิ้น"],["595","b3t7","","","มาตรา ๕๙๕ ถ้าผู้รับจ้างเป็นผู้จัดหาสัมภาระไซร้ ความรับผิดของผู้รับจ้างในการบกพร่องนั้น ท่านให้บังคับด้วยบทแห่งประมวลกฎหมายนี้ ลักษณะซื้อขาย"],["596","b3t7","","","มาตรา ๕๙๖ ถ้าผู้รับจ้างส่งมอบการที่ทำไม่ทันเวลาที่ได้กำหนดไว้ในสัญญาก็ดี หรือถ้าไม่ได้กำหนดเวลาไว้ในสัญญาเมื่อล่วงพ้นเวลาอันสมควรแก่เหตุก็ดี ผู้ว่าจ้างชอบที่จะได้ลดสินจ้างลง หรือถ้าสาระสำคัญแห่งสัญญาอยู่ที่เวลา ก็ชอบที่จะเลิกสัญญาได้"],["597","b3t7","","","มาตรา ๕๙๗ ถ้าผู้ว่าจ้างยอมรับมอบการที่ทำนั้นแล้วโดยมิได้อิดเอื้อน ผู้รับจ้างก็ไม่ต้องรับผิดเพื่อการที่ส่งมอบเนิ่นช้า"],["598","b3t7","","","มาตรา ๕๙๘ ถ้าผู้ว่าจ้างยอมรับมอบการที่ทำนั้นแล้วทั้งชำรุดบกพร่องมิได้อิดเอื้อนโดยแสดงออกชัดหรือโดยปริยาย ผู้รับจ้างก็ไม่ต้องรับผิด เว้นแต่ความชำรุดบกพร่องนั้นเป็นเช่นจะไม่พึงพบได้ในขณะเมื่อรับมอบ หรือผู้รับจ้างได้ปิดบังความนั้นเสีย"],["599","b3t7","","","มาตรา ๕๙๙ ในกรณีที่ส่งมอบเนิ่นช้าไปก็ดี หรือส่งมอบการที่ทำชำรุดบกพร่องก็ดี ท่านว่าผู้ว่าจ้างชอบที่จะยึดหน่วงสินจ้างไว้ได้ เว้นแต่ผู้รับจ้างจะให้ประกันตามสมควร"],["600","b3t7","","","มาตรา ๖๐๐ ถ้ามิได้กำหนดไว้เป็นอย่างอื่นในสัญญาไซร้ ท่านว่าผู้รับจ้างจะต้องรับผิดเพื่อการที่ทำชำรุดบกพร่องเพียงแต่ที่ปรากฏขึ้นภายในปีหนึ่งนับแต่วันส่งมอบ หรือที่ปรากฏขึ้นภายในห้าปี ถ้าการที่ทำนั้นเป็นสิ่งปลูกสร้างกับพื้นดิน นอกจากเรือนโรงทำด้วยเครื่องไม้\nแต่ข้อจำกัดนี้ท่านมิให้ใช้บังคับเมื่อปรากฏว่าผู้รับจ้างได้ปิดบังความชำรุดบกพร่องนั้น"],["601","b3t7","","","มาตรา ๖๐๑ ท่านห้ามมิให้ฟ้องผู้รับจ้างเมื่อพ้นปีหนึ่งนับแต่วันการชำรุดบกพร่องได้ปรากฏขึ้น"],["602","b3t7","","","มาตรา ๖๐๒ อันสินจ้างนั้นพึงใช้ให้เมื่อรับมอบการที่ทำ\nถ้าการที่ทำนั้นมีกำหนดว่าจะส่งรับกันเป็นส่วน ๆ และได้ระบุจำนวนสินจ้างไว้เป็นส่วน ๆ ไซร้ ท่านว่าพึงใช้สินจ้างเพื่อการแต่ละส่วนในเวลารับเอาส่วนนั้น"],["603","b3t7","","","มาตรา ๖๐๓ ถ้าผู้รับจ้างเป็นผู้จัดหาสัมภาระ และการที่จ้างทำนั้นพังทลายหรือบุบสลายลงก่อนได้ส่งมอบกันถูกต้องไซร้ ท่านว่าความวินาศอันนั้นตกเป็นพับแก่ผู้รับจ้าง หากความวินาศนั้นมิได้เป็นเพราะการกระทำของผู้ว่าจ้าง\nในกรณีเช่นว่านี้ สินจ้างก็เป็นอันไม่ต้องใช้"],["604","b3t7","","","มาตรา ๖๐๔ ถ้าผู้ว่าจ้างเป็นผู้จัดหาสัมภาระ และการที่จ้างทำนั้นพังทลายหรือบุบสลายลงก่อนได้ส่งมอบกันถูกต้องไซร้ ท่านว่าความวินาศนั้นตกเป็นพับแก่ผู้ว่าจ้าง หากความวินาศนั้นมิได้เป็นเพราะการกระทำของผู้รับจ้าง\nในกรณีเช่นว่านี้ สินจ้างก็เป็นอันไม่ต้องใช้ เว้นแต่ความวินาศนั้นเป็นเพราะการกระทำของผู้ว่าจ้าง"],["605","b3t7","","","มาตรา ๖๐๕ ถ้าการที่จ้างยังทำไม่แล้วเสร็จอยู่ตราบใด ผู้ว่าจ้างอาจบอกเลิกสัญญาได้ เมื่อเสียค่าสินไหมทดแทนให้แก่ผู้รับจ้างเพื่อความเสียหายอย่างใด ๆ อันเกิดแต่การเลิกสัญญานั้น"],["606","b3t7","","","มาตรา ๖๐๖ ถ้าสาระสำคัญแห่งสัญญาอยู่ที่ความรู้ความสามารถของตัวผู้รับจ้างและผู้รับจ้างตายก็ดี หรือตกเป็นผู้ไม่สามารถทำการที่รับจ้างนั้นต่อไปได้ด้วยมิใช่เพราะความผิดของตนก็ดี ท่านว่าสัญญานั้นย่อมเป็นอันสิ้นลง\nถ้าและการส่วนที่ได้ทำขึ้นแล้วนั้นเป็นประโยชน์แก่ผู้ว่าจ้างไซร้ ท่านว่าผู้ว่าจ้างจำต้องรับเอาไว้และใช้สินจ้างตามสมควรแก่ส่วนนั้น ๆ"],["607","b3t7","","","มาตรา ๖๐๗ ผู้รับจ้างจะเอาการที่รับจ้างทั้งหมดหรือแบ่งการแต่บางส่วนไปให้ผู้รับจ้างช่วงทำอีกทอดหนึ่งก็ได้ เว้นแต่สาระสำคัญแห่งสัญญานั้นจะอยู่ที่ความรู้ความสามารถของตัวผู้รับจ้าง แต่ผู้รับจ้างคงต้องรับผิดเพื่อความประพฤติหรือความผิดอย่างใด ๆ ของผู้รับจ้างช่วง"],["608","b3t8","","","มาตรา ๖๐๘ อันว่าผู้ขนส่งภายในความหมายแห่งกฎหมายลักษณะนี้ คือบุคคลผู้รับขนส่งของหรือคนโดยสารเพื่อบำเหน็จเป็นทางค้าปกติของตน"],["609","b3t8","","","มาตรา ๖๐๙ การรับขนของหรือคนโดยสารในหน้าที่ของกรมรถไฟหลวงแห่งกรุงสยาม และการขนไปรษณียภัณฑ์ในหน้าที่กรมไปรษณีย์โทรเลขนั้น ท่านให้บังคับตามกฎหมายและกฎข้อบังคับสำหรับทบวงการนั้น ๆ\nรับขนของทางทะเล ท่านให้บังคับตามกฎหมายและกฎข้อบังคับว่าด้วยการนั้น"],["610","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๑๐ อันบุคคลผู้ทำความตกลงกับผู้ขนส่งเพื่อให้ขนของส่งไปนั้น เรียกว่าผู้ส่ง หรือผู้ตราส่ง\nบุคคลผู้ซึ่งเขาส่งของไปถึงนั้น เรียกว่าผู้รับตราส่ง\nบำเหน็จอันจะต้องจ่ายให้เพื่อการขนส่งของนั้น เรียกว่าค่าระวางพาหนะ"],["611","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๑๑ อันว่าอุปกรณ์แห่งค่าระวางพาหนะนั้น ได้แก่ค่าใช้จ่ายอย่างใด ๆ ตามจารีตประเพณีอันผู้ขนส่งได้เสียไปโดยควรในระหว่างขนส่ง"],["612","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๑๒ ถ้าผู้ขนส่งเรียกเอาใบกำกับของ ผู้ส่งต้องทำให้\nใบกำกับของนั้นต้องแสดงรายการต่อไปนี้ คือ\n(๑) สภาพและน้ำหนัก หรือขนาดแห่งของที่ส่ง กับสภาพ จำนวน และเครื่องหมายแห่งหีบห่อ\n(๒) ตำบลที่กำหนดให้ส่ง\n(๓) ชื่อหรือยี่ห้อ และสำนักของผู้รับตราส่ง\n(๔) ตำบลและวันที่ออกใบกำกับของนั้น\nอนึ่ง ใบกำกับของนั้นต้องลงลายมือชื่อผู้ส่งเป็นสำคัญ"],["613","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๑๓ ถ้าผู้ส่งเรียกเอาใบตราส่ง ผู้ขนส่งก็ต้องทำให้\nใบตราส่งนั้นต้องแสดงรายการต่อไปนี้ คือ\n(๑) รายการดังกล่าวไว้ในมาตรา ๖๑๒ (๑) (๒) และ (๓)\n(๒) ชื่อหรือยี่ห้อของผู้ส่ง\n(๓) จำนวนค่าระวางพาหนะ\n(๔) ตำบลและวันที่ออกใบตราส่ง\nอนึ่ง ใบตราส่งนั้นต้องลงลายมือชื่อผู้ขนส่งเป็นสำคัญ"],["614","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๑๔ แม้ว่าใบตราส่งจะได้ออกให้แก่บุคคลผู้ใดโดยนามก็ตาม ท่านว่าย่อมสลักหลังโอนให้กันได้ เว้นแต่จะมีข้อห้ามการสลักหลังไว้"],["615","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๑๕ ถ้าได้ทำใบตราส่งให้แก่กัน ท่านว่าของนั้นจะรับมอบเอาไปได้ต่อเมื่อเวนคืนใบตราส่ง หรือเมื่อผู้รับตราส่งให้ประกันตามควร"],["616","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๑๖ ผู้ขนส่งจะต้องรับผิดในการที่ของอันเขาได้มอบหมายแก่ตนนั้นสูญหายหรือบุบสลายหรือส่งมอบชักช้า เว้นแต่จะพิสูจน์ได้ว่าการสูญหายหรือบุบสลายหรือชักช้านั้นเกิดแต่เหตุสุดวิสัย หรือเกิดแต่สภาพแห่งของนั้นเอง หรือเกิดเพราะความผิดของผู้ส่งหรือผู้รับตราส่ง"],["617","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๑๗ ผู้ขนส่งจะต้องรับผิดในการที่ของสูญหายหรือบุบสลายหรือส่งชักช้า อันเกิดแต่ความผิดของผู้ขนส่งคนอื่น หรือบุคคลอื่นซึ่งตนหากได้มอบหมายของนั้นไปอีกทอดหนึ่ง"],["618","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๑๘ ถ้าของนั้นได้ส่งไปโดยมีผู้ขนส่งหลายคนหลายทอด ท่านว่าผู้ขนส่งทั้งนั้นจะต้องรับผิดร่วมกันในการสูญหาย บุบสลาย หรือส่งชักช้า"],["619","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๑๙ ถ้าของเป็นสภาพอันจะก่อให้เกิดอันตรายได้ หรือเป็นสภาพเกลือกจะก่อให้เกิดเสียหายแก่บุคคลหรือทรัพย์สินไซร้ ผู้ส่งต้องแสดงสภาพแห่งของนั้นไว้ก่อนทำสัญญา ถ้ามิได้ทำเช่นนั้นผู้ส่งจะต้องรับผิดในการเสียหายไม่ว่าอย่างใด ๆ อันเกิดแต่ของนั้น"],["620","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๒๐ ผู้ขนส่งไม่ต้องรับผิดในเงินทองตรา ธนบัตร ธนาคารบัตร ตั๋วเงิน พันธบัตร ใบหุ้น ใบหุ้นกู้ ประทวนสินค้า อัญมณี และของมีค่าอย่างอื่น ๆ หากมิได้รับบอกราคาหรือสภาพแห่งของไว้ในขณะที่ส่งมอบแก่ตน\nแต่ถ้าของนั้นได้บอกราคา ท่านว่าความรับผิดของผู้ขนส่งก็ย่อมจำกัดเพียงไม่เกินราคาที่บอก"],["621","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๒๑ ค่าสินไหมทดแทนในการส่งมอบของชักช้านั้น ท่านห้ามมิให้คิดเกินกว่าจำนวนเช่นจะพึงกำหนดให้ในเหตุของสูญหายสิ้นเชิง"],["622","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๒๒ ของถึงเมื่อใด ผู้ขนส่งต้องบอกกล่าวแก่ผู้รับตราส่ง"],["623","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๒๓ ความรับผิดของผู้ขนส่งย่อมสุดสิ้นลงในเมื่อผู้รับตราส่งได้รับเอาของไว้แล้วโดยไม่อิดเอื้อน และได้ใช้ค่าระวางพาหนะกับทั้งอุปกรณ์เสร็จแล้ว\nแต่ความที่กล่าวนี้ท่านมิให้ใช้บังคับในกรณีที่ของสูญหายหรือบุบสลายเห็นไม่ได้แต่สภาพภายนอกแห่งของนั้น หากว่าได้บอกกล่าวความสูญหายหรือบุบสลายแก่ผู้ขนส่งภายในแปดวันนับแต่วันส่งมอบ\nอนึ่ง บทบัญญัติทั้งหลายนี้ท่านมิให้ใช้บังคับในกรณีที่มีการทุจริตหรือประมาทเลินเล่ออย่างร้ายแรงอันจะปรับเอาเป็นความผิดของผู้ขนส่งได้"],["624","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๒๔ ในข้อความรับผิดของผู้ขนส่งในการที่ของสูญหายหรือบุบสลายหรือส่งของชักช้านั้น ท่านห้ามมิให้ฟ้องเมื่อพ้นกำหนดปีหนึ่งนับแต่ส่งมอบ หรือปีหนึ่งนับแต่วันที่ควรจะได้ส่งมอบ เว้นแต่ในกรณีที่มีการทุจริต"],["625","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๒๕ ใบรับ ใบตราส่ง หรือเอกสารอื่น ๆ ทำนองนั้นก็ดี ซึ่งผู้ขนส่งออกให้แก่ผู้ส่งนั้น ถ้ามีข้อความยกเว้นหรือจำกัดความรับผิดของผู้ขนส่งประการใด ท่านว่าความนั้นเป็นโมฆะ เว้นแต่ผู้ส่งจะได้แสดงความตกลงด้วยชัดแจ้งในการยกเว้นหรือจำกัดความรับผิดเช่นว่านั้น"],["626","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๒๖ ตราบใดของยังอยู่ในมือผู้ขนส่ง ตราบนั้นผู้ส่ง หรือถ้าได้ทำใบตราส่ง ผู้ทรงใบตราส่งนั้น อาจจะให้ผู้ขนส่งงดการส่งของนั้นไป หรือให้ส่งกลับคืนมา หรือให้จัดการแก่ของนั้นเป็นอย่างอื่นประการใดก็ได้\nในเหตุเช่นนี้ ผู้ขนส่งชอบที่จะได้รับเงินค่าระวางพาหนะตามส่วนแห่งระยะทางที่ได้จัดการขนส่งไปแล้ว กับทั้งค่าใช้จ่ายอื่น ๆ ที่ต้องเสียไปเพราะเหตุที่บอกงดหรือเพราะส่งของกลับคืน หรือเพราะจัดการเป็นประการอื่นนั้น"],["627","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๒๗ เมื่อของถึงตำบลที่กำหนดให้ส่ง และผู้รับตราส่งได้เรียกให้ส่งมอบแล้ว ท่านว่าแต่นั้นไปสิทธิทั้งหลายของผู้ส่งอันเกิดแต่สัญญารับขนนั้นย่อมตกไปได้แก่ผู้รับตราส่ง"],["628","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๒๘ ถ้าว่าของสูญหายไปเพราะเหตุสุดวิสัย ท่านว่าผู้ขนส่งไม่มีสิทธิจะได้เงินค่าระวางพาหนะ ถ้าและได้รับไปก่อนแล้วเท่าใดต้องส่งคืนจงสิ้น"],["629","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๒๙ ถ้าผู้ขนส่งคนใดส่งมอบของเสียแต่ก่อนได้รับค่าระวางพาหนะและอุปกรณ์ไซร้ ท่านว่าผู้ขนส่งคนนั้นยังคงต้องรับผิดต่อผู้ขนส่งก่อน ๆ ตนเพื่อค่าระวางพาหนะและอุปกรณ์ซึ่งยังค้างชำระแก่เขา"],["630","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๓๐ ผู้ขนส่งชอบที่จะยึดหน่วงเอาของไว้ก่อนได้ตามที่จำเป็น เพื่อประกันการใช้เงินค่าระวางพาหนะและอุปกรณ์"],["631","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๓๑ ถ้าหาตัวผู้รับตราส่งไม่พบก็ดี หรือถ้าผู้รับตราส่งบอกปัดไม่ยอมรับมอบของก็ดี ผู้ขนส่งต้องบอกกล่าวไปยังผู้ส่งทันที และถามเอาคำสั่งของผู้ส่ง\nถ้าหากว่าพฤติการณ์ขัดขวางไม่สามารถจะทำได้ดังนี้ก็ดี หรือถ้าผู้ส่งละเลยเสียไม่ส่งคำสั่งมาในเวลาอันควรก็ดี หรือส่งมาเป็นคำสั่งอันไม่อาจปฏิบัติให้เป็นไปได้ก็ดี ท่านว่าผู้ขนส่งมีอำนาจที่จะเอาของไปฝากไว้ ณ สำนักงานฝากทรัพย์ได้\nถ้าของนั้นเป็นลหุภัณฑ์ของสดเสียได้ และการหน่วงช้าไว้ย่อมเป็นการเสี่ยงความเสียหายก็ดี หรือถ้าราคาของนั้นดูไม่น่าจะคุ้มค่าระวางพาหนะและอุปกรณ์ก็ดี ผู้ขนส่งจะเอาของนั้นออกขายทอดตลาดเสียก็ได้\nอนึ่ง การเอาของไปฝากหรือเอาออกขายทอดตลาดเช่นว่านั้น ผู้ขนส่งต้องบอกกล่าวแก่ผู้ส่งหรือผู้รับตราส่งมิให้ชักช้า เว้นแต่ไม่สามารถจะทำได้ ถ้าและผู้ขนส่งละเลยเสียไม่บอกกล่าวไซร้ ท่านว่าจะต้องรับผิดใช้ค่าเสียหาย"],["632","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๓๒ เมื่อเอาของออกขายทอดตลาดแล้วได้เงินจำนวนสุทธิเท่าใด ให้ผู้ขนส่งหักเอาไว้เป็นค่าระวางพาหนะและค่าอุปกรณ์ ถ้าและยังมีเงินเหลืออยู่อีกเท่าใด ต้องส่งมอบให้แก่บุคคลผู้ควรที่จะได้เงินนั้นโดยพลัน"],["633","b3t8","หมวด ๑ รับขนของ","","มาตรา ๖๓๓ ถ้าของนั้นได้ขนส่งไปโดยมีผู้ขนส่งหลายคนหลายทอด ท่านว่าผู้ขนส่งทอดหลังที่สุดอาจใช้สิทธิดังกล่าวในมาตรา ๖๓๐ มาตรา ๖๓๑ มาตรา ๖๓๒ นั้น ในการเรียกเงินค่าระวางพาหนะและอุปกรณ์อันค้างชำระแก่ผู้ขนส่งทั่วทุกคนได้"],["634","b3t8","หมวด ๒ รับขนคนโดยสาร","","มาตรา ๖๓๔ ผู้ขนส่งจะต้องรับผิดต่อคนโดยสารในความเสียหายอันเกิดแก่ตัวเขา หรือในความเสื่อมเสียอย่างใด ๆ อันเป็นผลโดยตรงแต่การที่ต้องชักช้าในการขนส่ง เว้นแต่การเสียหายหรือชักช้านั้นเกิดแต่เหตุสุดวิสัยหรือเกิดแต่ความผิดของคนโดยสารนั้นเอง"],["635","b3t8","หมวด ๒ รับขนคนโดยสาร","","มาตรา ๖๓๕ เครื่องเดินทางหากได้มอบหมายแก่ผู้ขนส่งทันเวลา ท่านว่าต้องส่งมอบในขณะคนโดยสารถึง"],["636","b3t8","หมวด ๒ รับขนคนโดยสาร","","มาตรา ๖๓๖ ถ้าคนโดยสารไม่รับมอบเครื่องเดินทางของตนภายในเวลาเดือนหนึ่งนับแต่วันเครื่องเดินทางนั้นถึงไซร้ ผู้ขนส่งอาจเอาออกขายทอดตลาดเสียได้\nถ้าเครื่องเดินทางนั้นมีสภาพเป็นของสดของเสียได้ ผู้ขนส่งอาจเอาออกขายทอดตลาดได้ เมื่อของนั้นถึงแล้วรออยู่ล่วงเวลากว่ายี่สิบสี่ชั่วโมง\nบทบัญญัติในมาตรา ๖๓๒ นั้น ท่านให้ใช้บังคับแก่คดีดังว่านี้ด้วยอนุโลมตามควร"],["637","b3t8","หมวด ๒ รับขนคนโดยสาร","","มาตรา ๖๓๗ สิทธิและความรับผิดของผู้ขนส่งเพื่อเครื่องเดินทางอันได้มอบหมายแก่ผู้ขนส่งนั้น แม้ผู้ขนส่งจะมิได้คิดเอาค่าขนส่งต่างหากก็ตาม ท่านให้บังคับตามความในหมวด ๑"],["638","b3t8","หมวด ๒ รับขนคนโดยสาร","","มาตรา ๖๓๘ ผู้ขนส่งไม่ต้องรับผิดในเครื่องเดินทางซึ่งตนมิได้รับมอบหมาย เว้นแต่เมื่อเครื่องเดินทางนั้นสูญหายหรือบุบสลายไปเพราะความผิดของผู้ขนส่งหรือลูกจ้างของผู้ขนส่ง"],["639","b3t8","หมวด ๒ รับขนคนโดยสาร","","มาตรา ๖๓๙ ตั๋ว ใบรับ หรือเอกสารอื่นทำนองเช่นว่านี้อันผู้ขนส่งได้ส่งมอบแก่คนโดยสารนั้น หากมีข้อความยกเว้นหรือจำกัดความรับผิดของผู้ขนส่งอย่างใด ๆ ท่านว่าข้อความนั้นเป็นโมฆะ เว้นแต่คนโดยสารจะได้ตกลงด้วยชัดแจ้งในการยกเว้นหรือจำกัดความรับผิดเช่นนั้น"],["640","b3t9","หมวด ๑ ยืมใช้คงรูป","","มาตรา ๖๔๐ อันว่ายืมใช้คงรูปนั้น คือสัญญาซึ่งบุคคลคนหนึ่ง เรียกว่าผู้ให้ยืม ให้บุคคลอีกคนหนึ่ง เรียกว่าผู้ยืม ใช้สอยทรัพย์สินสิ่งใดสิ่งหนึ่งได้เปล่า และผู้ยืมตกลงว่าจะคืนทรัพย์สินนั้น เมื่อได้ใช้สอยเสร็จแล้ว"],["641","b3t9","หมวด ๑ ยืมใช้คงรูป","","มาตรา ๖๔๑ การให้ยืมใช้คงรูปนั้น ท่านว่าย่อมบริบูรณ์ต่อเมื่อส่งมอบทรัพย์สินซึ่งให้ยืม"],["642","b3t9","หมวด ๑ ยืมใช้คงรูป","","มาตรา ๖๔๒ ค่าฤชาธรรมเนียมในการทำสัญญาก็ดี ค่าส่งมอบและค่าส่งคืนทรัพย์สินซึ่งยืมก็ดี ย่อมตกแก่ผู้ยืมเป็นผู้เสีย"],["643","b3t9","หมวด ๑ ยืมใช้คงรูป","","มาตรา ๖๔๓ ทรัพย์สินซึ่งยืมนั้น ถ้าผู้ยืมเอาไปใช้การอย่างอื่นนอกจากการอันเป็นปกติแก่ทรัพย์สินนั้น หรือนอกจากการอันปรากฏในสัญญาก็ดี เอาไปให้บุคคลภายนอกใช้สอยก็ดี เอาไปไว้นานกว่าที่ควรจะเอาไว้ก็ดี ท่านว่าผู้ยืมจะต้องรับผิดในเหตุทรัพย์สินนั้นสูญหายหรือบุบสลายไปอย่างหนึ่งอย่างใด แม้ถึงจะเป็นเพราะเหตุสุดวิสัย เว้นแต่จะพิสูจน์ได้ว่าถึงอย่างไร ๆ ทรัพย์สินนั้นก็คงจะต้องสูญหายหรือบุบสลายอยู่นั่นเอง"],["644","b3t9","หมวด ๑ ยืมใช้คงรูป","","มาตรา ๖๔๔ ผู้ยืมจำต้องสงวนทรัพย์สินซึ่งยืมไปเหมือนเช่นวิญญูชนจะพึงสงวนทรัพย์สินของตนเอง"],["645","b3t9","
