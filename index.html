<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2f63">
<meta name="description" content="ท่องมาตรา ป.พ.พ. ครบ ๖ บรรพ ตัวบทตรงกับฉบับปรับปรุงล่าสุดของสำนักงานคณะกรรมการกฤษฎีกา">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ท่องมาตรา">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ท่องมาตรา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one-column study desk — sticky header with rank, tab rail, filter strip, then the active workspace */
:root{
  --bg:#d6dcec; --surface:#e8ecf6; --sunk:#cbd3e7; --line:#b5bfd9;
  --ink:#18203d; --muted:#4c5577; --faint:#6f7799;
  --navy:#1f2f63; --gold:#b8862b; --gold-soft:#f5e9cf;
  --orange:#d9650f; --teal:#0f8a83; --purple:#6d3fb8; --red:#c2312f;
  --ok:#1d8a4e; --ok-soft:#dff3e7; --warn:#a86a00; --warn-soft:#fbefd4; --bad:#c2312f; --bad-soft:#fbe3e2;
  --on-accent:#ffffff;
  --f-ui:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-law:"Noto Serif Thai","Sarabun","Leelawadee UI",Tahoma,serif;
  --f-num:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10142a; --surface:#181d38; --sunk:#222849; --line:#2f365c;
  --ink:#e7e9f5; --muted:#a3a9c8; --faint:#7a80a2;
  --navy:#8fa6ff; --gold:#e2b45a; --gold-soft:#3a3120;
  --orange:#ff9a4d; --teal:#3cc7bd; --purple:#b593ff; --red:#ff7b77;
  --ok:#4fd18a; --ok-soft:#173a29; --warn:#f0b94a; --warn-soft:#3b3018; --bad:#ff7b77; --bad-soft:#40201f;
  --on-accent:#0d1024; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10142a; --surface:#181d38; --sunk:#222849; --line:#2f365c;
  --ink:#e7e9f5; --muted:#a3a9c8; --faint:#7a80a2;
  --navy:#8fa6ff; --gold:#e2b45a; --gold-soft:#3a3120;
  --orange:#ff9a4d; --teal:#3cc7bd; --purple:#b593ff; --red:#ff7b77;
  --ok:#4fd18a; --ok-soft:#173a29; --warn:#f0b94a; --warn-soft:#3b3018; --bad:#ff7b77; --bad-soft:#40201f;
  --on-accent:#0d1024; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-num);font-size:26px;font-weight:700;letter-spacing:.01em;color:var(--navy)}
.seal{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:var(--on-accent);font-family:var(--f-num);font-weight:700;font-size:15px;flex:none}
.rank{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
.rankbadge{font-family:var(--f-num);font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold);letter-spacing:.04em;white-space:nowrap}
.xpbar{flex:1;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;min-width:60px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--orange));width:0;transition:width .4s}
.xptext{font-size:12.5px;color:var(--muted);white-space:nowrap}
.streak{font-family:var(--f-num);font-size:13px;color:var(--orange);font-weight:600;white-space:nowrap}
nav.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--muted)}
nav.tabs button[aria-selected="true"]{color:var(--on-accent);border-color:transparent;background:var(--c)}
nav.tabs button:not([aria-selected="true"]){color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}

/* filter strip */
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.filters select,.search input,.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.search{display:flex;gap:8px}
.search input{flex:1}
@media (max-width:560px){.filters{grid-template-columns:1fr 1fr}.filters select:first-child{grid-column:1/-1}}

.panel{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.meta{font-size:13px;color:var(--muted)}
.crumb{font-size:12.5px;color:var(--muted);line-height:1.5}
.secno{font-family:var(--f-num);font-weight:700;font-size:30px;color:var(--navy);line-height:1.1}
.secno small{font-family:var(--f-ui);font-size:14px;font-weight:600;color:var(--muted);margin-right:6px}
.lawtext{font-family:var(--f-law);font-size:17px;line-height:1.95;white-space:pre-wrap;word-break:break-word;min-width:0}
.lawtext p{margin:0 0 .5em;text-indent:2em}
.hint{border:1.5px dashed var(--line);border-radius:10px;padding:22px 14px;text-align:center;color:var(--muted)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--navy);color:var(--on-accent);border-color:transparent}
.btn.teal{background:var(--teal);color:var(--on-accent);border-color:transparent}
.btn.ok{background:var(--ok);color:var(--on-accent);border-color:transparent}
.btn.warn{background:var(--warn);color:var(--on-accent);border-color:transparent}
.btn.bad{background:var(--bad);color:var(--on-accent);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{border-color:var(--gold);color:var(--gold)}
.chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.boxes{display:flex;gap:4px}
.boxes i{width:18px;height:6px;border-radius:3px;background:var(--sunk)}
.boxes i.f{background:var(--teal)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.audio{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.audio select{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:5px 8px}
.rec{color:var(--bad)}
.rec.live{background:var(--bad);color:var(--on-accent);border-color:transparent;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
textarea.note{width:100%;min-height:64px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}
.typebox{width:100%;min-height:180px;font-family:var(--f-law);font-size:16px;line-height:1.8;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-num);font-size:44px;line-height:1}
.diff{font-family:var(--f-law);font-size:16px;line-height:1.95;white-space:pre-wrap;word-break:break-word;background:var(--sunk);border-radius:10px;padding:12px}
.diff .miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.diff .extra{color:var(--warn);text-decoration:line-through}
.cloze input{font-family:var(--f-law);font-size:15px;border:none;border-bottom:2px solid var(--teal);background:var(--sunk);border-radius:4px 4px 0 0;padding:0 4px;margin:0 2px;width:auto}
.cloze input.r{border-color:var(--ok);background:var(--ok-soft)}
.cloze input.w{border-color:var(--bad);background:var(--bad-soft)}
.choices{display:grid;gap:8px}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-family:var(--f-law);font-size:15px;line-height:1.7}
.choice.num{font-family:var(--f-num);font-size:18px;text-align:center}
.choice.r{border-color:var(--ok);background:var(--ok-soft)}
.choice.w{border-color:var(--bad);background:var(--bad-soft)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--on-accent);border-color:transparent}

/* stage map */
.book{display:flex;flex-direction:column;gap:10px}
.book h2{font-size:18px;color:var(--navy)}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.stage{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.stage .lvl{font-family:var(--f-num);font-size:12px;letter-spacing:.08em;color:var(--orange);font-weight:700}
.stage h3{font-size:14.5px;font-weight:600}
.stage .bar{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.stage .bar i{display:block;height:100%;background:var(--orange)}
.stage.locked{opacity:.55}
.stage.clear{border-color:var(--gold)}
.stars{color:var(--gold);letter-spacing:2px;font-size:14px}

/* library */
details.tree{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.tree>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}
details.tree>summary::-webkit-details-marker{display:none}
details.tree>summary::before{content:"▸";color:var(--faint);transition:transform .2s}
details.tree[open]>summary::before{transform:rotate(90deg)}
.tbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.titlerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}
.titlerow .nm{flex:1;min-width:160px}
.secgrid{display:flex;flex-wrap:wrap;gap:5px}
.secgrid button{font-family:var(--f-num);font-size:13px;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:2px 8px;min-width:44px}
.secgrid button.b3{border-color:var(--teal);color:var(--teal)}
.secgrid button.b5{background:var(--teal);color:var(--on-accent);border-color:transparent}
.secgrid button.star{box-shadow:inset 0 -2px 0 var(--red)}
.results{display:flex;flex-direction:column;gap:6px}
.res{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.res b{font-family:var(--f-num);color:var(--navy)}
.res span{font-size:13.5px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
mark{background:var(--gold-soft);color:inherit;border-radius:3px}

/* modal */
dialog{border:none;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,14,35,.55)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{font-size:19px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field textarea{min-height:160px;font-size:13.5px}
ol.steps{margin:0;padding-left:20px;font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
.ai{background:var(--sunk);border-radius:10px;padding:12px;font-size:14.5px;white-space:pre-wrap}
.small{font-size:12.5px;color:var(--faint)}
.ref{font-size:10.5px;line-height:1.4;color:var(--faint);margin:-6px 4px 0;opacity:.85}
p.foot{font-size:10.5px;color:var(--faint);text-align:center;margin:8px 0 0}
a{color:var(--navy)}
</style>
</head>
<body>


<div class="wrap">
<header class="top">
  <div class="brand">
    <div class="seal" aria-hidden="true">ม.</div>
    <h1>ท่องมาตรา</h1>
    <div class="rank"><span class="rankbadge" id="rankName">BRONZE</span><div class="xpbar"><i id="xpFill"></i></div></div>
    <span class="xptext" id="xpText">0 XP</span>
    <span class="streak" id="streak"></span>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="learn" style="--c:var(--navy)" aria-selected="true">ท่อง</button>
    <button role="tab" data-tab="stage" style="--c:var(--orange)">ด่าน</button>
    <button role="tab" data-tab="type" style="--c:var(--teal)">พิมพ์ทดสอบ</button>
    <button role="tab" data-tab="lib" style="--c:var(--purple)">คลังมาตรา</button>
    <button role="tab" data-tab="exam" style="--c:var(--red)">เก็งข้อสอบ</button>
  </nav>
</header>

<section class="panel" id="filterBar">
  <div class="filters">
    <select id="fLaw" aria-label="กฎหมาย/บรรพ"></select>
    <select id="fTitle" aria-label="ลักษณะ"></select>
    <select id="fChap" aria-label="หมวด"></select>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="ค้นหามาตรา เช่น 420 หรือ 193/30 หรือพิมพ์คำในตัวบท" autocomplete="off">
  </div>
  <div class="seg" id="modeSeg" aria-label="ชุดที่ท่อง"></div>
</section>

<main id="view" class="panel"></main>
<p class="foot">ตัวบท ป.พ.พ. ทั้ง ๑,๘๔๖ รายการ ตรงคำต่อคำกับ <a href="https://searchlaw.ocs.go.th/council-of-state/#/public/doc/Qko1NGNVa1FhMG9hTTNGcU9sTGxydz09" target="_blank" rel="noopener">ประมวลกฎหมายแพ่งและพาณิชย์ ฉบับปรับปรุงล่าสุด</a> ของสำนักงานคณะกรรมการกฤษฎีกา (ตรวจทาน ๒๐ ต.ค. ๒๕๖๙) · เชิงอรรถใต้แต่ละมาตราอ้างตามที่กฤษฎีกาอ้างไว้</p>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
const CCC=[["4","b1t1","","","มาตรา ๔ กฎหมายนั้น ต้องใช้ในบรรดากรณีซึ่งต้องด้วยบทบัญญัติใด ๆ แห่งกฎหมายตามตัวอักษร หรือตามความมุ่งหมายของบทบัญญัตินั้น ๆ\nเมื่อไม่มีบทกฎหมายที่จะยกมาปรับคดีได้ ให้วินิจฉัยคดีนั้นตามจารีตประเพณีแห่งท้องถิ่น ถ้าไม่มีจารีตประเพณีเช่นว่านั้น ให้วินิจฉัยคดีอาศัยเทียบบทกฎหมายที่ใกล้เคียงอย่างยิ่ง และถ้าบทกฎหมายเช่นนั้นก็ไม่มีด้วย ให้วินิจฉัยตามหลักกฎหมายทั่วไป"],["5","b1t1","","","มาตรา ๕ ในการใช้สิทธิแห่งตนก็ดี ในการชำระหนี้ก็ดี บุคคลทุกคนต้องกระทำโดยสุจริต"],["6","b1t1","","","มาตรา ๖ ให้สันนิษฐานไว้ก่อนว่า บุคคลทุกคนกระทำการโดยสุจริต"],["7","b1t1","","","มาตรา ๗ ถ้าจะต้องเสียดอกเบี้ยแก่กันและมิได้กำหนดอัตราดอกเบี้ยไว้โดยนิติกรรมหรือโดยบทกฎหมายอันชัดแจ้ง ให้ใช้อัตราร้อยละสามต่อปี\nอัตราตามวรรคหนึ่งอาจปรับเปลี่ยนให้ลดลงหรือเพิ่มขึ้นเพื่อให้สอดคล้องกับสภาพเศรษฐกิจของประเทศได้โดยตราเป็นพระราชกฤษฎีกา โดยปกติให้กระทรวงการคลังพิจารณาทบทวนทุกสามปีให้ใกล้เคียงกับอัตราเฉลี่ยระหว่างอัตราดอกเบี้ยเงินฝากกับอัตราดอกเบี้ยเงินให้กู้ยืมของธนาคารพาณิชย์"],["8","b1t1","","","มาตรา ๘ คำว่า “เหตุสุดวิสัย” หมายความว่า เหตุใด ๆ อันจะเกิดขึ้นก็ดี จะให้ผลพิบัติก็ดี เป็นเหตุที่ไม่อาจป้องกันได้แม้ทั้งบุคคลผู้ต้องประสบหรือใกล้จะต้องประสบเหตุนั้น จะได้จัดการระมัดระวังตามสมควรอันพึงคาดหมายได้จากบุคคลในฐานะและภาวะเช่นนั้น"],["9","b1t1","","","มาตรา ๙ เมื่อมีกิจการอันใดซึ่งกฎหมายบังคับให้ทำเป็นหนังสือ บุคคลผู้จะต้องทำหนังสือไม่จำเป็นต้องเขียนเอง แต่หนังสือนั้นต้องลงลายมือชื่อของบุคคลนั้น\nลายพิมพ์นิ้วมือ แกงได ตราประทับ หรือเครื่องหมายอื่นทำนองเช่นว่านั้นที่ทำลงในเอกสารแทนการลงลายมือชื่อ หากมีพยานลงลายมือชื่อรับรองไว้ด้วยสองคนแล้วให้ถือเสมอกับลงลายมือชื่อ\nความในวรรคสองไม่ใช้บังคับแก่การลงลายพิมพ์นิ้วมือ แกงได ตราประทับ หรือเครื่องหมายอื่นทำนองเช่นว่านั้น ซึ่งทำลงในเอกสารที่ทำต่อหน้าพนักงานเจ้าหน้าที่"],["10","b1t1","","","มาตรา ๑๐ เมื่อความข้อใดข้อหนึ่งในเอกสารอาจตีความได้สองนัย นัยไหนจะทำให้เป็นผลบังคับได้ ให้ถือเอาตามนัยนั้นดีกว่าที่จะถือเอานัยที่ไร้ผล"],["11","b1t1","","","มาตรา ๑๑ ในกรณีที่มีข้อสงสัย ให้ตีความไปในทางที่เป็นคุณแก่คู่กรณีฝ่ายซึ่งจะเป็นผู้ต้องเสียในมูลหนี้นั้น"],["12","b1t1","","","มาตรา ๑๒ ในกรณีที่จำนวนเงินหรือปริมาณในเอกสารแสดงไว้ทั้งตัวอักษรและตัวเลข ถ้าตัวอักษรกับตัวเลขไม่ตรงกัน และมิอาจหยั่งทราบเจตนาอันแท้จริงได้ ให้ถือเอาจำนวนเงินหรือปริมาณที่เป็นตัวอักษรเป็นประมาณ"],["13","b1t1","","","มาตรา ๑๓ ถ้าจำนวนเงินหรือปริมาณในเอกสารแสดงไว้เป็นตัวอักษรหลายแห่ง หรือเป็นตัวเลขหลายแห่ง แต่ที่แสดงไว้หลายแห่งนั้นไม่ตรงกัน และมิอาจหยั่งทราบเจตนาอันแท้จริงได้ ให้ถือเอาจำนวนเงินหรือปริมาณน้อยที่สุดเป็นประมาณ"],["14","b1t1","","","มาตรา ๑๔ ในกรณีที่เอกสารทำขึ้นไว้หลายภาษา ไม่ว่าจะเป็นฉบับเดียวกันหรือหลายฉบับก็ตามโดยมีภาษาไทยด้วย ถ้าข้อความในหลายภาษานั้นแตกต่างกัน และมิอาจหยั่งทราบเจตนาของคู่กรณีได้ว่าจะใช้ภาษาใดบังคับ ให้ถือตามภาษาไทย"],["15","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๑ สภาพบุคคล","มาตรา ๑๕ สภาพบุคคลย่อมเริ่มแต่เมื่อคลอดแล้วอยู่รอดเป็นทารกและสิ้นสุดลงเมื่อตาย\nทารกในครรภ์มารดาก็สามารถมีสิทธิต่าง ๆ ได้ หากว่าภายหลังคลอดแล้วอยู่รอดเป็นทารก"],["16","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๑ สภาพบุคคล","มาตรา ๑๖ การนับอายุของบุคคล ให้เริ่มนับแต่วันเกิด ในกรณีที่รู้ว่าเกิดในเดือนใดแต่ไม่รู้วันเกิด ให้นับวันที่หนึ่งแห่งเดือนนั้นเป็นวันเกิด แต่ถ้าพ้นวิสัยที่จะหยั่งรู้เดือนและวันเกิดของบุคคลใด ให้นับอายุบุคคลนั้นตั้งแต่วันต้นปีปฏิทิน ซึ่งเป็นปีที่บุคคลนั้นเกิด"],["17","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๑ สภาพบุคคล","มาตรา ๑๗ ในกรณีบุคคลหลายคนตายในเหตุภยันตรายร่วมกัน ถ้าเป็นการพ้นวิสัยที่จะกำหนดได้ว่าคนไหนตายก่อนหลัง ให้ถือว่าตายพร้อมกัน"],["18","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๑ สภาพบุคคล","มาตรา ๑๘ สิทธิของบุคคลในการที่จะใช้นามอันชอบที่จะใช้ได้นั้น ถ้ามีบุคคลอื่นโต้แย้งก็ดี หรือบุคคลผู้เป็นเจ้าของนามนั้นต้องเสื่อมเสียประโยชน์เพราะการที่มีผู้อื่นมาใช้นามเดียวกันโดยมิได้รับอำนาจให้ใช้ได้ก็ดี บุคคลผู้เป็นเจ้าของนามจะเรียกให้บุคคลนั้นระงับความเสียหายก็ได้ ถ้าและเป็นที่พึงวิตกว่าจะต้องเสียหายอยู่สืบไป จะร้องขอต่อศาลให้สั่งห้ามก็ได้"],["19","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๑๙ บุคคลย่อมพ้นจากภาวะผู้เยาว์และบรรลุนิติภาวะเมื่อมีอายุยี่สิบปีบริบูรณ์"],["20","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๒๐ ผู้เยาว์ย่อมบรรลุนิติภาวะเมื่อทำการสมรส หากการสมรสนั้นได้ทำตามบทบัญญัติมาตรา ๑๔๔๘"],["21","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๒๑ ผู้เยาว์จะทำนิติกรรมใด ๆ ต้องได้รับความยินยอมของผู้แทนโดยชอบธรรมก่อนการใด ๆ ที่ผู้เยาว์ได้ทำลงปราศจากความยินยอมเช่นว่านั้นเป็นโมฆียะ เว้นแต่จะบัญญัติไว้เป็นอย่างอื่น"],["22","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๒๒ ผู้เยาว์อาจทำการใด ๆ ได้ทั้งสิ้น หากเป็นเพียงเพื่อจะได้ไปซึ่งสิทธิอันใดอันหนึ่ง หรือเป็นการเพื่อให้หลุดพ้นจากหน้าที่อันใดอันหนึ่ง"],["23","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๒๓ ผู้เยาว์อาจทำการใด ๆ ได้ทั้งสิ้น ซึ่งเป็นการต้องทำเองเฉพาะตัว"],["24","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๒๔ ผู้เยาว์อาจทำการใด ๆ ได้ทั้งสิ้น ซึ่งเป็นการสมแก่ฐานานุรูปแห่งตน และเป็นการอันจำเป็นในการดำรงชีพตามสมควร"],["25","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๒๕ ผู้เยาว์อาจทำพินัยกรรมได้เมื่อมีอายุสิบห้าปีบริบูรณ์"],["26","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๒๖ ถ้าผู้แทนโดยชอบธรรมอนุญาตให้ผู้เยาว์จำหน่ายทรัพย์สินเพื่อการอันใดอันหนึ่งอันได้ระบุไว้ ผู้เยาว์จะจำหน่ายทรัพย์สินนั้นเป็นประการใดภายในขอบของการที่ระบุไว้นั้นก็ทำได้ตามใจสมัคร อนึ่ง ถ้าได้รับอนุญาตให้จำหน่ายทรัพย์สินโดยมิได้ระบุว่าเพื่อการอันใด ผู้เยาว์ก็จำหน่ายได้ตามใจสมัคร"],["27","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๒๗ ผู้แทนโดยชอบธรรมอาจให้ความยินยอมแก่ผู้เยาว์ในการประกอบธุรกิจทางการค้าหรือธุรกิจอื่น หรือในการทำสัญญาเป็นลูกจ้างในสัญญาจ้างแรงงานได้ ในกรณีที่ผู้แทนโดยชอบธรรมไม่ให้ความยินยอมโดยไม่มีเหตุอันสมควร ผู้เยาว์อาจร้องขอต่อศาลให้สั่งอนุญาตได้\nในความเกี่ยวพันกับการประกอบธุรกิจหรือการจ้างแรงงานตามวรรคหนึ่งให้ผู้เยาว์มีฐานะเสมือนดังบุคคลซึ่งบรรลุนิติภาวะแล้ว\nถ้าการประกอบธุรกิจหรือการทำงานที่ได้รับความยินยอมหรือที่ได้รับอนุญาตตามวรรคหนึ่ง ก่อให้เกิดความเสียหายถึงขนาดหรือเสื่อมเสียแก่ผู้เยาว์ ผู้แทนโดยชอบธรรมอาจบอกเลิกความยินยอมที่ได้ให้แก่ผู้เยาว์เสียได้ หรือในกรณีที่ศาลอนุญาต ผู้แทนโดยชอบธรรมอาจร้องขอต่อศาลให้เพิกถอนการอนุญาตที่ได้ให้แก่ผู้เยาว์นั้นเสียได้\nในกรณีที่ผู้แทนโดยชอบธรรมบอกเลิกความยินยอมโดยไม่มีเหตุอันสมควร ผู้เยาว์อาจร้องขอต่อศาลให้เพิกถอนการบอกเลิกความยินยอมของผู้แทนโดยชอบธรรมได้\nการบอกเลิกความยินยอมโดยผู้แทนโดยชอบธรรมหรือการเพิกถอนการอนุญาตโดยศาล ย่อมทำให้ฐานะเสมือนดังบุคคลซึ่งบรรลุนิติภาวะแล้วของผู้เยาว์สิ้นสุดลง แต่ไม่กระทบกระเทือนการใด ๆ ที่ผู้เยาว์ได้กระทำไปแล้วก่อนมีการบอกเลิกความยินยอมหรือเพิกถอนการอนุญาต"],["28","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๒๘ บุคคลวิกลจริตผู้ใด ถ้าคู่สมรสก็ดี ผู้บุพการีกล่าวคือ บิดา มารดา ปู่ย่า ตายาย ทวดก็ดี ผู้สืบสันดานกล่าวคือ ลูก หลาน เหลน ลื่อก็ดี ผู้ปกครองหรือผู้พิทักษ์ก็ดี ผู้ซึ่งปกครองดูแลบุคคลนั้นอยู่ก็ดี หรือพนักงานอัยการก็ดี ร้องขอต่อศาลให้สั่งให้บุคคลวิกลจริตผู้นั้นเป็นคนไร้ความสามารถ ศาลจะสั่งให้บุคคลวิกลจริตผู้นั้นเป็นคนไร้ความสามารถก็ได้\nบุคคลซึ่งศาลได้สั่งให้เป็นคนไร้ความสามารถตามวรรคหนึ่ง ต้องจัดให้อยู่ในความอนุบาล การแต่งตั้งผู้อนุบาล อำนาจหน้าที่ของผู้อนุบาล และการสิ้นสุดของความเป็นผู้อนุบาล ให้เป็นไปตามบทบัญญัติบรรพ ๕ แห่งประมวลกฎหมายนี้\nคำสั่งของศาลตามมาตรานี้ ให้ประกาศในราชกิจจานุเบกษา"],["29","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๒๙ การใด ๆ อันบุคคลซึ่งศาลสั่งให้เป็นคนไร้ความสามารถได้กระทำลง การนั้นเป็นโมฆียะ"],["30","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๓๐ การใด ๆ อันบุคคลวิกลจริตซึ่งศาลยังมิได้สั่งให้เป็นคนไร้ความสามารถได้กระทำลง การนั้นจะเป็นโมฆียะต่อเมื่อได้กระทำในขณะที่บุคคลนั้นจริตวิกลอยู่ และคู่กรณีอีกฝ่ายหนึ่งได้รู้แล้วด้วยว่าผู้กระทำเป็นคนวิกลจริต"],["31","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๓๑ ถ้าเหตุที่ทำให้เป็นคนไร้ความสามารถได้สิ้นสุดไปแล้ว และเมื่อบุคคลผู้นั้นเองหรือบุคคลใด ๆ ดังกล่าวมาในมาตรา ๒๘ ร้องขอต่อศาลก็ให้ศาลสั่งเพิกถอนคำสั่งที่ให้เป็นคนไร้ความสามารถนั้น\nคำสั่งของศาลตามมาตรานี้ ให้ประกาศในราชกิจจานุเบกษา"],["32","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๓๒ บุคคลใดมีกายพิการหรือมีจิตฟั่นเฟือนไม่สมประกอบ หรือประพฤติสุรุ่ยสุร่าย เสเพลเป็นอาจิณ หรือติดสุรายาเมา หรือมีเหตุอื่นใดทำนองเดียวกันนั้น จนไม่สามารถจะจัดทำการงานโดยตนเองได้ หรือจัดกิจการไปในทางที่อาจจะเสื่อมเสียแก่ทรัพย์สินของตนเองหรือครอบครัว เมื่อบุคคลตามที่ระบุไว้ในมาตรา ๒๘ ร้องขอต่อศาล ศาลจะสั่งให้บุคคลนั้นเป็นคนเสมือนไร้ความสามารถก็ได้\nบุคคลซึ่งศาลได้สั่งให้เป็นคนเสมือนไร้ความสามารถตามวรรคหนึ่ง ต้องจัดให้อยู่ในความพิทักษ์ การแต่งตั้งผู้พิทักษ์ ให้เป็นไปตามบทบัญญัติบรรพ ๕ แห่งประมวลกฎหมายนี้\nให้นำบทบัญญัติว่าด้วยการสิ้นสุดของความเป็นผู้ปกครองในบรรพ ๕ แห่งประมวลกฎหมายนี้มาใช้บังคับแก่การสิ้นสุดของการเป็นผู้พิทักษ์โดยอนุโลม\nคำสั่งของศาลตามมาตรานี้ ให้ประกาศในราชกิจจานุเบกษา"],["33","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๓๓ ในคดีที่มีการร้องขอให้ศาลสั่งให้บุคคลใดเป็นคนไร้ความสามารถเพราะวิกลจริต ถ้าทางพิจารณาได้ความว่าบุคคลนั้นไม่วิกลจริต แต่มีจิตฟั่นเฟือนไม่สมประกอบ เมื่อศาลเห็นสมควรหรือเมื่อมีคำขอของคู่ความหรือของบุคคลตามที่ระบุไว้ในมาตรา ๒๘ ศาลอาจสั่งให้บุคคลนั้นเป็นคนเสมือนไร้ความสามารถก็ได้ หรือในคดีที่มีการร้องขอให้ศาลสั่งให้บุคคลใดเป็นคนเสมือนไร้ความสามารถเพราะมีจิตฟั่นเฟือนไม่สมประกอบ ถ้าทางพิจารณาได้ความว่าบุคคลนั้นวิกลจริต เมื่อมีคำขอของคู่ความหรือของบุคคลตามที่ระบุไว้ในมาตรา ๒๘ ศาลอาจสั่งให้บุคคลนั้นเป็นคนไร้ความสามารถก็ได้"],["34","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๓๔ คนเสมือนไร้ความสามารถนั้น ต้องได้รับความยินยอมของผู้พิทักษ์ก่อนแล้วจึงจะทำการอย่างหนึ่งอย่างใดดังต่อไปนี้ได้\n(๑) นำทรัพย์สินไปลงทุน\n(๒) รับคืนทรัพย์สินที่ไปลงทุน ต้นเงินหรือทุนอย่างอื่น\n(๓) กู้ยืมหรือให้กู้ยืมเงิน ยืมหรือให้ยืมสังหาริมทรัพย์อันมีค่า\n(๔) รับประกันโดยประการใด ๆ อันมีผลให้ตนต้องถูกบังคับชำระหนี้\n(๕) เช่าหรือให้เช่าสังหาริมทรัพย์มีกำหนดระยะเวลาเกินกว่าหกเดือน หรืออสังหาริมทรัพย์มีกำหนดระยะเวลาเกินกว่าสามปี\n(๖) ให้โดยเสน่หา เว้นแต่การให้ที่พอควรแก่ฐานานุรูป เพื่อการกุศล การสังคมหรือตามหน้าที่ธรรมจรรยา\n(๗) รับการให้โดยเสน่หาที่มีเงื่อนไขหรือค่าภาระติดพัน หรือไม่รับการให้โดยเสน่หา\n(๘) ทำการอย่างหนึ่งอย่างใดเพื่อจะได้มาหรือปล่อยไปซึ่งสิทธิในอสังหาริมทรัพย์ หรือในสังหาริมทรัพย์อันมีค่า\n(๙) ก่อสร้างหรือดัดแปลงโรงเรือนหรือสิ่งปลูกสร้างอย่างอื่น หรือซ่อมแซมอย่างใหญ่\n(๑๐) เสนอคดีต่อศาลหรือดำเนินกระบวนพิจารณาใด ๆ เว้นแต่การร้องขอตามมาตรา ๓๕ หรือการร้องขอถอนผู้พิทักษ์\n(๑๑) ประนีประนอมยอมความหรือมอบข้อพิพาทให้อนุญาโตตุลาการวินิจฉัย\nถ้ามีกรณีอื่นใดนอกจากที่กล่าวในวรรคหนึ่ง ซึ่งคนเสมือนไร้ความสามารถอาจจัดการไปในทางเสื่อมเสียแก่ทรัพย์สินของตนเองหรือครอบครัว ในการสั่งให้บุคคลใดเป็นคนเสมือนไร้ความสามารถ หรือเมื่อผู้พิทักษ์ร้องขอในภายหลัง ศาลมีอำนาจสั่งให้คนเสมือนไร้ความสามารถนั้นต้องได้รับความยินยอมของผู้พิทักษ์ก่อนจึงจะทำการนั้นได้\nในกรณีที่คนเสมือนไร้ความสามารถไม่สามารถจะทำการอย่างหนึ่งอย่างใดที่กล่าวมาในวรรคหนึ่งหรือวรรคสองได้ด้วยตนเอง เพราะเหตุมีกายพิการหรือมีจิตฟั่นเฟือนไม่สมประกอบ ศาลจะสั่งให้ผู้พิทักษ์เป็นผู้มีอำนาจกระทำการนั้นแทนคนเสมือนไร้ความสามารถก็ได้ ในกรณีเช่นนี้ ให้นำบทบัญญัติที่เกี่ยวกับผู้อนุบาลมาใช้บังคับแก่ผู้พิทักษ์โดยอนุโลม\nคำสั่งของศาลตามมาตรานี้ ให้ประกาศในราชกิจจานุเบกษา\nการใดกระทำลงโดยฝ่าฝืนบทบัญญัติมาตรานี้ การนั้นเป็นโมฆียะ"],["35","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๓๕ ในกรณีที่ผู้พิทักษ์ไม่ยินยอมให้คนเสมือนไร้ความสามารถกระทำการอย่างหนึ่งอย่างใดตามมาตรา ๓๔ โดยปราศจากเหตุผลอันสมควร เมื่อคนเสมือนไร้ความสามารถร้องขอ ศาลจะมีคำสั่งอนุญาตให้กระทำการนั้นโดยไม่ต้องรับความยินยอมจากผู้พิทักษ์ก็ได้ ถ้าการนั้นจะเป็นคุณประโยชน์แก่คนเสมือนไร้ความสามารถ"],["36","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๒ ความสามารถ","มาตรา ๓๖ ถ้าเหตุที่ศาลได้สั่งให้เป็นคนเสมือนไร้ความสามารถได้สิ้นสุดไปแล้ว ให้นำบทบัญญัติมาตรา ๓๑ มาใช้บังคับโดยอนุโลม"],["37","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๓ ภูมิลำเนา","มาตรา ๓๗ ภูมิลำเนาของบุคคลธรรมดา ได้แก่ถิ่นอันบุคคลนั้นมีสถานที่อยู่เป็นแหล่งสำคัญ"],["38","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๓ ภูมิลำเนา","มาตรา ๓๘ ถ้าบุคคลธรรมดามีถิ่นที่อยู่หลายแห่งซึ่งอยู่สับเปลี่ยนกันไปหรือมีหลักแหล่งที่ทำการงานเป็นปกติหลายแห่ง ให้ถือเอาแห่งใดแห่งหนึ่งเป็นภูมิลำเนาของบุคคลนั้น"],["39","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๓ ภูมิลำเนา","มาตรา ๓๙ ถ้าภูมิลำเนาไม่ปรากฏ ให้ถือว่าถิ่นที่อยู่เป็นภูมิลำเนา"],["40","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๓ ภูมิลำเนา","มาตรา ๔๐ บุคคลธรรมดาซึ่งเป็นผู้ไม่มีที่อยู่ปกติเป็นหลักแหล่ง หรือเป็นผู้ครองชีพในการเดินทางไปมาปราศจากหลักแหล่งที่ทำการงาน พบตัวในถิ่นไหนให้ถือว่าถิ่นนั้นเป็นภูมิลำเนาของบุคคลนั้น"],["41","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๓ ภูมิลำเนา","มาตรา ๔๑ ภูมิลำเนาย่อมเปลี่ยนไปด้วยการย้ายถิ่นที่อยู่ พร้อมด้วยเจตนาปรากฏชัดแจ้งว่าจะเปลี่ยนภูมิลำเนา"],["42","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๓ ภูมิลำเนา","มาตรา ๔๒ ถ้าบุคคลใดได้เลือกเอาถิ่นใด โดยมีเจตนาปรากฏชัดแจ้งว่าจะให้เป็นภูมิลำเนาเฉพาะการเพื่อทำการใด ให้ถือว่าถิ่นนั้นเป็นภูมิลำเนาเฉพาะการสำหรับการนั้น"],["43","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๓ ภูมิลำเนา","มาตรา ๔๓ ภูมิลำเนาของคู่สมรส ได้แก่ถิ่นที่อยู่ที่คู่สมรสอยู่กินด้วยกันฉันคู่สมรส เว้นแต่คู่สมรสฝ่ายใดได้แสดงเจตนาให้ปรากฏว่ามีภูมิลำเนาแยกต่างหากจากกัน"],["44","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๓ ภูมิลำเนา","มาตรา ๔๔ ภูมิลำเนาของผู้เยาว์ ได้แก่ภูมิลำเนาของผู้แทนโดยชอบธรรมซึ่งเป็นผู้ใช้อำนาจปกครองหรือผู้ปกครอง\nในกรณีที่ผู้เยาว์อยู่ใต้อำนาจปกครองของบิดามารดา ถ้าบิดาและมารดามีภูมิลำเนาแยกต่างหากจากกัน ภูมิลำเนาของผู้เยาว์ได้แก่ภูมิลำเนาของบิดาหรือมารดาซึ่งตนอยู่ด้วย"],["45","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๓ ภูมิลำเนา","มาตรา ๔๕ ภูมิลำเนาของคนไร้ความสามารถ ได้แก่ภูมิลำเนาของผู้อนุบาล"],["46","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๓ ภูมิลำเนา","มาตรา ๔๖ ภูมิลำเนาของข้าราชการ ได้แก่ถิ่นอันเป็นที่ทำการตามตำแหน่งหน้าที่ หากมิใช่เป็นตำแหน่งหน้าที่ชั่วคราวชั่วระยะเวลาหรือเป็นเพียงแต่งตั้งไปเฉพาะการครั้งเดียวคราวเดียว"],["47","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๓ ภูมิลำเนา","มาตรา ๔๗ ภูมิลำเนาของผู้ที่ถูกจำคุกตามคำพิพากษาถึงที่สุดของศาลหรือตามคำสั่งโดยชอบด้วยกฎหมาย ได้แก่เรือนจำหรือทัณฑสถานที่ถูกจำคุกอยู่ จนกว่าจะได้รับการปล่อยตัว"],["48","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๔ สาบสูญ","มาตรา ๔๘ ถ้าบุคคลใดไปเสียจากภูมิลำเนาหรือถิ่นที่อยู่โดยมิได้ตั้งตัวแทนผู้รับมอบอำนาจทั่วไปไว้ และไม่มีใครรู้แน่ว่าบุคคลนั้นยังมีชีวิตอยู่หรือไม่ เมื่อผู้มีส่วนได้เสียหรือพนักงานอัยการร้องขอ ศาลจะสั่งให้ทำการอย่างหนึ่งอย่างใดไปพลางก่อนตามที่จำเป็นเพื่อจัดการทรัพย์สินของบุคคลผู้ไม่อยู่นั้นก็ได้\nเมื่อเวลาได้ล่วงเลยไปหนึ่งปีนับแต่วันที่ผู้ไม่อยู่นั้นไปเสียจากภูมิลำเนาหรือถิ่นที่อยู่ และไม่มีผู้ใดได้รับข่าวเกี่ยวกับบุคคลนั้นประการใดเลยก็ดี หรือหนึ่งปีนับแต่วันมีผู้ได้พบเห็นหรือได้ทราบข่าวมาเป็นครั้งหลังสุดก็ดี เมื่อบุคคลตามวรรคหนึ่งร้องขอ ศาลจะตั้งผู้จัดการทรัพย์สินของผู้ไม่อยู่ขึ้นก็ได้"],["49","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๔ สาบสูญ","มาตรา ๔๙ ในกรณีที่ผู้ไม่อยู่ได้ตั้งตัวแทนผู้รับมอบอำนาจทั่วไปไว้ และสัญญาตัวแทนระงับสิ้นไป หรือปรากฏว่าตัวแทนผู้รับมอบอำนาจทั่วไปได้จัดการทรัพย์สินนั้นในลักษณะที่อาจเสียหายแก่บุคคลดังกล่าว ให้นำมาตรา ๔๘ มาใช้บังคับโดยอนุโลม"],["50","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๔ สาบสูญ","มาตรา ๕๐ เมื่อผู้มีส่วนได้เสียหรือพนักงานอัยการร้องขอ ศาลจะสั่งให้ตัวแทนผู้รับมอบอำนาจทั่วไปจัดทำบัญชีทรัพย์สินของผู้ไม่อยู่ขึ้นตามที่ศาลจะมีคำสั่งก็ได้"],["51","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๔ สาบสูญ","มาตรา ๕๑ ภายใต้บังคับมาตรา ๘๐๒ ถ้าตัวแทนผู้รับมอบอำนาจทั่วไปเห็นเป็นการจำเป็นจะต้องทำการอันใดอันหนึ่งเกินขอบอำนาจที่ได้รับไว้ ต้องขออนุญาตต่อศาล และเมื่อศาลสั่งอนุญาตแล้วจึงจะกระทำการนั้นได้"],["52","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๔ สาบสูญ","มาตรา ๕๒ ผู้จัดการทรัพย์สินที่ศาลได้ตั้งขึ้น ต้องทำบัญชีทรัพย์สินของผู้ไม่อยู่ให้เสร็จภายในสามเดือนนับแต่วันทราบคำสั่งตั้งของศาล แต่ผู้จัดการทรัพย์สินจะร้องขอต่อศาลให้ขยายเวลาก็ได้"],["53","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๔ สาบสูญ","มาตรา ๕๓ บัญชีทรัพย์สินตามมาตรา ๕๐ และมาตรา ๕๒ ต้องมีพยานลงลายมือชื่อรับรองความถูกต้องอย่างน้อยสองคน พยานสองคนนั้นต้องเป็นคู่สมรสหรือญาติของผู้ไม่อยู่ซึ่งบรรลุนิติภาวะแล้ว แต่ถ้าไม่มีคู่สมรสหรือหาญาติไม่ได้ หรือคู่สมรสและญาติไม่ยอมเป็นพยาน จะให้ผู้อื่นซึ่งบรรลุนิติภาวะแล้วเป็นพยานก็ได้"],["54","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๔ สาบสูญ","มาตรา ๕๔ ผู้จัดการทรัพย์สินมีอำนาจหน้าที่อย่างเดียวกับตัวแทนผู้รับมอบอำนาจทั่วไปตามมาตรา ๘๐๑ และมาตรา ๘๐๒ ถ้าผู้จัดการทรัพย์สินเห็นเป็นการจำเป็นจะต้องทำการอันใดอันหนึ่งเกินขอบอำนาจ ต้องขออนุญาตต่อศาล และเมื่อศาลสั่งอนุญาตแล้วจึงจะกระทำการนั้นได้"],["55","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๔ สาบสูญ","มาตรา ๕๕ ถ้าผู้ไม่อยู่ได้ตั้งตัวแทนผู้รับมอบอำนาจเฉพาะการอันใดไว้ ผู้จัดการทรัพย์สินจะเข้าไปเกี่ยวข้องกับการอันเป็นอำนาจเฉพาะการนั้นไม่ได้ แต่ถ้าปรากฏว่าการที่ตัวแทนจัดทำอยู่นั้นอาจจะเสียหายแก่ผู้ไม่อยู่ ผู้จัดการทรัพย์สินจะร้องขอให้ศาลถอดถอนตัวแทนนั้นเสียก็ได้"],["56","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๔ สาบสูญ","มาตรา ๕๖ เมื่อผู้มีส่วนได้เสียหรือพนักงานอัยการร้องขอ หรือเมื่อศาลเห็นสมควร ศาลอาจสั่งอย่างหนึ่งอย่างใดดังต่อไปนี้\n(๑) ให้ผู้จัดการทรัพย์สินหาประกันอันสมควรในการจัดการทรัพย์สินของผู้ไม่อยู่ตลอดจนการมอบคืนทรัพย์สินนั้น\n(๒) ให้ผู้จัดการทรัพย์สินแถลงถึงความเป็นอยู่แห่งทรัพย์สินของผู้ไม่อยู่\n(๓) ถอดถอนผู้จัดการทรัพย์สิน และตั้งผู้อื่นให้เป็นผู้จัดการทรัพย์สินแทนต่อไป"],["57","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๔ สาบสูญ","มาตรา ๕๗ ในคำสั่งตั้งผู้จัดการทรัพย์สิน ศาลจะกำหนดบำเหน็จให้แก่ผู้จัดการทรัพย์สินโดยจ่ายจากทรัพย์สินของผู้ไม่อยู่นั้นก็ได้ ถ้าศาลมิได้กำหนด ผู้จัดการทรัพย์สินจะร้องขอต่อศาลให้กำหนดบำเหน็จในภายหลังก็ได้\nถ้าผู้จัดการทรัพย์สิน หรือผู้มีส่วนได้เสีย หรือพนักงานอัยการร้องขอ หรือเมื่อมีกรณีปรากฏแก่ศาลว่า พฤติการณ์เกี่ยวกับการจัดการทรัพย์สินได้เปลี่ยนแปลงไป ศาลจะสั่งกำหนด บำเหน็จ งด ลด เพิ่ม หรือกลับให้บำเหน็จแก่ผู้จัดการทรัพย์สินอีกก็ได้"],["58","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๔ สาบสูญ","มาตรา ๕๘ ความเป็นผู้จัดการทรัพย์สินย่อมสิ้นสุดลงในกรณีดังต่อไปนี้\n(๑) ผู้ไม่อยู่นั้นกลับมา\n(๒) ผู้ไม่อยู่นั้นมิได้กลับมาแต่ได้จัดการทรัพย์สินหรือตั้งตัวแทนเพื่อจัดการทรัพย์สินของตนแล้ว\n(๓) ผู้ไม่อยู่ถึงแก่ความตายหรือศาลมีคำสั่งให้เป็นคนสาบสูญ\n(๔) ผู้จัดการทรัพย์สินลาออกหรือถึงแก่ความตาย\n(๕) ผู้จัดการทรัพย์สินเป็นคนไร้ความสามารถหรือคนเสมือนไร้ความสามารถ\n(๖) ผู้จัดการทรัพย์สินเป็นบุคคลล้มละลาย\n(๗) ศาลถอดถอนผู้จัดการทรัพย์สิน"],["59","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๔ สาบสูญ","มาตรา ๕๙ ในกรณีที่ความเป็นผู้จัดการทรัพย์สินสิ้นสุดลงเพราะเหตุตามมาตรา ๕๘ (๔) (๕) หรือ (๖) ผู้จัดการทรัพย์สินหรือทายาทของผู้จัดการทรัพย์สิน ผู้จัดการมรดก ผู้อนุบาล ผู้พิทักษ์ เจ้าพนักงานพิทักษ์ทรัพย์ หรือผู้มีหน้าที่ดูแลทรัพย์สินของผู้จัดการทรัพย์สิน แล้วแต่กรณี จะต้องแถลงให้ศาลทราบถึงความสิ้นสุดนั้นโดยไม่ชักช้าเพื่อศาลจะได้มีคำสั่งเกี่ยวกับผู้จัดการทรัพย์สินต่อไปตามที่เห็นสมควร ในระหว่างเวลาดังกล่าวนั้น บุคคลดังกล่าวจะต้องจัดการตามควรแก่พฤติการณ์เพื่อรักษาประโยชน์ของผู้ไม่อยู่ จนกว่าจะได้ส่งมอบทรัพย์สินของผู้ไม่อยู่ให้แก่บุคคลหนึ่งบุคคลใดตามที่ศาลจะได้มีคำสั่ง"],["60","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๔ สาบสูญ","มาตรา ๖๐ ให้นำบทบัญญัติว่าด้วยตัวแทนแห่งประมวลกฎหมายนี้ มาใช้บังคับแก่การจัดการทรัพย์สินของผู้ไม่อยู่โดยอนุโลม"],["61","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๔ สาบสูญ","มาตรา ๖๑ ถ้าบุคคลใดได้ไปจากภูมิลำเนาหรือถิ่นที่อยู่ และไม่มีใครรู้แน่ว่าบุคคลนั้นยังมีชีวิตอยู่หรือไม่ตลอดระยะเวลาห้าปี เมื่อผู้มีส่วนได้เสียหรือพนักงานอัยการร้องขอ ศาลจะสั่งให้บุคคลนั้นเป็นคนสาบสูญก็ได้\nระยะเวลาตามวรรคหนึ่งให้ลดเหลือสองปี\n(๑) นับแต่วันที่การรบหรือสงครามสิ้นสุดลง ถ้าบุคคลนั้นอยู่ในการรบหรือสงคราม และหายไปในการรบหรือสงครามดังกล่าว\n(๒) นับแต่วันที่ยานพาหนะที่บุคคลนั้นเดินทาง อับปาง ถูกทำลาย หรือสูญหายไป\n(๓) นับแต่วันที่เหตุอันตรายแก่ชีวิตนอกจากที่ระบุไว้ใน (๑) หรือ (๒) ได้ผ่านพ้นไป ถ้าบุคคลนั้นตกอยู่ในอันตรายเช่นว่านั้น"],["62","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๔ สาบสูญ","มาตรา ๖๒ บุคคลซึ่งศาลได้มีคำสั่งให้เป็นคนสาบสูญ ให้ถือว่าถึงแก่ความตายเมื่อครบกำหนดระยะเวลาดังที่ระบุไว้ในมาตรา ๖๑"],["63","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๔ สาบสูญ","มาตรา ๖๓ เมื่อบุคคลผู้ถูกศาลสั่งให้เป็นคนสาบสูญนั้นเองหรือผู้มีส่วนได้เสียหรือพนักงานอัยการร้องขอต่อศาล และพิสูจน์ได้ว่าบุคคลผู้ถูกศาลสั่งให้เป็นคนสาบสูญนั้นยังคงมีชีวิตอยู่ก็ดี หรือว่าตายในเวลาอื่นผิดไปจากเวลาดังระบุไว้ในมาตรา ๖๒ ก็ดี ให้ศาลสั่งถอนคำสั่งให้เป็นคนสาบสูญนั้นแต่การถอนคำสั่งนี้ย่อมไม่กระทบกระเทือนถึงความสมบูรณ์แห่งการทั้งหลายอันได้ทำไปโดยสุจริตในระหว่างเวลาตั้งแต่ศาลมีคำสั่งให้เป็นคนสาบสูญจนถึงเวลาถอนคำสั่งนั้น\nบุคคลผู้ได้ทรัพย์สินมาเนื่องแต่การที่ศาลสั่งให้บุคคลใดเป็นคนสาบสูญ แต่ต้องเสียสิทธิของตนไปเพราะศาลสั่งถอนคำสั่งให้บุคคลนั้นเป็นคนสาบสูญ ให้นำบทบัญญัติว่าด้วยลาภมิควรได้แห่งประมวลกฎหมายนี้มาใช้บังคับโดยอนุโลม"],["64","b1t2","หมวด ๑ บุคคลธรรมดา","ส่วนที่ ๔ สาบสูญ","มาตรา ๖๔ คำสั่งศาลให้เป็นคนสาบสูญหรือคำสั่งถอนคำสั่งให้เป็นคนสาบสูญ ให้ประกาศในราชกิจจานุเบกษา"],["65","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๖๕ นิติบุคคลจะมีขึ้นได้ก็แต่ด้วยอาศัยอำนาจแห่งประมวลกฎหมายนี้หรือกฎหมายอื่น"],["66","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๖๖ นิติบุคคลย่อมมีสิทธิและหน้าที่ตามบทบัญญัติแห่งประมวลกฎหมายนี้หรือกฎหมายอื่น ภายในขอบแห่งอำนาจหน้าที่หรือวัตถุประสงค์ดังได้บัญญัติหรือกำหนดไว้ในกฎหมาย ข้อบังคับ หรือตราสารจัดตั้ง"],["67","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๖๗ ภายใต้บังคับมาตรา ๖๖ นิติบุคคลย่อมมีสิทธิและหน้าที่เช่นเดียวกับบุคคลธรรมดา เว้นแต่สิทธิและหน้าที่ซึ่งโดยสภาพจะพึงมีพึงเป็นได้เฉพาะแก่บุคคลธรรมดาเท่านั้น"],["68","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๖๘ ภูมิลำเนาของนิติบุคคลได้แก่ถิ่นอันเป็นที่ตั้งสำนักงานใหญ่หรือถิ่นอันเป็นที่ตั้งที่ทำการ หรือถิ่นที่ได้เลือกเอาเป็นภูมิลำเนาเฉพาะการตามข้อบังคับหรือตราสารจัดตั้ง"],["69","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๖๙ ในกรณีที่นิติบุคคลมีที่ตั้งที่ทำการหลายแห่งหรือมีสำนักงานสาขา ให้ถือว่าถิ่นอันเป็นที่ตั้งของที่ทำการหรือของสำนักงานสาขาเป็นภูมิลำเนาในส่วนกิจการอันได้กระทำ ณ ที่นั้นด้วย"],["70","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๗๐ นิติบุคคลต้องมีผู้แทนคนหนึ่งหรือหลายคน ทั้งนี้ ตามที่กฎหมาย ข้อบังคับ หรือตราสารจัดตั้งจะได้กำหนดไว้\nความประสงค์ของนิติบุคคลย่อมแสดงออกโดยผู้แทนของนิติบุคคล"],["71","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๗๑ ในกรณีที่นิติบุคคลมีผู้แทนหลายคน การดำเนินกิจการของนิติบุคคลให้เป็นไปตามเสียงข้างมากของผู้แทนของนิติบุคคลนั้น เว้นแต่จะได้มีข้อกำหนดไว้เป็นประการอื่นในกฎหมาย ข้อบังคับ หรือตราสารจัดตั้ง"],["72","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๗๒ การเปลี่ยนตัวผู้แทนของนิติบุคคล หรือการจำกัดหรือแก้ไข เปลี่ยนแปลงอำนาจของผู้แทนของนิติบุคคล ให้มีผลต่อเมื่อได้ปฏิบัติตามกฎหมาย ข้อบังคับหรือตราสารจัดตั้งแล้ว แต่จะยกขึ้นเป็นข้อต่อสู้บุคคลภายนอกผู้กระทำการโดยสุจริตมิได้"],["73","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๗๓ ถ้ามีตำแหน่งว่างลงในจำนวนผู้แทนของนิติบุคคล และมีเหตุอันควรเชื่อว่าการปล่อยตำแหน่งว่างไว้น่าจะเกิดความเสียหายขึ้นได้ เมื่อผู้มีส่วนได้เสียหรือพนักงานอัยการร้องขอศาลจะแต่งตั้งผู้แทนชั่วคราวขึ้นก็ได้"],["74","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๗๔ ถ้าประโยชน์ได้เสียของนิติบุคคลขัดกับประโยชน์ได้เสียของผู้แทนของนิติบุคคลในการอันใด ผู้แทนของนิติบุคคลนั้นจะเป็นผู้แทนในการอันนั้นไม่ได้"],["75","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๗๕ ถ้ากรณีตามมาตรา ๗๔ เป็นเหตุให้ไม่มีผู้แทนของนิติบุคคลเหลืออยู่ หรือผู้แทนของนิติบุคคลที่เหลืออยู่มีจำนวนไม่พอจะเป็นองค์ประชุม หรือไม่พอจะกระทำการอันนั้นได้ หากกฎหมาย ข้อบังคับ หรือตราสารจัดตั้งของนิติบุคคลนั้น มิได้มีข้อกำหนดในเรื่องนี้ไว้เป็นอย่างอื่น ให้นำความในมาตรา ๗๓ มาใช้บังคับเพื่อตั้งผู้แทนเฉพาะการโดยอนุโลม"],["76","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๗๖ ถ้าการกระทำตามหน้าที่ของผู้แทนของนิติบุคคลหรือผู้มีอำนาจทำการแทนนิติบุคคล เป็นเหตุให้เกิดความเสียหายแก่บุคคลอื่น นิติบุคคลนั้นต้องรับผิดชดใช้ค่าสินไหมทดแทนเพื่อความเสียหายนั้น แต่ไม่สูญเสียสิทธิที่จะไล่เบี้ยเอาแก่ผู้ก่อความเสียหาย\nถ้าความเสียหายแก่บุคคลอื่นเกิดจากการกระทำที่ไม่อยู่ในขอบวัตถุประสงค์หรืออำนาจหน้าที่ของนิติบุคคล บรรดาบุคคลดังกล่าวตามวรรคหนึ่งที่ได้เห็นชอบให้กระทำการนั้นหรือได้เป็นผู้กระทำการดังกล่าว ต้องร่วมกันรับผิดชดใช้ค่าสินไหมทดแทนแก่ผู้ที่ได้รับความเสียหายนั้น"],["77","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๗๗ ให้นำบทบัญญัติว่าด้วยตัวแทนแห่งประมวลกฎหมายนี้ มาใช้บังคับแก่ความเกี่ยวพันระหว่างนิติบุคคลกับผู้แทนของนิติบุคคล และระหว่างนิติบุคคล หรือผู้แทนของนิติบุคคลกับบุคคลภายนอก โดยอนุโลม"],["78","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๗๘ การก่อตั้งสมาคมเพื่อกระทำการใด ๆ อันมีลักษณะต่อเนื่องร่วมกันและมิใช่เป็นการหาผลกำไรหรือรายได้มาแบ่งปันกัน ต้องมีข้อบังคับและจดทะเบียนตามบทบัญญัติแห่งประมวลกฎหมายนี้"],["79","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๗๙ ข้อบังคับของสมาคมอย่างน้อยต้องมีรายการดังต่อไปนี้\n(๑) ชื่อสมาคม\n(๒) วัตถุประสงค์ของสมาคม\n(๓) ที่ตั้งสำนักงานใหญ่ และที่ตั้งสำนักงานสาขาทั้งปวง\n(๔) วิธีรับสมาชิก และการขาดจากสมาชิกภาพ\n(๕) อัตราค่าบำรุง\n(๖) ข้อกำหนดเกี่ยวกับคณะกรรมการของสมาคม ได้แก่ จำนวนกรรมการ การตั้งกรรมการ วาระการดำรงตำแหน่งของกรรมการ การพ้นจากตำแหน่งของกรรมการ และการประชุมของคณะกรรมการ\n(๗) ข้อกำหนดเกี่ยวกับการจัดการสมาคม การบัญชี และทรัพย์สินของสมาคม\n(๘) ข้อกำหนดเกี่ยวกับการประชุมใหญ่"],["80","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๘๐ สมาคมต้องใช้ชื่อซึ่งมีคำว่า “สมาคม” ประกอบกับชื่อของสมาคม"],["81","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๘๑ การขอจดทะเบียนสมาคมนั้น ให้ผู้จะเป็นสมาชิกของสมาคมจำนวนไม่น้อยกว่าสามคน ร่วมกันยื่นคำขอเป็นหนังสือต่อนายทะเบียนแห่งท้องที่ที่สำนักงานใหญ่ของสมาคมจะตั้งขึ้น พร้อมกับแนบข้อบังคับของสมาคม รายชื่อ ที่อยู่ และอาชีพของผู้จะเป็นสมาชิกไม่น้อยกว่าสิบคน และรายชื่อ ที่อยู่ และอาชีพของผู้จะเป็นกรรมการของสมาคมมากับคำขอด้วย"],["82","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๘๒ เมื่อนายทะเบียนได้รับคำขอจดทะเบียนพร้อมทั้งข้อบังคับแล้วเห็นว่าคำขอนั้นถูกต้องตามมาตรา ๘๑ และข้อบังคับถูกต้องตามมาตรา ๗๙ และวัตถุประสงค์ของสมาคมไม่ขัดต่อกฎหมายหรือศีลธรรมอันดีของประชาชน หรือไม่เป็นภยันตรายต่อความสงบสุขของประชาชนหรือความมั่นคงของรัฐ และรายการซึ่งจดแจ้งในคำขอหรือข้อบังคับสอดคล้องกับวัตถุประสงค์ของสมาคมและผู้จะเป็นกรรมการของสมาคมนั้นมีฐานะและความประพฤติเหมาะสมในการดำเนินการตามวัตถุประสงค์ของสมาคม ให้นายทะเบียนรับจดทะเบียนและออกใบสำคัญแสดงการจดทะเบียนให้แก่สมาคมนั้น และประกาศการจัดตั้งสมาคมในราชกิจจานุเบกษา\nถ้านายทะเบียนเห็นว่าคำขอหรือข้อบังคับไม่ถูกต้องตามมาตรา ๘๑ หรือมาตรา ๗๙ หรือรายการซึ่งจดแจ้งในคำขอหรือข้อบังคับไม่สอดคล้องกับวัตถุประสงค์ของสมาคม หรือผู้จะเป็นกรรมการของสมาคมมีฐานะหรือความประพฤติไม่เหมาะสมในการดำเนินการตามวัตถุประสงค์ของสมาคม ให้มีคำสั่งให้ผู้ยื่นคำขอจดทะเบียนแก้ไขหรือเปลี่ยนแปลงให้ถูกต้อง เมื่อแก้ไขหรือเปลี่ยนแปลงถูกต้องแล้ว ให้รับจดทะเบียนและออกใบสำคัญแสดงการจดทะเบียนให้และสมาคมนั้น\nถ้านายทะเบียนเห็นว่าไม่อาจรับจดทะเบียนได้เนื่องจากวัตถุประสงค์ของสมาคมขัดต่อกฎหมายหรือศีลธรรมอันดีของประชาชน หรืออาจเป็นภยันตรายต่อความสงบสุขของประชาชนหรือความมั่นคงของรัฐ หรือผู้ยื่นคำขอจดทะเบียนไม่แก้ไขหรือเปลี่ยนแปลงให้ถูกต้องภายในสามสิบวันนับแต่วันที่ทราบคำสั่งของนายทะเบียน ให้นายทะเบียนมีคำสั่งไม่รับจดทะเบียนและแจ้งคำสั่งพร้อมด้วยเหตุผลที่ไม่รับจดทะเบียนไปยังผู้ยื่นคำขอจดทะเบียนโดยมิชักช้า\nผู้ยื่นคำขอจดทะเบียนมีสิทธิอุทธรณ์คำสั่งไม่รับจดทะเบียนนั้นต่อรัฐมนตรีว่าการกระทรวงมหาดไทย โดยทำเป็นหนังสือยื่นต่อนายทะเบียนภายในสามสิบวันนับแต่วันที่ได้รับแจ้งคำสั่งไม่รับจดทะเบียน\nให้รัฐมนตรีว่าการกระทรวงมหาดไทยวินิจฉัยอุทธรณ์ และแจ้งคำวินิจฉัยให้ผู้อุทธรณ์ทราบภายในเก้าสิบวันนับแต่วันที่นายทะเบียนได้รับหนังสืออุทธรณ์ คำวินิจฉัยของรัฐมนตรีว่าการกระทรวงมหาดไทยให้เป็นที่สุด"],["83","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๘๓ สมาคมที่ได้จดทะเบียนแล้วเป็นนิติบุคคล"],["84","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๘๔ การแก้ไขเพิ่มเติมข้อบังคับของสมาคมจะกระทำได้ก็แต่โดยมติของที่ประชุมใหญ่ และสมาคมต้องนำข้อบังคับที่ได้แก้ไขเพิ่มเติมไปจดทะเบียนต่อนายทะเบียนแห่งท้องที่ที่สำนักงานใหญ่ของสมาคมตั้งอยู่ภายในสิบสี่วันนับแต่วันที่ได้ลงมติและให้นำความในมาตรา ๘๒ มาใช้บังคับโดยอนุโลม เมื่อนายทะเบียนได้จดทะเบียนแล้วให้มีผลใช้บังคับได้"],["85","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๘๕ การแต่งตั้งกรรมการของสมาคมขึ้นใหม่ทั้งชุดหรือการเปลี่ยนแปลงกรรมการของสมาคม ให้กระทำตามข้อบังคับของสมาคม และสมาคมต้องนำไปจดทะเบียนต่อนายทะเบียนแห่งท้องที่ที่สำนักงานใหญ่ของสมาคมตั้งอยู่ภายในสามสิบวันนับแต่วันที่มีการแต่งตั้งหรือเปลี่ยนแปลงกรรมการของสมาคม\nถ้านายทะเบียนเห็นว่ากรรมการของสมาคมตามวรรคหนึ่งผู้ใด มีฐานะหรือความประพฤติไม่เหมาะสมในการดำเนินการตามวัตถุประสงค์ของสมาคม นายทะเบียนจะไม่รับจดทะเบียนกรรมการของสมาคมผู้นั้นก็ได้ ในกรณีที่นายทะเบียนไม่รับจดทะเบียนกรรมการของสมาคม นายทะเบียนต้องแจ้งเหตุผลที่ไม่รับจดทะเบียนให้สมาคมทราบภายในหกสิบวันนับแต่วันที่ยื่นคำขอจดทะเบียน และให้นำความในมาตรา ๘๒ วรรคสี่และวรรคห้า มาใช้บังคับโดยอนุโลม\nในระหว่างที่ยังไม่มีการจดทะเบียนกรรมการของสมาคมชุดใหม่ ถ้าข้อบังคับของสมาคมมิได้กำหนดไว้เป็นอย่างอื่น ให้กรรมการของสมาคมชุดเดิมปฏิบัติหน้าที่กรรมการของสมาคมต่อไปจนกว่าจะได้มีการจดทะเบียนกรรมการของสมาคมชุดใหม่"],["86","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๘๖ คณะกรรมการของสมาคมเป็นผู้ดำเนินกิจการของสมาคมตามกฎหมายและข้อบังคับ ภายใต้การควบคุมดูแลของที่ประชุมใหญ่"],["87","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๘๗ คณะกรรมการของสมาคมเป็นผู้แทนของสมาคมในกิจการอันเกี่ยวกับบุคคลภายนอก"],["88","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๘๘ บรรดากิจการที่คณะกรรมการของสมาคมได้กระทำไป แม้จะปรากฏในภายหลังว่ามีข้อบกพร่องเกี่ยวกับการตั้งหรือคุณสมบัติของกรรมการของสมาคม กิจการนั้นย่อมมีผลสมบูรณ์"],["89","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๘๙ สมาชิกของสมาคมมีสิทธิที่จะตรวจตรากิจการและทรัพย์สินของสมาคมในระหว่างเวลาทำการของสมาคมได้"],["90","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๙๐ สมาชิกของสมาคมต้องชำระค่าบำรุงเต็มจำนวนในวันที่สมัครเข้าเป็นสมาชิกหรือในวันเริ่มต้นของระยะเวลาชำระค่าบำรุง แล้วแต่กรณี เว้นแต่ข้อบังคับของสมาคมจะกำหนดไว้เป็นอย่างอื่น"],["91","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๙๑ สมาชิกของสมาคมจะลาออกจากสมาคมเมื่อใดก็ได้ เว้นแต่ข้อบังคับของสมาคมจะกำหนดไว้เป็นอย่างอื่น"],["92","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๙๒ สมาชิกแต่ละคนมีความรับผิดในหนี้ของสมาคมไม่เกินจำนวนค่าบำรุงที่สมาชิกนั้นค้างชำระอยู่"],["93","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๙๓ คณะกรรมการของสมาคมต้องจัดให้มีการประชุมใหญ่สามัญอย่างน้อยปีละครั้ง"],["94","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๙๔ คณะกรรมการของสมาคมจะเรียกประชุมใหญ่วิสามัญเมื่อใดก็สุดแต่จะเห็นสมควร\nสมาชิกจำนวนไม่น้อยกว่าหนึ่งในห้าของจำนวนสมาชิกทั้งหมดหรือสมาชิกจำนวนไม่น้อยกว่าหนึ่งร้อยคนหรือสมาชิกจำนวนไม่น้อยกว่าที่กำหนดไว้ในข้อบังคับจะทำหนังสือร้องขอต่อคณะกรรมการของสมาคมให้เรียกประชุมใหญ่วิสามัญก็ได้ในหนังสือร้องขอนั้น ต้องระบุว่าประสงค์ให้เรียกประชุมเพื่อการใด\nเมื่อคณะกรรมการของสมาคมได้รับหนังสือร้องขอให้เรียกประชุมใหญ่วิสามัญตามวรรคสอง ให้คณะกรรมการของสมาคมเรียกประชุมใหญ่วิสามัญโดยจัดให้มีการประชุมขึ้นภายในสามสิบวันนับแต่วันที่ได้รับคำร้องขอ\nถ้าคณะกรรมการของสมาคมไม่เรียกประชุมภายในระยะเวลาตามวรรคสาม สมาชิกที่เป็นผู้ร้องขอให้เรียกประชุมหรือสมาชิกอื่นรวมกันมีจำนวนไม่น้อยกว่าจำนวนสมาชิกที่กำหนดตามวรรคสองจะเรียกประชุมเองก็ได้"],["95","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๙๕ ในการเรียกประชุมใหญ่ คณะกรรมการของสมาคมต้องส่งหนังสือนัดประชุมไปยังสมาชิกทุกคนซึ่งมีชื่อในทะเบียนของสมาคมก่อนวันนัดประชุมไม่น้อยกว่าเจ็ดวันหรือลงพิมพ์โฆษณาอย่างน้อยสองคราวในหนังสือพิมพ์ที่แพร่หลายในท้องที่ฉบับหนึ่งก่อนวันนัดประชุมไม่น้อยกว่าเจ็ดวันก็ได้\nการเรียกประชุมใหญ่ต้องระบุสถานที่ วัน เวลา และระเบียบวาระการประชุมและจัดส่งรายละเอียดและเอกสารที่เกี่ยวข้องตามควรไปพร้อมกันด้วย สำหรับการเรียกประชุมใหญ่โดยการพิมพ์โฆษณา รายละเอียดและเอกสารดังกล่าวต้องจัดไว้และพร้อมที่จะมอบให้แก่สมาชิกที่ร้องขอ ณ สถานที่ที่ผู้เรียกประชุมกำหนด"],["96","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๙๖ การประชุมใหญ่ของสมาคมต้องมีสมาชิกมาประชุมไม่น้อยกว่ากึ่งหนึ่งของจำนวนสมาชิกทั้งหมดจึงจะเป็นองค์ประชุม เว้นแต่ข้อบังคับของสมาคมจะกำหนดองค์ประชุมไว้เป็นอย่างอื่น\nในการประชุมใหญ่ครั้งใด ถ้าไม่ได้องค์ประชุมตามที่กำหนดไว้และการประชุมใหญ่นั้นได้เรียกตามคำร้องขอของสมาชิก ก็ให้งดการประชุม แต่ถ้าเป็นการประชุมใหญ่ที่สมาชิกมิได้เป็นผู้ร้องขอ ให้คณะกรรมการของสมาคมเรียกประชุมใหญ่อีกครั้งหนึ่งโดยจัดให้มีการประชุมขึ้นภายในสิบสี่วันนับแต่วันที่นัดประชุมครั้งแรก การประชุมครั้งหลังนี้ไม่บังคับว่าจำต้องครบองค์ประชุม"],["97","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๙๗ มติของที่ประชุม ให้ถือเอาเสียงข้างมากเป็นประมาณ เว้นแต่กรณีที่ข้อบังคับของสมาคมกำหนดเสียงข้างมากไว้เป็นพิเศษโดยเฉพาะ\nสมาชิกคนหนึ่งมีเสียงหนึ่งในการลงคะแนน ถ้าคะแนนเสียงเท่ากันให้ประธานในที่ประชุมออกเสียงเพิ่มขึ้นได้อีกเสียงหนึ่งเป็นเสียงชี้ขาด"],["98","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๙๘ สมาชิกจะมอบอำนาจให้สมาชิกผู้ใดมาเข้าประชุมและออกเสียงลงคะแนนแทนตนก็ได้ เว้นแต่ข้อบังคับของสมาคมจะกำหนดไว้เป็นอย่างอื่น"],["99","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๙๙ ในกรณีที่จะมีมติในเรื่องใด ถ้าส่วนได้เสียของกรรมการหรือสมาชิกของสมาคมผู้ใดขัดกับประโยชน์ได้เสียของสมาคม กรรมการหรือสมาชิกของสมาคมผู้นั้นจะออกเสียงลงคะแนนในเรื่องนั้นไม่ได้"],["100","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๑๐๐ ในการประชุมใหญ่ครั้งใด ถ้าได้มีการนัดประชุมหรือการลงมติโดยไม่ปฏิบัติตามหรือฝ่าฝืนข้อบังคับของสมาคมหรือบทบัญญัติในส่วนนี้ สมาชิก หรือพนักงานอัยการอาจร้องขอให้ศาลสั่งเพิกถอนมติในการประชุมใหญ่ครั้งนั้นได้ แต่ต้องร้องขอต่อศาลภายในหนึ่งเดือนนับแต่วันที่ที่ประชุมใหญ่ลงมติ"],["101","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๑๐๑ สมาคมย่อมเลิกด้วยเหตุหนึ่งเหตุใดดังต่อไปนี้\n(๑) เมื่อมีเหตุตามที่กำหนดในข้อบังคับ\n(๒) ถ้าสมาคมตั้งขึ้นไว้เฉพาะระยะเวลาใด เมื่อสิ้นระยะเวลานั้น\n(๓) ถ้าสมาคมตั้งขึ้นเพื่อกระทำกิจการใด เมื่อกิจการนั้นสำเร็จแล้ว\n(๔) เมื่อที่ประชุมใหญ่มีมติให้เลิก\n(๕) เมื่อสมาคมล้มละลาย\n(๖) เมื่อนายทะเบียนถอนชื่อสมาคมออกจากทะเบียนตามมาตรา ๑๐๒\n(๗) เมื่อศาลสั่งให้เลิกตามมาตรา ๑๐๔"],["102","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๑๐๒ ให้นายทะเบียนมีอำนาจสั่งถอนชื่อสมาคมออกจากทะเบียนได้ในกรณีดังต่อไปนี้\n(๑) เมื่อปรากฏในภายหลังการจดทะเบียนว่า วัตถุประสงค์ของสมาคมขัดต่อกฎหมายหรือศีลธรรมอันดีของประชาชน หรืออาจเป็นภยันตรายต่อความสงบสุขของประชาชนหรือความมั่นคงของรัฐ และนายทะเบียนได้สั่งให้แก้ไขแล้วแต่สมาคมไม่ปฏิบัติตามภายในระยะเวลาที่นายทะเบียนกำหนด\n(๒) เมื่อปรากฏว่าการดำเนินกิจการของสมาคมขัดต่อกฎหมายหรือศีลธรรมอันดีของประชาชน หรืออาจเป็นภยันตรายต่อความสงบสุขของประชาชนหรือความมั่นคงของรัฐ\n(๓) เมื่อสมาคมหยุดดำเนินกิจการติดต่อกันตั้งแต่สองปีขึ้นไป\n(๔) เมื่อปรากฏว่าสมาคมให้หรือปล่อยให้บุคคลอื่นซึ่งมิใช่กรรมการของสมาคมเป็นผู้ดำเนินกิจการของสมาคม\n(๕) เมื่อสมาคมมีสมาชิกเหลือน้อยกว่าสิบคนมาเป็นเวลาติดต่อกันกว่าสองปี"],["103","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๑๐๓ เมื่อนายทะเบียนมีคำสั่งให้ถอนชื่อสมาคมใดออกจากทะเบียนตามมาตรา ๑๐๒ แล้ว ให้นายทะเบียนแจ้งคำสั่งพร้อมด้วยเหตุผลไปยังสมาคมนั้นโดยมิชักช้า และประกาศการเลิกสมาคมในราชกิจจานุเบกษา\nกรรมการคนหนึ่งคนใดหรือสมาชิกของสมาคมจำนวนไม่น้อยกว่าสามคน มีสิทธิอุทธรณ์คำสั่งของนายทะเบียนตามวรรคหนึ่งต่อรัฐมนตรีว่าการกระทรวงมหาดไทยได้ โดยทำเป็นหนังสือยื่นต่อนายทะเบียนภายในสามสิบวันนับแต่วันที่ได้รับแจ้งคำสั่ง และให้นำความในมาตรา ๘๒ วรรคห้า มาใช้บังคับโดยอนุโลม"],["104","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๑๐๔ เมื่อมีกรณีตามมาตรา ๑๐๒ ผู้มีส่วนได้เสียอาจร้องขอให้นายทะเบียนถอนชื่อสมาคมออกจากทะเบียนได้ ถ้านายทะเบียนไม่ปฏิบัติตามคำร้องขอโดยไม่แจ้งเหตุผลให้ผู้ร้องขอทราบภายในเวลาอันสมควร หรือนายทะเบียนได้แจ้งเหตุผลให้ทราบแล้วแต่ผู้ร้องขอไม่พอใจในเหตุผลดังกล่าวผู้ร้องขอนั้นจะร้องขอต่อศาลให้สั่งเลิกสมาคมนั้นเสียก็ได้"],["105","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๑๐๕ เมื่อสมาคมมีเหตุต้องเลิกตามมาตรา ๑๐๑ (๑) (๒) (๓) หรือ (๔) ให้คณะกรรมการของสมาคมที่อยู่ในตำแหน่งขณะมีการเลิกสมาคมแจ้งการเลิกสมาคมต่อนายทะเบียนภายในสิบสี่วันนับแต่วันที่มีการเลิกสมาคม\nในกรณีที่ศาลมีคำพิพากษาหรือคำสั่งถึงที่สุดให้สมาคมล้มละลายตามมาตรา ๑๐๑ (๕) หรือมีคำสั่งถึงที่สุดให้เลิกสมาคมตามมาตรา ๑๐๔ ให้ศาลแจ้งคำพิพากษาหรือคำสั่งดังกล่าวให้นายทะเบียนทราบด้วย\nให้นายทะเบียนประกาศการเลิกสมาคมในราชกิจจานุเบกษา"],["106","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๑๐๖ ในกรณีที่มีการเลิกสมาคม ให้มีการชำระบัญชีสมาคมและให้นำบทบัญญัติในบรรพ ๓ ลักษณะ ๒๒ ว่าด้วยการชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด มาใช้บังคับแก่การชำระบัญชีสมาคมโดยอนุโลม"],["107","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๑๐๗ เมื่อได้ชำระบัญชีแล้ว ถ้ามีทรัพย์สินเหลืออยู่เท่าใด จะแบ่งให้แก่สมาชิกของสมาคมนั้นไม่ได้ ทรัพย์สินที่เหลือนั้นจะต้องโอนให้แก่สมาคมหรือมูลนิธิ หรือนิติบุคคลที่มีวัตถุประสงค์เกี่ยวกับการสาธารณกุศล ตามที่ได้ระบุชื่อไว้ในข้อบังคับของสมาคม หรือถ้าข้อบังคับไม่ได้ระบุชื่อไว้ก็ให้เป็นไปตามมติของที่ประชุมใหญ่ แต่ถ้าข้อบังคับของสมาคมหรือที่ประชุมใหญ่มิได้ระบุผู้รับโอนทรัพย์สินดังกล่าวไว้ หรือระบุไว้แต่ไม่สามารถปฏิบัติได้ ให้ทรัพย์สินที่เหลืออยู่นั้นตกเป็นของแผ่นดิน"],["108","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๑๐๘ ผู้ใดประสงค์จะขอตรวจเอกสารเกี่ยวกับสมาคมที่นายทะเบียนเก็บรักษาไว้หรือจะขอให้นายทะเบียนคัดสำเนาเอกสารดังกล่าว พร้อมด้วยคำรับรองว่าถูกต้อง ให้ยื่นคำขอต่อนายทะเบียน และเมื่อได้เสียค่าธรรมเนียมตามที่กำหนดในกฎกระทรวงแล้วให้นายทะเบียนปฏิบัติตามคำขอนั้น"],["109","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๒ สมาคม","มาตรา ๑๐๙ ให้รัฐมนตรีว่าการกระทรวงมหาดไทยรักษาการตามบทบัญญัติในส่วนนี้ และให้มีอำนาจแต่งตั้งนายทะเบียนกับออกกฎกระทรวงเกี่ยวกับ\n(๑) การยื่นคำขอจดทะเบียนและการรับจดทะเบียน\n(๒) ค่าธรรมเนียมการจดทะเบียน การขอตรวจเอกสาร การคัดสำเนาเอกสารและค่าธรรมเนียมการขอให้นายทะเบียนดำเนินการใด ๆ เกี่ยวกับสมาคม รวมทั้งการยกเว้นค่าธรรมเนียมดังกล่าว\n(๓) การดำเนินกิจการของสมาคมและการทะเบียนสมาคม\n(๔) การอื่นใดเพื่อปฏิบัติให้เป็นไปตามบทบัญญัติในส่วนนี้\nกฎกระทรวงนั้น เมื่อประกาศในราชกิจจานุเบกษาแล้วให้ใช้บังคับได้"],["110","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๑๐ มูลนิธิได้แก่ทรัพย์สินที่จัดสรรไว้โดยเฉพาะสำหรับวัตถุประสงค์เพื่อการกุศล สาธารณะ การศาสนา ศิลปะ วิทยาศาสตร์ วรรณคดี การศึกษา หรือเพื่อสาธารณประโยชน์อย่างอื่น โดยมิได้มุ่งหาผลประโยชน์มาแบ่งปันกัน และได้จดทะเบียนตามบทบัญญัติแห่งประมวลกฎหมายนี้\nการจัดการทรัพย์สินของมูลนิธิ ต้องมิใช่เป็นการหาผลประโยชน์เพื่อบุคคลใดนอกจากเพื่อดำเนินการตามวัตถุประสงค์ของมูลนิธินั้นเอง"],["111","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๑๑ มูลนิธิต้องมีข้อบังคับ และต้องมีคณะกรรมการของมูลนิธิประกอบด้วยบุคคลอย่างน้อยสามคน เป็นผู้ดำเนินกิจการของมูลนิธิตามกฎหมายและข้อบังคับของมูลนิธิ"],["112","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๑๒ ข้อบังคับของมูลนิธิอย่างน้อยต้องมีรายการดังต่อไปนี้\n(๑) ชื่อมูลนิธิ\n(๒) วัตถุประสงค์ของมูลนิธิ\n(๓) ที่ตั้งสำนักงานใหญ่และที่ตั้งสำนักงานสาขาทั้งปวง\n(๔) ทรัพย์สินของมูลนิธิขณะจัดตั้ง\n(๕) ข้อกำหนดเกี่ยวกับคณะกรรมการของมูลนิธิ ได้แก่ จำนวนกรรมการ การตั้งกรรมการ วาระการดำรงตำแหน่งของกรรมการ การพ้นจากตำแหน่งของกรรมการ และการประชุมของคณะกรรมการ\n(๖) ข้อกำหนดเกี่ยวกับการจัดการมูลนิธิ การจัดการทรัพย์สินและบัญชีของมูลนิธิ"],["113","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๑๓ มูลนิธิต้องใช้ชื่อซึ่งมีคำว่า “มูลนิธิ” ประกอบกับชื่อของมูลนิธิ"],["114","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๑๔ การขอจดทะเบียนมูลนิธินั้น ให้ผู้ขอจัดตั้งมูลนิธิยื่นคำขอเป็นหนังสือต่อนายทะเบียนแห่งท้องที่ที่สำนักงานใหญ่ของมูลนิธิจะตั้งขึ้น ในคำขออย่างน้อยต้องระบุเจ้าของทรัพย์สินและรายการทรัพย์สินที่จะจัดสรรสำหรับมูลนิธิ รายชื่อ ที่อยู่และอาชีพของผู้จะเป็นกรรมการของมูลนิธิทุกคน พร้อมกับแนบข้อบังคับของมูลนิธิมากับคำขอด้วย"],["115","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๑๕ เมื่อนายทะเบียนได้รับคำขอแล้วเห็นว่า คำขอนั้นถูกต้องตามมาตรา ๑๑๔ และข้อบังคับถูกต้องตามมาตรา ๑๑๒ และวัตถุประสงค์เป็นไปตามมาตรา ๑๑๐ และไม่ขัดต่อกฎหมายหรือศีลธรรมอันดีของประชาชน หรือไม่เป็นภยันตรายต่อความสงบสุขของประชาชนหรือความมั่นคงของรัฐ และรายการซึ่งจดแจ้งในคำขอหรือข้อบังคับสอดคล้องกับวัตถุประสงค์ของมูลนิธิ และผู้จะเป็นกรรมการของมูลนิธินั้นมีฐานะและความประพฤติเหมาะสมในการดำเนินการตามวัตถุประสงค์ของมูลนิธิ ให้นายทะเบียนรับจดทะเบียนและออกใบสำคัญแสดงการจดทะเบียนให้แก่มูลนิธินั้นและประกาศการจัดตั้งมูลนิธิในราชกิจจานุเบกษา\nถ้านายทะเบียนเห็นว่าคำขอหรือข้อบังคับไม่ถูกต้องตามมาตรา ๑๑๔ หรือมาตรา ๑๑๒ หรือรายการซึ่งจดแจ้งในคำขอหรือข้อบังคับไม่สอดคล้องกับวัตถุประสงค์ของมูลนิธิ หรือผู้จะเป็นกรรมการของมูลนิธิมีฐานะหรือความประพฤติไม่เหมาะสมในการดำเนินการตามวัตถุประสงค์ของมูลนิธิ ให้มีคำสั่งให้ผู้ขอจดทะเบียนแก้ไขหรือเปลี่ยนแปลงให้ถูกต้อง เมื่อแก้ไขหรือเปลี่ยนแปลงถูกต้องแล้ว ให้รับจดทะเบียนและออกใบสำคัญแสดงการจดทะเบียนให้แก่มูลนิธินั้น\nถ้านายทะเบียนเห็นว่าไม่อาจรับจดทะเบียนได้เนื่องจากวัตถุประสงค์ของมูลนิธิไม่เป็นไปตามมาตรา ๑๑๐ หรือขัดต่อกฎหมายหรือศีลธรรมอันดีของประชาชนหรืออาจเป็นภยันตรายต่อความสงบสุขของประชาชนหรือความมั่นคงของรัฐ หรือผู้ขอจดทะเบียนไม่แก้ไขหรือเปลี่ยนแปลงให้ถูกต้องภายในสามสิบวันนับแต่วันที่ทราบคำสั่งของนายทะเบียน ให้นายทะเบียนมีคำสั่งไม่รับจดทะเบียนและแจ้งคำสั่งพร้อมด้วยเหตุผลที่ไม่รับจดทะเบียนให้ผู้ขอจดทะเบียนทราบโดยมิชักช้า\nผู้ขอจดทะเบียนมีสิทธิอุทธรณ์คำสั่งไม่รับจดทะเบียนนั้นต่อรัฐมนตรีว่าการกระทรวงมหาดไทย โดยทำเป็นหนังสือยื่นต่อนายทะเบียนภายในสามสิบวันนับแต่วันที่ได้รับแจ้งคำสั่งไม่รับจดทะเบียน\nให้รัฐมนตรีว่าการกระทรวงมหาดไทยวินิจฉัยอุทธรณ์และแจ้งคำวินิจฉัยให้ผู้อุทธรณ์ทราบภายในเก้าสิบวันนับแต่วันที่นายทะเบียนได้รับหนังสืออุทธรณ์ คำวินิจฉัยของรัฐมนตรีว่าการกระทรวงมหาดไทยให้เป็นที่สุด"],["116","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๑๖ ก่อนที่นายทะเบียนรับจดทะเบียนมูลนิธิ ผู้ขอจัดตั้งมูลนิธิมีสิทธิขอถอนการจัดตั้งมูลนิธิได้โดยทำเป็นหนังสือยื่นต่อนายทะเบียน สิทธิที่จะขอถอนการจัดตั้งมูลนิธินี้ไม่ตกทอดไปยังทายาท\nในกรณีที่มีผู้ขอจัดตั้งมูลนิธิหลายคน ถ้าผู้ขอจัดตั้งมูลนิธิคนหนึ่งคนใดใช้สิทธิถอนการจัดตั้ง มูลนิธิ ให้คำขอจัดตั้งมูลนิธินั้นเป็นอันระงับไป"],["117","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๑๗ ในกรณีที่ผู้ขอจัดตั้งมูลนิธิถึงแก่ความตายก่อนนายทะเบียนรับจดทะเบียนมูลนิธิ ถ้าผู้ตายมิได้ทำพินัยกรรมยกเลิกการจัดตั้งมูลนิธิที่ขอจัดตั้งไว้ให้คำขอจัดตั้งมูลนิธิที่ผู้ตายได้ยื่นไว้ต่อนายทะเบียนยังคงใช้ได้ต่อไป และให้ทายาทหรือผู้จัดการมรดกหรือผู้ซึ่งผู้ตายมอบหมาย ดำเนินการในฐานะเป็นผู้ขอจัดตั้งมูลนิธิต่อไป ถ้าบุคคลดังกล่าวไม่ดำเนินการภายในหนึ่งร้อยยี่สิบวันนับแต่วันที่ผู้ขอจัดตั้งมูลนิธิถึงแก่ความตาย บุคคลผู้มีส่วนได้เสียหรือพนักงานอัยการจะดำเนินการในฐานะเป็นผู้ขอจัดตั้งมูลนิธินั้นต่อไปก็ได้\nในกรณีที่ไม่สามารถจัดตั้งมูลนิธิขึ้นได้ตามวัตถุประสงค์ที่ผู้ตายกำหนดไว้ ถ้าหากไม่มีพินัยกรรมของผู้ตายสั่งการในเรื่องนี้ไว้เป็นอย่างอื่น ให้นำความในมาตรา ๑๖๗๙ วรรคสอง มาใช้บังคับโดยอนุโลม ถ้าไม่สามารถดำเนินการตามมาตรา ๑๖๗๙ วรรคสอง หรือมูลนิธิจัดตั้งขึ้นไม่ได้ตามมาตรา ๑๑๕ ให้ทรัพย์สินที่จัดสรรไว้ตกเป็นมรดกของผู้ตาย"],["118","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๑๘ ในกรณีที่มีข้อกำหนดพินัยกรรมให้ก่อตั้งมูลนิธิตามมาตรา ๑๖๗๖ ให้บุคคลซึ่งมีหน้าที่ที่จะต้องจัดตั้งมูลนิธิตามมาตรา ๑๖๗๗ วรรคหนึ่ง ดำเนินการตามมาตรา ๑๑๔ และตามบทบัญญัติแห่งมาตรานี้\nถ้าบุคคลซึ่งมีหน้าที่ที่จะต้องจัดตั้งมูลนิธิตามวรรคหนึ่ง มิได้ขอจดทะเบียนก่อตั้งมูลนิธิภายในหนึ่งร้อยยี่สิบวันนับแต่วันที่บุคคลดังกล่าวได้รู้หรือควรรู้ข้อกำหนดพินัยกรรมให้ก่อตั้งมูลนิธิ บุคคลผู้มีส่วนได้เสียคนหนึ่งคนใดหรือพนักงานอัยการจะเป็นผู้ขอจดทะเบียนมูลนิธิก็ได้\nถ้าผู้ยื่นคำขอจดทะเบียนมูลนิธิไม่ดำเนินการแก้ไขหรือเปลี่ยนแปลงให้ถูกต้องตามคำสั่งของนายทะเบียนตามมาตรา ๑๑๕ จนเป็นเหตุให้นายทะเบียนไม่รับจดทะเบียนมูลนิธิเพราะเหตุดังกล่าว บุคคลผู้มีส่วนได้เสียคนหนึ่งคนใดหรือพนักงานอัยการจะเป็นผู้ขอจดทะเบียนมูลนิธินั้นอีกก็ได้\nผู้ยื่นคำขอจดทะเบียนก่อตั้งมูลนิธิตามมาตรานี้ จะขอถอนการก่อตั้งมูลนิธิตามมาตรา ๑๑๖ ไม่ได้\nในกรณีที่มีผู้คัดค้านต่อนายทะเบียนว่าพินัยกรรมนั้นมิได้กำหนดให้ก่อตั้งเป็นมูลนิธิ ให้นายทะเบียนแจ้งให้ผู้คัดค้านไปร้องต่อศาลภายในหกสิบวันนับแต่วันที่ได้รับแจ้งจากนายทะเบียน และให้นายทะเบียนรอการพิจารณาการจดทะเบียนไว้ก่อน เพื่อดำเนินการตามคำพิพากษาหรือคำสั่งของศาล ถ้าผู้คัดค้านไม่ยื่นคำร้องต่อศาลภายในเวลาที่กำหนด ให้นายทะเบียนพิจารณาการจดทะเบียนมูลนิธินั้นต่อไป"],["119","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๑๙ ในกรณีที่มีข้อกำหนดพินัยกรรมให้จัดตั้งมูลนิธิ ถ้าพินัยกรรมที่ทำไว้มิได้มีข้อกำหนดเกี่ยวกับรายการตามมาตรา ๑๑๒ (๑) (๓) (๕) หรือ (๖) ให้ผู้ยื่นคำขอตามมาตรา ๑๑๘ กำหนดรายการดังกล่าวได้ ถ้าผู้มีส่วนได้เสียคนหนึ่งคนใดคัดค้าน ให้นายทะเบียนมีคำสั่งตามที่เห็นสมควร แล้วแจ้งให้ผู้ยื่นคำขอและผู้คัดค้านทราบพร้อมทั้งแจ้งด้วยว่า หากผู้ยื่นคำขอหรือผู้คัดค้านไม่พอใจในคำสั่งดังกล่าว ก็ให้ไปร้องคัดค้านต่อศาลภายในหกสิบวันนับแต่วันที่ได้รับแจ้งจากนายทะเบียน และให้นายทะเบียนรอการพิจารณาจดทะเบียนไว้ก่อนเพื่อดำเนินการตามคำพิพากษาหรือคำสั่งของศาล แต่ถ้าไม่มีการร้องคัดค้านต่อศาลภายในเวลาที่กำหนด ให้นายทะเบียนพิจารณาจดทะเบียนมูลนิธิตามที่ได้มีคำสั่งไว้นั้นต่อไป"],["120","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๒๐ ในกรณีที่มีบุคคลหลายรายยื่นคำขอจดทะเบียนมูลนิธิตามพินัยกรรมของเจ้ามรดกรายเดียวกัน ถ้าคำขอนั้นมีข้อขัดแย้งกัน ให้นายทะเบียนเรียกผู้ยื่นคำขอมาตกลงกัน และถ้าผู้ยื่นคำขอไม่มาตกลงกัน หรือตกลงกันไม่ได้ภายในระยะเวลาที่นายทะเบียนกำหนด ให้นายทะเบียนมีคำสั่งตามที่เห็นสมควร และให้นำความในมาตรา ๑๑๙ มาใช้บังคับโดยอนุโลม"],["121","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๒๑ เมื่อได้จดทะเบียนมูลนิธิแล้ว ถ้าผู้ขอจัดตั้งมูลนิธิมีชีวิตอยู่ ให้ทรัพย์สินที่จัดสรรไว้เพื่อการนั้นตกเป็นของมูลนิธิตั้งแต่วันที่นายทะเบียนรับจดทะเบียนมูลนิธิเป็นต้นไป\nในกรณีที่ผู้ขอจัดตั้งมูลนิธิถึงแก่ความตายก่อนนายทะเบียนรับจดทะเบียนมูลนิธิ เมื่อได้จดทะเบียนมูลนิธิแล้ว ให้ทรัพย์สินที่จัดสรรไว้เพื่อการนั้นตกเป็นของมูลนิธิตั้งแต่เวลาที่ผู้ขอจัดตั้งมูลนิธินั้นถึงแก่ความตาย"],["122","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๒๒ มูลนิธิที่ได้จดทะเบียนแล้วเป็นนิติบุคคล"],["123","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๒๓ คณะกรรมการของมูลนิธิเป็นผู้แทนของมูลนิธิในกิจการอันเกี่ยวกับบุคคลภายนอก"],["124","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๒๔ บรรดากิจการที่คณะกรรมการของมูลนิธิได้กระทำไป แม้จะปรากฏในภายหลังว่ามีข้อบกพร่องเกี่ยวกับการแต่งตั้งหรือคุณสมบัติของกรรมการของมูลนิธิ กิจการนั้นย่อมมีผลสมบูรณ์"],["125","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๒๕ การแต่งตั้งกรรมการของมูลนิธิขึ้นใหม่ทั้งชุดหรือการเปลี่ยนแปลงกรรมการของมูลนิธิ ให้กระทำตามข้อบังคับของมูลนิธิ และมูลนิธิต้องนำไปจดทะเบียนภายในสามสิบวันนับแต่วันที่มีการแต่งตั้งหรือเปลี่ยนแปลงกรรมการของมูลนิธิ\nถ้านายทะเบียนเห็นว่ากรรมการของมูลนิธิตามวรรคหนึ่งผู้ใด มีฐานะหรือความประพฤติไม่เหมาะสมในการดำเนินการตามวัตถุประสงค์ของมูลนิธิ นายทะเบียนจะไม่รับจดทะเบียนกรรมการของมูลนิธิผู้นั้นก็ได้ ในกรณีที่นายทะเบียนไม่รับจดทะเบียนกรรมการของมูลนิธิ นายทะเบียนต้องแจ้งเหตุผลที่ไม่รับจดทะเบียนให้มูลนิธิทราบภายในหกสิบวันนับแต่วันที่ยื่นคำขอจดทะเบียน และให้นำความในมาตรา ๑๑๕ วรรคสี่และวรรคห้ามาใช้บังคับโดยอนุโลม\nในกรณีที่กรรมการของมูลนิธิพ้นจากตำแหน่งและไม่มีกรรมการของมูลนิธิเหลืออยู่ หรือกรรมการของมูลนิธิที่เหลืออยู่ไม่สามารถดำเนินการตามหน้าที่ได้ ถ้าข้อบังคับของมูลนิธิมิได้กำหนดการปฏิบัติหน้าที่ไว้เป็นอย่างอื่น ให้กรรมการของมูลนิธิที่พ้นจากตำแหน่งปฏิบัติหน้าที่กรรมการของมูลนิธิต่อไปจนกว่านายทะเบียนจะได้แจ้งการรับจดทะเบียนกรรมการของมูลนิธิที่ตั้งใหม่\nกรรมการของมูลนิธิที่พ้นจากตำแหน่งเพราะถูกถอดถอนโดยคำสั่งศาลตามมาตรา ๑๒๙ จะปฏิบัติหน้าที่ตามวรรคสามไม่ได้"],["126","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๒๖ ภายใต้บังคับมาตรา ๑๒๗ ให้คณะกรรมการของมูลนิธิเป็นผู้มีอำนาจแก้ไขเพิ่มเติมข้อบังคับของมูลนิธิ แต่ถ้าข้อบังคับของมูลนิธิได้กำหนดหลักเกณฑ์และวิธีการแก้ไขเพิ่มเติมไว้ การแก้ไขเพิ่มเติมต้องเป็นไปตามที่ข้อบังคับกำหนด และให้มูลนิธินำข้อบังคับที่แก้ไขเพิ่มเติมนั้นไปจดทะเบียนต่อนายทะเบียนภายในสามสิบวันนับแต่วันที่คณะกรรมการของมูลนิธิได้แก้ไขเพิ่มเติมข้อบังคับของมูลนิธิและให้นำความในมาตรา ๑๑๕ มาใช้บังคับโดยอนุโลม"],["127","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๒๗ การแก้ไขเพิ่มเติมรายการในข้อบังคับของมูลนิธิตามมาตรา ๑๑๒ (๒) จะกระทำได้แต่เฉพาะในกรณีดังต่อไปนี้\n(๑) เพื่อให้สามารถดำเนินการตามวัตถุประสงค์ของมูลนิธิ หรือ\n(๒) พฤติการณ์เปลี่ยนแปลงไปเป็นเหตุให้วัตถุประสงค์ของมูลนิธินั้นมีประโยชน์น้อย หรือไม่อาจดำเนินการให้สมประโยชน์ตามวัตถุประสงค์ของมูลนิธินั้นได้ และวัตถุประสงค์ของมูลนิธิที่แก้ไขเพิ่มเติมนั้นใกล้ชิดกับวัตถุประสงค์เดิมของมูลนิธิ"],["128","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๒๘ ให้นายทะเบียนมีอำนาจตรวจตราและควบคุมดูแลการดำเนินกิจการของมูลนิธิให้เป็นไปตามกฎหมายและข้อบังคับของมูลนิธิ เพื่อการนี้ให้นายทะเบียนหรือพนักงานเจ้าหน้าที่ซึ่งนายทะเบียนมอบหมายเป็นหนังสือ มีอำนาจ\n(๑) มีคำสั่งเป็นหนังสือให้กรรมการ พนักงาน ลูกจ้างหรือตัวแทนของมูลนิธิชี้แจงแสดงข้อเท็จจริงเกี่ยวกับกิจการของมูลนิธิ หรือเรียกบุคคลดังกล่าวมาสอบถาม หรือให้ส่งหรือแสดงสมุดบัญชีและเอกสารต่าง ๆ ของมูลนิธิเพื่อตรวจสอบ\n(๒) เข้าไปในสำนักงานของมูลนิธิในเวลาระหว่างพระอาทิตย์ขึ้น และพระอาทิตย์ตกเพื่อตรวจสอบกิจการของมูลนิธิ\nในการปฏิบัติการตามวรรคหนึ่ง ถ้าเป็นนายทะเบียนให้แสดงบัตรประจำตัวและถ้าเป็นพนักงานเจ้าหน้าที่ซึ่งได้รับมอบหมาย ให้แสดงบัตรประจำตัวและหนังสือมอบหมายของนายทะเบียนต่อผู้ที่เกี่ยวข้อง"],["129","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๒๙ ในกรณีที่กรรมการของมูลนิธิผู้ใดดำเนินกิจการของมูลนิธิผิดพลาดเสื่อมเสียต่อมูลนิธิ หรือดำเนินกิจการฝ่าฝืนกฎหมายหรือข้อบังคับของมูลนิธิ หรือกลายเป็นผู้มีฐานะหรือความประพฤติไม่เหมาะสมในการดำเนินการตามวัตถุประสงค์ของมูลนิธิ นายทะเบียน พนักงานอัยการ หรือผู้มีส่วนได้เสียคนหนึ่งคนใดอาจร้องขอต่อศาลให้มีคำสั่งถอดถอนกรรมการของมูลนิธิผู้นั้นได้\nในกรณีที่การกระทำตามวรรคหนึ่งเป็นการกระทำของคณะกรรมการของมูลนิธิ หรือปรากฏว่าคณะกรรมการของมูลนิธิไม่ดำเนินการตามวัตถุประสงค์ของมูลนิธิโดยไม่มีเหตุอันสมควร นายทะเบียน พนักงานอัยการ หรือผู้มีส่วนได้เสียคนหนึ่งคนใดอาจร้องขอต่อศาลให้มีคำสั่งถอดถอนกรรมการของมูลนิธิทั้งคณะได้\nในกรณีที่ศาลมีคำสั่งถอดถอนกรรมการของมูลนิธิหรือคณะกรรมการของมูลนิธิตามวรรคหนึ่งหรือวรรคสอง ศาลจะแต่งตั้งบุคคลอื่นเป็นกรรมการของมูลนิธิ หรือคณะกรรมการของมูลนิธิแทนกรรมการของมูลนิธิ หรือคณะกรรมการของมูลนิธิที่ศาลถอดถอนก็ได้ เมื่อศาลมีคำสั่งแต่งตั้งบุคคลใดเป็นกรรมการของมูลนิธิแล้ว ให้นายทะเบียนดำเนินการจดทะเบียนไปตามนั้น"],["130","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๓๐ มูลนิธิย่อมเลิกด้วยเหตุหนึ่งเหตุใด ดังต่อไปนี้\n(๑) เมื่อมีเหตุตามที่กำหนดในข้อบังคับ\n(๒) ถ้ามูลนิธิตั้งขึ้นไว้เฉพาะระยะเวลาใด เมื่อสิ้นระยะเวลานั้น\n(๓) ถ้ามูลนิธิตั้งขึ้นเพื่อวัตถุประสงค์อย่างใด และได้ดำเนินการตามวัตถุประสงค์สำเร็จบริบูรณ์แล้ว หรือวัตถุประสงค์นั้นกลายเป็นพ้นวิสัย\n(๔) เมื่อมูลนิธินั้นล้มละลาย\n(๕) เมื่อศาลมีคำสั่งให้เลิกมูลนิธิตามมาตรา ๑๓๑"],["131","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๓๑ นายทะเบียน พนักงานอัยการ หรือผู้มีส่วนได้เสียคนหนึ่งคนใดอาจร้องขอต่อศาลให้มีคำสั่งให้เลิกมูลนิธิได้ในกรณีหนึ่งกรณีใด ดังต่อไปนี้\n(๑) เมื่อปรากฏว่าวัตถุประสงค์ของมูลนิธิขัดต่อกฎหมาย\n(๒) เมื่อปรากฏว่ามูลนิธิกระทำการขัดต่อกฎหมายหรือศีลธรรมอันดีของประชาชน หรืออาจเป็นภยันตรายต่อความสงบสุขของประชาชนหรือความมั่นคงของรัฐ\n(๓) เมื่อปรากฏว่ามูลนิธิไม่สามารถดำเนินกิจการต่อไปได้ไม่ว่าเพราะเหตุใด ๆ หรือหยุดดำเนินกิจการตั้งแต่สองปีขึ้นไป"],["132","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๓๒ เมื่อมูลนิธิมีเหตุต้องเลิกตามมาตรา ๑๓๐ (๑) (๒) หรือ (๓) แล้ว ให้คณะกรรมการของมูลนิธิที่อยู่ในตำแหน่งขณะมีการเลิกมูลนิธิแจ้งการเลิกมูลนิธิต่อนายทะเบียนภายในสิบสี่วันนับแต่วันที่มีการเลิกมูลนิธิ\nในกรณีที่ศาลมีคำพิพากษาหรือคำสั่งถึงที่สุดให้มูลนิธิล้มละลายตามมาตรา ๑๓๐ (๔) หรือมีคำสั่งถึงที่สุดให้เลิกมูลนิธิตามมาตรา ๑๓๑ ให้ศาลแจ้งคำพิพากษาหรือคำสั่งดังกล่าวให้นายทะเบียนทราบด้วย\nให้นายทะเบียนประกาศการเลิกมูลนิธิในราชกิจจานุเบกษา"],["133","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๓๓ ในกรณีที่มีการเลิกมูลนิธิ ให้มีการชำระบัญชีมูลนิธิและให้นำบทบัญญัติในบรรพ ๓ ลักษณะ ๒๒ ว่าด้วยการชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด มาใช้บังคับแก่การชำระบัญชีมูลนิธิโดยอนุโลม ทั้งนี้ ให้ผู้ชำระบัญชีเสนอรายงานการชำระบัญชีต่อนายทะเบียน และให้นายทะเบียนเป็นผู้อนุมัติรายงานนั้น"],["134","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๓๔ เมื่อได้ชำระบัญชีแล้ว ให้โอนทรัพย์สินของมูลนิธิให้แก่มูลนิธิหรือนิติบุคคลที่มีวัตถุประสงค์ตามมาตรา ๑๑๐ ซึ่งได้ระบุชื่อไว้ในข้อบังคับของมูลนิธิ ถ้าข้อบังคับของมูลนิธิมิได้ระบุชื่อมูลนิธิหรือนิติบุคคลดังกล่าวไว้ พนักงานอัยการ ผู้ชำระบัญชี หรือผู้มีส่วนได้เสียคนหนึ่งคนใด อาจร้องขอต่อศาลให้จัดสรรทรัพย์สินนั้นแก่มูลนิธิหรือนิติบุคคลอื่นที่ปรากฏว่ามีวัตถุประสงค์ใกล้ชิดที่สุดกับวัตถุประสงค์ของมูลนิธินั้นได้\nถ้ามูลนิธินั้นถูกศาลสั่งให้เลิกตามมาตรา ๑๓๑ (๑) หรือ (๒) หรือการจัดสรรทรัพย์สินตามวรรคหนึ่งไม่อาจกระทำได้ ให้ทรัพย์สินของมูลนิธิตกเป็นของแผ่นดิน"],["135","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๓๕ ผู้ใดประสงค์จะขอตรวจเอกสารเกี่ยวกับมูลนิธิที่นายทะเบียนเก็บรักษาไว้ หรือจะขอให้นายทะเบียนคัดสำเนาเอกสารดังกล่าวพร้อมด้วยคำรับรองว่าถูกต้อง ให้ยื่นคำขอต่อนายทะเบียน และเมื่อได้เสียค่าธรรมเนียมตามที่กำหนดในกฎกระทรวงแล้ว ให้นายทะเบียนปฏิบัติตามคำขอนั้น"],["136","b1t2","หมวด ๒ นิติบุคคล","ส่วนที่ ๓ มูลนิธิ","มาตรา ๑๓๖ ให้รัฐมนตรีว่าการกระทรวงมหาดไทยรักษาการตามบทบัญญัติในส่วนนี้ และให้มีอำนาจแต่งตั้งนายทะเบียนกับออกกฎกระทรวงเกี่ยวกับ\n(๑) การยื่นคำขอจดทะเบียนและการรับจดทะเบียน\n(๒) ค่าธรรมเนียมการจดทะเบียน การขอตรวจเอกสาร การคัดสำเนาเอกสารและค่าธรรมเนียมการขอให้นายทะเบียนดำเนินการใด ๆ เกี่ยวกับมูลนิธิรวมทั้งการยกเว้นค่าธรรมเนียมดังกล่าว\n(๓) แบบบัตรประจำตัวของนายทะเบียนและพนักงานเจ้าหน้าที่\n(๔) การดำเนินกิจการของมูลนิธิและการทะเบียนมูลนิธิ\n(๕) การอื่นใดเพื่อปฏิบัติให้เป็นไปตามบทบัญญัติในส่วนนี้\nกฎกระทรวงนั้น เมื่อประกาศในราชกิจจานุเบกษาแล้วให้ใช้บังคับได้"],["137","b1t3","","","มาตรา ๑๓๗ ทรัพย์ หมายความว่า วัตถุมีรูปร่าง"],["138","b1t3","","","มาตรา ๑๓๘ ทรัพย์สิน หมายความรวมทั้งทรัพย์และวัตถุไม่มีรูปร่าง ซึ่งอาจมีราคาและอาจถือเอาได้"],["139","b1t3","","","มาตรา ๑๓๙ อสังหาริมทรัพย์ หมายความว่า ที่ดินและทรัพย์อันติดอยู่กับที่ดินมีลักษณะเป็นการถาวรหรือประกอบเป็นอันเดียวกับที่ดินนั้น และหมายความรวมถึงทรัพยสิทธิอันเกี่ยวกับที่ดินหรือทรัพย์อันติดอยู่กับที่ดินหรือประกอบเป็นอันเดียวกับที่ดินนั้นด้วย"],["140","b1t3","","","มาตรา ๑๔๐ สังหาริมทรัพย์ หมายความว่า ทรัพย์สินอื่นนอกจากอสังหาริมทรัพย์ และหมายความรวมถึงสิทธิอันเกี่ยวกับทรัพย์สินนั้นด้วย"],["141","b1t3","","","มาตรา ๑๔๑ ทรัพย์แบ่งได้ หมายความว่า ทรัพย์อันอาจแยกออกจากกันเป็นส่วน ๆ ได้จริง ถนัดชัดแจ้ง แต่ละส่วนได้รูปบริบูรณ์ลำพังตัว"],["142","b1t3","","","มาตรา ๑๔๒ ทรัพย์แบ่งไม่ได้ หมายความว่า ทรัพย์อันจะแยกออกจากกันไม่ได้นอกจากเปลี่ยนแปลงภาวะของทรัพย์ และหมายความรวมถึงทรัพย์ที่มีกฎหมายบัญญัติว่าแบ่งไม่ได้ด้วย"],["143","b1t3","","","มาตรา ๑๔๓ ทรัพย์นอกพาณิชย์ หมายความว่า ทรัพย์ที่ไม่สามารถถือเอาได้และทรัพย์ที่โอนแก่กันมิได้โดยชอบด้วยกฎหมาย"],["144","b1t3","","","มาตรา ๑๔๔ ส่วนควบของทรัพย์ หมายความว่า ส่วนซึ่งโดยสภาพแห่งทรัพย์หรือโดยจารีตประเพณีแห่งท้องถิ่นเป็นสาระสำคัญในความเป็นอยู่ของทรัพย์นั้น และไม่อาจแยกจากกันได้นอกจากจะทำลาย ทำให้บุบสลาย หรือทำให้ทรัพย์นั้นเปลี่ยนแปลงรูปทรงหรือสภาพไป\nเจ้าของทรัพย์ย่อมมีกรรมสิทธิ์ในส่วนควบของทรัพย์นั้น"],["145","b1t3","","","มาตรา ๑๔๕ ไม้ยืนต้นเป็นส่วนควบกับที่ดินที่ไม้นั้นขึ้นอยู่\nไม้ล้มลุกหรือธัญชาติอันจะเก็บเกี่ยวรวงผลได้คราวหนึ่งหรือหลายคราวต่อปีไม่เป็นส่วนควบกับที่ดิน"],["146","b1t3","","","มาตรา ๑๔๖ ทรัพย์ซึ่งติดกับที่ดินหรือติดกับโรงเรือนเพียงชั่วคราวไม่ถือว่าเป็นส่วนควบกับที่ดินหรือโรงเรือนนั้น ความข้อนี้ให้ใช้บังคับแก่โรงเรือนหรือสิ่งปลูกสร้างอย่างอื่น ซึ่งผู้มีสิทธิในที่ดินของผู้อื่นใช้สิทธินั้นปลูกสร้างไว้ในที่ดินนั้นด้วย"],["147","b1t3","","","มาตรา ๑๔๗ อุปกรณ์ หมายความว่า สังหาริมทรัพย์ซึ่งโดยปกตินิยมเฉพาะถิ่นหรือโดยเจตนาชัดแจ้งของเจ้าของทรัพย์ที่เป็นประธาน เป็นของใช้ประจำอยู่กับทรัพย์ที่เป็นประธานเป็นอาจิณเพื่อประโยชน์แก่การจัดดูแล ใช้สอย หรือรักษาทรัพย์ที่เป็นประธาน และเจ้าของทรัพย์ได้นำมาสู่ทรัพย์ที่เป็นประธานโดยการนำมาติดต่อหรือปรับเข้าไว้ หรือทำโดยประการอื่นใดในฐานะเป็นของใช้ประกอบกับทรัพย์ที่เป็นประธานนั้น\nอุปกรณ์ที่แยกออกจากทรัพย์ที่เป็นประธานเป็นการชั่วคราวก็ยังไม่ขาดจากการเป็นอุปกรณ์ของทรัพย์ที่เป็นประธานนั้น\nอุปกรณ์ย่อมตกติดไปกับทรัพย์ที่เป็นประธาน เว้นแต่จะมีการกำหนดไว้เป็นอย่างอื่น"],["148","b1t3","","","มาตรา ๑๔๘ ดอกผลของทรัพย์ ได้แก่ ดอกผลธรรมดาและดอกผลนิตินัย\nดอกผลธรรมดา หมายความว่า สิ่งที่เกิดขึ้นตามธรรมชาติของทรัพย์ ซึ่งได้มาจากตัวทรัพย์ โดยการมีหรือใช้ทรัพย์นั้นตามปกตินิยม และสามารถถือเอาได้เมื่อขาดจากทรัพย์นั้น\nดอกผลนิตินัย หมายความว่า ทรัพย์หรือประโยชน์อย่างอื่นที่ได้มาเป็นครั้งคราวแก่เจ้าของทรัพย์จากผู้อื่นเพื่อการที่ได้ใช้ทรัพย์นั้น และสามารถคำนวณและถือเอาได้เป็นรายวันหรือตามระยะเวลาที่กำหนดไว้"],["149","b1t4","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๔๙ นิติกรรม หมายความว่า การใด ๆ อันทำลงโดยชอบด้วยกฎหมายและด้วยใจสมัคร มุ่งโดยตรงต่อการผูกนิติสัมพันธ์ขึ้นระหว่างบุคคล เพื่อจะก่อ เปลี่ยนแปลง โอน สงวน หรือ ระงับซึ่งสิทธิ"],["150","b1t4","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๕๐ การใดมีวัตถุประสงค์เป็นการต้องห้ามชัดแจ้งโดยกฎหมายเป็นการพ้นวิสัยหรือเป็นการขัดต่อความสงบเรียบร้อยหรือศีลธรรมอันดีของประชาชน การนั้นเป็นโมฆะ"],["151","b1t4","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๕๑ การใดเป็นการแตกต่างกับบทบัญญัติของกฎหมาย ถ้ามิใช่กฎหมายอันเกี่ยวกับความสงบเรียบร้อยหรือศีลธรรมอันดีของประชาชน การนั้นไม่เป็นโมฆะ"],["152","b1t4","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๕๒ การใดมิได้ทำให้ถูกต้องตามแบบที่กฎหมายบังคับไว้ การนั้นเป็นโมฆะ"],["153","b1t4","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๕๓ การใดมิได้เป็นไปตามบทบัญญัติของกฎหมายว่าด้วยความสามารถของบุคคล การนั้นเป็นโมฆียะ"],["154","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๕๔ การแสดงเจตนาใดแม้ในใจจริงผู้แสดงจะมิได้เจตนาให้ตนต้องผูกพันตามที่ได้แสดงออกมาก็ตาม หาเป็นมูลเหตุให้การแสดงเจตนานั้นเป็นโมฆะไม่ เว้นแต่คู่กรณีอีกฝ่ายหนึ่งจะได้รู้ถึงเจตนาอันซ่อนอยู่ในใจของผู้แสดงนั้น"],["155","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๕๕ การแสดงเจตนาลวงโดยสมรู้กับคู่กรณีอีกฝ่ายหนึ่งเป็นโมฆะ แต่จะยกขึ้นเป็นข้อต่อสู้บุคคลภายนอกผู้กระทำการโดยสุจริต และต้องเสียหายจากการแสดงเจตนาลวงนั้นมิได้\nถ้าการแสดงเจตนาลวงตามวรรคหนึ่งทำขึ้นเพื่ออำพรางนิติกรรมอื่น ให้นำบทบัญญัติของกฎหมายอันเกี่ยวกับนิติกรรมที่ถูกอำพรางมาใช้บังคับ"],["156","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๕๖ การแสดงเจตนาโดยสำคัญผิดในสิ่งซึ่งเป็นสาระสำคัญแห่งนิติกรรมเป็นโมฆะ\nความสำคัญผิดในสิ่งซึ่งเป็นสาระสำคัญแห่งนิติกรรมตามวรรคหนึ่ง ได้แก่ ความสำคัญผิดในลักษณะของนิติกรรม ความสำคัญผิดในตัวบุคคลซึ่งเป็นคู่กรณีแห่งนิติกรรมและความสำคัญผิดในทรัพย์สินซึ่งเป็นวัตถุแห่งนิติกรรม เป็นต้น"],["157","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๕๗ การแสดงเจตนาโดยสำคัญผิดในคุณสมบัติของบุคคลหรือทรัพย์สินเป็นโมฆียะ\nความสำคัญผิดตามวรรคหนึ่ง ต้องเป็นความสำคัญผิดในคุณสมบัติซึ่งตามปกติถือว่าเป็นสาระสำคัญ ซึ่งหากมิได้มีความสำคัญผิดดังกล่าวการอันเป็นโมฆียะนั้นคงจะมิได้กระทำขึ้น"],["158","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๕๘ ความสำคัญผิดตามมาตรา ๑๕๖ หรือมาตรา ๑๕๗ ซึ่งเกิดขึ้นโดยความประมาทเลินเล่ออย่างร้ายแรงของบุคคลผู้แสดงเจตนา บุคคลนั้นจะถือเอาความสำคัญผิดนั้นมาใช้เป็นประโยชน์แก่ตนไม่ได้"],["159","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๕๙ การแสดงเจตนาเพราะถูกกลฉ้อฉลเป็นโมฆียะ\nการถูกกลฉ้อฉลที่จะเป็นโมฆียะตามวรรคหนึ่ง จะต้องถึงขนาดซึ่งถ้ามิได้มีกลฉ้อฉลดังกล่าว การอันเป็นโมฆียะนั้นคงจะมิได้กระทำขึ้น\nถ้าคู่กรณีฝ่ายหนึ่งแสดงเจตนาเพราะถูกกลฉ้อฉลโดยบุคคลภายนอก การแสดงเจตนานั้นจะเป็นโมฆียะต่อเมื่อคู่กรณีอีกฝ่ายหนึ่งได้รู้หรือควรจะได้รู้ถึงกลฉ้อฉลนั้น"],["160","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๖๐ การบอกล้างโมฆียะกรรมเพราะถูกกลฉ้อฉลตามมาตรา ๑๕๙ ห้ามมิให้ยกเป็นข้อต่อสู้บุคคลภายนอกผู้กระทำการโดยสุจริต"],["161","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๖๑ ถ้ากลฉ้อฉลเป็นแต่เพียงเหตุจูงใจให้คู่กรณีฝ่ายหนึ่งยอมรับข้อกำหนดอันหนักยิ่งกว่าที่คู่กรณีฝ่ายนั้นจะยอมรับโดยปกติ คู่กรณีฝ่ายนั้นจะบอกล้างการนั้นหาได้ไม่ แต่ชอบที่จะเรียกเอาค่าสินไหมทดแทนเพื่อความเสียหายอันเกิดจากกลฉ้อฉลนั้นได้"],["162","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๖๒ ในนิติกรรมสองฝ่าย การที่คู่กรณีฝ่ายหนึ่งจงใจนิ่งเสียไม่แจ้งข้อความจริงหรือคุณสมบัติอันคู่กรณีอีกฝ่ายหนึ่งมิได้รู้ การนั้นจะเป็นกลฉ้อฉล หากพิสูจน์ได้ว่าถ้ามิได้นิ่งเสียเช่นนั้น นิติกรรมนั้นก็คงจะมิได้กระทำขึ้น"],["163","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๖๓ ถ้าคู่กรณีต่างได้กระทำการโดยกลฉ้อฉลด้วยกันทั้งสองฝ่าย ฝ่ายหนึ่งฝ่ายใดจะกล่าวอ้างกลฉ้อฉลของอีกฝ่ายหนึ่ง เพื่อบอกล้างการนั้นหรือเรียกค่าสินไหมทดแทนมิได้"],["164","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๖๔ การแสดงเจตนาเพราะถูกข่มขู่เป็นโมฆียะ\nการข่มขู่ที่จะทำให้การใดตกเป็นโมฆียะนั้น จะต้องเป็นการข่มขู่ที่จะให้เกิดภัยอันใกล้จะถึงและร้ายแรงถึงขนาดที่จะจูงใจให้ผู้ถูกข่มขู่มีมูลต้องกลัว ซึ่งถ้ามิได้มีการข่มขู่เช่นนั้น การนั้นก็คงจะมิได้กระทำขึ้น"],["165","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๖๕ การขู่ว่าจะใช้สิทธิตามปกตินิยม ไม่ถือว่าเป็นการข่มขู่\nการใดที่กระทำไปเพราะนับถือยำเกรง ไม่ถือว่าการนั้นได้กระทำเพราะถูกข่มขู่"],["166","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๖๖ การข่มขู่ย่อมทำให้การแสดงเจตนาเป็นโมฆียะแม้บุคคลภายนอกจะเป็นผู้ข่มขู่"],["167","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๖๗ ในการวินิจฉัยกรณีความสำคัญผิด กลฉ้อฉล หรือการข่มขู่ให้พิเคราะห์ถึง เพศ อายุ ฐานะ สุขภาพอนามัย และภาวะแห่งจิตของผู้แสดงเจตนาตลอดจนพฤติการณ์และสภาพแวดล้อมอื่น ๆ อันเกี่ยวกับการนั้นด้วย"],["168","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๖๘ การแสดงเจตนาที่กระทำต่อบุคคลซึ่งอยู่เฉพาะหน้าให้ถือว่ามีผลนับแต่ผู้รับการแสดงเจตนาได้ทราบการแสดงเจตนานั้น ความข้อนี้ให้ใช้ตลอดถึงการที่บุคคลหนึ่งแสดงเจตนาไปยังบุคคลอีกคนหนึ่งโดยทางโทรศัพท์ หรือโดยเครื่องมือสื่อสารอย่างอื่น หรือโดยวิธีอื่นซึ่งสามารถติดต่อถึงกันได้ทำนองเดียวกัน"],["169","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๖๙ การแสดงเจตนาที่กระทำต่อบุคคลซึ่งมิได้อยู่เฉพาะหน้าให้ถือว่ามีผลนับแต่เวลาที่การแสดงเจตนานั้นไปถึงผู้รับการแสดงเจตนา แต่ถ้าได้บอกถอนไปถึงผู้รับการแสดงเจตนานั้นก่อนหรือพร้อมกันกับที่การแสดงเจตนานั้นไปถึงผู้รับการแสดงเจตนา การแสดงเจตนานั้นตกเป็นอันไร้ผล\nการแสดงเจตนาที่ได้ส่งออกไปแล้วย่อมไม่เสื่อมเสียไป แม้ภายหลังการแสดงเจตนานั้นผู้แสดงเจตนาจะถึงแก่ความตาย หรือถูกศาลสั่งให้เป็นคนไร้ความสามารถหรือคนเสมือนไร้ความสามารถ"],["170","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๗๐ การแสดงเจตนาซึ่งกระทำต่อผู้เยาว์หรือผู้ที่ศาลสั่งให้เป็นคนไร้ความสามารถหรือคนเสมือนไร้ความสามารถ จะยกขึ้นเป็นข้อต่อสู้ผู้รับการแสดงเจตนาไม่ได้ เว้นแต่ผู้แทนโดยชอบธรรม ผู้อนุบาล หรือผู้พิทักษ์ แล้วแต่กรณี ของผู้รับการแสดงเจตนานั้นได้รู้ด้วย หรือได้ให้ความยินยอมไว้ก่อนแล้ว\nความในวรรคหนึ่งมิให้ใช้บังคับ ถ้าการแสดงเจตนานั้นเกี่ยวกับการที่กฎหมายบัญญัติให้ผู้เยาว์หรือคนเสมือนไร้ความสามารถกระทำได้เองโดยลำพัง"],["171","b1t4","หมวด ๒ การแสดงเจตนา","","มาตรา ๑๗๑ ในการตีความการแสดงเจตนานั้น ให้เพ่งเล็งถึงเจตนาอันแท้จริงยิ่งกว่าถ้อยคำสำนวนหรือตัวอักษร"],["172","b1t4","หมวด ๓ โมฆะกรรมและโมฆียะกรรม","","มาตรา ๑๗๒ โมฆะกรรมนั้นไม่อาจให้สัตยาบันแก่กันได้ และผู้มีส่วนได้เสียคนหนึ่งคนใดจะยกความเสียเปล่าแห่งโมฆะกรรมขึ้นกล่าวอ้างก็ได้\nถ้าจะต้องคืนทรัพย์สินอันเกิดจากโมฆะกรรม ให้นำบทบัญญัติว่าด้วยลาภมิควรได้แห่งประมวลกฎหมายนี้มาใช้บังคับ"],["173","b1t4","หมวด ๓ โมฆะกรรมและโมฆียะกรรม","","มาตรา ๑๗๓ ถ้าส่วนหนึ่งส่วนใดของนิติกรรมเป็นโมฆะ นิติกรรมนั้นย่อมตกเป็นโมฆะทั้งสิ้น เว้นแต่จะพึงสันนิษฐานได้โดยพฤติการณ์แห่งกรณีว่า คู่กรณีเจตนาจะให้ส่วนที่ไม่เป็นโมฆะนั้นแยกออกจากส่วนที่เป็นโมฆะได้"],["174","b1t4","หมวด ๓ โมฆะกรรมและโมฆียะกรรม","","มาตรา ๑๗๔ การใดเป็นโมฆะแต่เข้าลักษณะเป็นนิติกรรมอย่างอื่นซึ่งไม่เป็นโมฆะ ให้ถือตามนิติกรรมซึ่งไม่เป็นโมฆะ ถ้าสันนิษฐานได้โดยพฤติการณ์แห่งกรณีว่า หากคู่กรณีได้รู้ว่าการนั้นเป็นโมฆะแล้ว ก็คงจะได้ตั้งใจมาตั้งแต่แรกที่จะทำนิติกรรมอย่างอื่นซึ่งไม่เป็นโมฆะนั้น"],["175","b1t4","หมวด ๓ โมฆะกรรมและโมฆียะกรรม","","มาตรา ๑๗๕ โมฆียะกรรมนั้น บุคคลต่อไปนี้จะบอกล้างเสียก็ได้\n(๑) ผู้แทนโดยชอบธรรมหรือผู้เยาว์ซึ่งบรรลุนิติภาวะแล้ว แต่ผู้เยาว์จะบอกล้างก่อนที่ตนบรรลุนิติภาวะก็ได้ถ้าได้รับความยินยอมของผู้แทนโดยชอบธรรม\n(๒) บุคคลซึ่งศาลสั่งให้เป็นคนไร้ความสามารถหรือคนเสมือนไร้ความสามารถเมื่อบุคคลนั้นพ้นจากการเป็นคนไร้ความสามารถหรือคนเสมือนไร้ความสามารถแล้ว หรือผู้อนุบาล หรือผู้พิทักษ์ แล้วแต่กรณี แต่คนเสมือนไร้ความสามารถจะบอกล้างก่อนที่ตนจะพ้นจากการเป็นคนเสมือนไร้ความสามารถก็ได้ถ้าได้รับความยินยอมของผู้พิทักษ์\n(๓) บุคคลผู้แสดงเจตนาเพราะสำคัญผิด หรือถูกกลฉ้อฉล หรือถูกข่มขู่\n(๔) บุคคลวิกลจริตผู้กระทำนิติกรรมอันเป็นโมฆียะตามมาตรา ๓๐ ในขณะที่จริตของบุคคลนั้นไม่วิกลแล้ว\nถ้าบุคคลผู้ทำนิติกรรมอันเป็นโมฆียะถึงแก่ความตายก่อนมีการบอกล้างโมฆียะกรรม ทายาทของบุคคลดังกล่าวอาจบอกล้างโมฆียะกรรมนั้นได้"],["176","b1t4","หมวด ๓ โมฆะกรรมและโมฆียะกรรม","","มาตรา ๑๗๖ โมฆียะกรรมเมื่อบอกล้างแล้ว ให้ถือว่าเป็นโมฆะมาแต่เริ่มแรก และให้ผู้เป็นคู่กรณีกลับคืนสู่ฐานะเดิม ถ้าเป็นการพ้นวิสัยจะให้กลับคืนเช่นนั้นได้ ก็ให้ได้รับค่าเสียหายชดใช้ให้แทน\nถ้าบุคคลใดได้รู้หรือควรจะได้รู้ว่าการใดเป็นโมฆียะ เมื่อบอกล้างแล้ว ให้ถือว่าบุคคลนั้นได้รู้ว่าการนั้นเป็นโมฆะ นับแต่วันที่ได้รู้หรือควรจะได้รู้ว่าเป็นโมฆียะ\nห้ามมิให้ใช้สิทธิเรียกร้องอันเกิดแต่การกลับคืนสู่ฐานะเดิมตามวรรคหนึ่ง เมื่อพ้นหนึ่งปีนับแต่วันบอกล้างโมฆียะกรรม"],["177","b1t4","หมวด ๓ โมฆะกรรมและโมฆียะกรรม","","มาตรา ๑๗๗ ถ้าบุคคลผู้มีสิทธิบอกล้างโมฆียะกรรมตามมาตรา ๑๗๕ ผู้หนึ่งผู้ใด ได้ให้สัตยาบันแก่โมฆียะกรรม ให้ถือว่าการนั้นเป็นอันสมบูรณ์มาแต่เริ่มแรก แต่ทั้งนี้ย่อมไม่กระทบกระเทือนถึงสิทธิของบุคคลภายนอก"],["178","b1t4","หมวด ๓ โมฆะกรรมและโมฆียะกรรม","","มาตรา ๑๗๘ การบอกล้างหรือให้สัตยาบันแก่โมฆียะกรรม ย่อมกระทำได้โดยการแสดงเจตนาแก่คู่กรณีอีกฝ่ายหนึ่งซึ่งเป็นบุคคลที่มีตัวกำหนดได้แน่นอน"],["179","b1t4","หมวด ๓ โมฆะกรรมและโมฆียะกรรม","","มาตรา ๑๗๙ การให้สัตยาบันแก่โมฆียะกรรมนั้น จะสมบูรณ์ต่อเมื่อได้กระทำภายหลังเวลาที่มูลเหตุให้เป็นโมฆียะกรรมนั้นหมดสิ้นไปแล้ว\nบุคคลซึ่งศาลได้สั่งให้เป็นคนไร้ความสามารถ คนเสมือนไร้ความสามารถหรือบุคคลวิกลจริต ผู้กระทำนิติกรรมอันเป็นโมฆียะตามมาตรา ๓๐ จะให้สัตยาบันแก่โมฆียะกรรมได้ต่อเมื่อได้รู้เห็นซึ่งโมฆียะกรรมนั้นภายหลังที่บุคคลนั้นพ้นจากการเป็นคนไร้ความสามารถ คนเสมือนไร้ความสามารถหรือในขณะที่จริตของบุคคลนั้นไม่วิกล แล้วแต่กรณี\nทายาทของบุคคลผู้ทำนิติกรรมอันเป็นโมฆียะ จะให้สัตยาบันแก่โมฆียะกรรมได้นับแต่เวลาที่ผู้ทำนิติกรรมนั้นถึงแก่ความตาย เว้นแต่สิทธิที่จะบอกล้างโมฆียะกรรมของผู้ตายนั้นได้สิ้นสุดลงแล้ว\nบทบัญญัติวรรคหนึ่งและวรรคสองมิให้ใช้บังคับ ถ้าการให้สัตยาบันแก่โมฆียะกรรมกระทำโดยผู้แทนโดยชอบธรรม ผู้อนุบาลหรือผู้พิทักษ์"],["180","b1t4","หมวด ๓ โมฆะกรรมและโมฆียะกรรม","","มาตรา ๑๘๐ ภายหลังเวลาอันพึงให้สัตยาบันได้ตามมาตรา ๑๗๙ ถ้ามีพฤติการณ์อย่างหนึ่งอย่างใดดังต่อไปนี้เกิดขึ้นเกี่ยวด้วยโมฆียะกรรมโดยการกระทำของบุคคลซึ่งมีสิทธิบอกล้างโมฆียะกรรมตามมาตรา ๑๗๕ ถ้ามิได้สงวนสิทธิไว้แจ้งชัดประการใดให้ถือว่าเป็นการให้สัตยาบัน\n(๑) ได้ปฏิบัติการชำระหนี้แล้วทั้งหมดหรือแต่บางส่วน\n(๒) ได้มีการเรียกให้ชำระหนี้นั้นแล้ว\n(๓) ได้มีการแปลงหนี้ใหม่\n(๔) ได้มีการให้ประกันเพื่อหนี้นั้น\n(๕) ได้มีการโอนสิทธิหรือความรับผิดทั้งหมดหรือแต่บางส่วน\n(๖) ได้มีการ
