หมวด ๑ ยืมใช้คงรูป","","มาตรา ๖๔๕ ในกรณีทั้งหลายดังกล่าวไว้ในมาตรา ๖๔๓ นั้นก็ดี หรือถ้าผู้ยืมประพฤติฝ่าฝืนต่อความในมาตรา ๖๔๔ ก็ดี ผู้ให้ยืมจะบอกเลิกสัญญาเสียก็ได้"],["646","b3t9","หมวด ๑ ยืมใช้คงรูป","","มาตรา ๖๔๖ ถ้ามิได้กำหนดเวลากันไว้ ท่านให้คืนทรัพย์สินที่ยืมเมื่อผู้ยืมได้ใช้สอยทรัพย์สินนั้นเสร็จแล้วตามการอันปรากฏในสัญญา แต่ผู้ให้ยืมจะเรียกคืนก่อนนั้นก็ได้ เมื่อเวลาได้ล่วงไปพอแก่การที่ผู้ยืมจะได้ใช้สอยทรัพย์สินนั้นเสร็จแล้ว\nถ้าเวลาก็มิได้กำหนดกันไว้ ทั้งในสัญญาก็ไม่ปรากฏว่ายืมไปใช้เพื่อการใดไซร้ ท่านว่าผู้ให้ยืมจะเรียกของคืนเมื่อไรก็ได้"],["647","b3t9","หมวด ๑ ยืมใช้คงรูป","","มาตรา ๖๔๗ ค่าใช้จ่ายอันเป็นปกติแก่การบำรุงรักษาทรัพย์สินซึ่งยืมนั้น ผู้ยืมต้องเป็นผู้เสีย"],["648","b3t9","หมวด ๑ ยืมใช้คงรูป","","มาตรา ๖๔๘ อันการยืมใช้คงรูป ย่อมระงับสิ้นไปด้วยมรณะแห่งผู้ยืม"],["649","b3t9","หมวด ๑ ยืมใช้คงรูป","","มาตรา ๖๔๙ ในข้อความรับผิดเพื่อเสียค่าทดแทนอันเกี่ยวกับการยืมใช้คงรูปนั้น ท่านห้ามมิให้ฟ้องเมื่อพ้นเวลาหกเดือนนับแต่วันสิ้นสัญญา"],["650","b3t9","หมวด ๒ ยืมใช้สิ้นเปลือง","","มาตรา ๖๕๐ อันว่ายืมใช้สิ้นเปลืองนั้น คือสัญญาซึ่งผู้ให้ยืมโอนกรรมสิทธิ์ในทรัพย์สินชนิดใช้ไปสิ้นไปนั้นเป็นปริมาณมีกำหนดให้ไปแก่ผู้ยืม และผู้ยืมตกลงว่าจะคืนทรัพย์สินเป็นประเภท ชนิด และปริมาณเช่นเดียวกันให้แทนทรัพย์สินซึ่งให้ยืมนั้น\nสัญญานี้ย่อมบริบูรณ์ต่อเมื่อส่งมอบทรัพย์สินที่ยืม"],["651","b3t9","หมวด ๒ ยืมใช้สิ้นเปลือง","","มาตรา ๖๕๑ ค่าฤชาธรรมเนียมในการทำสัญญาก็ดี ค่าส่งมอบและส่งคืนทรัพย์สินซึ่งยืมก็ดี ย่อมตกแก่ผู้ยืมเป็นผู้เสีย"],["652","b3t9","หมวด ๒ ยืมใช้สิ้นเปลือง","","มาตรา ๖๕๒ ถ้าในสัญญาไม่มีกำหนดเวลาให้คืนทรัพย์สินซึ่งยืมไป ผู้ให้ยืมจะบอกกล่าวแก่ผู้ยืมให้คืนทรัพย์สินภายในเวลาอันควร ซึ่งกำหนดให้ในคำบอกกล่าวนั้นก็ได้"],["653","b3t9","หมวด ๒ ยืมใช้สิ้นเปลือง","","มาตรา ๖๕๓ การกู้ยืมเงินกว่าสองพันบาทขึ้นไปนั้น ถ้ามิได้มีหลักฐานแห่งการกู้ยืมเป็นหนังสืออย่างใดอย่างหนึ่งลงลายมือชื่อผู้ยืมเป็นสำคัญ จะฟ้องร้องให้บังคับคดีหาได้ไม่\nในการกู้ยืมเงินมีหลักฐานเป็นหนังสือนั้น ท่านว่าจะนำสืบการใช้เงินได้ต่อเมื่อมีหลักฐานเป็นหนังสืออย่างใดอย่างหนึ่งลงลายมือชื่อผู้ให้ยืมมาแสดง หรือเอกสารอันเป็นหลักฐานแห่งการกู้ยืมนั้นได้เวนคืนแล้ว หรือได้แทงเพิกถอนลงในเอกสารนั้นแล้ว"],["654","b3t9","หมวด ๒ ยืมใช้สิ้นเปลือง","","มาตรา ๖๕๔ ท่านห้ามมิให้คิดดอกเบี้ยเกินร้อยละสิบห้าต่อปี ถ้าในสัญญากำหนดดอกเบี้ยเกินกว่านั้น ก็ให้ลดลงมาเป็นร้อยละสิบห้าต่อปี"],["655","b3t9","หมวด ๒ ยืมใช้สิ้นเปลือง","","มาตรา ๖๕๕ ท่านห้ามมิให้คิดดอกเบี้ยในดอกเบี้ยที่ค้างชำระ แต่ทว่าเมื่อดอกเบี้ยค้างชำระไม่น้อยกว่าปีหนึ่ง คู่สัญญากู้ยืมจะตกลงกันให้เอาดอกเบี้ยนั้นทบเข้ากับต้นเงินแล้วให้คิดดอกเบี้ยในจำนวนเงินที่ทบเข้ากันนั้นก็ได้ แต่การตกลงเช่นนั้นต้องทำเป็นหนังสือ\nส่วนประเพณีการค้าขายที่คำนวณดอกทบต้นในบัญชีเดินสะพัดก็ดี ในการค้าขายอย่างอื่นทำนองเช่นว่านี้ก็ดี หาอยู่ในบังคับแห่งบทบัญญัติซึ่งกล่าวมาในวรรคก่อนนั้นไม่"],["656","b3t9","หมวด ๒ ยืมใช้สิ้นเปลือง","","มาตรา ๖๕๖ ถ้าทำสัญญากู้ยืมเงินกัน และผู้กู้ยืมยอมรับเอาสิ่งของหรือทรัพย์สินอย่างอื่นแทนจำนวนเงินนั้นไซร้ ท่านให้คิดเป็นหนี้ค้างชำระโดยจำนวนเท่ากับราคาท้องตลาดแห่งสิ่งของหรือทรัพย์สินนั้นในเวลาและ ณ สถานที่ส่งมอบ\nถ้าทำสัญญากู้ยืมเงินกัน และผู้ให้กู้ยืมยอมรับเอาสิ่งของหรือทรัพย์สินอย่างอื่นเป็นการชำระหนี้แทนเงินที่กู้ยืมไซร้ หนี้อันระงับไปเพราะการชำระเช่นนั้น ท่านให้คิดเป็นจำนวนเท่ากับราคาท้องตลาดแห่งสิ่งของหรือทรัพย์สินนั้นในเวลาและ ณ สถานที่ส่งมอบ\nความตกลงกันอย่างใด ๆ ขัดกับข้อความดังกล่าวมานี้ท่านว่าเป็นโมฆะ"],["657","b3t10","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๕๗ อันว่าฝากทรัพย์นั้น คือสัญญาซึ่งบุคคลคนหนึ่ง เรียกว่าผู้ฝาก ส่งมอบทรัพย์สินให้แก่บุคคลอีกคนหนึ่ง เรียกว่าผู้รับฝาก และผู้รับฝากตกลงว่าจะเก็บรักษาทรัพย์สินนั้นไว้ในอารักขาแห่งตน แล้วจะคืนให้"],["658","b3t10","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๕๘ ถ้าโดยพฤติการณ์พึงคาดหมายได้ว่าเขารับฝากทรัพย์ก็เพื่อจะได้รับบำเหน็จค่าฝากทรัพย์เท่านั้นไซร้ ท่านให้ถือว่าเป็นอันตกลงกันแล้วโดยปริยายว่ามีบำเหน็จเช่นนั้น"],["659","b3t10","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๕๙ ถ้าการรับฝากทรัพย์เป็นการทำให้เปล่าไม่มีบำเหน็จไซร้ ท่านว่าผู้รับฝากจำต้องใช้ความระมัดระวังสงวนทรัพย์สินซึ่งฝากนั้นเหมือนเช่นเคยประพฤติในกิจการของตนเอง\nถ้าการรับฝากทรัพย์นั้นมีบำเหน็จค่าฝาก ท่านว่าผู้รับฝากจำต้องใช้ความระมัดระวังและใช้ฝีมือเพื่อสงวนทรัพย์สินนั้นเหมือนเช่นวิญญูชนจะพึงประพฤติโดยพฤติการณ์ดังนั้น ทั้งนี้ ย่อมรวมทั้งการใช้ฝีมืออันพิเศษเฉพาะการในที่จะพึงใช้ฝีมือเช่นนั้นด้วย\nถ้าและผู้รับฝากเป็นผู้มีวิชาชีพเฉพาะกิจการค้าขาย หรืออาชีวะอย่างหนึ่งอย่างใด ก็จำต้องใช้ความระมัดระวังและใช้ฝีมือเท่าที่เป็นธรรมดาจะต้องใช้และสมควรจะต้องใช้ในกิจการค้าขายหรืออาชีวะอย่างนั้น"],["660","b3t10","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๖๐ ถ้าผู้ฝากมิได้อนุญาต และผู้รับฝากเอาทรัพย์สินซึ่งฝากนั้นออกใช้สอยเอง หรือเอาไปให้บุคคลภายนอกใช้สอย หรือให้บุคคลภายนอกเก็บรักษาไซร้ ท่านว่าผู้รับฝากจะต้องรับผิดเมื่อทรัพย์สินซึ่งฝากนั้นสูญหายหรือบุบสลายอย่างหนึ่งอย่างใด แม้ถึงจะเป็นเพราะเหตุสุดวิสัย เว้นแต่จะพิสูจน์ได้ว่าถึงอย่างไร ๆ ทรัพย์สินนั้นก็คงจะต้องสูญหายหรือบุบสลายอยู่นั่นเอง"],["661","b3t10","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๖๑ ถ้าบุคคลภายนอกอ้างว่ามีสิทธิเหนือทรัพย์สินซึ่งฝากและยื่นฟ้องผู้รับฝากก็ดี หรือยึดทรัพย์สินนั้นก็ดี ผู้รับฝากต้องรีบบอกกล่าวแก่ผู้ฝากโดยพลัน"],["662","b3t10","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๖๒ ถ้าได้กำหนดเวลากันไว้ว่าจะพึงคืนทรัพย์สินซึ่งฝากนั้นเมื่อไร ท่านว่าผู้รับฝากไม่มีสิทธิจะคืนทรัพย์สินก่อนถึงเวลากำหนด เว้นแต่ในเหตุจำเป็นอันมิอาจจะก้าวล่วงเสียได้"],["663","b3t10","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๖๓ ถึงแม้ว่าคู่สัญญาจะได้กำหนดเวลาไว้ว่าจะพึงคืนทรัพย์สินซึ่งฝากนั้นเมื่อไรก็ตาม ถ้าว่าผู้ฝากจะเรียกคืนในเวลาใด ๆ ผู้รับฝากก็ต้องคืนให้"],["664","b3t10","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๖๔ ถ้าคู่สัญญาไม่ได้กำหนดเวลาไว้ว่าจะพึงคืนทรัพย์สินซึ่งฝากนั้นเมื่อไรไซร้ ผู้รับฝากอาจคืนทรัพย์สินนั้นได้ทุกเมื่อ"],["665","b3t10","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๖๕ ผู้รับฝากจำต้องคืนทรัพย์สินซึ่งรับฝากไว้นั้นให้แก่ผู้ฝาก หรือทรัพย์สินนั้นฝากในนามของผู้ใด คืนให้แก่ผู้นั้น หรือผู้รับฝากได้รับคำสั่งโดยชอบให้คืนทรัพย์สินนั้นไปแก่ผู้ใด คืนให้แก่ผู้นั้น\nแต่หากผู้ฝากทรัพย์ตาย ท่านให้คืนทรัพย์สินนั้นให้แก่ทายาท"],["666","b3t10","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๖๖ เมื่อคืนทรัพย์ ถ้ามีดอกผลเกิดแต่ทรัพย์สินซึ่งฝากนั้นเท่าใด ผู้รับฝากจำต้องส่งมอบพร้อมไปกับทรัพย์สินนั้นด้วย"],["667","b3t10","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๖๗ ค่าคืนทรัพย์สินซึ่งฝากนั้น ย่อมตกแก่ผู้ฝากเป็นผู้เสีย"],["668","b3t10","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๖๘ ค่าใช้จ่ายใดอันควรแก่การบำรุงรักษาทรัพย์สินซึ่งฝากนั้น ผู้ฝากจำต้องชดใช้ให้แก่ผู้รับฝาก เว้นแต่จะได้ตกลงกันไว้โดยสัญญาฝากทรัพย์ว่าผู้รับฝากจะต้องออกเงินค่าใช้จ่ายนั้นเอง"],["669","b3t10","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๖๙ ถ้าไม่ได้กำหนดเวลาไว้ในสัญญา หรือไม่มีกำหนดโดยจารีตประเพณีว่าบำเหน็จค่าฝากทรัพย์นั้นจะพึงชำระเมื่อไรไซร้ ท่านให้ชำระเมื่อคืนทรัพย์สินซึ่งฝาก ถ้าได้กำหนดเวลากันไว้เป็นระยะอย่างไร ก็พึงชำระเมื่อสิ้นระยะเวลานั้นทุกคราวไป"],["670","b3t10","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๗๐ ผู้รับฝากชอบที่จะยึดหน่วงเอาทรัพย์สินซึ่งฝากนั้นไว้ได้ จนกว่าจะได้รับเงินบรรดาที่ค้างชำระแก่ตนเกี่ยวด้วยการฝากทรัพย์นั้น"],["671","b3t10","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๗๑ ในข้อความรับผิดเพื่อใช้เงินบำเหน็จค่าฝากทรัพย์ก็ดี ชดใช้เงินค่าใช้จ่ายก็ดี ใช้ค่าสินไหมทดแทนเกี่ยวแก่การฝากทรัพย์ก็ดี ท่านห้ามมิให้ฟ้องเมื่อพ้นเวลาหกเดือนนับแต่วันสิ้นสัญญา"],["672","b3t10","หมวด ๒ วิธีเฉพาะการฝากเงิน","","มาตรา ๖๗๒ ถ้าฝากเงิน ท่านให้สันนิษฐานไว้ก่อนว่าผู้รับฝากไม่พึงต้องส่งคืนเป็นเงินทองตราอันเดียวกันกับที่ฝาก แต่จะต้องคืนเงินให้ครบจำนวน\nอนึ่ง ผู้รับฝากจะเอาเงินซึ่งฝากนั้นออกใช้ก็ได้ แต่หากจำต้องคืนเงินให้ครบจำนวนเท่านั้น แม้ว่าเงินซึ่งฝากนั้นจะได้สูญหายไปด้วยเหตุสุดวิสัยก็ตาม ผู้รับฝากก็จำต้องคืนเงินเป็นจำนวนดังว่านั้น"],["673","b3t10","หมวด ๒ วิธีเฉพาะการฝากเงิน","","มาตรา ๖๗๓ เมื่อใดผู้รับฝากจำต้องคืนเงินแต่เพียงเท่าจำนวนที่ฝาก ผู้ฝากจะเรียกถอนเงินคืนก่อนถึงเวลาที่ได้ตกลงกันไว้ไม่ได้ หรือฝ่ายผู้รับฝากจะส่งคืนเงินก่อนถึงเวลานั้นก็ไม่ได้ดุจกัน"],["674","b3t10","หมวด ๓ วิธีเฉพาะสำหรับเจ้าสำนักโรงแรม","","มาตรา ๖๗๔ เจ้าสำนักโรงแรมหรือโฮเต็ล หรือสถานที่อื่นทำนองเช่นว่านั้น จะต้องรับผิดเพื่อความสูญหายหรือบุบสลายอย่างใด ๆ อันเกิดแก่ทรัพย์สินซึ่งคนเดินทางหรือแขกอาศัย หากได้พามา"],["675","b3t10","หมวด ๓ วิธีเฉพาะสำหรับเจ้าสำนักโรงแรม","","มาตรา ๖๗๕ เจ้าสำนักต้องรับผิดในการที่ทรัพย์สินของคนเดินทางหรือแขกอาศัยสูญหายหรือบุบสลายไปอย่างใด ๆ แม้ถึงว่าความสูญหายหรือบุบสลายนั้นจะเกิดขึ้นเพราะผู้คนไปมาเข้าออก ณ โรงแรม โฮเต็ล หรือสถานที่เช่นนั้น ก็คงต้องรับผิด\nความรับผิดนี้ ถ้าเกี่ยวด้วยเงินทองตรา ธนบัตร ตั๋วเงิน พันธบัตร ใบหุ้น ใบหุ้นกู้ ประทวนสินค้า อัญมณี หรือของมีค่าอื่น ๆ ให้จำกัดไว้เพียงห้าพันบาท เว้นแต่จะได้ฝากของมีค่าเช่นนี้ไว้แก่เจ้าสำนักและได้บอกราคาแห่งของนั้นชัดแจ้ง\nแต่เจ้าสำนักไม่ต้องรับผิดเพื่อความสูญหายหรือบุบสลายอันเกิดแต่เหตุสุดวิสัย หรือแต่สภาพแห่งทรัพย์สินนั้น หรือแต่ความผิดของคนเดินทาง หรือแขกอาศัยผู้นั้นเอง หรือบริวารของเขา หรือบุคคลซึ่งเขาได้ต้อนรับ"],["676","b3t10","หมวด ๓ วิธีเฉพาะสำหรับเจ้าสำนักโรงแรม","","มาตรา ๖๗๖ ทรัพย์สินซึ่งมิได้นำฝากบอกราคาชัดแจ้งนั้น เมื่อพบเห็นว่าสูญหายหรือบุบสลายขึ้น คนเดินทางหรือแขกอาศัยต้องแจ้งความนั้นต่อเจ้าสำนักโรงแรม โฮเต็ล หรือสถานที่เช่นนั้นทันที มิฉะนั้นท่านว่าเจ้าสำนักย่อมพ้นจากความรับผิดดังบัญญัติไว้ในมาตรา ๖๗๔ และมาตรา ๖๗๕"],["677","b3t10","หมวด ๓ วิธีเฉพาะสำหรับเจ้าสำนักโรงแรม","","มาตรา ๖๗๗ ถ้ามีคำแจ้งความปิดไว้ในโรงแรม โฮเต็ล หรือสถานที่อื่นทำนองเช่นว่านี้ เป็นข้อความยกเว้นหรือจำกัดความรับผิดของเจ้าสำนักไซร้ ท่านว่าความนั้นเป็นโมฆะ เว้นแต่คนเดินทางหรือแขกอาศัยจะได้ตกลงด้วยชัดแจ้งในการยกเว้นหรือจำกัดความรับผิดดังว่านั้น"],["678","b3t10","หมวด ๓ วิธีเฉพาะสำหรับเจ้าสำนักโรงแรม","","มาตรา ๖๗๘ ในข้อความรับผิดใช้ค่าสินไหมทดแทนเพื่อทรัพย์สินของคนเดินทางหรือแขกอาศัยสูญหายหรือบุบสลายนั้น ท่านห้ามมิให้ฟ้องเมื่อพ้นเวลาหกเดือนนับแต่วันที่คนเดินทางหรือแขกอาศัยออกไปจากสถานที่นั้น"],["679","b3t10","หมวด ๓ วิธีเฉพาะสำหรับเจ้าสำนักโรงแรม","","มาตรา ๖๗๙ เจ้าสำนักชอบที่จะยึดหน่วงเครื่องเดินทางหรือทรัพย์สินอย่างอื่นของคนเดินทางหรือแขกอาศัยอันเอาไว้ในโรงแรม โฮเต็ล หรือสถานที่เช่นนั้นได้จนกว่าจะได้รับใช้เงินบรรดาที่ค้างชำระแก่ตน เพื่อการพักอาศัยและการอื่น ๆ อันได้ทำให้แก่คนเดินทางหรือแขกอาศัยตามที่เขาพึงต้องการนั้น รวมทั้งการชดใช้เงินทั้งหลายที่ได้ออกแทนไปด้วย\nเจ้าสำนักจะเอาทรัพย์สินที่ได้ยึดหน่วงไว้เช่นว่านั้นออกขายทอดตลาด แล้วหักเอาเงินใช้จำนวนที่ค้างชำระแก่ตน รวมทั้งค่าฤชาธรรมเนียมและค่าใช้จ่ายในการขายทอดตลาดนั้นจากเงินที่ขายทรัพย์สินนั้นก็ได้ แต่ท่านมิให้เจ้าสำนักใช้สิทธิดังว่านี้ จนเมื่อ\n(๑) ทรัพย์สินนั้นตกอยู่แก่ตนเป็นเวลานานถึงหกสัปดาห์ยังมิได้รับชำระหนี้สิน และ\n(๒) อย่างน้อยเดือนหนึ่งก่อนวันขายทอดตลาด ตนได้ประกาศโฆษณาในหนังสือพิมพ์ประจำท้องถิ่นฉบับหนึ่งแจ้งความจำนงที่จะขายทรัพย์สิน บอกลักษณะแห่งทรัพย์สินที่จะขายโดยย่อ กับถ้ารู้ชื่อเจ้าของ ก็บอกด้วย\nเมื่อขายทอดตลาดหักใช้หนี้ดังกล่าวแล้ว มีเงินเหลืออยู่อีกเท่าใดต้องคืนให้แก่เจ้าของ หรือฝากไว้ ณ สำนักงานฝากทรัพย์ตามบทบัญญัติในมาตรา ๓๓๑ และมาตรา ๓๓๓"],["680","b3t11","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๘๐ อันว่าค้ำประกันนั้น คือสัญญาซึ่งบุคคลภายนอกคนหนึ่ง เรียกว่าผู้ค้ำประกัน ผูกพันตนต่อเจ้าหนี้คนหนึ่งเพื่อชำระหนี้ในเมื่อลูกหนี้ไม่ชำระหนี้นั้น\nอนึ่ง สัญญาค้ำประกันนั้น ถ้ามิได้มีหลักฐานเป็นหนังสืออย่างใดอย่างหนึ่งลงลายมือชื่อผู้ค้ำประกันเป็นสำคัญ ท่านว่าจะฟ้องร้องให้บังคับคดีหาได้ไม่"],["681","b3t11","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๘๑ อันค้ำประกันนั้นจะมีได้แต่เฉพาะเพื่อหนี้อันสมบูรณ์\nหนี้ในอนาคตหรือหนี้มีเงื่อนไขจะประกันไว้เพื่อเหตุการณ์ซึ่งหนี้นั้นอาจเป็นผลได้จริงก็ประกันได้ แต่ต้องระบุวัตถุประสงค์ในการก่อหนี้รายที่ค้ำประกัน ลักษณะของมูลหนี้ จำนวนเงินสูงสุดที่ค้ำประกัน และระยะเวลาในการก่อหนี้ที่จะค้ำประกัน เว้นแต่เป็นการค้ำประกันเพื่อกิจการเนื่องกันไปหลายคราวตามมาตรา ๖๙๙ จะไม่ระบุระยะเวลาดังกล่าวก็ได้\nสัญญาค้ำประกันต้องระบุหนี้หรือสัญญาที่ค้ำประกันไว้โดยชัดแจ้ง และผู้ค้ำประกันย่อมรับผิดเฉพาะหนี้หรือสัญญาที่ระบุไว้เท่านั้น\nหนี้อันเกิดแต่สัญญาซึ่งไม่ผูกพันลูกหนี้เพราะทำด้วยความสำคัญผิดหรือเพราะเป็นผู้ไร้ความสามารถนั้นก็อาจจะมีประกันอย่างสมบูรณ์ได้ ถ้าหากว่าผู้ค้ำประกันรู้เหตุสำคัญผิดหรือไร้ความสามารถนั้นในขณะที่เข้าทำสัญญาผูกพันตน"],["681/1","b3t11","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๘๑/๑ ข้อตกลงใดที่กำหนดให้ผู้ค้ำประกันต้องรับผิดอย่างเดียวกับลูกหนี้ร่วมหรือในฐานะเป็นลูกหนี้ร่วม ข้อตกลงนั้นเป็นโมฆะ\nความในวรรคหนึ่ง มิให้ใช้บังคับแก่กรณีผู้ค้ำประกันซึ่งเป็นนิติบุคคลและยินยอมเข้าผูกพันตนเพื่อรับผิดอย่างลูกหนี้ร่วมหรือในฐานะเป็นลูกหนี้ร่วม ในกรณีเช่นนั้นผู้ค้ำประกันซึ่งเป็นนิติบุคคลนั้นย่อมไม่มีสิทธิดังที่บัญญัติไว้ในมาตรา ๖๘๘ มาตรา ๖๘๙ และมาตรา ๖๙๐"],["682","b3t11","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๘๒ ท่านว่าบุคคลจะยอมเข้าเป็นผู้รับเรือน คือเป็นประกันของผู้ค้ำประกันอีกชั้นหนึ่ง ก็เป็นได้\nถ้าบุคคลหลายคนยอมตนเข้าเป็นผู้ค้ำประกันในหนี้รายเดียวกันไซร้ ท่านว่าผู้ค้ำประกันเหล่านั้นมีความรับผิดอย่างลูกหนี้ร่วมกัน แม้ถึงว่าจะมิได้เข้ารับค้ำประกันรวมกัน"],["683","b3t11","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๘๓ อันค้ำประกันอย่างไม่มีจำกัดนั้นย่อมคุ้มถึงดอกเบี้ยและค่าสินไหมทดแทนซึ่งลูกหนี้ค้างชำระ ตลอดจนค่าภาระติดพันอันเป็นอุปกรณ์แห่งหนี้รายนั้นด้วย"],["684","b3t11","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๘๔ ผู้ค้ำประกันย่อมรับผิดเพื่อค่าฤชาธรรมเนียมความซึ่งลูกหนี้จะต้องใช้ให้แก่เจ้าหนี้ แต่ถ้าโจทก์ฟ้องคดีโดยมิได้เรียกให้ผู้ค้ำประกันชำระหนี้นั้นก่อนไซร้ ท่านว่าผู้ค้ำประกันหาต้องรับผิดเพื่อใช้ค่าฤชาธรรมเนียมเช่นนั้นไม่"],["685","b3t11","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๘๕ ถ้าเมื่อบังคับตามสัญญาค้ำประกันนั้น ผู้ค้ำประกันไม่ชำระหนี้ทั้งหมดของลูกหนี้ รวมทั้งดอกเบี้ย ค่าสินไหมทดแทน และอุปกรณ์ด้วยไซร้ หนี้ยังเหลืออยู่เท่าใด ท่านว่าลูกหนี้ยังคงรับผิดต่อเจ้าหนี้ในส่วนที่เหลือนั้น"],["685/1","b3t11","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๖๘๕/๑ บรรดาข้อตกลงเกี่ยวกับการค้ำประกันที่แตกต่างไปจากมาตรา ๖๘๑ วรรคหนึ่ง วรรคสอง และวรรคสาม มาตรา ๖๘๖ มาตรา ๖๙๔ มาตรา ๖๙๘ และมาตรา ๖๙๙ เป็นโมฆะ"],["686","b3t11","หมวด ๒ ผลก่อนชำระหนี้","","มาตรา ๖๘๖ เมื่อลูกหนี้ผิดนัด ให้เจ้าหนี้มีหนังสือบอกกล่าวไปยังผู้ค้ำประกันภายในหกสิบวันนับแต่วันที่ลูกหนี้ผิดนัด และไม่ว่ากรณีจะเป็นประการใดเจ้าหนี้จะเรียกให้ผู้ค้ำประกันชำระหนี้ก่อนที่หนังสือบอกกล่าวจะไปถึงผู้ค้ำประกันมิได้ แต่ไม่ตัดสิทธิผู้ค้ำประกันที่จะชำระหนี้เมื่อหนี้ถึงกำหนดชำระ\nในกรณีที่เจ้าหนี้มิได้มีหนังสือบอกกล่าวภายในกำหนดเวลาตามวรรคหนึ่ง ให้ผู้ค้ำประกันหลุดพ้นจากความรับผิดในดอกเบี้ยและค่าสินไหมทดแทน ตลอดจนค่าภาระติดพันอันเป็นอุปกรณ์แห่งหนี้รายนั้นบรรดาที่เกิดขึ้นภายหลังจากพ้นกำหนดเวลาตามวรรคหนึ่ง\nเมื่อเจ้าหนี้มีสิทธิเรียกให้ผู้ค้ำประกันชำระหนี้หรือผู้ค้ำประกันมีสิทธิชำระหนี้ได้ตามวรรคหนึ่ง ผู้ค้ำประกันอาจชำระหนี้ทั้งหมดหรือใช้สิทธิชำระหนี้ตามเงื่อนไขและวิธีการในการชำระหนี้ที่ลูกหนี้มีอยู่กับเจ้าหนี้ก่อนการผิดนัดชำระหนี้ ทั้งนี้ เฉพาะในส่วนที่ตนต้องรับผิดก็ได้ และให้นำความในมาตรา ๗๐๑ วรรคสอง มาใช้บังคับโดยอนุโลม\nในระหว่างที่ผู้ค้ำประกันชำระหนี้ตามเงื่อนไขและวิธีการในการชำระหนี้ของลูกหนี้ตามวรรคสาม เจ้าหนี้จะเรียกดอกเบี้ยเพิ่มขึ้นเพราะเหตุที่ลูกหนี้ผิดนัดในระหว่างนั้นมิได้\nการชำระหนี้ของผู้ค้ำประกันตามมาตรานี้ ไม่กระทบกระเทือนสิทธิของผู้ค้ำประกันตามมาตรา ๖๙๓"],["687","b3t11","หมวด ๒ ผลก่อนชำระหนี้","","มาตรา ๖๘๗ ผู้ค้ำประกันไม่จำต้องชำระหนี้ก่อนถึงเวลากำหนดที่จะชำระ แม้ถึงว่าลูกหนี้จะไม่อาจถือเอาซึ่งประโยชน์แห่งเงื่อนเวลาเริ่มต้นหรือเวลาสุดสิ้นได้ต่อไปแล้ว"],["688","b3t11","หมวด ๒ ผลก่อนชำระหนี้","","มาตรา ๖๘๘ เมื่อเจ้าหนี้ทวงให้ผู้ค้ำประกันชำระหนี้ ผู้ค้ำประกันจะขอให้เรียกลูกหนี้ชำระก่อนก็ได้ เว้นแต่ลูกหนี้จะถูกศาลพิพากษาให้เป็นคนล้มละลายเสียแล้ว หรือไม่ปรากฏว่าลูกหนี้ไปอยู่แห่งใดในพระราชอาณาเขต"],["689","b3t11","หมวด ๒ ผลก่อนชำระหนี้","","มาตรา ๖๘๙ ถึงแม้จะได้เรียกให้ลูกหนี้ชำระหนี้ดังกล่าวมาในมาตราก่อนนั้นแล้วก็ตาม ถ้าผู้ค้ำประกันพิสูจน์ได้ว่าลูกหนี้นั้นมีทางที่จะชำระหนี้ได้ และการที่จะบังคับให้ลูกหนี้ชำระหนี้นั้นจะไม่เป็นการยากไซร้ ท่านว่าเจ้าหนี้จะต้องบังคับการชำระหนี้รายนั้นเอาจากทรัพย์สินของลูกหนี้ก่อน"],["690","b3t11","หมวด ๒ ผลก่อนชำระหนี้","","มาตรา ๖๙๐ ถ้าเจ้าหนี้มีทรัพย์ของลูกหนี้ยึดถือไว้เป็นประกันไซร้ เมื่อผู้ค้ำประกันร้องขอ ท่านว่าเจ้าหนี้จะต้องให้ชำระหนี้เอาจากทรัพย์ซึ่งเป็นประกันนั้นก่อน"],["691","b3t11","หมวด ๒ ผลก่อนชำระหนี้","","มาตรา ๖๙๑ ในกรณีที่เจ้าหนี้ตกลงกับลูกหนี้ อันมีผลเป็นการลดจำนวนหนี้ที่มีการค้ำประกันรวมทั้งดอกเบี้ย ค่าสินไหมทดแทน หรือค่าภาระติดพันอันเป็นอุปกรณ์แห่งหนี้รายนั้น ให้เจ้าหนี้มีหนังสือแจ้งให้ผู้ค้ำประกันทราบถึงข้อตกลงดังกล่าวภายในหกสิบวันนับแต่วันที่ตกลงกันนั้น ถ้าลูกหนี้ได้ชำระหนี้ตามที่ได้ลดแล้วก็ดี ลูกหนี้ชำระหนี้ตามที่ได้ลดไม่ครบถ้วนแต่ผู้ค้ำประกันได้ชำระหนี้ส่วนที่เหลือนั้นแล้วก็ดี หรือลูกหนี้ไม่ชำระหนี้ตามที่ได้ลดแต่ผู้ค้ำประกันได้ชำระหนี้ตามที่ได้ลดนั้นแล้วก็ดี ให้ผู้ค้ำประกันเป็นอันหลุดพ้นจากการค้ำประกัน ในการชำระหนี้ของผู้ค้ำประกันดังกล่าว ผู้ค้ำประกันมีสิทธิชำระหนี้ได้แม้จะล่วงเลยกำหนดเวลาชำระหนี้ตามที่ได้ลดแต่ต้องไม่เกินหกสิบวันนับแต่วันที่ครบกำหนดเวลาชำระหนี้ดังกล่าว ในกรณีที่เจ้าหนี้มีหนังสือแจ้งให้ผู้ค้ำประกันทราบถึงข้อตกลงดังกล่าวเมื่อล่วงเลยกำหนดเวลาชำระหนี้ตามที่ได้ลดแล้ว ให้ผู้ค้ำประกันมีสิทธิชำระหนี้ได้ภายในหกสิบวันนับแต่วันที่เจ้าหนี้มีหนังสือแจ้งให้ผู้ค้ำประกันทราบถึงข้อตกลงนั้น ทั้งนี้ ข้อตกลงที่ทำขึ้นภายหลังที่ลูกหนี้ผิดนัดชำระหนี้แล้ว หากในข้อตกลงนั้นมีการขยายเวลาชำระหนี้ให้แก่ลูกหนี้ มิให้ถือว่าเป็นการผ่อนเวลาตามมาตรา ๗๐๐\nข้อตกลงใดที่มีผลเป็นการเพิ่มภาระแก่ผู้ค้ำประกันให้มากกว่าที่บัญญัติไว้ในวรรคหนึ่ง ข้อตกลงนั้นเป็นโมฆะ"],["692","b3t11","หมวด ๒ ผลก่อนชำระหนี้","","มาตรา ๖๙๒ อายุความสะดุดหยุดลงเป็นโทษแก่ลูกหนี้นั้น ย่อมเป็นโทษแก่ผู้ค้ำประกันด้วย"],["693","b3t11","หมวด ๓ ผลภายหลังชำระหนี้","","มาตรา ๖๙๓ ผู้ค้ำประกันซึ่งได้ชำระหนี้แล้ว ย่อมมีสิทธิที่จะไล่เบี้ยเอาจากลูกหนี้ เพื่อต้นเงินกับดอกเบี้ยและเพื่อการที่ต้องสูญหายหรือเสียหายไปอย่างใด ๆ เพราะการค้ำประกันนั้น\nอนึ่ง ผู้ค้ำประกันย่อมเข้ารับช่วงสิทธิของเจ้าหนี้บรรดามีเหนือลูกหนี้ด้วย"],["694","b3t11","หมวด ๓ ผลภายหลังชำระหนี้","","มาตรา ๖๙๔ นอกจากข้อต่อสู้ซึ่งผู้ค้ำประกันมีต่อเจ้าหนี้นั้น ท่านว่าผู้ค้ำประกันยังอาจยกข้อต่อสู้ทั้งหลายซึ่งลูกหนี้มีต่อเจ้าหนี้ขึ้นต่อสู้ได้ด้วย"],["695","b3t11","หมวด ๓ ผลภายหลังชำระหนี้","","มาตรา ๖๙๕ ผู้ค้ำประกันซึ่งละเลยไม่ยกข้อต่อสู้ของลูกหนี้ขึ้นต่อสู้เจ้าหนี้นั้น ท่านว่าย่อมสิ้นสิทธิที่จะไล่เบี้ยเอาแก่ลูกหนี้เพียงเท่าที่ไม่ยกขึ้นเป็นข้อต่อสู้ เว้นแต่จะพิสูจน์ได้ว่าตนมิได้รู้ว่ามีข้อต่อสู้เช่นนั้น และที่ไม่รู้นั้นมิได้เป็นเพราะความผิดของตนด้วย"],["696","b3t11","หมวด ๓ ผลภายหลังชำระหนี้","","มาตรา ๖๙๖ ผู้ค้ำประกันไม่มีสิทธิจะไล่เบี้ยเอาแก่ลูกหนี้ได้ ถ้าว่าตนได้ชำระหนี้แทนไปโดยมิได้บอกลูกหนี้ และลูกหนี้ยังมิรู้ความมาชำระหนี้ซ้ำอีก\nในกรณีเช่นว่านี้ ผู้ค้ำประกันก็ได้แต่เพียงจะฟ้องเจ้าหนี้เพื่อคืนลาภมิควรได้เท่านั้น"],["697","b3t11","หมวด ๓ ผลภายหลังชำระหนี้","","มาตรา ๖๙๗ ถ้าเพราะการกระทำอย่างใดอย่างหนึ่งของเจ้าหนี้เอง เป็นเหตุให้ผู้ค้ำประกันไม่อาจเข้ารับช่วงได้ทั้งหมดหรือแต่บางส่วนในสิทธิก็ดี จำนองก็ดี จำนำก็ดี และบุริมสิทธิอันได้ให้ไว้แก่เจ้าหนี้แต่ก่อนหรือในขณะทำสัญญาค้ำประกันเพื่อชำระหนี้นั้น ท่านว่าผู้ค้ำประกันย่อมหลุดพ้นจากความรับผิดเพียงเท่าที่ตนต้องเสียหายเพราะการนั้น"],["698","b3t11","หมวด ๔ ความระงับสิ้นไปแห่งการค้ำประกัน","","มาตรา ๖๙๘ อันผู้ค้ำประกันย่อมหลุดพ้นจากความรับผิด ในขณะเมื่อหนี้ของลูกหนี้ระงับสิ้นไปไม่ว่าเพราะเหตุใด ๆ"],["699","b3t11","หมวด ๔ ความระงับสิ้นไปแห่งการค้ำประกัน","","มาตรา ๖๙๙ การค้ำประกันเพื่อกิจการเนื่องกันไปหลายคราวไม่มีจำกัดเวลาเป็นคุณแก่เจ้าหนี้นั้น ท่านว่าผู้ค้ำประกันอาจเลิกเสียเพื่อคราวอันเป็นอนาคตได้ โดยบอกกล่าวความประสงค์นั้นแก่เจ้าหนี้\nในกรณีเช่นนี้ ท่านว่าผู้ค้ำประกันไม่ต้องรับผิดในกิจการที่ลูกหนี้กระทำลงภายหลังคำบอกกล่าวนั้นได้ไปถึงเจ้าหนี้"],["700","b3t11","หมวด ๔ ความระงับสิ้นไปแห่งการค้ำประกัน","","มาตรา ๗๐๐ ถ้าค้ำประกันหนี้อันจะต้องชำระ ณ เวลามีกำหนดแน่นอนและเจ้าหนี้ยอมผ่อนเวลาให้แก่ลูกหนี้ ผู้ค้ำประกันย่อมหลุดพ้นจากความรับผิด เว้นแต่ผู้ค้ำประกันจะได้ตกลงด้วยในการผ่อนเวลานั้น\nข้อตกลงที่ผู้ค้ำประกันทำไว้ล่วงหน้าก่อนเจ้าหนี้ผ่อนเวลาอันมีผลเป็นการยินยอมให้เจ้าหนี้ผ่อนเวลา ข้อตกลงนั้นใช้บังคับมิได้\nความในวรรคสอง มิให้ใช้บังคับแก่กรณีผู้ค้ำประกันซึ่งเป็นสถาบันการเงินหรือค้ำประกันเพื่อสินจ้างเป็นปกติธุระ"],["701","b3t11","หมวด ๔ ความระงับสิ้นไปแห่งการค้ำประกัน","","มาตรา ๗๐๑ ผู้ค้ำประกันจะขอชำระหนี้แก่เจ้าหนี้ตั้งแต่เมื่อถึงกำหนดชำระก็ได้\nถ้าเจ้าหนี้ไม่ยอมรับชำระหนี้ ผู้ค้ำประกันก็เป็นอันหลุดพ้นจากความรับผิด"],["702","b3t12","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๐๒ อันว่าจำนองนั้น คือสัญญาซึ่งบุคคลคนหนึ่ง เรียกว่าผู้จำนอง เอาทรัพย์สินตราไว้แก่บุคคลอีกคนหนึ่ง เรียกว่าผู้รับจำนอง เป็นประกันการชำระหนี้ โดยไม่ส่งมอบทรัพย์สินนั้นให้แก่ผู้รับจำนอง\nผู้รับจำนองชอบที่จะได้รับชำระหนี้จากทรัพย์สินที่จำนองก่อนเจ้าหนี้สามัญ มิพักต้องพิเคราะห์ว่ากรรมสิทธิ์ในทรัพย์สินจะได้โอนไปยังบุคคลภายนอกแล้วหรือหาไม่"],["703","b3t12","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๐๓ อันอสังหาริมทรัพย์นั้นอาจจำนองได้ไม่ว่าประเภทใด ๆ\nสังหาริมทรัพย์อันจะกล่าวต่อไปนี้ก็อาจจำนองได้ดุจกัน หากว่าได้จดทะเบียนไว้แล้วตามกฎหมาย คือ\n(๑) เรือมีระวางตั้งแต่ห้าตันขึ้นไป\n(๒) แพ\n(๓) สัตว์พาหนะ\n(๔) สังหาริมทรัพย์อื่นใด ๆ ซึ่งกฎหมายหากบัญญัติไว้ให้จดทะเบียนเฉพาะการ"],["704","b3t12","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๐๔ สัญญาจำนองต้องระบุทรัพย์สินซึ่งจำนอง"],["705","b3t12","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๐๕ การจำนองทรัพย์สินนั้น นอกจากผู้เป็นเจ้าของในขณะนั้นแล้ว ท่านว่าใครอื่นจะจำนองหาได้ไม่"],["706","b3t12","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๐๖ บุคคลมีกรรมสิทธิ์ในทรัพย์สินแต่ภายในบังคับเงื่อนไขเช่นใด จะจำนองทรัพย์สินนั้นได้แต่ภายในบังคับเงื่อนไขเช่นนั้น"],["707","b3t12","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๐๗ บทบัญญัติมาตรา ๖๘๑ ว่าด้วยค้ำประกันนั้น ท่านให้ใช้ได้ในการจำนอง อนุโลมตามควร"],["708","b3t12","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๐๘ สัญญาจำนองนั้นต้องมีจำนวนเงินระบุไว้เป็นเรือนเงินไทยเป็นจำนวนแน่ตรงตัว หรือจำนวนขั้นสูงสุดที่ได้เอาทรัพย์สินจำนองนั้นตราไว้เป็นประกัน"],["709","b3t12","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๐๙ บุคคลหนึ่งจะจำนองทรัพย์สินของตนไว้เพื่อประกันหนี้อันบุคคลอื่นจะต้องชำระ ก็ให้ทำได้"],["710","b3t12","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๑๐ ทรัพย์สินหลายสิ่งมีเจ้าของคนเดียวหรือหลายคน จะจำนองเพื่อประกันการชำระหนี้แต่รายหนึ่งรายเดียว ท่านก็ให้ทำได้\nและในการนี้คู่สัญญาจะตกลงกันดังต่อไปนี้ก็ได้ คือว่า\n(๑) ให้ผู้รับจำนองใช้สิทธิบังคับเอาแก่ทรัพย์สินซึ่งจำนองตามลำดับอันระบุไว้\n(๒) ให้ถือเอาทรัพย์สินแต่ละสิ่งเป็นประกันหนี้เฉพาะแต่ส่วนหนึ่งส่วนใดที่ระบุไว้"],["711","b3t12","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๑๑ การที่จะตกลงกันไว้เสียแต่ก่อนเวลาหนี้ถึงกำหนดชำระเป็นข้อความอย่างใดอย่างหนึ่งว่า ถ้าไม่ชำระหนี้ ให้ผู้รับจำนองเข้าเป็นเจ้าของทรัพย์สินซึ่งจำนอง หรือว่าให้จัดการแก่ทรัพย์สินนั้นเป็นประการอื่นอย่างใด นอกจากตามบทบัญญัติทั้งหลายว่าด้วยการบังคับจำนองนั้นไซร้ ข้อตกลงเช่นนั้นท่านว่าไม่สมบูรณ์"],["712","b3t12","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๑๒ แม้ถึงว่ามีข้อสัญญาเป็นอย่างอื่นก็ตาม ทรัพย์สินซึ่งจำนองไว้แก่บุคคลหนึ่งนั้น ท่านว่าจะเอาไปจำนองแก่บุคคลอีกคนหนึ่งในระหว่างเวลาที่สัญญาก่อนยังมีอายุอยู่ก็ได้"],["713","b3t12","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๑๓ ถ้ามิได้ตกลงกันไว้เป็นอย่างอื่นในสัญญาจำนอง ท่านว่าผู้จำนองจะชำระหนี้ล้างจำนองเป็นงวด ๆ ก็ได้"],["714","b3t12","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๑๔ อันสัญญาจำนองนั้น ท่านว่าต้องทำเป็นหนังสือและจดทะเบียนต่อพนักงานเจ้าหน้าที่"],["714/1","b3t12","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๑๔/๑ บรรดาข้อตกลงเกี่ยวกับการจำนองที่แตกต่างไปจากมาตรา ๗๒๘ มาตรา ๗๒๙ และมาตรา ๗๓๕ เป็นโมฆะ"],["715","b3t12","หมวด ๒ สิทธิจำนองครอบเพียงใด","","มาตรา ๗๑๕ ทรัพย์สินซึ่งจำนองย่อมเป็นประกันเพื่อการชำระหนี้กับทั้งค่าอุปกรณ์ต่อไปนี้ด้วย คือ\n(๑) ดอกเบี้ย\n(๒) ค่าสินไหมทดแทนในการไม่ชำระหนี้\n(๓) ค่าฤชาธรรมเนียมในการบังคับจำนอง"],["716","b3t12","หมวด ๒ สิทธิจำนองครอบเพียงใด","","มาตรา ๗๑๖ จำนองย่อมครอบไปถึงบรรดาทรัพย์สินซึ่งจำนองหมดทุกสิ่ง แม้จะได้ชำระหนี้แล้วบางส่วน"],["717","b3t12","หมวด ๒ สิทธิจำนองครอบเพียงใด","","มาตรา ๗๑๗ แม้ว่าทรัพย์สินซึ่งจำนองจะแบ่งออกเป็นหลายส่วนก็ตาม ท่านว่าจำนองก็ยังคงครอบไปถึงส่วนเหล่านั้นหมดทุกส่วนด้วยกันอยู่นั่นเอง\nถึงกระนั้นก็ดี ถ้าผู้รับจำนองยินยอมด้วย ท่านว่าจะโอนทรัพย์สินส่วนหนึ่งส่วนใดไปปลอดจากจำนองก็ให้ทำได้ แต่ความยินยอมดังว่านี้ หากมิได้จดทะเบียน ท่านว่าจะยกเอาขึ้นเป็นข้อต่อสู้แก่บุคคลภายนอกหาได้ไม่"],["718","b3t12","หมวด ๒ สิทธิจำนองครอบเพียงใด","","มาตรา ๗๑๘ จำนองย่อมครอบไปถึงทรัพย์ทั้งปวงอันติดพันอยู่กับทรัพย์สินซึ่งจำนอง แต่ต้องอยู่ภายในบังคับซึ่งท่านจำกัดไว้ในสามมาตราต่อไปนี้"],["719","b3t12","หมวด ๒ สิทธิจำนองครอบเพียงใด","","มาตรา ๗๑๙ จำนองที่ดินไม่ครอบไปถึงเรือนโรงอันผู้จำนองปลูกสร้างลงในที่ดินภายหลังวันจำนอง เว้นแต่จะมีข้อความกล่าวไว้โดยเฉพาะในสัญญาว่าให้ครอบไปถึง\nแต่กระนั้นก็ดี ผู้รับจำนองจะให้ขายเรือนโรงนั้นรวมไปกับที่ดินด้วยก็ได้ แต่ผู้รับจำนองอาจใช้บุริมสิทธิของตนได้เพียงแก่ราคาที่ดินเท่านั้น"],["720","b3t12","หมวด ๒ สิทธิจำนองครอบเพียงใด","","มาตรา ๗๒๐ จำนองเรือนโรงหรือสิ่งปลูกสร้างอย่างอื่นซึ่งได้ทำขึ้นไว้บนดินหรือใต้ดิน ในที่ดินอันเป็นของคนอื่นเขานั้นย่อมไม่ครอบไปถึงที่ดินนั้นด้วย ฉันใดกลับกันก็ฉันนั้น"],["721","b3t12","หมวด ๒ สิทธิจำนองครอบเพียงใด","","มาตรา ๗๒๑ จำนองไม่ครอบไปถึงดอกผลแห่งทรัพย์สินซึ่งจำนอง เว้นแต่ในเมื่อผู้รับจำนองได้บอกกล่าวแก่ผู้จำนองหรือผู้รับโอนแล้วว่าตนจำนงจะบังคับจำนอง"],["722","b3t12","หมวด ๓ สิทธิและหน้าที่ของผู้รับจำนองและผู้จำนอง","","มาตรา ๗๒๒ ถ้าทรัพย์สินได้จำนองแล้ว และภายหลังที่จดทะเบียนจำนองมีจดทะเบียนภาระจำยอมหรือทรัพยสิทธิอย่างอื่น โดยผู้รับจำนองมิได้ยินยอมด้วยไซร้ ท่านว่าสิทธิจำนองย่อมเป็นใหญ่กว่าภาระจำยอมหรือทรัพยสิทธิอย่างอื่นนั้น หากว่าเป็นที่เสื่อมเสียแก่สิทธิของผู้รับจำนองในเวลาบังคับจำนอง ก็ให้ลบสิทธิที่กล่าวหลังนั้นเสียจากทะเบียน"],["723","b3t12","หมวด ๓ สิทธิและหน้าที่ของผู้รับจำนองและผู้จำนอง","","มาตรา ๗๒๓ ถ้าทรัพย์สินซึ่งจำนองบุบสลาย หรือถ้าทรัพย์สินซึ่งจำนองแต่สิ่งใดสิ่งหนึ่งสูญหายหรือบุบสลาย เป็นเหตุให้ไม่เพียงพอแก่การประกันไซร้ ท่านว่าผู้รับจำนองจะบังคับจำนองเสียในทันทีก็ได้ เว้นแต่เมื่อเหตุนั้นมิได้เป็นเพราะความผิดของผู้จำนอง และผู้จำนองก็เสนอจะจำนองทรัพย์สินอื่นแทนให้มีราคาเพียงพอ หรือเสนอจะรับซ่อมแซมแก้ไขความบุบสลายนั้นภายในเวลาอันสมควรแก่เหตุ"],["724","b3t12","หมวด ๓ สิทธิและหน้าที่ของผู้รับจำนองและผู้จำนอง","","มาตรา ๗๒๔ ผู้จำนองใดได้จำนองทรัพย์สินของตนไว้เพื่อประกันหนี้อันบุคคลอื่นจะต้องชำระแล้ว และเข้าชำระหนี้เสียเองแทนลูกหนี้เพื่อจะปัดป้องมิให้ต้องบังคับจำนอง ท่านว่าผู้จำนองนั้นชอบที่จะได้รับเงินใช้คืนจากลูกหนี้ตามจำนวนที่ตนได้ชำระไป\nถ้าว่าต้องบังคับจำนอง ท่านว่าผู้จำนองชอบที่จะได้รับเงินใช้คืนจากลูกหนี้ตามจำนวนซึ่งผู้รับจำนองจะได้รับใช้หนี้จากการบังคับจำนองนั้น"],["725","b3t12","หมวด ๓ สิทธิและหน้าที่ของผู้รับจำนองและผู้จำนอง","","มาตรา ๗๒๕ เมื่อบุคคลสองคนหรือกว่านั้นต่างได้จำนองทรัพย์สินแห่งตนเพื่อประกันหนี้แต่รายหนึ่งรายเดียวอันบุคคลอื่นจะต้องชำระและมิได้ระบุลำดับไว้ไซร้ ท่านว่าผู้จำนองซึ่งได้เป็นผู้ชำระหนี้ หรือเป็นเจ้าของทรัพย์สินซึ่งต้องบังคับจำนองนั้นหามีสิทธิจะไล่เบี้ยเอาแก่ผู้จำนองอื่น ๆ ต่อไปได้ไม่"],["726","b3t12","หมวด ๓ สิทธิและหน้าที่ของผู้รับจำนองและผู้จำนอง","","มาตรา ๗๒๖ เมื่อบุคคลหลายคนต่างได้จำนองทรัพย์สินแห่งตนเพื่อประกันหนี้แต่รายหนึ่งรายเดียวอันบุคคลอื่นจะต้องชำระและได้ระบุลำดับไว้ด้วยไซร้ ท่านว่าการที่ผู้รับจำนองยอมปลดหนี้ให้แก่ผู้จำนองคนหนึ่งนั้น ย่อมทำให้ผู้จำนองคนหลัง ๆ ได้หลุดพ้นด้วยเพียงขนาดที่เขาต้องรับความเสียหายแต่การนั้น"],["727","b3t12","หมวด ๓ สิทธิและหน้าที่ของผู้รับจำนองและผู้จำนอง","","มาตรา ๗๒๗ ให้นำบทบัญญัติมาตรา ๖๙๑ มาตรา ๖๙๗ มาตรา ๗๐๐ และมาตรา ๗๐๑ มาใช้บังคับกับกรณีที่บุคคลจำนองทรัพย์สินเพื่อประกันหนี้อันบุคคลอื่นจะต้องชำระด้วยโดยอนุโลม"],["727/1","b3t12","หมวด ๓ สิทธิและหน้าที่ของผู้รับจำนองและผู้จำนอง","","มาตรา ๗๒๗/๑ ไม่ว่ากรณีจะเป็นประการใด ผู้จำนองซึ่งจำนองทรัพย์สินของตนไว้เพื่อประกันหนี้อันบุคคลอื่นจะต้องชำระ ไม่ต้องรับผิดในหนี้นั้นเกินราคาทรัพย์สินที่จำนองในเวลาที่บังคับจำนองหรือเอาทรัพย์จำนองหลุด\nข้อตกลงใดอันมีผลให้ผู้จำนองรับผิดเกินที่บัญญัติไว้ในวรรคหนึ่ง หรือให้ผู้จำนองรับผิดอย่างผู้ค้ำประกัน ข้อตกลงนั้นเป็นโมฆะ ไม่ว่าข้อตกลงนั้นจะมีอยู่ในสัญญาจำนองหรือทำเป็นข้อตกลงต่างหาก ทั้งนี้ เว้นแต่เป็นกรณีที่นิติบุคคลเป็นลูกหนี้และบุคคลผู้มีอำนาจในการจัดการตามกฎหมายหรือบุคคลที่มีอำนาจควบคุมการดำเนินงานของนิติบุคคลนั้นเป็นผู้จำนองทรัพย์สินของตนไว้เพื่อประกันหนี้นั้นของนิติบุคคลและผู้จำนองได้ทำสัญญาค้ำประกันไว้เป็นสัญญาต่างหาก"],["728","b3t12","หมวด ๔ การบังคับจำนอง","","มาตรา ๗๒๘ เมื่อจะบังคับจำนองนั้น ผู้รับจำนองต้องมีหนังสือบอกกล่าวไปยังลูกหนี้ก่อนว่าให้ชำระหนี้ภายในเวลาอันสมควรซึ่งต้องไม่น้อยกว่าหกสิบวันนับแต่วันที่ลูกหนี้ได้รับคำบอกกล่าวนั้น ถ้าและลูกหนี้ละเลยเสียไม่ปฏิบัติตามคำบอกกล่าว ผู้รับจำนองจะฟ้องคดีต่อศาลเพื่อให้พิพากษาสั่งให้ยึดทรัพย์สินซึ่งจำนองและให้ขายทอดตลาดก็ได้\nในกรณีตามวรรคหนึ่ง ถ้าเป็นกรณีผู้จำนองซึ่งจำนองทรัพย์สินของตนไว้เพื่อประกันหนี้อันบุคคลอื่นต้องชำระ ผู้รับจำนองต้องส่งหนังสือบอกกล่าวดังกล่าวให้ผู้จำนองทราบภายในสิบห้าวันนับแต่วันที่ส่งหนังสือแจ้งให้ลูกหนี้ทราบ ถ้าผู้รับจำนองมิได้ดำเนินการภายในกำหนดเวลาสิบห้าวันนั้น ให้ผู้จำนองเช่นว่านั้นหลุดพ้นจากความรับผิดในดอกเบี้ยและค่าสินไหมทดแทนซึ่งลูกหนี้ค้างชำระ ตลอดจนค่าภาระติดพันอันเป็นอุปกรณ์แห่งหนี้รายนั้นบรรดาที่เกิดขึ้นนับแต่วันที่พ้นกำหนดเวลาสิบห้าวันดังกล่าว"],["729","b3t12","หมวด ๔ การบังคับจำนอง","","มาตรา ๗๒๙ ในการบังคับจำนองตามมาตรา ๗๒๘ ถ้าไม่มีการจำนองรายอื่นหรือบุริมสิทธิอื่นอันได้จดทะเบียนไว้เหนือทรัพย์สินอันเดียวกันนี้ ผู้รับจำนองจะฟ้องคดีต่อศาลเพื่อเรียกเอาทรัพย์จำนองหลุดภายในบังคับแห่งเงื่อนไขดังจะกล่าวต่อไปนี้แทนการขายทอดตลาดก็ได้\n(๑) ลูกหนี้ได้ขาดส่งดอกเบี้ยมาแล้วเป็นเวลาถึงห้าปี และ\n(๒) ผู้รับจำนองแสดงให้เป็นที่พอใจแก่ศาลว่าราคาทรัพย์สินนั้นน้อยกว่าจำนวนเงินอันค้างชำระ"],["729/1","b3t12","หมวด ๔ การบังคับจำนอง","","มาตรา ๗๒๙/๑ เวลาใด ๆ หลังจากที่หนี้ถึงกำหนดชำระ ถ้าไม่มีการจำนองรายอื่นหรือบุริมสิทธิอื่นอันได้จดทะเบียนไว้เหนือทรัพย์สินอันเดียวกันนี้ ผู้จำนองมีสิทธิแจ้งเป็นหนังสือไปยังผู้รับจำนองเพื่อให้ผู้รับจำนองดำเนินการให้มีการขายทอดตลาดทรัพย์สินที่จำนองโดยไม่ต้องฟ้องเป็นคดีต่อศาล โดยผู้รับจำนองต้องดำเนินการขายทอดตลาดทรัพย์สินที่จำนองภายในเวลาหนึ่งปีนับแต่วันที่ได้รับหนังสือแจ้งนั้น ทั้งนี้ ให้ถือว่าหนังสือแจ้งของผู้จำนองเป็นหนังสือยินยอมให้ขายทอดตลาด\nในกรณีที่ผู้รับจำนองไม่ได้ดำเนินการขายทอดตลาดทรัพย์สินที่จำนองภายในระยะเวลาที่กำหนดไว้ในวรรคหนึ่ง ให้ผู้จำนองพ้นจากความรับผิดในดอกเบี้ยและค่าสินไหมทดแทนซึ่งลูกหนี้ค้างชำระ ตลอดจนค่าภาระติดพันอันเป็นอุปกรณ์แห่งหนี้รายนั้นบรรดาที่เกิดขึ้นภายหลังวันที่พ้นกำหนดเวลาดังกล่าว\nเมื่อผู้รับจำนองขายทอดตลาดทรัพย์สินที่จำนองได้เงินสุทธิจำนวนเท่าใด ผู้รับจำนองต้องจัดสรรชำระหนี้และอุปกรณ์ให้เสร็จสิ้นไป ถ้ายังมีเงินเหลือก็ต้องส่งคืนให้แก่ผู้จำนอง หรือแก่บุคคลผู้ควรจะได้เงินนั้น แต่ถ้าได้เงินน้อยกว่าจำนวนที่ค้างชำระ ให้เป็นไปตามที่กำหนดไว้ในมาตรา ๗๓๓ และในกรณีที่ผู้จำนองเป็นบุคคลซึ่งจำนองทรัพย์สินเพื่อประกันหนี้อันบุคคลอื่นจะต้องชำระ ผู้จำนองย่อมรับผิดเพียงเท่าที่มาตรา ๗๒๗/๑ กำหนดไว้"],["730","b3t12","หมวด ๔ การบังคับจำนอง","","มาตรา ๗๓๐ เมื่อทรัพย์สินอันหนึ่งอันเดียวได้จำนองแก่ผู้รับจำนองหลายคนด้วยกัน ท่านให้ถือลำดับผู้รับจำนองเรียงตามวันและเวลาจดทะเบียน และผู้รับจำนองคนก่อนจักได้รับใช้หนี้ก่อนผู้รับจำนองคนหลัง"],["731","b3t12","หมวด ๔ การบังคับจำนอง","","มาตรา ๗๓๑ อันผู้รับจำนองคนหลังจะบังคับตามสิทธิของตนให้เสียหายแก่ผู้รับจำนองคนก่อนนั้น ท่านว่าหาอาจทำได้ไม่"],["732","b3t12","หมวด ๔ การบังคับจำนอง","","มาตรา ๗๓๒ ทรัพย์สินซึ่งจำนองขายทอดตลาดได้เงินเป็นจำนวนสุทธิเท่าใด ท่านให้จัดใช้แก่ผู้รับจำนองเรียงตามลำดับ และถ้ายังมีเงินเหลืออยู่อีก ก็ให้ส่งมอบแก่ผู้จำนอง"],["733","b3t12","หมวด ๔ การบังคับจำนอง","","มาตรา ๗๓๓ ถ้าเอาทรัพย์จำนองหลุดและราคาทรัพย์สินนั้นมีประมาณต่ำกว่าจำนวนเงินที่ค้างชำระกันอยู่ก็ดี หรือถ้าเอาทรัพย์สินซึ่งจำนองออกขายทอดตลาดใช้หนี้ได้เงินจำนวนสุทธิน้อยกว่าจำนวนเงินที่ค้างชำระกันอยู่นั้นก็ดี เงินยังขาดจำนวนอยู่เท่าใดลูกหนี้ไม่ต้องรับผิดในเงินนั้น"],["734","b3t12","หมวด ๔ การบังคับจำนอง","","มาตรา ๗๓๔ ถ้าจำนองทรัพย์สินหลายสิ่งเพื่อประกันหนี้แต่รายหนึ่งรายเดียวและมิได้ระบุลำดับไว้ไซร้ ท่านว่าผู้รับจำนองจะใช้สิทธิของตนบังคับแก่ทรัพย์สินนั้น ๆ ทั้งหมดหรือแต่เพียงบางสิ่งก็ได้ แต่ท่านห้ามมิให้ทำเช่นนั้นแก่ทรัพย์สินมากสิ่งกว่าที่จำเป็นเพื่อใช้หนี้ตามสิทธิแห่งตน\nถ้าผู้รับจำนองใช้สิทธิของตนบังคับแก่ทรัพย์สินทั้งหมดพร้อมกัน ท่านให้แบ่งภาระแห่งหนี้นั้นกระจายไปตามส่วนราคาแห่งทรัพย์สินนั้น ๆ เว้นแต่ในกรณีที่ได้ระบุจำนวนเงินจำนองไว้เฉพาะทรัพย์สินแต่ละสิ่ง ๆ เป็นจำนวนเท่าใด ท่านให้แบ่งกระจายไปตามจำนวนเงินจำนองที่ระบุไว้เฉพาะทรัพย์สิ่งนั้น ๆ\nแต่ถ้าผู้รับจำนองใช้สิทธิของตนบังคับแก่ทรัพย์สินอันใดอันหนึ่งแต่เพียงสิ่งเดียวไซร้ ผู้รับจำนองจะให้ชำระหนี้อันเป็นส่วนของตนทั้งหมดจากทรัพย์สินอันนั้นก็ได้ ในกรณีเช่นนั้น ท่านให้ถือว่าผู้รับจำนองคนถัดไปโดยลำดับย่อมเข้ารับช่วงสิทธิของผู้รับจำนองคนก่อนและจะเข้าบังคับจำนองแทนที่คนก่อนก็ได้แต่เพียงเท่าจำนวนซึ่งผู้รับจำนองคนก่อนจะพึงได้รับจากทรัพย์สินอื่น ๆ ตามบทบัญญัติดังกล่าวมาในวรรคก่อนนั้น"],["735","b3t12","หมวด ๔ การบังคับจำนอง","","มาตรา ๗๓๕ เมื่อผู้รับจำนองคนใดจะบังคับจำนองเอาแก่ผู้รับโอนทรัพย์สินซึ่งจำนอง ผู้รับจำนองต้องมีจดหมายบอกกล่าวแก่ผู้รับโอนล่วงหน้าเป็นระยะเวลาไม่น้อยกว่าหกสิบวันก่อน จึงจะบังคับจำนองได้"],["736","b3t12","หมวด ๕ สิทธิและหน้าที่ของผู้รับโอนทรัพย์สินซึ่งจำนอง","","มาตรา ๗๓๖ ผู้รับโอนทรัพย์สินซึ่งจำนองจะไถ่ถอนจำนองก็ได้ ถ้าหากมิได้เป็นตัวลูกหนี้หรือผู้ค้ำประกัน หรือเป็นทายาทของลูกหนี้หรือผู้ค้ำประกัน"],["737","b3t12","หมวด ๕ สิทธิและหน้าที่ของผู้รับโอนทรัพย์สินซึ่งจำนอง","","มาตรา ๗๓๗ ผู้รับโอนจะไถ่ถอนจำนองเมื่อใดก็ได้ แต่ถ้าผู้รับจำนองได้บอกกล่าวว่าจะบังคับจำนอง ผู้รับโอนต้องไถ่ถอนจำนองภายในหกสิบวันนับแต่วันรับคำบอกกล่าว"],["738","b3t12","หมวด ๕ สิทธิและหน้าที่ของผู้รับโอนทรัพย์สินซึ่งจำนอง","","มาตรา ๗๓๘ ผู้รับโอนซึ่งประสงค์จะไถ่ถอนจำนองต้องบอกกล่าวความประสงค์นั้นแก่ผู้เป็นลูกหนี้ชั้นต้น และต้องส่งคำเสนอไปยังบรรดาเจ้าหนี้ที่ได้จดทะเบียน ไม่ว่าในทางจำนองหรือประการอื่น ว่าจะรับใช้เงินให้เป็นจำนวนอันสมควรกับราคาทรัพย์สินนั้น\nคำเสนอนั้นให้แจ้งข้อความทั้งหลายต่อไปนี้ คือ\n(๑) ตำแหน่งแหล่งที่และลักษณะแห่งทรัพย์สินซึ่งจำนอง\n(๒) วันซึ่งโอนกรรมสิทธิ์\n(๓) ชื่อเจ้าของเดิม\n(๔) ชื่อและภูมิลำเนาของผู้รับโอน\n(๕) จำนวนเงินที่เสนอว่าจะใช้\n(๖) คำนวณยอดจำนวนเงินที่ค้างชำระแก่เจ้าหนี้คนหนึ่ง ๆ รวมทั้งอุปกรณ์และจำนวนเงินที่จะจัดเป็นส่วนใช้แก่บรรดาเจ้าหนี้ตามลำดับกัน\nอนึ่ง ให้คัดสำเนารายงานจดทะเบียนของเจ้าพนักงานในเรื่องทรัพย์สินซึ่งจำนองนั้น อันเจ้าพนักงานรับรองว่าเป็นสำเนาถูกถ้วนสอดส่งไปด้วย"],["739","b3t12","หมวด ๕ สิทธิและหน้าที่ของผู้รับโอนทรัพย์สินซึ่งจำนอง","","มาตรา ๗๓๙ ถ้าเจ้าหนี้คนหนึ่งคนใดไม่ยอมรับคำเสนอ เจ้าหนี้คนนั้นต้องฟ้องคดีต่อศาลภายในเดือนหนึ่งนับแต่วันมีคำเสนอเพื่อให้ศาลพิจารณาสั่งขายทอดตลาดทรัพย์สินซึ่งจำนองนั้น แต่ว่าเจ้าหนี้นั้นจะต้องปฏิบัติการดังจะกล่าวต่อไปนี้ด้วย คือ\n(๑) ออกเงินทดรองค่าฤชาธรรมเนียมการขายทอดตลาด\n(๒) ต้องเข้าสู้ราคาเอง หรือแต่งคนเข้าสู้ราคาเป็นจำนวนเงินสูงกว่าที่ผู้รับโอนเสนอจะใช้\n(๓) บอกกล่าวการที่ตนไม่ยอมนั้นให้ผู้รับโอนและเจ้าหนี้คนอื่น ๆ บรรดาได้จดทะเบียน กับทั้งเจ้าของทรัพย์คนก่อนและลูกหนี้ชั้นต้นทราบด้วย"],["740","b3t12","หมวด ๕ สิทธิและหน้าที่ของผู้รับโอนทรัพย์สินซึ่งจำนอง","","มาตรา ๗๔๐ ถ้าขายทอดตลาดได้เงินจำนวนสุทธิล้ำจำนวนเงินที่ผู้รับโอนเสนอว่าจะใช้ ท่านให้ผู้รับโอนเป็นผู้ออกใช้ค่าฤชาธรรมเนียมในการขายทอดตลาด ถ้าได้ไม่ถึงล้ำจำนวน ท่านให้เจ้าหนี้ผู้ร้องขอให้ขายทอดตลาดเป็นผู้ออก"],["741","b3t12","หมวด ๕ สิทธิและหน้าที่ของผู้รับโอนทรัพย์สินซึ่งจำนอง","","มาตรา ๗๔๑ เมื่อเจ้าหนี้ทั้งหลายได้สนองรับคำเสนอทั่วทุกคนแล้ว โดยแสดงออกชัดหรือโดยปริยายก็ดี ท่านว่าจำนองหรือบุริมสิทธิก็เป็นอันไถ่ถอนได้ด้วยผู้รับโอนใช้เงินหรือวางเงินตามจำนวนที่เสนอจะใช้แทนการชำระหนี้"],["742","b3t12","หมวด ๕ สิทธิและหน้าที่ของผู้รับโอนทรัพย์สินซึ่งจำนอง","","มาตรา ๗๔๒ ถ้าการบังคับจำนองก็ดี ถอนจำนองก็ดี เป็นเหตุให้ทรัพย์สินซึ่งจำนองหลุดมือไปจากบุคคลผู้ได้ทรัพย์สินนั้นไว้แต่ก่อนไซร้ ท่านว่าการที่ทรัพย์สินหลุดมือไปเช่นนั้นหามีผลย้อนหลังไม่ และบุริมสิทธิทั้งหลายของเจ้าหนี้แห่งผู้ที่ทรัพย์หลุดมือไปอันมีอยู่เหนือทรัพย์สินและได้จดทะเบียนไว้นั้น ก็ย่อมเข้าอยู่ในลำดับหลังบุริมสิทธิอันเจ้าหนี้ของผู้จำนอง หรือเจ้าของคนก่อนได้จดทะเบียนไว้\nในกรณีเช่นนี้ ถ้าสิทธิใด ๆ อันมีอยู่เหนือทรัพย์สินซึ่งจำนองเป็นคุณหรือเป็นโทษแก่บุคคลผู้ได้ทรัพย์สินซึ่งจำนองไว้แต่ก่อนได้ระงับไปแล้วด้วยเกลื่อนกลืนกันในขณะที่ได้ทรัพย์สินนั้นมาไซร้ สิทธินั้นท่านให้กลับคืนมาเป็นคุณหรือเป็นโทษแก่บุคคลผู้นั้นได้อีก ในเมื่อทรัพย์สินซึ่งจำนองกลับหลุดมือไป"],["743","b3t12","หมวด ๕ สิทธิและหน้าที่ของผู้รับโอนทรัพย์สินซึ่งจำนอง","","มาตรา ๗๔๓ ถ้าผู้รับโอนได้ทำให้ทรัพย์สินซึ่งจำนองเสื่อมราคาลงเพราะการกระทำหรือความประมาทเลินเล่อแห่งตน เป็นเหตุให้เจ้าหนี้ทั้งหลายผู้มีสิทธิจำนองหรือบุริมสิทธิเหนือทรัพย์สินนั้นต้องเสียหายไซร้ ท่านว่าผู้รับโอนจะต้องรับผิดเพื่อความเสียหายนั้น อย่างไรก็ดี อันผู้รับโอนจะเรียกเอาเงินจำนวนใด ๆ ซึ่งตนได้ออกไป หรือเรียกให้ชดใช้ค่าใช้จ่ายที่ตนได้ทำให้ทรัพย์สินดีขึ้นนั้น ท่านว่าหาอาจจะเรียกได้ไม่ เว้นแต่ที่เป็นการทำให้ทรัพย์สินนั้นงอกราคาขึ้นและจะเรียกได้เพียงเท่าจำนวนราคาที่งอกขึ้นเมื่อขายทอดตลาดเท่านั้น"],["744","b3t12","หมวด ๖ ความระงับสิ้นไปแห่งสัญญาจำนอง","","มาตรา ๗๔๔ อันจำนองย่อมระงับสิ้นไป\n(๑) เมื่อหนี้ที่ประกันระงับสิ้นไปด้วยเหตุประการอื่นใดมิใช่เหตุอายุความ\n(๒) เมื่อปลดจำนองให้แก่ผู้จำนองด้วยหนังสือเป็นสำคัญ\n(๓) เมื่อผู้จำนองหลุดพ้น\n(๔) เมื่อถอนจำนอง\n(๕) เมื่อขายทอดตลาดทรัพย์สินซึ่งจำนองตามคำสั่งศาลอันเนื่องมาแต่การบังคับจำนองหรือถอนจำนอง หรือเมื่อมีการขายทอดตลาดทรัพย์สินตามมาตรา ๗๒๙/๑\n(๖) เมื่อเอาทรัพย์สินซึ่งจำนองนั้นหลุด"],["745","b3t12","หมวด ๖ ความระงับสิ้นไปแห่งสัญญาจำนอง","","มาตรา ๗๔๕ ผู้รับจำนองจะบังคับจำนองแม้เมื่อหนี้ที่ประกันนั้นขาดอายุความแล้วก็ได้ แต่จะบังคับเอาดอกเบี้ยที่ค้างชำระในการจำนองเกินกว่าห้าปีไม่ได้"],["746","b3t12","หมวด ๖ ความระงับสิ้นไปแห่งสัญญาจำนอง","","มาตรา ๗๔๖ การชำระหนี้ไม่ว่าครั้งใด ๆ สิ้นเชิงหรือแต่บางส่วนก็ดี การระงับหนี้อย่างใด ๆ ก็ดี การตกลงกันแก้ไขเปลี่ยนแปลงจำนองหรือหนี้อันจำนองเป็นประกันนั้นเป็นประการใดก็ดี ท่านว่าต้องนำความไปจดทะเบียนต่อพนักงานเจ้าหน้าที่ในเมื่อมีคำร้องของผู้มีส่วนได้เสีย มิฉะนั้นท่านห้ามมิให้ยกขึ้นเป็นข้อต่อสู้บุคคลภายนอก"],["747","b3t13","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๔๗ อันว่าจำนำนั้น คือสัญญาซึ่งบุคคลหนึ่ง เรียกว่าผู้จำนำ ส่งมอบสังหาริมทรัพย์สิ่งหนึ่งให้แก่บุคคลอีกคนหนึ่ง เรียกว่าผู้รับจำนำ เพื่อเป็นประกันการชำระหนี้"],["748","b3t13","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๔๘ การจำนำนั้นย่อมเป็นประกันเพื่อการชำระหนี้ กับทั้งค่าอุปกรณ์ต่อไปนี้ด้วย คือ\n(๑) ดอกเบี้ย\n(๒) ค่าสินไหมทดแทนในการไม่ชำระหนี้\n(๓) ค่าฤชาธรรมเนียมในการบังคับจำนำ\n(๔) ค่าใช้จ่ายเพื่อรักษาทรัพย์สินซึ่งจำนำ\n(๕) ค่าสินไหมทดแทนเพื่อความเสียหายอันเกิดแต่ความชำรุดบกพร่องแห่งทรัพย์สินจำนำซึ่งไม่เห็นประจักษ์"],["749","b3t13","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๔๙ คู่สัญญาจำนำจะตกลงกันให้บุคคลภายนอกเป็นผู้เก็บรักษาทรัพย์สินจำนำไว้ก็ได้"],["750","b3t13","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๕๐ ถ้าทรัพย์สินที่จำนำเป็นสิทธิซึ่งมีตราสารและมิได้ส่งมอบตราสารนั้นให้แก่ผู้รับจำนำ ทั้งมิได้บอกกล่าวเป็นหนังสือแจ้งการจำนำแก่ลูกหนี้แห่งสิทธินั้นด้วยไซร้ ท่านว่าการจำนำย่อมเป็นโมฆะ"],["751","b3t13","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๕๑ ถ้าจำนำตราสารชนิดออกให้แก่บุคคลเพื่อเขาสั่ง ท่านห้ามมิให้ยกขึ้นเป็นข้อต่อสู้บุคคลภายนอก เว้นแต่จะได้สลักหลังไว้ที่ตราสารให้ปรากฏการจำนำเช่นนั้น\nอนึ่ง ในการนี้ไม่จำเป็นต้องบอกกล่าวแก่ลูกหนี้แห่งตราสาร"],["752","b3t13","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๕๒ ถ้าจำนำตราสารชนิดออกให้แก่บุคคลโดยนามและจะโอนกันด้วยสลักหลังไม่ได้ ท่านว่าต้องจดข้อความแสดงการจำนำไว้ให้ปรากฏในตราสารนั้นเอง และท่านห้ามมิให้ยกขึ้นเป็นข้อต่อสู้ลูกหนี้แห่งตราสารหรือบุคคลภายนอก เว้นแต่จะได้บอกกล่าวการจำนำนั้นให้ทราบถึงลูกหนี้แห่งตราสาร"],["753","b3t13","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๕๓ ถ้าจำนำใบหุ้น หรือใบหุ้นกู้ชนิดระบุชื่อท่านห้ามมิให้ยกขึ้นเป็นข้อต่อสู้บริษัทหรือบุคคลภายนอก เว้นแต่จะได้จดทะเบียนการจำนำนั้นไว้ในสมุดของบริษัทตามบทบัญญัติทั้งหลายในลักษณะ ๒๒ ว่าด้วยการโอนหุ้นหรือหุ้นกู้"],["754","b3t13","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๕๔ ถ้าสิทธิซึ่งจำนำนั้นถึงกำหนดชำระก่อนหนี้ซึ่งประกันไว้นั้นไซร้ ท่านว่าลูกหนี้แห่งสิทธิต้องส่งมอบทรัพย์สินอันเป็นวัตถุแห่งสิทธิให้แก่ผู้รับจำนำ และทรัพย์สินนั้นก็กลายเป็นของจำนำแทนสิทธิซึ่งจำนำ\nถ้าสิทธิซึ่งจำนำนั้นเป็นมูลหนี้ซึ่งต้องชำระเป็นเงิน และถึงกำหนดชำระก่อนหนี้ซึ่งประกันไว้นั้นไซร้ ท่านว่าต้องใช้เงินให้แก่ผู้รับจำนำและผู้จำนำร่วมกัน ถ้าและเขาทั้งสองนั้นไม่ปรองดองตกลงกันได้ ท่านว่าแต่ละคนชอบที่จะเรียกให้วางเงินจำนวนนั้นไว้ ณ สำนักงานฝากทรัพย์ได้เพื่อประโยชน์อันร่วมกัน"],["755","b3t13","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๕๕ ถ้าจำนำสิทธิ ท่านห้ามมิให้ทำสิทธินั้นให้สิ้นไป หรือแก้ไขสิทธินั้นให้เสียหายแก่ผู้รับจำนำโดยผู้รับจำนำมิได้ยินยอมด้วย"],["756","b3t13","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๕๖ การที่จะตกลงกันไว้เสียแต่ก่อนเวลาหนี้ถึงกำหนดชำระเป็นข้อความอย่างใดอย่างหนึ่งว่า ถ้าไม่ชำระหนี้ ให้ผู้รับจำนำเข้าเป็นเจ้าของทรัพย์สินจำนำ หรือให้จัดการแก่ทรัพย์สินนั้นเป็นประการอื่นนอกจากตามบทบัญญัติทั้งหลายว่าด้วยการบังคับจำนำนั้นไซร้ ข้อตกลงเช่นนั้นท่านว่าไม่สมบูรณ์"],["757","b3t13","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๕๗ บทบัญญัติทั้งหลายในลักษณะ ๑๓ นี้ ท่านให้ใช้บังคับแก่สัญญาจำนำที่ทำกับผู้ตั้งโรงรับจำนำโดยอนุญาตรัฐบาลแต่เพียงที่ไม่ขัดกับกฎหมายหรือกฎข้อบังคับว่าด้วยโรงจำนำ"],["758","b3t13","หมวด ๒ สิทธิและหน้าที่ของผู้จำนำและผู้รับจำนำ","","มาตรา ๗๕๘ ผู้รับจำนำชอบที่จะยึดของจำนำไว้ได้ทั้งหมดจนกว่าจะได้รับชำระหนี้และค่าอุปกรณ์ครบถ้วน"],["759","b3t13","หมวด ๒ สิทธิและหน้าที่ของผู้จำนำและผู้รับจำนำ","","มาตรา ๗๕๙ ผู้รับจำนำต้องรักษาทรัพย์สินจำนำไว้ให้ปลอดภัย และต้องสงวนทรัพย์สินจำนำนั้นเช่นอย่างวิญญูชนจะพึงสงวนทรัพย์สินของตนเอง"],["760","b3t13","หมวด ๒ สิทธิและหน้าที่ของผู้จำนำและผู้รับจำนำ","","มาตรา ๗๖๐ ถ้าผู้รับจำนำเอาทรัพย์สินซึ่งจำนำออกใช้เอง หรือเอาไปให้บุคคลภายนอกใช้สอย หรือเก็บรักษาโดยผู้จำนำมิได้ยินยอมด้วยไซร้ ท่านว่าผู้รับจำนำจะต้องรับผิดเพื่อที่ทรัพย์สินจำนำนั้นสูญหาย หรือบุบสลายไปอย่างใด ๆ แม้ทั้งเป็นเพราะเหตุสุดวิสัย เว้นแต่จะพิสูจน์ได้ว่าถึงอย่างไร ๆ ก็คงจะต้องสูญหาย หรือบุบสลายอยู่นั่นเอง"],["761","b3t13","หมวด ๒ สิทธิและหน้าที่ของผู้จำนำและผู้รับจำนำ","","มาตรา ๗๖๑ ถ้ามิได้กำหนดไว้เป็นอย่างอื่นในสัญญาหากมีดอกผลนิตินัยงอกจากทรัพย์สินนั้นอย่างไร ท่านให้ผู้รับจำนำจัดสรรใช้เป็นค่าดอกเบี้ยอันค้างชำระแก่ตน และถ้าไม่มีดอกเบี้ยค้างชำระ ท่านให้จัดสรรใช้ต้นเงินแห่งหนี้อันได้จำนำทรัพย์สินเป็นประกันนั้น"],["762","b3t13","หมวด ๒ สิทธิและหน้าที่ของผู้จำนำและผู้รับจำนำ","","มาตรา ๗๖๒ ค่าใช้จ่ายใด ๆ อันควรแก่การบำรุงรักษาทรัพย์สินจำนำนั้น ผู้จำนำจำต้องชดใช้ให้แก่ผู้รับจำนำ เว้นแต่จะได้กำหนดไว้เป็นอย่างอื่นในสัญญา"],["763","b3t13","หมวด ๒ สิทธิและหน้าที่ของผู้จำนำและผู้รับจำนำ","","มาตรา ๗๖๓ ท่านห้ามมิให้ฟ้องคดีดังจะกล่าวต่อไปนี้ เมื่อพ้นหกเดือนนับแต่วันส่งคืน หรือขายทอดตลาดทรัพย์สินจำนำ คือ\n(๑) ฟ้องเรียกค่าสินไหมทดแทนเพื่อความบุบสลายอันผู้รับจำนำก่อให้เกิดแก่ทรัพย์สินจำนำ\n(๒) ฟ้องเรียกให้ชดใช้ค่าใช้จ่ายเพื่อการบำรุงรักษาทรัพย์สินจำนำ\n(๓) ฟ้องเรียกค่าสินไหมทดแทนเพื่อความเสียหายอันเกิดแก่ผู้รับจำนำ เพราะความชำรุดบกพร่องในทรัพย์สินจำนำซึ่งไม่เห็นประจักษ์"],["764","b3t13","หมวด ๓ การบังคับจำนำ","","มาตรา ๗๖๔ เมื่อจะบังคับจำนำ ผู้รับจำนำต้องบอกกล่าวเป็นหนังสือไปยังลูกหนี้ก่อนว่า ให้ชำระหนี้และอุปกรณ์ภายในเวลาอันควรซึ่งกำหนดให้ในคำบอกกล่าวนั้น\nถ้าลูกหนี้ละเลยไม่ปฏิบัติตามคำบอกกล่าว ผู้รับจำนำชอบที่จะเอาทรัพย์สินซึ่งจำนำออกขายได้ แต่ต้องขายทอดตลาด\nอนึ่ง ผู้รับจำนำต้องมีจดหมายบอกกล่าวไปยังผู้จำนำบอกเวลาและสถานที่ซึ่งจะขายทอดตลาดด้วย"],["765","b3t13","หมวด ๓ การบังคับจำนำ","","มาตรา ๗๖๕ ถ้าไม่สามารถจะบอกกล่าวก่อนได้ ผู้รับจำนำจะเอาทรัพย์สินจำนำออกขายทอดตลาดเสียในเมื่อหนี้ค้างชำระมาล่วงเวลาเดือนหนึ่งแล้วก็ให้ทำได้"],["766","b3t13","หมวด ๓ การบังคับจำนำ","","มาตรา ๗๖๖ ถ้าจำนำตั๋วเงิน ท่านให้ผู้รับจำนำเก็บเรียกเงินตามตั๋วเงินนั้นในวันถึงกำหนด ไม่จำเป็นต้องบอกกล่าวก่อน"],["767","b3t13","หมวด ๓ การบังคับจำนำ","","มาตรา ๗๖๗ เมื่อบังคับจำนำได้เงินจำนวนสุทธิเท่าใด ท่านว่าผู้รับจำนำต้องจัดสรรชำระหนี้และอุปกรณ์เพื่อให้เสร็จสิ้นไป และถ้ายังมีเงินเหลือก็ต้องส่งคืนให้แก่ผู้จำนำ หรือแก่บุคคลผู้ควรจะได้เงินนั้น\nถ้าได้เงินน้อยกว่าจำนวนค้างชำระ ท่านว่าลูกหนี้ก็ยังคงต้องรับใช้ในส่วนที่ขาดอยู่นั้น"],["768","b3t13","หมวด ๓ การบังคับจำนำ","","มาตรา ๗๖๘ ถ้าจำนำทรัพย์สินหลายสิ่งเพื่อประกันหนี้แต่รายหนึ่งรายเดียว ท่านว่าผู้รับจำนำจะเลือกเอาทรัพย์สินสิ่งหนึ่งสิ่งใดออกขายก็ได้ แต่จะขายจนเกินกว่าที่จำเป็นเพื่อใช้เงินตามสิทธิแห่งตนนั้นหาได้ไม่"],["769","b3t13","หมวด ๔ ความระงับสิ้นไปแห่งการจำนำ","","มาตรา ๗๖๙ อันจำนำย่อมระงับสิ้นไป\n(๑) เมื่อหนี้ซึ่งจำนำเป็นประกันอยู่นั้นระงับสิ้นไปเพราะเหตุประการอื่นมิใช่เพราะอายุความ หรือ\n(๒) เมื่อผู้รับจำนำยอมให้ทรัพย์สินจำนำกลับคืนไปสู่ครอบครองของผู้จำนำ"],["770","b3t14","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๗๐ อันว่านายคลังสินค้านั้น คือบุคคลผู้รับทำการเก็บรักษาสินค้าเพื่อบำเหน็จเป็นทางค้าปกติของตน"],["771","b3t14","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๗๑ บทบัญญัติทั้งหลายในประมวลกฎหมายนี้ อันว่าด้วยฝากทรัพย์นั้น ท่านให้นำมาใช้บังคับแก่การเก็บของในคลังสินค้าด้วยเพียงเท่าที่ไม่ขัดกับบทบัญญัติในลักษณะนี้"],["772","b3t14","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๗๒ บทบัญญัติมาตรา ๖๑๖ มาตรา ๖๑๙ มาตรา ๖๒๓ มาตรา ๖๒๕ มาตรา ๖๓๐ มาตรา ๖๓๑ และมาตรา ๖๓๒ อันว่าด้วยการรับขนนั้น ท่านให้นำมาใช้บังคับแก่การเก็บของในคลังสินค้า อนุโลมตามควรแก่บท"],["773","b3t14","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๗๓ นายคลังสินค้าจำต้องยอมให้ผู้ทรงใบรับของคลังสินค้า หรือผู้ทรงประทวนสินค้าตรวจสินค้าและเอาตัวอย่างไปได้ในเวลาอันควรระหว่างเวลาทำงานทุกเมื่อ"],["774","b3t14","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๗๔ นายคลังสินค้าจะเรียกให้ผู้ฝากถอนสินค้าไปก่อนสิ้นระยะเวลาที่ตกลงกันไว้นั้น ท่านว่าหาอาจทำได้ไม่ ถ้าไม่มีกำหนดเวลาส่งคืนสินค้า นายคลังสินค้าจะส่งคืนได้ต่อเมื่อบอกกล่าวให้ผู้ฝากทราบล่วงหน้าเดือนหนึ่ง แต่ท่านมิให้ผู้ฝากต้องถูกบังคับให้ถอนสินค้าไปก่อนเวลาล่วงแล้วสองเดือน นับแต่วันที่ได้ส่งมอบฝากไว้"],["775","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๗๕ ถ้าผู้ฝากต้องการไซร้ นายคลังสินค้าต้องส่งมอบเอกสารซึ่งเอาออกจากทะเบียนมีต้นขั้วเฉพาะการอันมีใบรับของคลังสินค้าฉบับหนึ่ง และประทวนสินค้าฉบับหนึ่งให้แก่ผู้ฝาก"],["776","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๗๖ อันใบรับของคลังสินค้านั้น ย่อมให้สิทธิแก่ผู้ฝากที่จะสลักหลังโอนกรรมสิทธิ์ในสินค้าไปเป็นของผู้อื่นได้"],["777","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๗๗ อันประทวนสินค้านั้น ย่อมให้สิทธิแก่ผู้ฝากที่จะสลักหลังจำนำสินค้าซึ่งจดแจ้งไว้ในประทวนได้โดยไม่ต้องส่งมอบสินค้านั้นแก่ผู้รับสลักหลัง\nแต่ว่าเมื่อผู้ฝากประสงค์จะจำนำสินค้า ต้องแยกประทวนออกเสียจากใบรับของคลังสินค้า และส่งมอบประทวนนั้นให้แก่ผู้รับสลักหลัง"],["778","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๗๘ ใบรับของคลังสินค้าและประทวนสินค้าต้องมีเลขลำดับตรงกันกับเลขในต้นขั้ว และลงลายมือชื่อของนายคลังสินค้า\nอนึ่ง ใบรับของคลังสินค้าและประทวนสินค้านั้น ท่านให้มีรายละเอียดดังกล่าวต่อไปนี้ คือ\n(๑) ชื่อหรือยี่ห้อ และสำนักของผู้ฝาก\n(๒) ที่ตั้งคลังสินค้า\n(๓) ค่าบำเหน็จสำหรับเก็บรักษา\n(๔) สภาพของสินค้าที่เก็บรักษา และน้ำหนักหรือขนาดแห่งสินค้านั้น กับทั้งสภาพ จำนวน และเครื่องหมายหีบห่อ\n(๕) สถานที่และวันออกใบรับของคลังสินค้าและประทวนสินค้านั้น\n(๖) ถ้าได้กำหนดกันไว้ว่าให้เก็บสินค้าไว้ชั่วเวลาเท่าใดให้แจ้งกำหนดนั้นด้วย\n(๗) ถ้าของที่เก็บรักษามีประกันภัย ให้แสดงจำนวนเงินที่ประกันภัยกำหนดเวลาที่ประกันภัย และชื่อหรือยี่ห้อของผู้รับประกันภัยด้วย\nอนึ่ง นายคลังสินค้าต้องจดรายละเอียดทั้งนี้ลงไว้ในต้นขั้วด้วย"],["779","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๗๙ อันใบรับของคลังสินค้าก็ดี ประทวนสินค้าก็ดี ท่านว่าหาอาจออกให้หรือสลักหลังให้แก่ผู้ถือได้ไม่"],["780","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๘๐ เมื่อใดผู้ฝากสลักหลังประทวนสินค้าให้แก่ผู้รับจำนำ คู่สัญญาต้องจดแจ้งการที่สลักหลังนั้นลงไว้ในใบรับของคลังสินค้าด้วย\nถ้ามิได้จดแจ้งไว้ดังนั้น ท่านว่าการจำนำนั้นหาอาจยกขึ้นเป็นข้อต่อสู้ผู้ซื้อสินค้าสืบไปนั้นได้ไม่"],["781","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๘๑ เมื่อประทวนสินค้าได้สลักหลังและส่งมอบแก่ผู้รับจำนำแล้ว ให้ผู้ฝากกับผู้รับจำนำจดลงไว้ในประทวนสินค้าเป็นสำคัญ ว่าได้จดข้อความตามที่บัญญัติในมาตราก่อนไว้ในใบรับของคลังสินค้าแล้ว"],["782","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๘๒ เมื่อใดผู้ฝากจำนำสินค้าและส่งมอบประทวนสินค้าแก่ผู้รับสลักหลังแล้ว ผู้รับสลักหลังเช่นนั้นต้องมีจดหมายบอกกล่าวแก่นายคลังสินค้าให้ทราบจำนวนหนี้ซึ่งจำนำสินค้านั้นเป็นประกัน ทั้งจำนวนดอกเบี้ยและวันอันหนี้นั้นจะถึงกำหนดชำระ เมื่อนายคลังสินค้าได้รับคำบอกกล่าวเช่นนั้นแล้วต้องจดรายการทั้งนั้นลงในต้นขั้ว\nถ้าและมิได้จดในต้นขั้วเช่นนั้น ท่านว่าการจำนำนั้นหาอาจจะยกขึ้นเป็นข้อต่อสู้เจ้าหนี้ทั้งหลายของผู้ฝากได้ไม่"],["783","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๘๓ ผู้ทรงเอกสารอันมีทั้งใบรับของคลังสินค้าและประทวนสินค้านั้น จะให้นายคลังสินค้าแยกสินค้าที่เก็บรักษาไว้ออกเป็นหลายส่วนและให้ส่งมอบเอกสารแก่ตนส่วนละใบก็ได้ ในกรณีเช่นนี้ผู้ทรงเอกสารต้องคืนเอกสารเดิมแก่นายคลังสินค้า\nอนึ่ง ค่าใช้จ่ายในการแยกสินค้าและการส่งมอบเอกสารใหม่นั้น ผู้ทรงเอกสารต้องรับใช้"],["784","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๘๔ กรรมสิทธิ์ในสินค้าที่เก็บรักษาไว้นั้น ท่านว่าอาจโอนได้แต่ด้วยสลักหลังใบรับของคลังสินค้าเท่านั้น"],["785","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๘๕ สินค้าซึ่งเก็บรักษาไว้นั้นอาจจำนำได้แต่ด้วยสลักหลังประทวนสินค้า เมื่อประทวนสินค้าได้สลักหลังแล้ว สินค้านั้นจะจำนำแก่ผู้อื่นอีกชั้นหนึ่งด้วยสลักหลังใบรับของคลังสินค้าอย่างเดียวกับสลักหลังประทวนสินค้านั้นก็ได้"],["786","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๘๖ ตราบใดสินค้าที่เก็บรักษาไว้ไม่ได้จำนำ ท่านว่าจะโอนใบรับของคลังสินค้าและประทวนสินค้าไปต่างหากจากกันไม่ได้อยู่ตราบนั้น"],["787","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๘๗ ในการสลักหลังลงในประทวนสินค้าครั้งแรกนั้น ต้องจดแจ้งจำนวนหนี้ที่จำนำสินค้าเป็นประกันทั้งจำนวนดอกเบี้ยที่จะต้องชำระและวันที่หนี้จะถึงกำหนดชำระด้วย"],["788","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๘๘ อันสินค้าที่เก็บรักษาไว้ในคลังสินค้านั้น จะรับเอาไปได้แต่เมื่อเวนคืนใบรับของคลังสินค้า"],["789","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๘๙ ถ้าได้แยกประทวนสินค้าออกสลักหลังจำนำแล้ว จะรับเอาสินค้าได้แต่เมื่อเวนคืนทั้งใบรับของคลังสินค้าและประทวนสินค้า\nแต่ว่าผู้ทรงใบรับของคลังสินค้าอาจให้คืนสินค้าแก่ตนได้ในเวลาใด ๆ เมื่อวางเงินแก่นายคลังสินค้าเต็มจำนวนหนี้ซึ่งลงไว้ในประทวนสินค้า กับทั้งดอกเบี้ยจนถึงวันกำหนดชำระหนี้นั้นด้วย\nอนึ่ง จำนวนเงินที่วางเช่นนี้นายคลังสินค้าต้องชำระแก่ผู้ทรงประทวนสินค้าในเมื่อเขาเวนคืนประทวนนั้น"],["790","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๙๐ ถ้าหนี้ซึ่งสินค้าจำนำเป็นประกันมิได้ชำระเมื่อวันถึงกำหนดไซร้ ผู้ทรงประทวนสินค้าเมื่อได้ยื่นคำคัดค้านตามระเบียบแล้ว ชอบที่จะให้นายคลังสินค้าขายทอดตลาดสินค้านั้นได้ แต่ท่านห้ามมิให้ขายทอดตลาดก่อนแปดวันนับแต่วันคัดค้าน"],["791","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๙๑ ผู้ทรงประทวนสินค้าต้องมีจดหมายบอกกล่าวให้ผู้ฝากทราบเวลาและสถานที่จะขายทอดตลาด"],["792","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๙๒ นายคลังสินค้าต้องหักเงินที่ค้างชำระแก่ตนเนื่องด้วยการเก็บรักษาสินค้านั้นจากจำนวนเงินสุทธิที่ขายทอดตลาดได้ และเมื่อผู้ทรงประทวนสินค้านำประทวนมาเวนคืน ต้องเอาเงินที่เหลือนั้นให้ตามจำนวนที่ค้างชำระแก่เขา\nถ้ามีเงินเหลือเท่าใด ต้องใช้แก่ผู้รับจำนำคนหลังเมื่อเขาเวนคืนใบรับของคลังสินค้า หรือถ้าไม่มีผู้รับจำนำคนหลังหรือผู้รับจำนำคนหลังได้รับชำระหนี้แล้ว ก็ให้ชำระเงินที่เหลืออยู่นั้นแก่ผู้ทรงใบรับของคลังสินค้า"],["793","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๙๓ ถ้าจำนวนเงินสุทธิที่ขายทอดตลาดได้ไม่พอชำระหนี้แก่ผู้ทรงประทวนสินค้าไซร้ นายคลังสินค้าต้องคืนประทวนสินค้าแก่เขา กับจดบอกจำนวนเงินที่ได้ชำระลงไว้ในประทวนสินค้านั้นแล้วจดลงไว้ในสมุดบัญชีของตนด้วย"],["794","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๙๔ ผู้ทรงประทวนสินค้ามีสิทธิจะไล่เบี้ยเอาจำนวนเงินที่ยังค้างชำระนั้นแก่ผู้สลักหลังคนก่อน ๆ ทั้งหมดหรือแต่คนใดคนหนึ่งได้ แต่ต้องได้ขายทอดตลาดภายในเดือนหนึ่งนับแต่วันคัดค้าน\nอนึ่ง ท่านห้ามมิให้ฟ้องไล่เบี้ยเมื่อพ้นเวลาปีหนึ่งนับแต่วันขายทอดตลาด"],["795","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๙๕ บทบัญญัติทั้งหลายในประมวลกฎหมายนี้อันว่าด้วยตั๋วเงินนั้น ท่านให้ใช้ได้ถึงประทวนสินค้าและใบรับของคลังสินค้าซึ่งได้สลักหลังอย่างประทวนสินค้านั้นด้วยเพียงที่ไม่ขัดกับบทบัญญัติทั้งหลายในลักษณะนี้"],["796","b3t14","หมวด ๒ ใบรับของคลังสินค้าและประทวนสินค้า","","มาตรา ๗๙๖ ถ้าเอกสารมีทั้งใบรับของคลังสินค้าและประทวนสินค้าหรือแต่อย่างหนึ่งอย่างใดสูญหายไป เมื่อผู้ทรงเอกสารนั้น ๆ ให้ประกันตามสมควรแล้ว จะให้นายคลังสินค้าออกให้ใหม่ก็ได้\nในกรณีเช่นนี้นายคลังสินค้าต้องจดหมายลงไว้ในต้นขั้วเป็นสำคัญ"],["797","b3t15","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๙๗ อันว่าสัญญาตัวแทนนั้น คือสัญญาซึ่งให้บุคคลหนึ่ง เรียกว่าตัวแทน มีอำนาจทำการแทนบุคคลอีกคนหนึ่ง เรียกว่าตัวการ และตกลงจะทำการดังนั้น\nอันความเป็นตัวแทนนั้นจะเป็นโดยตั้งแต่งแสดงออกชัดหรือโดยปริยายก็ย่อมได้"],["798","b3t15","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๙๘ กิจการอันใดท่านบังคับไว้โดยกฎหมายว่าต้องทำเป็นหนังสือ การตั้งตัวแทนเพื่อกิจการอันนั้นก็ต้องทำเป็นหนังสือด้วย\nกิจการอันใดท่านบังคับไว้ว่าต้องมีหลักฐานเป็นหนังสือ การตั้งตัวแทนเพื่อกิจการอันนั้นก็ต้องมีหลักฐานเป็นหนังสือด้วย"],["799","b3t15","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๗๙๙ ตัวการคนใดใช้บุคคลผู้ไร้ความสามารถเป็นตัวแทน ท่านว่าตัวการคนนั้นย่อมต้องผูกพันในกิจการที่ตัวแทนกระทำ"],["800","b3t15","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๘๐๐ ถ้าตัวแทนได้รับมอบอำนาจแต่เฉพาะการ ท่านว่าจะทำการแทนตัวการได้แต่เพียงในสิ่งที่จำเป็นเพื่อให้กิจอันเขาได้มอบหมายแก่ตนนั้นสำเร็จลุล่วงไป"],["801","b3t15","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๘๐๑ ถ้าตัวแทนได้รับมอบอำนาจทั่วไป ท่านว่าจะทำกิจใด ๆ ในทางจัดการแทนตัวการก็ย่อมทำได้ทุกอย่าง\nแต่การเช่นอย่างจะกล่าวต่อไปนี้ ท่านว่าหาอาจจะทำได้ไม่ คือ\n(๑) ขายหรือจำนองอสังหาริมทรัพย์\n(๒) ให้เช่าอสังหาริมทรัพย์กว่าสามปีขึ้นไป\n(๓) ให้\n(๔) ประนีประนอมยอมความ\n(๕) ยื่นฟ้องต่อศาล\n(๖) มอบข้อพิพาทให้อนุญาโตตุลาการพิจารณา"],["802","b3t15","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๘๐๒ ในเหตุฉุกเฉิน เพื่อจะป้องกันมิให้ตัวการต้องเสียหาย ท่านให้สันนิษฐานไว้ก่อนว่าตัวแทนจะทำการใด ๆ เช่นอย่างวิญญูชนจะพึงกระทำ ก็ย่อมมีอำนาจจะทำได้ทั้งสิ้น"],["803","b3t15","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๘๐๓ ตัวแทนไม่มีสิทธิจะได้รับบำเหน็จ เว้นแต่จะได้มีข้อตกลงกันไว้ในสัญญาว่ามีบำเหน็จ หรือทางการที่คู่สัญญาประพฤติต่อกันนั้นเป็นปริยายว่ามีบำเหน็จ หรือเคยเป็นธรรมเนียมมีบำเหน็จ"],["804","b3t15","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๘๐๔ ถ้าในสัญญาอันเดียวตัวการคนเดียวตั้งตัวแทนหลายคนเพื่อแก่การอันเดียวกันไซร้ ท่านให้สันนิษฐานไว้ก่อนว่าตัวแทนจะต่างคนต่างทำการนั้น ๆ แยกกันไม่ได้"],["805","b3t15","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๘๐๕ ตัวแทนนั้น เมื่อไม่ได้รับความยินยอมของตัวการ จะเข้าทำนิติกรรมอันใดในนามของตัวการทำกับตนเองในนามของตนเองหรือในฐานเป็นตัวแทนของบุคคลภายนอกหาได้ไม่ เว้นแต่นิติกรรมนั้นมีเฉพาะแต่การชำระหนี้"],["806","b3t15","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๘๐๖ ตัวการซึ่งมิได้เปิดเผยชื่อจะกลับแสดงตนให้ปรากฏและเข้ารับเอาสัญญาใด ๆ ซึ่งตัวแทนได้ทำไว้แทนตนก็ได้ แต่ถ้าตัวการผู้ใดได้ยอมให้ตัวแทนของตนทำการออกหน้าเป็นตัวการไซร้ ท่านว่าตัวการผู้นั้นหาอาจจะทำให้เสื่อมเสียถึงสิทธิของบุคคลภายนอกอันเขามีต่อตัวแทน และเขาขวนขวายได้มาแต่ก่อนที่รู้ว่าเป็นตัวแทนนั้นได้ไม่"],["807","b3t15","หมวด ๒ หน้าที่และความรับผิดของตัวแทนต่อตัวการ","","มาตรา ๘๐๗ ตัวแทนต้องทำการตามคำสั่งแสดงออกชัดหรือโดยปริยายของตัวการ เมื่อไม่มีคำสั่งเช่นนั้น ก็ต้องดำเนินตามทางที่เคยทำกันมาในกิจการค้าขายอันเขาให้ตนทำอยู่นั้น\nอนึ่ง บทบัญญัติมาตรา ๖๕๙ ว่าด้วยการฝากทรัพย์นั้น ท่านให้นำมาใช้ด้วยโดยอนุโลมตามควร"],["808","b3t15","หมวด ๒ หน้าที่และความรับผิดของตัวแทนต่อตัวการ","","มาตรา ๘๐๘ ตัวแทนต้องทำการด้วยตนเอง เว้นแต่จะมีอำนาจใช้ตัวแทนช่วงทำการได้"],["809","b3t15","หมวด ๒ หน้าที่และความรับผิดของตัวแทนต่อตัวการ","","มาตรา ๘๐๙ เมื่อตัวการมีประสงค์จะทราบความเป็นไปของการที่ได้มอบหมายแก่ตัวแทนนั้นในเวลาใด ๆ ซึ่งสมควรแก่เหตุ ตัวแทนก็ต้องแจ้งให้ตัวการทราบ อนึ่ง เมื่อการเป็นตัวแทนสิ้นสุดลงแล้ว ตัวแทนต้องแถลงบัญชีด้วย"],["810","b3t15","หมวด ๒ หน้าที่และความรับผิดของตัวแทนต่อตัวการ","","มาตรา ๘๑๐ เงินและทรัพย์สินอย่างอื่นบรรดาที่ตัวแทนได้รับไว้เกี่ยวด้วยการเป็นตัวแทนนั้น ท่านว่าตัวแทนต้องส่งให้แก่ตัวการจงสิ้น\nอนึ่ง สิทธิทั้งหลายซึ่งตัวแทนขวนขวายได้มาในนามของตนเองแต่โดยฐานที่ทำการแทนตัวการนั้น ตัวแทนก็ต้องโอนให้แก่ตัวการจงสิ้น"],["811","b3t15","หมวด ๒ หน้าที่และความรับผิดของตัวแทนต่อตัวการ","","มาตรา ๘๑๑ ถ้าตัวแทนเอาเงินซึ่งควรจะได้ส่งแก่ตัวการหรือซึ่งควรจะใช้ในกิจของตัวการนั้นไปใช้สอยเป็นประโยชน์ตนเสีย ท่านว่าตัวแทนต้องเสียดอกเบี้ยในเงินนั้นนับแต่วันที่ได้เอาไปใช้"],["812","b3t15","หมวด ๒ หน้าที่และความรับผิดของตัวแทนต่อตัวการ","","มาตรา ๘๑๒ ถ้ามีความเสียหายเกิดขึ้นอย่างใด ๆ เพราะความประมาทเลินเล่อของตัวแทนก็ดี เพราะไม่ทำการเป็นตัวแทนก็ดี หรือเพราะทำการโดยปราศจากอำนาจหรือนอกเหนืออำนาจก็ดี ท่านว่าตัวแทนจะต้องรับผิด"],["813","b3t15","หมวด ๒ หน้าที่และความรับผิดของตัวแทนต่อตัวการ","","มาตรา ๘๑๓ ตัวแทนผู้ใดตั้งตัวแทนช่วงตามที่ตัวการระบุตัวให้ตั้ง ท่านว่าตัวแทนผู้นั้นจะต้องรับผิดแต่เพียงในกรณีที่ตนได้รู้ว่าตัวแทนช่วงนั้นเป็นผู้ที่ไม่เหมาะแก่การ หรือเป็นผู้ที่ไม่สมควรไว้วางใจแล้วและมิได้แจ้งความนั้นให้ตัวการทราบหรือมิได้เลิกถอนตัวแทนช่วงนั้นเสียเอง"],["814","b3t15","หมวด ๒ หน้าที่และความรับผิดของตัวแทนต่อตัวการ","","มาตรา ๘๑๔ ตัวแทนช่วงย่อมรับผิดโดยตรงต่อตัวการ ฉันใดกลับกันก็ฉันนั้น"],["815","b3t15","หมวด ๓ หน้าที่และความรับผิดของตัวการต่อตัวแทน","","มาตรา ๘๑๕ ถ้าตัวแทนมีประสงค์ไซร้ ตัวการต้องจ่ายเงินทดรองให้แก่ตัวแทนตามจำนวนที่จำเป็น เพื่อทำการอันมอบหมายแก่ตัวแทนนั้น"],["816","b3t15","หมวด ๓ หน้าที่และความรับผิดของตัวการต่อตัวแทน","","มาตรา ๘๑๖ ถ้าในการจัดทำกิจการอันเขามอบหมายแก่ตนนั้น ตัวแทนได้ออกเงินทดรองหรือออกเงินค่าใช้จ่ายไป ซึ่งพิเคราะห์ตามเหตุควรนับว่าเป็นการจำเป็นได้ไซร้ ท่านว่าตัวแทนจะเรียกเอาเงินชดใช้จากตัวการ รวมทั้งดอกเบี้ยนับแต่วันที่ได้ออกเงินไปนั้นด้วยก็ได้\nถ้าในการจัดทำกิจการอันเขามอบหมายแก่ตนนั้น ตัวแทนต้องรับภาระเป็นหนี้ขึ้นอย่างหนึ่งอย่างใด ซึ่งพิเคราะห์ตามเหตุควรนับว่าเป็นการจำเป็นได้ไซร้ ท่านว่าตัวแทนจะเรียกให้ตัวการชำระหนี้แทนตนก็ได้ หรือถ้ายังไม่ถึงเวลากำหนดชำระหนี้ จะให้ตัวการให้ประกันอันสมควรก็ได้\nถ้าในการจัดทำกิจการอันเขามอบหมายแก่ตนนั้น เป็นเหตุให้ตัวแทนต้องเสียหายอย่างหนึ่งอย่างใด มิใช่เป็นเพราะความผิดของตนเองไซร้ ท่านว่าตัวแทนจะเรียกเอาค่าสินไหมทดแทนจากตัวการก็ได้"],["817","b3t15","หมวด ๓ หน้าที่และความรับผิดของตัวการต่อตัวแทน","","มาตรา ๘๑๗ ในกรณีที่มีบำเหน็จตัวแทนถ้าไม่มีข้อสัญญาตกลงกันไว้เป็นอย่างอื่น ท่านว่าบำเหน็จนั้นพึงจ่ายให้ต่อเมื่อการเป็นตัวแทนได้สุดสิ้นลงแล้ว"],["818","b3t15","หมวด ๓ หน้าที่และความรับผิดของตัวการต่อตัวแทน","","มาตรา ๘๑๘ การในหน้าที่ตัวแทนส่วนใดตัวแทนได้ทำมิชอบในส่วนนั้น ท่านว่าตัวแทนไม่มีสิทธิจะได้บำเหน็จ"],["819","b3t15","หมวด ๓ หน้าที่และความรับผิดของตัวการต่อตัวแทน","","มาตรา ๘๑๙ ตัวแทนชอบที่จะยึดหน่วงทรัพย์สินของใด ๆ ของตัวการอันตกอยู่ในความครอบครองของตนเพราะเป็นตัวแทนนั้นเอาไว้ได้ จนกว่าจะได้รับเงินบรรดาค้างชำระแก่ตนเพราะการเป็นตัวแทน"],["820","b3t15","หมวด ๔ ความรับผิดของตัวการและตัวแทนต่อบุคคลภายนอก","","มาตรา ๘๒๐ ตัวการย่อมมีความผูกพันต่อบุคคลภายนอกในกิจการทั้งหลายอันตัวแทนหรือตัวแทนช่วงได้ทำไปภายในขอบอำนาจแห่งฐานตัวแทน"],["821","b3t15","หมวด ๔ ความรับผิดของตัวการและตัวแทนต่อบุคคลภายนอก","","มาตรา ๘๒๑ บุคคลผู้ใดเชิดบุคคลอีกคนหนึ่งออกแสดงเป็นตัวแทนของตนก็ดี รู้แล้วยอมให้บุคคลอีกคนหนึ่งเชิดตัวเขาเองออกแสดงเป็นตัวแทนของตนก็ดี ท่านว่าบุคคลผู้นั้นจะต้องรับผิดต่อบุคคลภายนอกผู้สุจริตเสมือนว่าบุคคลอีกคนหนึ่งนั้นเป็นตัวแทนของตน"],["822","b3t15","หมวด ๔ ความรับผิดของตัวการและตัวแทนต่อบุคคลภายนอก","","มาตรา ๘๒๒ ถ้าตัวแทนทำการอันใดเกินอำนาจตัวแทน แต่ทางปฏิบัติของตัวการทำให้บุคคลภายนอกมีมูลเหตุอันสมควรจะเชื่อว่าการอันนั้นอยู่ภายในขอบอำนาจของตัวแทนไซร้ ท่านให้ใช้บทบัญญัติมาตราก่อนนี้เป็นบทบังคับ แล้วแต่กรณี"],["823","b3t15","หมวด ๔ ความรับผิดของตัวการและตัวแทนต่อบุคคลภายนอก","","มาตรา ๘๒๓ ถ้าตัวแทนกระทำการอันใดอันหนึ่งโดยปราศจากอำนาจก็ดี หรือทำนอกทำเหนือขอบอำนาจก็ดี ท่านว่าย่อมไม่ผูกพันตัวการ เว้นแต่ตัวการจะให้สัตยาบันแก่การนั้น\nถ้าตัวการไม่ให้สัตยาบัน ท่านว่าตัวแทนย่อมต้องรับผิดต่อบุคคลภายนอกโดยลำพังตนเอง เว้นแต่จะพิสูจน์ได้ว่าบุคคลภายนอกนั้นได้รู้อยู่ว่าตนทำการโดยปราศจากอำนาจหรือทำนอกเหนือขอบอำนาจ"],["824","b3t15","หมวด ๔ ความรับผิดของตัวการและตัวแทนต่อบุคคลภายนอก","","มาตรา ๘๒๔ ตัวแทนคนใดทำสัญญาแทนตัวการซึ่งอยู่ต่างประเทศและมีภูมิลำเนาในต่างประเทศ ท่านว่าตัวแทนคนนั้นจะต้องรับผิดตามสัญญานั้นแต่ลำพังตนเอง แม้ทั้งชื่อและตัวการจะได้เปิดเผยแล้ว เว้นแต่ข้อความแห่งสัญญาจะแย้งกันกับความรับผิดของตัวแทน"],["825","b3t15","หมวด ๔ ความรับผิดของตัวการและตัวแทนต่อบุคคลภายนอก","","มาตรา ๘๒๕ ถ้าตัวแทนเข้าทำสัญญากับบุคคลภายนอกโดยเห็นแก่อามิสสินจ้างเป็นทรัพย์สินอย่างใด ๆ หรือประโยชน์อย่างอื่นอันบุคคลภายนอกได้ให้เป็นลาภส่วนตัวก็ดี หรือให้คำมั่นว่าจะให้ก็ดี ท่านว่าตัวการหาต้องผูกพันในสัญญาซึ่งตัวแทนของตนได้ทำนั้นไม่ เว้นแต่ตัวการจะได้ยินยอมด้วย"],["826","b3t15","หมวด ๕ ความระงับสิ้นไปแห่งสัญญาตัวแทน","","มาตรา ๘๒๖ อันสัญญาตัวแทนย่อมระงับสิ้นไปด้วยตัวการถอนตัวแทน หรือด้วยตัวแทนบอกเลิกเป็นตัวแทน\nอนึ่ง สัญญาตัวแทนย่อมระงับสิ้นไป เมื่อคู่สัญญาฝ่ายใดฝ่ายหนึ่งตาย หรือตกเป็นผู้ไร้ความสามารถ หรือล้มละลาย เว้นแต่จะปรากฏว่าขัดกับข้อสัญญาหรือสภาพแห่งกิจการนั้น"],["827","b3t15","หมวด ๕ ความระงับสิ้นไปแห่งสัญญาตัวแทน","","มาตรา ๘๒๗ ตัวการจะถอนตัวแทน และตัวแทนจะบอกเลิกเป็นตัวแทนเสียในเวลาใด ๆ ก็ได้ทุกเมื่อ\nคู่สัญญาฝ่ายซึ่งถอนตัวแทนหรือบอกเลิกเป็นตัวแทนในเวลาที่ไม่สะดวกแก่อีกฝ่ายหนึ่ง จะต้องรับผิดต่อคู่สัญญาฝ่ายนั้นในความเสียหายอย่างใด ๆ อันเกิดแต่การนั้น เว้นแต่ในกรณีที่เป็นความจำเป็นอันมิอาจจะก้าวล่วงเสียได้"],["828","b3t15","หมวด ๕ ความระงับสิ้นไปแห่งสัญญาตัวแทน","","มาตรา ๘๒๘ เมื่อสัญญาตัวแทนระงับสิ้นไปเพราะตัวการตายก็ดี ตัวการตกเป็นผู้ไร้ความสามารถหรือล้มละลายก็ดี ท่านว่าตัวแทนต้องจัดการอันสมควรทุกอย่างเพื่อจะปกปักรักษาประโยชน์อันเขาได้มอบหมายแก่ตนไป จนกว่าทายาทหรือผู้แทนของตัวการจะอาจเข้าปกปักรักษาประโยชน์นั้น ๆ ได้"],["829","b3t15","หมวด ๕ ความระงับสิ้นไปแห่งสัญญาตัวแทน","","มาตรา ๘๒๙ เมื่อสัญญาตัวแทนระงับสิ้นไปเพราะตัวแทนตายก็ดี ตัวแทนตกเป็นผู้ไร้ความสามารถหรือล้มละลายก็ดี ท่านว่าทายาทหรือบุคคลผู้รับหน้าที่ดูแลทรัพย์มรดกของตัวแทนโดยชอบด้วยกฎหมายต้องบอกกล่าวแก่ตัวการและจัดการเพื่อปกปักรักษาประโยชน์ของตัวการไปตามสมควรแก่พฤติการณ์ จนกว่าตัวการอาจเข้าปกปักรักษาประโยชน์นั้น ๆ ได้"],["830","b3t15","หมวด ๕ ความระงับสิ้นไปแห่งสัญญาตัวแทน","","มาตรา ๘๓๐ อันเหตุที่ทำให้สัญญาตัวแทนระงับสิ้นไปนั้นจะเกิดแต่ตัวการหรือตัวแทนก็ตาม ท่านห้ามมิให้ยกขึ้นเป็นข้อต่อสู้คู่สัญญาอีกฝ่ายหนึ่ง จนกว่าจะได้บอกกล่าวเหตุนั้น ๆ ไปยังคู่สัญญาฝ่ายนั้นแล้ว หรือจนกว่าคู่สัญญาฝ่ายนั้นจะได้ทราบเหตุแล้ว"],["831","b3t15","หมวด ๕ ความระงับสิ้นไปแห่งสัญญาตัวแทน","","มาตรา ๘๓๑ อันความระงับสิ้นไปแห่งสัญญาตัวแทนนั้น ท่านห้ามมิให้ยกขึ้นเป็นข้อต่อสู้บุคคลภายนอกผู้ทำการโดยสุจริต เว้นแต่บุคคลภายนอกหากไม่ทราบความนั้นเพราะความประมาทเลินเล่อของตนเอง"],["832","b3t15","หมวด ๕ ความระงับสิ้นไปแห่งสัญญาตัวแทน","","มาตรา ๘๓๒ ในเมื่อสัญญาตัวแทนระงับสิ้นไป ตัวการชอบที่จะเรียกให้เวนคืนหนังสือมอบอำนาจอย่างใด ๆ อันได้ให้ไว้แก่ตัวแทนนั้นได้"],["833","b3t15","หมวด ๖ ตัวแทนค้าต่าง","","มาตรา ๘๓๓ อันว่าตัวแทนค้าต่าง คือบุคคลซึ่งในทางค้าขายของเขาย่อมทำการซื้อ หรือขายทรัพย์สิน หรือรับจัดทำกิจการค้าขายอย่างอื่นในนามของตนเองต่างตัวการ"],["834","b3t15","หมวด ๖ ตัวแทนค้าต่าง","","มาตรา ๘๓๔ ถ้ามิได้ตกลงกันไว้เป็นอย่างอื่น ท่านว่าตัวแทนค้าต่างชอบที่จะได้รับบำเหน็จโดยอัตราตามธรรมเนียมเพื่อกิจการอันขายอันตนได้จัดการให้ตกลงไปนั้นทุกรายไป"],["835","b3t15","หมวด ๖ ตัวแทนค้าต่าง","","มาตรา ๘๓๕ บทบัญญัติทั้งหลายแห่งประมวลกฎหมายนี้อันว่าด้วยตัวแทนนั้น ท่านให้ใช้บังคับถึงตัวแทนค้าต่างด้วยเพียงที่ไม่ขัดกับบทบัญญัติในหมวดนี้"],["836","b3t15","หมวด ๖ ตัวแทนค้าต่าง","","มาตรา ๘๓๖ บุคคลผู้ไร้ความสามารถหาอาจจะทำการเป็นตัวแทนค้าต่างได้ไม่ เว้นแต่จะได้รับอำนาจโดยชอบให้ทำได้"],["837","b3t15","หมวด ๖ ตัวแทนค้าต่าง","","มาตรา ๘๓๗ ในการที่ตัวแทนค้าต่างทำการขายหรือซื้อหรือจัดทำกิจการค้าขายอย่างอื่นต่างตัวการนั้น ท่านว่าตัวแทนค้าต่างย่อมได้ซึ่งสิทธิอันมีต่อคู่สัญญาอีกฝ่ายหนึ่งในกิจการเช่นนั้น และตัวแทนค้าต่างย่อมเป็นผู้ต้องผูกพันต่อคู่สัญญาฝ่ายนั้นด้วย"],["838","b3t15","หมวด ๖ ตัวแทนค้าต่าง","","มาตรา ๘๓๘ ถ้าคู่สัญญาอีกฝ่ายหนึ่งไม่ชำระหนี้ไซร้ ท่านว่าตัวแทนค้าต่างหาต้องรับผิดต่อตัวการเพื่อชำระหนี้นั้นเองไม่ เว้นแต่จะได้มีข้อกำหนดในสัญญาหรือมีปริยายแต่ทางการที่ตัวการกับตัวแทนประพฤติต่อกัน หรือมีธรรมเนียมในท้องถิ่นว่าจะต้องรับผิดถึงเพียงนั้น\nอนึ่ง ตัวแทนค้าต่างคนใดเข้ารับประกันการปฏิบัติตามสัญญาโดยนัยดังกล่าวมาในวรรคก่อนนั้นไซร้ ท่านว่าตัวแทนคนนั้นชื่อว่าเป็นตัวแทนฐานประกัน ชอบที่จะได้รับบำเหน็จพิเศษ"],["839","b3t15","หมวด ๖ ตัวแทนค้าต่าง","","มาตรา ๘๓๙ ถ้าตัวแทนค้าต่างได้ทำการขายเป็นราคาต่ำไปกว่าที่ตัวการกำหนด หรือทำการซื้อเป็นราคาสูงไปกว่าที่ตัวการกำหนดไซร้ หากว่าตัวแทนรับใช้เศษที่ขาดเกินนั้นแล้ว ท่านว่าการขายหรือการซื้ออันนั้นตัวการก็ต้องรับขายรับซื้อ"],["840","b3t15","หมวด ๖ ตัวแทนค้าต่าง","","มาตรา ๘๔๐ ถ้าตัวแทนค้าต่างได้ทำการขายได้ราคาสูงกว่าที่ตัวการกำหนด หรือทำการซื้อได้ราคาต่ำกว่าที่ตัวการกำหนดไซร้ ท่านว่าตัวแทนหาอาจจะถือเอาเป็นประโยชน์ของตนได้ไม่ ต้องคิดให้แก่ตัวการ"],["841","b3t15","หมวด ๖ ตัวแทนค้าต่าง","","มาตรา ๘๔๑ ตัวแทนค้าต่างทำการไปอย่างไรบ้าง ท่านให้แถลงรายงานแก่ตัวการ และเมื่อได้ทำการค้าต่างเสร็จลงแล้ว ก็ให้แจ้งแก่ตัวการทราบมิให้ชักช้า"],["842","b3t15","หมวด ๖ ตัวแทนค้าต่าง","","มาตรา ๘๔๒ เมื่อใดเขามอบหมายทรัพย์สินไว้แก่ตัวแทนค้าต่าง ท่านให้นำบทบัญญัติทั้งหลายแห่งประมวลกฎหมายนี้ ลักษณะฝากทรัพย์มาใช้บังคับ อนุโลมตามควร\nอนึ่ง ในกรณีที่เป็นความจำเป็นอันมิก้าวล่วงเสียได้ ท่านว่าตัวแทนค้าต่างจะจัดการแก่ทรัพย์สินนั้นตามวิธีการดังบัญญัติไว้ในมาตรา ๖๓๑ ว่าด้วยรับขนนั้นก็ได้"],["843","b3t15","หมวด ๖ ตัวแทนค้าต่าง","","มาตรา ๘๔๓ ตัวแทนค้าต่างคนใดได้รับคำสั่งให้ขายหรือซื้อทรัพย์สินอันมีรายการขานราคาของสถานแลกเปลี่ยน ท่านว่าตัวแทนคนนั้นจะเป็นผู้ซื้อหรือผู้ขายเองก็ได้ เว้นแต่จะมีข้อห้ามไว้ชัดแจ้งโดยสัญญา ในกรณีเช่นนั้น ราคาอันจะพึงใช้เงินแก่กันก็พึงกำหนดตามรายการขานราคาทรัพย์สินนั้น ณ สถานแลกเปลี่ยนในเวลาเมื่อตัวแทนค้าต่างให้คำบอกกล่าวว่าตนจะเป็นผู้ซื้อหรือผู้ขาย\nเมื่อตัวการรับคำบอกกล่าวเช่นนั้น ถ้าไม่บอกปัดเสียในทันที ท่านให้ถือว่าตัวการเป็นอันได้สนองรับการนั้นแล้ว\nอนึ่ง แม้ในกรณีเช่นนั้น ตัวแทนค้าต่างจะคิดเอาบำเหน็จก็ย่อมคิดได้"],["844","b3t15","หมวด ๖ ตัวแทนค้าต่าง","","มาตรา ๘๔๔ ในระหว่างตัวการกับตัวแทนค้าต่าง ท่านให้ถือว่ากิจการอันตัวแทนได้ทำให้ตกลงไปนั้น ย่อมมีผลเสมือนดังว่าได้ทำให้ตกลงไปในนามของตัวการโดยตรง"],["845","b3t16","","","มาตรา ๘๔๕ บุคคลผู้ใดตกลงจะให้ค่าบำเหน็จแก่นายหน้าเพื่อที่ชี้ช่องให้ได้เข้าทำสัญญาก็ดี จัดการให้ได้ทำสัญญากันก็ดี ท่านว่าบุคคลผู้นั้นจะต้องรับผิดใช้ค่าบำเหน็จก็ต่อเมื่อสัญญานั้นได้ทำกันสำเร็จเนื่องแต่ผลแห่งการที่นายหน้าได้ชี้ช่องหรือจัดการนั้น ถ้าสัญญาที่ได้ทำกันไว้นั้นมีเงื่อนไขเป็นเงื่อนบังคับก่อนไซร้ ท่านว่าจะเรียกร้องบำเหน็จค่านายหน้ายังหาได้ไม่ จนกว่าเงื่อนไขนั้นสำเร็จแล้ว\nนายหน้ามีสิทธิจะได้รับชดใช้ค่าใช้จ่ายที่ได้เสียไปก็ต่อเมื่อได้ตกลงกันไว้เช่นนั้น ความข้อนี้ท่านให้ใช้บังคับแม้ถึงว่าสัญญาจะมิได้ทำกันสำเร็จ"],["846","b3t16","","","มาตรา ๘๔๖ ถ้ากิจการอันได้มอบหมายแก่นายหน้านั้นโดยพฤติการณ์เป็นที่คาดหมายได้ว่าย่อมทำให้แต่เพื่อจะเอาค่าบำเหน็จไซร้ ท่านให้ถือว่าได้ตกลงกันโดยปริยายว่ามีค่าบำเหน็จนายหน้า\nค่าบำเหน็จนั้นถ้ามิได้กำหนดจำนวนกันไว้ ท่านให้ถือว่าได้ตกลงกันเป็นจำนวนตามธรรมเนียม"],["847","b3t16","","","มาตรา ๘๔๗ ถ้านายหน้าทำการให้แก่บุคคลภายนอกด้วยก็ดี หรือได้รับคำมั่นแต่บุคคลภายนอกเช่นนั้นว่าจะให้ค่าบำเหน็จอันไม่ควรแก่นายหน้าผู้กระทำการโดยสุจริตก็ดี เป็นการฝ่าฝืนต่อการที่ตนเข้ารับทำหน้าที่ไซร้ ท่านว่านายหน้าหามีสิทธิจะได้รับค่าบำเหน็จหรือรับชดใช้ค่าใช้จ่ายที่ได้เสียไปไม่"],["848","b3t16","","","มาตรา ๘๔๘ ตัวนายหน้าไม่ต้องรับผิดไปถึงการชำระหนี้ตามสัญญาซึ่งได้ทำต่อกันเพราะตนเป็นสื่อ เว้นแต่จะมิได้บอกชื่อของฝ่ายหนึ่งให้รู้ถึงอีกฝ่ายหนึ่ง"],["849","b3t16","","","มาตรา ๘๔๙ การรับเงินหรือรับชำระหนี้อันจะพึงชำระตามสัญญานั้น ท่านให้สันนิษฐานไว้ก่อนว่านายหน้าย่อมไม่มีอำนาจที่จะรับแทนผู้เป็นคู่สัญญา"],["850","b3t17","","","มาตรา ๘๕๐ อันว่าประนีประนอมยอมความนั้น คือสัญญาซึ่งผู้เป็นคู่สัญญาทั้งสองฝ่ายระงับข้อพิพาทอันใดอันหนึ่งซึ่งมีอยู่หรือจะมีขึ้นนั้นให้เสร็จไปด้วยต่างยอมผ่อนผันให้แก่กัน"],["851","b3t17","","","มาตรา ๘๕๑ อันสัญญาประนีประนอมยอมความนั้น ถ้ามิได้มีหลักฐานเป็นหนังสืออย่างใดอย่างหนึ่งลงลายมือชื่อฝ่ายที่ต้องรับผิด หรือลายมือชื่อตัวแทนของฝ่ายนั้นเป็นสำคัญ ท่านว่าจะฟ้องร้องให้บังคับคดีหาได้ไม่"],["852","b3t17","","","มาตรา ๘๕๒ ผลของสัญญาประนีประนอมยอมความนั้น ย่อมทำให้การเรียกร้องซึ่งแต่ละฝ่ายได้ยอมสละนั้นระงับสิ้นไป และทำให้แต่ละฝ่ายได้สิทธิตามที่แสดงในสัญญานั้นว่าเป็นของตน"],["853","b3t18","","","มาตรา ๘๕๓ อันการพนันหรือขันต่อนั้น ท่านว่าหาก่อให้เกิดหนี้ไม่ สิ่งที่ได้ให้กันไปในการพนันหรือขันต่อก็จะทวงคืนไม่ได้ เพราะเหตุหามูลหนี้อย่างหนึ่งอย่างใดมิได้\nข้อบัญญัติที่กล่าวนี้ ท่านให้ใช้ตลอดถึงข้อตกลงเป็นมูลหนี้อย่างหนึ่งอย่างใดอันฝ่ายข้างเสียพนันขันต่อหากทำให้แก่อีกฝ่ายหนึ่งเพื่อจะใช้หนี้เงินพนันหรือขันต่อนั้นด้วย"],["854","b3t18","","","มาตรา ๘๕๔ อันการออกสลากกินแบ่งก็ดี ออกสลากกินรวบก็ดี ท่านว่าเป็นสัญญาอันจะผูกพันต่อเมื่อรัฐบาลได้ให้อำนาจหรือให้สัตยาบันแก่การนั้นเฉพาะราย นอกนั้นท่านให้บังคับตามบทบัญญัติมาตรา ๘๕๓"],["855","b3t18","","","มาตรา ๘๕๕ ภายในบังคับแห่งบทบัญญัติมาตรา ๓๑๒ และมาตรา ๙๑๖ ตั๋วเงินหรือเอกสารอย่างอื่นทุกฉบับซึ่งออกให้เต็มจำนวน หรือแต่โดยส่วน เพื่อแทนเงินใด ๆ อันได้แต่ชนะพนันหรือขัดต่อก็ดี ออกให้เพื่อใช้เงินที่ยืมมาใช้ในการพนันหรือขันต่อเช่นว่านั้นก็ดี ท่านว่าไม่สมบูรณ์\nเพื่อประโยชน์แห่งบทบัญญัตินี้ เงินรายได้ให้ยืมแก่บุคคลกำลังเล่นการพนันหรือขันต่อ ในเวลาหรือ ณ สถานที่เล่นเช่นนั้น ท่านให้สันนิษฐานไว้ก่อนว่าเงินนั้นได้ให้ยืมไปเพื่อเล่นการพนันหรือขันต่อ"],["856","b3t19","","","มาตรา ๘๕๖ อันว่าสัญญาบัญชีเดินสะพัดนั้น คือสัญญาซึ่งบุคคลสองคนตกลงกันว่าสืบแต่นั้นไป หรือในชั่วเวลากำหนดอันใดอันหนึ่ง ให้ตัดทอนบัญชีหนี้ทั้งหมดหรือแต่บางส่วนอันเกิดขึ้นแต่กิจการในระหว่างเขาทั้งสองนั้นหักกลบลบกัน และคงชำระแต่ส่วนที่เป็นจำนวนคงเหลือโดยดุลยภาค"],["857","b3t19","","","มาตรา ๘๕๗ การนำตั๋วเงินลงเป็นรายการในบัญชีเดินสะพัดนั้น ท่านให้สันนิษฐานไว้ก่อนว่าได้ลงด้วยเงื่อนไขว่าจะมีผู้ชำระเงินตามตั๋วนั้น ถ้าและตั๋วนั้นมิได้ชำระเงินไซร้ จะเพิกถอนรายการอันนั้นเสียก็ได้"],["858","b3t19","","","มาตรา ๘๕๘ ถ้าคู่สัญญามิได้กำหนดกันไว้ว่าให้หักทอนบัญชีโดยระยะเวลาอย่างไรไซร้ ท่านให้ถือเอาเป็นกำหนดหกเดือน"],["859","b3t19","","","มาตรา ๘๕๙ คู่สัญญาฝ่ายใดจะบอกเลิกสัญญาบัญชีเดินสะพัด และให้หักทอนบัญชีกันเสียในเวลาใด ๆ ก็ได้ ถ้าไม่มีอะไรปรากฏเป็นข้อขัดกับที่กล่าวมานี้"],["860","b3t19","","","มาตรา ๘๖๐ เงินส่วนที่ผิดกันอยู่นั้นถ้ายังมิได้ชำระ ท่านให้คิดดอกเบี้ยนับแต่วันที่หักทอนบัญชีเสร็จเป็นต้นไป"],["861","b3t20","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๘๖๑ อันว่าสัญญาประกันภัยนั้น คือสัญญาซึ่งบุคคลหนึ่งตกลงจะใช้ค่าสินไหมทดแทน หรือใช้เงินจำนวนหนึ่งให้ในกรณีวินาศภัยหากมีขึ้น หรือในเหตุอย่างอื่นในอนาคตดังได้ระบุไว้ในสัญญา และในการนี้บุคคลอีกคนหนึ่งตกลงจะส่งเงินซึ่งเรียกว่า เบี้ยประกันภัย"],["862","b3t20","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๘๖๒ ตามข้อความในลักษณะนี้\nคำว่า “ผู้รับประกันภัย” ท่านหมายความว่า คู่สัญญาฝ่ายซึ่งตกลงจะใช้ค่าสินไหมทดแทน หรือใช้เงินจำนวนหนึ่งให้\nคำว่า “ผู้เอาประกันภัย” ท่านหมายความว่า คู่สัญญาฝ่ายซึ่งตกลงจะส่งเบี้ยประกันภัย\nคำว่า “ผู้รับประโยชน์” ท่านหมายความว่า บุคคลผู้จะพึงได้รับค่าสินไหมทดแทน หรือรับจำนวนเงินใช้ให้\nอนึ่ง ผู้เอาประกันภัยและผู้รับประโยชน์นั้น จะเป็นบุคคลคนหนึ่งคนเดียวกันก็ได้"],["863","b3t20","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๘๖๓ อันสัญญาประกันภัยนั้น ถ้าผู้เอาประกันภัยมิได้มีส่วนได้เสียในเหตุที่ประกันภัยไว้นั้นไซร้ ท่านว่าย่อมไม่ผูกพันคู่สัญญาแต่อย่างหนึ่งอย่างใด"],["864","b3t20","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๘๖๔ เมื่อคู่สัญญาประกันภัยยกเอาภัยใดโดยเฉพาะขึ้นเป็นข้อพิจารณาในการวางกำหนดจำนวนเบี้ยประกันภัย และภัยเช่นนั้นสิ้นไปหามีไม่แล้ว ท่านว่าภายหน้าแต่นั้นไป ผู้เอาประกันภัยชอบที่จะได้ลดเบี้ยประกันภัยลงตามส่วน"],["865","b3t20","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๘๖๕ ถ้าในเวลาทำสัญญาประกันภัย ผู้เอาประกันภัยก็ดี หรือในกรณีประกันชีวิต บุคคลอันการใช้เงินย่อมอาศัยความทรงชีพหรือมรณะของเขานั้นก็ดี รู้อยู่แล้วละเว้นเสียไม่เปิดเผยข้อความจริงซึ่งอาจจะได้จูงใจผู้รับประกันภัยให้เรียกเบี้ยประกันภัยสูงขึ้นอีกหรือให้บอกปัดไม่ยอมทำสัญญา หรือว่ารู้อยู่แล้วแถลงข้อความนั้นเป็นความเท็จไซร้ ท่านว่าสัญญานั้นเป็นโมฆียะ\nถ้ามิได้ใช้สิทธิบอกล้างภายในกำหนดเดือนหนึ่งนับแต่วันที่ผู้รับประกันภัยทราบมูลอันจะบอกล้างได้ก็ดี หรือมิได้ใช้สิทธินั้นภายในกำหนดห้าปีนับแต่วันทำสัญญาก็ดี ท่านว่าสิทธินั้นเป็นอันระงับสิ้นไป"],["866","b3t20","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๘๖๖ ถ้าผู้รับประกันภัยได้รู้ข้อความจริงดังกล่าวในมาตรา ๘๖๕ นั้นก็ดี หรือรู้ว่าข้อแถลงความเป็นความเท็จก็ดี หรือควรจะได้รู้เช่นนั้นหากใช้ความระมัดระวังดังจะพึงคาดหมายได้แต่วิญญูชนก็ดี ท่านให้ฟังว่าสัญญานั้นเป็นอันสมบูรณ์"],["867","b3t20","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๘๖๗ อันสัญญาประกันภัยนั้น ถ้ามิได้มีหลักฐานเป็นหนังสืออย่างใดอย่างหนึ่งลงลายมือชื่อฝ่ายที่ต้องรับผิดหรือลายมือชื่อตัวแทนของฝ่ายนั้นเป็นสำคัญ ท่านว่าจะฟ้องร้องให้บังคับคดีหาได้ไม่\nให้ส่งมอบกรมธรรม์ประกันภัยอันมีเนื้อความต้องตามสัญญานั้นแก่ผู้เอาประกันภัยฉบับหนึ่ง\nกรมธรรม์ประกันภัย ต้องลงลายมือชื่อของผู้รับประกันภัย และมีรายการดังต่อไปนี้\n(๑) วัตถุที่เอาประกันภัย\n(๒) ภัยใดซึ่งผู้รับประกันภัยรับเสี่ยง\n(๓) ราคาแห่งมูลประกันภัย ถ้าหากได้กำหนดกันไว้\n(๔) จำนวนเงินซึ่งเอาประกันภัย\n(๕) จำนวนเบี้ยประกันภัย และวิธีส่งเบี้ยประกันภัย\n(๖) ถ้าหากสัญญาประกันภัยมีกำหนดเวลา ต้องลงเวลาเริ่มต้นและเวลาสิ้นสุดไว้ด้วย\n(๗) ชื่อหรือยี่ห้อของผู้รับประกันภัย\n(๘) ชื่อหรือยี่ห้อของผู้เอาประกันภัย\n(๙) ชื่อของผู้รับประโยชน์ ถ้าจะพึงมี\n(๑๐) วันทำสัญญาประกันภัย\n(๑๑) สถานที่และวันที่ได้ทำกรมธรรม์ประกันภัย"],["868","b3t20","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๘๖๘ อันสัญญาประกันภัยทะเล ท่านให้บังคับตามบทบัญญัติแห่งกฎหมายทะเล"],["869","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๘๖๙ อันคำว่า “วินาศภัย” ในหมวดนี้ ท่านหมายรวมเอาความเสียหายอย่างใด ๆ บรรดาซึ่งจะพึงประมาณเป็นเงินได้"],["870","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๘๗๐ ถ้าได้ทำสัญญาประกันภัยเป็นสองรายหรือกว่านั้นพร้อมกันเพื่อความวินาศภัยอันเดียวกัน และจำนวนเงินซึ่งเอาประกันภัยรวมกันทั้งหมดนั้นท่วมจำนวนที่วินาศจริงไซร้ ท่านว่าผู้รับประโยชน์ชอบที่จะได้รับค่าสินไหมทดแทนเพียงเสมอจำนวนวินาศจริงเท่านั้น ผู้รับประกันภัยแต่ละคนต้องใช้เงินจำนวนวินาศจริงแบ่งตามส่วนมากน้อยที่ตนได้รับประกันภัยไว้\nอันสัญญาประกันภัยทั้งหลาย ถ้าลงวันเดียวกัน ท่านให้ถือว่าได้ทำพร้อมกัน\nถ้าได้ทำสัญญาประกันภัยเป็นสองรายหรือกว่านั้นสืบเนื่องเป็นลำดับกัน ท่านว่าผู้รับประกันภัยคนแรกจะต้องรับผิดเพื่อความวินาศภัยก่อน ถ้าและจำนวนเงินซึ่งผู้รับประกันภัยคนแรกได้ใช้นั้นยังไม่คุ้มจำนวนวินาศภัยไซร้ ผู้รับประกันภัยคนถัดไปก็ต้องรับผิดในส่วนที่ยังขาดอยู่นั้นต่อ ๆ กันไปจนกว่าจะคุ้มวินาศ"],["871","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๘๗๑ ถ้าได้ทำสัญญาประกันภัยเป็นสองรายหรือกว่านั้นพร้อมกันก็ดี หรือสืบเนื่องเป็นลำดับกันก็ดี ท่านว่าการที่ยอมสละสิทธิอันมีต่อผู้รับประกันภัยรายหนึ่งนั้น ไม่กระทบกระทั่งถึงสิทธิและหน้าที่ของผู้รับประกันภัยรายอื่น ๆ"],["872","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๘๗๒ ก่อนเริ่มเสี่ยงภัย ผู้เอาประกันภัยจะบอกเลิกสัญญาเสียก็ได้ แต่ผู้รับประกันภัยชอบที่จะได้เบี้ยประกันภัยกึ่งจำนวน"],["873","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๘๗๓ ถ้าในระหว่างอายุสัญญาประกันภัยนั้น มูลประกันภัยได้ลดน้อยถอยลงไปหนักไซร้ ท่านว่าผู้เอาประกันภัยชอบที่จะได้ลดจำนวนเงินซึ่งเอาประกันภัยไว้ และลดจำนวนเงินเบี้ยประกันภัย\nการลดจำนวนเบี้ยประกันภัยนั้น ให้เป็นผลต่อในอนาคต"],["874","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๘๗๔ ถ้าคู่สัญญาได้กำหนดราคาแห่งมูลประกันภัยไว้ ผู้รับประกันภัยชอบที่จะได้ลดจำนวนค่าสินไหมทดแทนก็แต่เมื่อพิสูจน์ได้ว่าราคาแห่งมูลประกันภัยตามที่ได้ตกลงกันไว้นั้นเป็นจำนวนสูงเกินไปหนัก และคืนจำนวนเบี้ยประกันภัยให้ตามส่วนกับทั้งดอกเบี้ยด้วย"],["875","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๘๗๕ ถ้าวัตถุอันได้เอาประกันภัยไว้นั้น เปลี่ยนมือไปจากผู้เอาประกันภัยโดยพินัยกรรมก็ดี หรือโดยบัญญัติกฎหมายก็ดี ท่านว่าสิทธิอันมีอยู่ในสัญญาประกันภัยก็ย่อมโอนตามไปด้วย\nถ้าในสัญญามิได้กำหนดไว้เป็นอย่างอื่น เมื่อผู้เอาประกันภัยโอนวัตถุที่เอาประกันภัยและบอกกล่าวการโอนไปยังผู้รับประกันภัยไซร้ ท่านว่าสิทธิอันมีอยู่ในสัญญาประกันภัยนั้นย่อมโอนตามไปด้วย อนึ่ง ถ้าในการโอนเช่นนี้ช่องแห่งภัยเปลี่ยนแปลงไปหรือเพิ่มขึ้นหนักไซร้ ท่านว่าสัญญาประกันภัยนั้นกลายเป็นโมฆะ"],["876","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๘๗๖ ถ้าผู้รับประกันภัยต้องคำพิพากษาให้เป็นคนล้มละลาย ผู้เอาประกันภัยจะเรียกให้หาประกันอันสมควรให้แก่ตนก็ได้ หรือจะบอกเลิกสัญญาเสียก็ได้\nถ้าผู้เอาประกันภัยต้องคำพิพากษาให้เป็นคนล้มละลาย ท่านให้ใช้วิธีเดียวกันนี้บังคับตามควรแก่เรื่อง แต่กระนั้นก็ดี ถ้าเบี้ยประกันภัยได้ส่งแล้วเต็มจำนวนเพื่ออายุประกันภัยเป็นระยะเวลามากน้อยเท่าใดไซร้ ท่านห้ามมิให้ผู้รับประกันภัยบอกเลิกสัญญาก่อนระยะเวลานั้นสุดลง"],["877","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๘๗๗ ผู้รับประกันภัยจำต้องใช้ค่าสินไหมทดแทนดังจะกล่าวต่อไปนี้ คือ\n(๑) เพื่อจำนวนวินาศภัยอันแท้จริง\n(๒) เพื่อความบุบสลายอันเกิดแก่ทรัพย์สินซึ่งได้เอาประกันภัยไว้เพราะได้จัดการตามสมควรเพื่อป้องปัดความวินาศภัย\n(๓) เพื่อบรรดาค่าใช้จ่ายอันสมควรซึ่งได้เสียไปเพื่อรักษาทรัพย์สินซึ่งเอาประกันภัยไว้นั้นมิให้วินาศ\nอันจำนวนวินาศจริงนั้น ท่านให้ตีราคา ณ สถานที่และในเวลาซึ่งเหตุวินาศภัยนั้นได้เกิดขึ้น อนึ่ง จำนวนเงินซึ่งได้เอาประกันภัยไว้นั้น ท่านให้สันนิษฐานไว้ก่อนว่าเป็นหลักประมาณอันถูกต้องในการตีราคาเช่นว่านั้น\nท่านห้ามมิให้คิดค่าสินไหมทดแทนเกินไปกว่าจำนวนเงินซึ่งเอาประกันภัยไว้"],["878","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๘๗๘ ค่าใช้จ่ายในการตีราคาวินาศภัยนั้น ท่านว่าผู้รับประกันภัยต้องเป็นผู้ออกใช้"],["879","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๘๗๙ ผู้รับประกันภัยไม่ต้องรับผิดในเมื่อความวินาศภัยหรือเหตุอื่นซึ่งได้ระบุไว้ในสัญญานั้นได้เกิดขึ้นเพราะความทุจริต หรือความประมาทเลินเล่ออย่างร้ายแรงของผู้เอาประกันภัยหรือผู้รับประโยชน์\nผู้รับประกันภัยไม่ต้องรับผิดในความวินาศภัยอันเป็นผลโดยตรงมาแต่ความไม่สมประกอบในเนื้อแห่งวัตถุที่เอาประกันภัย เว้นแต่จะได้ตกลงกันเป็นอย่างอื่น"],["880","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๘๘๐ ถ้าความวินาศภัยนั้นได้เกิดขึ้นเพราะการกระทำของบุคคลภายนอกไซร้ ผู้รับประกันภัยได้ใช้ค่าสินไหมทดแทนไปเป็นจำนวนเพียงใด ผู้รับประกันภัยย่อมเข้ารับช่วงสิทธิของผู้เอาประกันภัยและของผู้รับประโยชน์ซึ่งมีต่อบุคคลภายนอกเพียงนั้น\nถ้าผู้รับประกันภัยได้ใช้ค่าสินไหมทดแทนไปแต่เพียงบางส่วนไซร้ ท่านห้ามมิให้ผู้รับประกันภัยนั้นใช้สิทธิของตนให้เสื่อมเสียสิทธิของผู้เอาประกันภัยหรือผู้รับประโยชน์ ในการที่เขาจะเรียกร้องเอาค่าสินไหมทดแทนจากบุคคลภายนอกเพื่อเศษแห่งจำนวนวินาศนั้น"],["881","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๘๘๑ ถ้าความวินาศเกิดขึ้นเพราะภัยมีขึ้นดังผู้รับประกันภัยตกลงประกันภัยไว้ไซร้ เมื่อผู้เอาประกันภัยหรือผู้รับประโยชน์ทราบความวินาศนั้นแล้ว ต้องบอกกล่าวแก่ผู้รับประกันภัยโดยไม่ชักช้า\nถ้ามิได้ปฏิบัติตามบทบัญญัติที่กล่าวมาในวรรคก่อน ผู้รับประกันภัยอาจเรียกร้องค่าสินไหมทดแทนเพื่อความเสียหายอย่างใด ๆ อันเกิดแต่การนั้นได้ เว้นแต่อีกฝ่ายหนึ่งจะพิสูจน์ได้ว่าไม่สามารถที่จะปฏิบัติได้"],["882","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๑ บทเบ็ดเสร็จทั่วไป","มาตรา ๘๘๒ ในการเรียกให้ใช้ค่าสินไหมทดแทน ท่านห้ามมิให้ฟ้องคดีเมื่อพ้นกำหนดสองปีนับแต่วันวินาศภัย\nในการเรียกให้ใช้หรือให้คืนเบี้ยประกันภัย ท่านห้ามมิให้ฟ้องคดีเมื่อพ้นเวลาสองปีนับแต่วันซึ่งสิทธิจะเรียกให้ใช้หรือคืนเบี้ยประกันภัยถึงกำหนด"],["883","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๒ วิธีเฉพาะการประกันภัยในการรับขน","มาตรา ๘๘๓ อันสัญญาประกันภัยในการรับขนนั้น ย่อมคุ้มถึงความวินาศภัยทุกอย่างซึ่งอาจเกิดแก่ของที่ขนส่งในระหว่างเวลาตั้งแต่ผู้ขนส่งได้รับของไป จนได้ส่งมอบของนั้นแก่ผู้รับตราส่ง และจำนวนค่าสินไหมทดแทนนั้น ย่อมกำหนดตามที่ของซึ่งขนส่งนั้นจะได้มีราคาเมื่อถึงตำบลอันกำหนดให้ส่ง"],["884","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๒ วิธีเฉพาะการประกันภัยในการรับขน","มาตรา ๘๘๔ ถ้าของซึ่งขนส่งนั้นได้เอาประกันภัยเมื่ออยู่ในระหว่างส่งเดินทางไป ท่านให้คิดมูลประกันภัยในของนั้นนับรวมทั้งราคาของ ณ สถานที่และในเวลาที่ผู้ขนส่งได้รับของ และให้เพิ่มค่าระวางส่งของไปยังสถานที่ส่งมอบแก่ผู้รับตราส่ง กับทั้งค่าใช้จ่ายอื่น ๆ เนื่องด้วยการส่งของไปนั้นเข้าด้วย\nกำไรอันจะพึงได้ในเวลาเมื่อส่งมอบของนั้นย่อมจะคิดรวมเข้าเป็นมูลประกันภัยได้ต่อเมื่อได้มีข้อตกลงกันไว้เช่นนั้นชัดแจ้ง"],["885","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๒ วิธีเฉพาะการประกันภัยในการรับขน","มาตรา ๘๘๕ อันสัญญาประกันภัยในการรับขนนั้น ถึงแม้การขนส่งจะต้องสะดุดหยุดลงชั่วขณะหรือจะต้องเปลี่ยนทางหรือเปลี่ยนวิธีขนส่งอย่างหนึ่งอย่างใดโดยเหตุจำเป็นในระหว่างส่งเดินทางก็ดี ท่านว่าสัญญานั้นก็ย่อมคงเป็นอันสมบูรณ์อยู่ เว้นแต่จะได้ระบุไว้ในสัญญาเป็นอย่างอื่น"],["886","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๒ วิธีเฉพาะการประกันภัยในการรับขน","มาตรา ๘๘๖ อันกรมธรรม์ประกันภัยในการรับขนนั้น นอกจากที่ได้ระบุไว้แล้วในมาตรา ๘๖๗ ต้องมีรายการเพิ่มขึ้นอีกดังจะกล่าวต่อไปนี้ คือ\n(๑) ระบุทางและวิธีขนส่ง\n(๒) ชื่อหรือยี่ห้อของผู้ขนส่ง\n(๓) สถานที่ซึ่งกำหนดให้รับและส่งมอบของ\n(๔) กำหนดระยะเวลาขนส่งตามแต่มี"],["887","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๓ ประกันภัยค้ำจุน","มาตรา ๘๘๗ อันว่าประกันภัยค้ำจุนนั้น คือสัญญาประกันภัยซึ่งผู้รับประกันภัยตกลงว่าจะใช้ค่าสินไหมทดแทนในนามของผู้เอาประกันภัย เพื่อความวินาศภัยอันเกิดขึ้นแก่บุคคลอีกคนหนึ่ง และซึ่งผู้เอาประกันภัยจะต้องรับผิดชอบ\nบุคคลผู้ต้องเสียหายชอบที่จะได้รับค่าสินไหมทดแทนตามที่ตนควรจะได้นั้นจากผู้รับประกันภัยโดยตรง แต่ค่าสินไหมทดแทนเช่นว่านี้หาอาจจะคิดเกินไปกว่าจำนวนอันผู้รับประกันภัยจะพึงต้องใช้ตามสัญญานั้นได้ไม่ ในคดีระหว่างบุคคลผู้ต้องเสียหายกับผู้รับประกันภัยนั้น ท่านให้ผู้ต้องเสียหายเรียกตัวผู้เอาประกันภัยเข้ามาในคดีด้วย\nอนึ่ง ผู้รับประกันภัยนั้นแม้จะได้ส่งค่าสินไหมทดแทนให้แก่ผู้เอาประกันภัยแล้ว ก็ยังหาหลุดพ้นจากความรับผิดต่อบุคคลผู้ต้องเสียหายนั้นไม่ เว้นแต่ตนจะพิสูจน์ได้ว่าสินไหมทดแทนนั้นผู้เอาประกันภัยได้ใช้แก่ผู้ต้องเสียหายแล้ว"],["888","b3t20","หมวด ๒ ประกันวินาศภัย","ส่วนที่ ๓ ประกันภัยค้ำจุน","มาตรา ๘๘๘ ถ้าค่าสินไหมทดแทนอันผู้รับประกันภัยได้ใช้ไปโดยคำพิพากษานั้นยังไม่คุ้มค่าวินาศภัยเต็มจำนวนไซร้ ท่านว่าผู้เอาประกันภัยก็ยังคงต้องรับใช้จำนวนที่ยังขาด เว้นไว้แต่บุคคลผู้ต้องเสียหายจะได้ละเลยเสียไม่เรียกตัวผู้เอาประกันภัยเข้ามาสู่คดีด้วยดังกล่าวไว้ในมาตราก่อน"],["889","b3t20","หมวด ๓ ประกันชีวิต","","มาตรา ๘๘๙ ในสัญญาประกันชีวิตนั้น การใช้จำนวนเงินย่อมอาศัยความทรงชีพ หรือมรณะของบุคคลคนหนึ่ง"],["890","b3t20","หมวด ๓ ประกันชีวิต","","มาตรา ๘๙๐ จำนวนเงินอันจะพึงใช้นั้น จะชำระเป็นเงินจำนวนเดียว หรือเป็นเงินรายปีก็ได้ สุดแล้วแต่จะตกลงกันระหว่างคู่สัญญา"],["891","b3t20","หมวด ๓ ประกันชีวิต","","มาตรา ๘๙๑ แม้ในกรณีที่ผู้เอาประกันภัยมิได้เป็นผู้รับประโยชน์เองก็ดี ผู้เอาประกันภัยย่อมมีสิทธิที่จะโอนประโยชน์แห่งสัญญานั้นให้แก่บุคคลอีกคนหนึ่งได้ เว้นแต่จะได้ส่งมอบกรมธรรม์ประกันภัยให้แก่ผู้รับประโยชน์ไปแล้ว และผู้รับประโยชน์ได้บอกกล่าวเป็นหนังสือไปยังผู้รับประกันภัยแล้วว่าตนจำนงจะถือเอาประโยชน์แห่งสัญญานั้น\nถ้ากรมธรรม์ประกันภัยได้ทำเป็นรูปให้ใช้เงินตามเขาสั่งแล้ว ท่านให้นำบทบัญญัติมาตรา ๓๐๙ มาใช้บังคับ"],["892","b3t20","หมวด ๓ ประกันชีวิต","","มาตรา ๘๙๒ ในกรณีบอกล้างสัญญาตามความในมาตรา ๘๖๕ ผู้รับประกันภัยต้องคืนค่าไถ่ถอนกรมธรรม์ประกันภัยให้แก่ผู้เอาประกันภัยหรือทายาทของผู้นั้น"],["893","b3t20","หมวด ๓ ประกันชีวิต","","มาตรา ๘๙๓ การใช้เงินอาศัยเหตุความทรงชีพ หรือมรณะของบุคคลผู้ใด แม้ได้แถลงอายุของบุคคลผู้นั้นไว้คลาดเคลื่อนไม่ถูกต้องเป็นเหตุให้ได้กำหนดจำนวนเบี้ยประกันภัยไว้ต่ำไซร้ ท่านให้ลดจำนวนเงินอันผู้รับประกันภัยจะพึงต้องใช้นั้นลงตามส่วน\nแต่ถ้าผู้รับประกันภัยพิสูจน์ได้ว่าในขณะที่ทำสัญญานั้น อายุที่ถูกต้องแท้จริงอยู่นอกจำกัดอัตราตามทางค้าปกติของเขาแล้ว ท่านว่าสัญญานั้นเป็นโมฆียะ"],["894","b3t20","หมวด ๓ ประกันชีวิต","","มาตรา ๘๙๔ ผู้เอาประกันภัยชอบที่จะบอกเลิกสัญญาประกันภัยเสียในเวลาใด ๆ ก็ได้ด้วยการงดไม่ส่งเบี้ยประกันภัยต่อไป ถ้าและได้ส่งเบี้ยประกันภัยมาแล้วอย่างน้อยสามปีไซร้ ท
