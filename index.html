ะได้รับบำเหน็จจากกองมรดก เว้นแต่พินัยกรรม หรือทายาทโดยจำนวนข้างมากจะได้กำหนดให้ไว้"],["1722","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๒๒ ผู้จัดการมรดกจะทำนิติกรรมใด ๆ ซึ่งตนมีส่วนได้เสียเป็นปฏิปักษ์ต่อกองมรดกหาได้ไม่ เว้นแต่พินัยกรรมจะได้อนุญาตไว้ หรือได้รับอนุญาตจากศาล"],["1723","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๒๓ ผู้จัดการมรดกต้องจัดการโดยตนเอง เว้นแต่จะทำการโดยตัวแทนได้ตามอำนาจที่ให้ไว้ชัดแจ้งหรือโดยปริยายในพินัยกรรม หรือโดยคำสั่งศาล หรือในพฤติการณ์เพื่อประโยชน์แก่กองมรดก"],["1724","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๒๔ ทายาทย่อมมีความผูกพันต่อบุคคลภายนอกในกิจการทั้งหลายอันผู้จัดการมรดกได้ทำไปภายในขอบอำนาจในฐานะที่เป็นผู้จัดการมรดก\nถ้าผู้จัดการมรดกเข้าทำนิติกรรมกับบุคคลภายนอก โดยเห็นแก่ทรัพย์สินอย่างใด ๆ หรือประโยชน์อย่างอื่นใด อันบุคคลภายนอกได้ให้ หรือได้ให้คำมั่นว่าจะให้เป็นลาภส่วนตัว ทายาทหาต้องผูกพันไม่ เว้นแต่ทายาทจะได้ยินยอมด้วย"],["1725","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๒๕ ผู้จัดการมรดกต้องสืบหาโดยสมควรซึ่งตัวผู้มีส่วนได้เสียและแจ้งไปให้ทราบถึงข้อกำหนดพินัยกรรมที่เกี่ยวกับผู้มีส่วนได้เสียนั้นภายในเวลาอันสมควร"],["1726","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๒๖ ถ้าผู้จัดการมรดกมีหลายคน การทำการตามหน้าที่ของผู้จัดการมรดกนั้นต้องถือเอาเสียงข้างมาก เว้นแต่จะมีข้อกำหนดพินัยกรรมเป็นอย่างอื่น ถ้าเสียงเท่ากัน เมื่อผู้มีส่วนได้เสียร้องขอ ก็ให้ศาลเป็นผู้ชี้ขาด"],["1727","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๒๗ ผู้มีส่วนได้เสียคนหนึ่งคนใดจะร้องขอให้ศาลสั่งถอนผู้จัดการมรดก เพราะเหตุผู้จัดการมรดกละเลยไม่ทำการตามหน้าที่ หรือเพราะเหตุอย่างอื่นที่สมควรก็ได้ แต่ต้องร้องขอเสียก่อนที่การปันมรดกเสร็จสิ้นลง\nแม้ถึงว่าจะได้เข้ารับตำแหน่งแล้วก็ดี ผู้จัดการมรดกจะลาออกจากตำแหน่งโดยมีเหตุอันสมควรก็ได้ แต่ต้องได้รับอนุญาตจากศาล"],["1728","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๒๘ ผู้จัดการมรดกต้องลงมือจัดทำบัญชีทรัพย์มรดกภายในสิบห้าวัน\n(๑) นับแต่เจ้ามรดกตาย ถ้าในขณะนั้นผู้จัดการมรดกได้รู้ถึงการตั้งแต่งตามพินัยกรรมที่มอบหมายไว้แก่ตน หรือ\n(๒) นับแต่วันที่เริ่มหน้าที่ผู้จัดการมรดกตามมาตรา ๑๗๑๖ ในกรณีที่ศาลตั้งเป็นผู้จัดการมรดก หรือ\n(๓) นับแต่วันที่ผู้จัดการมรดกรับเป็นผู้จัดการมรดกในกรณีอื่น"],["1729","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๒๙ ผู้จัดการมรดกต้องจัดทำบัญชีทรัพย์มรดกให้แล้วเสร็จภายในหนึ่งเดือนนับแต่เวลาที่ระบุไว้ในมาตรา ๑๗๒๘ แต่กำหนดเวลานี้ เมื่อผู้จัดการมรดกร้องขอก่อนสิ้นกำหนดเวลาหนึ่งเดือน ศาลจะอนุญาตให้ขยายต่อไปอีกก็ได้\nบัญชีนั้นต้องทำต่อหน้าพยานอย่างน้อยสองคน ซึ่งต้องเป็นผู้มีส่วนได้เสียในกองมรดกนั้นด้วย\nบุคคลซึ่งจะเป็นพยานในการทำพินัยกรรมไม่ได้ตามมาตรา ๑๖๗๐ จะเป็นพยานในการทำบัญชีใด ๆ ที่ต้องทำขึ้นตามบทบัญญัติแห่งประมวลกฎหมายนี้ไม่ได้"],["1730","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๓๐ ให้นำมาตรา ๑๕๖๓ มาตรา ๑๕๖๔ วรรคหนึ่ง และวรรคสอง และมาตรา ๑๕๖๕ แห่งประมวลกฎหมายนี้มาใช้บังคับโดยอนุโลม ในระหว่างทายาทกับผู้จัดการมรดกโดยพินัยกรรมและในระหว่างศาลกับผู้จัดการมรดกที่ศาลตั้ง"],["1731","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๓๑ ถ้าผู้จัดการมรดกมิได้จัดทำบัญชีภายในเวลาและตามแบบที่กำหนดไว้ หรือถ้าบัญชีนั้นไม่เป็นที่พอใจแก่ศาล เพราะความประมาทเลินเล่ออย่างร้ายแรงหรือการทุจริต หรือความไม่สามารถอันเห็นประจักษ์ของผู้จัดการมรดก ศาลจะถอนผู้จัดการมรดกเสียก็ได้"],["1732","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๓๒ ผู้จัดการมรดกต้องจัดการตามหน้าที่และทำรายงานแสดงบัญชีการจัดการและแบ่งปันมรดกให้เสร็จภายในหนึ่งปีนับแต่วันที่ระบุไว้ในมาตรา ๑๗๒๘ เว้นแต่ผู้ทำพินัยกรรม ทายาทโดยจำนวนข้างมาก หรือศาลจะได้กำหนดเวลาให้ไว้เป็นอย่างอื่น"],["1733","b6t4","หมวด ๑ ผู้จัดการมรดก","","มาตรา ๑๗๓๓ การให้อนุมัติ การปลดเปลื้องความรับผิด หรือข้อตกลงอื่น ๆ อันเกี่ยวกับรายงานแสดงบัญชีการจัดการมรดกดังที่บัญญัติไว้ในมาตรา ๑๗๓๒ นั้น จะสมบูรณ์ต่อเมื่อรายงานแสดงบัญชีนั้นได้ส่งมอบล่วงหน้าแก่ทายาทพร้อมด้วยเอกสารอันเกี่ยวกับการนั้นไม่น้อยกว่าสิบวันก่อนแล้ว\nคดีเกี่ยวกับการจัดการมรดกนั้น มิให้ทายาทฟ้องเกินกว่าห้าปีนับแต่การจัดการมรดกสิ้นสุดลง"],["1734","b6t4","หมวด ๒ การรวบรวมจำหน่ายทรัพย์มรดกเป็นตัวเงินและการชำระหนี้ กับแบ่งปันทรัพย์มรดก","","มาตรา ๑๗๓๔ เจ้าหนี้กองมรดกชอบแต่จะได้รับการชำระหนี้จากทรัพย์สินในกองมรดกเท่านั้น"],["1735","b6t4","หมวด ๒ การรวบรวมจำหน่ายทรัพย์มรดกเป็นตัวเงินและการชำระหนี้ กับแบ่งปันทรัพย์มรดก","","มาตรา ๑๗๓๕ ทายาทจำต้องบอกทรัพย์มรดกและหนี้สินของผู้ตายตามที่ตนรู้ทั้งหมดแก่ผู้จัดการมรดก"],["1736","b6t4","หมวด ๒ การรวบรวมจำหน่ายทรัพย์มรดกเป็นตัวเงินและการชำระหนี้ กับแบ่งปันทรัพย์มรดก","","มาตรา ๑๗๓๖ ตราบใดที่เจ้าหนี้กองมรดก หรือผู้รับพินัยกรรมที่ปรากฏตัว ยังไม่ได้รับชำระหนี้ หรือส่วนได้ตามพินัยกรรมแล้วทุกคน ให้ถือว่าทรัพย์มรดกยังคงอยู่ในระหว่างจัดการ\nในระหว่างเวลาเช่นว่านั้น ผู้จัดการมรดกชอบที่จะทำการใด ๆ ในทางจัดการตามที่จำเป็นได้ เช่นฟ้องคดีหรือแก้ฟ้องในศาลและอื่น ๆ อนึ่ง ผู้จัดการมรดกต้องทำการทุกอย่างตามที่จำเป็น เพื่อเรียกเก็บหนี้สินซึ่งค้างชำระอยู่แก่กองมรดกภายในเวลาอันเร็วที่สุดที่จะทำได้ และเมื่อเจ้าหนี้กองมรดกได้รับชำระหนี้แล้ว ผู้จัดการมรดกต้องทำการแบ่งปันมรดก"],["1737","b6t4","หมวด ๒ การรวบรวมจำหน่ายทรัพย์มรดกเป็นตัวเงินและการชำระหนี้ กับแบ่งปันทรัพย์มรดก","","มาตรา ๑๗๓๗ เจ้าหนี้กองมรดกจะบังคับสิทธิเรียกร้องต่อทายาทคนใดก็ได้ แต่ถ้ามีผู้จัดการมรดก ให้เจ้าหนี้เรียกเข้ามาในคดีด้วย"],["1738","b6t4","หมวด ๒ การรวบรวมจำหน่ายทรัพย์มรดกเป็นตัวเงินและการชำระหนี้ กับแบ่งปันทรัพย์มรดก","","มาตรา ๑๗๓๘ ก่อนแบ่งมรดก เจ้าหนี้กองมรดกจะบังคับชำระหนี้เต็มจำนวนจากกองมรดกก็ได้ ในกรณีเช่นนี้ทายาทคนหนึ่ง ๆ อาจเรียกให้ชำระหนี้จากทรัพย์มรดกของเจ้ามรดก หรือให้เอาเป็นประกันก็ได้จนถึงเวลาแบ่งมรดก\nเมื่อแบ่งมรดกแล้ว เจ้าหนี้อาจเรียกให้ทายาทคนใดคนหนึ่งชำระหนี้ได้เพียงไม่เกินทรัพย์มรดกที่ทายาทคนนั้นได้รับไป ในกรณีเช่นนี้ ทายาทคนใดซึ่งได้ชำระหนี้แก่เจ้าหนี้กองมรดกเกินกว่าส่วนที่ตนจะต้องเฉลี่ยใช้หนี้ ทายาทคนนั้นมีสิทธิไล่เบี้ยจากทายาทคนอื่นได้"],["1739","b6t4","หมวด ๒ การรวบรวมจำหน่ายทรัพย์มรดกเป็นตัวเงินและการชำระหนี้ กับแบ่งปันทรัพย์มรดก","","มาตรา ๑๗๓๙ ให้ชำระหนี้ที่กองมรดกค้างชำระตามลำดับต่อไปนี้ และตามบทบัญญัติแห่งประมวลกฎหมายนี้ว่าด้วยบุริมสิทธิ โดยต้องไม่เป็นที่เสื่อมเสียแก่บรรดาเจ้าหนี้ผู้มีบุริมสิทธิพิเศษตามประมวลกฎหมายนี้หรือกฎหมายอื่น และบรรดาเจ้าหนี้ที่มีประกันโดยการจำนำหรือการจำนอง\n(๑) ค่าใช้จ่ายเพื่อประโยชน์อันร่วมกันของกองมรดก\n(๒) ค่าใช้จ่ายในการทำศพเจ้ามรดก\n(๓) ค่าภาษีอากรซึ่งกองมรดกค้างชำระอยู่\n(๔) ค่าจ้างซึ่งเจ้ามรดกค้างชำระแก่เสมียน คนใช้และคนงาน\n(๕) ค่าเครื่องอุปโภคบริโภคอันจำเป็นประจำวันซึ่งส่งให้แก่เจ้ามรดก\n(๖) หนี้สินสามัญของเจ้ามรดก\n(๗) บำเหน็จของผู้จัดการมรดก"],["1740","b6t4","หมวด ๒ การรวบรวมจำหน่ายทรัพย์มรดกเป็นตัวเงินและการชำระหนี้ กับแบ่งปันทรัพย์มรดก","","มาตรา ๑๗๔๐ เว้นแต่เจ้ามรดกหรือกฎหมายจะได้กำหนดไว้เป็นอย่างอื่น ให้จัดสรรทรัพย์สินของเจ้ามรดกเพื่อชำระหนี้ตามลำดับต่อไปนี้\n(๑) ทรัพย์สินนอกจากอสังหาริมทรัพย์\n(๒) อสังหาริมทรัพย์ซึ่งจัดสรรไว้ชัดแจ้งในพินัยกรรมว่าสำหรับชำระหนี้ถ้าหากว่ามีทรัพย์สินเช่นนั้น\n(๓) อสังหาริมทรัพย์ซึ่งทายาทโดยธรรมชอบที่จะได้รับในฐานะเช่นนั้น\n(๔) อสังหาริมทรัพย์ซึ่งเจ้ามรดกทำพินัยกรรมให้แก่ผู้ใดผู้หนึ่งโดยมีเงื่อนไขว่า ผู้นั้นต้องชำระหนี้ของเจ้ามรดก\n(๕) อสังหาริมทรัพย์ซึ่งเจ้ามรดกทำพินัยกรรมให้โดยลักษณะทั่วไปดังบัญญัติไว้ในมาตรา ๑๖๕๑\n(๖) ทรัพย์สินเฉพาะอย่างซึ่งเจ้ามรดกทำพินัยกรรมให้โดยลักษณะเฉพาะดังบัญญัติไว้ในมาตรา ๑๖๕๑\nทรัพย์สินอย่างใดอย่างหนึ่งซึ่งได้จัดสรรไว้ตามความที่กล่าวมาแล้วข้างต้นนั้น ให้เอาออกขายทอดตลาด แต่ทายาทคนใดคนหนึ่งอาจมิให้มีการขายเช่นว่านั้นได้ โดยชำระราคาทรัพย์สินนั้นทั้งหมด หรือแต่บางส่วนตามที่ผู้ตีราคาซึ่งศาลตั้งขึ้นได้กำหนดให้ จนพอแก่จำนวนที่จะชำระหนี้ให้แก่เจ้าหนี้"],["1741","b6t4","หมวด ๒ การรวบรวมจำหน่ายทรัพย์มรดกเป็นตัวเงินและการชำระหนี้ กับแบ่งปันทรัพย์มรดก","","มาตรา ๑๗๔๑ เจ้าหนี้กองมรดกคนใดคนหนึ่ง จะคัดค้านการขายทอดตลาดหรือการตีราคาทรัพย์สินดังระบุไว้ในมาตราก่อน โดยเสียค่าใช้จ่ายของตนเองก็ได้ ถ้าเจ้าหนี้ได้ร้องคัดค้านแล้ว ยังได้กระทำการขายทอดตลาด หรือตีราคาไป จะยกการขายทอดตลาดหรือตีราคานั้นขึ้นยันต่อเจ้าหนี้ผู้ร้องคัดค้านแล้วนั้นหาได้ไม่"],["1742","b6t4","หมวด ๒ การรวบรวมจำหน่ายทรัพย์มรดกเป็นตัวเงินและการชำระหนี้ กับแบ่งปันทรัพย์มรดก","","มาตรา ๑๗๔๒ ถ้าในการชำระหนี้ซึ่งค้างชำระอยู่แก่ตน เจ้าหนี้คนใดคนหนึ่งได้รับตั้งในระหว่างที่ผู้ตายมีชีวิตอยู่ ให้เป็นผู้รับประโยชน์ในการประกันชีวิต เจ้าหนี้คนนั้นชอบที่จะได้รับเงินทั้งหมด ซึ่งได้ตกลงไว้กับผู้รับประกัน อนึ่ง เจ้าหนี้เช่นว่านั้น จำต้องส่งเบี้ยประกันภัยคืนเข้ากองมรดกก็ต่อเมื่อเจ้าหนี้คนอื่น ๆ พิสูจน์ได้ว่า\n(๑) การที่ผู้ตายชำระหนี้ให้แก่เจ้าหนี้โดยวิธีดังกล่าวมานั้นเป็นการขัดต่อบทบัญญัติมาตรา ๒๓๗ แห่งประมวลกฎหมายนี้ และ\n(๒) เบี้ยประกันภัยเช่นว่านั้น เป็นจำนวนสูงเกินส่วนเมื่อเทียบกับรายได้หรือฐานะของผู้ตาย\nถึงอย่างไรก็ดี เบี้ยประกันภัยซึ่งจะพึงส่งคืนเข้ากองมรดกนั้นต้องไม่เกินกว่าจำนวนเงินที่ผู้รับประกันชำระให้"],["1743","b6t4","หมวด ๒ การรวบรวมจำหน่ายทรัพย์มรดกเป็นตัวเงินและการชำระหนี้ กับแบ่งปันทรัพย์มรดก","","มาตรา ๑๗๔๓ ทายาทโดยธรรม หรือผู้รับพินัยกรรมโดยลักษณะทั่วไปไม่จำต้องปฏิบัติตามข้อกำหนดในพินัยกรรม ลักษณะเฉพาะเกินกว่าจำนวนทรัพย์มรดกที่ตนได้รับ"],["1744","b6t4","หมวด ๒ การรวบรวมจำหน่ายทรัพย์มรดกเป็นตัวเงินและการชำระหนี้ กับแบ่งปันทรัพย์มรดก","","มาตรา ๑๗๔๔ ผู้จัดการมรดกไม่ต้องส่งมอบทรัพย์มรดกหรือส่วนใดส่วนหนึ่งแห่งทรัพย์มรดกให้แก่ทายาทก่อนปีหนึ่งนับแต่วันที่เจ้ามรดกถึงแก่ความตาย เว้นแต่เจ้าหนี้กองมรดกและผู้รับพินัยกรรมที่ปรากฏตัวได้รับชำระหนี้และส่วนได้ตามพินัยกรรมแล้วทุกคน"],["1745","b6t4","หมวด ๓ การแบ่งมรดก","","มาตรา ๑๗๔๕ ถ้ามีทายาทหลายคน ทายาทเหล่านั้นมีสิทธิและหน้าที่เกี่ยวกับทรัพย์มรดกร่วมกันจนกว่าจะได้แบ่งมรดกกันเสร็จแล้ว และให้ใช้มาตรา ๑๓๕๖ ถึงมาตรา ๑๓๖๖ แห่งประมวลกฎหมายนี้บังคับ เพียงเท่าที่ไม่ขัดกับบทบัญญัติแห่งบรรพนี้"],["1746","b6t4","หมวด ๓ การแบ่งมรดก","","มาตรา ๑๗๔๖ ภายใต้บังคับแห่งกฎหมาย หรือข้อความในพินัยกรรมถ้าหากมี ให้สันนิษฐานไว้ก่อนว่า ผู้เป็นทายาทด้วยกันมีส่วนเท่ากันในกองมรดกที่ยังไม่ได้แบ่ง"],["1747","b6t4","หมวด ๓ การแบ่งมรดก","","มาตรา ๑๗๔๗ การที่ทายาทคนใดได้รับทรัพย์สินอย่างหนึ่งอย่างใด หรือประโยชน์อย่างอื่นใดจากเจ้ามรดกโดยการให้ หรือโดยการอย่างอื่นใด ซึ่งทำให้โดยเสน่หาในระหว่างเวลาที่เจ้ามรดกยังมีชีวิตอยู่นั้น หาทำให้สิทธิในการแบ่งปันทรัพย์มรดกของทายาทคนนั้น ต้องเสื่อมเสียไปแต่โดยประการใดไม่"],["1748","b6t4","หมวด ๓ การแบ่งมรดก","","มาตรา ๑๗๔๘ ทายาทคนใดครอบครองทรัพย์มรดกซึ่งยังมิได้แบ่งกัน ทายาทคนนั้นมีสิทธิที่จะเรียกร้องให้แบ่งทรัพย์มรดกนั้นได้ แม้ว่าจะล่วงพ้นกำหนดอายุความตามมาตรา ๑๗๕๔ แล้วก็ดี\nสิทธิที่จะเรียกให้แบ่งทรัพย์มรดกตามวรรคก่อน จะตัดโดยนิติกรรมเกินคราวละสิบปีไม่ได้"],["1749","b6t4","หมวด ๓ การแบ่งมรดก","","มาตรา ๑๗๔๙ ถ้ามีคดีฟ้องเรียกทรัพย์มรดก ผู้ซึ่งอ้างว่าตนเป็นทายาทมีสิทธิในทรัพย์มรดกนั้น จะร้องสอดเข้ามาในคดีก็ได้\nแต่ศาลจะเรียกทายาทอื่น นอกจากคู่ความ หรือผู้ร้องสอด ให้เข้ามารับส่วนแบ่ง หรือกันส่วนแห่งทรัพย์มรดกไว้เพื่อทายาทอื่นนั้นไม่ได้"],["1750","b6t4","หมวด ๓ การแบ่งมรดก","","มาตรา ๑๗๕๐ การแบ่งปันทรัพย์มรดกนั้น อาจทำได้โดยทายาทต่างเข้าครอบครองทรัพย์สินเป็นส่วนสัด หรือโดยการขายทรัพย์มรดกแล้วเอาเงินที่ขายได้มาแบ่งปันกันระหว่างทายาท\nถ้าการแบ่งปันมิได้เป็นไปตามวรรคก่อน แต่ได้ทำโดยสัญญา จะฟ้องร้องให้บังคับคดีหาได้ไม่ เว้นแต่จะมีหลักฐานเป็นหนังสืออย่างหนึ่งอย่างใด ลงลายมือชื่อฝ่ายที่รับผิดหรือตัวแทนของฝ่ายนั้นเป็นสำคัญ ในกรณีเช่นนี้ให้นำมาตรา ๘๕๐ มาตรา ๘๕๒ แห่งประมวลกฎหมายนี้ว่าด้วยประนีประนอมยอมความมาใช้บังคับโดยอนุโลม"],["1751","b6t4","หมวด ๓ การแบ่งมรดก","","มาตรา ๑๗๕๑ ภายหลังที่ได้แบ่งมรดกกันแล้ว ถ้าทรัพย์สินทั้งหมดหรือบางส่วน ซึ่งทายาทคนใดคนหนึ่งได้รับตามส่วนแบ่งปันนั้น หลุดมือไปจากทายาทคนนั้นเนื่องจากการรอนสิทธิ ทายาทคนอื่น ๆ จำต้องใช้ค่าทดแทน\nหนี้เช่นว่านั้น เป็นอันระงับเมื่อมีการตกลงกันไว้เป็นอย่างอื่น หรือการรอนสิทธิเป็นผลเนื่องมาจากความผิดของทายาทผู้ถูกรอนสิทธิ หรือเนื่องมาจากเหตุซึ่งเกิดขึ้นภายหลังการแบ่งปัน\nทายาทคนอื่น ๆ ต้องใช้ค่าทดแทนให้แก่ทายาทผู้ถูกรอนสิทธิตามส่วนแห่งส่วนแบ่งของตน แต่ให้หักจำนวนที่เป็นส่วนเฉลี่ย ซึ่งทายาทผู้ถูกรอนสิทธิจะต้องออกกับเขาด้วยนั้นออกเสีย แต่ถ้าทายาทคนใดคนหนึ่งเป็นคนหนี้สินล้นพ้นตัว ทายาทคนอื่น ๆ ต้องรับผิดในส่วนของทายาทคนนั้นตามส่วนเฉลี่ยเช่นเดียวกัน แต่ให้หักจำนวนที่เป็นส่วนเฉลี่ยซึ่งทายาทผู้ที่จะได้รับค่าทดแทนจะต้องออกแทนทายาทผู้ที่มีหนี้สินล้นพ้นตัวนั้นออกเสีย\nบทบัญญัติในวรรคก่อน ๆ มิให้ใช้บังคับแก่ผู้รับพินัยกรรมลักษณะเฉพาะ"],["1752","b6t4","หมวด ๓ การแบ่งมรดก","","มาตรา ๑๗๕๒ คดีฟ้องให้รับผิดเนื่องจากการรอนสิทธิตามมาตรา ๑๗๕๑ นั้น มิให้ฟ้องเมื่อพ้นกำหนดสามเดือนนับแต่เมื่อถูกรอนสิทธิ"],["1753","b6t5","","","มาตรา ๑๗๕๓ ภายใต้บังคับแห่งสิทธิของเจ้าหนี้กองมรดก เมื่อบุคคลใดถึงแก่ความตายโดยไม่มีทายาทโดยธรรมหรือผู้รับพินัยกรรม หรือการตั้งมูลนิธิตามพินัยกรรมมรดกของบุคคลนั้นตกทอดแก่แผ่นดิน"],["1754","b6t6","","","มาตรา ๑๗๕๔ ห้ามมิให้ฟ้องคดีมรดกเมื่อพ้นกำหนดหนึ่งปี นับแต่เมื่อเจ้ามรดกตาย หรือนับแต่เมื่อทายาทโดยธรรมได้รู้ หรือควรได้รู้ถึงความตายของเจ้ามรดก\nคดีฟ้องเรียกตามข้อกำหนดพินัยกรรม มิให้ฟ้องเมื่อพ้นกำหนดหนึ่งปีนับแต่เมื่อผู้รับพินัยกรรมได้รู้หรือควรได้รู้ถึงสิทธิซึ่งตนมีอยู่ตามพินัยกรรม\nภายใต้บังคับแห่งมาตรา ๑๙๓/๒๗ แห่งประมวลกฎหมายนี้ ถ้าสิทธิเรียกร้องของเจ้าหนี้อันมีต่อเจ้ามรดกมีกำหนดอายุความยาวกว่าหนึ่งปี มิให้เจ้าหนี้นั้นฟ้องร้องเมื่อพ้นกำหนดหนึ่งปีนับแต่เมื่อเจ้าหนี้ได้รู้ หรือควรได้รู้ถึงความตายของเจ้ามรดก\nถึงอย่างไรก็ดี สิทธิเรียกร้องตามที่ว่ามาในวรรคก่อน ๆ นั้น มิให้ฟ้องร้องเมื่อพ้นกำหนดสิบปีนับแต่เมื่อเจ้ามรดกตาย"],["1755","b6t6","","","มาตรา ๑๗๕๕ อายุความหนึ่งปีนั้น จะยกขึ้นต่อสู้ได้ก็แต่โดยบุคคลซึ่งเป็นทายาท หรือบุคคลซึ่งชอบที่จะใช้สิทธิของทายาท หรือโดยผู้จัดการมรดก"]];

const ar=s=>String(s).replace(/[๐-๙]/g,c=>TD.indexOf(c));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const noKey=n=>{const m=String(n).match(/^(\d+)(?:\/(\d+))?/);return m?[+m[1],m[2]?+m[2]:0]:[1e9,0]};
const cmpNo=(a,b)=>{const x=noKey(a),y=noKey(b);return x[0]-y[0]||x[1]-y[1]||(String(a)<String(b)?-1:String(a)>String(b)?1:0)};
const inRange=(n,lo,hi)=>cmpNo(n,lo)>=0&&cmpNo(n,hi)<=0;
const DAY=864e5;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- law registry ---------- */
const TITLE={}; // key -> {key,b,t,name,lo,hi,bookName,url}
TOC.forEach(B=>B.t.forEach(([t,n,lo,hi])=>{const key="b"+B.b+"t"+t;TITLE[key]={key,b:B.b,t,name:"ลักษณะ "+th(t)+" "+n,lo,hi,bookName:B.name,url:LP+"book-"+B.b+".title-"+t}}));
const SEC=new Map(); // k -> section
function addSec(s){SEC.set(s.k,s)}
CCC.forEach(([no,tk,ch,pt,text])=>addSec({k:"ccc:"+no,law:"ccc",no,tk,chapter:ch,part:pt,text,src:"builtin",rep:text.length<80&&/\(ยกเลิก\)\s*$/.test(text)}));
let imported=ls.get("tm-lawtext",{}); // chunkId -> {law,lawName,tk,sections:[[no,ch,pt,text]]}
let custom=ls.get("tm-custom",{updatedAt:0,laws:{},sections:[],modes:[]});
function rebuildImported(){
  for(const [k,s] of SEC) if(s.src!=="builtin") SEC.delete(k);
  Object.values(imported).forEach(c=>c.sections.forEach(([no,ch,pt,text])=>{const k=c.law+":"+no;if(c.law==="ccc"&&SEC.get(k)?.src==="builtin")return;addSec({k,law:c.law,no,tk:c.tk,chapter:ch,part:pt,text,src:"import"})}));
  custom.sections.forEach(s=>addSec({...s,src:"custom"}));
}
const LAWS=()=>{const m={ccc:{id:"ccc",name:"ประมวลกฎหมายแพ่งและพาณิชย์",short:"ป.พ.พ."}};
  Object.values(imported).forEach(c=>{if(c.law!=="ccc"&&!m[c.law])m[c.law]={id:c.law,name:c.lawName,short:c.lawName}});
  Object.values(custom.laws).forEach(l=>{if(!m[l.id])m[l.id]=l});
  custom.sections.forEach(s=>{if(!m[s.law])m[s.law]={id:s.law,name:s.lawName||s.law,short:s.lawName||s.law}});
  return m};
function sorted(list){return list.sort((a,b)=>a.law===b.law?cmpNo(a.no,b.no):a.law<b.law?-1:1)}
function lawShort(s){return s.law==="ccc"?"ป.พ.พ.":(LAWS()[s.law]?.short||s.law)}
function crumb(s){const T=TITLE[s.tk];const parts=[];if(s.law==="ccc"&&T){parts.push(T.bookName,T.name)}else{const L=LAWS()[s.law];if(L)parts.push(L.name);if(s.tk&&!TITLE[s.tk])parts.push(s.tk)}
  if(s.chapter)parts.push(s.chapter);if(s.part)parts.push(s.part);return parts.join(" › ")}
function bodyText(s){return s.text.replace(/^มาตรา\s*[๐-๙\d]+(?:\/[๐-๙\d]+)?\s*(ทวิ|ตรี|จัตวา)?\s*/,"")}

/* ---------- progress state ---------- */
let P=ls.get("tm-progress",null)||{v:1,updatedAt:0,xp:0,streak:{last:"",n:0},cards:{},star:{},cleared:{},rate:0.85,mode:"due"};
let N=ls.get("tm-notes",{updatedAt:0,notes:{}});
const TIERS=[["BRONZE",0],["SILVER",100],["GOLD",300],["PLATINUM",700],["DIAMOND",1500],["MASTER",3000],["GRANDMASTER",6000],["นิติราช",12000]];
function tier(){let i=0;TIERS.forEach((t,j)=>{if(P.xp>=t[1])i=j});return i}
function renderRank(){const i=tier(),cur=TIERS[i],nx=TIERS[i+1];$("#rankName").textContent=cur[0];
  $("#xpFill").style.width=nx?((P.xp-cur[1])/(nx[1]-cur[1])*100)+"%":"100%";
  $("#xpText").textContent=P.xp.toLocaleString()+" XP"+(nx?" · อีก "+(nx[1]-P.xp)+" ถึง "+nx[0]:"");
  $("#streak").textContent=P.streak.n?("🔥 "+P.streak.n+" วัน"):""}
function gainXP(n,why){const before=tier();P.xp+=Math.round(n);const d=today();
  if(P.streak.last!==d){const y=new Date(Date.now()-DAY);const yd=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();P.streak.n=P.streak.last===yd?P.streak.n+1:1;P.streak.last=d}
  if(tier()>before)toast("เลื่อนขั้นเป็น "+TIERS[tier()][0]+"!");else if(why)toast(why);
  renderRank();save()}
function card(k){return P.cards[k]||(P.cards[k]={b:1,due:0,n:0})}
const IV=[0,0,1,3,7,16];
function grade(k,g){const c=card(k);c.n++;if(g===2)c.b=Math.min(5,c.b+1);else if(g===0)c.b=1;c.due=Date.now()+IV[c.b]*DAY*(g===1?0.5:1);c.last=Date.now()}

/* ---------- persistence (local + db sync) ---------- */
let DB=null,USER=null,UID=null,canWriteShared=false,saveT=null;
function save(){P.updatedAt=Date.now();ls.set("tm-progress",P);queueSync()}
function saveNotes(){N.updatedAt=Date.now();ls.set("tm-notes",N);queueSync()}
function saveCustom(){custom.updatedAt=Date.now();ls.set("tm-custom",custom);queueSync()}
let dirty={};
function queueSync(){dirty.p=1;dirty.n=1;dirty.c=1;clearTimeout(saveT);saveT=setTimeout(flush,2500)}
let lastSent={};
async function flush(){if(!DB||!UID)return;
  const items=[["progress",P],["notes",N],["custom",custom]];
  for(const [name,obj] of items){const s=JSON.stringify(obj);if(lastSent[name]===s)continue;
    try{await DB.doc("data/users/"+UID+"/"+name).set(JSON.parse(s));lastSent[name]=s}catch(e){console.warn("sync",name,e?.code)}}}
async function initCloud(){
  if(!window.claude?.use)return;
  try{[DB,USER]=await Promise.all([claude.use("db"),claude.use("user")])}catch(e){}
  if(USER){try{UID=await USER.id()}catch(e){}try{const c=await USER.can?.("data.write");canWriteShared=c!==false}catch(e){}}
  if(DB&&UID){
    for(const [name,setter,cur] of [["progress",v=>{P=v;ls.set("tm-progress",P)},()=>P],["notes",v=>{N=v;ls.set("tm-notes",N)},()=>N],["custom",v=>{custom=v;ls.set("tm-custom",custom)},()=>custom]]){
      try{const d=await DB.doc("data/users/"+UID+"/"+name).get();if(d.exists){const v=d.data();if((v.updatedAt||0)>(cur().updatedAt||0))setter(JSON.parse(JSON.stringify(v)));lastSent[name]=JSON.stringify(cur())}}catch(e){}
    }
    queueSync();
  }
  if(DB){
    DB.collection("lawtext").onSnapshot(snap=>{let changed=false;snap.docs.forEach(d=>{const v=d.data();if(v&&v.sections&&JSON.stringify(imported[d.id])!==JSON.stringify(v)){imported[d.id]=JSON.parse(JSON.stringify(v));changed=true}});
      if(changed){ls.set("tm-lawtext",imported);rebuildImported();refreshFilters();render()}},e=>console.warn("lawtext",e?.code));
  }
  rebuildImported();refreshFilters();renderRank();render();
}

/* ---------- filters ---------- */
const F={law:"ccc|1",title:"",chap:"",q:""};
function refreshFilters(){
  const fl=$("#fLaw"),keep=fl.value||F.law;const L=LAWS();let h="";
  TOC.forEach(B=>{const cnt=[...SEC.values()].filter(s=>s.law==="ccc"&&TITLE[s.tk]?.b===B.b).length;h+=`<option value="ccc|${B.b}">${esc(B.name)}${cnt?"":" (ยังไม่มีตัวบท)"}</option>`});
  h+=`<option value="ccc|*">ป.พ.พ. ทุกบรรพ</option>`;
  Object.values(L).filter(l=>l.id!=="ccc").forEach(l=>h+=`<option value="${esc(l.id)}|*">${esc(l.name)}</option>`);
  h+=`<option value="*|*">ทุกกฎหมายในแอป</option><option value="star|*">★ ที่ติดดาวไว้</option><option value="guess|*">ชุดเก็งข้อสอบ</option>`;
  Object.values(custom.modes||{}).forEach(m=>h+=`<option value="mode|${esc(m.id)}">โหมด: ${esc(m.name)}</option>`);
  fl.innerHTML=h;fl.value=[...fl.options].some(o=>o.value===keep)?keep:"ccc|1";F.law=fl.value;refreshTitle()}
function refreshTitle(){const [law,b]=F.law.split("|");const ft=$("#fTitle");let h=`<option value="">ทุกลักษณะ</option>`;
  if(law==="ccc"&&b!=="*"){TOC.find(B=>B.b==b).t.forEach(([t,n])=>{const key="b"+b+"t"+t;const has=[...SEC.values()].some(s=>s.tk===key);h+=`<option value="${key}">${esc(TITLE[key].name)}${has?"":" ·ยังไม่มี"}</option>`})}
  else if(law!=="ccc"&&!["*","star","guess","mode"].includes(law)){const tks=[...new Set([...SEC.values()].filter(s=>s.law===law&&s.tk).map(s=>s.tk))];tks.forEach(t=>h+=`<option value="${esc(t)}">${esc(t)}</option>`)}
  ft.innerHTML=h;ft.value=[...ft.options].some(o=>o.value===F.title)?F.title:"";F.title=ft.value;refreshChap()}
function refreshChap(){const fc=$("#fChap");const chs=[...new Set(scope({noChap:1}).map(s=>s.chapter).filter(Boolean))];
  let h=`<option value="">ทุกหมวด</option>`+chs.map(c=>`<option>${esc(c)}</option>`).join("");fc.innerHTML=h;fc.value=chs.includes(F.chap)?F.chap:"";F.chap=fc.value}
function scope(o={}){const [law,b]=F.law.split("|");let L=[...SEC.values()];
  if(law==="star")L=L.filter(s=>P.star[s.k]);else if(law==="guess")L=L.filter(s=>GUESS.includes(s.k)||P.star[s.k]);
  else if(law==="mode"){const m=custom.modes[b];L=m?L.filter(s=>matchSpec(s,m)):[]}
  else if(law!=="*"){L=L.filter(s=>s.law===law);if(law==="ccc"&&b!=="*")L=L.filter(s=>TITLE[s.tk]?.b==b)}
  if(F.title)L=L.filter(s=>s.tk===F.title);
  if(!o.noChap&&F.chap)L=L.filter(s=>s.chapter===F.chap);
  return sorted(L)}
function matchSpec(s,m){if(m.law&&m.law!=="*"&&s.law!==m.law)return false;
  return parseSpec(m.spec).some(([lo,hi])=>inRange(s.no,lo,hi))}
function parseSpec(t){return String(t).split(/[,\s]+/).map(x=>ar(x.trim())).filter(Boolean).map(x=>{const m=x.split(/[-–]/);return [m[0],m[1]||m[0]]})}
["#fLaw","#fTitle","#fChap"].forEach(id=>$(id).addEventListener("change",e=>{if(id==="#fLaw"){F.law=e.target.value;F.title="";F.chap="";refreshTitle()}else if(id==="#fTitle"){F.title=e.target.value;F.chap="";refreshChap()}else F.chap=e.target.value;resetSession();render()}));
$("#q").addEventListener("input",e=>{F.q=e.target.value.trim();if(F.q&&TAB!=="lib")setTab("lib");else render()});

function setTab(t){TAB=t;document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));render()}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setTab(b.dataset.tab)});

  seg.innerHTML=[["due","รอบนี้ (ถึงกำหนด)"],["all","ท่องทั้งหมด"],["weak","ข้อที่ยังจำไม่ได้"],["new","ยังไม่เคยท่อง"]].map(([v,l])=>`<button data-m="${v}" aria-pressed="${P.mode===v}">${l}</button>`).join("")+`<button data-m="+" title="สร้างชุดท่องเอง">+ เพิ่มโหมด</button>`}

function emptyScope(v){const [law,b]=F.law.split("|");
  if(law==="ccc"&&b!=="*"){const missing=TOC.find(B=>B.b==b).t.map(([t])=>TITLE["b"+b+"t"+t]).filter(T=>![...SEC.values()].some(s=>s.tk===T.key));
    v.innerHTML=`<div class="card"><h2>ยังไม่มีตัวบทในชุดนี้</h2><p class="meta">${esc(TOC.find(B=>B.b==b).name)} ยังขาดตัวบท ${missing.length} ลักษณะ นำเข้าจากหน้า LawPlayer ได้ทีละลักษณะ แอปจะแยกมาตราจากข้อความต้นฉบับให้เอง</p><div class="row">${missing.slice(0,8).map(T=>`<button class="btn sm" data-imp="${T.key}">นำเข้า ${esc(T.name)}</button>`).join("")}</div></div>`;

document.addEventListener("click",e=>{const b=e.target.closest("[data-imp]");if(b)openImport(b.dataset.imp)});

/* ---- learn (Leitner) ---- */
let session=null;
function resetSession(){session=null}
function buildSession(){const L=scope().filter(s=>!s.rep);let q;const now=Date.now();
  if(P.mode==="all")q=L;else if(P.mode==="weak")q=L.filter(s=>P.cards[s.k]&&P.cards[s.k].b<=2);else if(P.mode==="new")q=L.filter(s=>!P.cards[s.k]);
  else q=L.filter(s=>!P.cards[s.k]||P.cards[s.k].due<=now);
  session={q:q.map(s=>s.k),i:0,shown:false,hist:[]}}
function viewLearn(v){if(!scope().length)return emptyScope(v);if(!session)buildSession();
  const left=session.q.length-session.i;
  if(left<=0){const L=scope();const m=L.filter(s=>(P.cards[s.k]?.b||0)>=3).length;
    v.innerHTML=`<div class="card"><h2>จบรอบนี้แล้ว</h2><p class="meta">ชุดนี้มี ${L.length} มาตรา จำได้แม่น (กล่อง 3 ขึ้นไป) ${m} มาตรา</p><div class="row"><button class="btn pri" id="againAll">ท่องทั้งหมดอีกรอบ</button><button class="btn" id="toType">ไปพิมพ์ทดสอบ</button></div></div>`;
    $("#againAll").onclick=()=>{P.mode="all";save();resetSession();render()};$("#toType").onclick=()=>setTab("type");return}
  const s=SEC.get(session.q[session.i]);const c=P.cards[s.k]||{b:1};
  v.innerHTML=`<div class="row meta"><span>เหลือ <b class="num">${left}</b> ใบในรอบนี้</span><span>· กล่อง <b class="num">${c.b}</b>/5</span><div class="boxes">${[1,2,3,4,5].map(i=>`<i class="${i<=c.b?"f":""}"></i>`).join("")}</div><span class="spacer"></span>
    <button class="btn sm ghost" id="back" ${session.hist.length?"":"disabled"}>‹ ย้อนกลับ</button><button class="btn sm ghost" id="skip">ข้าม ›</button></div>
  ${cardHTML(s,session.shown)}`;
  bindCard(s,v);
  $("#back").onclick=()=>{session.i=session.hist.pop();session.shown=false;render()};
  $("#skip").onclick=()=>{session.hist.push(session.i);session.i++;session.shown=false;render()};
}
function cardHTML(s,shown){const star=P.star[s.k];
  return `<article class="card">
   <div class="row"><div class="secno"><small>${esc(lawShort(s))}</small>มาตรา ${th(s.no)}</div><span class="spacer"></span>
     ${GUESS.includes(s.k)?'<span class="chip bad">เก็ง</span>':""}<button class="btn sm ${star?"on":""}" data-act="star" aria-pressed="${!!star}">${star?"★ ติดดาว":"☆ ติดดาว"}</button></div>
   <div class="crumb">${esc(crumb(s))}</div>
   ${shown?`<div class="lawtext">${fmtLaw(bodyText(s))}</div>
     <div class="grade"><button class="btn bad" data-g="0">จำไม่ได้</button><button class="btn warn" data-g="1">ไม่แน่ใจ</button><button class="btn ok" data-g="2">จำได้</button></div>`
    :`<div class="hint">ลองนึกตัวบทในใจก่อน แล้วกดดูเฉลย</div><div class="row"><button class="btn pri" data-act="show">ดูตัวบท</button><button class="btn teal" data-act="type">พิมพ์ทดสอบ</button></div>`}
   ${audioBar(s)}
   <details><summary class="meta">โน้ตของฉัน${N.notes[s.k]?" ·มีโน้ต":""}</summary><textarea class="note" id="note" placeholder="จดคำสำคัญ ทริคจำ หรือฎีกาที่เกี่ยวข้อง">${esc(N.notes[s.k]||"")}</textarea></details>
   <div class="row" data-ai-row></div>
  </article>${refLine(s)}`}
function refLine(s){if(s.law!=="ccc")return `<p class="ref">อ้างอิง: ${esc(LAWS()[s.law]?.name||"")} มาตรา ${th(s.no)} · ข้อความที่ผู้ใช้นำเข้า</p>`;const r=(REFS.m[s.no]||[]).map(i=>REFS.u[i]);return `<p class="ref">ที่มา: ประมวลกฎหมายแพ่งและพาณิชย์ (ฉบับปรับปรุงล่าสุด) สำนักงานคณะกรรมการกฤษฎีกา${r.map(x=>`<br>${esc(x)}`).join("")}</p>`}
function fmtLaw(t){return t.split("\n").map(p=>`<p>${esc(p)}</p>`).join("")}
function bindCard(s,root){root.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{const a=b.dataset.act;
    if(a==="show"){session.shown=true;render()}
    else if(a==="type"){TYPE.k=s.k;setTab("type")}
    else if(a==="star"){if(P.star[s.k])delete P.star[s.k];else P.star[s.k]=1;save();render()}});
  root.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const g=+b.dataset.g;grade(s.k,g);gainXP([1,4,10][g]);session.hist.push(session.i);session.i++;session.shown=false;render()});
  const n=root.querySelector("#note");if(n)n.oninput=()=>{if(n.value.trim())N.notes[s.k]=n.value;else delete N.notes[s.k];saveNotes()};
  bindAudio(s,root);bindAI(s,root)}

/* ---- audio: TTS + recording ---- */
function audioBar(s){const rates=[0.6,0.75,0.85,1,1.15,1.3];
  return `<div class="audio"><button class="btn sm" data-tts>🔊 ฟังเสียงอ่าน</button>
  <select data-rate aria-label="ความเร็วเสียง">${rates.map(r=>`<option value="${r}" ${P.rate==r?"selected":""}>${r}x</option>`).join("")}</select>
  <span class="spacer"></span>
  <button class="btn sm rec" data-rec>● อัดเสียงท่อง</button><button class="btn sm" data-play hidden>▶ ฟังเสียงฉัน</button><button class="btn sm ghost" data-delrec hidden>ลบเสียง</button>
  <label class="btn sm ghost" data-recfile hidden>อัดด้วยแอปเครื่อง<input type="file" accept="audio/*" capture hidden></label></div>`}
let speaking=false;
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}speaking=false}
function thVoice(){try{return speechSynthesis.getVoices().find(v=>/^th/i.test(v.lang))}catch(e){return null}}
function speak(text,btn){if(!("speechSynthesis" in window)){toast("อุปกรณ์นี้ไม่มีเสียงอ่านภาษาไทย");return}
  if(speaking){stopSpeak();btn.textContent="🔊 ฟังเสียงอ่าน";return}
  const parts=[];let buf="";text.replace(/\n/g," \n ").split(/(\s+)/).forEach(w=>{if((buf+w).length>160&&buf.trim()){parts.push(buf);buf=""}buf+=w});if(buf.trim())parts.push(buf);
  const v=thVoice();speaking=true;btn.textContent="■ หยุดอ่าน";let i=0;
  const next=()=>{if(!speaking||i>=parts.length){speaking=false;btn.textContent="🔊 ฟังเสียงอ่าน";return}
    const u=new SpeechSynthesisUtterance(parts[i++]);u.lang="th-TH";if(v)u.voice=v;u.rate=+P.rate;u.onend=next;u.onerror=()=>{speaking=false;btn.textContent="🔊 ฟังเสียงอ่าน"};speechSynthesis.speak(u)};
  if(!v)toast("ถ้าไม่มีเสียง ให้ติดตั้งเสียงภาษาไทยในการตั้งค่าเครื่อง");next()}
try{speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
/* recordings in IndexedDB (stay on this device) */
const idb={db:null,async open(){if(this.db)return this.db;return this.db=await new Promise((res,rej)=>{const r=indexedDB.open("tm-audio",1);r.onupgradeneeded=()=>r.result.createObjectStore("rec");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async get(k){try{const d=await this.open();return await new Promise(r=>{const q=d.transaction("rec").objectStore("rec").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}},
  async put(k,v){try{const d=await this.open();await new Promise(r=>{const t=d.transaction("rec","readwrite");t.objectStore("rec").put(v,k);t.oncomplete=r;t.onerror=r})}catch(e){toast("บันทึกเสียงไม่ได้ในเบราว์เซอร์นี้")}},
  async del(k){try{const d=await this.open();await new Promise(r=>{const t=d.transaction("rec","readwrite");t.objectStore("rec").delete(k);t.oncomplete=r})}catch(e){}}};
let mediaRec=null,player=null;
function bindAudio(s,root){const tts=root.querySelector("[data-tts]");if(!tts)return;
  tts.onclick=()=>speak("มาตรา "+th(s.no)+" "+bodyText(s),tts);
  root.querySelector("[data-rate]").onchange=e=>{P.rate=+e.target.value;save();if(speaking){stopSpeak();speak("มาตรา "+th(s.no)+" "+bodyText(s),tts)}};
  const rec=root.querySelector("[data-rec]"),play=root.querySelector("[data-play]"),del=root.querySelector("[data-delrec]"),filel=root.querySelector("[data-recfile]");
  idb.get(s.k).then(b=>{if(b){play.hidden=false;del.hidden=false}});
  play.onclick=async()=>{const b=await idb.get(s.k);if(!b)return;if(player){player.pause()}player=new Audio(URL.createObjectURL(b));player.play().catch(()=>toast("เล่นเสียงไม่ได้"))};
  del.onclick=async()=>{await idb.del(s.k);play.hidden=true;del.hidden=true;toast("ลบเสียงแล้ว")};
  filel.querySelector("input").onchange=async e=>{const f=e.target.files[0];if(f){await idb.put(s.k,f);play.hidden=false;del.hidden=false;toast("เก็บเสียงแล้ว");gainXP(3)}};
  rec.onclick=async()=>{
    if(mediaRec&&mediaRec.state==="recording"){mediaRec.stop();return}
    let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){filel.hidden=false;toast("หน้านี้ใช้ไมค์ไม่ได้ กด 'อัดด้วยแอปเครื่อง' แทน");return}
    const chunks=[];mediaRec=new MediaRecorder(stream);mediaRec.ondataavailable=e=>chunks.push(e.data);
    mediaRec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());rec.classList.remove("live");rec.textContent="● อัดเสียงท่อง";await idb.put(s.k,new Blob(chunks,{type:mediaRec.mimeType}));play.hidden=false;del.hidden=false;toast("เก็บเสียงแล้ว (อยู่ในเครื่องนี้)");gainXP(3)};
    mediaRec.start();rec.classList.add("live");rec.textContent="■ หยุดอัด"}}

let SAMPLE;const sampleP=window.claude?.use?claude.use("sample").then(x=>SAMPLE=x).catch(()=>null):Promise.resolve(null);
function bindAI(s,root){const row=root.querySelector("[data-ai-row]");if(!row)return;sampleP.then(sm=>{if(!sm||!row.isConnected)return;
  row.innerHTML=`<button class="btn sm" data-ai="explain">อธิบายง่าย ๆ (AI)</button><button class="btn sm" data-ai="q">ให้ AI ออกข้อสอบมาตรานี้</button>`;
  row.querySelectorAll("[data-ai]").forEach(b=>b.onclick=()=>askAI(b.dataset.ai,[s],row))})}
async function askAI(kind,list,row){const out=document.createElement("div");out.className="ai";out.textContent="กำลังคิด…";row.after(out);
  const src=list.map(s=>`[${lawShort(s)} มาตรา ${s.no}]\n${s.text}`).join("\n\n");
  const ins=kind==="explain"?"อธิบายมาตรานี้เป็นภาษาไทยง่าย ๆ สำหรับคนไม่เคยเรียนกฎหมาย: ใจความสำคัญ 2-4 ข้อ องค์ประกอบ/เงื่อนไข ผลทางกฎหมาย และตัวอย่างสั้น ๆ 1 ตัวอย่าง ห้ามแต่งเนื้อหาที่ไม่มีในตัวบท ห้ามอ้างเลขฎีกา ตอบเป็นข้อความธรรมดาไม่ใช้ markdown"
   :"ออกข้อสอบภาษาไทยจากตัวบทที่ให้ 3 ข้อ: ปรนัย 4 ตัวเลือก 2 ข้อ และอัตนัยแนวเขียนตอบ (ยกอุทาหรณ์) 1 ข้อ ใช้เฉพาะเนื้อหาในตัวบทนี้ ใส่เฉลยพร้อมอ้างมาตราท้ายแต่ละข้อ ตอบเป็นข้อความธรรมดาไม่ใช้ markdown";
  try{const r=await SAMPLE(`${ins}\n\nตัวบท:\n${src}`,{onText:({text})=>{out.textContent=text}});out.textContent=r.text;gainXP(2)}
  catch(e){out.textContent=e?.code==="rate_limited"?"ใช้ AI ถี่เกินไป ลองใหม่อีกสักครู่":"ตอนนี้เรียก AI ไม่ได้"}}

function stagesFor(L){const g=new Map();L.forEach(s=>{const id=s.law+"|"+(s.tk||"")+"|"+(s.chapter||"");if(!g.has(id))g.set(id,{id,law:s.law,tk:s.tk,chapter:s.chapter,list:[]});g.get(id).list.push(s)});return [...g.values()]}
function viewStage(v){const [law,b]=F.law.split("|");let groups;
  if(law==="ccc"){const books=b==="*"?TOC:[TOC.find(B=>B.b==b)];
    v.innerHTML=books.map(B=>{let lvl=0;const tiles=B.t.map(([t])=>{const T=TITLE["b"+B.b+"t"+t];const L=sorted([...SEC.values()].filter(s=>s.tk===T.key));
        if(!L.length){lvl++;return `<div class="stage locked"><span class="lvl">ด่าน ${lvl}</span><h3>${esc(T.name)}</h3><span class="meta num">ม.${th(T.lo)}–${th(T.hi)} · ยังไม่มีตัวบท</span><button class="btn sm" data-imp="${T.key}">นำเข้าตัวบท</button></div>`}

let STAGES={};
function stageTile(G,lvl,T){STAGES[G.id]=G;const tot=G.list.length,m=G.list.filter(s=>(P.cards[s.k]?.b||0)>=3).length;const st=P.cleared[G.id]||0;
  const title=G.chapter||(T?T.name:(G.tk||LAWS()[G.law]?.name||""));const sub=T&&G.chapter?T.name:"";
  return `<button class="stage ${st?"clear":""}" data-stage="${esc(G.id)}"><span class="lvl">ด่าน ${lvl}${st?" · ผ่านแล้ว":""}</span><h3>${esc(title)}</h3>${sub?`<span class="small">${esc(sub)}</span>`:""}
   <span class="meta num">ม.${th(G.list[0].no)}–${th(G.list.at(-1).no)} · ${tot} มาตรา</span><div class="bar"><i style="width:${tot?m/tot*100:0}%"></i></div>
   <span class="row"><span class="meta">จำแม่น ${m}/${tot}</span><span class="spacer"></span><span class="stars">${"★".repeat(st)}${"☆".repeat(3-st)}</span></span></button>`}
let BOSS=null;
function startBoss(id){const G=STAGES[id];if(!G)return;const pool=[...SEC.values()].filter(s=>s.law===G.law&&!s.rep);
  const qs=shuffle(G.list.filter(s=>!s.rep)).slice(0,Math.min(10,G.list.length)).map(s=>{const kind=Math.random()<.5?"num":"text";const others=shuffle(pool.filter(x=>x.k!==s.k&&(kind==="num"?x.no!==s.no:true))).slice(0,3);return {s,kind,opts:shuffle([s,...others])}});
  BOSS={G,qs,i:0,ok:0,ans:null};renderBoss()}
function renderBoss(){const v=$("#view");const B=BOSS;if(B.i>=B.qs.length){const pct=B.ok/B.qs.length;const stars=pct>=1?3:pct>=.8?2:pct>=.6?1:0;const prev=P.cleared[B.G.id]||0;
    if(stars>prev){P.cleared[B.G.id]=stars;gainXP(20*(stars-prev)+10,"ผ่านด่าน! +XP")}else save();
    v.innerHTML=`<div class="card"><h2>${stars?"ผ่านด่าน":"ยังไม่ผ่าน"} ${"★".repeat(stars)}${"☆".repeat(3-stars)}</h2><p class="meta">ตอบถูก ${B.ok}/${B.qs.length} (ผ่านเมื่อถูก 60% ขึ้นไป · 3 ดาวต้องถูกทุกข้อ)</p><div class="row"><button class="btn pri" id="bAgain">เล่นด่านนี้อีกครั้ง</button><button class="btn" id="bMap">กลับแผนที่ด่าน</button></div></div>`;
    $("#bAgain").onclick=()=>startBoss(B.G.id);$("#bMap").onclick=()=>{BOSS=null;render()};return}
  const q=B.qs[B.i];
  v.innerHTML=`<div class="card"><div class="row meta"><span>บอสด่าน · ข้อ <b class="num">${B.i+1}</b>/${B.qs.length}</span><span class="spacer"></span><span>ถูก ${B.ok}</span><button class="btn sm ghost" id="bQuit">ออก</button></div>
   ${q.kind==="num"?`<h2>ตัวบทนี้คือมาตราใด</h2><div class="lawtext">${fmtLaw(bodyText(q.s))}</div><div class="choices" style="grid-template-columns:repeat(2,1fr)">${q.opts.map((o,i)=>`<button class="choice num" data-o="${i}">มาตรา ${th(o.no)}</button>`).join("")}</div>`
   :`<h2>ข้อใดคือตัวบท มาตรา ${th(q.s.no)}</h2><div class="choices">${q.opts.map((o,i)=>`<button class="choice" data-o="${i}">${esc(clip(bodyText(o),180))}</button>`).join("")}</div>`}
   <div id="bNext"></div></div>`;
  $("#bQuit").onclick=()=>{BOSS=null;render()};
  v.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(B.ans!==null)return;const o=q.opts[+b.dataset.o];B.ans=o;const right=o.k===q.s.k;if(right)B.ok++;
    v.querySelectorAll("[data-o]").forEach(x=>{const ox=q.opts[+x.dataset.o];if(ox.k===q.s.k)x.classList.add("r");else if(x===b)x.classList.add("w")});
    grade(q.s.k,right?2:0);save();
    $("#bNext").innerHTML=`<div class="row"><span class="chip ${right?"ok":"bad"}">${right?"ถูก":"ผิด · คำตอบคือ มาตรา "+th(q.s.no)}</span><span class="spacer"></span><button class="btn pri" id="bN">ข้อต่อไป ›</button></div>`;
    $("#bN").onclick=()=>{B.i++;B.ans=null;renderBoss()}})}
function clip(t,n){t=t.replace(/\s+/g," ");return t.length>n?t.slice(0,n)+"…":t}

function viewType(v){const L=scope().filter(s=>!s.rep);if(!L.length&&!TYPE.k)return emptyScope(v);

    <button class="btn sm" id="tRand">สุ่ม</button></div>

     <div class="row"><button class="btn teal" id="tCheck">ตรวจคำตอบ</button><button class="btn" id="tHint">ใบ้ 10 ตัวอักษรถัดไป</button><span class="spacer"></span><button class="btn ghost" id="tShow">ดูเฉลย</button></div><div id="tRes"></div>`}
   </div>`;

  const sh=$("#tShow");if(sh)sh.onclick=()=>{$("#tRes").innerHTML=`<div class="lawtext" style="background:var(--sunk);border-radius:10px;padding:12px">${fmtLaw(bodyText(s))}</div>`};
  const hi=$("#tHint");if(hi)hi.onclick=()=>{if(TYPE.style==="full"){const tgt=bodyText(s);const typed=tin.value;const n=norm(typed).length;let cnt=0,i=0;for(;i<tgt.length&&cnt<n;i++)if(!/\s/.test(tgt[i]))cnt++;tin.value=typed+tgt.slice(i,i+10);TYPE.input=tin.value;tin.focus()}
    else{const e=[...document.querySelectorAll("#tCloze input")].find(x=>!x.value);if(e)e.value=e.dataset.a.slice(0,1)}}}
function pickNext(L,rand){if(rand)return L[Math.random()*L.length|0].k;const w=L.filter(s=>(P.cards[s.k]?.best??-1)<90);return (w[0]||L[0]).k}
const norm=t=>ar(t).replace(/[\s​]+/g,"").replace(/[“”"]/g,'"');
function lcsDiff(a,b){const n=a.length,m=b.length;if(n*m>12e6)return null;const W=m+1;const dp=new Uint16Array((n+1)*W);
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i*W+j]=a[i]===b[j]?dp[(i+1)*W+j+1]+1:Math.max(dp[(i+1)*W+j],dp[i*W+j+1]);
  const ops=[];let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){ops.push(["=",a[i]]);i++;j++}else if(dp[(i+1)*W+j]>=dp[i*W+j+1]){ops.push(["-",a[i]]);i++}else{ops.push(["+",b[j]]);j++}}
  while(i<n)ops.push(["-",a[i++]]);while(j<m)ops.push(["+",b[j++]]);return {lcs:dp[0],ops}}
function checkType(s){const res=$("#tRes");
  if(TYPE.style==="num"){const g=ar($("#tNum").value.trim());const ok=g===s.no;grade(s.k,ok?2:0);gainXP(ok?6:1);res.innerHTML=`<div class="row"><span class="chip ${ok?"ok":"bad"}">${ok?"ถูกต้อง":"ยังไม่ถูก · คำตอบคือ มาตรา "+th(s.no)}</span><span class="spacer"></span><button class="btn pri" id="tNext">ข้อต่อไป ›</button></div>`;$("#tNext").onclick=()=>{TYPE.k=pickNext(scope(),true);render()};return}
  let pct,html;
  if(TYPE.style==="cloze"){const ins=[...document.querySelectorAll("#tCloze input")];let ok=0;ins.forEach(x=>{const r=norm(x.value)===norm(x.dataset.a);if(r)ok++;x.classList.toggle("r",r);x.classList.toggle("w",!r);if(!r)x.title="เฉลย: "+x.dataset.a});
    pct=ins.length?Math.round(ok/ins.length*100):100;html=`<p class="meta">ช่องที่ผิดเป็นสีแดง แตะค้างหรือชี้เพื่อดูเฉลย</p>`}
  else{const tgt=norm(bodyText(s)),got=norm($("#tIn").value);if(!got){toast("พิมพ์ตัวบทก่อนกดตรวจ");return}
    const d=lcsDiff(tgt,got);if(!d){toast("มาตรานี้ยาวมาก ลองโหมดเติมคำแทน");return}
    pct=Math.round(d.lcs/Math.max(tgt.length,got.length)*100);
    let h="",cur=null,buf="";const flush=()=>{if(buf)h+=cur==="="?esc(buf):cur==="-"?`<span class="miss">${esc(buf)}</span>`:`<span class="extra">${esc(buf)}</span>`;buf=""};
    d.ops.forEach(([o,c])=>{if(o!==cur){flush();cur=o}buf+=c});flush();
    html=`<p class="meta">ตัวที่ขาดหรือพิมพ์ผิด <span class="chip bad">ขีดแดง</span> ตัวที่เกินมา <span class="chip warn">ขีดฆ่า</span></p><div class="diff">${h}</div>`}
  const c=card(s.k);c.best=Math.max(c.best??0,pct);grade(s.k,pct>=90?2:pct>=60?1:0);gainXP(pct/5);
  const lv=pct>=95?["ok","แม่นมาก"]:pct>=80?["ok","ดี"]:pct>=60?["warn","ใกล้แล้ว"]:["bad","ต้องทวน"];
  res.innerHTML=`<div class="score"><b class="num" style="color:var(--${lv[0]})">${pct}%</b><span class="chip ${lv[0]}">${lv[1]}</span><span class="meta">ถูก ${pct}% · ผิด/ขาด ${100-pct}% · ดีที่สุด ${c.best}%</span><span class="spacer"></span><button class="btn pri" id="tNext">มาตราถัดไป ›</button></div>${html}`;
  $("#tNext").onclick=()=>{const L=scope();const i=L.findIndex(x=>x.k===s.k);TYPE.k=(L[i+1]||L[0]).k;TYPE.input="";CLOZE=null;render()}}
let CLOZE=null;
const KEYW=["โมฆะ","โมฆียะ","สุจริต","บริบูรณ์","ผู้แทนโดยชอบธรรม","นิติกรรม","ความยินยอม","เจตนา","บอกล้าง","สัตยาบัน","อายุความ","ภายใน","ไม่ได้","ย่อม","ต้อง","อาจ","เว้นแต่","โดยอนุโลม","ศาล","ราชกิจจานุเบกษา","หนังสือ","ลายมือชื่อ","ทรัพย์","กรรมสิทธิ์","ค่าสินไหมทดแทน","ละเมิด","ลูกหนี้","เจ้าหนี้","ผิดนัด","ดอกเบี้ย"];
function clozeHTML(s){const t=bodyText(s);if(!CLOZE||CLOZE.k!==s.k){let segs;try{segs=[...new Intl.Segmenter("th",{granularity:"word"}).segment(t)].map(x=>({w:x.segment,ok:x.isWordLike}))}catch(e){segs=t.split(/(\s+)/).map(w=>({w,ok:/\S/.test(w)}))}
    const cand=segs.map((x,i)=>i).filter(i=>segs[i].ok&&segs[i].w.length>=2&&!/^[()๐-๙\d]+$/.test(segs[i].w));
    const pri=cand.filter(i=>KEYW.some(k=>segs[i].w.includes(k)||k.includes(segs[i].w)&&segs[i].w.length>=3));
    const want=Math.max(3,Math.round(cand.length*.14));const pick=new Set([...shuffle(pri).slice(0,Math.ceil(want*.6)),...shuffle(cand)].slice(0,want*2));const chosen=new Set([...pick].slice(0,want));
    CLOZE={k:s.k,segs,chosen}}
  return CLOZE.segs.map((x,i)=>CLOZE.chosen.has(i)?`<input data-a="${esc(x.w)}" size="${Math.max(2,x.w.length)}" aria-label="ช่องว่าง">`:esc(x.w).replace(/\n/g,"<br>")).join("")}

function viewLib(v){if(F.q)return viewSearch(v);

function parseLawText(raw){const out=[];let chapter="",part="",cur=null,title="";
  const lines=raw.replace(/\r/g,"").split("\n");
  for(let line of lines){let s=line.replace(/^\s*(#+|\*\*|- )\s*/,"").replace(/\*\*/g,"").trim();if(!s)continue;
    if(/\]\(|https?:\/\//.test(s)){if(cur&&/ถัดไป|กลับไป/.test(s))cur.done=true;continue}
    if(/^(ถัดไป|กลับไปที่|ตัวบทในหน้านี้|พกไปได้ทันที|← )/.test(s)){if(cur)cur.done=true;continue}
    if(/^(แท็บใหม่|แผนภาพ|ที่มา$|หน้านี้เรียบเรียง|โครงสร้าง)/.test(s)||/มาตรา\s*\d+(\/\d+)?\s*[–-]\s*มาตรา/.test(s))continue;
    const h=s.match(/^(บรรพ|ลักษณะ|หมวด|ส่วนที่)\s*([๐-๙\d]+)\s+(.{1,70})$/);
    if(h&&!/มาตรา/.test(h[3])){if(h[1]==="หมวด"){chapter=s;part=""}else if(h[1]==="ส่วนที่")part=s;else if(h[1]==="ลักษณะ"){title=s;chapter="";part=""}if(cur)cur.done=true;cur=null;continue}
    const m=s.match(/^มาตรา\s*([๐-๙\d]+(?:\/[๐-๙\d]+)?)(\s+(?:ทวิ|ตรี|จัตวา|เบญจ|ฉ|สัตต|อัฏฐ|นว|ทศ))?\s*(.*)$/);
    if(m){const no=ar(m[1])+(m[2]?" "+m[2].trim():"");if(!m[3]){continue}
      if(/^[๐-๙]/.test(m[1])||!cur||cur.no!==no){if(out.length&&out.at(-1).no===no&&!/^[๐-๙]/.test(m[1]))continue;cur={no,chapter,part,title,text:"มาตรา "+th(ar(m[1]))+(m[2]||"")+" "+m[3]};out.push(cur);continue}}
    if(cur&&!cur.done)cur.text+="\n"+s}
  const seen=new Map();out.forEach(x=>seen.set(x.no,x));return [...seen.values()].map(({no,chapter,part,title,text})=>({no,chapter,part,title,text:text.trim()}))}
function expected(lo,hi){const a=noKey(lo),b=noKey(hi);const r=[];
  if(a[0]===b[0]&&a[1]&&b[1]){for(let i=a[1];i<=b[1];i++)r.push(a[0]+"/"+i)}
  else for(let n=a[0]+(a[1]?1:0);n<=b[0];n++)r.push(String(n));return r}

function previewImport(){const raw=$("#iText").value;const res=$("#iRes");if(!raw.trim()){res.innerHTML=`<p class="chip warn">ยังไม่ได้วางข้อความ</p>`;return}

  if(!IMP.other){const T=IMP.T;const out=secs.filter(s=>!inRange(s.no.split(" ")[0],T.lo,T.hi));secs=secs.filter(s=>inRange(s.no.split(" ")[0],T.lo,T.hi));
    const have=new Set(secs.map(s=>s.no.split(" ")[0]));const miss=expected(T.lo,T.hi).filter(n=>!have.has(n));
    if(out.length)warn+=`<p class="chip warn">ข้าม ${out.length} มาตราที่อยู่นอกช่วง (เช่น ม.${th(out[0].no)})</p>`;
    warn+=miss.length?`<p class="meta" style="color:var(--warn)">ยังขาด ${miss.length} มาตรา: ${miss.slice(0,30).map(th).join(", ")}${miss.length>30?" …":""} ตรวจว่าวางครบทั้งหน้าหรือยัง</p>`:`<p class="chip ok">ครบทุกเลขมาตราในช่วงนี้</p>`}
  IMP.secs=secs;$("#iSave").disabled=!secs.length;
  res.innerHTML=secs.length?`<p class="meta">พบ <b class="num">${secs.length}</b> มาตรา (ม.${th(secs[0].no)} ถึง ม.${th(secs.at(-1).no)})</p>${warn}
    <div class="ai" style="max-height:180px;overflow:auto;font-family:var(--f-law)">${esc(secs[0].text)}\n\n…\n\n${esc(secs.at(-1).text)}</div>`:`<p class="chip bad">ไม่พบมาตราในข้อความนี้ ตรวจว่าคัดลอกจากหน้าตัวบท</p>`}
async function commitImport(){const secs=IMP.secs||[];if(!secs.length)return;let law="ccc",lawName="ประมวลกฎหมายแพ่งและพาณิชย์",tk=IMP.T?.key;
  if(IMP.other){law=$("#iLaw").value;if(law==="__new"){lawName=$("#iNew").value.trim();if(!lawName)return toast("ใส่ชื่อกฎหมาย");law="x"+Date.now().toString(36)}else lawName=LAWS()[law].name;tk=$("#iGrp").value.trim()||secs[0].title||""}
  const rows=secs.map(s=>[s.no,s.chapter||"",s.part||"",s.text]);
  const chunks=[];let cur=[],size=0;rows.forEach(r=>{const b=new Blob([JSON.stringify(r)]).size;if(size+b>180000&&cur.length){chunks.push(cur);cur=[];size=0}cur.push(r);size+=b});if(cur.length)chunks.push(cur);
  const base=(IMP.other?law+"_"+(tk?hash(tk):"all"):tk);
  Object.keys(imported).filter(id=>id.startsWith(base+"_")).forEach(id=>delete imported[id]);
  chunks.forEach((c,i)=>imported[base+"_"+i]={law,lawName,tk,sections:c,savedAt:Date.now()});
  const okLocal=ls.set("tm-lawtext",imported);rebuildImported();refreshFilters();
  let cloud=false;if(DB){try{for(let i=0;i<chunks.length;i++)await DB.doc("lawtext/"+base+"_"+i).set(imported[base+"_"+i]);for(let i=chunks.length;i<chunks.length+5;i++){try{await DB.doc("lawtext/"+base+"_"+i).delete()}catch(e){}}cloud=true}catch(e){console.warn(e)}}
  dlg.close();toast(`นำเข้า ${secs.length} มาตราแล้ว`+(cloud?" · ซิงก์ทุกเครื่อง":okLocal?" · เก็บในเครื่องนี้":""));render()}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return (h>>>0).toString(36)}
/* auto-fetch via the Claude desktop app's built-in browser (host:claude_browser) */
const mcpP=window.claude?.use?claude.use("mcp").catch(()=>null):Promise.resolve(null);
function blocksText(r){const t=(r?.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");return t||(typeof r?.payload==="string"?r.payload:JSON.stringify(r?.payload||""))}
async function autoFetch(T){const m=await mcpP;const res=$("#iRes");res.innerHTML=`<p class="meta">กำลังเปิดหน้าต้นฉบับในเบราว์เซอร์ของแอป Claude…</p>`;
  try{const S="host:claude_browser";const r=await m.callTool(S,"preview_start",{url:T.url});const txt=blocksText(r);
    const tabId=r?.payload?.tabId??(txt.match(/tab\s*_?id\D{0,4}(\d+)/i)||[])[1];
    await new Promise(z=>setTimeout(z,3000));
    const g=await m.callTool(S,"get_page_text",tabId!=null?{tabId:Number(tabId)}:{});let page=blocksText(g);
    if(!/มาตรา/.test(page))throw {code:"empty"};
    $("#iText").value=page;previewImport()}
  catch(e){res.innerHTML=`<p class="chip warn">ดึงอัตโนมัติไม่สำเร็จ (${esc(e?.code||"error")}) ใช้วิธีคัดลอกแล้ววางแทนได้</p>`}}

/* ---------- boot ---------- */
rebuildImported();refreshFilters();renderRank();render();initCloud();
</script>

if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
