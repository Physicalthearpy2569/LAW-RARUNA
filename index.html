บุคคลใดทำให้สัตว์ป่าบาดเจ็บแล้วติดตามไปและบุคคลอื่นจับสัตว์นั้นได้ก็ดี หรือสัตว์นั้นตายลงในที่ดินของบุคคลอื่นก็ดี ท่านว่าบุคคลแรกเป็นเจ้าของสัตว์"],["1323","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๒๓ บุคคลเก็บได้ซึ่งทรัพย์สินหาย ต้องทำอย่างหนึ่งอย่างใดดังต่อไปนี้\n(๑) ส่งมอบทรัพย์สินนั้นแก่ผู้ของหายหรือเจ้าของ หรือบุคคลอื่นผู้มีสิทธิจะรับทรัพย์สินนั้น หรือ\n(๒) แจ้งแก่ผู้ของหายหรือเจ้าของ หรือบุคคลอื่นผู้มีสิทธิจะรับทรัพย์สินนั้นโดยมิชักช้า หรือ\n(๓) ส่งมอบทรัพย์สินนั้นแก่เจ้าพนักงานตำรวจ หรือพนักงานเจ้าหน้าที่อื่นภายในสามวันและแจ้งพฤติการณ์ตามที่ทราบอันอาจเป็นเครื่องช่วยในการสืบหาตัวบุคคลผู้มีสิทธิจะรับทรัพย์สินนั้น\nแต่ถ้าไม่ทราบตัวผู้ของหาย เจ้าของ หรือบุคคลอื่นผู้มีสิทธิจะรับทรัพย์สินก็ดี หรือบุคคลดังระบุนั้นไม่รับมอบทรัพย์สินก็ดี ท่านให้ดำเนินการตามวิธีอันบัญญัติไว้ในอนุมาตรา (๓)\nทั้งนี้ ท่านว่าผู้เก็บได้ซึ่งทรัพย์สินหายต้องรักษาทรัพย์สินนั้นไว้ด้วยความระมัดระวังอันสมควรจนกว่าจะส่งมอบ"],["1324","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๒๔ ผู้เก็บได้ซึ่งทรัพย์สินหาย อาจเรียกร้องเอารางวัลจากบุคคลผู้มีสิทธิจะรับทรัพย์สินนั้นเป็นจำนวนร้อยละสิบแห่งค่าทรัพย์สินภายในราคาสามหมื่นบาทและถ้าราคาสูงกว่านั้นขึ้นไปให้คิดให้อีกร้อยละห้าในจำนวนที่เพิ่มขึ้น แต่ถ้าผู้เก็บได้ซึ่งทรัพย์สินหายได้ส่งมอบทรัพย์สินแก่เจ้าพนักงานตำรวจหรือพนักงานเจ้าหน้าที่อื่น ให้เสียเงินอีกร้อยละสองครึ่งแห่งค่าทรัพย์สินเป็นค่าธรรมเนียมแก่ทบวงการนั้น ๆ เพิ่มขึ้นเป็นส่วนหนึ่งต่างหากจากรางวัลซึ่งให้แก่ผู้เก็บได้แต่ค่าธรรมเนียมนี้ให้จำกัดไว้ไม่เกินหนึ่งพันบาท\nถ้าผู้เก็บได้ซึ่งทรัพย์สินหายมิได้ปฏิบัติตามบทบัญญัติในมาตราก่อนไซร้ ท่านว่าผู้นั้นไม่มีสิทธิจะรับรางวัล"],["1325","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๒๕ ถ้าผู้เก็บได้ซึ่งทรัพย์สินหายได้ปฏิบัติตามบทบัญญัติมาตรา ๑๓๒๓ แล้ว และผู้มีสิทธิจะรับทรัพย์สินนั้นมิได้เรียกเอาภายในหนึ่งปีนับแต่วันที่เก็บได้ไซร้ ท่านว่ากรรมสิทธิ์ตกแก่ผู้เก็บได้\nแต่ถ้าทรัพย์สินซึ่งไม่มีผู้เรียกเอานั้นเป็นโบราณวัตถุไซร้ กรรมสิทธิ์แห่งทรัพย์สินนั้นตกแก่แผ่นดิน แต่ผู้เก็บได้มีสิทธิจะได้รับรางวัลร้อยละสิบแห่งค่าทรัพย์สินนั้น"],["1326","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๒๖ การเก็บได้ซึ่งทรัพย์สินอันตกหรือทิ้งทะเล หรือทางน้ำหรือน้ำซัดขึ้นฝั่งนั้น ท่านให้บังคับตามกฎหมายและกฎข้อบังคับว่าด้วยการนั้น"],["1327","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๒๗ ภายในบังคับแห่งกฎหมายอาญา กรรมสิทธิ์แห่งสิ่งใด ๆ ซึ่งได้ใช้ในการกระทำผิด หรือได้มาโดยการกระทำผิด หรือเกี่ยวกับการกระทำผิดโดยประการอื่น และได้ส่งไว้ในความรักษาของกรมในรัฐบาลนั้น ท่านว่าตกเป็นของแผ่นดิน ถ้าเจ้าของมิได้เรียกเอาภายในหนึ่งปีนับแต่วันส่ง หรือถ้าได้ฟ้องคดีอาญาต่อศาลแล้วนับแต่วันที่คำพิพากษาถึงที่สุด แต่ถ้าไม่ทราบตัวเจ้าของ ท่านให้ผ่อนเวลาออกไปเป็นห้าปี\nถ้าทรัพย์สินเป็นของเสียง่าย หรือถ้าหน่วงช้าไว้จะเป็นการเสี่ยงความเสียหายหรือค่าใช้จ่ายจะเกินส่วนกับค่าของทรัพย์สินนั้นไซร้ ท่านว่ากรมในรัฐบาลจะจัดให้เอาออกขายทอดตลาดก่อนถึงกำหนดก็ได้ แต่ก่อนที่จะขายให้จัดการตามควรเพื่อบันทึกรายการอันเป็นเครื่องให้บุคคลผู้มีสิทธิจะรับทรัพย์สินนั้นอาจทราบว่าเป็นทรัพย์สินของตนและพิสูจน์สิทธิได้ เมื่อขายแล้วได้เงินเป็นจำนวนสุทธิเท่าใดให้ถือไว้แทนตัวทรัพย์สิน"],["1328","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๒๘ สังหาริมทรัพย์มีค่าซึ่งซ่อนหรือฝังไว้นั้น ถ้ามีผู้เก็บได้โดยพฤติการณ์ซึ่งไม่มีผู้ใดสามารถอ้างว่าเป็นเจ้าของได้ ให้กรรมสิทธิ์ตกเป็นของแผ่นดิน ผู้เก็บได้ต้องส่งมอบทรัพย์นั้นแก่เจ้าพนักงานตำรวจหรือพนักงานเจ้าหน้าที่อื่น แล้วมีสิทธิจะได้รับรางวัลหนึ่งในสามแห่งค่าทรัพย์นั้น"],["1329","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๒๙ สิทธิของบุคคลผู้ได้มาซึ่งทรัพย์สินโดยมีค่าตอบแทนและโดยสุจริตนั้น ท่านว่ามิเสียไป ถึงแม้ว่าผู้โอนทรัพย์สินให้จะได้ทรัพย์สินนั้นมาโดยนิติกรรมอันเป็นโมฆียะ และนิติกรรมนั้นได้ถูกบอกล้างภายหลัง"],["1330","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๓๐ สิทธิของบุคคลผู้ซื้อทรัพย์สินโดยสุจริตในการขายทอดตลาดตามคำสั่งศาล หรือคำสั่งเจ้าพนักงานรักษาทรัพย์ในคดีล้มละลายนั้น ท่านว่ามิเสียไป ถึงแม้ภายหลังจะพิสูจน์ได้ว่าทรัพย์สินนั้นมิใช่ของจำเลย หรือลูกหนี้โดยคำพิพากษา\nหรือผู้ล้มละลาย"],["1331","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๓๑ สิทธิของบุคคลผู้ได้เงินตรามาโดยสุจริตนั้น ท่านว่ามิเสียไป ถึงแม้ภายหลังจะพิสูจน์ได้ว่าเงินนั้นมิใช่ของบุคคลซึ่งได้โอนให้มา"],["1332","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๓๒ บุคคลผู้ซื้อทรัพย์สินมาโดยสุจริตในการขายทอดตลาด หรือในท้องตลาด หรือจากพ่อค้าซึ่งขายของชนิดนั้น ไม่จำต้องคืนให้แก่เจ้าของแท้จริง เว้นแต่เจ้าของจะชดใช้ราคาที่ซื้อมา"],["1333","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๓๓ ท่านว่ากรรมสิทธิ์นั้น อาจได้มาโดยอายุความตามที่บัญญัติไว้ในลักษณะ ๓ แห่งบรรพนี้"],["1334","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๓๔ ที่ดินรกร้างว่างเปล่า และที่ดินซึ่งมีผู้เวนคืนหรือทอดทิ้งหรือกลับมาเป็นของแผ่นดินโดยประการอื่นตามกฎหมายที่ดินนั้น ท่านว่าบุคคลอาจได้มาตามกฎหมายที่ดิน"],["1335","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๓๕ ภายในบังคับแห่งบทบัญญัติในประมวลกฎหมายนี้หรือกฎหมายอื่น ท่านว่าแดนแห่งกรรมสิทธิ์ที่ดินนั้นกินทั้งเหนือพื้นดินและใต้พื้นดินด้วย"],["1336","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๓๖ ภายในบังคับแห่งกฎหมาย เจ้าของทรัพย์สินมีสิทธิใช้สอยและจำหน่ายทรัพย์สินของตนและได้ซึ่งดอกผลแห่งทรัพย์สินนั้น กับทั้งมีสิทธิติดตามและเอาคืนซึ่งทรัพย์สินของตนจากบุคคลผู้ไม่มีสิทธิจะยึดถือไว้ และมีสิทธิขัดขวางมิให้ผู้อื่นสอดเข้าเกี่ยวข้องกับทรัพย์สินนั้นโดยมิชอบด้วยกฎหมาย"],["1337","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๓๗ บุคคลใดใช้สิทธิของตนเป็นเหตุให้เจ้าของอสังหาริมทรัพย์ได้รับความเสียหาย หรือเดือดร้อนเกินที่ควรคิดหรือคาดหมายได้ว่าจะเป็นไปตามปกติและเหตุอันควรในเมื่อเอาสภาพและตำแหน่งที่อยู่แห่งทรัพย์สินนั้นมาคำนึงประกอบไซร้ ท่านว่าเจ้าของอสังหาริมทรัพย์มีสิทธิจะปฏิบัติการเพื่อยังความเสียหายหรือเดือนร้อนนั้นให้สิ้นไป ทั้งนี้ ไม่ลบล้างสิทธิที่จะเรียกเอาค่าทดแทน"],["1338","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๓๘ ข้อจำกัดสิทธิแห่งเจ้าของอสังหาริมทรัพย์ซึ่งกฎหมายกำหนดไว้นั้น ท่านว่าไม่จำต้องจดทะเบียน\nข้อจำกัดเช่นนี้ ท่านว่าจะถอนหรือแก้ให้หย่อนลงโดยนิติกรรมไม่ได้ นอกจากจะได้ทำนิติกรรมเป็นหนังสือและจดทะเบียนกับพนักงานเจ้าหน้าที่\nข้อจำกัดซึ่งกำหนดไว้เพื่อสาธารณประโยชน์นั้น ท่านว่าจะถอนหรือแก้ให้หย่อนลงมิได้เลย"],["1339","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๓๙ เจ้าของที่ดินจำต้องรับน้ำซึ่งไหลตามธรรมดาจากที่ดินสูงมาในที่ดินของตน\nน้ำไหลตามธรรมดามายังที่ดินต่ำ และจำเป็นแก่ที่ดินนั้นไซร้ ท่านว่าเจ้าของที่ดินซึ่งอยู่สูงกว่าจะกันเอาไว้ได้เพียงที่จำเป็นแก่ที่ดินของตน"],["1340","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๔๐ เจ้าของที่ดินจำต้องรับน้ำซึ่งไหลเพราะระบายจากที่ดินสูงมาในที่ดินของตน ถ้าก่อนที่ระบายนั้นน้ำได้ไหลเข้ามาในที่ดินของตนตามธรรมดาอยู่แล้ว\nถ้าได้รับความเสียหายเพราะการระบายน้ำ ท่านว่าเจ้าของที่ดินต่ำอาจเรียกร้องให้เจ้าของที่ดินสูงทำทางระบายน้ำและออกค่าใช้จ่ายในการนั้น เพื่อระบายน้ำไปให้ตลอดที่ดินต่ำจนถึงทางน้ำ หรือท่อน้ำสาธารณะ ทั้งนี้ ไม่ลบล้างสิทธิแห่งเจ้าของที่ดินต่ำในอันจะเรียกเอาค่าทดแทน"],["1341","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๔๑ ท่านมิให้เจ้าของอสังหาริมทรัพย์ทำหลังคาหรือการปลูกสร้างอย่างอื่น ซึ่งทำให้น้ำฝนตกลงยังทรัพย์สินซึ่งอยู่ติดต่อกัน"],["1342","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๔๒ บ่อ สระ หลุมรับน้ำโสโครก หรือหลุมรับปุ๋ย หรือขยะมูลฝอยนั้น ท่านว่าจะขุดในระยะสองเมตรจากแนวเขตที่ดินไม่ได้\nคูหรือการขุดร่องเพื่อวางท่อน้ำใต้ดินหรือสิ่งอื่นซึ่งคล้ายกันนั้น ท่านว่าจะทำใกล้แนวเขตที่ดินกว่าครึ่งหนึ่งแห่งส่วนลึกของคูหรือร่องนั้นไม่ได้ แต่ถ้าทำห่างแนวเขตหนึ่งเมตรหรือกว่านั้น ท่านว่าทำได้\nถ้ากระทำการดังกล่าวไว้ในสองวรรคก่อนใกล้แนวเขตไซร้ ท่านว่าต้องใช้ความระมัดระวังตามควร เพื่อป้องกันมิให้ดินหรือทรายพังลง หรือมิให้น้ำหรือสิ่งโสโครกซึมเข้าไป"],["1343","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๔๓ ห้ามมิให้ขุดดินหรือบรรทุกน้ำหนักบนที่ดินเกินควรจนอาจเป็นเหตุอันตรายแก่ความอยู่มั่นแห่งที่ดินติดต่อ เว้นแต่จะจัดการเพียงพอเพื่อป้องกันความเสียหาย"],["1344","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๔๔ รั้ว กำแพง รั้วต้นไม้ คู ซึ่งหมายเขตที่ดินนั้น ท่านให้สันนิษฐานไว้ก่อนว่าเจ้าของที่ดินทั้งสองข้างเป็นเจ้าของรวมกัน"],["1345","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๔๕ เมื่อรั้วต้นไม้ หรือคูซึ่งมิได้ใช้เป็นทางระบายน้ำ เป็นของเจ้าของที่ดินทั้งสองข้างรวมกัน ท่านว่าเจ้าของข้างใดข้างหนึ่งมีสิทธิที่จะตัดรั้วต้นไม้ หรือถมคูนั้นได้ถึงแนวเขตที่ดินของตน แต่ต้องก่อกำแพง หรือทำรั้วตามแนวเขตนั้น"],["1346","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๔๖ ถ้ามีต้นไม้อยู่บนแนวเขตที่ดิน ท่านให้สันนิษฐานไว้ก่อนว่าเจ้าของที่ดินทั้งสองข้างเป็นเจ้าของต้นไม้รวมกัน ดอกผลเป็นของเจ้าของที่ดินคนละส่วนเสมอกัน และถ้าตัดต้นลงไซร้ ไม้นั้นเป็นของเจ้าของที่ดินคนละส่วนดุจกัน\nเจ้าของแต่ละฝ่ายจะต้องการให้ขุดหรือตัดต้นไม้ก็ได้ ค่าใช้จ่ายในการนั้นต้องเสียเท่ากันทั้งสองฝ่าย แต่ถ้าเจ้าของอีกฝ่ายหนึ่งสละสิทธิในต้นไม้ไซร้ ฝ่ายที่ต้องการขุดหรือตัดต้องเสียค่าใช้จ่ายฝ่ายเดียว ถ้าต้นไม้นั้นเป็นหลักเขตและจะหาหลักเขตอื่นไม่เหมาะเหมือน ท่านว่าฝ่ายหนึ่งฝ่ายใดจะต้องการให้ขุดหรือตัดไม่ได้"],["1347","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๔๗ เจ้าของที่ดินอาจตัดรากไม้ซึ่งรุกเข้ามาจากที่ดินติดต่อและเอาไว้เสีย ถ้ากิ่งไม้ยื่นล้ำเข้ามา เมื่อเจ้าของที่ดินได้บอกผู้ครอบครองที่ดินติดต่อให้ตัดภายในเวลาอันสมควรแล้ว แต่ผู้นั้นไม่ตัด ท่านว่าเจ้าของที่ดินตัดเอาเสียได้"],["1348","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๔๘ ดอกผลแห่งต้นไม้ที่หล่นตามธรรมดาลงในที่ดินติดต่อแปลงใด ท่านให้สันนิษฐานไว้ก่อนว่าเป็นดอกผลของที่ดินแปลงนั้น"],["1349","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๔๙ ที่ดินแปลงใดมีที่ดินแปลงอื่นล้อมอยู่จนไม่มีทางออกถึงทางสาธารณะได้ไซร้ ท่านว่าเจ้าของที่ดินแปลงนั้นจะผ่านที่ดินซึ่งล้อมอยู่ไปสู่ทางสาธารณะได้\nที่ดินแปลงใดมีทางออกได้แต่เมื่อต้องข้ามสระ บึง หรือทะเล หรือมีที่ชันอันระดับที่ดินกับทางสาธารณะสูงกว่ากันมากไซร้ ท่านว่าให้ใช้ความในวรรคต้นบังคับ\nที่และวิธีทำทางผ่านนั้นต้องเลือกให้พอควรแก่ความจำเป็นของผู้มีสิทธิจะผ่าน กับทั้งให้คำนึงถึงที่ดินที่ล้อมอยู่ให้เสียหายแต่น้อยที่สุดที่จะเป็นได้ ถ้าจำเป็น ผู้มีสิทธิจะผ่านจะสร้างถนนเป็นทางผ่านก็ได้\nผู้มีสิทธิจะผ่านต้องใช้ค่าทดแทนให้แก่เจ้าของที่ดินที่ล้อมอยู่เพื่อความเสียหายอันเกิดแต่เหตุที่มีทางผ่านนั้น ค่าทดแทนนั้นนอกจากค่าเสียหายเพราะสร้างถนน ท่านว่าจะกำหนดเป็นเงินรายปีก็ได้"],["1350","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๕๐ ถ้าที่ดินแบ่งแยกหรือแบ่งโอนกันเป็นเหตุให้แปลงหนึ่งไม่มีทางออกไปสู่ทางสาธารณะไซร้ ท่านว่าเจ้าของที่ดินแปลงนั้นมีสิทธิเรียกร้องเอาทางเดินตามมาตราก่อนได้เฉพาะบนที่ดินแปลงที่ได้แบ่งแยกหรือแบ่งโอนกันและไม่ต้องเสียค่าทดแทน"],["1351","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๕๑ เจ้าของที่ดิน เมื่อบอกล่วงหน้าตามสมควรแล้ว อาจใช้ที่ดินติดต่อเพียงที่จำเป็นในการปลูกสร้างหรือซ่อมแซมรั้ว กำแพง หรือโรงเรือน ตรงหรือใกล้แนวเขตของตน แต่จะเข้าไปในเรือนที่อยู่ของเพื่อนบ้านข้างเคียงไม่ได้ เว้นแต่ได้รับความยินยอม\nถ้าได้ก่อความเสียหายให้เกิดขึ้นไซร้ ท่านว่าเพื่อนบ้านข้างเคียงจะเรียกเอาค่าทดแทนก็ได้"],["1352","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๕๒ ท่านว่าถ้าเจ้าของที่ดินได้รับค่าทดแทนตามสมควรแล้ว ต้องยอมให้ผู้อื่นวางท่อน้ำ ท่อระบายน้ำ สายไฟฟ้า หรือสิ่งอื่นซึ่งคล้ายกันผ่านที่ดินของตน เพื่อประโยชน์แก่ที่ดินติดต่อ ซึ่งถ้าไม่ยอมให้ผ่านก็ไม่มีทางจะวางได้ หรือถ้าจะวางได้ก็เปลืองเงินมากเกินควร แต่เจ้าของที่ดินอาจให้ยกเอาประโยชน์ของตนขึ้นพิจารณาด้วย\nเมื่อมีเหตุผลพิเศษ ถ้าจะต้องวางเหนือพื้นดินไซร้ ท่านว่าเจ้าของที่ดินอาจเรียกให้ซื้อที่ดินของตนบางส่วนตามควรที่จะใช้ในการนั้น โดยราคาคุ้มค่าที่ดินและค่าทดแทนความเสียหาย ซึ่งอาจมีเพราะการขายนั้นด้วย\nถ้าพฤติการณ์เปลี่ยนไป เจ้าของที่ดินอาจเรียกให้ย้ายถอนสิ่งที่วางนั้นไปไว้ ณ ส่วนอื่นแห่งที่ดินของตนตามแต่จะเหมาะแก่ประโยชน์แห่งเจ้าของที่ดิน\nค่าย้ายถอนนั้นเจ้าของที่ดินติดต่อเป็นผู้เสีย แต่ถ้ามีพฤติการณ์พิเศษไซร้ ท่านว่าจะให้เจ้าของที่ดินอีกฝ่ายหนึ่งช่วยเสียค่าย้ายถอนตามส่วนอันควรก็ได้"],["1353","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๕๓ บุคคลอาจพาปศุสัตว์ของตนผ่านหรือเข้าไปในที่ดินของผู้อื่นซึ่งมิได้กั้นเพื่อไปเลี้ยง และอาจเข้าไปเอาน้ำในบ่อหรือสระในที่เช่นว่านั้นมาใช้ได้ เว้นแต่ที่ดินเป็นที่เพาะปลูก หรือเตรียมเพื่อเพาะปลูก หว่าน หรือมีธัญชาติขึ้นอยู่แล้ว แต่ท่านว่าเจ้าของที่ดินย่อมห้ามได้เสมอ"],["1354","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๕๔ ถ้ามีจารีตประเพณีแห่งท้องถิ่นให้ทำได้ และถ้าเจ้าของไม่ห้าม บุคคลอาจเข้าไปในที่ป่า ที่ดง หรือในที่มีหญ้าเลี้ยงสัตว์ซึ่งเป็นที่ดินของผู้อื่น เพื่อเก็บฟืน หรือผลไม้ป่า ผัก เห็ด และสิ่งเช่นกัน"],["1355","b4t2","หมวด ๒ แดนแห่งกรรมสิทธิ์ และการใช้กรรมสิทธิ์","","มาตรา ๑๓๕๕ เจ้าของที่ดินริมทางน้ำ หรือมีทางน้ำผ่าน ไม่มีสิทธิจะชักเอาน้ำไว้เกินกว่าที่จำเป็นแก่ประโยชน์ของตนตามควร ให้เป็นเหตุเสื่อมเสียแก่ที่ดินแปลงอื่นซึ่งอยู่ตามทางน้ำนั้น"],["1356","b4t2","หมวด ๓ กรรมสิทธิ์รวม","","มาตรา ๑๓๕๖ ถ้าทรัพย์สินเป็นของบุคคลหลายคนรวมกัน ท่านให้ใช้บทบัญญัติในหมวดนี้บังคับ เว้นแต่จะมีกฎหมายบัญญัติไว้เป็นอย่างอื่น"],["1357","b4t2","หมวด ๓ กรรมสิทธิ์รวม","","มาตรา ๑๓๕๗ ท่านให้สันนิษฐานไว้ก่อนว่าผู้เป็นเจ้าของรวมกันมีส่วนเท่ากัน"],["1358","b4t2","หมวด ๓ กรรมสิทธิ์รวม","","มาตรา ๑๓๕๘ ท่านให้สันนิษฐานไว้ก่อนว่าเจ้าของรวมมีสิทธิจัดการทรัพย์สินรวมกัน\nในเรื่องจัดการตามธรรมดา ท่านว่าพึงตกลงโดยคะแนนข้างมากแห่งเจ้าของรวม แต่เจ้าของรวมคนหนึ่ง ๆ อาจทำสิ่งใดสิ่งหนึ่งในทางจัดการตามธรรมดาได้ เว้นแต่ฝ่ายข้างมากได้ตกลงไว้เป็นอย่างอื่น แต่เจ้าของรวมคนหนึ่ง ๆ อาจทำการเพื่อรักษาทรัพย์สินได้เสมอ\nในเรื่องจัดการอันเป็นสาระสำคัญ ท่านว่าต้องตกลงกัน โดยคะแนนข้างมากแห่งเจ้าของรวม และคะแนนข้างมากนั้น ต้องมีส่วนไม่ต่ำกว่าครึ่งหนึ่งแห่งค่าทรัพย์สิน\nการเปลี่ยนแปลงวัตถุที่ประสงค์นั้น ท่านว่าจะตกลงกันได้ก็แต่เมื่อเจ้าของรวมเห็นชอบทุกคน"],["1359","b4t2","หมวด ๓ กรรมสิทธิ์รวม","","มาตรา ๑๓๕๙ เจ้าของรวมคนหนึ่ง ๆ อาจใช้สิทธิอันเกิดแต่กรรมสิทธิ์ครอบไปถึงทรัพย์สินทั้งหมดเพื่อต่อสู้บุคคลภายนอก แต่ในการเรียกร้องเอาทรัพย์สินคืนนั้น ท่านว่าต้องอยู่ในบังคับแห่งเงื่อนไขที่ระบุไว้ในมาตรา ๓๐๒ แห่งประมวลกฎหมายนี้"],["1360","b4t2","หมวด ๓ กรรมสิทธิ์รวม","","มาตรา ๑๓๖๐ เจ้าของรวมคนหนึ่ง ๆ มีสิทธิใช้ทรัพย์สินได้ แต่การใช้นั้นต้องไม่ขัดต่อสิทธิแห่งเจ้าของรวมคนอื่น ๆ\nท่านให้สันนิษฐานไว้ก่อนว่าเจ้าของรวมคนหนึ่ง ๆ มีสิทธิได้ดอกผลตามส่วนของตนที่มีในทรัพย์สินนั้น"],["1361","b4t2","หมวด ๓ กรรมสิทธิ์รวม","","มาตรา ๑๓๖๑ เจ้าของรวมคนหนึ่ง ๆ จะจำหน่ายส่วนของตน หรือจำนอง หรือก่อให้เกิดภาระติดพันก็ได้\nแต่ตัวทรัพย์สินนั้นจะจำหน่าย จำนำ จำนอง หรือก่อให้เกิดภาระติดพันได้ ก็แต่ด้วยความยินยอมแห่งเจ้าของรวมทุกคน\nถ้าเจ้าของรวมคนใดจำหน่าย จำนำ จำนอง หรือก่อให้เกิดภาระติดพันทรัพย์สินโดยมิได้รับความยินยอมแห่งเจ้าของรวมทุกคน แต่ภายหลังเจ้าของรวมคนนั้นได้เป็นเจ้าของทรัพย์สินแต่ผู้เดียวไซร้ ท่านว่านิติกรรมนั้นเป็นอันสมบูรณ์"],["1362","b4t2","หมวด ๓ กรรมสิทธิ์รวม","","มาตรา ๑๓๖๒ เจ้าของรวมคนหนึ่ง ๆ จำต้องช่วยเจ้าของรวมคนอื่น ๆ ตามส่วนของตนในการออกค่าจัดการ ค่าภาษีอากร และค่ารักษา กับทั้งค่าใช้ทรัพย์สินรวมกันด้วย"],["1363","b4t2","หมวด ๓ กรรมสิทธิ์รวม","","มาตรา ๑๓๖๓ เจ้าของรวมคนหนึ่ง ๆ มีสิทธิเรียกให้แบ่งทรัพย์สินได้ เว้นแต่จะมีนิติกรรมขัดอยู่ หรือถ้าวัตถุที่ประสงค์ที่เป็นเจ้าของรวมกันนั้นมีลักษณะเป็นการถาวร ก็เรียกให้แบ่งไม่ได้\nสิทธิเรียกให้แบ่งทรัพย์สินนั้น ท่านว่าจะตัดโดยนิติกรรมเกินคราวละสิบปีไม่ได้\nท่านว่าเจ้าของรวมจะเรียกให้แบ่งทรัพย์สินในเวลาที่ไม่เป็นโอกาสอันควรไม่ได้"],["1364","b4t2","หมวด ๓ กรรมสิทธิ์รวม","","มาตรา ๑๓๖๔ การแบ่งทรัพย์สินพึงกระทำโดยแบ่งทรัพย์สินนั้นเองระหว่างเจ้าของรวม หรือโดยขายทรัพย์สินแล้วเอาเงินที่ขายได้แบ่งกัน\nถ้าเจ้าของรวมไม่ตกลงกันว่าจะแบ่งทรัพย์สินอย่างไรไซร้ เมื่อเจ้าของรวมคนหนึ่งคนใดขอ ศาลอาจสั่งให้เอาทรัพย์สินนั้นออกแบ่ง ถ้าส่วนที่แบ่งให้ไม่เท่ากันไซร้ จะสั่งให้ทดแทนกันเป็นเงินก็ได้ ถ้าการแบ่งเช่นว่านี้ไม่อาจทำได้หรือจะเสียหายมากนักก็ดี ศาลจะสั่งให้ขายโดยประมูลราคากันระหว่างเจ้าของรวมหรือขายทอดตลาดก็ได้"],["1365","b4t2","หมวด ๓ กรรมสิทธิ์รวม","","มาตรา ๑๓๖๕ ถ้าเจ้าของรวมต้องรับผิดร่วมกันต่อบุคคลภายนอกในหนี้อันเกี่ยวกับทรัพย์สินรวม หรือในหนี้ซึ่งได้ก่อขึ้นใหม่เพื่อชำระหนี้เดิมดังว่านั้นก็ดี ในเวลาแบ่ง เจ้าของรวมคนหนึ่ง ๆ จะเรียกให้เอาทรัพย์สินรวมนั้นชำระหนี้เสียก่อน หรือให้เอาเป็นประกันก็ได้\nถ้าเจ้าของรวมคนหนึ่งต้องรับผิดต่อเจ้าของรวมคนอื่นในหนี้ ซึ่งเกิดจากการเป็นเจ้าของรวม หรือในหนี้ซึ่งได้ก่อขึ้นใหม่เพื่อชำระหนี้เดิมดังว่านั้นก็ดี ในเวลาแบ่ง เจ้าของรวมผู้เป็นเจ้าหนี้จะเรียกให้เอาส่วนซึ่งจะได้แก่ลูกหนี้ของตนในทรัพย์สินรวมนั้นชำระหนี้เสียก่อน หรือให้เอาเป็นประกันก็ได้\nสิทธิที่กล่าวมาข้างต้นนี้อาจใช้แก่ผู้รับโอน หรือผู้สืบกรรมสิทธิ์ในส่วนของเจ้าของรวมนั้น\nถ้าจำเป็นจะต้องขายทรัพย์สินรวมไซร้ ท่านให้นำบทบัญญัติมาตราก่อนมาใช้บังคับ"],["1366","b4t2","หมวด ๓ กรรมสิทธิ์รวม","","มาตรา ๑๓๖๖ เจ้าของรวมคนหนึ่ง ๆ ต้องรับผิดตามส่วนของตนเช่นเดียวกับผู้ขายในทรัพย์สินซึ่งเจ้าของรวมคนอื่น ๆ ได้รับไปในการแบ่ง"],["1367","b4t3","","","มาตรา ๑๓๖๗ บุคคลใดยึดถือทรัพย์สินโดยเจตนาจะยึดถือเพื่อตน ท่านว่าบุคคลนั้นได้ซึ่งสิทธิครอบครอง"],["1368","b4t3","","","มาตรา ๑๓๖๘ บุคคลอาจได้มาซึ่งสิทธิครอบครองโดยผู้อื่นยึดถือไว้ให้"],["1369","b4t3","","","มาตรา ๑๓๖๙ บุคคลใดยึดถือทรัพย์สินไว้ ท่านให้สันนิษฐานไว้ก่อนว่า บุคคลนั้นยึดถือเพื่อตน"],["1370","b4t3","","","มาตรา ๑๓๗๐ ผู้ครอบครองนั้น ท่านให้สันนิษฐานไว้ก่อนว่าครอบครองโดยสุจริต โดยความสงบและโดยเปิดเผย"],["1371","b4t3","","","มาตรา ๑๓๗๑ ถ้าพิสูจน์ได้ว่าบุคคลใดครอบครองทรัพย์สินเดียวกันสองคราว ท่านให้สันนิษฐานไว้ก่อนว่า บุคคลนั้นได้ครอบครองติดต่อกันตลอดเวลา"],["1372","b4t3","","","มาตรา ๑๓๗๒ สิทธิซึ่งผู้ครอบครองใช้ในทรัพย์สินที่ครอบครองนั้น ท่านให้สันนิษฐานไว้ก่อนว่าเป็นสิทธิซึ่งผู้ครอบครองมีตามกฎหมาย"],["1373","b4t3","","","มาตรา ๑๓๗๓ ถ้าทรัพย์สินเป็นอสังหาริมทรัพย์ที่ได้จดไว้ในทะเบียนที่ดิน ท่านให้สันนิษฐานไว้ก่อนว่าบุคคลผู้มีชื่อในทะเบียนเป็นผู้มีสิทธิครอบครอง"],["1374","b4t3","","","มาตรา ๑๓๗๔ ถ้าผู้ครอบครองถูกรบกวนในการครอบครองทรัพย์สิน เพราะมีผู้สอดเข้าเกี่ยวข้องโดยมิชอบด้วยกฎหมายไซร้ ท่านว่าผู้ครอบครองมีสิทธิจะให้ปลดเปลื้องการรบกวนนั้นได้ ถ้าเป็นที่น่าวิตกว่าจะยังมีการรบกวนอีก ผู้ครอบครองจะขอต่อศาลให้สั่งห้ามก็ได้\nการฟ้องคดีเพื่อปลดเปลื้องการรบกวนนั้น ท่านว่าต้องฟ้องภายในปีหนึ่งนับแต่เวลาถูกรบกวน"],["1375","b4t3","","","มาตรา ๑๓๗๕ ถ้าผู้ครอบครองถูกแย่งการครอบครองโดยมิชอบด้วยกฎหมายไซร้ ท่านว่าผู้ครอบครองมีสิทธิจะได้คืนซึ่งการครอบครอง เว้นแต่อีกฝ่ายหนึ่งมีสิทธิเหนือทรัพย์สินดีกว่าซึ่งจะเป็นเหตุให้เรียกคืนจากผู้ครอบครองได้\nการฟ้องคดีเพื่อเอาคืนซึ่งการครอบครองนั้น ท่านว่าต้องฟ้องภายในปีหนึ่งนับแต่เวลาถูกแย่งการครอบครอง"],["1376","b4t3","","","มาตรา ๑๓๗๖ ถ้าจะต้องส่งทรัพย์สินคืนแก่บุคคลผู้มีสิทธิเอาคืนไซร้ ท่านให้นำบทบัญญัติมาตรา ๔๑๒ ถึงมาตรา ๔๑๘ แห่งประมวลกฎหมายนี้ว่าด้วยลาภมิควรได้มาใช้บังคับโดยอนุโลม"],["1377","b4t3","","","มาตรา ๑๓๗๗ ถ้าผู้ครอบครองสละเจตนาครอบครองหรือไม่ยึดถือทรัพย์สินต่อไปไซร้ การครอบครองย่อมสุดสิ้นลง\nถ้าเหตุอันมีสภาพเป็นเหตุชั่วคราวมีมาขัดขวางมิให้ผู้ครอบครองยึดถือทรัพย์สินไซร้ ท่านว่าการครอบครองไม่สุดสิ้นลง"],["1378","b4t3","","","มาตรา ๑๓๗๘ การโอนไปซึ่งการครอบครองนั้นย่อมทำได้โดยส่งมอบทรัพย์สินที่ครอบครอง"],["1379","b4t3","","","มาตรา ๑๓๗๙ ถ้าผู้รับโอนหรือผู้แทนยึดถือทรัพย์สินอยู่แล้ว ท่านว่าการโอนไปซึ่งการครอบครองจะทำเพียงแสดงเจตนาก็ได้"],["1380","b4t3","","","มาตรา ๑๓๘๐ การโอนไปซึ่งการครอบครองย่อมเป็นผล แม้ผู้โอนยังยึดถือทรัพย์สินอยู่ ถ้าผู้โอนแสดงเจตนาว่าต่อไปจะยึดถือทรัพย์สินนั้นแทนผู้รับโอน\nถ้าทรัพย์สินนั้นผู้แทนของผู้โอนยึดถืออยู่ การโอนไปซึ่งการครอบครองจะทำโดยผู้โอนสั่งผู้แทนว่า ต่อไปให้ยึดถือทรัพย์สินไว้แทนผู้รับโอนก็ได้"],["1381","b4t3","","","มาตรา ๑๓๘๑ บุคคลใดยึดถือทรัพย์สินอยู่ในฐานะเป็นผู้แทนผู้ครอบครอง บุคคลนั้นจะเปลี่ยนลักษณะแห่งการยึดถือได้ ก็แต่โดยบอกกล่าวไปยังผู้ครอบครองว่าไม่เจตนาจะยึดถือทรัพย์สินแทนผู้ครอบครองต่อไป หรือตนเองเป็นผู้ครอบครองโดยสุจริต อาศัยอำนาจใหม่อันได้จากบุคคลภายนอก"],["1382","b4t3","","","มาตรา ๑๓๘๒ บุคคลใดครอบครองทรัพย์สินของผู้อื่นไว้โดยความสงบและโดยเปิดเผยด้วยเจตนาเป็นเจ้าของ ถ้าเป็นอสังหาริมทรัพย์ได้ครอบครองติดต่อกันเป็นเวลาสิบปี ถ้าเป็นสังหาริมทรัพย์ได้ครอบครองติดต่อกันเป็นเวลาห้าปีไซร้ ท่านว่าบุคคลนั้นได้กรรมสิทธิ์"],["1383","b4t3","","","มาตรา ๑๓๘๓ ทรัพย์สินอันได้มาโดยการกระทำผิดนั้น ท่านว่าผู้กระทำผิดหรือผู้รับโอนไม่สุจริตจะได้กรรมสิทธิ์โดยอายุความก็แต่เมื่อพ้นกำหนดอายุความอาญา หรือพ้นเวลาที่กำหนดไว้ในมาตราก่อน ถ้ากำหนดไหนยาวกว่า ท่านให้ใช้กำหนดนั้น"],["1384","b4t3","","","มาตรา ๑๓๘๔ ถ้าผู้ครอบครองขาดยึดถือทรัพย์สินโดยไม่สมัครและได้คืนภายในเวลาปีหนึ่งนับตั้งแต่วันขาดยึดถือหรือได้คืนโดยฟ้องคดีภายในกำหนดนั้นไซร้ ท่านมิให้ถือว่าการครอบครองสะดุดหยุดลง"],["1385","b4t3","","","มาตรา ๑๓๘๕ ถ้าโอนการครอบครองแก่กัน ผู้รับโอนจะนับเวลาซึ่งผู้โอนครอบครองอยู่ก่อนนั้นรวมเข้ากับเวลาครอบครองของตนก็ได้ ถ้าผู้รับโอนนับรวมเช่นนั้น และถ้ามีข้อบกพร่องในระหว่างครอบครองของผู้โอนไซร้ ท่านว่าข้อบกพร่องนั้นอาจยกขึ้นเป็นข้อต่อสู้ผู้รับโอนได้"],["1386","b4t3","","","มาตรา ๑๓๘๖ บทบัญญัติว่าด้วยอายุความในประมวลกฎหมายนี้ ท่านให้ใช้บังคับในเรื่องอายุความได้สิทธิอันกล่าวไว้ในลักษณะนี้โดยอนุโลม"],["1387","b4t4","","","มาตรา ๑๓๘๗ อสังหาริมทรัพย์อาจต้องตกอยู่ในภาระจำยอมอันเป็นเหตุให้เจ้าของต้องยอมรับกรรมบางอย่างซึ่งกระทบถึงทรัพย์สินของตน หรือต้องงดเว้นการใช้สิทธิบางอย่างอันมีอยู่ในกรรมสิทธิ์ทรัพย์สินนั้น เพื่อประโยชน์แก่อสังหาริมทรัพย์อื่น"],["1388","b4t4","","","มาตรา ๑๓๘๘ เจ้าของสามยทรัพย์ไม่มีสิทธิทำการเปลี่ยนแปลงในภารยทรัพย์หรือในสามยทรัพย์ซึ่งทำให้เกิดภาระเพิ่มขึ้นแก่ภารยทรัพย์"],["1389","b4t4","","","มาตรา ๑๓๘๙ ถ้าความต้องการแห่งเจ้าของสามยทรัพย์เปลี่ยนแปลงไป ท่านว่าความเปลี่ยนแปลงนั้นไม่ให้สิทธิแก่เจ้าของสามยทรัพย์ที่จะทำให้เกิดภาระเพิ่มขึ้นแก่ภารยทรัพย์ได้"],["1390","b4t4","","","มาตรา ๑๓๙๐ ท่านมิให้เจ้าของภารยทรัพย์ประกอบกรรมใด ๆ อันจะเป็นเหตุให้ประโยชน์แห่งภาระจำยอมลดไปหรือเสื่อมความสะดวก"],["1391","b4t4","","","มาตรา ๑๓๙๑ เจ้าของสามยทรัพย์มีสิทธิทำการทุกอย่างอันจำเป็นเพื่อรักษาและใช้ภาระจำยอม แต่ต้องเสียค่าใช้จ่ายของตนเอง ในการนี้เจ้าของสามยทรัพย์จะก่อให้เกิดความเสียหายแก่ภารยทรัพย์ได้ก็แต่น้อยที่สุดตามพฤติการณ์\nเจ้าของสามยทรัพย์ต้องเสียค่าใช้จ่ายของตนเองรักษาซ่อมแซมการที่ได้ทำไปแล้วให้เป็นไปด้วยดี แต่ถ้าเจ้าของภารยทรัพย์ได้รับประโยชน์ด้วยไซร้ ท่านว่าต้องออกค่าใช้จ่ายตามส่วนแห่งประโยชน์ที่ได้รับ"],["1392","b4t4","","","มาตรา ๑๓๙๒ ถ้าภาระจำยอมแตะต้องเพียงส่วนหนึ่งแห่งภารยทรัพย์ เจ้าของทรัพย์นั้นอาจเรียกให้ย้ายไปยังส่วนอื่นก็ได้ แต่ต้องแสดงได้ว่าการย้ายนั้นเป็นประโยชน์แก่ตนและรับเสียค่าใช้จ่าย ทั้งนี้ ต้องไม่ทำให้ความสะดวกของเจ้าของสามยทรัพย์ลดน้อยลง"],["1393","b4t4","","","มาตรา ๑๓๙๓ ถ้ามิได้กำหนดไว้เป็นอย่างอื่นในนิติกรรมอันก่อให้เกิดภาระจำยอมไซร้ ท่านว่าภาระจำยอมย่อมติดไปกับสามยทรัพย์ซึ่งได้จำหน่าย หรือตกไปในบังคับแห่งสิทธิอื่น\nท่านว่าจะจำหน่าย หรือทำให้ภาระจำยอมตกไปในบังคับแห่งสิทธิอื่นต่างหากจากสามยทรัพย์ไม่ได้"],["1394","b4t4","","","มาตรา ๑๓๙๔ ถ้ามีการแบ่งแยกภารยทรัพย์ ท่านว่าภาระจำยอมยังคงมีอยู่ทุกส่วนที่แยกออก แต่ถ้าในส่วนใดภาระจำยอมนั้นไม่ใช้และใช้ไม่ได้ตามรูปการ ท่านว่าเจ้าของส่วนนั้นจะเรียกให้พ้นจากภาระจำยอมก็ได้"],["1395","b4t4","","","มาตรา ๑๓๙๕ ถ้ามีการแบ่งแยกสามยทรัพย์ ท่านว่าภาระจำยอมยังคงมีอยู่เพื่อประโยชน์แก่ทุกส่วนที่แยกออกนั้น แต่ถ้าภาระจำยอมนั้นไม่ใช้และใช้ไม่ได้ตามรูปการเพื่อประโยชน์แก่ส่วนใดไซร้ ท่านว่าเจ้าของภารยทรัพย์จะเรียกให้พ้นจากภาระจำยอมอันเกี่ยวกับทรัพย์ส่วนนั้นก็ได้"],["1396","b4t4","","","มาตรา ๑๓๙๖ ภาระจำยอมซึ่งเจ้าของรวมแห่งสามยทรัพย์คนหนึ่งได้มา หรือใช้อยู่นั้น ท่านให้ถือว่าเจ้าของรวมได้มาหรือใช้อยู่ด้วยกันทุกคน"],["1397","b4t4","","","มาตรา ๑๓๙๗ ถ้าภารยทรัพย์หรือสามยทรัพย์สลายไปทั้งหมด ท่านว่าภาระจำยอมสิ้นไป"],["1398","b4t4","","","มาตรา ๑๓๙๘ ถ้าภารยทรัพย์และสามยทรัพย์ตกเป็นของเจ้าของคนเดียวกัน ท่านว่าเจ้าของจะให้เพิกถอนการจดทะเบียนภาระจำยอมก็ได้ แต่ถ้ายังมิได้เพิกถอนทะเบียนไซร้ ภาระจำยอมยังคงมีอยู่ในส่วนบุคคลภายนอก"],["1399","b4t4","","","มาตรา ๑๓๙๙ ภาระจำยอมนั้น ถ้ามิได้ใช้สิบปี ท่านว่าย่อมสิ้นไป"],["1400","b4t4","","","มาตรา ๑๔๐๐ ถ้าภาระจำยอมหมดประโยชน์แก่สามยทรัพย์ไซร้ ท่านว่าภาระจำยอมนั้นสิ้นไป แต่ถ้าความเป็นไปมีทางให้กลับใช้ภาระจำยอมได้ไซร้ ท่านว่าภาระจำยอมนั้นกลับมีขึ้นอีก แต่ต้องยังไม่พ้นอายุความที่ระบุไว้ในมาตราก่อน\nถ้าภาระจำยอมยังเป็นประโยชน์แก่สามยทรัพย์อยู่บ้าง แต่เมื่อเทียบกับภาระอันตกอยู่แก่ภารยทรัพย์แล้ว ประโยชน์นั้นน้อยนักไซร้ ท่านว่าเจ้าของภารยทรัพย์จะขอให้พ้นจากภาระจำยอมทั้งหมด หรือแต่บางส่วนก็ได้ แต่ต้องใช้ค่าทดแทน"],["1401","b4t4","","","มาตรา ๑๔๐๑ ภาระจำยอมอาจได้มาโดยอายุความ ท่านให้นำบทบัญญัติว่าด้วยอายุความได้สิทธิอันกล่าวไว้ในลักษณะ ๓ แห่งบรรพนี้มาใช้บังคับโดยอนุโลม"],["1402","b4t5","","","มาตรา ๑๔๐๒ บุคคลใดได้รับสิทธิอาศัยในโรงเรือน บุคคลนั้นย่อมมีสิทธิอยู่ในโรงเรือนนั้นโดยไม่ต้องเสียค่าเช่า"],["1403","b4t5","","","มาตรา ๑๔๐๓ สิทธิอาศัยนั้น ท่านว่าจะก่อให้เกิดโดยมีกำหนดเวลา หรือตลอดชีวิตของผู้อาศัยก็ได้\nถ้าไม่มีกำหนดเวลา ท่านว่าสิทธินั้นจะเลิกเสียในเวลาใด ๆ ก็ได้ แต่ต้องบอกล่วงหน้าแก่ผู้อาศัยตามสมควร\nถ้าให้สิทธิอาศัยโดยมีกำหนดเวลา กำหนดนั้นท่านมิให้เกินสามสิบปี ถ้ากำหนดไว้นานกว่านั้น ให้ลดลงมาเป็นสามสิบปี การให้สิทธิอาศัยจะต่ออายุก็ได้ แต่ต้องกำหนดเวลาไม่เกินสามสิบปีนับแต่วันทำต่อ"],["1404","b4t5","","","มาตรา ๑๔๐๔ สิทธิอาศัยนั้นจะโอนกันไม่ได้แม้โดยทางมรดก"],["1405","b4t5","","","มาตรา ๑๔๐๕ สิทธิอาศัยนั้นถ้ามิได้จำกัดไว้ชัดแจ้งว่าให้เพื่อประโยชน์แก่ผู้อาศัยเฉพาะตัวไซร้ บุคคลในครอบครัวและในครัวเรือนของผู้อาศัยจะอยู่ด้วยก็ได้"],["1406","b4t5","","","มาตรา ๑๔๐๖ ถ้าผู้ให้อาศัยมิได้ห้ามไว้ชัดแจ้ง ผู้อาศัยจะเก็บเอาดอกผลธรรมดาหรือผลแห่งที่ดิน มาใช้เพียงที่จำเป็นแก่ความต้องการของครัวเรือนก็ได้"],["1407","b4t5","","","มาตรา ๑๔๐๗ ผู้ให้อาศัยไม่จำต้องบำรุงรักษาทรัพย์สินให้อยู่ในความซ่อมแซมอันดี\nผู้อาศัยจะเรียกให้ชดใช้ค่าใช้จ่าย ซึ่งได้ออกไปในการทำให้ทรัพย์สินดีขึ้นหาได้ไม่"],["1408","b4t5","","","มาตรา ๑๔๐๘ เมื่อสิทธิอาศัยสิ้นลง ผู้อาศัยต้องส่งทรัพย์สินคืนแก่ผู้ให้อาศัย"],["1409","b4t5","","","มาตรา ๑๔๐๙ ท่านให้นำบทบัญญัติแห่งประมวลกฎหมายนี้ว่าด้วยหน้าที่และความรับผิดของผู้เช่าอันกล่าวไว้ในมาตรา ๕๕๒ ถึงมาตรา ๕๕๕ มาตรา ๕๕๘ มาตรา ๕๖๒ และมาตรา ๕๖๓ มาใช้บังคับโอนอนุโลม"],["1410","b4t6","","","มาตรา ๑๔๑๐ เจ้าของที่ดินอาจก่อให้เกิดสิทธิเหนือพื้นดินเป็นคุณแก่บุคคลอื่น โดยให้บุคคลนั้นมีสิทธิเป็นเจ้าของโรงเรือน สิ่งปลูกสร้าง หรือสิ่งเพาะปลูก บนดินหรือใต้ดินนั้น"],["1411","b4t6","","","มาตรา ๑๔๑๑ ถ้ามิได้กำหนดไว้เป็นอย่างอื่นในนิติกรรมอันก่อให้เกิดสิทธิเหนือพื้นดินไซร้ ท่านว่าสิทธินั้นอาจโอนได้และรับมรดกกันได้"],["1412","b4t6","","","มาตรา ๑๔๑๒ สิทธิเหนือพื้นดินนั้นจะก่อให้เกิดโดยมีกำหนดเวลา หรือตลอดชีวิตเจ้าของที่ดิน หรือตลอดชีวิตผู้ทรงสิทธิเหนือพื้นดินนั้นก็ได้\nถ้าก่อให้เกิดสิทธิเหนือพื้นดินโดยมีกำหนดเวลาไซร้ ท่านให้นำบทบัญญัติมาตรา ๑๔๐๓ วรรคสาม มาใช้บังคับโดยอนุโลม"],["1413","b4t6","","","มาตรา ๑๔๑๓ ถ้าสิทธิเหนือพื้นดินนั้นไม่มีกำหนดเวลาไซร้ ท่านว่าคู่กรณีฝ่ายใดจะบอกเลิกเสียในเวลาใดก็ได้ แต่ต้องบอกล่วงหน้าแก่อีกฝ่ายหนึ่งตามสมควร ถ้ามีค่าเช่าซึ่งจำต้องให้แก่กันไซร้ ท่านว่าต้องบอกล่วงหน้าปีหนึ่ง หรือให้ค่าเช่าปีหนึ่ง"],["1414","b4t6","","","มาตรา ๑๔๑๔ ถ้าผู้ทรงสิทธิเหนือพื้นดินละเลยไม่ปฏิบัติตามเงื่อนไขอันเป็นสาระสำคัญซึ่งระบุไว้ในนิติกรรมก่อตั้งสิทธินั้นก็ดี หรือถ้ามีค่าเช่าซึ่งจะต้องให้แก่กัน แต่ผู้ทรงสิทธิเหนือพื้นดินละเลยไม่ชำระถึงสองปีติด ๆ กันก็ดี ท่านว่าคู่กรณีอีกฝ่ายหนึ่งจะบอกเลิกสิทธิเหนือพื้นดินก็ได้"],["1415","b4t6","","","มาตรา ๑๔๑๕ สิทธิเหนือพื้นดินนั้นไม่สิ้นไปโดยเหตุที่โรงเรือน สิ่งปลูกสร้าง หรือสิ่งเพาะปลูกสลายไป แม้การสลายนั้นจะเป็นเพราะเหตุสุดวิสัย"],["1416","b4t6","","","มาตรา ๑๔๑๖ เมื่อสิทธิเหนือพื้นดินสิ้นไป ผู้ทรงสิทธิจะรื้อถอนโรงเรือน สิ่งปลูกสร้าง สิ่งเพาะปลูกของตนไปก็ได้ แต่ต้องทำให้ที่ดินเป็นตามเดิม\nแต่ถ้าเจ้าของที่ดินจะไม่ยอมให้รื้อถอนไป และบอกเจตนาจะซื้อตามราคาท้องตลาดไซร้ ท่านว่าผู้ทรงสิทธิเหนือพื้นดินจะไม่ยอมขายไม่ได้ เว้นแต่จะมีเหตุอันสมควร"],["1417","b4t7","","","มาตรา ๑๔๑๗ อสังหาริมทรัพย์อาจต้องตกอยู่ในบังคับสิทธิเก็บกิน อันเป็นเหตุให้ผู้ทรงสิทธินั้นมีสิทธิครอบครอง ใช้ และถือเอาซึ่งประโยชน์แห่งทรัพย์สินนั้น\nผู้ทรงสิทธิเก็บกินมีอำนาจจัดการทรัพย์สิน\nผู้ทรงสิทธิเก็บกินในป่าไม้ เหมืองแร่ หรือที่ขุดหิน มีสิทธิทำการแสวงประโยชน์จากป่าไม้ เหมืองแร่ หรือที่ขุดหินนั้น"],["1418","b4t7","","","มาตรา ๑๔๑๘ สิทธิเก็บกินนั้น จะก่อให้เกิดโดยมีกำหนดเวลา หรือตลอดชีวิตแห่งผู้ทรงสิทธิก็ได้\nถ้าไม่มีกำหนดเวลา ท่านให้สันนิษฐานไว้ก่อนว่าสิทธิเก็บกินมีอยู่ตลอดชีวิตผู้ทรงสิทธิ\nถ้ามีกำหนดเวลา ท่านให้นำบทบัญญัติมาตรา ๑๔๐๓ วรรคสาม มาใช้บังคับโดยอนุโลม\nถ้าผู้ทรงสิทธิเก็บกินถึงแก่ความตาย ท่านว่าสิทธินั้นย่อมสิ้นไปเสมอ"],["1419","b4t7","","","มาตรา ๑๔๑๙ ถ้าทรัพย์สินสลายไปโดยไม่ได้ค่าทดแทนไซร้ ท่านว่าเจ้าของไม่จำต้องทำให้คืนดี แต่ถ้าเจ้าของทำให้ทรัพย์สินคืนดีขึ้นเพียงใด ท่านว่าสิทธิเก็บกินก็กลับมีขึ้นเพียงนั้น\nถ้าได้ค่าทดแทนไซร้ ท่านว่าเจ้าของหรือผู้ทรงสิทธิเก็บกิน ต้องให้ทรัพย์สินคืนดีเพียงที่สามารถทำได้ตามจำนวนเงินค่าทดแทนที่ได้รับ และสิทธิเก็บกินกลับมีขึ้นเพียงที่ทรัพย์สินกลับคืนดี แต่ถ้าพ้นวิสัยที่จะทำให้กลับคืนดีได้ สิทธิเก็บกินก็เป็นอันสิ้นไป และค่าทดแทนนั้นต้องแบ่งกันระหว่างเจ้าของทรัพย์สิน และผู้ทรงสิทธิเก็บกินตามส่วนแห่งความเสียหายของตน\nวิธีนี้ให้ใช้บังคับโดยอนุโลมถึงกรณีซึ่งทรัพย์สินถูกบังคับซื้อ และกรณีซึ่งทรัพย์สินสลายไปแต่บางส่วน หรือการทำให้คืนดีนั้นพ้นวิสัยในบางส่วน"],["1420","b4t7","","","มาตรา ๑๔๒๐ เมื่อสิทธิเก็บกินสิ้นลง ผู้ทรงสิทธิต้องส่งทรัพย์สินคืนแก่เจ้าของ\nถ้าทรัพย์สินสลายไป หรือเสื่อมราคาลง ผู้ทรงสิทธิเก็บกินต้องรับผิด เว้นแต่จะพิสูจน์ได้ว่าความเสียหายนั้นมิได้เกิดขึ้นเพราะความผิดของตน\nถ้าผู้ทรงสิทธิเก็บกินใช้ทรัพย์สินสิ้นเปลืองไปโดยมิชอบ ท่านว่าต้องทำให้มีมาแทน\nถ้าทรัพย์สินเสื่อมราคาเพราะการใช้ตามควรไซร้ ท่านว่าผู้ทรงสิทธิเก็บกินไม่จำต้องให้ค่าทดแทน"],["1421","b4t7","","","มาตรา ๑๔๒๑ ในการใช้สิทธิเก็บกินนั้น ผู้ทรงสิทธิต้องรักษาทรัพย์สินเสมอกับที่วิญญูชนพึงรักษาทรัพย์สินของตนเอง"],["1422","b4t7","","","มาตรา ๑๔๒๒ ถ้ามิได้กำหนดไว้เป็นอย่างอื่นในนิติกรรมอันก่อให้เกิดสิทธิเก็บกินไซร้ ท่านว่าผู้ทรงสิทธินั้นจะโอนการใช้สิทธิของตนให้บุคคลภายนอกก็ได้ ในกรณีเช่นนั้นเจ้าของทรัพย์สินอาจฟ้องร้องผู้รับโอนโดยตรง"],["1423","b4t7","","","มาตรา ๑๔๒๓ เจ้าของทรัพย์สินจะคัดค้านมิให้ใช้ทรัพย์สินในทางอันมิชอบด้วยกฎหมาย หรือมิสมควรก็ได้\nถ้าเจ้าของพิสูจน์ได้ว่าสิทธิของตนตกอยู่ในภยันตราย ท่านว่าจะเรียกให้ผู้ทรงสิทธิเก็บกินหาประกันให้ก็ได้ เว้นแต่ในกรณีซึ่งผู้ให้ทรัพย์สินสงวนสิทธิเก็บกินในทรัพย์สินนั้นไว้เพื่อตนเอง\nถ้าผู้ทรงสิทธิเก็บกินละเลยไม่หาประกันมาให้ภายในเวลาอันควรซึ่งกำหนดให้เพื่อการนั้น หรือถ้าผู้ทรงสิทธิเก็บกินมินำพาต่อคำคัดค้านแห่งเจ้าของ ยังคงใช้ทรัพย์สินนั้นในทางอันมิชอบด้วยกฎหมาย หรือมิควรไซร้ ท่านว่าศาลจะตั้งผู้รักษาทรัพย์เพื่อจัดการทรัพย์สินแทนผู้ทรงสิทธิเก็บกินก็ได้ แต่เมื่อหาประกันมาให้แล้ว ศาลจะถอนผู้รักษาทรัพย์ที่ตั้งขึ้นไว้นั้นก็ได้"],["1424","b4t7","","","มาตรา ๑๔๒๔ ผู้ทรงสิทธิเก็บกินจำต้องสงวนภาวะแห่งทรัพย์สินมิให้เปลี่ยนไปในสาระสำคัญ กับต้องบำรุงรักษาปกติและซ่อมแซมเล็กน้อยด้วย\nถ้าจำเป็นต้องซ่อมแซมใหญ่ หรือมีการสำคัญอันต้องทำเพื่อรักษาทรัพย์สินไซร้ ท่านว่าผู้ทรงสิทธิเก็บกินต้องแจ้งแก่เจ้าของทรัพย์สินโดยพลัน และต้องยอมให้จัดทำการนั้น ๆ ไป ถ้าเจ้าของทรัพย์สินละเลยเสีย ท่านว่าผู้ทรงสิทธิเก็บกินจะจัดทำการนั้นไปโดยให้เจ้าของทรัพย์สินออกค่าใช้จ่ายก็ได้"],["1425","b4t7","","","มาตรา ๑๔๒๕ ค่าใช้จ่ายอันเป็นการจรนั้น ท่านว่าเจ้าของต้องเป็นผู้ออก แต่เพื่อจะออกค่าใช้จ่ายเช่นว่านี้ หรือค่าใช้จ่ายตามความในมาตราก่อน เจ้าของจะจำหน่ายทรัพย์สินบางส่วนก็ได้ เว้นแต่ผู้ทรงสิทธิเก็บกินจะเต็มใจทดรองเงินตามที่จำเป็นโดยไม่คิดดอกเบี้ย"],["1426","b4t7","","","มาตรา ๑๔๒๖ ในระหว่างที่สิทธิเก็บกินยังมีอยู่ ผู้ทรงสิทธิต้องออกค่าใช้จ่ายในการจัดการทรัพย์สินตลอดจนเสียภาษีอากร กับทั้งต้องใช้ดอกเบี้ยหนี้สินซึ่งติดพันทรัพย์สินนั้น"],["1427","b4t7","","","มาตรา ๑๔๒๗ ถ้าเจ้าของทรัพย์สินต้องการ ผู้ทรงสิทธิเก็บกินจำต้องเอาทรัพย์สินประกันวินาศภัยเพื่อประโยชน์แก่เจ้าของทรัพย์สิน และถ้าทรัพย์สินนั้นได้เอาประกันภัยไว้แล้ว ผู้ทรงสิทธิเก็บกินต้องต่อสัญญาประกันนั้นเมื่อถึงคราวต่อ\nผู้ทรงสิทธิเก็บกินต้องเสียเบี้ยประกันภัยระหว่างที่สิทธิของตนยังมีอยู่"],["1428","b4t7","","","มาตรา ๑๔๒๘ คดีอันเกี่ยวกับสิทธิเก็บกินในระหว่างเจ้าของทรัพย์สินกับผู้ทรงสิทธิเก็บกิน หรือผู้รับโอนนั้น ท่านห้ามมิให้ฟ้องเมื่อเกินปีหนึ่งนับแต่วันสิทธิเก็บกินสุดสิ้นลง แต่ในคดีที่เจ้าของทรัพย์สินเป็นโจทก์นั้น ถ้าเจ้าของไม่อาจรู้ว่าสิทธิเก็บกินสุดสิ้นลงเมื่อใด ท่านให้นับอายุความปีหนึ่งนั้นตั้งแต่เวลาที่เจ้าของทรัพย์สินได้รู้ หรือควรรู้ว่าสิทธิเก็บกินสุดสิ้นลง"],["1429","b4t8","","","มาตรา ๑๔๒๙ อสังหาริมทรัพย์อาจต้องตกอยู่ในภาระติดพันอันเป็นเหตุให้ผู้รับประโยชน์มีสิทธิได้รับการชำระหนี้เป็นคราว ๆ จากทรัพย์สินนั้น หรือได้ใช้และถือเอาซึ่งประโยชน์แห่งทรัพย์สินตามที่ระบุไว้"],["1430","b4t8","","","มาตรา ๑๔๓๐ ภาระติดพันในอสังหาริมทรัพย์นั้น จะก่อให้เกิดโดยมีกำหนดเวลา หรือตลอดชีวิตแห่งผู้รับประโยชน์ก็ได้\nถ้าไม่มีกำหนดเวลา ท่านให้สันนิษฐานไว้ก่อนว่าภาระติดพันในอสังหาริมทรัพย์มีอยู่ตลอดชีวิตผู้รับประโยชน์\nถ้ามีกำหนดเวลา ท่านให้นำบทบัญญัติมาตรา ๑๔๐๓ วรรคสาม มาใช้บังคับโดยอนุโลม"],["1431","b4t8","","","มาตรา ๑๔๓๑ ถ้ามิได้กำหนดไว้เป็นอย่างอื่นในนิติกรรมอันก่อให้เกิดภาระติดพันไซร้ ท่านว่าภาระติดพันในอสังหาริมทรัพย์นั้นจะโอนกันไม่ได้แม้โดยทางมรดก"],["1432","b4t8","","","มาตรา ๑๔๓๒ ถ้าผู้รับประโยชน์ละเลยไม่ปฏิบัติตามเงื่อนไขอันเป็นสาระสำคัญซึ่งระบุไว้ในนิติกรรมก่อตั้งภาระติดพันนั้นไซร้ ท่านว่าคู่กรณีอีกฝ่ายหนึ่งจะบอกเลิกสิทธิของผู้รับประโยชน์เสียก็ได้"],["1433","b4t8","","","มาตรา ๑๔๓๓ ถ้าเจ้าของทรัพย์สินมิได้ชำระหนี้ตามภาระติดพันไซร้ ท่านว่านอกจากทางแก้สำหรับการไม่ชำระหนี้ ผู้รับประโยชน์อาจขอให้ศาลตั้งผู้รักษาทรัพย์เพื่อจัดการทรัพย์สินและชำระหนี้แทนเจ้าของ หรือสั่งให้เอาทรัพย์สินออกขายทอดตลาด และเอาเงินที่ขายได้จ่ายให้ผู้รับประโยชน์ตามจำนวนที่ควรได้ เพราะเจ้าของทรัพย์สินไม่ชำระหนี้ กับทั้งค่าแห่งภาระติดพันด้วย\nถ้าเจ้าของทรัพย์สินหาประกันมาให้แล้ว ศาลจะไม่ออกคำสั่งตั้งผู้รักษาทรัพย์ หรือคำสั่งขายทอดตลาด หรือจะถอนผู้รักษาทรัพย์ที่ตั้งขึ้นไว้นั้น ก็ได้"],["1434","b4t8","","","มาตรา ๑๔๓๔ ท่านให้นำมาตรา ๑๓๘๘ ถึงมาตรา ๑๓๙๕ และมาตรา ๑๓๙๗ ถึงมาตรา ๑๔๐๐ มาใช้บังคับถึงภาระติดพันในอสังหาริมทรัพย์โดยอนุโลม"],["1435","b5t1","หมวด ๑ การหมั้น","","มาตรา ๑๔๓๕ การหมั้นจะทำได้ต่อเมื่อบุคคลทั้งสองฝ่ายมีอายุสิบแปดปีบริบูรณ์แล้ว\nการหมั้นที่ฝ่าฝืนบทบัญญัติวรรคหนึ่งเป็นโมฆะ"],["1436","b5t1","หมวด ๑ การหมั้น","","มาตรา ๑๔๓๖ ผู้เยาว์จะทำการหมั้นได้ต้องได้รับความยินยอมของบุคคลดังต่อไปนี้\n(๑) บิดาและมารดา ในกรณีที่มีทั้งบิดามารดา\n(๒) บิดาหรือมารดา ในกรณีที่มารดาหรือบิดาตายหรือถูกถอนอำนาจปกครองหรือไม่อยู่ในสภาพหรือฐานะที่อาจให้ความยินยอม หรือโดยพฤติการณ์ผู้เยาว์ไม่อาจขอความยินยอมจากมารดาหรือบิดาได้\n(๓) ผู้รับบุตรบุญธรรม ในกรณีที่ผู้เยาว์เป็นบุตรบุญธรรม\n(๔) ผู้ปกครอง ในกรณีที่ไม่มีบุคคลซึ่งอาจให้ความยินยอมตาม (๑) (๒) และ (๓) หรือมีแต่บุคคลดังกล่าวถูกถอนอำนาจปกครอง\nการหมั้นที่ผู้เยาว์ทำโดยปราศจากความยินยอมดังกล่าวเป็นโมฆียะ"],["1437","b5t1","หมวด ๑ การหมั้น","","มาตรา ๑๔๓๗ การหมั้นจะสมบูรณ์เมื่อฝ่ายผู้หมั้นได้ส่งมอบหรือโอนทรัพย์สินอันเป็นของหมั้นให้แก่ผู้รับหมั้นเพื่อเป็นหลักฐานว่าจะสมรสกับผู้รับหมั้นนั้น\nเมื่อหมั้นแล้วให้ของหมั้นตกเป็นสิทธิแก่ผู้รับหมั้น\nสินสอด เป็นทรัพย์สินซึ่งฝ่ายผู้หมั้นให้แก่บิดามารดา ผู้รับบุตรบุญธรรมหรือผู้ปกครองฝ่ายผู้รับหมั้น แล้วแต่กรณี เพื่อตอบแทนการที่ผู้รับหมั้นยอมสมรส ถ้าไม่มีการสมรสโดยมีเหตุสำคัญอันเกิดแก่ผู้รับหมั้นหรือโดยมีพฤติการณ์ซึ่งฝ่ายผู้รับหมั้นต้องรับผิดชอบ ทำให้ผู้หมั้นไม่สมควรหรือไม่อาจสมรสกับผู้รับหมั้นนั้น ฝ่ายผู้หมั้นเรียกสินสอดคืนได้\nถ้าจะต้องคืนของหมั้นหรือสินสอดตามหมวดนี้ ให้นำบทบัญญัติมาตรา ๔๑๒ ถึงมาตรา ๔๑๘ แห่งประมวลกฎหมายนี้ว่าด้วยลาภมิควรได้มาใช้บังคับโดยอนุโลม"],["1438","b5t1","หมวด ๑ การหมั้น","","มาตรา ๑๔๓๘ การหมั้นไม่เป็นเหตุที่จะร้องขอให้ศาลบังคับให้สมรสได้ ถ้าได้มีข้อตกลงกันไว้ว่าจะให้เบี้ยปรับในเมื่อผิดสัญญาหมั้น ข้อตกลงนั้นเป็นโมฆะ"],["1439","b5t1","หมวด ๑ การหมั้น","","มาตรา ๑๔๓๙ เมื่อมีการหมั้นแล้ว ถ้าฝ่ายใดผิดสัญญาหมั้นอีกฝ่ายหนึ่งมีสิทธิเรียกให้รับผิดใช้ค่าทดแทน ในกรณีที่ฝ่ายผู้รับหมั้นเป็นฝ่ายผิดสัญญาหมั้นให้คืนของหมั้นแก่ฝ่ายผู้หมั้นด้วย"],["1440","b5t1","หมวด ๑ การหมั้น","","มาตรา ๑๔๔๐ ค่าทดแทนนั้นอาจเรียกได้ ดังต่อไปนี้\n(๑) ทดแทนความเสียหายต่อกายหรือชื่อเสียงแห่งผู้หมั้นหรือผู้รับหมั้นนั้น\n(๒) ทดแทนความเสียหายเนื่องจากการที่คู่หมั้น บิดามารดา หรือบุคคลผู้กระทำการในฐานะเช่นบิดามารดาได้ใช้จ่ายหรือต้องตกเป็นลูกหนี้เนื่องในการเตรียมการสมรสโดยสุจริตและตามสมควร\n(๓) ทดแทนความเสียหายเนื่องจากการที่คู่หมั้นได้จัดการทรัพย์สินหรือการอื่นอันเกี่ยวแก่อาชีพหรือทางทำมาหาได้ของตนไปโดยสมควรด้วยการคาดหมายว่าจะได้มีการสมรส\nในกรณีที่ผู้รับหมั้นเป็นผู้มีสิทธิได้ค่าทดแทน ศาลอาจชี้ขาดว่า ของหมั้นที่ตกเป็นสิทธิแก่ผู้รับหมั้นนั้นเป็นค่าทดแทนทั้งหมดหรือเป็นส่วนหนึ่งของค่าทดแทนที่ผู้รับหมั้นพึงได้รับ หรือศาลอาจให้ค่าทดแทนโดยไม่คำนึงถึงของหมั้นที่ตกเป็นสิทธิแก่ผู้รับหมั้นนั้นก็ได้"],["1441","b5t1","หมวด ๑ การหมั้น","","มาตรา ๑๔๔๑ ถ้าคู่หมั้นฝ่ายหนึ่งตายก่อนสมรส อีกฝ่ายหนึ่งจะเรียกร้องค่าทดแทนมิได้ ส่วนของหมั้นหรือสินสอดนั้นไม่ว่าผู้หมั้นหรือผู้รับหมั้นตาย ผู้รับหมั้นหรือฝ่ายผู้รับหมั้นไม่ต้องคืนให้แก่ฝ่ายผู้หมั้น"],["1442","b5t1","หมวด ๑ การหมั้น","","มาตรา ๑๔๔๒ ในกรณีมีเหตุสำคัญอันเกิดแก่ผู้รับหมั้นทำให้ผู้หมั้นไม่สมควรสมรสกับผู้รับหมั้นนั้น ผู้หมั้นมีสิทธิบอกเลิกสัญญาหมั้นได้และให้ผู้รับหมั้นคืนของหมั้นแก่ผู้หมั้น"],["1443","b5t1","หมวด ๑ การหมั้น","","มาตรา ๑๔๔๓ ในกรณีมีเหตุสำคัญอันเกิดแก่ผู้หมั้นทำให้ผู้รับหมั้นไม่สมควรสมรสกับผู้หมั้นนั้น ผู้รับหมั้นมีสิทธิบอกเลิกสัญญาหมั้นได้โดยมิต้องคืนของหมั้นแก่ผู้หมั้น"],["1444","b5t1","หมวด ๑ การหมั้น","","มาตรา ๑๔๔๔ ถ้าเหตุอันทำให้คู่หมั้นบอกเลิกสัญญาหมั้นเป็นเพราะการกระทำชั่วอย่างร้ายแรงของคู่หมั้นอีกฝ่ายหนึ่งซึ่งได้กระทำภายหลังการหมั้น คู่หมั้นผู้กระทำชั่วอย่างร้ายแรงนั้นต้องรับผิดใช้ค่าทดแทนแก่คู่หมั้นผู้ใช้สิทธิบอกเลิกสัญญาหมั้นเสมือนเป็นผู้ผิดสัญญาหมั้น"],["1445","b5t1","หมวด ๑ การหมั้น","","มาตรา ๑๔๔๕ คู่หมั้นฝ่ายหนึ่งอาจเรียกค่าทดแทนจากผู้ซึ่งได้ร่วมประเวณีกับคู่หมั้นของตน หรือผู้ซึ่งกระทำกับคู่หมั้นของตนเพื่อสนองความใคร่ของผู้นั้นหรือคู่หมั้นของตนโดยรู้หรือควรจะรู้ถึงการหมั้นนั้น เมื่อได้บอกเลิกสัญญาหมั้นแล้วตามมาตรา ๑๔๔๒ หรือมาตรา ๑๔๔๓ แล้วแต่กรณี"],["1446","b5t1","หมวด ๑ การหมั้น","","มาตรา ๑๔๔๖ คู่หมั้นฝ่ายหนึ่งอาจเรียกค่าทดแทนจากผู้ซึ่งได้ข่มขืนกระทำชำเราหรือพยายามข่มขืนกระทำชำเราคู่หมั้นของตนโดยรู้หรือควรจะรู้ถึงการหมั้นนั้นได้โดยไม่จำต้องบอกเลิกสัญญาหมั้น"],["1447","b5t1","หมวด ๑ การหมั้น","","มาตรา ๑๔๔๗ ค่าทดแทนอันจะพึงชดใช้แก่กันตามหมวดนี้ให้ศาลวินิจฉัยตามควรแก่พฤติการณ์\nสิทธิเรียกร้องค่าทดแทนตามหมวดนี้ นอกจากค่าทดแทนตามมาตรา ๑๔๔๐ (๒) ไม่อาจโอนกันได้และไม่ตกทอดไปถึงทายาท เว้นแต่สิทธินั้นจะได้รับสภาพกันไว้เป็นหนังสือหรือผู้เสียหายได้เริ่มฟ้องคดีตามสิทธินั้นแล้ว"],["1447/1","b5t1","หมวด ๑ การหมั้น","","มาตรา ๑๔๔๗/๑ สิทธิเรียกร้องค่าทดแทนตามมาตรา ๑๔๓๙ ให้มีอายุความหกเดือนนับแต่วันที่ผิดสัญญาหมั้น\nสิทธิเรียกร้องค่าทดแทนตามมาตรา ๑๔๔๔ ให้มีอายุความหกเดือนนับแต่วันรู้หรือควรรู้ถึงการกระทำชั่วอย่างร้ายแรงอันเป็นเหตุให้บอกเลิกสัญญาหมั้น แต่ต้องไม่เกินห้าปีนับแต่วันกระทำการดังกล่าว\nสิทธิเรียกร้องค่าทดแทนตามมาตรา ๑๔๔๕ และมาตรา ๑๔๔๖ ให้มีอายุความหกเดือนนับแต่วันที่ผู้หมั้นหรือผู้รับหมั้นรู้หรือควรรู้ถึงการกระทำของผู้อื่นอันจะเป็นเหตุให้เรียกค่าทดแทนและรู้ตัวผู้จะพึงใช้ค่าทดแทนนั้น แต่ต้องไม่เกินห้าปีนับแต่วันที่ผู้อื่นนั้นได้กระทำการดังกล่าว"],["1447/2","b5t1","หมวด ๑ การหมั้น","","มาตรา ๑๔๔๗/๒ สิทธิเรียกคืนของหมั้นตามมาตรา ๑๔๓๙ ให้มีอายุความหกเดือนนับแต่วันที่ผิดสัญญาหมั้น\nสิทธิเรียกคืนของหมั้นตามมาตรา ๑๔๔๒ ให้มีอายุความหกเดือนนับแต่วันที่ได้บอกเลิกสัญญาหมั้น"],["1448","b5t1","หมวด ๒ เงื่อนไขแห่งการสมรส","","มาตรา ๑๔๔๘ การสมรสจะกระทำได้ต่อเมื่อบุคคลทั้งสองฝ่ายมีอายุสิบแปดปีบริบูรณ์แล้ว แต่ในกรณีมีเหตุอันสมควร ศาลอาจอนุญาตให้ทำการสมรสก่อนนั้นได้"],["1449","b5t1","หมวด ๒ เงื่อนไขแห่งการสมรส","","มาตรา ๑๔๔๙ การสมรสจะกระทำมิได้ถ้าบุคคลใดบุคคลหนึ่งเป็นบุคคลวิกลจริตหรือเป็นบุคคลซึ่งศาลสั่งให้เป็นคนไร้ความสามารถ"],["1450","b5t1","หมวด ๒ เงื่อนไขแห่งการสมรส","","มาตรา ๑๔๕๐ บุคคลสองคนซึ่งเป็นญาติสืบสายโลหิตโดยตรงขึ้นไปหรือลงมาก็ดี เป็นพี่น้องร่วมบิดามารดาหรือร่วมแต่บิดาหรือมารดาก็ดี จะทำการสมรสกันไม่ได้ ความเป็นญาติดังกล่าวมานี้ให้ถือตามสายโลหิต โดยไม่คำนึงว่าจะเป็นญาติโดยชอบด้วยกฎหมายหรือไม่"],["1451","b5t1","หมวด ๒ เงื่อนไขแห่งการสมรส","","มาตรา ๑๔๕๑ ผู้รับบุตรบุญธรรมและบุตรบุญธรรมจะสมรสกันไม่ได้"],["1452","b5t1","หมวด ๒ เงื่อนไขแห่งการสมรส","","มาตรา ๑๔๕๒ บุคคลจะทำการสมรสในขณะที่ตนมีคู่สมรสอยู่ไม่ได้"],["1453","b5t1","หมวด ๒ เงื่อนไขแห่งการสมรส","","มาตรา ๑๔๕๓ หญิงที่ชายผู้เป็นคู่สมรสตายหรือที่การสมรสสิ้นสุดลงด้วยประการอื่นจะทำการสมรสใหม่กับชายได้ต่อเมื่อการสิ้นสุดแห่งการสมรสได้ผ่านพ้นไปแล้วไม่น้อยกว่าสามร้อยสิบวัน เว้นแต่\n(๑) คลอดบุตรแล้วในระหว่างนั้น\n(๒) สมรสกับคู่สมรสเดิม\n(๓) มีใบรับรองแพทย์ประกาศนียบัตรหรือปริญญาซึ่งเป็นผู้ประกอบการรักษาโรคในสาขาเวชกรรมได้ตามกฎหมายว่ามิได้มีครรภ์ หรือ\n(๔) มีคำสั่งของศาลให้สมรสได้"],["1454","b5t1","หมวด ๒ เงื่อนไขแห่งการสมรส","","มาตรา ๑๔๕๔ ผู้เยาว์จะทำการสมรสให้นำความในมาตรา ๑๔๓๖ มาใช้บังคับโดยอนุโลม"],["1455","b5t1","หมวด ๒ เงื่อนไขแห่งการสมรส","","มาตรา ๑๔๕๕ การให้ความยินยอมให้ทำการสมรสจะกระทำได้แต่โดย\n(๑) ลงลายมือชื่อในทะเบียนขณะจดทะเบียนสมรส\n(๒) ทำเป็นหนังสือแสดงความยินยอม โดยระบุชื่อผู้จะสมรสทั้งสองฝ่ายและลงลายมือชื่อของผู้ให้ความยินยอม\n(๓) ถ้ามีเหตุจำเป็น จะให้ความยินยอมด้วยวาจาต่อหน้าพยานอย่างน้อยสองคนก็ได้\nความยินยอมนั้น เมื่อให้แล้วถอนไม่ได้"],["1456","b5t1","หมวด ๒ เงื่อนไขแห่งการสมรส","","มาตรา ๑๔๕๖ ถ้าไม่มีผู้ที่มีอำนาจให้ความยินยอมตามมาตรา ๑๔๕๔ หรือมีแต่ไม่ให้ความยินยอมหรือไม่อยู่ในสภาพที่อาจให้ความยินยอม หรือโดยพฤติการณ์ผู้เยาว์ไม่อาจขอความยินยอมได้ ผู้เยาว์อาจร้องขอต่อศาลเพื่ออนุญาตให้ทำการสมรส"],["1457","b5t1","หมวด ๒ เงื่อนไขแห่งการสมรส","","มาตรา ๑๔๕๗ การสมรสตามประมวลกฎหมายนี้จะมีได้เฉพาะเมื่อได้จดทะเบียนแล้วเท่านั้น"],["1458","b5t1","หมวด ๒ เงื่อนไขแห่งการสมรส","","มาตรา ๑๔๕๘ การสมรสจะทำได้ต่อเมื่อบุคคลสองคนยินยอมเป็นคู่สมรสกันและต้องแสดงการยินยอมนั้นให้ปรากฏโดยเปิดเผยต่อหน้านายทะเบียนและให้นายทะเบียนบันทึกความยินยอมนั้นไว้ด้วย"],["1459","b5t1","หมวด ๒ เงื่อนไขแห่งการสมรส","","มาตรา ๑๔๕๙ การสมรสในต่างประเทศระหว่างคนที่มีสัญชาติไทยด้วยกัน หรือฝ่ายใดฝ่ายหนึ่งมีสัญชาติไทย จะทำตามแบบที่กำหนดไว้ตามกฎหมายไทยหรือกฎหมายแห่งประเทศนั้นก็ได้\nในกรณีที่คู่สมรสประสงค์จะจดทะเบียนตามกฎหมายไทย ให้พนักงานทูตหรือกงสุลไทยเป็นผู้รับจดทะเบียน"],["1460","b5t1","หมวด ๒ เงื่อนไขแห่งการสมรส","","มาตรา ๑๔๖๐ เมื่อมีพฤติการณ์พิเศษซึ่งไม่อาจทำการจดทะเบียนสมรสต่อนายทะเบียนได้เพราะบุคคลฝ่ายใดฝ่ายหนึ่งหรือทั้งสองฝ่ายตกอยู่ในอันตรายใกล้ความตาย หรืออยู่ในภาวะการรบหรือสงคราม ถ้าบุคคลทั้งสองนั้นได้แสดงเจตนาจะสมรสกันต่อหน้าบุคคลซึ่งบรรลุนิติภาวะที่อยู่ ณ ที่นั้น แล้วให้บุคคลดังกล่าวจดแจ้งการแสดงเจตนาขอทำการสมรสของบุคคลทั้งสองนั้นไว้เป็นหลักฐาน และต่อมาบุคคลทั้งสองได้จดทะเบียนสมรสกันภายในเก้าสิบวันนับแต่วันที่อาจทำการจดทะเบียนต่อนายทะเบียนได้ โดยแสดงหลักฐานต่อนายทะเบียนและให้นายทะเบียนจดแจ้งวัน เดือน ปี สถานที่ที่แสดงเจตนาขอทำการสมรส และพฤติการณ์พิเศษนั้นไว้ในทะเบียนสมรส ให้ถือว่าวันแสดงเจตนาขอทำการสมรสต่อบุคคลดังกล่าวเป็นวันจดทะเบียนสมรสต่อนายทะเบียนแล้ว\nความในมาตรานี้มิให้ใช้บังคับถ้าหากจะมีการสมรสในวันแสดงเจตนาขอทำการสมรส การสมรสนั้นจะตกเป็นโมฆะ"],["1461","b5t1","หมวด ๓ ความสัมพันธ์ระหว่างคู่สมรส","","มาตรา ๑๔๖๑ คู่สมรสต้องอยู่กินด้วยกันฉันคู่สมรส\nคู่สมรสต้องช่วยเหลืออุปการะเลี้ยงดูกันตามความสามารถและฐานะของตน"],["1462","b5t1","หมวด ๓ ความสัมพันธ์ระหว่างคู่สมรส","","มาตรา ๑๔๖๒ ในกรณีที่คู่สมรสไม่สามารถที่จะอยู่กินด้วยกันฉันคู่สมรสโดยปกติสุขได้ หรือถ้าการอยู่ร่วมกันจะเป็นอันตรายแก่กายหรือจิตใจหรือทำลายความผาสุกอย่างมาก คู่สมรสฝ่ายใดฝ่ายหนึ่งที่ไม่สามารถที่จะอยู่กินด้วยกันฉันคู่สมรสโดยปกติสุขได้หรือฝ่ายที่จะต้องรับอันตรายหรือถูกทำลายความผาสุก อาจร้องต่อศาลเพื่อให้มีคำสั่งอนุญาตให้ตนอยู่ต่างหากในระหว่างที่เหตุนั้น ๆ ยังมีอยู่ก็ได้ ในกรณีเช่นนี้ศาลจะกำหนดจำนวนค่าอุปการะเลี้ยงดูให้ฝ่ายหนึ่งจ่ายให้แก่อีกฝ่ายหนึ่งตามควรแก่พฤติการณ์ก็ได้"],["1463","b5t1","หมวด ๓ ความสัมพันธ์ระหว่างคู่สมรส","","มาตรา ๑๔๖๓ ในกรณีที่ศาลสั่งให้คู่สมรสฝ่ายใดฝ่ายหนึ่งเป็นคนไร้ความสามารถหรือเสมือนไร้ความสามารถ คู่สมรสอีกฝ่ายหนึ่งย่อมเป็นผู้อนุบาลหรือผู้พิทักษ์ แต่เมื่อผู้มีส่วนได้เสียหรืออัยการร้องขอ และถ้ามีเหตุสำคัญ ศาลจะตั้งผู้อื่นเป็นผู้อนุบาลหรือผู้พิทักษ์ก็ได้"],["1464","b5t1","หมวด ๓ ความสัมพันธ์ระหว่างคู่สมรส","","มาตรา ๑๔๖๔ ในกรณีที่คู่สมรสฝ่ายใดฝ่ายหนึ่งเป็นคนวิกลจริต ไม่ว่าศาลจะได้สั่งให้เป็นคนไร้ความสามารถหรือไม่ ถ้าคู่สมรสอีกฝ่ายหนึ่งไม่อุปการะเลี้ยงดูฝ่ายที่วิกลจริตตามมาตรา ๑๔๖๑ วรรคสอง หรือกระทำการหรือไม่กระทำการอย่างใด อันเป็นเหตุให้ฝ่ายที่วิกลจริตตกอยู่ในภาวะอันน่าจะเกิดอันตรายแก่กายหรือจิตใจ หรือตกอยู่ในภาวะอันน่าจะเกิดความเสียหายทางทรัพย์สินถึงขนาด บุคคลตามที่ระบุไว้ในมาตรา ๒๘ หรือผู้อนุบาลอาจฟ้องคู่สมรสอีกฝ่ายหนึ่งเรียกค่าอุปการะเลี้ยงดูให้แก่ฝ่ายที่วิกลจริต หรือขอให้ศาลมีคำสั่งใด ๆ เพื่อคุ้มครองฝ่ายที่วิกลจริตนั้นได้\nในกรณีฟ้องเรียกค่าอุปการะเลี้ยงดูตามวรรคหนึ่งถ้ายังมิได้มีคำสั่งของศาลว่าคู่สมรสซึ่งวิกลจริตเป็นคนไร้ความสามารถ ก็ให้ขอต่อศาลในคดีเดียวกันให้ศาลมีคำสั่งว่าคู่สมรสซึ่งวิกลจริตนั้นเป็นคนไร้ความสามารถ โดยขอให้ตั้งตนเองหรือผู้อื่นที่ศาลเห็นสมควรเป็นผู้อนุบาล หรือถ้าได้มีคำสั่งของศาลแสดงว่าคู่สมรสซึ่งวิกลจริตเป็นคนไร้ความสามารถอยู่แล้ว จะขอให้ถอดถอนผู้อนุบาลคนเดิมและแต่งตั้งผู้อนุบาลคนใหม่ก็ได้\nในการขอให้ศาลมีคำสั่งใด ๆ เพื่อคุ้มครองคู่สมรสฝ่ายที่วิกลจริตโดยมิได้เรียกค่าอุปการะเลี้ยงดูด้วยนั้น จะไม่ขอให้ศาลมีคำสั่งให้คู่สมรสฝ่ายที่วิกลจริตนั้นเป็นคนไร้ความสามารถ หรือจะไม่ขอเปลี่ยนผู้อนุบาลก็ได้ แต่ถ้าศาลเห็นว่าวิธีการคุ้มครองที่ขอนั้นจำต้องมีผู้อนุบาลหรือเปลี่ยนผู้อนุบาล ให้ศาลมีคำสั่งให้จัดการทำนองเดียวกับที่บัญญัติไว้ในวรรคสอง แล้วจึงมีคำสั่งคุ้มครองตามที่เห็นสมควร"],["1464/1","b5t1","หมวด ๓ ความสัมพันธ์ระหว่างคู่สมรส","","มาตรา ๑๔๖๔/๑ ในระหว่างการพิจารณาคดีตามมาตรา ๑๔๖๔ ถ้ามีคำขอศาลอาจกำหนดวิธีการชั่วคราวเกี่ยวกับการอุปการะเลี้ยงดูหรือการคุ้มครองคู่สมรสฝ่ายที่วิกลจริตได้ตามที่เห็นสมควร และหากเป็นกรณีฉุกเฉินให้นำบทบัญญัติเรื่องคำขอในเหตุฉุกเฉินตามประมวลกฎหมายวิธีพิจารณาความแพ่งมาใช้บังคับ"],["1465","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๖๕ ถ้าคู่สมรสมิได้ทำสัญญากันไว้ในเรื่องทรัพย์สินเป็นพิเศษก่อนสมรส ความสัมพันธ์ระหว่างคู่สมรสในเรื่องทรัพย์สินนั้น ให้บังคับตามบทบัญญัติในหมวดนี้\nถ้าข้อความใดในสัญญาก่อนสมรสขัดต่อความสงบเรียบร้อยหรือศีลธรรมอันดีของประชาชน หรือระบุให้ใช้กฎหมายประเทศอื่นบังคับเรื่องทรัพย์สินนั้น ข้อความนั้น ๆ เป็นโมฆะ"],["1466","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๖๖ สัญญาก่อนสมรสเป็นโมฆะ ถ้ามิได้จดแจ้งข้อตกลงกันเป็นสัญญาก่อนสมรสนั้นไว้ในทะเบียนสมรสพร้อมกับการจดทะเบียนสมรส หรือมิได้ทำเป็นหนังสือลงลายมือชื่อคู่สมรสและพยานอย่างน้อยสองคนแนบไว้ท้ายทะเบียนสมรส และได้จดไว้ในทะเบียนสมรสพร้อมกับการจดทะเบียนสมรสว่าได้มีสัญญานั้นแนบไว้"],["1467","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๖๗ เมื่อสมรสแล้วจะเปลี่ยนแปลงเพิกถอนสัญญาก่อนสมรสนั้นไม่ได้ นอกจากจะได้รับอนุญาตจากศาล\nเมื่อได้มีคำสั่งของศาลถึงที่สุดให้เปลี่ยนแปลงเพิกถอนสัญญาก่อนสมรสแล้ว ให้ศาลแจ้งไปยังนายทะเบียนสมรสเพื่อจดแจ้งไว้ในทะเบียนสมรส"],["1468","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๖๘ ข้อความในสัญญาก่อนสมรสไม่มีผลกระทบกระเทือนถึงสิทธิของบุคคลภายนอกผู้ทำการโดยสุจริตไม่ว่าจะได้เปลี่ยนแปลงเพิกถอนโดยคำสั่งของศาลหรือไม่ก็ตาม"],["1469","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๖๙ สัญญาที่เกี่ยวกับทรัพย์สินใดที่คู่สมรสได้ทำไว้ต่อกันในระหว่างเป็นคู่สมรสกันนั้น ฝ่ายใดฝ่ายหนึ่งจะบอกล้างเสียในเวลาใดที่เป็นคู่สมรสกันอยู่หรือภายในกำหนดหนึ่งปีนับแต่วันที่ขาดจากการเป็นคู่สมรสกันก็ได้ แต่ไม่กระทบกระเทือนถึงสิทธิของบุคคลภายนอกผู้ทำการโดยสุจริต"],["1470","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๗๐ ทรัพย์สินระหว่างคู่สมรส นอกจากที่ได้แยกไว้เป็นสินส่วนตัวย่อมเป็นสินสมรส"],["1471","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๗๑ สินส่วนตัวได้แก่ทรัพย์สิน\n(๑) ที่ฝ่ายใดฝ่ายหนึ่งมีอยู่ก่อนสมรส\n(๒) ที่เป็นเครื่องใช้สอยส่วนตัว เครื่องแต่งกาย หรือเครื่องประดับกายตามควรแก่ฐานะ หรือเครื่องมือเครื่องใช้ที่จำเป็นในการประกอบอาชีพหรือวิชาชีพของคู่สมรสฝ่ายใดฝ่ายหนึ่ง\n(๓) ที่ฝ่ายใดฝ่ายหนึ่งได้มาระหว่างสมรสโดยการรับมรดกหรือโดยการให้โดยเสน่หา\n(๔) ที่เป็นของหมั้น"],["1472","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๗๒ สินส่วนตัวนั้น ถ้าได้แลกเปลี่ยนเป็นทรัพย์สินอื่นก็ดี ซื้อทรัพย์สินอื่นมาก็ดี หรือขายได้เป็นเงินมาก็ดี ทรัพย์สินอื่นหรือเงินที่ได้มานั้นเป็นสินส่วนตัว\nสินส่วนตัวที่ถูกทำลายไปทั้งหมดหรือแต่บางส่วน แต่ได้ทรัพย์สินอื่นหรือเงินมาทดแทน ทรัพย์สินอื่นหรือเงินที่ได้มานั้นเป็นสินส่วนตัว"],["1473","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๗๓ สินส่วนตัวของคู่สมรสฝ่ายใดให้ฝ่ายนั้นเป็นผู้จัดการ"],["1474","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๗๔ สินสมรสได้แก่ทรัพย์สิน\n(๑) ที่คู่สมรสได้มาระหว่างสมรส\n(๒) ที่ฝ่ายใดฝ่ายหนึ่งได้มาระหว่างสมรสโดยพินัยกรรมหรือโดยการให้เป็นหนังสือเมื่อพินัยกรรมหรือหนังสือยกให้ระบุว่าเป็นสินสมรส\n(๓) ที่เป็นดอกผลของสินส่วนตัว\nถ้ากรณีเป็นที่สงสัยว่าทรัพย์สินอย่างหนึ่งเป็นสินสมรสหรือมิใช่ ให้สันนิษฐานไว้ก่อนว่าเป็นสินสมรส"],["1475","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๗๕ ถ้าสินสมรสใดเป็นจำพวกที่ระบุไว้ในมาตรา ๔๕๖ แห่งประมวลกฎหมายนี้ หรือที่มีเอกสารเป็นสำคัญ คู่สมรสฝ่ายใดฝ่ายหนึ่งจะร้องขอให้ลงชื่อตนเป็นเจ้าของรวมกันในเอกสารนั้นก็ได้"],["1476","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๗๖ คู่สมรสต้องจัดการสินสมรสร่วมกันหรือได้รับความยินยอมจากอีกฝ่ายหนึ่งในกรณี ดังต่อไปนี้\n(๑) ขาย แลกเปลี่ยน ขายฝาก ให้เช่าซื้อ จำนอง ปลดจำนอง หรือโอนสิทธิจำนอง ซึ่งอสังหาริมทรัพย์หรือสังหาริมทรัพย์ที่อาจจำนองได้\n(๒) ก่อตั้งหรือกระทำให้สุดสิ้นลงทั้งหมดหรือบางส่วนซึ่งภาระจำยอม สิทธิอาศัย สิทธิเหนือพื้นดิน สิทธิเก็บกิน หรือภาระติดพันในอสังหาริมทรัพย์\n(๓) ให้เช่าอสังหาริมทรัพย์เกินสามปี\n(๔) ให้กู้ยืมเงิน\n(๕) ให้โดยเสน่หา เว้นแต่การให้ที่พอควรแก่ฐานานุรูปของครอบครัวเพื่อการกุศล เพื่อการสังคม หรือตามหน้าที่ธรรมจรรยา\n(๖) ประนีประนอมยอมความ\n(๗) มอบข้อพิพาทให้อนุญาโตตุลาการวินิจฉัย\n(๘) นำทรัพย์สินไปเป็นประกันหรือหลักประกันต่อเจ้าพนักงานหรือศาล\nการจัดการสินสมรสนอกจากกรณีที่บัญญัติไว้ในวรรคหนึ่ง คู่สมรสฝ่ายใดฝ่ายหนึ่งจัดการได้โดยมิต้องได้รับความยินยอมจากอีกฝ่ายหนึ่ง"],["1476/1","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๗๖/๑ คู่สมรสจะจัดการสินสมรสให้แตกต่างไปจากที่บัญญัติไว้ในมาตรา ๑๔๗๖ ทั้งหมดหรือบางส่วนได้ก็ต่อเมื่อได้ทำสัญญาก่อนสมรสไว้ตามที่บัญญัติในมาตรา ๑๔๖๕ และมาตรา ๑๔๖๖ ในกรณีดังกล่าวนี้ การจัดการสินสมรสให้เป็นไปตามที่ระบุไว้ในสัญญาก่อนสมรส\nในกรณีที่สัญญาก่อนสมรสระบุการจัดการสินสมรสไว้แต่เพียงบางส่วนของมาตรา ๑๔๗๖ การจัดการสินสมรสนอกจากที่ระบุไว้ในสัญญาก่อนสมรสให้เป็นไปตามมาตรา ๑๔๗๖"],["1477","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๗๗ คู่สมรสฝ่ายใดฝ่ายหนึ่งมีสิทธิฟ้อง ต่อสู้ หรือดำเนินคดีเกี่ยวกับการสงวนบำรุงรักษาสินสมรส หรือเพื่อประโยชน์แก่สินสมรส หนี้อันเกิดแต่การฟ้อง ต่อสู้ หรือดำเนินคดีดังกล่าว ให้ถือว่าเป็นหนี้ที่คู่สมรสเป็นลูกหนี้ร่วมกัน"],["1478","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๗๘ เมื่อฝ่ายใดต้องให้ความยินยอมหรือลงชื่อกับอีกฝ่ายหนึ่งในเรื่องจัดการทรัพย์สินแต่ไม่ให้ความยินยอมหรือไม่ยอมลงชื่อโดยปราศจากเหตุผล หรือไม่อยู่ในสภาพที่อาจให้ความยินยอมได้ อีกฝ่ายหนึ่งอาจร้องขอต่อศาลให้สั่งอนุญาตแทนได้"],["1479","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๗๙ การใดที่คู่สมรสฝ่ายใดฝ่ายหนึ่งกระทำ ซึ่งต้องรับความยินยอมร่วมกัน และถ้าการนั้นมีกฎหมายบัญญัติให้ทำเป็นหนังสือหรือให้จดทะเบียนต่อพนักงานเจ้าหน้าที่ ความยินยอมนั้นต้องทำเป็นหนังสือ"],["1480","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๘๐ การจัดการสินสมรสซึ่งต้องจัดการร่วมกันหรือต้องได้รับความยินยอมจากอีกฝ่ายหนึ่งตามมาตรา ๑๔๗๖ ถ้าคู่สมรสฝ่ายหนึ่งได้ทำนิติกรรมไปแต่เพียงฝ่ายเดียว หรือโดยปราศจากความยินยอมของคู่สมรสอีกฝ่ายหนึ่ง คู่สมรสอีกฝ่ายหนึ่งอาจฟ้องให้ศาลเพิกถอนนิติกรรมนั้นได้ เว้นแต่คู่สมรสอีกฝ่ายหนึ่งได้ให้สัตยาบันแก่นิติกรรมนั้นแล้ว หรือในขณะที่ทำนิติกรรมนั้นบุคคลภายนอกได้กระทำโดยสุจริตและเสียค่าตอบแทน\nการฟ้องให้ศาลเพิกถอนนิติกรรมตามวรรคหนึ่ง ห้ามมิให้ฟ้องเมื่อพ้นหนึ่งปี นับแต่วันที่ได้รู้เหตุอันเป็นมูลให้เพิกถอนหรือเมื่อพ้นสิบปีนับแต่วันที่ได้ทำนิติกรรมนั้น"],["1481","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๘๑ คู่สมรสฝ่ายใดฝ่ายหนึ่งไม่มีอำนาจทำพินัยกรรมยกสินสมรสที่เกินกว่าส่วนของตนให้แก่บุคคลใดได้"],["1482","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๘๒ ในกรณีที่คู่สมรสฝ่ายใดฝ่ายหนึ่งมีอำนาจจัดการสินสมรสแต่ฝ่ายเดียว คู่สมรสอีกฝ่ายหนึ่งก็ยังมีอำนาจจัดการบ้านเรือนและจัดหาสิ่งจำเป็นสำหรับครอบครัวตามสมควรแก่อัตภาพได้ ค่าใช้จ่ายในการนี้ย่อมผูกพันสินสมรสและสินส่วนตัวของทั้งสองฝ่าย\nถ้าคู่สมรสฝ่ายใดฝ่ายหนึ่งจัดการบ้านเรือนหรือจัดหาสิ่งจำเป็นสำหรับครอบครัวเป็นที่เสียหายถึงขนาด อีกฝ่ายหนึ่งอาจร้องขอให้ศาลสั่งห้ามหรือจำกัดอำนาจนี้เสียได้"],["1483","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๘๓ ในกรณีที่คู่สมรสฝ่ายใดฝ่ายหนึ่งมีอำนาจจัดการสินสมรสแต่ฝ่ายเดียว ถ้าคู่สมรสฝ่ายนั้นจะกระทำ หรือกำลังกระทำการอย่างใดอย่างหนึ่งในการจัดการสินสมรสอันพึงเห็นได้ว่าจะเกิดความเสียหายถึงขนาด อีกฝ่ายหนึ่งอาจร้องขอให้ศาลสั่งห้ามมิให้กระทำการนั้นได้"],["1484","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๘๔ ถ้าคู่สมรสฝ่ายซึ่งมีอำนาจจัดการสินสมรส\n(๑) จัดการสินสมรสเป็นที่เสียหายถึงขนาด\n(๒) ไม่อุปการะเลี้ยงดูอีกฝ่ายหนึ่ง\n(๓) มีหนี้สินล้นพ้นตัวหรือทำหนี้เกินกึ่งหนึ่งของสินสมรส\n(๔) ขัดขวางการจัดการสินสมรสของอีกฝ่ายหนึ่งโดยไม่มีเหตุผลอันสมควร\n(๕) มีพฤติการณ์ปรากฏว่าจะทำความหายนะให้แก่สินสมรส\nอีกฝ่ายหนึ่งอาจร้องขอให้ศาลสั่งอนุญาตให้ตนเป็นผู้จัดการสินสมรสแต่ผู้เดียวหรือสั่งให้แยกสินสมรสได้\nในกรณีตามวรรคหนึ่ง ถ้ามีคำขอ ศาลอาจกำหนดวิธีคุ้มครองชั่วคราวเพื่อจัดการสินสมรสได้ตามที่เห็นสมควร และหากเป็นกรณีฉุกเฉินให้นำบทบัญญัติเรื่องคำขอในเหตุฉุกเฉินตามประมวลกฎหมายวิธีพิจารณาความแพ่งมาใช้บังคับ"],["1484/1","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๘๔/๑ ในกรณีที่ศาลได้มีคำสั่งห้ามหรือจำกัดอำนาจในการจัดการสินสมรสของคู่สมรสฝ่ายใดฝ่ายหนึ่งตามมาตรา ๑๔๘๒ มาตรา ๑๔๘๓ หรือมาตรา ๑๔๘๔ ถ้าต่อมาเหตุแห่งการนั้นหรือพฤติการณ์ได้เปลี่ยนแปลงไป คู่สมรสฝ่ายใดฝ่ายหนึ่งอาจร้องขอต่อศาลให้ยกเลิกหรือเปลี่ยนแปลงคำสั่งที่ห้ามหรือจำกัดอำนาจจัดการสินสมรสนั้นได้ ในการนี้ศาลจะมีคำสั่งใด ๆ ตามที่เห็นสมควรก็ได้"],["1485","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๘๕ คู่สมรสฝ่ายใดฝ่ายหนึ่งอาจร้องขอต่อศาลให้ตนเป็นผู้จัดการสินสมรสโดยเฉพาะอย่างใดอย่างหนึ่งหรือเข้าร่วมจัดการในการนั้นได้ ถ้าการที่จะทำเช่นนั้นจะเป็นประโยชน์ยิ่งกว่า"],["1486","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๘๖ เมื่อศาลได้มีคำพิพากษาหรือคำสั่งถึงที่สุดตามความในมาตรา ๑๔๘๒ วรรคสอง มาตรา ๑๔๘๓ มาตรา ๑๔๘๔ มาตรา ๑๔๘๔/๑ หรือมาตรา ๑๔๘๕ อันเป็นคุณแก่ผู้ร้องขอ หรือตามมาตรา ๑๔๙๑ มาตรา ๑๔๙๒/๑ หรือมาตรา ๑๕๙๘/๑๗ หรือเมื่อคู่สมรสฝ่ายใดฝ่ายหนึ่งพ้นจากการเป็นบุคคลล้มละลาย ให้ศาลแจ้งไปยังนายทะเบียนเพื่อจดแจ้งไว้ในทะเบียนสมรส"],["1487","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๘๗ ในระหว่างที่เป็นคู่สมรสกัน ฝ่ายใดจะยึดหรืออายัดทรัพย์สินของอีกฝ่ายหนึ่งไม่ได้ เว้นแต่เป็นการยึดหรืออายัดทรัพย์สินในคดีที่ฟ้องร้องเพื่อการปฏิบัติหน้าที่หรือรักษาสิทธิระหว่างคู่สมรสตามที่บัญญัติไว้โดยเฉพาะในประมวลกฎหมายนี้ หรือที่ประมวลกฎหมายนี้บัญญัติไว้โดยเฉพาะให้คู่สมรสฟ้องร้องกันเองได้ หรือเป็นการยึดหรืออายัดทรัพย์สินสำหรับค่าอุปการะเลี้ยงดูและค่าฤชาธรรมเนียมที่ยังมิได้ชำระตามคำพิพากษาของศาล"],["1488","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๘๘ ถ้าคู่สมรสฝ่ายใดฝ่ายหนึ่งต้องรับผิดเป็นส่วนตัวเพื่อชำระหนี้ที่ก่อไว้ก่อนหรือระหว่างสมรส ให้ชำระหนี้นั้นด้วยสินส่วนตัวของฝ่ายนั้นก่อน เมื่อไม่พอจึงให้ชำระด้วยสินสมรสที่เป็นส่วนของฝ่ายนั้น"],["1489","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๘๙ ถ้าคู่สมรสเป็นลูกหนี้ร่วมกัน ให้ชำระหนี้นั้นจากสินสมรสและสินส่วนตัวของทั้งสองฝ่าย"],["1490","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๙๐ หนี้ที่คู่สมรสเป็นลูกหนี้ร่วมกันนั้นให้รวมถึงหนี้ที่คู่สมรสฝ่ายใดฝ่ายหนึ่งก่อให้เกิดขึ้นในระหว่างสมรส ดังต่อไปนี้\n(๑) หนี้เกี่ยวแก่การจัดการบ้านเรือนและจัดหาสิ่งจำเป็นสำหรับครอบครัว การอุปการะเลี้ยงดู ตลอดถึงการรักษาพยาบาลบุคคลในครอบครัวและการศึกษาของบุตรตามสมควรแก่อัตภาพ\n(๒) หนี้ที่เกี่ยวข้องกับสินสมรส\n(๓) หนี้ที่เกิดขึ้นเนื่องจากการงานซึ่งคู่สมรสทำด้วยกัน\n(๔) หนี้ที่คู่สมรสฝ่ายใดฝ่ายหนึ่งก่อขึ้นเพื่อประโยชน์ตนฝ่ายเดียว แต่อีกฝ่ายหนึ่งได้ให้สัตยาบัน"],["1491","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๙๑ ถ้าคู่สมรสฝ่ายใดฝ่ายหนึ่งต้องคำพิพากษาให้ล้มละลาย สินสมรสย่อมแยกจากกันโดยอำนาจกฎหมายนับแต่วันที่ศาลพิพากษาให้ล้มละลายนั้น"],["1492","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๙๒ เมื่อได้แยกสินสมรสตามมาตรา ๑๔๘๔ วรรคสอง มาตรา ๑๔๙๑ หรือมาตรา ๑๕๙๘/๑๗ วรรคสองแล้ว ให้ส่วนที่แยกออกตกเป็นสินส่วนตัวของคู่สมรสฝ่ายใดฝ่ายหนึ่ง และบรรดาทรัพย์สินที่ฝ่ายใดได้มาในภายหลังไม่ให้ถือเป็นสินสมรส แต่ให้เป็นสินส่วนตัวของฝ่ายนั้น และสินสมรสที่คู่สมรสได้มาโดยพินัยกรรมหรือโดยการให้เป็นหนังสือตามมาตรา ๑๔๗๔ (๒) ในภายหลัง ให้ตกเป็นสินส่วนตัวของคู่สมรสฝ่ายละครึ่ง\nดอกผลของสินส่วนตัวที่ได้มาหลังจากที่ได้แยกสินสมรสแล้วให้เป็นสินส่วนตัว"],["1492/1","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๙๒/๑ ในกรณีที่มีการแยกสินสมรสโดยคำสั่งศาล การยกเลิกการแยกสินสมรสให้กระทำได้เมื่อคู่สมรสฝ่ายใดฝ่ายหนึ่งร้องขอต่อศาล และศาลได้มีคำสั่งให้ยกเลิก แต่ถ้าคู่สมรสอีกฝ่ายคัดค้าน ศาลจะสั่งยกเลิกการแยกสินสมรสได้ต่อเมื่อเหตุแห่งการแยกสินสมรสได้สิ้นสุดลงแล้ว\nเมื่อมีการยกเลิกการแยกสินสมรสตามวรรคหนึ่ง หรือการแยกสินสมรสสิ้นสุดลงเพราะคู่สมรสฝ่ายใดฝ่ายหนึ่งพ้นจากการเป็นบุคคลล้มละลาย ให้ทรัพย์สินที่เป็นสินส่วนตัวอยู่ในวันที่ศาลมีคำสั่งหรือในวันที่พ้นจากการเป็นบุคคลล้มละลาย ยังคงเป็นสินส่วนตัวต่อไปตามเดิม"],["1493","b5t1","หมวด ๔ ทรัพย์สินระหว่างคู่สมรส","","มาตรา ๑๔๙๓ ในกรณีที่ไม่มีสินสมรสแล้ว คู่สมรสต้องช่วยกันออกค่าใช้สอยสำหรับการบ้านเรือนตามส่วนมากและน้อยแห่งสินส่วนตัวของตน"],["1494","b5t1","หมวด ๕ ความเป็นโมฆะของการสมรส","","มาตรา ๑๔๙๔ การสมรสจะเป็นโมฆะก็แต่เฉพาะที่บัญญัติไว้ในหมวดนี้"],["1495","b5t1","หมวด ๕ ความเป็นโมฆะของการสมรส","","มาตรา ๑๔๙๕ การสมรสที่ฝ่าฝืนมาตรา ๑๔๔๙ มาตรา ๑๔๕๐ มาตรา ๑๔๕๒ และมาตรา ๑๔๕๘ เป็นโมฆะ"],["1496","b5t1","หมวด ๕ ความเป็นโมฆะของการสมรส","","มาตรา ๑๔๙๖ คำพิพากษาของศาลเท่านั้นที่จะแสดงว่า การสมรสที่ฝ่าฝืนมาตรา ๑๔๔๙ มาตรา ๑๔๕๐ และมาตรา ๑๔๕๘ เป็นโมฆะ\nคู่สมรส บิดามารดา หรือผู้สืบสันดานของคู่สมรสอาจร้องขอให้ศาลพิพากษาว่าการสมรสเป็นโมฆะได้ ถ้าไม่มีบุคคลดังกล่าว ผู้มีส่วนได้เสียจะร้องขอให้อัยการเป็นผู้ร้องขอต่อศาลก็ได้"],["1497","b5t1","หมวด ๕ ความเป็นโมฆะของการสมรส","","มาตรา ๑๔๙๗ การสมรสที่เป็นโมฆะ เพราะฝ่าฝืนมาตรา ๑๔๕๒ บุคคลผู้มีส่วนได้เสียคนใดคนหนึ่งจะกล่าวอ้างขึ้น หรือจะร้องขอให้ศาลพิพากษาว่าการสมรสเป็นโมฆะก็ได้"],["1497/1","b5t1","หมวด ๕ ความเป็นโมฆะของการสมรส","","มาตรา ๑๔๙๗/๑ ในกรณีที่ศาลมีคำพิพากษาถึงที่สุดว่าการสมรสใดเป็นโมฆะให้ศาลแจ้งไปยังนายทะเบียนเพื่อบันทึกความเป็นโมฆะไว้ในทะเบียนสมรส"],["1498","b5t1","หมวด ๕ ความเป็นโมฆะของการสมรส","","มาตรา ๑๔๙๘ การสมรสที่เป็นโมฆะ ไม่ก่อให้เกิดความสัมพันธ์ทางทรัพย์สินระหว่างคู่สมรส\nในกรณีที่การสมรสเป็นโมฆะ ทรัพย์สินที่ฝ่ายใดมีหรือได้มาไม่ว่าก่อนหรือหลังการสมรสรวมทั้งดอกผลคงเป็นของฝ่ายนั้น ส่วนบรรดาทรัพย์สินที่ทำมาหาได้ร่วมกันให้แบ่งคนละครึ่ง เว้นแต่ศาลจะเห็นสมควรสั่งเป็นประการอื่น เมื่อได้พิเคราะห์ถึงภาระในครอบครัว ภาระในการหาเลี้ยงชีพ และฐานะของคู่กรณีทั้งสองฝ่าย ตลอดจนพฤติการณ์อื่นทั้งปวงแล้ว"],["1499","b5t1","หมวด ๕ ความเป็นโมฆะของการสมรส","","มาตรา ๑๔๙๙ การสมรสที่เป็นโมฆะเพราะฝ่าฝืนมาตรา ๑๔๔๙ มาตรา ๑๔๕๐ หรือมาตรา ๑๔๕๘ ไม่ทำให้ผู้สมรสโดยสุจริตเสื่อมสิทธิที่ได้มาเพราะการสมรสก่อนมีคำพิพากษาถึงที่สุดให้เป็นโมฆะ\nการสมรสที่เป็นโมฆะเพราะฝ่าฝืนมาตรา ๑๔๕๒ ไม่ทำให้ผู้สมรสโดยสุจริตเสื่อมสิทธิที่ได้มาเพราะการสมรสก่อนที่บุคคลใดบุคคลหนึ่งนั้นรู้ถึงเหตุที่ทำให้การสมรสเป็นโมฆะ แต่การสมรสที่เป็นโมฆะดังกล่าว ไม่ทำให้คู่สมรสเกิดสิทธิรับมรดกในฐานะทายาทโดยธรรมของคู่สมรสอีกฝ่ายหนึ่ง\nการสมรสที่เป็นโมฆะเพราะฝ่าฝืนมาตรา ๑๔๔๙ มาตรา ๑๔๕๐ หรือมาตรา ๑๔๕๘ หรือฝ่าฝืนมาตรา ๑๔๕๒ ถ้าคู่สมรสฝ่ายใดได้สมรสโดยสุจริตฝ่ายนั้นมีสิทธิเรียกค่าทดแทนได้ และถ้าการสมรสที่เป็นโมฆะนั้นทำให้ฝ่ายที่ได้สมรสโดยสุจริตต้องยากจนลงเพราะไม่มีรายได้พอจากทรัพย์สิน หรือจากการงานที่เคยทำอยู่ก่อนมีคำพิพากษาถึงที่สุด หรือก่อนที่จะได้รู้ว่าการสมรสของตนเป็นโมฆะ แล้วแต่กรณี ฝ่ายนั้นมีสิทธิเรียกค่าเลี้ยงชีพได้ด้วย สิทธิเรียกค่าเลี้ยงชีพในกรณีนี้ให้นำมาตรา ๑๕๒๖ วรรคหนึ่ง และมาตรา ๑๕๒๘ มาใช้บังคับโดยอนุโลม\nสิทธิเรียกร้องค่าทดแทน หรือค่าเลี้ยงชีพตามวรรคสาม มีกำหนดอายุความสองปีนับแต่วันที่มีคำพิพากษาถึงที่สุด สำหรับกรณีการสมรสเป็นโมฆะเพราะฝ่าฝืนมาตรา ๑๔๔๙ มาตรา ๑๔๕๐ หรือมาตรา ๑๔๕๘ หรือนับแต่วันที่รู้ถึงเหตุที่ทำให้การสมรสเป็นโมฆะสำหรับกรณีการสมรสเป็นโมฆะเพราะฝ่าฝืนมาตรา ๑๔๕๒"],["1499/1","b5t1","หมวด ๕ ความเป็นโมฆะของการสมรส","","มาตรา ๑๔๙๙/๑ ในกรณีที่การสมรสเป็นโมฆะข้อตกลงระหว่างคู่สมรสว่าฝ่ายใดจะเป็นผู้ใช้อำนาจปกครองบุตรคนใดหรือฝ่ายใดหรือทั้งสองฝ่ายจะเป็นผู้ออกเงินค่าอุปการะเลี้ยงดูบุตรเป็นจำนวนเท่าใด ให้ทำเป็นหนังสือ หากตกลงกันไม่ได้ให้ศาลเป็นผู้ชี้ขาด ในการพิจารณาชี้ขาดถ้าศาลเห็นว่ามีเหตุที่จะถอนอำนาจปกครองของคู่สมรสนั้นได้ตามมาตรา ๑๕๘๒ ศาลจะถอนอำนาจปกครองของคู่สมรส และสั่งให้บุคคลภายนอกเป็นผู้ปกครองก็ได้ ทั้งนี้ ให้ศาลคำนึงถึงความผาสุกและประโยชน์ของบุตรนั้นเป็นสำคัญ และให้นำความในมาตรา ๑๕๒๑ มาใช้บังคับโดยอนุโลม"],["1500","b5t1","หมวด ๕ ความเป็นโมฆะของการสมรส","","มาตรา ๑๕๐๐ การสมรสที่เป็นโมฆะไม่กระทบถึงสิทธิของบุคคลภายนอกผู้กระทำการโดยสุจริตซึ่งได้มาก่อนมีการบันทึกความเป็นโมฆะไว้ในทะเบียนสมรสตามมาตรา ๑๔๙๗/๑"],["1501","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๐๑ การสมรสย่อมสิ้นสุดลงด้วยความตาย การหย่าหรือศาลพิพากษาให้เพิกถอน"],["1502","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๐๒ การสมรสที่เป็นโมฆียะสิ้นสุดลงเมื่อศาลพิพากษาให้เพิกถอน"],["1503","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๐๓ เหตุที่จะขอให้ศาลพิพากษาเพิกถอนการสมรส เพราะเหตุว่าเป็นโมฆียะ มีเฉพาะในกรณีที่คู่สมรสทำการฝ่าฝืนมาตรา ๑๔๔๘ มาตรา ๑๕๐๕ มาตรา ๑๕๐๖ มาตรา ๑๕๐๗ และมาตรา ๑๕๐๙"],["1504","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๐๔ การสมรสที่เป็นโมฆียะเพราะฝ่าฝืนมาตรา ๑๔๔๘ ผู้มีส่วนได้เสียขอให้เพิกถอนการสมรสได้ แต่บิดามารดาหรือผู้ปกครองที่ให้ความยินยอมแล้วจะขอให้เพิกถอนการสมรสไม่ได้\nถ้าศาลมิได้สั่งให้เพิกถอนการสมรสจนบุคคลทั้งสองมีอายุครบตามมาตรา ๑๔๔๘ หรือในกรณีการสมรสระหว่างชายหญิง เมื่อหญิงมีครรภ์ก่อนอายุครบตามมาตรา ๑๔๔๘ ให้ถือว่าการสมรสสมบูรณ์มาตั้งแต่เวลาสมรส"],["1505","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๐๕ การสมรสที่ได้กระทำไปโดยคู่สมรสฝ่ายหนึ่งสำคัญผิดตัวคู่สมรส การสมรสนั้นเป็นโมฆียะ\nสิทธิขอเพิกถอนการสมรสเพราะสำคัญผิดตัวคู่สมรสเป็นอันระงับเมื่อเวลาได้ผ่านพ้นไปแล้วเก้าสิบวันนับแต่วันสมรส"],["1506","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๐๖ ถ้าคู่สมรสได้ทำการสมรสโดยถูกกลฉ้อฉลอันถึงขนาดซึ่งถ้ามิได้มีกลฉ้อฉลนั้นจะไม่ทำการสมรส การสมรสนั้นเป็นโมฆียะ\nความในวรรคหนึ่ง ไม่ใช้บังคับในกรณีที่กลฉ้อฉลนั้นเกิดขึ้นโดยบุคคลที่สามโดยคู่สมรสอีกฝ่ายหนึ่งมิได้รู้เห็นด้วย\nสิทธิขอเพิกถอนการสมรสเพราะถูกกลฉ้อฉลเป็นอันระงับเมื่อเวลาได้ผ่านพ้นไปแล้วเก้าสิบวันนับแต่วันที่รู้หรือควรได้รู้ถึงกลฉ้อฉล หรือเมื่อเวลาได้ผ่านพ้นไปแล้วหนึ่งปี นับแต่วันสมรส"],["1507","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๐๗ ถ้าคู่สมรสได้ทำการสมรสโดยถูกข่มขู่อันถึงขนาดซึ่งถ้ามิได้มีการข่มขู่นั้นจะไม่ทำการสมรส การสมรสนั้นเป็นโมฆียะ\nสิทธิขอเพิกถอนการสมรสเพราะถูกข่มขู่เป็นอันระงับ เมื่อเวลาได้ผ่านพ้นไปแล้วหนึ่งปีนับแต่วันที่พ้นจากการข่มขู่"],["1508","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๐๘ การสมรสที่เป็นโมฆียะเพราะคู่สมรสสำคัญผิดตัวหรือถูกกลฉ้อฉลหรือถูกข่มขู่ เฉพาะแต่คู่สมรสที่สำคัญผิดตัวหรือถูกกลฉ้อฉล หรือถูกข่มขู่เท่านั้นขอเพิกถอนการสมรสได้\nในกรณีที่ผู้มีสิทธิขอเพิกถอนการสมรสเป็นบุคคลที่ถูกศาลสั่งให้เป็นคนไร้ความสามารถ ให้บุคคลซึ่งอาจร้องขอต่อศาลให้สั่งให้บุคคลวิกลจริตเป็นคนไร้ความสามารถตามมาตรา ๒๘ ขอเพิกถอนการสมรสได้ด้วย แต่ถ้าผู้มีสิทธิขอเพิกถอนการสมรสเป็นคนวิกลจริตที่ศาลยังไม่ได้สั่งให้เป็นคนไร้ความสามารถ บุคคลดังกล่าวจะร้องขอเพิกถอนการสมรสก็ได้ แต่ต้องขอให้ศาลสั่งให้คนวิกลจริตเป็นคนไร้ความสามารถพร้อมกันด้วย ในกรณีที่ศาลมีคำสั่งให้ยกคำขอให้ศาลสั่งเป็นคนไร้ความสามารถ ก็ให้ศาลมีคำสั่งยกคำขอเพิกถอนการสมรสของบุคคลดังกล่าวนั้นเสียด้วย\nคำสั่งศาลให้ยกคำขอเพิกถอนการสมรสของบุคคลตามวรรคสองไม่กระทบกระเทือนสิทธิการขอเพิกถอนการสมรสของคู่สมรส แต่คู่สมรสจะต้องใช้สิทธินั้นภายในกำหนดระยะเวลาที่คู่สมรสมีอยู่ ถ้าระยะเวลาดังกล่าวเหลืออยู่ไม่ถึงหกเดือนนับแต่วันที่ศาลมีคำสั่งให้ยกคำขอเพิกถอนการสมรสของบุคคลดังกล่าวหรือไม่มีเหลืออยู่เลย ก็ให้ขยายระยะเวลานั้นออกไปได้ให้ครบหกเดือนหรืออีกหกเดือนนับแต่วันที่ศาลมีคำสั่งให้ยกคำขอเพิกถอนการสมรสของบุคคลดังกล่าว แล้วแต่กรณี"],["1509","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๐๙ การสมรสที่มิได้รับความยินยอมของบุคคลดังกล่าวในมาตรา ๑๔๕๔ การสมรสนั้นเป็นโมฆียะ"],["1510","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๑๐ การสมรสที่เป็นโมฆียะเพราะมิได้รับความยินยอมของบุคคลดังกล่าวในมาตรา ๑๔๕๔ เฉพาะบุคคลที่อาจให้ความยินยอมตามมาตรา ๑๔๕๔ เท่านั้น ขอให้เพิกถอนการสมรสได้\nสิทธิขอเพิกถอนการสมรสตามมาตรานี้เป็นอันระงับเมื่อคู่สมรสนั้นมีอายุครบยี่สิบปีบริบูรณ์หรือในกรณีการสมรสระหว่างชายหญิง เมื่อหญิงมีครรภ์\nการฟ้องขอเพิกถอนการสมรสตามมาตรานี้ให้มีอายุความหนึ่งปีนับแต่วันทราบการสมรส"],["1511","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๑๑ การสมรสที่ได้มีคำพิพากษาให้เพิกถอนนั้น ให้ถือว่าสิ้นสุดลงในวันที่คำพิพากษาถึงที่สุด แต่จะอ้างเป็นเหตุเสื่อมสิทธิของบุคคลภายนอกผู้ทำการโดยสุจริตไม่ได้ เว้นแต่จะได้จดทะเบียนการเพิกถอนการสมรสนั้นแล้ว"],["1512","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๑๒ ให้นำบทบัญญัติว่าด้วยผลของการหย่าโดยคำพิพากษามาใช้บังคับแก่ผลของการเพิกถอนการสมรสโดยอนุโลม"],["1513","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๑๓ ถ้าปรากฏว่าคู่สมรสที่ถูกฟ้องเพิกถอนการสมรสได้รู้เห็นเป็นใจในเหตุแห่งโมฆียะกรรม คู่สมรสนั้นจะต้องรับผิดใช้ค่าทดแทนความเสียหายซึ่งคู่สมรสอีกฝ่ายหนึ่งได้รับต่อกาย ชื่อเสียงหรือทรัพย์สิน เนื่องจากการสมรสนั้น และให้นำมาตรา ๑๕๒๕ มาใช้บังคับโดยอนุโลม\nถ้าหากการเพิกถอนการสมรสตามวรรคหนึ่งทำให้อีกฝ่ายหนึ่งยากจนลง และไม่มีรายได้พอจากทรัพย์สินหรือจากการงานตามที่เคยทำอยู่ระหว่างสมรส คู่สมรสที่ถูกฟ้องนั้นจะต้องรับผิดในค่าเลี้ยงชีพดังที่บัญญัติไว้ในมาตรา ๑๕๒๖ ด้วย"],["1514","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๑๔ การหย่านั้นจะทำได้แต่โดยความยินยอมของทั้งสองฝ่ายหรือโดยคำพิพากษาของศาล\nการหย่าโดยความยินยอมต้องทำเป็นหนังสือและมีพยานลงลายมือชื่ออย่างน้อยสองคน"],["1515","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๑๕ เมื่อได้จดทะเบียนสมรสตามประมวลกฎหมายนี้ การหย่าโดยความยินยอมจะสมบูรณ์ต่อเมื่อคู่สมรสได้จดทะเบียนการหย่านั้นแล้ว"],["1516","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๑๖ เหตุฟ้องหย่ามีดังต่อไปนี้\n(๑) คู่สมรสฝ่ายใดฝ่ายหนึ่งอุปการะเลี้ยงดูหรือยกย่องผู้อื่นฉันคู่สมรส เป็นชู้หรือมีชู้ ร่วมประเวณีกับผู้อื่นเป็นอาจิณ หรือกระทำกับผู้อื่นหรือยอมรับการกระทำของผู้อื่นเพื่อสนองความใคร่ของตนหรือผู้อื่นเป็นอาจิณ อีกฝ่ายหนึ่งฟ้องหย่าได้\n(๒) คู่สมรสฝ่ายใดฝ่ายหนึ่งประพฤติชั่ว ไม่ว่าความประพฤติชั่วนั้นจะเป็นความผิดอาญาหรือไม่ ถ้าเป็นเหตุให้อีกฝ่ายหนึ่ง\n(ก) ได้รับความอับอายขายหน้าอย่างร้ายแรง\n(ข) ได้รับความดูถูกเกลียดชังเพราะเหตุที่คงเป็นคู่สมรสของฝ่ายที่ประพฤติชั่วอยู่ต่อไป หรือ\n(ค) ได้รับความเสียหายหรือเดือดร้อนเกินควร ในเมื่อเอาสภาพ ฐานะและความเป็นอยู่ร่วมกันฉันคู่สมรสมาคำนึงประกอบ\nอีกฝ่ายหนึ่งนั้นฟ้องหย่าได้\n(๓) คู่สมรสฝ่ายใดฝ่ายหนึ่งทำร้าย หรือทรมานร่างกายหรือจิตใจ หรือหมิ่นประมาทหรือเหยียดหยามอีกฝ่ายหนึ่งหรือบุพการีของอีกฝ่ายหนึ่ง ทั้งนี้ ถ้าเป็นการร้ายแรง อีกฝ่ายหนึ่งนั้นฟ้องหย่าได้\n(๔) คู่สมรสฝ่ายใดฝ่ายหนึ่งจงใจละทิ้งร้างอีกฝ่ายหนึ่งไปเกินหนึ่งปี อีกฝ่ายหนึ่งนั้นฟ้องหย่าได้\n(๔/๑) คู่สมรสฝ่ายใดฝ่ายหนึ่งต้องคำพิพากษาถึงที่สุดให้จำคุก และได้ถูกจำคุกเกินหนึ่งปีในความผิดที่อีกฝ่ายหนึ่งมิได้มีส่วนก่อให้เกิดการกระทำความผิดหรือยินยอมหรือรู้เห็นเป็นใจในการกระทำความผิดนั้นด้วย และการเป็นคู่สมรสกันต่อไปจะเป็นเหตุให้อีกฝ่ายหนึ่งได้รับความเสียหายหรือเดือดร้อนเกินควร อีกฝ่ายหนึ่งนั้นฟ้องหย่าได้\n(๔/๒) คู่สมรสสมัครใจแยกกันอยู่เพราะเหตุที่ไม่อาจอยู่ร่วมกันฉันคู่สมรสได้โดยปกติสุขตลอดมาเกินสามปี หรือแยกกันอยู่ตามคำสั่งของศาลเป็นเวลาเกินสามปี ฝ่ายใดฝ่ายหนึ่งฟ้องหย่าได้\n(๕) คู่สมรสฝ่ายใดฝ่ายหนึ่งถูกศาลสั่งให้เป็นคนสาบสูญ หรือไปจากภูมิลำเนาหรือถิ่นที่อยู่เป็นเวลาเกินสามปีโดยไม่มีใครทราบแน่ว่าเป็นตายร้ายดีอย่างไร อีกฝ่ายหนึ่งฟ้องหย่าได้\n(๖) คู่สมรสฝ่ายใดฝ่ายหนึ่งไม่ให้ความช่วยเหลืออุปการะเลี้ยงดูอีกฝ่ายหนึ่งตามสมควร หรือทำการเป็นปฏิปักษ์ต่อการที่เป็นคู่สมรสอย่างร้ายแรง ทั้งนี้ ถ้าการกระทำนั้นถึงขนาดที่อีกฝ่ายหนึ่งเดือดร้อนเกินควรในเมื่อเอาสภาพ ฐานะและความเป็นอยู่ร่วมกันฉันคู่สมรสมาคำนึงประกอบ อีกฝ่ายหนึ่งนั้นฟ้องหย่าได้\n(๗) คู่สมรสฝ่ายใดฝ่ายหนึ่งวิกลจริตตลอดมาเกินสามปี และความวิกลจริตนั้นมีลักษณะยากจะหายได้ กับทั้งความวิกลจริตถึงขนาดที่จะทนอยู่ร่วมกันฉันคู่สมรสต่อไปไม่ได้ อีกฝ่ายหนึ่งฟ้องหย่าได้\n(๘) คู่สมรสฝ่ายใดฝ่ายหนึ่งผิดทัณฑ์บนที่ทำให้ไว้เป็นหนังสือในเรื่องความประพฤติ อีกฝ่ายหนึ่งฟ้องหย่าได้\n(๙) คู่สมรสฝ่ายใดฝ่ายหนึ่งเป็นโรคติดต่ออย่างร้ายแรงอันอาจเป็นภัยแก่อีกฝ่ายหนึ่งและโรคมีลักษณะเรื้อรังไม่มีทางที่จะหายได้ อีกฝ่ายหนึ่งนั้นฟ้องหย่าได้\n(๑๐) คู่สมรสฝ่ายใดฝ่ายหนึ่งมีสภาพแห่งกายทำให้ไม่อาจร่วมประเวณี หรือไม่อาจกระทำการหรือยอมรับการกระทำเพื่อสนองความใคร่ของอีกฝ่ายได้ตลอดกาล อีกฝ่ายหนึ่งฟ้องหย่าได้"],["1517","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๑๗ เหตุฟ้องหย่าตามมาตรา ๑๕๑๖ (๑) และ (๒) ถ้าคู่สมรสฝ่ายใดฝ่ายหนึ่ง แล้วแต่กรณี ได้ยินยอมหรือรู้เห็นเป็นใจในการกระทำที่เป็นเหตุหย่านั้น ฝ่ายที่ยินยอมหรือรู้เห็นเป็นใจนั้นจะยกเป็นเหตุฟ้องหย่าไม่ได้\nเหตุฟ้องหย่าตามมาตรา ๑๕๑๖ (๑๐) ถ้าเกิดเพราะการกระทำของอีกฝ่ายหนึ่ง อีกฝ่ายหนึ่งนั้นจะยกเป็นเหตุฟ้องหย่าไม่ได้\nในกรณีฟ้องหย่าโดยอาศัยเหตุแห่งการผิดทัณฑ์บนตามมาตรา ๑๕๑๖ (๘) นั้น ถ้าศาลเห็นว่าความประพฤติของคู่สมรสอันเป็นเหตุให้ทำทัณฑ์บนเป็นเหตุเล็กน้อยหรือไม่สำคัญเกี่ยวแก่การอยู่ร่วมกันฉันคู่สมรสโดยปกติสุข ศาลจะไม่พิพากษาให้หย่าก็ได้"],["1518","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๑๘ สิทธิฟ้องหย่าย่อมหมดไปในเมื่อฝ่ายที่มีสิทธิฟ้องหย่าได้กระทำการอันแสดงให้เห็นว่าได้ให้อภัยในการกระทำของอีกฝ่ายหนึ่งซึ่งเป็นเหตุให้เกิดสิทธิฟ้องหย่านั้นแล้ว"],["1519","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๑๙ ในกรณีที่คู่สมรสฝ่ายใดฝ่ายหนึ่งเป็นคนวิกลจริตและมีเหตุหย่าเกิดขึ้นไม่ว่าเหตุนั้นจะได้เกิดขึ้นก่อนหรือภายหลังการเป็นคนวิกลจริต ให้บุคคลซึ่งอาจร้องขอต่อศาลให้สั่งให้บุคคลวิกลจริตเป็นคนไร้ความสามารถตามมาตรา ๒๘ มีอำนาจฟ้องคู่สมรสอีกฝ่ายหนึ่งขอให้ศาลพิพากษาให้หย่าขาดจากกันและแบ่งทรัพย์สินได้ ในกรณีเช่นว่านี้ ถ้ายังมิได้มีคำสั่งของศาลแสดงว่าคู่สมรสซึ่งวิกลจริตเป็นคนไร้ความสามารถ ก็ให้บุคคลดังกล่าวร้องขอต่อศาลในคดีเดียวกันนั้นให้ศาลมีคำสั่งว่าคู่สมรสซึ่งวิกลจริตนั้นเป็นคนไร้ความสามารถ\nเมื่อบุคคลดังกล่าวเห็นสมควร จะร้องขอต่อศาลให้มีคำสั่งตามมาตรา ๑๕๒๖ หรือมาตรา ๑๕๓๐ ด้วยก็ได้\nในกรณีที่คู่สมรสซึ่งถูกอ้างว่าเป็นคนวิกลจริตยังไม่ได้ถูกสั่งให้เป็นคนไร้ความสามารถ หากศาลเห็นว่าคู่สมรสนั้นยังไม่เป็นคนที่ควรสั่งให้เป็นคนไร้ความสามารถก็ให้ยกฟ้องคดีนั้นเสีย ถ้าเห็นว่าเป็นบุคคลที่ควรสั่งให้เป็นคนไร้ความสามารถ แต่ยังไม่สมควรจะให้มีการหย่า ก็ให้ศาลสั่งให้คู่สมรสนั้นเป็นคนไร้ความสามารถโดยจะไม่สั่งเรื่องผู้อนุบาลหรือจะตั้งผู้อื่นเป็นผู้อนุบาลตามมาตรา ๑๔๖๓ ก็ได้ คงพิพากษายกแต่เฉพาะข้อหย่า ในกรณีเช่นนี้ศาลจะสั่งกำหนดค่าเลี้ยงชีพด้วยก็ได้ ในกรณีที่ศาลเห็นว่าคู่สมรสนั้นวิกลจริตอันควรสั่งให้เป็นคนไร้ความสามารถและทั้งมีเหตุควรให้หย่าด้วย ก็ให้ศาลสั่งในคำพิพากษาให้คู่สมรสนั้นเป็นคนไร้ความสามารถตั้งผู้อนุบาลและให้หย่า\nในกรณีนี้ ถ้าศาลเห็นว่าเหตุหย่าที่ยกขึ้นอ้างในการฟ้องร้องนั้นไม่เหมาะสมแก่สภาพของคู่สมรสซึ่งเป็นคนไร้ความสามารถที่จะหย่าจากคู่สมรสอีกฝ่ายหนึ่งก็ดี ตามพฤติการณ์ไม่สมควรที่จะให้มีการหย่าขาดจากกันก็ดี ศาลจะพิพากษาไม่ให้หย่าก็ได้"],["1520","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๒๐ ในกรณีหย่าโดยความยินยอม ให้คู่สมรสทำความตกลงเป็นหนังสือว่าฝ่ายใดจะเป็นผู้ใช้อำนาจปกครองบุตรคนใด ถ้ามิได้ตกลงกันหรือตกลงกันไม่ได้ ให้ศาลเป็นผู้ชี้ขาด\nในกรณีหย่าโดยคำพิพากษาของศาล ให้ศาลซึ่งพิจารณาคดีฟ้องหย่านั้นชี้ขาดด้วยว่าฝ่ายใดจะเป็นผู้ใช้อำนาจปกครองบุตรคนใด ในการพิจารณาชี้ขาดถ้าศาลเห็นว่ามีเหตุที่จะถอนอำนาจปกครองของคู่สมรสนั้นได้ตามมาตรา ๑๕๘๒ ศาลจะถอนอำนาจปกครองของคู่สมรสและสั่งให้บุคคลภายนอกเป็นผู้ปกครองก็ได้ ทั้งนี้ ให้ศาลคำนึงถึงความผาสุกและประโยชน์ของบุตรนั้นเป็นสำคัญ"],["1521","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๒๑ ถ้าปรากฏว่าผู้ใช้อำนาจปกครองหรือผู้ปกครองตามมาตรา ๑๕๒๐ ประพฤติตนไม่สมควร หรือภายหลังพฤติการณ์ได้เปลี่ยนแปลงไป ศาลมีอำนาจสั่งเปลี่ยนตัวผู้ใช้อำนาจปกครองหรือผู้ปกครองโดยคำนึงถึงความผาสุกและประโยชน์ของบุตรเป็นสำคัญ"],["1522","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๒๒ ถ้าคู่สมรสหย่าโดยความยินยอม ให้ทำความตกลงกันไว้ในสัญญาหย่าว่าคู่สมรสทั้งสองฝ่าย หรือคู่สมรสฝ่ายใดฝ่ายหนึ่งจะออกเงินค่าอุปการะเลี้ยงดูบุตรเป็นจำนวนเงินเท่าใด\nถ้าหย่าโดยคำพิพากษาของศาลหรือในกรณีที่สัญญาหย่ามิได้กำหนดเรื่องค่าอุปการะเลี้ยงดูบุตรไว้ ให้ศาลเป็นผู้กำหนด"],["1523","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๒๓ เมื่อศาลพิพากษาให้หย่ากันเพราะเหตุตามมาตรา ๑๕๑๖ (๑) คู่สมรสฝ่ายใดฝ่ายหนึ่งมีสิทธิได้รับค่าทดแทนจากคู่สมรสอีกฝ่ายหนึ่งและจากผู้ซึ่งได้รับการอุปการะเลี้ยงดูหรือยกย่อง หรือผู้ซึ่งเป็นเหตุแห่งการหย่านั้น\nคู่สมรสฝ่ายใดฝ่ายหนึ่งจะเรียกค่าทดแทนจากผู้ซึ่งล่วงเกินคู่สมรสอีกฝ่ายหนึ่งไปในทำนองชู้ หรือจากผู้ซึ่งแสดงตนโดยเปิดเผยเพื่อแสดงว่าตนมีความสัมพันธ์กับคู่สมรสอีกฝ่ายหนึ่งในทำนองชู้ก็ได้\nถ้าคู่สมรสฝ่ายใดฝ่ายหนึ่งยินยอมหรือรู้เห็นเป็นใจให้อีกฝ่ายหนึ่งกระทำการตามมาตรา ๑๕๑๖ (๑) หรือให้ผู้อื่นกระทำการตามวรรคสอง คู่สมรสฝ่ายใดฝ่ายหนึ่งนั้นจะเรียกค่าทดแทนไม่ได้"],["1524","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๒๔ ถ้าเหตุแห่งการหย่าตามมาตรา ๑๕๑๖ (๓) (๔) หรือ (๖) เกิดขึ้นเพราะฝ่ายผู้ต้องรับผิดชอบก่อให้เกิดขึ้นโดยมุ่งประสงค์ให้อีกฝ่ายหนึ่งไม่อาจทนได้ จึงต้องฟ้องหย่า อีกฝ่ายหนึ่งมีสิทธิได้รับค่าทดแทนจากฝ่ายที่ต้องรับผิด"],["1525","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๒๕ ค่าทดแทนตามมาตรา ๑๕๒๓ และมาตรา ๑๕๒๔ นั้น ให้ศาลวินิจฉัยตามควรแก่พฤติการณ์ โดยศาลจะสั่งให้ชำระครั้งเดียวหรือแบ่งชำระเป็นงวด ๆ มีกำหนดเวลาตามที่ศาลจะเห็นสมควรก็ได้\nในกรณีที่ผู้จะต้องชำระค่าทดแทนเป็นคู่สมรสของอีกฝ่ายหนึ่ง ให้ศาลคำนึงถึงจำนวนทรัพย์สินที่คู่สมรสนั้นได้รับไปจากการแบ่งสินสมรสเพราะการหย่านั้นด้วย"],["1526","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๒๖ ในคดีหย่า ถ้าเหตุแห่งการหย่าเป็นความผิดของคู่สมรสฝ่ายใดฝ่ายหนึ่งแต่ฝ่ายเดียว และการหย่านั้นจะทำให้อีกฝ่ายหนึ่งยากจนลง เพราะไม่มีรายได้พอจากทรัพย์สินหรือจากการงานตามที่เคยทำอยู่ระหว่างสมรส อีกฝ่ายหนึ่งนั้นจะขอให้ฝ่ายที่ต้องรับผิดจ่ายค่าเลี้ยงชีพให้ได้ ค่าเลี้ยงชีพนี้ศาลอาจให้เพียงใดหรือไม่ให้ก็ได้ โดยคำนึงถึงความสามารถของผู้ให้และฐานะของผู้รับและให้นำบทบัญญัติมาตรา ๑๕๙๘/๓๙ มาตรา ๑๕๙๘/๔๐ และมาตรา ๑๕๙๘/๔๑ มาใช้บังคับโดยอนุโลม\nสิทธิเรียกร้องค่าเลี้ยงชีพเป็นอันสิ้นสุด ถ้ามิได้ฟ้องหรือฟ้องแย้งในคดีหย่านั้น"],["1527","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๒๗ ถ้าหย่าขาดจากกันเพราะเหตุวิกลจริตตามมาตรา ๑๕๑๖ (๗) หรือเพราะเหตุเป็นโรคติดต่ออย่างร้ายแรงตามมาตรา ๑๕๑๖ (๙) คู่สมรสอีกฝ่ายหนึ่งต้องออกค่าเลี้ยงชีพให้แก่ฝ่ายที่วิกลจริตหรือฝ่ายที่เป็นโรคติดต่อนั้นโดยคำนวณค่าเลี้ยงชีพอนุโลมตามมาตรา ๑๕๒๖"],["1528","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๒๘ ถ้าฝ่ายที่รับค่าเลี้ยงชีพสมรสใหม่ สิทธิรับค่าเลี้ยงชีพย่อมหมดไป"],["1529","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๒๙ สิทธิฟ้องร้องโดยอาศัยเหตุในมาตรา ๑๕๑๖ (๑) (๒) (๓) หรือ (๖) หรือมาตรา ๑๕๒๓ ย่อมระงับไปเมื่อพ้นกำหนดหนึ่งปีนับแต่วันผู้กล่าวอ้างรู้หรือควรรู้ความจริงซึ่งตนอาจยกขึ้นกล่าวอ้าง\nเหตุอันจะยกขึ้นฟ้องหย่าไม่ได้แล้วนั้น อาจนำสืบสนับสนุนคดีฟ้องหย่าซึ่งอาศัยเหตุอย่างอื่น"],["1530","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๓๐ ขณะคดีฟ้องหย่าอยู่ในระหว่างพิจารณา ถ้าฝ่ายใดร้องขอศาลอาจสั่งชั่วคราวให้จัดการตามที่เห็นสมควร เช่น ในเรื่องสินสมรส ที่พักอาศัย การอุปการะเลี้ยงดูคู่สมรสและการพิทักษ์อุปการะเลี้ยงดูบุตร"],["1531","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๓๑ การสมรสที่จดทะเบียนตามกฎหมายนั้น การหย่าโดยความยินยอมของคู่สมรสทั้งสองฝ่ายมีผลนับแต่เวลาจดทะเบียนการหย่าเป็นต้นไป\nการหย่าโดยคำพิพากษามีผลแต่เวลาที่คำพิพากษาถึงที่สุด แต่จะอ้างเป็นเหตุเสื่อมสิทธิของบุคคลภายนอกผู้ทำการโดยสุจริตไม่ได้ เว้นแต่จะได้จดทะเบียนการหย่านั้นแล้ว"],["1532","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๓๒ เมื่อหย่ากันแล้วให้จัดการแบ่งทรัพย์สินของคู่สมรส\nแต่ในระหว่างคู่สมรส\n(ก) ถ้าเป็นการหย่าโดยความยินยอมของทั้งสองฝ่าย ให้จัดการแบ่งทรัพย์สินของคู่สมรสตามที่มีอยู่ในเวลาจดทะเบียนการหย่า\n(ข) ถ้าเป็นการหย่าโดยคำพิพากษาของศาล คำพิพากษาส่วนที่บังคับทรัพย์สินระหว่างคู่สมรสนั้น มีผลย้อนหลังไปถึงวันฟ้องหย่า"],["1533","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๓๓ เมื่อหย่ากันให้แบ่งสินสมรสให้คู่สมรสแต่ละฝ่ายได้ส่วนเท่ากัน"],["1534","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๓๔ สินสมรสที่คู่สมรสฝ่ายใดฝ่ายหนึ่งจำหน่ายไปเพื่อประโยชน์ตนฝ่ายเดียวก็ดี จำหน่ายไปโดยเจตนาทำให้คู่สมรสอีกฝ่ายหนึ่งเสียหายก็ดี จำหน่ายไปโดยมิได้รับความยินยอมของคู่สมรสอีกฝ่ายหนึ่งในกรณีที่กฎหมายบังคับว่าการจำหน่ายนั้นจะต้องได้รับความยินยอมของอีกฝ่ายหนึ่งด้วยก็ดี จงใจทำลายให้สูญหายไปก็ดี ให้ถือเสมือนว่าทรัพย์สินนั้นยังคงมีอยู่เพื่อจัดแบ่งสินสมรสตามมาตรา ๑๕๓๓ และถ้าคู่สมรสอีกฝ่ายหนึ่งได้รับส่วนแบ่งสินสมรสไม่ครบตามจำนวนที่ควรจะได้ ให้คู่สมรสฝ่ายที่ได้จำหน่ายหรือจงใจทำลายสินสมรสนั้นชดใช้จากสินสมรสส่วนของตนหรือสินส่วนตัว"],["1535","b5t1","หมวด ๖ การสิ้นสุดแห่งการสมรส","","มาตรา ๑๕๓๕ เมื่อการสมรสสิ้นสุดลง ให้แบ่งความรับผิดในหนี้ที่จะต้องรับผิดด้วยกันตามส่วนเท่ากัน"],["1536","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๓๖ เด็กเกิดแต่หญิงขณะเป็นคู่สมรสกับชายหรือภายในสามร้อยสิบวันนับแต่วันที่การสมรสสิ้นสุดลง ให้สันนิษฐานไว้ก่อนว่าเป็นบุตรชอบด้วยกฎหมายของชายผู้เป็นคู่สมรส หรือเคยเป็นคู่สมรส แล้วแต่กรณี\nให้นำความในวรรคหนึ่งมาใช้บังคับแก่บุตรที่เกิดจากหญิงก่อนที่ได้มีคำพิพากษาถึงที่สุดของศาลแสดงว่าการสมรสเป็นโมฆะ หรือภายในระยะเวลาสามร้อยสิบวันนับแต่วันนั้น"],["1537","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๓๗ ในกรณีที่หญิงทำการสมรสใหม่นั้นเป็นการฝ่าฝืนมาตรา ๑๔๕๓ และคลอดบุตรภายในสามร้อยสิบวันนับแต่วันที่การสมรสสิ้นสุดลง ให้สันนิษฐานไว้ก่อนว่าเด็กที่เกิดแต่หญิงนั้นเป็นบุตรชอบด้วยกฎหมายของชายผู้เป็นคู่สมรสคนใหม่ และห้ามมิให้นำข้อสันนิษฐานในมาตรา ๑๕๓๖ ที่ว่าเด็กเป็นบุตรชอบด้วยกฎหมายของชายผู้เป็นคู่สมรสเดิมมาใช้บังคับ ทั้งนี้ เว้นแต่มีคำพิพากษาของศาลแสดงว่าเด็กมิใช่บุตรชอบด้วยกฎหมายของชายผู้เป็นคู่สมรสคนใหม่นั้น"],["1538","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๓๘ ในกรณีที่บุคคลสมรสฝ่าฝืนมาตรา ๑๔๕๒ เด็กที่เกิดในระหว่างการสมรสที่ฝ่าฝืนนั้น ให้สันนิษฐานไว้ก่อนว่าเป็นบุตรชอบด้วยกฎหมายของชายผู้เป็นคู่สมรสซึ่งได้จดทะเบียนสมรสครั้งหลัง\nในกรณีที่หญิงสมรสฝ่าฝืนมาตรา ๑๔๕๒ ถ้ามีคำพิพากษาถึงที่สุดแสดงว่าเด็กมิใช่บุตรชอบด้วยกฎหมายของชายผู้เป็นคู่สมรสซึ่งได้จดทะเบียนสมรสครั้งหลัง ให้นำข้อสันนิษฐานในมาตรา ๑๕๓๖ มาใช้บังคับ\nให้นำความในวรรคหนึ่งมาใช้บังคับแก่เด็กที่เกิดภายในสามร้อยสิบวันนับแต่วันที่ศาลมีคำพิพากษาถึงที่สุดให้การสมรสเป็นโมฆะเพราะฝ่าฝืนมาตรา ๑๔๕๒ ด้วย"],["1539","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๓๙ ในกรณีที่สันนิษฐานว่าเด็กเป็นบุตรชอบด้วยกฎหมายของชายผู้เป็นหรือเคยเป็นคู่สมรสตามมาตรา ๑๕๓๖ มาตรา ๑๕๓๗ หรือมาตรา ๑๕๓๘ ชายผู้เป็นหรือเคยเป็นคู่สมรสจะไม่รับเด็กเป็นบุตรของตนก็ได้ โดยฟ้องเด็กกับมารดาเด็กร่วมกันเป็นจำเลยและพิสูจน์ได้ว่าตนไม่ได้อยู่ร่วมกับมารดาเด็กในระยะเวลาตั้งครรภ์คือระหว่างหนึ่งร้อยแปดสิบวันถึงสามร้อยสิบวันก่อนเด็กเกิด หรือตนไม่สามารถเป็นบิดาของเด็กได้เพราะเหตุอย่างอื่น\nแต่ถ้าในขณะยื่นฟ้องมารดาเด็กไม่มีชีวิตอยู่ จะฟ้องเด็กแต่ผู้เดียวเป็นจำเลยก็ได้ ถ้าเด็กไม่มีชีวิตอยู่ไม่ว่ามารดาของเด็กจะมีชีวิตอยู่หรือไม่ จะยื่นคำร้องขอให้ศาลแสดงว่าเด็กนั้นไม่เป็นบุตรก็ได้ ในกรณีที่มารดาของเด็กหรือทายาทของเด็กยังมีชีวิตอยู่ ให้ศาลส่งสำเนาคำร้องนี้ไปให้ด้วย และถ้าศาลเห็นสมควร จะส่งสำเนาคำร้องไปให้อัยการพิจารณาเพื่อดำเนินคดีแทนเด็กด้วยก็ได้"],["1540","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๔๐ (ยกเลิก)"],["1541","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๔๑ ชายผู้เป็นหรือเคยเป็นคู่สมรสจะฟ้องคดีไม่รับเด็กเป็นบุตรตามมาตรา ๑๕๓๙ ไม่ได้ ถ้าปรากฏว่าตนเป็นผู้แจ้งการเกิดของเด็กในทะเบียนคนเกิดเองว่าเป็นบุตรของตน หรือจัดหรือยอมให้มีการแจ้งดังกล่าว"],["1542","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๔๒ การฟ้องคดีไม่รับเด็กเป็นบุตร ชายผู้เป็นหรือเคยเป็นคู่สมรสต้องฟ้องภายในหนึ่งปีนับแต่วันรู้ถึงการเกิดของเด็ก แต่ห้ามมิให้ฟ้องเมื่อพ้นสิบปีนับแต่วันเกิดของเด็ก\nในกรณีที่มีคำพิพากษาของศาลแสดงว่าเด็กมิใช่บุตรชอบด้วยกฎหมายของชายผู้เป็นคู่สมรสคนใหม่ตามมาตรา ๑๕๓๗ หรือชายผู้เป็นคู่สมรสในการสมรสครั้งหลังตามมาตรา ๑๕๓๘ ถ้าชายผู้เป็นหรือเคยเป็นคู่สมรสซึ่งต้องด้วยบทสันนิษฐานว่าเด็กเป็นบุตรชอบด้วยกฎหมายของตนตามมาตรา ๑๕๓๖ ประสงค์จะฟ้องคดีไม่รับเด็กเป็นบุตร ให้ฟ้องคดีภายในหนึ่งปีนับแต่วันที่รู้ว่ามีคำพิพากษาถึงที่สุด"],["1543","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๔๓ ในกรณีที่ชายผู้เป็นหรือเคยเป็นคู่สมรสได้ฟ้องคดีไม่รับเด็กเป็นบุตรแล้ว และตายก่อนคดีนั้นถึงที่สุด ผู้มีสิทธิได้รับมรดกร่วมกับเด็กหรือผู้จะเสียสิทธิรับมรดกเพราะการเกิดของเด็กนั้น จะขอเข้าเป็นคู่ความแทนที่หรืออาจถูกเรียกให้เข้ามาเป็นคู่ความแทนที่ชายผู้เป็นหรือเคยเป็นคู่สมรสก็ได้"],["1544","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๔๔ การฟ้องคดีไม่รับเด็กเป็นบุตร ผู้มีสิทธิได้รับมรดกร่วมกับเด็กหรือผู้จะเสียสิทธิรับมรดกเพราะการเกิดของเด็กอาจฟ้องได้ ในกรณีดังต่อไปนี้\n(๑) ชายผู้เป็นหรือเคยเป็นคู่สมรสตายก่อนพ้นระยะเวลาที่ชายผู้เป็นหรือเคยเป็นคู่สมรสจะพึงฟ้องได้\n(๒) เด็กเกิดภายหลังการตายของชายผู้เป็นหรือเคยเป็นคู่สมรส\nการฟ้องคดีไม่รับเด็กเป็นบุตรในกรณี (๑) ต้องฟ้องภายในหกเดือนนับแต่วันที่รู้ถึงการตายของชายผู้เป็นหรือเคยเป็นคู่สมรส การฟ้องคดีไม่รับเด็กเป็นบุตรในกรณี (๒) ต้องฟ้องภายในหกเดือนนับแต่วันที่รู้ถึงการเกิดของเด็ก แต่ไม่ว่าเป็นกรณีใด ห้ามมิให้ฟ้องเมื่อพ้นสิบปีนับแต่วันเกิดของเด็ก\nให้นำมาตรา ๑๕๓๙ มาใช้บังคับแก่การฟ้องคดีไม่รับเด็กเป็นบุตรตามวรรคหนึ่งโดยอนุโลม"],["1545","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๔๕ เมื่อปรากฏข้อเท็จจริงต่อเด็กว่าตนมิได้เป็นบุตรสืบสายโลหิตของชายผู้เป็นคู่สมรสของมารดาตน เด็กจะร้องขอต่ออัยการให้ฟ้องคดีปฏิเสธความเป็นบุตรชอบด้วยกฎหมายของชายนั้นก็ได้\nการฟ้องคดีตามวรรคหนึ่ง ถ้าเด็กได้รู้ข้อเท็จจริงก่อนบรรลุนิติภาวะว่าตนมิได้เป็นบุตรของชายผู้เป็นคู่สมรสของมารดา ห้ามอัยการฟ้องคดีเมื่อพ้นหนึ่งปีนับแต่วันที่เด็กบรรลุนิติภาวะ แต่ถ้าเด็กรู้ข้อเท็จจริงดังกล่าวหลังจากบรรลุนิติภาวะแล้ว ห้ามอัยการฟ้องคดีเมื่อพ้นหนึ่งปีนับแต่วันที่เด็กรู้เหตุนั้น\nไม่ว่ากรณีใด ๆ ห้ามมิให้ฟ้องคดีปฏิเสธความเป็นบุตรเมื่อพ้นสิบปีนับแต่วันที่เด็กบรรลุนิติภาวะ"],["1546","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๔๖ เด็กเกิดจากหญิงที่มิได้มีการสมรสกับชาย ให้ถือว่าเป็นบุตรชอบด้วยกฎหมายของหญิงนั้น เว้นแต่จะมีกฎหมายบัญญัติไว้เป็นอย่างอื่น"],["1547","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๔๗ เด็กเกิดจากบิดามารดาที่มิได้สมรสกัน จะเป็นบุตรชอบด้วยกฎหมายต่อเมื่อบิดามารดาได้สมรสกันในภายหลังหรือบิดาได้จดทะเบียนว่าเป็นบุตรหรือศาลพิพากษาว่าเป็นบุตร"],["1548","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๔๘ บิดาจะจดทะเบียนเด็กเป็นบุตรชอบด้วยกฎหมายได้ต่อเมื่อได้รับความยินยอมของเด็กและมารดาเด็ก\nในกรณีที่เด็กและมารดาเด็กไม่ได้มาให้ความยินยอมต่อหน้านายทะเบียนให้นายทะเบียนแจ้งการขอจดทะเบียนของบิดาไปยังเด็กและมารดาเด็ก ถ้าเด็กหรือมารดาเด็กไม่คัดค้านหรือไม่ให้ความยินยอมภายในหกสิบวันนับแต่การแจ้งนั้นถึงเด็กหรือมารดาเด็ก ให้สันนิษฐานว่าเด็กหรือมารดาเด็กไม่ให้ความยินยอม ถ้าเด็กหรือมารดาเด็กอยู่นอกประเทศไทยให้ขยายเวลานั้นเป็นหนึ่งร้อยแปดสิบวัน\nในกรณีที่เด็กหรือมารดาเด็กคัดค้านว่าผู้ขอจดทะเบียนไม่ใช่บิดา หรือไม่ให้ความยินยอม หรือไม่อาจให้ความยินยอมได้ การจดทะเบียนเด็กเป็นบุตรต้องมีคำพิพากษาของศาล\nเมื่อศาลได้พิพากษาให้บิดาจดทะเบียนเด็กเป็นบุตรได้ และบิดาได้นำคำพิพากษาไปขอจดทะเบียนต่อนายทะเบียนให้นายทะเบียนดำเนินการจดทะเบียนให้"],["1549","b5t2","หมวด ๑ บิดามารดา","","มาตรา ๑๕๔๙ เมื่อนายทะเบียนได้แจ้งการขอจดทะเบียนขอรับเด็กเป็นบุตรชอบด้วยกฎหมายไปยังเด็กและมารดาเด็กตามมาตรา ๑๕๔๘ แล้ว ไม่ว่าเด็กหรือมารดาเด็กจะคัดค้านการจดทะเบียนรับเด็กเป็นบุตรตามมาตรา ๑๕๔๘ หรือไม่ ภายในกำหนดเวลาไม่เกินเก้าสิบวันนับแต่วันแจ้งการขอจดทะเบียนถึงเด็กหรือมารดาเด็ก เด็กหรือมารดาเด็กอาจแจ้งให้นายทะเบียนจดบันทึกไว้ได้ว่าผู้ขอจดทะเบียนไม่สมควร เป็นผู้ใช้อำนาจปกครองบางส่วนหรือทั้งหมด\nเมื่อได้มีคำแจ้งของเด็กหรือมารดาเด็กดังกล่าวในวรรคหนึ่งแล้ว แม้จะได้มีการจดทะเบียนรับเด็กเป็นบุตรตามมาตรา ๑๕๔๘ บิดาของเด็กก็ยังใช้อำนาจปกครองบางส่วนหรือทั้งหมดตามที่เด็กหรือมารดาเด็กแจ้งว่าบิดาไม่สมควรเป็นผู้ใช้อำนาจปกครองนั้นไม่ได้ จนกว่าศาลจะพิพากษาให้บิดาของเด็กใช้อำนาจปกครองบางส่วนหรือทั้งหมด
