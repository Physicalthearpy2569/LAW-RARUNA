ผิดเท่าถึงจำนวนเพียงนั้น"],["1086","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๘๖ ข้อซึ่งตกลงกันในระหว่างผู้เป็นหุ้นส่วนทั้งหลายเพื่อจะเปลี่ยนแปลงประเภททรัพย์สินที่ลงหุ้น หรือเพื่อจะลดจำนวนลงหุ้นแห่งผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดคนหนึ่งคนใดนั้น ท่านว่ายังไม่เป็นผลแก่บุคคลภายนอกจนกว่าจะได้จดทะเบียน\nเมื่อได้จดทะเบียนแล้วไซร้ ข้อตกลงนั้น ๆ ก็ย่อมมีผลแต่เพียงเฉพาะแก่หนี้อันห้างหุ้นส่วนได้ก่อให้เกิดขึ้นภายหลังเวลาที่ได้จดทะเบียนแล้วเท่านั้น"],["1087","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๘๗ อันห้างหุ้นส่วนจำกัดนั้น ท่านว่าต้องให้แต่เฉพาะผู้เป็นหุ้นส่วนจำพวกไม่จำกัดความรับผิดเท่านั้นเป็นผู้จัดการ"],["1088","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๘๘ ถ้าผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดผู้ใดสอดเข้าไปเกี่ยวข้องจัดการงานของห้างหุ้นส่วน ท่านว่าผู้นั้นจะต้องรับผิดร่วมกันในบรรดาหนี้ทั้งหลายของห้างหุ้นส่วนนั้นโดยไม่จำกัดจำนวน\nแต่การออกความเห็นและแนะนำก็ดี ออกเสียงเป็นคะแนนนับในการตั้งและถอดถอนผู้จัดการตามกรณีที่มีบังคับไว้ในสัญญาหุ้นส่วนนั้นก็ดี ท่านหานับว่าเป็นการสอดเข้าไปเกี่ยวข้องจัดการงานของห้างหุ้นส่วนนั้นไม่"],["1089","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๘๙ ผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดนั้น จะตั้งให้เป็นผู้ชำระบัญชีของห้างหุ้นส่วนก็ได้"],["1090","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๙๐ ผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดจะประกอบการค้าขายอย่างใด ๆ เพื่อประโยชน์ตนหรือเพื่อประโยชน์บุคคลภายนอกก็ได้ แม้ว่าการงานเช่นนั้นจะมีสภาพเป็นอย่างเดียวกันกับการค้าขายของห้างหุ้นส่วนก็ไม่ห้าม"],["1091","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๙๑ ผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดจะโอนหุ้นของตนปราศจากความยินยอมของผู้เป็นหุ้นส่วนอื่น ๆ ก็โอนได้"],["1092","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๙๒ การที่ผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดตายก็ดี ล้มละลายหรือตกเป็นคนไร้ความสามารถก็ดี หาเป็นเหตุให้ห้างหุ้นส่วนจำกัดต้องเลิกกันไม่ เว้นแต่จะได้มีข้อสัญญากันไว้เป็นอย่างอื่น"],["1093","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๙๓ ถ้าผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดผู้ใดตาย ท่านว่าทายาทของผู้นั้นย่อมเข้าเป็นหุ้นส่วนแทนที่ผู้ตาย เว้นแต่จะได้มีข้อสัญญากันไว้เป็นอย่างอื่น"],["1094","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๙๔ ถ้าผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดผู้ใดล้มละลาย ท่านว่าต้องเอาหุ้นของผู้นั้นในห้างหุ้นส่วนออกขายเป็นสินทรัพย์ในกองล้มละลาย"],["1095","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๙๕ ตราบใดห้างหุ้นส่วนจำกัดยังมิได้เลิกกัน ตราบนั้นเจ้าหนี้ของห้างย่อมไม่มีสิทธิจะฟ้องร้องผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดได้\nแต่เมื่อห้างหุ้นส่วนนั้นได้เลิกกันแล้ว เจ้าหนี้ของห้างมีสิทธิฟ้องร้องผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดได้เพียงจำนวนดังนี้ คือ\n(๑) จำนวนลงหุ้นของผู้เป็นหุ้นส่วนเท่าที่ยังค้างส่งแก่ห้างหุ้นส่วน\n(๒) จำนวนลงหุ้นเท่าที่ผู้เป็นหุ้นส่วนได้ถอนไปจากสินทรัพย์ของห้างหุ้นส่วน\n(๓) จำนวนเงินปันผลและดอกเบี้ยซึ่งผู้เป็นหุ้นส่วนได้รับไปแล้วโดยทุจริตและฝ่าฝืนต่อบทมาตรา ๑๐๘๔"],["1096","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๐๙๖ อันว่าบริษัทจำกัดนั้น คือบริษัทประเภทซึ่งตั้งขึ้นด้วยแบ่งทุนเป็นหุ้นมีมูลค่าเท่า ๆ กัน โดยผู้ถือหุ้นต่างรับผิดจำกัดเพียงไม่เกินจำนวนเงินที่ตนยังส่งใช้ไม่ครบมูลค่าของหุ้นที่ตนถือ"],["1096 ทวิ","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๐๙๖ ทวิ (ยกเลิก)"],["1097","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๐๙๗ บุคคลใด ๆ ตั้งแต่สองคนขึ้นไปจะเริ่มก่อการและตั้งเป็นบริษัทจำกัดก็ได้ โดยเข้าชื่อกันทำหนังสือบริคณห์สนธิ และกระทำการอย่างอื่นตามบทบัญญัติแห่งประมวลกฎหมายนี้"],["1098","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๐๙๘ หนังสือบริคณห์สนธินั้น ต้องมีรายการดังต่อไปนี้ คือ\n(๑) ชื่อบริษัทอันคิดจะตั้งขึ้น ซึ่งต้องมีคำว่า “จำกัด” ไว้ปลายชื่อนั้นด้วยเสมอไป\n(๒) ที่สำนักงานของบริษัทซึ่งบอกทะเบียนนั้นจะตั้งอยู่ ณ ที่ใดในพระราชอาณาเขต\n(๓) วัตถุที่ประสงค์ทั้งหลายของบริษัท\n(๔) ถ้อยคำสำแดงว่า ความรับผิดของผู้ถือหุ้นจะมีจำกัด\n(๕) จำนวนทุนเรือนหุ้นซึ่งบริษัทคิดกำหนดจะจดทะเบียนแบ่งออกเป็นหุ้นมีมูลค่ากำหนดหุ้นละเท่าไร\n(๖) ชื่อ สำนัก อาชีวะ และลายมือชื่อของบรรดาผู้เริ่มก่อการ ทั้งจำนวนหุ้นซึ่งต่างคนต่างเข้าชื่อซื้อไว้คนละเท่าใด"],["1099","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๐๙๙ หนังสือบริคณห์สนธินั้น ให้ทำเป็นต้นฉบับไว้ไม่น้อยกว่าสองฉบับ และให้ลงลายมือชื่อของบรรดาผู้เริ่มก่อการ โดยมีพยานลงชื่อรับรองด้วยสองคน และให้นำฉบับหนึ่งไปจดทะเบียน\nถ้าการจดทะเบียนบริษัทมิได้ทำภายในสามปีนับแต่วันที่นายทะเบียนรับจดทะเบียนหนังสือบริคณห์สนธิ ให้หนังสือบริคณห์สนธินั้นสิ้นผล"],["1100","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๐๐ ผู้เริ่มก่อการทุกคนต้องลงชื่อซื้อหุ้น ๆ หนึ่งเป็นอย่างน้อย"],["1101","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๐๑ บุคคลซึ่งเป็นกรรมการของบริษัทจำกัดจะรับผิดโดยไม่จำกัดก็ได้ ถ้ากรณีเป็นเช่นนั้นไซร้ ท่านว่าต้องจดแถลงความรับผิดเช่นนั้นลงไว้ในหนังสือบริคณห์สนธิด้วย\nอันความรับผิดโดยไม่จำกัดของผู้เป็นกรรมการนั้น ย่อมถึงที่สุดเมื่อล่วงเวลาสองปีนับแต่วันที่ตัวเขาออกจากตำแหน่งกรรมการ"],["1102","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๐๒ ห้ามมิให้ชี้ชวนประชาชนให้ซื้อหุ้น"],["1103","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๐๓ (ยกเลิก)"],["1104","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๐๔ จำนวนหุ้นทั้งหมดซึ่งบริษัทคิดจะจดทะเบียนนั้น ต้องมีผู้เข้าชื่อซื้อหรือออกให้กันเสร็จก่อนการจดทะเบียนของบริษัท"],["1105","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๐๕ อันหุ้นนั้น ท่านห้ามมิให้ออกโดยราคาต่ำไปกว่ามูลค่าของหุ้นที่ตั้งไว้\nการออกหุ้นโดยราคาสูงกว่ามูลค่าของหุ้นที่ตั้งไว้นั้น หากว่าหนังสือบริคณห์สนธิให้อำนาจไว้ ก็ให้ออกได้ และในกรณีเช่นนั้น ต้องส่งใช้จำนวนที่ล้ำมูลค่าพร้อมกันไปกับการส่งใช้เงินคราวแรก\nอนึ่ง เงินส่งใช้ค่าหุ้นคราวแรกนั้น ต้องมิให้น้อยกว่าร้อยละยี่สิบห้าแห่งมูลค่าของหุ้นที่ตั้งไว้"],["1106","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๐๖ การที่เข้าชื่อซื้อหุ้นนั้นย่อมผูกพันผู้เข้าชื่อโดยเงื่อนไขว่า ถ้าบริษัทตั้งขึ้นแล้วจะใช้จำนวนเงินค่าหุ้นนั้น ๆ ให้แก่บริษัทตามหนังสือชี้ชวนและข้อบังคับของบริษัท"],["1107","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๐๗ เมื่อหุ้นชนิดซึ่งจะต้องลงเงินนั้นได้มีผู้เข้าชื่อซื้อหมดแล้ว ผู้เริ่มก่อการต้องนัดบรรดาผู้เข้าชื่อซื้อหุ้นมาประชุมกันเป็นการประชุมใหญ่โดยไม่ชักช้า ประชุมอันนี้ให้เรียกว่าประชุมตั้งบริษัท\nอนึ่ง ให้ผู้เริ่มก่อการส่งรายงานการตั้งบริษัทมีคำรับรองของตนว่าถูกต้องและมีข้อความที่เกี่ยวแก่กิจการอันจะพึงกระทำในที่ประชุมตั้งบริษัททุก ๆ ข้อตามความในมาตราต่อไปนี้ ไปยังผู้เข้าชื่อซื้อหุ้นทุกคนอย่างน้อยเจ็ดวันก่อนวันนัดประชุม\nเมื่อได้ส่งรายงานตั้งบริษัทแก่ผู้เข้าชื่อซื้อหุ้นแล้ว ผู้เริ่มก่อการต้องจัดส่งสำเนารายงานอันมีคำรับรองว่าถูกต้องตามที่บังคับไว้ในมาตรานี้ไปยังนายทะเบียนบริษัทโดยพลัน\nอนึ่ง ให้ผู้เริ่มก่อการจัดให้มีบัญชีแถลงรายชื่อ ฐานะ และสำนักของผู้เข้าชื่อซื้อหุ้นกับจำนวนหุ้นซึ่งต่างคนได้ลงชื่อซื้อไว้เพื่อเสนอต่อที่ประชุมนั้นด้วย\nบทบัญญัติทั้งหลายแห่งมาตรา ๑๑๗๖ มาตรา ๑๑๘๗ มาตรา ๑๑๘๘ มาตรา ๑๑๘๙ มาตรา ๑๑๙๑ มาตรา ๑๑๙๒ และมาตรา ๑๑๙๕ นั้น ท่านให้นำมาใช้บังคับแก่การประชุมตั้งบริษัทด้วยโดยอนุโลม"],["1108","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๐๘ กิจการอันจะพึงทำในที่ประชุมตั้งบริษัทนั้น คือ\n(๑) ทำความตกลงตั้งข้อบังคับต่าง ๆ ของบริษัท ทั้งนี้ ควรกำหนดวิธีการแก้ไขปัญหาหรือข้อขัดแย้งที่ไม่สามารถหาข้อยุติหรือไม่สามารถลงมติระหว่างกรรมการหรือผู้ถือหุ้นไว้ด้วย\n(๒) ให้สัตยาบันแก่บรรดาสัญญาซึ่งผู้เริ่มก่อการได้ทำไว้และค่าใช้จ่ายอย่างหนึ่งอย่างใดซึ่งเขาต้องออกไปในการเริ่มก่อบริษัท\n(๓) วางกำหนดจำนวนเงินซึ่งจะให้แก่ผู้เริ่มก่อการ ถ้าหากมีเจตนาว่าจะให้\n(๔) วางกำหนดจำนวนหุ้นบุริมสิทธิ ทั้งกำหนดสภาพและบุริมสิทธิแห่งหุ้นนั้น ๆ ว่าเป็นสถานใดเพียงใด ถ้าหากจะมีหุ้นเช่นนั้นในบริษัท\n(๕) วางกำหนดจำนวนหุ้นสามัญ หรือหุ้นบุริมสิทธิซึ่งออกให้เหมือนหนึ่งว่าได้ใช้เต็มค่าแล้วหรือได้ใช้แต่บางส่วนแล้ว เพราะใช้ให้ด้วยอย่างอื่นนอกจากตัวเงิน และกำหนดว่าเพียงใดซึ่งจะถือเอาเป็นว่าได้ใช้เงินแล้ว ถ้าหากจะมีหุ้นเช่นนั้นในบริษัท\nให้แถลงในที่ประชุมโดยเฉพาะว่า ซึ่งจะออกหุ้นสามัญหรือหุ้นบุริมสิทธิให้เหมือนหนึ่งว่าได้ใช้เงินแล้วเช่นนั้น เพื่อแทนคุณแรงงานหรือตอบแทนทรัพย์สินอย่างใด ให้พรรณนาจงชัดเจนทุกประการ\n(๖) เลือกตั้งกรรมการและพนักงานสอบบัญชีอันเป็นชุดแรกของบริษัท และวางกำหนดอำนาจของคนเหล่านี้ด้วย"],["1109","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๐๙ ผู้เริ่มก่อการหรือผู้เข้าชื่อซื้อหุ้นจะออกเสียงลงคะแนนไม่ได้ ถ้าตนมีส่วนได้เสียโดยพิเศษในปัญหาที่ยกขึ้นวินิจฉัยนั้น\nอนึ่ง มติของที่ประชุมตั้งบริษัทย่อมไม่สมบูรณ์ เว้นแต่ที่ประชุมจะได้ลงมติโดยเสียงข้างมาก อันมีคะแนนของผู้เข้าชื่อซื้อหุ้นรวมกันไม่น้อยกว่ากึ่งจำนวนผู้เข้าชื่อซื้อหุ้นทั้งหมดซึ่งมีสิทธิลงคะแนนได้ และคิดตามจำนวนหุ้นรวมกันไม่น้อยกว่ากึ่งจำนวนหุ้นของผู้ถือหุ้นนั้น ๆ ทั้งหมดด้วยกัน"],["1110","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๑๐ เมื่อได้ประชุมตั้งบริษัทแล้ว ให้ผู้เริ่มก่อการบริษัทมอบการทั้งปวงให้แก่กรรมการของบริษัท\nเมื่อกรรมการได้รับการแล้ว ก็ให้ลงมือจัดการเรียกให้ผู้เริ่มก่อการและผู้เข้าชื่อซื้อหุ้นทั้งหลายใช้เงินในหุ้นซึ่งจะต้องใช้เป็นตัวเงิน เรียกหุ้นหนึ่งไม่น้อยกว่าร้อยละยี่สิบห้า ตามที่ได้กำหนดไว้ในหนังสือชี้ชวนบอกกล่าวป่าวร้องหรือหนังสือชวนให้ซื้อหุ้น"],["1111","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๑๑ เมื่อจำนวนเงินซึ่งว่าไว้ในมาตรา ๑๑๑๐ ได้ใช้เสร็จแล้ว กรรมการต้องไปขอจดทะเบียนบริษัทนั้น\nคำขอและข้อความที่ลงในทะเบียนนั้น ให้ระบุรายการตามที่ได้ตกลงกันในที่ประชุมตั้งบริษัท ดังต่อไปนี้ คือ\n(๑) จำนวนหุ้นทั้งสิ้นซึ่งได้มีผู้เข้าชื่อซื้อ หรือได้จัดออกให้แล้ว แยกให้ปรากฏว่าเป็นชนิดหุ้นสามัญเท่าใด หุ้นบุริมสิทธิเท่าใด\n(๒) จำนวนหุ้นสามัญหรือหุ้นบุริมสิทธิ ซึ่งออกให้เหมือนหนึ่งว่าได้ใช้เต็มค่าแล้วหรือได้ใช้แต่บางส่วนแล้ว นอกจากที่ใช้เป็นตัวเงิน และหุ้นที่ได้ใช้แต่บางส่วนนั้น ให้บอกว่าได้ใช้แล้วเพียงใด\n(๓) จำนวนเงินที่ได้ใช้แล้วหุ้นละเท่าใด\n(๔) จำนวนเงินที่ได้รับไว้เป็นค่าหุ้นรวมทั้งสิ้นเท่าใด\n(๕) ชื่อ อาชีวะ และที่สำนักของกรรมการทุกคน\n(๖) ถ้าให้กรรมการต่างมีอำนาจจัดการของบริษัทได้โดยลำพังตัวให้แสดงอำนาจของกรรมการนั้น ๆ ว่าคนใดมีเพียงใด และบอกจำนวนหรือชื่อกรรมการซึ่งจะลงชื่อเป็นสำคัญผูกพันบริษัทได้นั้นด้วย\n(๗) ถ้าตั้งบริษัทขึ้นชั่วกาลกำหนดอันหนึ่ง ให้บอกกาลกำหนดอันนั้นด้วย\n(๘) ที่ตั้งสำนักงานแห่งใหญ่และสาขาทั้งปวง\nการลงทะเบียนจะมีรายการอย่างอื่นซึ่งกรรมการเห็นสมควรจะให้ทราบแก่ประชาชนก็ลงได้\nในการขอจดทะเบียนนั้น ถ้าได้ทำข้อบังคับของบริษัทไว้ประการใดบ้างต้องส่งสำเนาข้อบังคับนั้น ๆ ไปด้วย กับทั้งสำเนารายงานการประชุมตั้งบริษัทหนังสือทั้งสองนี้กรรมการต้องลงลายมือชื่อรับรองคนหนึ่งเป็นอย่างน้อย\nวรรคห้า (ยกเลิก)\nให้พนักงานทะเบียนทำใบสำคัญแสดงการจดทะเบียนส่งมอบให้แก่บริษัทฉบับหนึ่ง"],["1111/1","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๑๑/๑ ในการจัดตั้งบริษัท ถ้าได้ดำเนินการครบทุกขั้นตอนดังต่อไปนี้ภายในวันเดียวกับวันที่ผู้เริ่มก่อการจัดทำหนังสือบริคณห์สนธิ กรรมการจะขอจดทะเบียนหนังสือบริคณห์สนธิและจดทะเบียนบริษัทไปพร้อมกันภายในวันเดียวกันก็ได้\n(๑) จัดให้มีผู้เข้าชื่อซื้อหุ้นครบตามจำนวนหุ้นทั้งหมดที่บริษัทจะจดทะเบียน\n(๒) ประชุมจัดตั้งบริษัทเพื่อพิจารณากิจการต่างๆ ตามมาตรา ๑๑๐๘ โดยมีผู้เริ่มก่อการและผู้เข้าชื่อซื้อหุ้นทุกคนเข้าร่วมประชุม และผู้เริ่มก่อการและผู้เข้าชื่อซื้อหุ้นทุกคนให้ความเห็นชอบในกิจการที่ได้ประชุมกันนั้น\n(๓) ผู้เริ่มก่อการได้มอบกิจการทั้งปวงให้แก่กรรมการ\n(๔) กรรมการได้เรียกให้ผู้เข้าชื่อซื้อหุ้นใช้เงินค่าหุ้นตามมาตรา ๑๑๑๐ วรรคสอง และเงินค่าหุ้นดังกล่าวได้ใช้เสร็จแล้ว"],["1112","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๑๒ ถ้าการจดทะเบียนมิได้ทำภายในสามเดือนนับแต่ประชุมตั้งบริษัทไซร้ ท่านว่าบริษัทนั้นเป็นอันไม่ได้ตั้งขึ้น และบรรดาเงินที่ได้รับไว้จากผู้เข้าชื่อซื้อหุ้นนั้นต้องใช้คืนเต็มจำนวนมิให้ลดเลย\nถ้ามีจำนวนเงินเช่นว่านั้นค้างอยู่มิได้คืนในสามเดือนภายหลังการประชุมตั้งบริษัทไซร้ ท่านว่ากรรมการของบริษัทต้องรับผิดร่วมกันที่จะใช้ทั้งต้นเงินและดอกเบี้ยคิดตั้งแต่เวลาสิ้นกำหนดสามเดือนนั้น\nแต่ถ้ากรรมการคนใดพิสูจน์ได้ว่า การที่เงินขาดหรือที่ใช้คืนช้าไปมิได้เป็นเพราะความผิดของตนไซร้ กรรมการคนนั้นก็ไม่ต้องรับผิดในการใช้ต้นเงินหรือดอกเบี้ย"],["1113","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๑๓ ผู้เริ่มก่อการบริษัทต้องรับผิดร่วมกันและโดยไม่จำกัด ในบรรดาหนี้และการจ่ายเงินซึ่งที่ประชุมตั้งบริษัทมิได้อนุมัติ และแม้จะได้มีอนุมัติก็ยังคงต้องรับผิดอยู่เช่นนั้นไปจนกว่าจะได้จดทะเบียนบริษัท"],["1114","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๑๔ เมื่อบริษัทได้จดทะเบียนแล้ว ผู้เข้าชื่อซื้อหุ้นจะฟ้องร้องขอให้ศาลเพิกถอนการที่ตนได้เข้าชื่อซื้อ โดยยกเหตุว่าสำคัญผิด หรือต้องข่มขู่ หรือถูกลวงล่อฉ้อฉลนั้น ท่านว่าหาอาจทำได้ไม่"],["1115","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๑๕ ถ้าหากว่าชื่อบริษัทซึ่งตั้งไว้ในหนังสือบริคณห์สนธิพ้องกับชื่อบริษัทอื่นซึ่งได้จดทะเบียนแล้วก็ดี หรือพ้องกับชื่อซึ่งตั้งไว้ในหนังสือบริคณห์สนธิฉบับอื่นอันได้จดทะเบียนแล้วก็ดี หรือคล้ายคลึงกับชื่อเช่นกล่าวนั้นจนน่าจะลวงให้มหาชนหลงไปได้ก็ดี ท่านว่าบุคคลผู้ที่มีส่วนได้เสียคนหนึ่งคนใดจะฟ้องเรียกเอาค่าสินไหมทดแทนแก่ผู้เริ่มก่อการบริษัทก็ได้ และจะร้องขอให้ศาลสั่งบังคับให้เปลี่ยนชื่อนั้นเสียใหม่ก็ได้\nเมื่อศาลมีคำสั่งเช่นนั้นแล้ว ก็ต้องบอกชื่อซึ่งเปลี่ยนใหม่นั้นจดทะเบียนแทนชื่อเก่า และต้องแก้ใบสำคัญการจดทะเบียนด้วยตามกันไป"],["1116","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑ สภาพและการตั้งบริษัทจำกัด","มาตรา ๑๑๑๖ บุคคลผู้มีส่วนได้เสียคนใดคนหนึ่งประสงค์จะได้สำเนาหนังสือบริคณห์สนธิและข้อบังคับบรรดามีในบริษัทหนึ่งบริษัทใด ก็ชอบที่จะเรียกได้จากบริษัทนั้น ในการนี้บริษัทจะเรียกเอาเงินไม่เกินฉบับละสิบบาทก็ได้"],["1117","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๑๗ อันมูลค่าของหุ้น ๆ หนึ่งนั้น มิให้ต่ำกว่าห้าบาท"],["1118","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๑๘ อันหุ้นนั้น ท่านว่าจะแบ่งแยกหาได้ไม่\nถ้าบุคคลมีจำนวนแต่สองคนขึ้นไปถือหุ้น ๆ เดียวร่วมกัน ท่านว่าต้องตั้งให้คนใดคนหนึ่งในจำนวนนั้นแต่คนเดียวเป็นผู้ใช้สิทธิในฐานเป็นผู้ถือหุ้น\nอนึ่ง บุคคลทั้งหลายซึ่งถือหุ้น ๆ เดียวร่วมกัน ต้องร่วมกันรับผิดต่อบริษัทในการส่งใช้มูลค่าของหุ้น"],["1119","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๑๙ หุ้นทุก ๆ หุ้นจำต้องให้ใช้เป็นเงินจนเต็มค่า เว้นแต่หุ้นซึ่งออกตามบทบัญญัติมาตรา ๑๑๐๘ อนุมาตรา (๕) หรือมาตรา ๑๒๒๑\nในการใช้เงินเป็นค่าหุ้นนั้น ผู้ถือหุ้นจะหักหนี้กับบริษัทหาได้ไม่"],["1120","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๒๐ บรรดาเงินค่าหุ้นซึ่งยังจะต้องส่งอีกนั้น กรรมการจะเรียกให้ผู้ถือหุ้นส่งใช้เสียเมื่อใดก็ได้ เว้นแต่ที่ประชุมใหญ่จะได้วินิจฉัยเป็นอย่างอื่น"],["1121","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๒๑ การเรียกเงินค่าหุ้นแต่ละคราวนั้น ท่านบังคับว่าให้ส่งคำบอกกล่าวล่วงหน้าไม่ต่ำกว่ายี่สิบเอ็ดวันด้วย จดหมายส่งลงทะเบียนไปรษณีย์ และผู้ถือหุ้นทุกคนจะต้องใช้เงินตามจำนวนที่เรียกนั้น สุดแต่กรรมการจะได้กำหนดไปว่าให้ส่งไปยังผู้ใด ณ ที่ใดและเวลาใด"],["1122","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๒๒ ถ้าและเงินอันจะพึงส่งใช้เป็นค่าหุ้นตามเรียกนั้นผู้ถือหุ้นคนใดมิได้ส่งใช้ตามวันกำหนดไซร้ ผู้นั้นจำต้องเสียดอกเบี้ยนับแต่วันที่กำหนดให้ส่งใช้จนถึงวันที่ได้ส่งเสร็จ"],["1123","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๒๓ ถ้าผู้ถือหุ้นคนใดละเลยไม่ส่งใช้เงินที่เรียกค่าหุ้นตามวันกำหนด กรรมการจะส่งคำบอกกล่าวด้วยจดหมายส่งลงทะเบียนไปรษณีย์ไปยังผู้นั้น ให้ส่งใช้เงินที่เรียกกับทั้งดอกเบี้ยด้วยก็ได้\nในคำบอกกล่าวอันนี้ ให้กำหนดเวลาไปพอสมควรเพื่อให้ใช้เงินที่เรียกกับทั้งดอกเบี้ย และต้องบอกไปด้วยว่าให้ส่งใช้ ณ สถานที่ใด อนึ่ง ในคำบอกกล่าวนั้นจะแจ้งไปด้วยก็ได้ว่า ถ้าไม่ใช้เงินตามเรียก หุ้นนั้นอาจจะถูกริบ"],["1124","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๒๔ ถ้าในคำบอกกล่าวมีข้อแถลงความถึงการริบหุ้นด้วยแล้ว หากเงินค่าหุ้นที่เรียกกับทั้งดอกเบี้ยยังคงค้างชำระอยู่ตราบใด กรรมการจะบอกริบหุ้นนั้น ๆ เมื่อใดก็ได้"],["1125","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๒๕ หุ้นซึ่งริบแล้วนั้นให้เอาออกขายทอดตลาดโดยไม่ชักช้า ได้จำนวนเงินเท่าใดให้เอาหักใช้ค่าหุ้นที่เรียกกับดอกเบี้ยค้างชำระ ถ้ายังมีเงินเหลือเท่าใดต้องส่งคืนให้แก่ผู้ถือหุ้นนั้น"],["1126","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๒๖ แม้ว่าวิธีการริบหุ้นขายหุ้นจะไม่ถูกต้องด้วยระเบียบก็ดี ท่านว่าหาเป็นเหตุให้สิทธิของผู้ซื้อหุ้นซึ่งริบนั้นเสื่อมเสียไปอย่างไรไม่"],["1127","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๒๗ ให้บริษัททำใบหุ้น คือใบสำคัญสำหรับหุ้นใบหนึ่งหรือหลายใบ มอบให้เป็นคู่มือแก่ผู้ถือหุ้นจงทุก ๆ คน\nเมื่อมอบใบหุ้นนั้น จะเรียกค่าธรรมเนียมก็ได้ สุดแต่กรรมการจะกำหนด แต่มิให้เกินสิบบาท"],["1128","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๒๘ ในใบหุ้นทุก ๆ ใบให้กรรมการอย่างน้อยหนึ่งคนลงลายมือชื่อและประทับตราของบริษัทถ้ามี\nในใบหุ้นนั้นต้องมีข้อความต่อไปนี้ คือ\n(๑) ชื่อบริษัท\n(๒) เลขหมายหุ้นที่กล่าวถึงในใบหุ้นนั้น\n(๓) มูลค่าหุ้นหนึ่งเป็นเงินเท่าใด\n(๔) ถ้าและเป็นหุ้นที่ยังไม่ได้ใช้เงินเสร็จ ให้จัดลงว่าได้ใช้เงินค่าหุ้นแล้วหุ้นละเท่าใด\n(๕) ชื่อผู้ถือหุ้น หรือคำแถลงว่าได้ออกใบหุ้นนั้นให้แก่ผู้ถือ"],["1129","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๒๙ อันว่าหุ้นนั้นย่อมโอนกันได้โดยมิต้องได้รับความยินยอมของบริษัท เว้นแต่เมื่อเป็นหุ้นชนิดระบุชื่อลงในใบหุ้น ซึ่งมีข้อบังคับของบริษัทกำหนดไว้เป็นอย่างอื่น\nการโอนหุ้นชนิดระบุชื่อลงในใบหุ้นนั้น ถ้ามิได้ทำเป็นหนังสือและลงลายมือชื่อของผู้โอนกับผู้รับโอน มีพยานคนหนึ่งเป็นอย่างน้อยลงชื่อรับรองลายมือนั้น ๆ ด้วยแล้ว ท่านว่าเป็นโมฆะ อนึ่ง ตราสารอันนั้นต้องแถลงเลขหมายของหุ้นซึ่งโอนกันนั้นด้วย\nการโอนเช่นนี้จะนำมาใช้แก่บริษัทหรือบุคคลภายนอกไม่ได้ จนกว่าจะได้จดแจ้งการโอนทั้งชื่อและสำนักของผู้รับโอนนั้นลงในทะเบียนผู้ถือหุ้น"],["1130","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๓๐ หุ้นใดเงินที่เรียกค่าหุ้นยังค้างชำระอยู่ หุ้นนั้นบริษัทจะไม่ยอมรับจดทะเบียนให้โอนก็ได้"],["1131","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๓๑ ในระหว่างสิบสี่วันก่อนการประชุมใหญ่สามัญ บริษัทจะปิดสมุดทะเบียนพักการโอนหุ้นเสียก็ได้"],["1132","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๓๒ ในเหตุบางอย่างเช่นผู้ถือหุ้นตายก็ดี หรือล้มละลายก็ดี อันเป็นเหตุให้บุคคลอื่นเป็นผู้มีสิทธิจะได้หุ้นขึ้นนั้น หากว่าบุคคลนั้นนำใบหุ้นมาเวนคืน เมื่อเป็นวิสัยจะทำได้ ทั้งได้นำหลักฐานอันสมควรมาแสดงด้วยแล้ว ก็ให้บริษัทรับบุคคลนั้นลงทะเบียนเป็นผู้ถือหุ้นสืบไป"],["1133","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๓๓ หุ้นซึ่งโอนกันนั้น ถ้าเป็นหุ้นอันมิได้ส่งเงินใช้เต็มจำนวนค่าหุ้น ท่านว่าผู้โอนยังคงต้องรับผิดในจำนวนเงินที่ยังมิได้ส่งใช้ให้ครบถ้วนนั้น แต่ว่า\n(๑) ผู้โอนไม่ต้องรับผิดในหนี้อันหนึ่งอันใดของบริษัทซึ่งได้ก่อให้เกิดขึ้นภายหลังโอน\n(๒) ผู้โอนไม่ต้องรับผิดออกส่วนใช้หนี้ เว้นแต่ความปรากฏขึ้นแก่ศาลว่าบรรดาผู้ที่ยังถือหุ้นของบริษัทอยู่นั้นไม่สามารถออกส่วนใช้หนี้อันเขาจะพึงต้องออกใช้นั้นได้\nในข้อความรับผิดเช่นว่ามานั้น ท่านห้ามมิให้ฟ้องผู้โอนเมื่อพ้นสองปีนับแต่ได้จดแจ้งการโอนนั้นลงในทะเบียนผู้ถือหุ้น"],["1134","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๓๔ ใบหุ้นออกให้แก่ผู้ถือนั้น จะออกได้ก็แต่เมื่อมีข้อบังคับของบริษัทอนุญาตไว้ และจะออกให้ได้แต่เฉพาะเพื่อหุ้นซึ่งได้ใช้เต็มค่าแล้ว ในกรณีเช่นว่านี้ ผู้ทรงใบหุ้นชนิดระบุชื่อย่อมมีสิทธิจะได้รับใบหุ้นชนิดออกให้แก่ผู้ถือ เมื่อเวนคืนใบหุ้นชนิดระบุชื่อนั้นให้ขีดฆ่าเสีย"],["1135","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๓๕ หุ้นชนิดที่มีใบหุ้นออกให้แก่ผู้ถือนั้น ย่อมโอนกันได้เพียงด้วยส่งมอบใบหุ้นแก่กัน"],["1136","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๓๖ ผู้ทรงใบหุ้นชนิดออกให้แก่ผู้ถือย่อมมีสิทธิจะมาขอเปลี่ยนเอาใบหุ้นชนิดระบุชื่อได้ เมื่อเวนคืนใบหุ้นฉบับออกให้แก่ผู้ถือนั้นให้ขีดฆ่าเสีย"],["1137","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๓๗ ถ้าข้อบังคับของบริษัทมีกำหนดไว้เป็นองค์คุณอันหนึ่งสำหรับผู้จะเป็นกรรมการ ว่าจำจะต้องเป็นผู้ถือหุ้นเป็นจำนวนเท่าหนึ่งใดไซร้ หุ้นเช่นนี้ท่านว่าต้องเป็นหุ้นชนิดระบุชื่อ"],["1138","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๓๘ บริษัทจำกัดต้องมีสมุดทะเบียนผู้ถือหุ้น มีรายการดั่งต่อไปนี้ คือ\n(๑) ชื่อและสำนัก กับอาชีวะ ถ้าว่ามี ของผู้ถือหุ้น ข้อแถลงเรื่องหุ้นของผู้ถือหุ้นคนหนึ่ง ๆ แยกหุ้นออกตามเลขหมายและจำนวนเงินที่ได้ใช้แล้วหรือที่ได้ตกลงกันให้ถือว่าเป็นอันได้ใช้แล้วในหุ้นของผู้ถือหุ้นคนหนึ่ง ๆ\n(๒) วันเดือนปีซึ่งได้ลงทะเบียนบุคคลผู้หนึ่ง ๆ เป็นผู้ถือหุ้น\n(๓) วันเดือนปีซึ่งบุคคลคนใดคนหนึ่งขาดจากเป็นผู้ถือหุ้น\n(๔) เลขหมายใบหุ้นและวันที่ลงในใบหุ้นชนิดออกให้แก่ผู้ถือ และเลขหมายของหุ้นซึ่งได้ลงไว้ในใบหุ้นนั้น ๆ\n(๕) วันที่ได้ขีดฆ่าใบหุ้นชนิดระบุชื่อ หรือชนิดออกให้แก่ผู้ถือ"],["1139","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๓๙ สมุดทะเบียนผู้ถือหุ้นเริ่มแต่วันจดทะเบียนบริษัทนั้นให้รักษาไว้ ณ สำนักงานของบริษัทแห่งที่ได้บอกทะเบียนไว้ สมุดทะเบียนนี้ให้เปิดให้แก่ผู้ถือหุ้นทั้งหลายดูได้ในระหว่างเวลาทำการโดยไม่เรียกค่าธรรมเนียมอย่างหนึ่งอย่างใด แต่กรรมการจะจำกัดเวลาลงไว้อย่างไรพอสมควรก็ได้หากไม่น้อยกว่าวันละสองชั่วโมง\nให้เป็นหน้าที่ของกรรมการที่จะส่งสำเนาบัญชีรายชื่อผู้ที่ยังคงเป็นผู้ถือหุ้นอยู่ทั้งหมดในเวลาที่ประชุม และรายชื่อผู้ที่ขาดจากเป็นผู้ถือหุ้นจำเดิมแต่วันประชุมสามัญครั้งที่แล้วมานั้น ไปยังนายทะเบียนอย่างน้อยปีละครั้ง และมิให้ช้ากว่าวันที่สิบสี่นับแต่การประชุมสามัญ บัญชีรายชื่อนี้ให้มีรายการบรรดาที่ระบุไว้ในมาตราก่อนนั้นทุกประการ"],["1140","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๔๐ ผู้ถือหุ้นชอบที่จะเรียกให้ส่งมอบสำเนาทะเบียนเช่นว่านั้นหรือแต่ตอนหนึ่งตอนใดแก่ตนได้ เมื่อเสียค่าสำเนาแต่ไม่เกินหน้าละห้าบาท"],["1141","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๔๑ สมุดทะเบียนผู้ถือหุ้นนั้น ท่านให้สันนิษฐานไว้ก่อนว่าเป็นพยานหลักฐานอันถูกต้องในข้อกระทงความบรรดาที่กฎหมายบังคับ หรือให้อำนาจให้เอาลงในทะเบียนนั้น"],["1142","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๔๒ ถ้าบริษัทได้ออกหุ้นบุริมสิทธิไปแล้ว ได้กำหนดไว้ว่าบุริมสิทธิจะมีแก่หุ้นนั้น ๆ เป็นอย่างไร ท่านห้ามมิให้แก้ไขอีกเลย"],["1143","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๒ หุ้นและผู้ถือหุ้น","มาตรา ๑๑๔๓ ห้ามมิให้บริษัทจำกัดเป็นเจ้าของถือหุ้นของตนเอง หรือรับจำนำหุ้นของตนเอง"],["1144","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๔๔ บรรดาบริษัทจำกัด ให้มีกรรมการคนหนึ่งหรือหลายคนด้วยกันจัดการตามข้อบังคับของบริษัท และอยู่ในความครอบงำของที่ประชุมใหญ่แห่งผู้ถือหุ้นทั้งปวง"],["1145","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๔๕ จำเดิมแต่ได้จดทะเบียนบริษัทแล้ว ท่านห้ามมิให้ตั้งข้อบังคับใหม่ หรือเพิ่มเติมเปลี่ยนแปลงข้อบังคับหรือข้อความในหนังสือบริคณห์สนธิแต่อย่างหนึ่งอย่างใด เว้นแต่จะได้มีการลงมติพิเศษ"],["1146","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๔๖ บรรดาข้อบังคับอันได้ตั้งขึ้นใหม่ หรือได้เพิ่มเติมเปลี่ยนแปลงนั้น เป็นหน้าที่ของบริษัทที่จะจัดให้ไปจดทะเบียนภายในกำหนดสิบสี่วันนับแต่วันที่ได้มีการลงมติพิเศษ"],["1147","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๔๗ (ยกเลิก)"],["1148","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๔๘ บรรดาบริษัทจำกัด ต้องมีสำนักงานบอกทะเบียนไว้แห่งหนึ่งซึ่งธุรการติดต่อและคำบอกกล่าวทั้งปวงจะส่งถึงบริษัทได้ ณ ที่นั้น\nคำบอกกล่าวสถานที่ตั้งแห่งสำนักงานที่ได้บอกทะเบียนไว้ก็ดี หรือเปลี่ยนย้ายสถานที่ก็ดี ให้ส่งแก่นายทะเบียนบริษัทและให้นายทะเบียนจดข้อความนั้นลงในทะเบียน"],["1149","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๔๙ ตราบใดหุ้นทั้งหลายยังมิได้ชำระเงินเต็มจำนวน ท่านว่าตราบนั้นบริษัทจะลงพิมพ์หรือแสดงจำนวนต้นทุนของบริษัทในหนังสืออย่างหนึ่งอย่างใดเช่นในคำบอกกล่าวป่าวร้องก็ดี ในตั๋วเงินและบัญชีสิ่งของก็ดี ในจดหมายก็ดี ต้องแสดงไว้ให้ชัดเจนด้วยในทีเดียวกันว่า จำนวนเงินต้นทุนได้ชำระแล้วเพียงกี่ส่วน"],["1150","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๕๐ ผู้เป็นกรรมการจะพึงมีจำนวนมากน้อยเท่าใด และจะพึงได้บำเหน็จเท่าใด ให้สุดแล้วแต่ที่ประชุมใหญ่จะกำหนด"],["1151","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๕๑ อันผู้เป็นกรรมการนั้น เฉพาะแต่ที่ประชุมใหญ่เท่านั้นอาจจะตั้งหรือถอนได้"],["1152","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๕๒ ในเมื่อมีการประชุมสามัญครั้งแรกภายหลังแต่จดทะเบียนบริษัทก็ดี และในเมื่อมีการประชุมสามัญครั้งแรกในปีทุก ๆ ปีต่อไปก็ดี ผู้เป็นกรรมการต้องออกจากตำแหน่งโดยจำนวนหนึ่งในสามเป็นอัตรา ถ้าและจำนวนกรรมการจะแบ่งออกให้ตรงเป็นส่วนสามไม่ได้ ก็ให้ออกโดยจำนวนใกล้ที่สุดกับส่วนหนึ่งในสาม"],["1153","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๕๓ ตัวกรรมการที่จะต้องออกจากตำแหน่งในปีแรกและปีที่สองภายหลังจดทะเบียนบริษัทนั้น ถ้ากรรมการมิได้ตกลงกันไว้เองเป็นวิธีอื่นไซร้ ก็ให้จับสลากกัน ส่วนปีหลัง ๆ ต่อไปให้กรรมการคนที่ได้อยู่ในตำแหน่งนานที่สุดนั้นเป็นผู้ต้องออก\nกรรมการผู้ออกไปนั้นจะเลือกเข้ารับตำแหน่งอีกก็ได้"],["1153/1","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๕๓/๑ กรรมการคนใดจะลาออกจากตำแหน่ง ให้ยื่นใบลาออกต่อบริษัท การลาออกมีผลนับแต่วันที่ใบลาออกไปถึงบริษัท\nกรรมการซึ่งลาออกตามวรรคหนึ่ง จะแจ้งการลาออกของตนให้นายทะเบียนทราบด้วยก็ได้"],["1154","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๕๔ ถ้ากรรมการคนใดล้มละลาย หรือตกเป็นผู้ไร้ความสามารถไซร้ ท่านว่ากรรมการคนนั้นเป็นอันขาดจากตำแหน่ง"],["1155","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๕๕ ถ้าตำแหน่งว่างลงในสภากรรมการเพราะเหตุอื่นนอกจากถึงคราวออกตามเวรไซร้ ท่านว่ากรรมการจะเลือกผู้อื่นตั้งขึ้นใหม่ให้เต็มที่ว่างก็ได้ แต่บุคคลที่ได้เป็นกรรมการใหม่เช่นนั้น ให้มีเวลาอยู่ในตำแหน่งได้เพียงเท่ากำหนดเวลาที่กรรมการผู้ออกไปนั้นชอบที่จะอยู่ได้"],["1156","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๕๖ ถ้าที่ประชุมใหญ่ถอนกรรมการผู้หนึ่งออกก่อนครบกาลกำหนดของเขา และตั้งคนอื่นขึ้นไว้แทนที่ไซร้ ท่านว่าบุคคลที่เป็นกรรมการใหม่นั้นให้อยู่ในตำแหน่งได้เพียงเท่ากำหนดเวลาที่กรรมการผู้ถูกถอนนั้นชอบที่จะอยู่ได้"],["1157","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๕๗ เมื่อมีการเปลี่ยนแปลงกรรมการ ให้บริษัทนำความไปจดทะเบียนภายในสิบสี่วันนับแต่วันที่มีการเปลี่ยนแปลง"],["1158","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๕๘ นอกจากจะมีข้อบังคับของบริษัทไว้เป็นอย่างอื่น กรรมการมีอำนาจตามบทบัญญัติในเจ็ดมาตราต่อไปนี้"],["1159","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๕๙ ในจำนวนกรรมการนั้น แม้ตำแหน่งจะว่างไปบ้าง กรรมการที่มีตัวอยู่ก็ย่อมทำกิจการได้ แต่ถ้าในเวลาใดจำนวนกรรมการลดน้อยลงกว่าจำนวนอันจำเป็นที่จะเป็นองค์ประชุมได้ตลอดเวลาเช่นนั้น กรรมการที่มีตัวอยู่ย่อมทำกิจการได้เฉพาะแต่ในเรื่องที่จะเพิ่มกรรมการขึ้นให้ครบจำนวนหรือนัดเรียกประชุมใหญ่ของบริษัทเท่านั้น จะกระทำกิจการอย่างอื่นไม่ได้"],["1160","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๖๐ กรรมการจะวางกำหนดไว้ก็ได้ว่า จำนวนกรรมการเข้าประชุมกี่คนจึงจะเป็นองค์ประชุมทำกิจการได้ ถ้าและมิได้กำหนดไว้ดังนั้นไซร้ (เมื่อจำนวนกรรมการเกินกว่าสามคน) ท่านว่าต้องมีกรรมการเข้าประชุมสามคนจึงจะเป็นองค์ประชุมได้"],["1161","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๖๑ ข้อปรึกษาซึ่งเกิดเป็นปัญหาในประชุมกรรมการนั้น ให้ชี้ขาดตัดสินเอาเสียงข้างมากเป็นใหญ่ ถ้าและคะแนนเสียงเท่ากัน ให้ผู้เป็นประธานเป็นผู้ออกเสียงชี้ขาด"],["1162","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๖๒ กรรมการคนหนึ่งคนใดจะนัดเรียกให้ประชุมกรรมการเมื่อใดก็ได้"],["1162/1","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๖๒/๑ การประชุมกรรมการอาจดำเนินการโดยการติดต่อสื่อสารด้วยเทคโนโลยีอย่างหนึ่งอย่างใด โดยกรรมการไม่จำเป็นต้องปรากฏตัวในที่ประชุมก็ได้ เว้นแต่ข้อบังคับของบริษัทจะกำหนดห้ามไว้\nการประชุมกรรมการโดยการติดต่อสื่อสารด้วยเทคโนโลยีตามวรรคหนึ่ง ให้เป็นไปตามกฎหมายว่าด้วยการประชุมผ่านสื่ออิเล็กทรอนิกส์\nให้ถือว่ากรรมการซึ่งใช้การติดต่อสื่อสารตามวรรคหนึ่งได้เข้าร่วมประชุมกรรมการ และให้นับเป็นองค์ประชุมและมีสิทธิออกเสียงในการประชุมด้วย"],["1163","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๖๓ กรรมการจะเลือกกรรมการคนหนึ่งขึ้นเป็นประธานที่ประชุม และจะกำหนดเวลาว่าให้อยู่ในตำแหน่งเพียงใดก็ได้ แต่ถ้าหากมิได้เลือกกันไว้เช่นนั้น หรือผู้เป็นประธานไม่มาประชุมตามเวลาที่ได้นัดหมายไซร้ กรรมการที่มาประชุมนั้นจะเลือกกันคนหนึ่งขึ้นเป็นประธานในการประชุมเช่นนั้นก็ได้"],["1164","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๖๔ กรรมการจะมอบอำนาจอย่างหนึ่งอย่างใดของตนให้แก่ผู้จัดการ หรือให้แก่อนุกรรมการซึ่งตั้งขึ้นจากผู้ที่เป็นกรรมการด้วยกันก็ได้ ในการใช้อำนาจซึ่งได้มอบหมายเช่นนั้น ผู้จัดการทุกคนหรืออนุกรรมการทุกคนต้องทำตามคำสั่งหรือข้อบังคับซึ่งกรรมการทั้งหลายได้กำหนดให้ทุกอย่างทุกประการ"],["1165","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๖๕ ถ้าการมอบอำนาจมิได้กำหนดไว้เป็นอย่างอื่นไซร้ ข้อปรึกษาซึ่งเกิดเป็นปัญหาขึ้นในที่ประชุมอนุกรรมการทั้งหลายให้ตัดสินเอาเสียงข้างมากเป็นใหญ่ ถ้าและคะแนนเสียงเท่ากัน ให้ผู้เป็นประธานชี้ขาด"],["1166","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๖๖ บรรดาการซึ่งกรรมการคนหนึ่งได้ทำไปแม้ในภายหลังความปรากฏว่าการตั้งแต่งกรรมการคนนั้นมีข้อบกพร่องอยู่บ้างก็ดี หรือเป็นผู้บกพร่องด้วยองค์คุณควรแก่ตำแหน่งกรรมการก็ดี ท่านว่าการที่ได้ทำนั้นย่อมสมบูรณ์เสมือนดังว่าบุคคลผู้นั้นได้รับการแต่งตั้งโดยถูกต้องและบริบูรณ์ด้วยองค์คุณของกรรมการ"],["1167","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๖๗ ความเกี่ยวพันกันในระหว่างกรรมการและบริษัทและบุคคลภายนอกนั้น ท่านให้บังคับตามบทบัญญัติแห่งประมวลกฎหมายนี้ ว่าด้วยตัวแทน"],["1168","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๖๘ ในอันที่จะประกอบกิจการของบริษัทนั้น กรรมการต้องใช้ความเอื้อเฟื้อสอดส่องอย่างบุคคลค้าขายผู้ประกอบด้วยความระมัดระวัง\nว่าโดยเฉพาะ กรรมการต้องรับผิดชอบร่วมกันในประการต่าง ๆ ดังจะกล่าวต่อไปนี้ คือ\n(๑) การใช้เงินค่าหุ้นนั้น ได้ใช้กันจริง\n(๒) จัดให้มีและรักษาไว้ให้เรียบร้อย ซึ่งบรรดาสมุดบัญชีและเอกสารที่กฎหมายกำหนดไว้\n(๓) การแจกเงินปันผลหรือดอกเบี้ยให้เป็นไปโดยถูกต้องตามที่กฎหมายกำหนดไว้\n(๔) บังคับการให้เป็นไปโดยถูกต้องตามมติของที่ประชุมใหญ่\nอนึ่ง ท่านห้ามมิให้ผู้เป็นกรรมการประกอบการค้าขายใด ๆ อันมีสภาพเป็นอย่างเดียวกัน และเป็นการแข่งขันกับการค้าขายของบริษัทนั้น ไม่ว่าทำเพื่อประโยชน์ตนหรือเพื่อประโยชน์ผู้อื่น หรือไปเข้าหุ้นส่วนไม่จำกัดความรับผิดในห้างค้าขายอื่นซึ่งประกอบกิจการมีสภาพเป็นอย่างเดียวกันและแข่งขันกับกิจการของบริษัท โดยมิได้รับความยินยอมของที่ประชุมใหญ่ของผู้ถือหุ้น\nบทบัญญัติที่กล่าวมาข้างบนนี้ให้ใช้บังคับตลอดถึงบุคคลซึ่งเป็นผู้แทนของกรรมการด้วย"],["1169","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๖๙ ถ้ากรรมการทำให้เกิดเสียหายแก่บริษัท บริษัทจะฟ้องร้องเรียกเอาสินไหมทดแทนแก่กรรมการก็ได้ หรือในกรณีที่บริษัทไม่ยอมฟ้องร้อง ผู้ถือหุ้นคนหนึ่งคนใดจะเอาคดีนั้นขึ้นว่าก็ได้\nอนึ่ง การเรียกร้องเช่นนี้ เจ้าหนี้ของบริษัทจะเป็นผู้เรียกบังคับก็ได้ เท่าที่เจ้าหนี้ยังคงสิทธิเรียกร้องแก่บริษัทอยู่"],["1170","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๗๐ เมื่อการซึ่งกรรมการคนใดได้ทำไปได้รับอนุมัติของที่ประชุมใหญ่แล้ว ท่านว่ากรรมการคนนั้นไม่ต้องรับผิดในการนั้นต่อผู้ถือหุ้นซึ่งได้ให้อนุมัติหรือต่อบริษัทอีกต่อไป\nท่านห้ามมิให้ผู้ถือหุ้นซึ่งมิได้ให้อนุมัติด้วยนั้นฟ้องคดีเมื่อพ้นเวลาหกเดือนนับแต่วันที่ประชุมใหญ่ให้อนุมัติแก่การเช่นว่านั้น"],["1171","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๗๑ ให้มีการประชุมผู้ถือหุ้นทั่วไปเป็นประชุมใหญ่ภายในหกเดือนนับแต่วันที่ได้จดทะเบียนบริษัท และต่อนั้นไปก็ให้มีการประชุมเช่นนี้ครั้งหนึ่งเป็นอย่างน้อยทุกระยะเวลาสิบสองเดือน\nการประชุมเช่นนี้ เรียกว่าประชุมสามัญ\nการประชุมใหญ่คราวอื่นบรรดามีนอกจากนี้ เรียกว่าประชุมวิสามัญ"],["1172","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๗๒ กรรมการจะเรียกประชุมวิสามัญเมื่อใดก็ได้สุดแต่จะเห็นสมควร\nถ้าบริษัทขาดทุนลงถึงกึ่งจำนวนต้นทุน กรรมการต้องเรียกประชุมวิสามัญทันทีเพื่อแจ้งให้ผู้ถือหุ้นทราบการที่ขาดทุนนั้น"],["1173","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๗๓ การประชุมวิสามัญจะต้องนัดเรียกให้มีขึ้นในเมื่อผู้ถือหุ้นมีจำนวนหุ้นรวมกันไม่น้อยกว่าหนึ่งในห้าแห่งจำนวนหุ้นของบริษัทได้เข้าชื่อกันทำหนังสือร้องขอให้เรียกประชุมเช่นนั้น ในหนังสือร้องขอนั้นต้องระบุว่าประสงค์ให้เรียกประชุมเพื่อการใด"],["1174","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๗๔ เมื่อผู้ถือหุ้นยื่นคำร้องขอให้เรียกประชุมวิสามัญดังได้กล่าวมาในมาตราก่อนนี้แล้ว ให้กรรมการเรียกประชุมโดยพลัน\nถ้าและกรรมการมิได้เรียกประชุมภายในสามสิบวันนับแต่วันยื่นคำร้องไซร้ ผู้ถือหุ้นทั้งหลายซึ่งเป็นผู้ร้อง หรือผู้ถือหุ้นคนอื่น ๆ รวมกันได้จำนวนดังบังคับไว้นั้นจะเรียกประชุมเองก็ได้"],["1175","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๗๕ คำบอกกล่าวเรียกประชุมใหญ่ให้ส่งทางไปรษณีย์ตอบรับไปยังผู้ถือหุ้นทุกคนที่มีชื่อในทะเบียนของบริษัทก่อนวันนัดประชุมไม่น้อยกว่าเจ็ดวัน แต่ในกรณีที่บริษัทมีหุ้นชนิดที่มีใบหุ้นออกให้แก่ผู้ถือ ให้โฆษณาในหนังสือพิมพ์แห่งท้องที่อย่างน้อยหนึ่งครั้งหรือในสื่ออิเล็กทรอนิกส์ตามหลักเกณฑ์ วิธีการที่กำหนดในกฎกระทรวง ก่อนวันนัดประชุมไม่น้อยกว่าเจ็ดวันด้วย หากเป็นคำบอกกล่าวเรียกประชุมใหญ่เพื่อลงมติพิเศษให้กระทำการดังกล่าว ก่อนวันนัดประชุมไม่น้อยกว่าสิบสี่วัน\nคำบอกกล่าวเรียกประชุมใหญ่นั้น ให้ระบุสถานที่ วัน เวลา และสภาพแห่งกิจการที่จะได้ประชุมปรึกษากัน และในกรณีที่เป็นคำบอกกล่าวเรียกประชุมใหญ่เพื่อลงมติพิเศษให้ระบุข้อความที่จะนำเสนอให้ลงมติด้วย"],["1176","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๗๖ ผู้ถือหุ้นทั่วทุกคนมีสิทธิจะเข้าประชุมในที่ประชุมใหญ่ได้เสมอ ไม่ว่าจะเป็นประชุมชนิดใดคราวใด"],["1177","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๗๗ วิธีดังบัญญัติไว้ในมาตราต่อ ๆ ไปนี้ ท่านให้ใช้บังคับแก่การประชุมใหญ่ เว้นแต่จะมีข้อบังคับของบริษัทกำหนดไว้เป็นข้อความขัดกัน"],["1178","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๗๘ การประชุมใหญ่ต้องมีผู้ถือหุ้นหรือผู้รับมอบฉันทะจากผู้ถือหุ้นเข้าร่วมประชุมกันไม่น้อยกว่าสองคนและมีจำนวนหุ้นนับรวมกันได้ไม่น้อยกว่าหนึ่งในสี่แห่งทุนของบริษัท จึงจะสามารถลงมติในเรื่องใด ๆ ได้"],["1179","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๗๙ การประชุมใหญ่เรียกนัดเวลาใด เมื่อล่วงเวลานัดนั้นไปแล้วถึงชั่วโมงหนึ่ง จำนวนผู้ถือหุ้นซึ่งมาเข้าประชุมยังไม่ครบถ้วนเป็นองค์ประชุมดังบัญญัติไว้ในมาตรา ๑๑๗๘ นั้นไซร้ หากว่าการประชุมใหญ่นั้นได้เรียกนัดเพราะผู้ถือหุ้นร้องขอ ท่านให้เลิกประชุม\nถ้าการประชุมใหญ่นั้นมิใช่ชนิดซึ่งเรียกนัดเพราะผู้ถือหุ้นร้องขอไซร้ ท่านให้เรียกนัดใหม่อีกคราวหนึ่งภายในสิบสี่วัน และการประชุมใหญ่ครั้งหลังนี้ท่านไม่บังคับว่าจำต้องครบองค์ประชุม"],["1180","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๘๐ ในการประชุมผู้ถือหุ้นทั่วไปเป็นประชุมใหญ่ทุก ๆ ครั้ง ให้ผู้เป็นประธานในสภากรรมการนั่งเป็นประธาน\nถ้าประธานกรรมการเช่นว่านี้ไม่มีตัวก็ดี หรือไม่มาเข้าประชุมจนล่วงเวลานัดไปแล้วสิบห้านาทีก็ดี ให้ผู้ถือหุ้นทั้งหลายซึ่งอยู่ในที่นั้นเลือกผู้ถือหุ้นคนหนึ่งในจำนวนซึ่งมาประชุมขึ้นนั่งเป็นประธาน"],["1181","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๘๑ ผู้นั่งเป็นประธานจะเลื่อนการประชุมใหญ่ใด ๆ ไปเวลาอื่นโดยความยินยอมของที่ประชุมก็ได้ แต่ในที่ประชุมซึ่งได้เลื่อนมานั้นท่านมิให้ปรึกษากิจการอันใดนอกไปจากที่ค้างมาแต่วันประชุมก่อน"],["1182","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๘๒ ในการลงคะแนนโดยวิธีชูมือนั้น ท่านให้นับว่าผู้ถือหุ้นทุกคนที่มาประชุมเองหรือมอบฉันทะให้ผู้อื่นมาประชุมแทนมีเสียงหนึ่งเป็นคะแนน แต่ในการลงคะแนนลับ ท่านให้นับว่าผู้ถือหุ้นทุกคนมีคะแนนเสียง เสียงหนึ่งต่อหุ้นหนึ่งที่ตนถือ"],["1183","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๘๓ ถ้ามีข้อบังคับของบริษัทวางเป็นกำหนดไว้ว่า ต่อเมื่อผู้ถือหุ้นเป็นผู้มีหุ้นแต่จำนวนเท่าใดขึ้นไปจึงให้ออกเสียงเป็นคะแนนได้ไซร้ ท่านว่าผู้ถือหุ้นทั้งหลายซึ่งไม่มีหุ้นถึงจำนวนเท่านั้นย่อมมีสิทธิที่จะเข้ารวมกันให้ได้จำนวนหุ้นดังกล่าว แล้วตั้งคนหนึ่งในพวกของตนให้เป็นผู้รับฉันทะออกเสียงแทนในการประชุมใหญ่ใด ๆ ได้"],["1184","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๘๔ ผู้ถือหุ้นคนใดยังมิได้ชำระเงินค่าหุ้นซึ่งบริษัทได้เรียกเอาแต่ตนให้เสร็จสิ้น ท่านว่าผู้ถือหุ้นคนนั้นไม่มีสิทธิออกเสียงเป็นคะแนน"],["1185","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๘๕ ผู้ถือหุ้นคนใดมีส่วนได้เสียเป็นพิเศษในข้ออันใดซึ่งที่ประชุมจะลงมติ ท่านห้ามมิให้ผู้ถือหุ้นคนนั้นออกเสียงลงคะแนนด้วยในข้อนั้น"],["1186","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๘๖ ผู้ทรงใบหุ้นชนิดออกให้แก่ผู้ถือหาอาจออกเสียงเป็นคะแนนได้ไม่ เว้นแต่จะได้นำใบหุ้นของตนนั้นมาวางไว้แก่บริษัทแต่ก่อนเวลาประชุม"],["1187","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๘๗ ผู้ถือหุ้นทุกคนจะมอบฉันทะให้ผู้อื่นออกเสียงแทนตนก็ได้ แต่การมอบฉันทะเช่นนี้ต้องทำเป็นหนังสือ"],["1188","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๘๘ หนังสือตั้งผู้รับฉันทะนั้น ให้ลงวันและลงลายมือชื่อผู้ถือหุ้นและให้มีรายการดังต่อไปนี้ คือ\n(๑) จำนวนหุ้นซึ่งผู้มอบฉันทะนั้นถืออยู่\n(๒) ชื่อผู้รับฉันทะ\n(๓) ตั้งผู้รับฉันทะนั้นเพื่อการประชุมครั้งคราวใด หรือตั้งไว้ชั่วระยะเวลาเพียงใด"],["1189","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๘๙ อันหนังสือตั้งผู้รับฉันทะนั้น ถ้าผู้มีชื่อรับฉันทะประสงค์จะออกเสียงในการประชุมครั้งใด ต้องนำไปวางต่อผู้เป็นประธานแต่เมื่อเริ่ม หรือก่อนเริ่มประชุมครั้งนั้น"],["1190","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๙๐ ในการประชุมใหญ่ใด ๆ ข้อมติอันเสนอให้ลงคะแนนท่านให้ตัดสินด้วยวิธีชูมือ เว้นแต่เมื่อก่อนหรือในเวลาที่แสดงผลแห่งการชูมือนั้น จะได้มีผู้ถือหุ้นสองคนเป็นอย่างน้อยติดใจร้องขอให้ลงคะแนนลับ"],["1191","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๙๑ ในการประชุมใหญ่ใด ๆ เมื่อผู้เป็นประธานแสดงว่ามติอันใดนับคะแนนชูมือเป็นอันว่าได้หรือตกก็ดี และได้จดลงไว้ในสมุดรายงานประชุมของบริษัทดังนั้นแล้ว ท่านให้ถือเป็นหลักฐานเพียงพอที่จะฟังได้ตามนั้น\nถ้ามีผู้ติดใจร้องขอให้ลงคะแนนลับไซร้ ท่านให้ถือว่าผลแห่งคะแนนลับนั้นเป็นมติของที่ประชุม"],["1192","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๙๒ ถ้ามีผู้ติดใจร้องขอโดยชอบให้ลงคะแนนลับ การลงคะแนนเช่นนั้นจะทำด้วยวิธีใดสุดแล้วแต่ผู้เป็นประธานจะสั่ง"],["1193","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๙๓ ถ้าคะแนนเสียงเท่ากัน จะเป็นในการชูมือก็ดี หรือในการลงคะแนนลับก็ดี ให้ผู้เป็นประธานในที่ประชุมมีคะแนนอีกเสียงหนึ่งเป็นเสียงชี้ขาด"],["1194","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๙๔ การใดที่กฎหมายกำหนดให้ต้องทำโดยมติพิเศษ ที่ประชุมใหญ่ต้องลงมติในเรื่องนั้นโดยคะแนนเสียงข้างมากไม่ต่ำกว่าสามในสี่ของจำนวนเสียงทั้งหมดของผู้ถือหุ้นที่มาประชุมและมีสิทธิออกเสียงลงคะแนน"],["1195","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๙๕ การประชุมใหญ่นั้นถ้าได้นัดเรียกหรือได้ประชุมกัน หรือได้ลงมติฝ่าฝืนบทบัญญัติในลักษณะนี้ก็ดี หรือฝ่าฝืนข้อบังคับของบริษัทก็ดี เมื่อกรรมการหรือผู้ถือหุ้นคนหนึ่งคนใดร้องขึ้นแล้ว ให้ศาลเพิกถอนมติของที่ประชุมใหญ่อันผิดระเบียบนั้นเสีย แต่ต้องร้องขอภายในกำหนดเดือนหนึ่งนับแต่วันลงมตินั้น"],["1196","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๙๖ อันบัญชีงบดุลนั้น ท่านว่าต้องทำอย่างน้อยครั้งหนึ่งทุกรอบสิบสองเดือน คือเมื่อเวลาสุดรอบสิบสองเดือนอันจัดว่าเป็นขวบปีในทางบัญชีเงินของบริษัทนั้น\nอนึ่ง งบดุลต้องมีรายการย่อแสดงจำนวนสินทรัพย์และหนี้สินของบริษัทกับทั้งบัญชีกำไรและขาดทุน"],["1197","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๙๗ งบดุลนั้นต้องจัดให้มีผู้สอบบัญชีคนหนึ่งหรือหลายคนตรวจสอบแล้วนำเสนอเพื่ออนุมัติในที่ประชุมใหญ่ภายในสี่เดือนนับแต่วันที่ลงในงบดุลนั้น\nอนึ่ง ให้ส่งสำเนางบดุลไปยังบุคคลทุกคนบรรดามีชื่อในทะเบียนผู้ถือหุ้นของบริษัทแต่ก่อนวันนัดประชุมใหญ่ล่วงหน้าไม่น้อยกว่าสามวัน\nนอกจากนั้นให้มีสำเนางบดุลเปิดเผยไว้ในสำนักงานของบริษัทในระหว่างเวลาเช่นว่านั้น เพื่อให้ผู้ทรงใบหุ้นชนิดออกให้แก่ผู้ถือนั้นตรวจดูได้ด้วย"],["1198","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๙๘ ในเมื่อเสนองบดุล กรรมการต้องเสนอรายงานต่อที่ประชุมใหญ่ แสดงว่าภายในรอบปีซึ่งพิจารณากันอยู่นั้นการงานของบริษัทได้จัดทำไปเป็นประการใด"],["1199","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๑๙๙ บุคคลใดประสงค์จะได้สำเนางบดุลฉบับหลังที่สุดจากบริษัทใด ๆ ก็ชอบที่จะซื้อเอาได้โดยราคาไม่เกินฉบับละยี่สิบบาท\nให้เป็นหน้าที่ของกรรมการที่จะส่งสำเนางบดุลทุกฉบับไปยังนายทะเบียนไม่ช้ากว่าเดือนหนึ่งนับแต่วันซึ่งงบดุลนั้นได้รับอนุมัติในที่ประชุมใหญ่"],["1200","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๒๐๐ การแจกเงินปันผลนั้น ต้องคิดตามส่วนจำนวนซึ่งผู้ถือหุ้นได้ส่งเงินแล้วในหุ้นหนึ่ง ๆ เว้นแต่จะได้ตกลงกันไว้เป็นอย่างอื่นในเรื่องหุ้นบุริมสิทธิ"],["1201","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๒๐๑ ห้ามมิให้ประกาศอนุญาตเงินปันผล นอกจากโดยมติของที่ประชุมใหญ่\nกรรมการอาจจ่ายเงินปันผลระวางกาลให้แก่ผู้ถือหุ้นได้เป็นครั้งเป็นคราว ในเมื่อปรากฏแก่กรรมการว่าบริษัทมีกำไรสมควรพอที่จะทำเช่นนั้น\nห้ามมิให้จ่ายเงินปันผลจากเงินประเภทอื่นนอกจากเงินกำไร ถ้าหากบริษัทขาดทุน ห้ามมิให้จ่ายเงินปันผลจนกว่าจะได้แก้ไขให้หายขาดทุนเช่นนั้น\nการจ่ายเงินปันผลนั้นให้ดำเนินการให้แล้วเสร็จภายในหนึ่งเดือนนับแต่วันที่ที่ประชุมใหญ่หรือกรรมการลงมติ แล้วแต่กรณี"],["1202","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๒๐๒ ทุกคราวที่แจกเงินปันผล บริษัทต้องจัดสรรเงินไว้เป็นทุนสำรองอย่างน้อยหนึ่งในยี่สิบส่วนของจำนวนผลกำไรซึ่งบริษัททำมาหาได้จากกิจการของบริษัท จนกว่าทุนสำรองนั้นจะมีจำนวนถึงหนึ่งในสิบของจำนวนทุนของบริษัทหรือมากกว่านั้น แล้วแต่จะได้ตกลงกำหนดไว้ในข้อบังคับของบริษัท\nถ้าได้ออกหุ้นโดยคิดเอาราคาเกินกว่าที่ปรากฏในใบหุ้นเท่าใด จำนวนที่คิดเกินนี้ท่านให้บวกทบเข้าในทุนสำรองจนกว่าทุนสำรองจะมีจำนวนเท่าถึงที่กำหนดไว้ในวรรคก่อน"],["1203","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๒๐๓ ถ้าจ่ายเงินปันผลไปโดยฝ่าฝืนความในมาตราทั้งสองซึ่งกล่าวมาไซร้ เจ้าหนี้ทั้งหลายของบริษัทชอบที่จะเรียกเอาเงินจำนวนซึ่งได้แจกไปคืนมายังบริษัทได้ แต่ว่าถ้าผู้ถือหุ้นคนใดได้รับเงินปันผลไปแล้วโดยสุจริต ท่านว่าจะกลับบังคับให้เขาจำคืนนั้นหาได้ไม่"],["1204","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๒๐๔ การบอกกล่าวว่าจะปันผลอย่างใดๆ อันได้อนุญาตให้จ่ายนั้น ให้บริษัทมีจดหมายบอกกล่าวไปยังตัวผู้ถือหุ้นที่ปรากฏชื่ออยู่ในทะเบียนผู้ถือหุ้นทุกคน แต่ในกรณีที่บริษัทมีหุ้นชนิดที่มีใบหุ้นออกให้แก่ผู้ถือ ให้โฆษณาในหนังสือพิมพ์แห่งท้องที่อย่างน้อยหนึ่งคราวด้วย"],["1205","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๒๐๕ เงินปันผลนั้น แม้จะค้างจ่ายอยู่ ท่านว่าหาอาจจะคิดเอาดอกเบี้ยแก่บริษัทได้ไม่"],["1206","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๒๐๖ กรรมการต้องจัดให้ถือบัญชีซึ่งกล่าวต่อไปนี้ไว้ให้ถูกถ้วนจริง ๆ คือ\n(๑) จำนวนเงินที่บริษัทได้รับและได้จ่าย ทั้งรายการอันเป็นเหตุให้รับหรือจ่ายเงินทุกรายไป\n(๒) สินทรัพย์และหนี้สินของบริษัท"],["1207","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๓ วิธีจัดการบริษัทจำกัด","มาตรา ๑๒๐๗ กรรมการต้องจัดให้จดบันทึกรายงานการประชุม และข้อมติทั้งหมดของที่ประชุมผู้ถือหุ้นและของที่ประชุมกรรมการลงไว้ในสมุดโดยถูกต้อง สมุดนี้ให้เก็บรักษาไว้ ณ สำนักงานที่ได้จดทะเบียนของบริษัท บันทึกเช่นนั้นอย่างหนึ่งอย่างใด เมื่อได้ลงลายมือชื่อของผู้เป็นประธานแห่งการประชุมซึ่งได้ลงมติ หรือซึ่งได้ดำเนินการงานประชุมก็ดี หรือได้ลงลายมือชื่อของผู้เป็นประธานแห่งการประชุมถัดจากครั้งนั้นมาก็ดี ท่านให้สันนิษฐานไว้ก่อนว่าเป็นหลักฐานอันถูกต้องแห่งข้อความที่ได้จดบันทึกลงในสมุดนั้น ๆ และให้สันนิษฐานไว้ก่อนว่าการลงมติและการดำเนินของที่ประชุมอันได้จดบันทึกไว้นั้นได้เป็นไปโดยชอบ\nผู้ถือหุ้นคนใดจะขอตรวจดูเอกสารดังกล่าวมาข้างต้นในเวลาใดเวลาหนึ่งระหว่างเวลาทำการงานก็ได้"],["1208","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๔ การสอบบัญชี","มาตรา ๑๒๐๘ ผู้สอบบัญชีนั้น จะเป็นผู้ถือหุ้นของบริษัทก็ได้ แต่บุคคลผู้มีส่วนได้เสียในการงานที่บริษัททำโดยสถานอื่นอย่างหนึ่งอย่างใด นอกจากเป็นแต่ผู้ถือหุ้นในบริษัทเท่านั้นแล้ว ท่านว่าจะเลือกเอามาเป็นตำแหน่งผู้สอบบัญชีหาได้ไม่ กรรมการก็ดี หรือผู้อื่นซึ่งเป็นตัวแทนหรือเป็นลูกจ้างของบริษัทก็ดี เวลาอยู่ในตำแหน่งนั้น ๆ ก็จะเลือกเอามาเป็นตำแหน่งผู้สอบบัญชีของบริษัทหาได้ไม่"],["1209","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๔ การสอบบัญชี","มาตรา ๑๒๐๙ ผู้สอบบัญชีนั้น ให้ที่ประชุมสามัญเลือกตั้งทุกปี\nผู้สอบบัญชีคนซึ่งออกไปนั้นจะเลือกกลับเข้ารับตำแหน่งอีกก็ได้"],["1210","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๔ การสอบบัญชี","มาตรา ๑๒๑๐ ผู้สอบบัญชีควรจะได้สินจ้างเท่าใด ให้ที่ประชุมใหญ่กำหนด"],["1211","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๔ การสอบบัญชี","มาตรา ๑๒๑๑ ถ้ามีตำแหน่งว่างลงในจำนวนผู้สอบบัญชี ให้กรรมการนัดเรียกประชุมวิสามัญ เพื่อให้เลือกตั้งขึ้นใหม่ให้ครบจำนวน"],["1212","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๔ การสอบบัญชี","มาตรา ๑๒๑๒ ถ้ามิได้เลือกตั้งผู้สอบบัญชีโดยวิธีดังกล่าวมา เมื่อผู้ถือหุ้นไม่น้อยกว่าห้าคนร้องขอ ก็ให้ศาลตั้งผู้สอบบัญชีประจำปีนั้น และกำหนดสินจ้างให้ด้วย"],["1213","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๔ การสอบบัญชี","มาตรา ๑๒๑๓ ให้ผู้สอบบัญชีทุกคนเข้าตรวจสอบสรรพสมุดและบัญชีของบริษัทในเวลาอันสมควรได้ทุกเมื่อ และในการอันเกี่ยวด้วยสมุดและบัญชีเช่นนั้นให้ไต่ถามสอบสวนกรรมการ หรือผู้อื่น ๆ ซึ่งเป็นตัวแทน หรือเป็นลูกจ้างของบริษัทได้ไม่ว่าคนหนึ่งคนใด"],["1214","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๔ การสอบบัญชี","มาตรา ๑๒๑๔ ผู้สอบบัญชีต้องทำรายงานว่าด้วยงบดุลและบัญชียื่นต่อที่ประชุมสามัญ\nผู้สอบบัญชีต้องแถลงในรายงานเช่นนั้นด้วยว่าตนเห็นว่างบดุลได้ทำโดยถูกถ้วนควรฟังว่าสำแดงให้เห็นการงานของบริษัทที่เป็นอยู่ตามจริงและถูกต้องหรือไม่"],["1215","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๕ การตรวจ","มาตรา ๑๒๑๕ เมื่อผู้ถือหุ้นในบริษัทมีจำนวนรวมกันไม่น้อยกว่าหนึ่งในห้าของจำนวนหุ้นทั้งหมด ทำเรื่องราวร้องขอไซร้ ให้รัฐมนตรีเจ้าหน้าที่ตั้งผู้ตรวจอันทรงความสามารถ จะเป็นคนเดียวหรือหลายคนก็ตามไปตรวจการงานของบริษัทจำกัดนั้นและทำรายงานยื่นให้ทราบ\nก่อนที่จะตั้งผู้ตรวจเช่นนั้น รัฐมนตรีจะบังคับให้คนทั้งหลายผู้ยื่นเรื่องราววางประกัน เพื่อรับออกเงินค่าใช้สอยในการตรวจนั้นก็ได้"],["1216","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๕ การตรวจ","มาตรา ๑๒๑๖ กรรมการก็ดี ลูกจ้างและตัวแทนของบริษัทก็ดี จำต้องส่งสรรพสมุดและเอกสารทั้งปวงซึ่งตนเก็บรักษาหรืออยู่ในอำนาจแห่งตนนั้นให้แก่ผู้ตรวจ\nผู้ตรวจคนหนึ่งคนใดจะให้กรรมการ ลูกจ้าง และตัวแทนของบริษัทสาบานตัวแล้วสอบถามคำให้การในเรื่องอันเนื่องด้วยการงานของบริษัทนั้นก็ได้"],["1217","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๕ การตรวจ","มาตรา ๑๒๑๗ ผู้ตรวจต้องทำรายงานยื่น และรายงานนั้นจะเขียนหรือตีพิมพ์สุดแต่รัฐมนตรีเจ้าหน้าที่จะบัญชา สำเนารายงานนั้นให้รัฐมนตรีส่งไปยังสำนักงานบริษัทซึ่งได้จดทะเบียนไว้ กับทั้งส่งแก่ผู้ถือหุ้นซึ่งยื่นเรื่องราวขอให้ตรวจนั้นด้วย"],["1218","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๕ การตรวจ","มาตรา ๑๒๑๘ ค่าใช้สอยในการตรวจเช่นนี้ ผู้ยื่นเรื่องราวขอให้ตรวจต้องใช้ทั้งสิ้น เว้นแต่ถ้าบริษัทในคราวประชุมใหญ่ครั้งแรกเมื่อตรวจสำเร็จลงแล้วได้ยินยอมว่าจะจ่ายจากสินทรัพย์ของบริษัทนั้น"],["1219","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๕ การตรวจ","มาตรา ๑๒๑๙ รัฐมนตรีเจ้าหน้าที่โดยลำพังตนเอง จะตั้งผู้ตรวจคนเดียวหรือหลายคนให้ไปตรวจการของบริษัทเพื่อทำรายงานยื่นต่อรัฐบาลก็ได้ การตั้งผู้ตรวจเช่นว่ามานี้จะพึงมีเมื่อใดสุดแล้วแต่รัฐมนตรีจะเห็นสมควร"],["1220","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๖ การเพิ่มทุนและลดทุน","มาตรา ๑๒๒๐ บริษัทจำกัดอาจเพิ่มทุนของบริษัทขึ้นได้ด้วยออกหุ้นใหม่โดยมติพิเศษของประชุมผู้ถือหุ้น"],["1221","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๖ การเพิ่มทุนและลดทุน","มาตรา ๑๒๒๑ บริษัทจำกัดจะออกหุ้นใหม่ให้เหมือนหนึ่งว่าได้ใช้เต็มค่าแล้ว หรือได้ใช้แต่บางส่วนแล้วด้วยอย่างอื่นนอกจากให้ใช้เป็นตัวเงินนั้นไม่ได้ เว้นแต่จะทำตามมติพิเศษของประชุมผู้ถือหุ้น"],["1222","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๖ การเพิ่มทุนและลดทุน","มาตรา ๑๒๒๒ บรรดาหุ้นที่ออกใหม่นั้น ต้องเสนอให้แก่ผู้ถือหุ้นทั้งหลายตามส่วนจำนวนหุ้นซึ่งเขาถืออยู่\nคำเสนอเช่นนี้ ต้องทำเป็นหนังสือบอกกล่าวไปยังผู้ถือหุ้นทุก ๆ คนระบุจำนวนหุ้นให้ทราบว่าผู้นั้นชอบที่จะซื้อได้กี่หุ้น และให้กำหนดวันว่าถ้าพ้นวันนั้นไปมิได้มีคำสนองมาแล้วจะถือว่าเป็นอันไม่รับซื้อ\nเมื่อวันที่กำหนดล่วงไปแล้วก็ดี หรือผู้ถือหุ้นได้บอกมาว่าไม่รับซื้อหุ้นนั้นก็ดีกรรมการจะเอาหุ้นเช่นนั้นขายให้แก่ผู้ถือหุ้นคนอื่นหรือจะรับซื้อไว้เองก็ได้"],["1223","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๖ การเพิ่มทุนและลดทุน","มาตรา ๑๒๒๓ หนังสือบอกกล่าวที่เสนอให้ผู้ถือหุ้นซื้อหุ้นใหม่นั้น ต้องลงวันเดือนปีและลายมือชื่อของกรรมการ"],["1224","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๖ การเพิ่มทุนและลดทุน","มาตรา ๑๒๒๔ บริษัทจำกัดจะลดทุนของบริษัทลงด้วยลดมูลค่าแต่ละหุ้น ๆ ให้ต่ำลง หรือลดจำนวนหุ้นให้น้อยลงโดยมติพิเศษของประชุมผู้ถือหุ้นก็ได้"],["1225","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๖ การเพิ่มทุนและลดทุน","มาตรา ๑๒๒๕ อันทุนของบริษัทนั้นจะลดลงไปให้ถึงต่ำกว่าจำนวนหนึ่งในสี่ของทุนทั้งหมดหาได้ไม่"],["1226","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๖ การเพิ่มทุนและลดทุน","มาตรา ๑๒๒๖ เมื่อบริษัทประสงค์จะลดทุน ต้องโฆษณาความประสงค์นั้นในหนังสือพิมพ์แห่งท้องที่อย่างน้อยหนึ่งคราว และต้องมีหนังสือบอกกล่าวไปยังบรรดาผู้ซึ่งบริษัทรู้ว่าเป็นเจ้าหนี้ของบริษัท บอกให้ทราบรายการซึ่งประสงค์จะลดทุนลงและขอให้เจ้าหนี้ผู้มีข้อคัดค้านอย่างหนึ่งอย่างใดในการลดทุนนั้น ส่งคำคัดค้านไปภายในสามสิบวันนับแต่วันที่บอกกล่าวนั้น\nถ้าไม่มีผู้ใดคัดค้านภายในกำหนดเวลาสามสิบวัน ก็ให้พึงถือว่าไม่มีการคัดค้าน\nถ้าหากมีเจ้าหนี้คัดค้าน บริษัทจะจัดการลดทุนลงไม่ได้ จนกว่าจะได้ใช้หนี้หรือให้ประกันเพื่อหนี้รายนั้นแล้ว"],["1227","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๖ การเพิ่มทุนและลดทุน","มาตรา ๑๒๒๗ ถ้ามีเจ้าหนี้คนหนึ่งคนใดละเลยเสียมิได้คัดค้านในการที่บริษัทจะลดทุนลง เพราะเหตุว่าตนไม่ทราบความ และเหตุที่ไม่ทราบนั้นมิได้เป็นเพราะความผิดของเจ้าหนี้คนนั้นแต่อย่างใดไซร้ ท่านว่าผู้ถือหุ้นทั้งหลายบรรดาที่ได้รับเงินคืนไปตามส่วนที่ลดหุ้นลงนั้น ยังคงจะต้องรับผิดต่อเจ้าหนี้เช่นนั้นเพียงจำนวนที่ได้รับทุนคืนไปชั่วเวลาสองปีนับแต่วันที่ได้จดทะเบียนการลดทุนนั้น"],["1228","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๖ การเพิ่มทุนและลดทุน","มาตรา ๑๒๒๘ มติพิเศษซึ่งอนุญาตให้เพิ่มทุนหรือลดทุนนั้น บริษัทต้องจดทะเบียนภายในสิบสี่วันนับแต่วันที่ได้ลงมตินั้น"],["1229","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๗ หุ้นกู้","มาตรา ๑๒๒๙ บริษัทจะออกหุ้นกู้ไม่ได้"],["1230","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๗ หุ้นกู้","มาตรา ๑๒๓๐ (ยกเลิก)"],["1231","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๗ หุ้นกู้","มาตรา ๑๒๓๑ (ยกเลิก)"],["1232","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๗ หุ้นกู้","มาตรา ๑๒๓๒ (ยกเลิก)"],["1233","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๗ หุ้นกู้","มาตรา ๑๒๓๓ (ยกเลิก)"],["1234","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๗ หุ้นกู้","มาตรา ๑๒๓๔ (ยกเลิก)"],["1235","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๗ หุ้นกู้","มาตรา ๑๒๓๕ (ยกเลิก)"],["1236","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๘ เลิกบริษัทจำกัด","มาตรา ๑๒๓๖ อันบริษัทจำกัดย่อมเลิกกันด้วยเหตุดังจะกล่าวต่อไปนี้ คือ\n(๑) ถ้าในข้อบังคับของบริษัทมีกำหนดกรณีอันใดเป็นเหตุที่จะเลิกกันเมื่อมีกรณีนั้น\n(๒) ถ้าบริษัทได้ตั้งขึ้นไว้เฉพาะกำหนดกาลใด เมื่อสิ้นกำหนดกาลนั้น\n(๓) ถ้าบริษัทได้ตั้งขึ้นเฉพาะเพื่อทำกิจการอย่างหนึ่งอย่างใดแต่อย่างเดียว เมื่อเสร็จการนั้น\n(๔) เมื่อมีมติพิเศษให้เลิก\n(๕) เมื่อบริษัทล้มละลาย"],["1237","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๘ เลิกบริษัทจำกัด","มาตรา ๑๒๓๗ นอกจากนี้ศาลอาจสั่งให้เลิกบริษัทจำกัดด้วยเหตุต่อไปนี้ คือ\n(๑) ถ้าทำผิดในการยื่นรายงานประชุมตั้งบริษัท หรือทำผิดในการประชุมตั้งบริษัท\n(๒) ถ้าบริษัทไม่เริ่มทำการภายในปีหนึ่งนับแต่วันจดทะเบียน หรือหยุดทำการถึงปีหนึ่งเต็ม\n(๓) ถ้าการค้าของบริษัททำไปก็มีแต่ขาดทุนอย่างเดียว และไม่มีทางหวังว่าจะกลับฟื้นตัวได้\n(๔) ถ้าจำนวนผู้ถือหุ้นลดน้อยลงจนเหลือเพียงคนเดียว\n(๕) เมื่อมีเหตุอื่นใดทำให้บริษัทนั้นไม่สามารถที่จะดำรงคงอยู่ต่อไปได้\nแต่อย่างไรก็ดี ในกรณีทำผิดในการยื่นรายงานประชุมตั้งบริษัท หรือทำผิดในการประชุมตั้งบริษัท ศาลจะสั่งให้ยื่นรายงานประชุมตั้งบริษัท หรือให้มีการประชุมตั้งบริษัทแทนสั่งให้เลิกบริษัทก็ได้ แล้วแต่จะเห็นควร"],["1238","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๙ การควบรวมบริษัทจำกัด","มาตรา ๑๒๓๘ บริษัทจำกัดจะควบรวมกันได้ โดยใช้มติพิเศษ\nบริษัทตั้งแต่สองบริษัทขึ้นไป จะควบรวมในลักษณะใดลักษณะหนึ่งดังต่อไปนี้\n(๑) ควบรวมกันโดยเป็นบริษัทขึ้นใหม่ และบริษัทที่มาควบรวมกันต่างหมดสภาพการเป็นนิติบุคคล\n(๒) ควบรวมกันโดยบริษัทหนึ่งบริษัทใดยังคงมีสภาพเป็นนิติบุคคล และบริษัทอื่นที่ควบรวมกันหมดสภาพจากการเป็นนิติบุคคล"],["1239","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๙ การควบรวมบริษัทจำกัด","มาตรา ๑๒๓๙ มติพิเศษซึ่งวินิจฉัยให้ควบรวมบริษัทจำกัด บริษัทต้องนำไปจดทะเบียนภายในสิบสี่วันนับตั้งแต่วันลงมติ"],["1239/1","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๙ การควบรวมบริษัทจำกัด","มาตรา ๑๒๓๙/๑ เมื่อมีมติพิเศษให้ควบรวมบริษัทแล้ว แต่มีผู้ถือหุ้นที่เข้าร่วมประชุมคัดค้านการควบรวมบริษัท บริษัทต้องจัดให้มีผู้ซื้อหุ้นของผู้ถือหุ้นดังกล่าวในราคาที่ตกลงกัน หรือในกรณีที่ไม่สามารถตกลงกันได้ให้ใช้ราคาตามที่ผู้ประเมินราคาเป็นผู้กำหนด ถ้าผู้ถือหุ้นนั้นไม่ยอมขายภายในสิบสี่วันนับแต่วันที่ได้รับคำเสนอขอซื้อ ให้บริษัทดำเนินการควบรวมบริษัทต่อไปได้ และให้ถือว่าผู้ถือหุ้นดังกล่าวนั้นเป็นผู้ถือหุ้นของบริษัทที่ควบรวม\nการแต่งตั้งผู้ประเมินราคาตามวรรคหนึ่งให้เป็นไปตามหลักเกณฑ์ วิธีการ และเงื่อนไขที่กำหนดในกฎกระทรวง"],["1240","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๙ การควบรวมบริษัทจำกัด","มาตรา ๑๒๔๐ เมื่อมีมติพิเศษให้ควบรวมบริษัทแล้ว บริษัทต้องมีหนังสือบอกกล่าวมติดังกล่าวภายในสิบสี่วันนับแต่วันที่ได้มีมติไปยังเจ้าหนี้ของบริษัทตามรายชื่อที่ปรากฏในบัญชีของบริษัท ณ วันที่ที่ประชุมผู้ถือหุ้นลงมติให้ควบรวมบริษัทโดยกำหนดเวลาให้ส่งคำคัดค้านภายในหนึ่งเดือนนับแต่วันที่ได้รับหนังสือบอกกล่าวมตินั้น และให้บริษัทโฆษณามตินั้นทางหนังสือพิมพ์รายวันที่แพร่หลายภายในกำหนดเวลาสิบสี่วันนั้นด้วย\nถ้ามีการคัดค้าน บริษัทจะควบรวมมิได้จนกว่าจะได้ชำระหนี้หรือได้ให้ประกันเพื่อหนี้นั้นแล้ว"],["1240/1","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๙ การควบรวมบริษัทจำกัด","มาตรา ๑๒๔๐/๑ เมื่อได้ดำเนินการตามมาตรา ๑๒๓๙ และมาตรา ๑๒๔๐ แล้ว ให้กรรมการบริษัทที่จะควบรวมเรียกประชุมผู้ถือหุ้นของบริษัทนั้น ๆ ให้มาประชุมร่วมกันเพื่อพิจารณาในเรื่อง ดังต่อไปนี้\n(๑) ชื่อของบริษัทที่ควบรวม โดยจะใช้ชื่อใหม่หรือจะใช้ชื่อเดิมของบริษัทใดบริษัทหนึ่งที่จะควบรวมก็ได้\n(๒) วัตถุประสงค์ของบริษัทที่ควบรวม\n(๓) ทุนเรือนหุ้นของบริษัทที่ควบรวม โดยจะต้องมีทุนเรือนหุ้นไม่น้อยกว่าทุนเรือนหุ้นของบริษัทเดิมอันมาควบรวม\n(๔) จัดสรรหุ้นของบริษัทที่ควบรวมให้แก่ผู้ถือหุ้น ทั้งนี้ มิให้นำมาตรา ๑๒๒๒ มาใช้บังคับ\n(๕) หนังสือบริคณห์สนธิของบริษัทที่ควบรวม\n(๖) ข้อบังคับของบริษัทที่ควบรวม\n(๗) เลือกตั้งกรรมการบริษัทที่ควบรวม\n(๘) เลือกตั้งผู้สอบบัญชีบริษัทที่ควบรวม\n(๙) เรื่องอื่น ๆ ที่จำเป็นในการควบรวมบริษัท ถ้าหากมี\nทั้งนี้ ต้องดำเนินการประชุมให้เสร็จสิ้นภายในหกเดือนนับแต่วันที่บริษัทใดบริษัทหนึ่งได้ลงมติให้ควบรวมเป็นรายหลังสุด เว้นแต่ที่ประชุมตามมาตรานี้ลงมติให้ขยายเวลาออกไปแต่เมื่อรวมเวลาทั้งหมดแล้วต้องไม่เกินหนึ่งปี"],["1240/2","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๙ การควบรวมบริษัทจำกัด","มาตรา ๑๒๔๐/๒ ในการประชุมเพื่อพิจารณาเรื่องต่าง ๆ ร่วมกันตามมาตรา ๑๒๔๐/๑ ให้ประชุมในท้องที่อันเป็นที่ตั้งสำนักงานแห่งใหญ่ของบริษัทใดบริษัทหนึ่งที่จะควบรวม หรือในจังหวัดที่ใกล้เคียงที่ตั้งของสำนักงานแห่งใหญ่ของบริษัทใดบริษัทหนึ่งที่จะควบรวม โดย\n(๑) ต้องมีผู้ถือหุ้นซึ่งมีหุ้นนับรวมกันได้ไม่น้อยกว่ากึ่งหนึ่งของจำนวนหุ้นทั้งหมดของแต่ละบริษัทที่จะควบรวมมาประชุมจึงจะเป็นองค์ประชุม\n(๒) ให้ผู้ถือหุ้นซึ่งมาประชุมเลือกผู้ถือหุ้นคนหนึ่งเป็นประธาน\n(๓) การวินิจฉัยชี้ขาดของที่ประชุม ให้ถือเสียงข้างมากของผู้ถือหุ้นซึ่งมาประชุมตาม (๑) เว้นแต่จะตกลงกันเป็นอย่างอื่น"],["1240/3","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๙ การควบรวมบริษัทจำกัด","มาตรา ๑๒๔๐/๓ คณะกรรมการบริษัทเดิมต้องส่งมอบกิจการ ทรัพย์สิน บัญชี เอกสาร และหลักฐานต่าง ๆ ของบริษัทให้แก่คณะกรรมการบริษัทที่ควบรวมแล้วภายในเจ็ดวันนับแต่วันที่เสร็จสิ้น การประชุมตามมาตรา ๑๒๔๐/๑"],["1241","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๙ การควบรวมบริษัทจำกัด","มาตรา ๑๒๔๑ คณะกรรมการบริษัทที่ควบรวมต้องขอจดทะเบียนการควบรวมบริษัทพร้อมกับยื่นหนังสือบริคณห์สนธิ และข้อบังคับที่ที่ประชุมตามมาตรา ๑๒๔๐/๑ ได้อนุมัติแล้วต่อนายทะเบียนภายในสิบสี่วันนับแต่วันที่เสร็จสิ้นการประชุมตามมาตรา ๑๒๔๐/๑"],["1242","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๙ การควบรวมบริษัทจำกัด","มาตรา ๑๒๔๒ เมื่อนายทะเบียนรับจดทะเบียนการควบรวมบริษัทแล้ว ให้นายทะเบียนหมายเหตุไว้ในทะเบียนดังนี้\n(๑) ในกรณีที่ควบรวมกันเป็นบริษัทขึ้นใหม่ ให้หมายเหตุว่าบริษัทเดิมที่ควบรวมกันนั้นหมดสภาพจากการเป็นนิติบุคคล\n(๒) ในกรณีที่ควบรวมกันโดยมีบริษัทใดบริษัทหนึ่งยังคงมีสภาพเป็นนิติบุคคล ให้หมายเหตุว่าบริษัทอื่นที่เหลือนั้นหมดสภาพจากการเป็นนิติบุคคล"],["1243","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๙ การควบรวมบริษัทจำกัด","มาตรา ๑๒๔๓ บริษัทที่ควบรวมนี้ย่อมได้ไปทั้งทรัพย์สิน หนี้ สิทธิ หน้าที่และความรับผิดชอบบรรดามีอยู่แก่บริษัทเดิมอันได้มาควบรวมนั้นทั้งสิ้น"],["1244","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑๐ หนังสือบอกกล่าว","มาตรา ๑๒๔๔ อันหนังสือบอกกล่าวซึ่งบริษัทจะพึงส่งถึงผู้ถือหุ้นนั้น ถ้าว่าได้ส่งมอบให้แล้วถึงตัวก็ดี หรือส่งไปโดยทางไปรษณีย์สลักหลังถึงสำนักอาศัยของผู้ถือหุ้นดังที่ปรากฏในทะเบียนของบริษัทแล้วก็ดี ท่านให้ถือว่าเป็นอันได้ส่งชอบแล้ว"],["1245","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑๐ หนังสือบอกกล่าว","มาตรา ๑๒๔๕ หนังสือบอกกล่าวใด ๆ เมื่อได้ส่งโดยทางไปรษณีย์สลักหลังถูกต้องแล้ว ท่านให้ถือว่าเป็นอันได้ส่งถึงมือผู้รับในเวลาที่หนังสือเช่นนั้นจะควรไปถึงได้ตามทางการปกติแห่งไปรษณีย์"],["1246","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑๑ การถอนทะเบียนบริษัทร้าง","มาตรา ๑๒๔๖ (ยกเลิก)"],["1246/1","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑๒ การแปรสภาพห้างหุ้นส่วนจดทะเบียนและห้างหุ้นส่วนจำกัด เป็นบริษัทจำกัด","มาตรา ๑๒๔๖/๑ ห้างหุ้นส่วนจดทะเบียนหรือห้างหุ้นส่วนจำกัดอาจแปรสภาพเป็นบริษัทจำกัดได้ โดยความยินยอมของผู้เป็นหุ้นส่วนทุกคนและดำเนินการ ดังต่อไปนี้\n(๑) แจ้งความยินยอมของผู้เป็นหุ้นส่วนที่จะให้แปรสภาพห้างหุ้นส่วนเป็นบริษัทจำกัดเป็นหนังสือต่อนายทะเบียนภายในสิบสี่วันนับแต่วันที่ผู้เป็นหุ้นส่วนทุกคนให้ความยินยอม\n(๒) ประกาศโฆษณาในหนังสือพิมพ์แห่งท้องที่อย่างน้อยหนึ่งคราว และมีหนังสือบอกกล่าวไปยังบรรดาผู้ซึ่งรู้ว่าเป็นเจ้าหนี้ของห้างหุ้นส่วนบอกให้ทราบรายการที่ประสงค์จะแปรสภาพห้างหุ้นส่วนเป็นบริษัท และขอให้เจ้าหนี้ผู้มีข้อคัดค้านอย่างหนึ่งอย่างใดในการแปรสภาพเป็นบริษัทจำกัดนั้น ส่งคำคัดค้านไปภายในสามสิบวันนับแต่วันที่บอกกล่าวนั้น\nถ้ามีการคัดค้าน ห้างหุ้นส่วนนั้นจะแปรสภาพมิได้จนกว่าจะได้ชำระหนี้หรือให้ประกันเพื่อหนี้นั้นแล้ว"],["1246/2","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑๒ การแปรสภาพห้างหุ้นส่วนจดทะเบียนและห้างหุ้นส่วนจำกัด เป็นบริษัทจำกัด","มาตรา ๑๒๔๖/๒ ในกรณีไม่มีการคัดค้านหรือมีการคัดค้านแต่ห้างหุ้นส่วนได้ชำระหนี้หรือให้ประกันเพื่อหนี้นั้นแล้ว ผู้เป็นหุ้นส่วนทุกคนต้องประชุมเพื่อให้ความยินยอมและดำเนินการในเรื่อง ดังต่อไปนี้\n(๑) จัดทำหนังสือบริคณห์สนธิและข้อบังคับของบริษัท (ถ้ามี)\n(๒) กำหนดจำนวนทุนเรือนหุ้นของบริษัท ซึ่งต้องเท่ากับส่วนลงหุ้นของผู้เป็นหุ้นส่วนทุกคนในห้างหุ้นส่วน และกำหนดจำนวนหุ้นของบริษัทที่จะตกได้แก่หุ้นส่วนแต่ละคน\n(๓) กำหนดจำนวนเงินที่ได้ใช้แล้วในแต่ละหุ้น ซึ่งต้องไม่น้อยกว่าร้อยละยี่สิบห้าแห่งมูลค่าของหุ้นแต่ละหุ้นที่ตั้งไว้\n(๔) กำหนดจำนวนหุ้นสามัญหรือหุ้นบุริมสิทธิ รวมทั้งกำหนดสภาพและบุริมสิทธิของหุ้นซึ่งจะออกและจัดสรรหุ้นให้แก่ผู้เป็นหุ้นส่วน\n(๕) แต่งตั้งกรรมการและกำหนดอำนาจของกรรมการ\n(๖) แต่งตั้งผู้สอบบัญชี\n(๗) ดำเนินการในเรื่องอื่นๆ ที่จำเป็นในการแปรสภาพ\nในการดำเนินการตามวรรคหนึ่ง ให้นำบทบัญญัติเกี่ยวกับบริษัทจำกัดว่าด้วยการนั้นๆ มาใช้บังคับโดยอนุโลม"],["1246/3","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑๒ การแปรสภาพห้างหุ้นส่วนจดทะเบียนและห้างหุ้นส่วนจำกัด เป็นบริษัทจำกัด","มาตรา ๑๒๔๖/๓ หุ้นส่วนผู้จัดการเดิมต้องส่งมอบกิจการ ทรัพย์สิน บัญชีเอกสารและหลักฐานต่าง ๆ ของห้างหุ้นส่วนให้แก่คณะกรรมการบริษัท ภายในสิบสี่วันนับแต่วันที่ผู้เป็นหุ้นส่วนได้ให้ความยินยอมและดำเนินการในเรื่องต่างๆ ตามมาตรา ๑๒๔๖/๒ เสร็จสิ้นแล้ว\nในกรณีที่ผู้เป็นหุ้นส่วนยังไม่ได้ชำระเงินค่าหุ้นหรือชำระเงินค่าหุ้นไม่ครบร้อยละยี่สิบห้าของมูลค่าหุ้น หรือยังไม่ได้โอนกรรมสิทธิ์ทรัพย์สิน หรือทำเอกสารหลักฐานการใช้สิทธิต่างๆ ให้แก่คณะกรรมการ ให้คณะกรรมการบริษัทมีหนังสือแจ้งให้ผู้เป็นหุ้นส่วนชำระเงินค่าหุ้น โอนกรรมสิทธิ์หรือทำเอกสารหลักฐานการใช้สิทธิต่างๆ แล้วแต่กรณี ให้แก่คณะกรรมการภายในสามสิบวันนับแต่วันที่ได้รับหนังสือแจ้ง"],["1246/4","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑๒ การแปรสภาพห้างหุ้นส่วนจดทะเบียนและห้างหุ้นส่วนจำกัด เป็นบริษัทจำกัด","มาตรา ๑๒๔๖/๔ คณะกรรมการบริษัทต้องขอจดทะเบียนการแปรสภาพเป็นบริษัทจำกัดต่อนายทะเบียน ภายในสิบสี่วันนับแต่วันที่ได้ดำเนินการตามมาตรา ๑๒๔๖/๓ ครบถ้วนแล้ว\nในการขอจดทะเบียนแปรสภาพเป็นบริษัทจำกัด คณะกรรมการต้องยื่นรายงานการประชุมที่ผู้เป็นหุ้นส่วนได้ร่วมกันพิจารณาให้ความยินยอมและดำเนินการแปรสภาพห้างหุ้นส่วนเป็นบริษัทจำกัดตามมาตรา ๑๒๔๖/๒ หนังสือบริคณห์สนธิ ข้อบังคับ และบัญชีรายชื่อผู้ถือหุ้น พร้อมกับการขอจดทะเบียนด้วย"],["1246/5","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑๒ การแปรสภาพห้างหุ้นส่วนจดทะเบียนและห้างหุ้นส่วนจำกัด เป็นบริษัทจำกัด","มาตรา ๑๒๔๖/๕ เมื่อนายทะเบียนได้รับจดทะเบียนการแปรสภาพห้างหุ้นส่วนจดทะเบียนหรือห้างหุ้นส่วนจำกัดเป็นบริษัทจำกัดแล้ว ให้ห้างหุ้นส่วนจดทะเบียน หรือห้างหุ้นส่วนจำกัดเดิมหมดสภาพการเป็นห้างหุ้นส่วนจดทะเบียนหรือห้างหุ้นส่วนจำกัดตามประมวลกฎหมายแพ่งและพาณิชย์และให้นายทะเบียนหมายเหตุไว้ในทะเบียน"],["1246/6","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑๒ การแปรสภาพห้างหุ้นส่วนจดทะเบียนและห้างหุ้นส่วนจำกัด เป็นบริษัทจำกัด","มาตรา ๑๒๔๖/๖ เมื่อห้างหุ้นส่วนจดทะเบียนหรือห้างหุ้นส่วนจำกัดได้จดทะเบียนแปรสภาพเป็นบริษัทจำกัดแล้ว บริษัทย่อมได้ไปทั้งทรัพย์สิน หนี้ สิทธิ และความรับผิดของห้างหุ้นส่วนจดทะเบียนหรือห้างหุ้นส่วนจำกัดเดิมทั้งหมด"],["1246/7","b3t22","หมวด ๔ บริษัทจำกัด","ส่วนที่ ๑๒ การแปรสภาพห้างหุ้นส่วนจดทะเบียนและห้างหุ้นส่วนจำกัด เป็นบริษัทจำกัด","มาตรา ๑๒๔๖/๗ เมื่อจดทะเบียนแปรสภาพเป็นบริษัทจำกัดแล้ว หากบริษัทไม่สามารถชำระหนี้ที่รับมาจากห้างหุ้นส่วนที่แปรสภาพได้ ให้เจ้าหนี้บังคับชำระหนี้เอาจากผู้เป็นหุ้นส่วนในห้างหุ้นส่วนที่แปรสภาพได้ตามที่ผู้เป็นหุ้นส่วนจะต้องรับผิดในหนี้ของห้างหุ้นส่วน"],["1247","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๔๗ การชำระบัญชีห้างหุ้นส่วนจดทะเบียนหรือห้างหุ้นส่วนจำกัด หรือบริษัทจำกัดซึ่งล้มละลายนั้น ให้จัดทำไปตามบทกฎหมายลักษณะล้มละลายที่คงใช้อยู่ตามแต่จะทำได้\nรัฐมนตรีเจ้าหน้าที่จะออกกฎกระทรวงว่าด้วยการชำระบัญชีห้างหุ้นส่วนและบริษัท และกำหนดอัตราค่าฤชาธรรมเนียมก็ออกได้"],["1248","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๔๘ เมื่อกล่าวถึงประชุมใหญ่ในหมวดนี้ ท่านหมายความดังต่อไปนี้ คือ\n(๑) ถ้าเกี่ยวกับห้างหุ้นส่วนจดทะเบียนและห้างหุ้นส่วนจำกัด ก็คือการประชุมหุ้นส่วนทั้งปวงซึ่งอาศัยคะแนนเสียงข้างมากเป็นใหญ่ในการวินิจฉัย\n(๒) ถ้าเกี่ยวกับบริษัทจำกัด ก็คือการประชุมใหญ่ตามที่ได้บัญญัติไว้ในมาตรา ๑๑๗๑"],["1249","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๔๙ ห้างหุ้นส่วนก็ดี บริษัทก็ดี แม้ว่าจะได้เลิกกันแล้ว ก็ให้พึงถือว่ายังคงตั้งอยู่ตราบเท่าเวลาที่จำเป็นเพื่อการชำระบัญชี"],["1250","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๕๐ หน้าที่ของผู้ชำระบัญชี คือชำระสะสางการงานของห้างหุ้นส่วนหรือบริษัทนั้นให้เสร็จไป กับจัดการใช้หนี้เงินและแจกจำหน่ายสินทรัพย์ของห้างหุ้นส่วนหรือบริษัทนั้น"],["1251","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๕๑ ห้างหุ้นส่วนก็ดี บริษัทก็ดี ในเมื่อเลิกกันเพราะเหตุอื่นนอกจากล้มละลาย หุ้นส่วนผู้จัดการห้างหรือกรรมการของบริษัทย่อมเข้าเป็นผู้ชำระบัญชี เว้นไว้แต่ข้อสัญญาของห้าง หรือข้อบังคับบริษัทจะมีกำหนดไว้เป็นสถานอื่น\nถ้าไม่มีผู้ชำระบัญชีดังว่ามานี้ และเมื่อพนักงานอัยการหรือบุคคลอื่นผู้มีส่วนได้เสียในการนี้ร้องขอ ท่านให้ศาลตั้งผู้ชำระบัญชี"],["1252","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๕๒ หุ้นส่วนผู้จัดการ หรือกรรมการบริษัทมีอำนาจโดยตำแหน่งเดิมฉันใด เมื่อเป็นผู้ชำระบัญชีก็ยังคงมีอำนาจอยู่ฉันนั้น"],["1253","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๕๓ ภายในสิบสี่วันนับแต่ได้เลิกห้างเลิกบริษัท หรือถ้าศาลได้ตั้งผู้ชำระบัญชีนับแต่วันที่ศาลตั้ง ผู้ชำระบัญชีต้องกระทำดังจะกล่าวต่อไปนี้ คือ\n(๑) บอกกล่าวแก่ประชาชนโดยประกาศโฆษณาในหนังสือพิมพ์แห่งท้องที่อย่างน้อยหนึ่งคราวว่าห้างหุ้นส่วนหรือบริษัทนั้นได้เลิกกันแล้วและให้ผู้เป็นเจ้าหนี้ทั้งหลายยื่นคำทวงหนี้แก่ผู้ชำระบัญชี\n(๒) ส่งคำบอกกล่าวอย่างเดียวกันเป็นจดหมายลงทะเบียนไปรษณีย์ไปยังเจ้าหนี้ทั้งหลายทุก ๆ คนบรรดามีชื่อปรากฏในสมุด บัญชี หรือเอกสารของห้างหรือบริษัทนั้น"],["1254","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๕๔ การเลิกหุ้นส่วนหรือบริษัทนั้น ผู้ชำระบัญชีต้องนำบอกให้จดทะเบียนภายในสิบสี่วันนับแต่วันที่เลิกกัน และในการนี้ต้องระบุชื่อผู้ชำระบัญชีทุก ๆ คนให้จดลงทะเบียนไว้ด้วย"],["1255","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๕๕ ผู้ชำระบัญชีต้องทำงบดุลขึ้นโดยเร็วที่สุดที่เป็นวิสัยจะทำได้ ส่งให้ผู้สอบบัญชีตรวจสอบลงสำคัญว่าถูกต้อง แล้วต้องเรียกประชุมใหญ่"],["1256","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๕๖ ธุรการอันที่ประชุมใหญ่จะพึงทำนั้น คือ\n(๑) รับรองให้หุ้นส่วนผู้จัดการหรือกรรมการบริษัทคงเป็นผู้ชำระบัญชีต่อไป หรือเลือกตั้งผู้ชำระบัญชีใหม่ขึ้นแทนที่ และ\n(๒) อนุมัติบัญชีงบดุล\nอนึ่ง ที่ประชุมใหญ่จะสั่งให้ผู้ชำระบัญชีทำบัญชีตีราคาทรัพย์สิน หรือให้ทำการใด ๆ ก็ได้สุดแต่ที่ประชุมจะเห็นสมควร เพื่อชำระสะสางกิจการของห้างหุ้นส่วนหรือบริษัทให้เสร็จไป"],["1257","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๕๗ ผู้ชำระบัญชีซึ่งมิใช่เป็นขึ้นเพราะศาลตั้งนั้น ท่านว่าจะถอนเสียจากตำแหน่งและตั้งผู้อื่นแทนที่ก็ได้ ในเมื่อผู้เป็นหุ้นส่วนทั้งหลายออกเสียงเป็นน้ำหนึ่งใจเดียวกัน หรือที่ประชุมใหญ่ของผู้ถือหุ้นได้ลงมติดังนั้น แต่ศาลย่อมสั่งถอนผู้ชำระบัญชีจากตำแหน่งและตั้งผู้อื่นแทนที่ได้ ไม่เลือกว่าจะเป็นผู้ชำระบัญชีซึ่งศาลตั้งหรือมิใช่ศาลตั้ง ในเมื่อมีคำร้องขอของผู้เป็นหุ้นส่วนในห้างคนใดคนหนึ่งหรือของผู้ถือหุ้นในบริษัทมีหุ้นรวมกันนับได้ถึงหนึ่งในยี่สิบแห่งทุนของบริษัท โดยจำนวนที่ส่งใช้เงินเข้าทุนแล้วนั้น"],["1258","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๕๘ เมื่อมีการเปลี่ยนตัวผู้ชำระบัญชีใหม่ครั้งใด ผู้ชำระบัญชีต้องนำความจดทะเบียนภายในสิบสี่วันนับแต่วันที่ได้เปลี่ยนตัวกันนั้น"],["1259","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๕๙ ผู้ชำระบัญชีทั้งหลายย่อมมีอำนาจดังจะกล่าวต่อไปนี้ คือ\n(๑) แก้ต่างว่าต่างในนามของห้างหุ้นส่วนหรือบริษัทในอรรถคดีพิพาทอันเป็นแพ่งหรืออาญาทั้งปวง และทำประณีประนอมยอมความ\n(๒) ดำเนินกิจการของห้างหุ้นส่วนหรือบริษัทตามแต่จำเป็น เพื่อการชำระสะสางกิจการให้เสร็จไปด้วยดี\n(๓) ขายทรัพย์สินของห้างหุ้นส่วนหรือบริษัท\n(๔) ทำการอย่างอื่น ๆ ตามแต่จำเป็น เพื่อชำระบัญชีให้เสร็จไปด้วยดี"],["1260","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๖๐ ข้อจำกัดอำนาจของผู้ชำระบัญชีอย่างใด ๆ จะอ้างเป็นสมบูรณ์ต่อบุคคลภายนอกหาได้ไม่"],["1261","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๖๑ ถ้ามีผู้ชำระบัญชีหลายคน การใด ๆ ที่ผู้ชำระบัญชีกระทำย่อมไม่เป็นอันสมบูรณ์นอกจากผู้ชำระบัญชีทั้งหลายจะได้ทำร่วมกัน เว้นแต่ที่ประชุมใหญ่หรือศาลจะได้กำหนดอำนาจไว้เป็นอย่างอื่นในเวลาตั้งผู้ชำระบัญชี"],["1262","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๖๒ ถ้ามีมติของที่ประชุมใหญ่หรือคำบังคับของศาลให้อำนาจผู้ชำระบัญชีให้ทำการแยกกันได้ ท่านว่าต้องนำความจดทะเบียนภายในสิบสี่วันนับแต่วันลงมติหรือออกคำบังคับนั้น"],["1263","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๖๓ ค่าธรรมเนียม ค่าภาระติดพัน และค่าใช้จ่ายซึ่งต้องเสียโดยควรในการชำระบัญชีนั้น ท่านว่าผู้ชำระบัญชีต้องจัดการใช้ก่อนหนี้เงินรายอื่น ๆ"],["1264","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๖๔ ถ้าเจ้าหนี้คนใดมิได้มาทวงถามให้ใช้หนี้ ผู้ชำระบัญชีต้องวางเงินเท่าจำนวนหนี้นั้น ตามบทแห่งประมวลกฎหมายนี้ ว่าด้วยวางทรัพย์สินแทนชำระหนี้"],["1265","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๖๕ ผู้ชำระบัญชีจะเรียกให้ผู้เป็นหุ้นส่วนหรือผู้ถือหุ้นส่งใช้เงินลงหุ้นอันเป็นส่วนยังค้างชำระอยู่นั้นก็ได้ และเงินที่ค้างชำระนี้ถึงแม้จะได้ตกลงกันไว้ก่อนโดยสัญญาเข้าหุ้นส่วน หรือโดยข้อบังคับของบริษัทว่าจะได้เรียกต่อภายหลังก็ตาม เมื่อเรียกเช่นนี้แล้ว ท่านว่าต้องส่งใช้ทันที"],["1266","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๖๖ ถ้าผู้ชำระบัญชีมาพิจารณาเห็นว่า เมื่อเงินลงทุนหรือเงินค่าหุ้นได้ใช้เสร็จหมดแล้ว สินทรัพย์ก็ยังไม่พอกับหนี้สินไซร้ ผู้ชำระบัญชีต้องร้องขอต่อศาลทันที เพื่อให้ออกคำสั่งว่าห้างหุ้นส่วนหรือบริษัทนั้นล้มละลาย"],["1267","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๖๗ ผู้ชำระบัญชีต้องทำรายงานยื่นไว้ ณ หอทะเบียนทุกระยะสามเดือนครั้งหนึ่งว่าได้จัดการไปอย่างใดบ้าง แสดงให้เป็นความเป็นไปของบัญชีที่ชำระอยู่นั้น และรายงานนี้ให้เปิดเผยแก่ผู้เป็นหุ้นส่วนและผู้ถือหุ้น และเจ้าหนี้ทั้งหลายตรวจดูได้โดยไม่ต้องเสียค่าธรรมเนียม"],["1268","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๖๘ ถ้าการชำระบัญชีนั้นยังคงทำอยู่โดยกาลกว่าปีหนึ่งขึ้นไป ผู้ชำระบัญชีต้องเรียกประชุมใหญ่ในเวลาสิ้นปีทุกปีนับแต่เริ่มทำการชำระบัญชี และต้องทำรายงานยื่นที่ประชุมว่าได้จัดการไปอย่างไรบ้าง ทั้งแถลงให้ทราบความเป็นไปแห่งบัญชีโดยละเอียด"],["1269","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๖๙ อันทรัพย์สินของห้างหุ้นส่วนหรือของบริษัทนั้น จะแบ่งคืนให้แก่ผู้เป็นหุ้นส่วนหรือผู้ถือหุ้นได้แต่เพียงเท่าที่ไม่ต้องเอาไว้ใช้ในการชำระหนี้ของห้างหุ้นส่วนหรือบริษัทเท่านั้น"],["1270","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๗๐ เมื่อการชำระบัญชีกิจการของห้างหุ้นส่วนหรือบริษัทสำเร็จลง ผู้ชำระบัญชีต้องทำรายงานการชำระบัญชีแสดงว่า การชำระบัญชีนั้นได้ดำเนินไปอย่างใด และได้จัดการทรัพย์สินของห้างหุ้นส่วนหรือบริษัทนั้นไปประการใด แล้วให้เรียกประชุมใหญ่เพื่อเสนอรายงานนั้น และชี้แจงกิจการต่อที่ประชุม\nเมื่อที่ประชุมใหญ่ได้ให้อนุมัติรายงานนั้นแล้ว ผู้ชำระบัญชีต้องนำข้อความที่ได้ประชุมกันนั้นไปจดทะเบียนภายในสิบสี่วันนับแต่วันประชุม เมื่อได้จดทะเบียนแล้วดังนี้ให้ถือว่าเป็นที่สุดแห่งการชำระบัญชี"],["1271","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๗๑ เมื่อเสร็จการชำระบัญชีแล้ว ท่านให้มอบบรรดาสมุดและบัญชี และเอกสารทั้งหลายของห้างหุ้นส่วนหรือบริษัทซึ่งได้ชำระบัญชีนั้นไว้แก่นายทะเบียนภายในกำหนดสิบสี่วันดังกล่าวไว้ในมาตราก่อน และให้นายทะเบียนรักษาสมุดและบัญชี และเอกสารเหล่านั้นไว้สิบปีนับแต่วันถึงที่สุดแห่งการชำระบัญชี\nสมุดและบัญชีและเอกสารเหล่านี้ ให้เปิดให้แก่บรรดาบุคคลผู้มีส่วนได้เสียตรวจดูได้โดยไม่เรียกค่าธรรมเนียมอย่างหนึ่งอย่างใด"],["1272","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๗๒ ในคดีฟ้องเรียกหนี้สินซึ่งห้างหุ้นส่วนหรือบริษัท หรือผู้เป็นหุ้นส่วน หรือผู้ถือหุ้น หรือผู้ชำระบัญชีเป็นลูกหนี้อยู่ในฐานเช่นนั้น ท่านห้ามมิให้ฟ้องเมื่อพ้นกำหนดสองปีนับแต่วันถึงที่สุดแห่งการชำระบัญชี"],["1273","b3t22","หมวด ๕ การชำระบัญชีห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัด","","มาตรา ๑๒๗๓ บทบัญญัติแห่งมาตรา ๑๑๗๒ ถึงมาตรา ๑๑๙๓ กับมาตรา ๑๑๙๕ และมาตรา ๑๒๐๗ เหล่านี้ ท่านให้ใช้บังคับแก่การประชุมใหญ่ซึ่งมีขึ้นในระหว่างชำระบัญชีด้วยโดยอนุโลม"],["1273/1","b3t22","หมวด ๖ การถอนทะเบียนห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัดร้าง","","มาตรา ๑๒๗๓/๑ เมื่อใดนายทะเบียนมีมูลเหตุอันควรเชื่อว่าห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด หรือบริษัทจำกัดใด มิได้ทำการค้าขายหรือประกอบการงานแล้ว ให้นายทะเบียนมีหนังสือส่งทางไปรษณีย์ตอบรับไปยังห้างหุ้นส่วนหรือบริษัท เพื่อสอบถามว่ายังทำการค้าขายหรือประกอบการงานอยู่หรือไม่ และแจ้งว่าหากมิได้รับคำตอบภายในสามสิบวันนับแต่วันที่ส่งหนังสือจะได้โฆษณาในหนังสือพิมพ์เพื่อขีดชื่อห้างหุ้นส่วนหรือบริษัทนั้นออกเสียจากทะเบียน\nถ้านายทะเบียนได้รับคำตอบจากห้างหุ้นส่วนหรือบริษัทนั้นว่า ห้างหุ้นส่วนหรือบริษัทมิได้ทำการค้าขายหรือประกอบการงานแล้วหรือมิได้รับคำตอบภายในสามสิบวันนับแต่วันที่ส่งหนังสือ ให้นายทะเบียนโฆษณาในหนังสือพิมพ์แห่งท้องที่อย่างน้อยหนึ่งคราวและส่งหนังสือบอกกล่าวทางไปรษณีย์ตอบรับไปยังห้างหุ้นส่วนหรือบริษัทว่า เมื่อพ้นเวลาเก้าสิบวันนับแต่วันที่ส่งหนังสือบอกกล่าวห้างหุ้นส่วนหรือบริษัทนั้นจะถูกขีดชื่อออกจากทะเบียน เว้นแต่จะแสดงเหตุให้เห็นเป็นอย่างอื่น"],["1273/2","b3t22","หมวด ๖ การถอนทะเบียนห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัดร้าง","","มาตรา ๑๒๗๓/๒ ในกรณีที่ห้างหุ้นส่วนหรือบริษัทเลิกกันแล้วและอยู่ระหว่างการชำระบัญชี หากนายทะเบียนมีมูลเหตุอันควรเชื่อว่าไม่มีตัวผู้ชำระบัญชีทำการอยู่ หรือการงานของห้างหุ้นส่วนหรือบริษัทได้ชำระสะสางตลอดแล้ว แต่ผู้ชำระบัญชีมิได้ทำรายงานการชำระบัญชี หรือมิได้ยื่นจดทะเบียนเสร็จการชำระบัญชีต่อนายทะเบียน ให้นายทะเบียนมีหนังสือส่งทางไปรษณีย์ตอบรับไปยังห้างหุ้นส่วนหรือบริษัท และผู้ชำระบัญชี ณ สถานที่อันปรากฏเป็นสำนักงานสุดท้าย แจ้งให้ดำเนินการเพื่อให้มีตัวผู้ชำระบัญชี หรือยื่นรายงานการชำระบัญชี หรือจดทะเบียนเสร็จการชำระบัญชี แล้วแต่กรณี และแจ้งว่าหากมิได้ดำเนินการดังกล่าวภายในระยะเวลาหนึ่งร้อยแปดสิบวันนับแต่วันที่ส่งหนังสือนั้นแล้วจะได้โฆษณาในหนังสือพิมพ์เพื่อขีดชื่อห้างหุ้นส่วนหรือบริษัทนั้นออกเสียจากทะเบียน\nถ้าห้างหุ้นส่วนหรือบริษัท หรือผู้ชำระบัญชีมิได้ดำเนินการภายในกำหนดเวลาตามวรรคหนึ่งให้นายทะเบียนโฆษณาในหนังสือพิมพ์แห่งท้องที่อย่างน้อยหนึ่งคราว และส่งหนังสือบอกกล่าวทางไปรษณีย์ตอบรับไปยังห้างหุ้นส่วนหรือบริษัทและผู้ชำระบัญชีว่าเมื่อพ้นกำหนดเวลาเก้าสิบวันนับแต่วันที่ส่งหนังสือบอกกล่าว ห้างหุ้นส่วนหรือบริษัทนั้นจะถูกขีดชื่อออกจากทะเบียน เว้นแต่จะแสดงเหตุให้เห็นเป็นอย่างอื่น"],["1273/3","b3t22","หมวด ๖ การถอนทะเบียนห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัดร้าง","","มาตรา ๑๒๗๓/๓ เมื่อสิ้นกำหนดเวลาตามที่แจ้งในหนังสือบอกกล่าวตามมาตรา ๑๒๗๓/๑ หรือมาตรา ๑๒๗๓/๒ แล้ว และห้างหุ้นส่วนหรือบริษัท หรือผู้ชำระบัญชีมิได้แสดงเหตุให้เห็นเป็นอย่างอื่น นายทะเบียนจะขีดชื่อห้างหุ้นส่วนหรือบริษัทนั้นออกเสียจากทะเบียนก็ได้ ในการนี้ให้ห้างหุ้นส่วนหรือบริษัทนั้นสิ้นสภาพนิติบุคคลตั้งแต่เมื่อนายทะเบียนขีดชื่อห้างหุ้นส่วนหรือบริษัทออกเสียจากทะเบียน แต่ความรับผิดของหุ้นส่วนผู้จัดการ ผู้เป็นหุ้นส่วน กรรมการ ผู้จัดการ และผู้ถือหุ้นมีอยู่เท่าไรก็ให้คงมีอยู่อย่างนั้นและพึงเรียกบังคับได้เสมือนห้างหุ้นส่วนหรือบริษัทนั้นยังมิได้สิ้นสภาพนิติบุคคล"],["1273/4","b3t22","หมวด ๖ การถอนทะเบียนห้างหุ้นส่วนจดทะเบียน ห้างหุ้นส่วนจำกัด และบริษัทจำกัดร้าง","","มาตรา ๑๒๗๓/๔ ถ้าห้างหุ้นส่วน ผู้เป็นหุ้นส่วน บริษัท ผู้ถือหุ้น หรือเจ้าหนี้ใด ๆ ของห้างหุ้นส่วนหรือบริษัทนั้นรู้สึกว่าต้องเสียหายโดยไม่เป็นธรรมเพราะการที่ห้างหุ้นส่วนหรือบริษัทถูกขีดชื่อออกจากทะเบียน เมื่อห้างหุ้นส่วน ผู้เป็นหุ้นส่วน บริษัท ผู้ถือหุ้นหรือเจ้าหนี้ยื่นคำร้องต่อศาลและศาลพิจารณาได้ความเป็นที่พอใจว่าในขณะที่ขีดชื่อห้างหุ้นส่วนหรือบริษัทออกจากทะเบียนห้างหุ้นส่วนหรือบริษัทยังทำการค้าขายหรือยังประกอบการงานอยู่ หรือเห็นเป็นการยุติธรรมในการที่จะให้ห้างหุ้นส่วนหรือบริษัทได้กลับคืนสู่ทะเบียนก็ดี ศาลจะสั่งให้จดชื่อห้างหุ้นส่วนหรือบริษัทกลับคืนเข้าสู่ทะเบียนก็ได้ และให้ถือว่าห้างหุ้นส่วนหรือบริษัทนั้นยังคงอยู่ตลอดมาเสมือนมิได้มีการขีดชื่อออกเลย โดยศาลจะสั่งและวางข้อกำหนดไว้เป็นประการใดๆ ตามที่เห็นเป็นการยุติธรรมด้วยก็ได้เพื่อให้ห้างหุ้นส่วนหรือบริษัทและบรรดาบุคคลอื่นๆ กลับคืนสู่ฐานะอันใกล้ที่สุดกับฐานะเดิมเสมือนห้างหุ้นส่วนหรือบริษัทนั้นมิได้ถูกขีดชื่อออกจากทะเบียนเลย\nการร้องขอให้ห้างหุ้นส่วนหรือบริษัทกลับคืนสู่ทะเบียน ห้ามมิให้ร้องขอเมื่อพ้นกำหนดสิบปีนับแต่วันที่นายทะเบียนขีดชื่อห้างหุ้นส่วนหรือบริษัทออกจากทะเบียน"],["1274-1297","b3t23","","","มาตรา ๑๒๗๔ ถึง มาตรา ๑๒๙๗ (ยกเลิก)"],["1298","b4t1","","","มาตรา ๑๒๙๘ ทรัพยสิทธิทั้งหลายนั้น ท่านว่าจะก่อตั้งขึ้นได้แต่ด้วยอาศัยอำนาจในประมวลกฎหมายนี้หรือกฎหมายอื่น"],["1299","b4t1","","","มาตรา ๑๒๙๙ ภายในบังคับแห่งบทบัญญัติในประมวลกฎหมายนี้หรือกฎหมายอื่น ท่านว่าการได้มาโดยนิติกรรมซึ่งอสังหาริมทรัพย์หรือทรัพยสิทธิอันเกี่ยวกับอสังหาริมทรัพย์นั้นไม่บริบูรณ์ เว้นแต่นิติกรรมจะได้ทำเป็นหนังสือและได้จดทะเบียนการได้มากับพนักงานเจ้าหน้าที่\nถ้ามีผู้ได้มาซึ่งอสังหาริมทรัพย์หรือทรัพยสิทธิอันเกี่ยวกับอสังหาริมทรัพย์โดยทางอื่นนอกจากนิติกรรม สิทธิของผู้ได้มานั้น ถ้ายังมิได้จดทะเบียนไซร้ ท่านว่าจะมีการเปลี่ยนแปลงทางทะเบียนไม่ได้ และสิทธิอันยังมิได้จดทะเบียนนั้น มิให้ยกขึ้นเป็นข้อต่อสู้บุคคลภายนอกผู้ได้สิทธิมาโดยเสียค่าตอบแทนและโดยสุจริต และได้จดทะเบียนสิทธิโดยสุจริตแล้ว"],["1300","b4t1","","","มาตรา ๑๓๐๐ ถ้าได้จดทะเบียนการโอนอสังหาริมทรัพย์หรือทรัพยสิทธิอันเกี่ยวกับอสังหาริมทรัพย์เป็นทางเสียเปรียบแก่บุคคลผู้อยู่ในฐานะอันจะให้จดทะเบียนสิทธิของตนได้อยู่ก่อนไซร้ ท่านว่าบุคคลนั้นอาจเรียกให้เพิกถอนการจดทะเบียนนั้นได้ แต่การโอนอันมีค่าตอบแทน ซึ่งผู้รับโอนกระทำการโดยสุจริตนั้น ไม่ว่ากรณีจะเป็นประการใดท่านว่าจะเรียกให้เพิกถอนทะเบียนไม่ได้"],["1301","b4t1","","","มาตรา ๑๓๐๑ บทบัญญัติแห่งสองมาตราก่อนนี้ ท่านให้ใช้บังคับถึงการเปลี่ยนแปลง ระงับ และกลับคืนมาแห่งทรัพยสิทธิอันเกี่ยวกับอสังหาริมทรัพย์นั้นด้วยโดยอนุโลม"],["1302","b4t1","","","มาตรา ๑๓๐๒ บทบัญญัติแห่งสามมาตราก่อนนี้ ให้ใช้บังคับถึงเรือมีระวางตั้งแต่ห้าตันขึ้นไป ทั้งแพและสัตว์พาหนะด้วยโดยอนุโลม"],["1303","b4t1","","","มาตรา ๑๓๐๓ ถ้าบุคคลหลายคนเรียกเอาสังหาริมทรัพย์เดียวกัน โดยอาศัยหลักกรรมสิทธิ์ต่างกันไซร้ ท่านว่าทรัพย์สินตกอยู่ในครอบครองของบุคคลใด บุคคลนั้นมีสิทธิยิ่งกว่าบุคคลอื่น ๆ แต่ต้องได้ทรัพย์นั้นมาโดยมีค่าตอบแทนและได้การครอบครองโดยสุจริต\nท่านมิให้ใช้มาตรานี้บังคับถึงสังหาริมทรัพย์ซึ่งระบุไว้ในมาตราก่อนและในเรื่องทรัพย์สินหาย กับทรัพย์สินที่ได้มาโดยการกระทำผิด"],["1304","b4t1","","","มาตรา ๑๓๐๔ สาธารณสมบัติของแผ่นดินนั้น รวมทรัพย์สินทุกชนิดของแผ่นดินซึ่งใช้เพื่อสาธารณประโยชน์หรือสงวนไว้เพื่อประโยชน์ร่วมกัน เช่น\n(๑) ที่ดินรกร้างว่างเปล่า และที่ดินซึ่งมีผู้เวนคืนหรือทอดทิ้งหรือกลับมาเป็นของแผ่นดินโดยประการอื่น ตามกฎหมายที่ดิน\n(๒) ทรัพย์สินสำหรับพลเมืองใช้ร่วมกัน เป็นต้นว่า ที่ชายตลิ่ง ทางน้ำ ทางหลวง ทะเลสาบ\n(๓) ทรัพย์สินใช้เพื่อประโยชน์ของแผ่นดินโดยเฉพาะ เป็นต้นว่า ป้อมและโรงทหาร สำนักราชการบ้านเมือง เรือรบ อาวุธยุทธภัณฑ์"],["1305","b4t1","","","มาตรา ๑๓๐๕ ทรัพย์สินซึ่งเป็นสาธารณสมบัติของแผ่นดินนั้นจะโอนแก่กันมิได้ เว้นแต่อาศัยอำนาจแห่งบทกฎหมายเฉพาะหรือพระราชกฤษฎีกา"],["1306","b4t1","","","มาตรา ๑๓๐๖ ท่านห้ามมิให้ยกอายุความขึ้นเป็นข้อต่อสู้กับแผ่นดินในเรื่องทรัพย์สินอันเป็นสาธารณสมบัติของแผ่นดิน"],["1307","b4t1","","","มาตรา ๑๓๐๗ ท่านห้ามมิให้ยึดทรัพย์สินของแผ่นดิน ไม่ว่าทรัพย์สินนั้นจะเป็นสาธารณสมบัติของแผ่นดินหรือไม่"],["1308","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๐๘ ที่ดินแปลงใดเกิดที่งอกริมตลิ่ง ที่งอกย่อมเป็นทรัพย์สินของเจ้าของที่ดินแปลงนั้น"],["1309","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๐๙ เกาะที่เกิดในทะเลสาบ หรือในทางน้ำหรือในเขตน่านน้ำของประเทศก็ดี และท้องทางน้ำที่เขินขึ้นก็ดี เป็นทรัพย์สินของแผ่นดิน"],["1310","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๑๐ บุคคลใดสร้างโรงเรือนในที่ดินของผู้อื่นโดยสุจริตไซร้ ท่านว่าเจ้าของที่ดินเป็นเจ้าของโรงเรือนนั้น ๆ แต่ต้องใช้ค่าแห่งที่ดินเพียงที่เพิ่มขึ้นเพราะสร้างโรงเรือนนั้นให้แก่ผู้สร้าง\nแต่ถ้าเจ้าของที่ดินสามารถแสดงได้ว่า มิได้มีความประมาทเลินเล่อ จะบอกปัดไม่ยอมรับโรงเรือนนั้นและเรียกให้ผู้สร้างรื้อถอนไป และทำที่ดินให้เป็นตามเดิมก็ได้ เว้นไว้แต่ถ้าการนี้จะทำไม่ได้โดยใช้เงินพอสมควรไซร้ ท่านว่าเจ้าของที่ดินจะเรียกให้ผู้สร้างซื้อที่ดินทั้งหมดหรือแต่บางส่วนตามราคาตลาดก็ได้"],["1311","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๑๑ บุคคลใดสร้างโรงเรือนในที่ดินของผู้อื่นโดยไม่สุจริตไซร้ ท่านว่าบุคคลนั้นต้องทำที่ดินให้เป็นตามเดิมแล้วส่งคืนเจ้าของ เว้นแต่เจ้าของจะเลือกให้ส่งคืนตามที่เป็นอยู่ ในกรณีเช่นนี้เจ้าของที่ดินต้องใช้ราคาโรงเรือนหรือใช้ค่าแห่งที่ดินเพียงที่เพิ่มขึ้นเพราะสร้างโรงเรือนนั้น แล้วแต่จะเลือก"],["1312","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๑๒ บุคคลใดสร้างโรงเรือนรุกล้ำเข้าไปในที่ดินของผู้อื่นโดยสุจริตไซร้ ท่านว่าบุคคลนั้นเป็นเจ้าของโรงเรือนที่สร้างขึ้น แต่ต้องเสียเงินให้แก่เจ้าของที่ดินเป็นค่าใช้ที่ดินนั้น และจดทะเบียนสิทธิเป็นภาระจำยอม ต่อภายหลังถ้าโรงเรือนนั้นสลายไปทั้งหมด เจ้าของที่ดินจะเรียกให้เพิกถอนการจดทะเบียนเสียก็ได้\nถ้าบุคคลผู้สร้างโรงเรือนนั้นกระทำการโดยไม่สุจริต ท่านว่าเจ้าของที่ดินจะเรียกให้ผู้สร้างรื้อถอนไป และทำที่ดินให้เป็นตามเดิมโดยผู้สร้างเป็นผู้ออกค่าใช้จ่ายก็ได้"],["1313","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๑๓ ถ้าผู้เป็นเจ้าของที่ดินโดยมีเงื่อนไขสร้างโรงเรือนในที่ดินนั้น และภายหลังที่ดินตกเป็นของบุคคลอื่นตามเงื่อนไขไซร้ ท่านให้นำบทบัญญัติแห่งประมวลกฎหมายนี้ว่าด้วยลาภมิควรได้มาใช้บังคับ"],["1314","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๑๔ ท่านให้ใช้บทบัญญัติมาตรา ๑๓๑๐ มาตรา ๑๓๑๑ และมาตรา ๑๓๑๓ บังคับตลอดถึงการก่อสร้างใด ๆ ซึ่งติดที่ดินและการเพาะปลูกต้นไม้หรือธัญชาติด้วยโดยอนุโลม\nแต่ข้าวหรือธัญชาติอย่างอื่นอันจะเก็บเกี่ยวรวงผลได้คราวหนึ่งหรือหลายคราวต่อปี เจ้าของที่ดินต้องยอมให้บุคคลผู้กระทำการโดยสุจริต หรือผู้เป็นเจ้าของที่ดินโดยมีเงื่อนไขซึ่งได้เพาะปลูกลงไว้นั้น คงครองที่ดินจนกว่าจะเสร็จการเก็บเกี่ยวโดยใช้เงินคำนวณตามเกณฑ์ค่าเช่าที่ดินนั้น หรือเจ้าของที่ดินจะเข้าครอบครองในทันทีโดยใช้ค่าทดแทนให้แก่อีกฝ่ายหนึ่งก็ได้"],["1315","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๑๕ บุคคลใดสร้างโรงเรือน หรือทำการก่อสร้างอย่างอื่นซึ่งติดที่ดิน หรือเพาะปลูกต้นไม้หรือธัญชาติในที่ดินของตนด้วยสัมภาระของผู้อื่น ท่านว่าบุคคลนั้นเป็นเจ้าของสัมภาระ แต่ต้องใช้ค่าสัมภาระ"],["1316","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๑๖ ถ้าเอาสังหาริมทรัพย์ของบุคคลหลายคนมารวมเข้ากันจนเป็นส่วนควบหรือแบ่งแยกไม่ได้ไซร้ ท่านว่าบุคคลเหล่านั้นเป็นเจ้าของรวมแห่งทรัพย์ที่รวมเข้ากัน แต่ละคนมีส่วนตามค่าแห่งทรัพย์ของตนในเวลาที่รวมเข้ากับทรัพย์อื่น\nถ้าทรัพย์อันหนึ่งอาจถือได้ว่าเป็นทรัพย์ประธานไซร้ ท่านว่าเจ้าของทรัพย์นั้นเป็นเจ้าของทรัพย์ที่รวมเข้ากันแต่ผู้เดียว แต่ต้องใช้ค่าแห่งทรัพย์อื่น ๆ ให้แก่เจ้าของทรัพย์นั้น ๆ"],["1317","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๑๗ บุคคลใดใช้สัมภาระของบุคคลอื่นทำสิ่งใดขึ้นใหม่ไซร้ ท่านว่าเจ้าของสัมภาระเป็นเจ้าของสิ่งนั้นโดยมิต้องคำนึงว่าสัมภาระนั้นจะกลับคืนตามเดิมได้หรือไม่ แต่ต้องใช้ค่าแรงงาน\nแต่ถ้าค่าแรงงานเกินกว่าค่าสัมภาระที่ใช้นั้นมากไซร้ ท่านว่าผู้ทำเป็นเจ้าของทรัพย์ที่ทำขึ้น แต่ต้องใช้ค่าสัมภาระ"],["1318","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๑๘ บุคคลอาจได้มาซึ่งกรรมสิทธิ์แห่งสังหาริมทรัพย์อันไม่มีเจ้าของโดยเข้าถือเอา เว้นแต่การเข้าถือเอานั้นต้องห้ามตามกฎหมาย หรือฝ่าฝืนสิทธิของบุคคลอื่นที่จะเข้าถือเอาสังหาริมทรัพย์นั้น"],["1319","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๑๙ ถ้าเจ้าของสังหาริมทรัพย์เลิกครอบครองทรัพย์ด้วยเจตนาสละกรรมสิทธิ์ไซร้ ท่านว่าสังหาริมทรัพย์นั้นไม่มีเจ้าของ"],["1320","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๒๐ ภายในบังคับแห่งกฎหมายเฉพาะและกฎข้อบังคับในเรื่องนั้น ท่านว่าสัตว์ป่าไม่มีเจ้าของตราบเท่าที่ยังอยู่อิสระ สัตว์ป่าในสวนสัตว์และปลาในบ่อ หรือในที่น้ำซึ่งเจ้าของกั้นไว้นั้น ท่านว่าไม่ใช่สัตว์ไม่มีเจ้าของ\nสัตว์ป่าที่คนจับได้นั้น ถ้ามันกลับคืนอิสระและเจ้าของไม่ติดตามโดยพลันหรือเลิกติดตามเสียแล้ว ฉะนี้ท่านว่าไม่มีเจ้าของ\nสัตว์ซึ่งเลี้ยงเชื่องแล้ว ถ้ามันทิ้งที่ไปเลย ท่านว่าไม่มีเจ้าของ"],["1321","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๒๑ ภายในบังคับแห่งกฎหมายเฉพาะและกฎข้อบังคับในเรื่องนั้น ผู้ใดจับสัตว์ป่าได้ในที่รกร้างว่างเปล่าหรือในที่น้ำสาธารณะก็ดี หรือจับได้ในที่ดิน หรือที่น้ำมีเจ้าของโดยเจ้าของมิได้แสดงความหวงห้ามก็ดี ท่านว่าผู้นั้นเป็นเจ้าของสัตว์"],["1322","b4t2","หมวด ๑ การได้มาซึ่งกรรมสิทธิ์","","มาตรา ๑๓๒๒
