่านว่าผู้เอาประกันภัยชอบที่จะได้รับเงินค่าเวนคืนกรมธรรม์ประกันภัย หรือรับกรมธรรม์ใช้เงินสำเร็จจากผู้รับประกันภัย"],["895","b3t20","หมวด ๓ ประกันชีวิต","","มาตรา ๘๙๕ เมื่อใดจะต้องใช้จำนวนเงินในเหตุมรณะของบุคคลคนหนึ่งคนใด ท่านว่าผู้รับประกันภัยจำต้องใช้เงินนั้นในเมื่อมรณภัยอันนั้นเกิดขึ้น เว้นแต่\n(๑) บุคคลผู้นั้นได้กระทำอัตตวินิบาตด้วยใจสมัครภายในปีหนึ่งนับแต่วันทำสัญญา หรือ\n(๒) บุคคลผู้นั้นถูกผู้รับประโยชน์ฆ่าตายโดยเจตนา\nในกรณีที่ ๒ นี้ ท่านว่าผู้รับประกันภัยจำต้องใช้เงินค่าไถ่ถอนกรมธรรม์ให้แก่ผู้เอาประกันภัย หรือให้แก่ทายาทของผู้นั้น"],["896","b3t20","หมวด ๓ ประกันชีวิต","","มาตรา ๘๙๖ ถ้ามรณภัยเกิดขึ้นเพราะความผิดของบุคคลภายนอก ผู้รับประกันภัยหาอาจจะเรียกเอาค่าสินไหมทดแทนจากบุคคลภายนอกนั้นได้ไม่ แต่สิทธิของฝ่ายทายาทแห่งผู้มรณะในอันจะได้ค่าสินไหมทดแทนจากบุคคลภายนอกนั้นหาสูญสิ้นไปด้วยไม่ แม้ทั้งจำนวนเงินอันจะพึงใช้ตามสัญญาประกันชีวิตนั้นจะหวนกลับมาได้แก่ตนด้วย"],["897","b3t20","หมวด ๓ ประกันชีวิต","","มาตรา ๘๙๗ ถ้าผู้เอาประกันภัยได้เอาประกันภัยไว้โดยกำหนดว่า เมื่อตนถึงซึ่งความมรณะให้ใช้เงินแก่ทายาททั้งหลายของตนโดยมิได้เจาะจงระบุชื่อผู้หนึ่งผู้ใดไว้ไซร้ จำนวนเงินอันจะพึงใช้นั้นท่านให้ฟังเอาเป็นสินทรัพย์ส่วนหนึ่งแห่งกองมรดกของผู้เอาประกันภัย ซึ่งเจ้าหนี้จะเอาใช้หนี้ได้\nถ้าได้เอาประกันภัยไว้โดยกำหนดว่าให้ใช้เงินแก่บุคคลคนใดคนหนึ่งโดยเฉพาะเจาะจง ท่านว่าเฉพาะแต่จำนวนเงินเบี้ยประกันภัยซึ่งผู้เอาประกันภัยได้ส่งไปแล้วเท่านั้นจักเป็นสินทรัพย์ส่วนหนึ่งแห่งกองมรดกของผู้เอาประกันภัยอันเจ้าหนี้จะเอาใช้หนี้ได้"],["898","b3t21","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๘๙๘ อันตั๋วเงินตามความหมายแห่งประมวลกฎหมายนี้มีสามประเภท ประเภทหนึ่ง คือตั๋วแลกเงิน ประเภทหนึ่ง คือตั๋วสัญญาใช้เงิน ประเภทหนึ่ง คือเช็ค"],["899","b3t21","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๘๙๙ ข้อความอันใดซึ่งมิได้มีบัญญัติไว้ในประมวลกฎหมายลักษณะนี้ ถ้าเขียนลงในตั๋วเงิน ท่านว่าข้อความอันนั้นหาเป็นผลอย่างหนึ่งอย่างใดแก่ตั๋วเงินนั้นไม่"],["900","b3t21","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๙๐๐ บุคคลผู้ลงลายมือชื่อของตนในตั๋วเงินย่อมจะต้องรับผิดตามเนื้อความในตั๋วเงินนั้น\nถ้าลงเพียงแต่เครื่องหมายอย่างหนึ่งอย่างใด เช่น แกงได หรือลายพิมพ์นิ้วมืออ้างเอาเป็นลายมือชื่อในตั๋วเงินไซร้ แม้ถึงว่าจะมีพยานลงชื่อรับรองก็ตาม ท่านว่าหาให้ผลเป็นลงลายมือชื่อในตั๋วเงินนั้นไม่"],["901","b3t21","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๙๐๑ ถ้าบุคคลคนใดลงลายมือชื่อของตนในตั๋วเงิน และมิได้เขียนแถลงว่ากระทำการแทนบุคคลอีกคนหนึ่งไซร้ ท่านว่าบุคคลคนนั้นย่อมเป็นผู้รับผิดตามความในตั๋วเงินนั้น"],["902","b3t21","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๙๐๒ ถ้าตั๋วเงินลงลายมือชื่อของบุคคลหลายคน มีทั้งบุคคลซึ่งไม่อาจจะเป็นคู่สัญญาแห่งตั๋วเงินนั้นได้เลย หรือเป็นได้แต่ไม่เต็มผลไซร้ ท่านว่าการนี้ย่อมไม่กระทบกระทั่งถึงความรับผิดของบุคคลอื่น ๆ นอกนั้นซึ่งคงต้องรับผิดตามตั๋วเงิน"],["903","b3t21","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๙๐๓ ในการใช้เงินตามตั๋วเงิน ท่านมิให้ให้วันผ่อน"],["904","b3t21","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๙๐๔ อันผู้ทรงนั้น หมายความว่า บุคคลผู้มีตั๋วเงินไว้ในครอบครอง โดยฐานเป็นผู้รับเงิน หรือเป็นผู้รับสลักหลัง ถ้าและเป็นตั๋วเงินสั่งจ่ายให้แก่ผู้ถือ ๆ ก็นับว่าเป็นผู้ทรงเหมือนกัน"],["905","b3t21","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๙๐๕ ภายในบังคับแห่งบทบัญญัติมาตรา ๑๐๐๘ บุคคลผู้ได้ตั๋วเงินไว้ในครอบครอง ถ้าแสดงให้ปรากฏสิทธิด้วยการสลักหลังไม่ขาดสาย แม้ถึงว่าการสลักหลังรายที่สุดจะเป็นสลักหลังลอยก็ตาม ท่านให้ถือว่าเป็นผู้ทรงโดยชอบด้วยกฎหมาย เมื่อใดรายการสลักหลังลอยมีสลักหลังรายอื่นตามหลังไปอีก ท่านให้ถือว่าบุคคลผู้ที่ลงลายมือชื่อในการสลักหลังรายที่สุดนั้น เป็นผู้ได้ไปซึ่งตั๋วเงินด้วยการสลักหลังลอย อนึ่ง คำสลักหลังเมื่อขีดฆ่าเสียแล้ว ท่านให้ถือเสมือนว่ามิได้มีเลย\nถ้าบุคคลผู้หนึ่งผู้ใดต้องปราศจากตั๋วเงินไปจากครอบครอง ท่านว่าผู้ทรงซึ่งแสดงให้ปรากฏสิทธิของตนในตั๋วตามวิธีการดังกล่าวมาในวรรคก่อนนั้น หาจำต้องสละตั๋วเงินไม่ เว้นแต่จะได้มาโดยทุจริต หรือได้มาด้วยความประมาทเลินเล่ออย่างร้ายแรง\nอนึ่ง ข้อความในวรรคก่อนนี้ ให้ใช้บังคับตลอดถึงผู้ทรงตั๋วเงินสั่งจ่ายให้แก่ผู้ถือด้วย"],["906","b3t21","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๙๐๖ คำว่าคู่สัญญาคนก่อน ๆ นั้น รวมทั้งผู้สั่งจ่ายหรือผู้ออกตั๋วเงินและผู้สลักหลังคนก่อน ๆ ด้วย"],["907","b3t21","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๙๐๗ เมื่อใดไม่มีที่ในตั๋วเงินซึ่งจะสลักหลังได้ต่อไปไซร้ ท่านอนุญาตให้เอากระดาษแผ่นหนึ่งผนึกต่อเข้ากับตั๋วเงินเรียกว่าใบประจำต่อ นับเป็นส่วนหนึ่งแห่งตั๋วเงินนั้น\nการสลักหลังในใบประจำต่อครั้งแรกต้องเขียนคาบบนตั๋วเงินเดิมบ้าง บนใบประจำต่อบ้าง"],["908","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๐๘ อันว่าตั๋วแลกเงินนั้น คือหนังสือตราสารซึ่งบุคคลคนหนึ่ง เรียกว่าผู้สั่งจ่าย สั่งบุคคลอีกคนหนึ่ง เรียกว่าผู้จ่าย ให้ใช้เงินจำนวนหนึ่งแก่บุคคลคนหนึ่ง หรือให้ใช้ตามคำสั่งของบุคคลคนหนึ่งซึ่งเรียกว่าผู้รับเงิน"],["909","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๐๙ อันตั๋วแลกเงินนั้น ต้องมีรายการดังกล่าวต่อไปนี้ คือ\n(๑) คำบอกชื่อว่าเป็นตั๋วแลกเงิน\n(๒) คำสั่งอันปราศจากเงื่อนไขให้จ่ายเงินเป็นจำนวนแน่นอน\n(๓) ชื่อ หรือยี่ห้อผู้จ่าย\n(๔) วันถึงกำหนดใช้เงิน\n(๕) สถานที่ใช้เงิน\n(๖) ชื่อ หรือยี่ห้อผู้รับเงิน หรือคำจดแจ้งว่าให้ใช้เงินแก่ผู้ถือ\n(๗) วันและสถานที่ออกตั๋วเงิน\n(๘) ลายมือชื่อผู้สั่งจ่าย"],["910","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๑๐ ตราสารอันมีรายการขาดตกบกพร่องไปจากที่ท่านระบุบังคับไว้ในมาตราก่อนนี้ ย่อมไม่สมบูรณ์เป็นตั๋วแลกเงิน เว้นแต่ในกรณีดังจะกล่าวต่อไปนี้ คือ\nตั๋วแลกเงินซึ่งไม่ระบุเวลาใช้เงิน ท่านให้ถือว่าพึงใช้เงินเมื่อได้เห็น\nถ้าสถานที่ใช้เงินมิได้แถลงไว้ในตั๋วแลกเงิน ท่านให้ถือเอาภูมิลำเนาของผู้จ่ายเป็นสถานที่ใช้เงิน\nถ้าตั๋วแลกเงินไม่แสดงให้ปรากฏสถานที่ออกตั๋ว ท่านให้ถือว่าตั๋วเงินนั้นได้ออก ณ ภูมิลำเนาของผู้สั่งจ่าย\nถ้ามิได้ลงวันออกตั๋ว ท่านว่าผู้ทรงโดยชอบด้วยกฎหมายคนหนึ่งคนใดทำการโดยสุจริตจะจดวันตามที่ถูกต้องแท้จริงลงก็ได้"],["911","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๑๑ ผู้สั่งจ่ายจะเขียนข้อความกำหนดลงไว้ว่าจำนวนเงินอันจะพึงใช้นั้นให้คิดดอกเบี้ยด้วยก็ได้ และในกรณีเช่นนั้น ถ้ามิได้กล่าวลงไว้เป็นอย่างอื่น ท่านว่าดอกเบี้ยย่อมคิดแต่วันที่ลงในตั๋วเงิน"],["912","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๑๒ อันตั๋วแลกเงินนั้นจะออกสั่งให้ใช้เงินตามคำสั่งของผู้สั่งจ่ายก็ได้\nอนึ่ง จะสั่งจ่ายเอาจากตัวผู้สั่งจ่ายเอง หรือสั่งจ่ายเพื่อบุคคลภายนอกก็ได้"],["913","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๑๓ อันวันถึงกำหนดของตั๋วแลกเงินนั้น ท่านว่าย่อมเป็นอย่างใดอย่างหนึ่งดังกล่าวต่อไปนี้ คือ\n(๑) ในวันใดวันหนึ่งที่กำหนดไว้ หรือ\n(๒) เมื่อสิ้นระยะเวลาอันกำหนดไว้นับแต่วันที่ลงในตั๋วนั้น หรือ\n(๓) เมื่อทวงถาม หรือเมื่อได้เห็น หรือ\n(๔) เมื่อสิ้นระยะเวลาอันกำหนดไว้นับแต่ได้เห็น"],["914","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๑๔ บุคคลผู้สั่งจ่ายหรือสลักหลังตั๋วแลกเงินย่อมเป็นอันสัญญาว่า เมื่อตั๋วนั้นได้นำยื่นโดยชอบแล้วจะมีผู้รับรองและใช้เงินตามเนื้อความแห่งตั๋ว ถ้าและตั๋วแลกเงินนั้นเขาไม่เชื่อถือโดยไม่ยอมรับรองก็ดี หรือไม่ยอมจ่ายเงินก็ดี ผู้สั่งจ่ายหรือผู้สลักหลังก็จะใช้เงินแก่ผู้ทรง หรือแก่ผู้สลักหลังคนหลังซึ่งต้องถูกบังคับให้ใช้เงินตามตั๋วนั้น ถ้าหากว่าได้ทำถูกต้องตามวิธีการในข้อไม่รับรองหรือไม่จ่ายเงินนั้นแล้ว"],["915","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๑๕ ผู้สั่งจ่ายตั๋วแลกเงินและผู้สลักหลังคนใด ๆ ก็ดี จะจดข้อกำหนดซึ่งจะกล่าวต่อไปนี้ลงไว้ชัดแจ้งในตั๋วนั้นก็ได้ คือ\n(๑) ข้อกำหนดลบล้างหรือจำกัดความรับผิดของตนเองต่อผู้ทรงตั๋วเงิน\n(๒) ข้อกำหนดยอมลดละให้แก่ผู้ทรงตั๋วเงินซึ่งหน้าที่ทั้งหลายอันผู้ทรงจะพึงต้องมีแก่ตนบางอย่างหรือทั้งหมด"],["916","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๑๖ บุคคลทั้งหลายผู้ถูกฟ้องในมูลตั๋วแลกเงิน หาอาจจะต่อสู้ผู้ทรงด้วยข้อต่อสู้อันอาศัยความเกี่ยวพันกันเฉพาะบุคคลระหว่างตนกับผู้สั่งจ่ายหรือกับผู้ทรงคนก่อน ๆ นั้นได้ไม่ เว้นแต่การโอนจะได้มีขึ้นด้วยคบคิดกันฉ้อฉล"],["917","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๑๗ อันตั๋วแลกเงินทุกฉบับ ถึงแม้ว่าจะมิใช่สั่งจ่ายให้แก่บุคคลเพื่อเขาสั่งก็ตาม ท่านว่าย่อมโอนให้กันได้ด้วยสลักหลังและส่งมอบ\nเมื่อผู้สั่งจ่ายเขียนลงในด้านหน้าแห่งตั๋วแลกเงินว่า “เปลี่ยนมือไม่ได้” ดังนี้ก็ดี หรือเขียนคำอื่นอันได้ความเป็นทำนองเช่นเดียวกันนั้นก็ดี ท่านว่าตั๋วเงินนั้นย่อมจะโอนให้กันได้แต่โดยรูปการและด้วยผลอย่างการโอนสามัญ\nอนึ่ง ตั๋วเงินจะสลักหลังให้แก่ผู้จ่ายก็ได้ ไม่ว่าผู้จ่ายจะได้รับรองตั๋วนั้นหรือไม่ หรือจะสลักหลังให้แก่ผู้สั่งจ่าย หรือให้แก่คู่สัญญาฝ่ายอื่นใดแห่งตั๋วเงินนั้นก็ได้ ส่วนบุคคลทั้งหลายเหล่านี้ก็ย่อมจะสลักหลังตั๋วเงินนั้นต่อไปอีกได้"],["918","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๑๘ ตั๋วแลกเงินอันสั่งให้ใช้เงินแก่ผู้ถือนั้น ท่านว่าย่อมโอนไปเพียงด้วยส่งมอบให้กัน"],["919","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๑๙ คำสลักหลังนั้นต้องเขียนลงในตั๋วแลกเงิน หรือใบประจำต่อ และต้องลงลายมือชื่อผู้สลักหลัง\nการสลักหลังย่อมสมบูรณ์แม้ทั้งมิได้ระบุชื่อผู้รับประโยชน์ไว้ด้วย หรือแม้ผู้สลักหลังจะมิได้กระทำอะไรยิ่งไปกว่าลงลายมือชื่อของตนที่ด้านหลังตั๋วแลกเงินหรือที่ใบประจำต่อก็ย่อมฟังเป็นสมบูรณ์ดุจกัน การสลักหลังเช่นนี้เรียกว่า “สลักหลังลอย”"],["920","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๒๐ อันการสลักหลังย่อมโอนไปซึ่งบรรดาสิทธิอันเกิดแต่ตั๋วแลกเงิน\nถ้าสลักหลังลอย ผู้ทรงจะปฏิบัติดังกล่าวต่อไปนี้ประการหนึ่งประการใดก็ได้ คือ\n(๑) กรอกความลงในที่ว่างด้วยเขียนชื่อของตนเอง หรือชื่อบุคคลอื่นผู้ใดผู้หนึ่ง\n(๒) สลักหลังตั๋วเงินต่อไปอีกเป็นสลักหลังลอย หรือสลักหลังให้แก่บุคคลอื่นผู้ใดผู้หนึ่ง\n(๓) โอนตั๋วเงินนั้นให้ไปแก่บุคคลภายนอกโดยไม่กรอกความลงในที่ว่าง และไม่สลักหลังอย่างหนึ่งอย่างใด"],["921","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๒๑ การสลักหลังตั๋วแลกเงินซึ่งสั่งให้ใช้เงินแก่ผู้ถือนั้น ย่อมเป็นเพียงประกัน (อาวัล) สำหรับผู้สั่งจ่าย"],["922","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๒๒ การสลักหลังนั้นต้องให้เป็นข้อความอันปราศจากเงื่อนไข ถ้าและวางเงื่อนไขบังคับลงไว้อย่างใด ท่านให้ถือเสมือนว่าข้อเงื่อนไขนั้นมิได้เขียนลงไว้เลย\nอนึ่ง การสลักหลังโอนแต่บางส่วน ท่านว่าเป็นโมฆะ"],["923","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๒๓ ผู้สลักหลังคนใดระบุข้อความห้ามสลักหลังสืบไปลงไว้แล้ว ผู้สลักหลังคนนั้นย่อมไม่ต้องรับผิดต่อบุคคลอันเขาสลักหลังตั๋วแลกเงินนั้นให้ไปในภายหลัง"],["924","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๒๔ ถ้าตั๋วแลกเงินสลักหลังต่อเมื่อสิ้นเวลาเพื่อคัดค้านการไม่รับรองหรือการไม่ใช้เงินนั้นแล้วไซร้ ท่านว่าผู้รับสลักหลังย่อมได้ไปซึ่งสิทธิแห่งการรับรองตามแต่มีต่อผู้จ่าย กับสิทธิไล่เบี้ยเอาแก่บรรดาผู้ซึ่งสลักหลังตั๋วเงินนั้น ภายหลังที่สิ้นเวลาเช่นนั้น\nแต่ถ้าตั๋วเงินนั้นได้มีคัดค้านการไม่รับรองหรือการไม่ใช้เงินมาแต่ก่อนสลักหลังแล้วไซร้ ท่านว่าผู้รับสลักหลังย่อมได้ไปแต่เพียงสิทธิของผู้ซึ่งสลักหลังให้แก่ตนอันมีต่อผู้รับรองต่อผู้สั่งจ่าย และต่อบรรดาผู้ที่สลักหลังตั๋วเงินนั้นมาก่อนย้อนขึ้นไปจนถึงเวลาคัดค้านเท่านั้น"],["925","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๒๕ เมื่อใดความที่สลักหลังมีข้อกำหนดว่า “ราคาอยู่ที่เรียกเก็บ” ก็ดี “เพื่อเรียกเก็บ” ก็ดี “ในฐานจัดการแทน” ก็ดี หรือความสำนวนอื่นใดอันเป็นปริยายว่าตัวแทนไซร้ ท่านว่าผู้ทรงตั๋วแลกเงินจะใช้สิทธิทั้งปวงอันเกิดแต่ตั๋วนั้นก็ย่อมได้ทั้งสิ้น แต่ว่าจะสลักหลังได้เพียงในฐานเป็นตัวแทน\nในกรณีเช่นนี้ คู่สัญญาทั้งหลายซึ่งต้องรับผิดอาจจะต่อสู้ผู้ทรงได้แต่เพียงด้วยข้อต่อสู้อันจะพึงใช้ได้ต่อผู้สลักหลังเท่านั้น"],["926","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๑ การออกและสลักหลังตั๋วแลกเงิน","มาตรา ๙๒๖ เมื่อใดความที่สลักหลังมีข้อกำหนดว่า “ราคาเป็นประกัน” ก็ดี “ราคาเป็นจำนำ” ก็ดี หรือข้อกำหนดอย่างอื่นใดอันเป็นปริยายว่าจำนำไซร้ ท่านว่าผู้ทรงตั๋วแลกเงินจะใช้สิทธิทั้งปวงอันเกิดแต่ตั๋วนั้นก็ย่อมได้ทั้งสิ้น แต่ถ้าผู้ทรงสลักหลังตั๋วนั้น ท่านว่าการสลักหลังย่อมใช้ได้เพียงในฐานเป็นคำสลักหลังของตัวแทน\nคู่สัญญาทั้งหลายซึ่งต้องรับผิดหาอาจจะต่อสู้ผู้ทรงด้วยข้อต่อสู้อันอาศัยความเกี่ยวพันเฉพาะบุคคลระหว่างตนกับผู้สลักหลังนั้นได้ไม่ เว้นแต่การสลักหลังจะได้มีขึ้นด้วยคบคิดกันฉ้อฉล"],["927","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๒ การรับรอง","มาตรา ๙๒๗ อันตั๋วแลกเงินนั้นจะนำไปยื่นแก่ผู้จ่าย ณ ที่อยู่ของผู้จ่าย เพื่อให้รับรองเมื่อไร ๆ ก็ได้ จนกว่าจะถึงเวลากำหนดใช้เงิน และผู้ทรงจะเป็นผู้ยื่นหรือเพียงแต่ผู้ที่ได้ตั๋วนั้นไว้ในครอบครองจะเป็นผู้นำไปยื่นก็ได้\nในตั๋วแลกเงินนั้น ผู้สั่งจ่ายจะลงข้อกำหนดไว้ว่าให้นำยื่นเพื่อรับรอง โดยกำหนดเวลาจำกัดไว้ให้ยื่น หรือไม่กำหนดเวลาก็ได้\nผู้สั่งจ่ายจะห้ามการนำตั๋วแลกเงินยื่นเพื่อรับรองก็ได้ เว้นแต่ในกรณีที่เป็นตั๋วเงินอันได้ออกสั่งให้ใช้เงินเฉพาะ ณ สถานที่อื่นใดอันมิใช่ภูมิลำเนาของผู้จ่าย หรือได้ออกสั่งให้ใช้เงินในเวลาใดเวลาหนึ่งนับแต่ได้เห็น\nอนึ่ง ผู้สั่งจ่ายจะลงข้อกำหนดไว้ว่ายังมิให้นำตั๋วยื่นเพื่อให้รับรองก่อนถึงกำหนดวันใดวันหนึ่งก็ได้\nผู้สลักหลังทุกคนจะลงข้อกำหนดไว้ว่า ให้นำตั๋วเงินยื่นเพื่อรับรอง โดยกำหนดเวลาจำกัดไว้ให้ยื่น หรือไม่กำหนดเวลาก็ได้ เว้นแต่ผู้สั่งจ่ายจะได้ห้ามการรับรอง"],["928","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๒ การรับรอง","มาตรา ๙๒๘ ผู้ทรงตั๋วแลกเงินอันสั่งให้ใช้เงินเมื่อสิ้นระยะเวลากำหนดอย่างใดอย่างหนึ่งนับแต่ได้เห็นนั้น ต้องนำตั๋วเงินยื่นเพื่อให้รับรองภายในหกเดือนนับแต่วันที่ลงในตั๋วเงิน หรือภายในเวลาช้าเร็วกว่านั้นตามแต่ผู้สั่งจ่ายจะได้ระบุไว้"],["929","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๒ การรับรอง","มาตรา ๙๒๙ ภายในบังคับบทบัญญัติมาตรา ๙๒๗ ผู้ทรงตั๋วแลกเงินมีสิทธิที่จะยื่นตั๋วเงินแก่ผู้จ่ายได้ในทันใดเพื่อให้รับรอง ถ้าและเขาไม่รับรองภายในเวลายี่สิบสี่ชั่วโมงไซร้ ผู้ทรงก็มีสิทธิที่จะคัดค้าน"],["930","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๒ การรับรอง","มาตรา ๙๓๐ ในการยื่นตั๋วแลกเงินเพื่อให้เขารับรองนั้น ผู้ทรงไม่จำต้องปล่อยตั๋วนั้นให้ไว้ในมือผู้จ่าย\nอนึ่ง ผู้จ่ายจะเรียกให้ยื่นตั๋วแลกเงินแก่ตนอีกเป็นครั้งที่สองในวันรุ่งขึ้นแต่วันที่ยื่นครั้งแรกนั้นก็ได้ ท่านห้ามมิให้คู่กรณีที่มีส่วนได้เสียยกเอาการที่มิได้อนุวัตตามคำเรียกอันนี้ขึ้นเป็นข้อต่อสู้ เว้นแต่การเรียกนั้นได้ระบุไว้ในคำคัดค้าน"],["931","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๒ การรับรอง","มาตรา ๙๓๑ การรับรองนั้นพึงกระทำด้วยเขียนลงไว้ในด้านหน้าแห่งตั๋วแลกเงินเป็นถ้อยคำสำนวนว่า “รับรองแล้ว” หรือความอย่างอื่นทำนองเช่นเดียวกันนั้น และลงลายมือชื่อของผู้จ่าย อนึ่ง แต่เพียงลงลายมือชื่อของผู้จ่ายลงไว้ในด้านหน้าแห่งตั๋วแลกเงิน ท่านก็จัดว่าเป็นคำรับรองแล้ว"],["932","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๒ การรับรอง","มาตรา ๙๓๒ ตั๋วแลกเงินฉบับใดเขียนสั่งให้ใช้เงินในกำหนดระยะเวลาอย่างใดอย่างหนึ่งนับแต่วันที่ลงในตั๋วเงินนั้น แต่หากมิได้ลงวันไว้ก็ดี หรือตั๋วเงินฉบับใดสั่งให้ใช้เงินในกำหนดระยะเวลาอย่างใดอย่างหนึ่งนับแต่ได้เห็น แต่หากคำรับรองตั๋วนั้นมิได้ลงวันไว้ก็ดี ตั๋วแลกเงินเช่นว่ามานี้ ท่านว่าผู้ทรงจะจดวันออกตั๋วหรือวันรับรองลงตามที่แท้จริงก็ได้แล้วพึงให้ใช้เงินตามนั้น\nอนึ่ง ท่านบัญญัติไว้ว่า ในกรณีที่ผู้ทรงทำการโดยสุจริต แต่ลงวันคลาดเคลื่อนไปด้วยสำคัญผิด และในกรณีลงวันผิดทุกสถาน หากว่าในภายหลังตั๋วเงินนั้นตกไปยังมือผู้ทรงโดยชอบด้วยกฎหมายแล้ว ตั๋วเงินจะเสียไปเพราะเหตุนั้นก็หาไม่ ท่านให้คงเป็นตั๋วเงินที่ใช้ได้ และพึงใช้เงินกันเสมือนดังว่าวันที่ได้จดลงนั้นเป็นวันที่ถูกต้องแท้จริง"],["933","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๒ การรับรอง","มาตรา ๙๓๓ ถ้าการรับรองมิได้ลงวัน ท่านให้ถือเอาวันสุดท้ายแห่งระยะเวลาอันกำหนดไว้เพื่อรับรองนั้นเป็นวันรับรอง"],["934","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๒ การรับรอง","มาตรา ๙๓๔ ถ้าผู้จ่ายเขียนคำรับรองลงในตั๋วแลกเงินแล้ว แต่หากกลับขีดฆ่าเสียก่อนตั๋วเงินนั้นหลุดพ้นไปจากมือตนไซร้ ท่านให้ถือเป็นอันว่าได้บอกปัดไม่รับรอง แต่ถ้าผู้จ่ายได้แจ้งความเป็นหนังสือไปยังผู้ทรง หรือคู่สัญญาฝ่ายอื่นซึ่งได้ลงนามในตั๋วเงินว่าตนรับรองตั๋วเงินนั้นก่อนแล้ว จึงมาขีดฆ่าคำรับรองต่อภายหลังไซร้ ท่านว่าผู้จ่ายก็คงต้องผูกพันอยู่ตามเนื้อความที่ตนได้เขียนรับรองนั้นเอง"],["935","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๒ การรับรอง","มาตรา ๙๓๕ อันการรับรองนั้นย่อมมีได้สองสถาน คือ รับรองตลอดไป หรือรับรองเบี่ยงบ่าย\nการรับรองตลอดไป คือยอมตกลงโดยไม่แก้แย้งคำสั่งของผู้สั่งจ่ายแต่อย่างหนึ่งอย่างใดเลย\nส่วนการรับรองเบี่ยงบ่ายนั้น กล่าวเป็นเนื้อความทำผลแห่งตั๋วเงินให้แผกไปจากที่เขียนสั่งไว้\nกล่าวโดยเฉพาะก็คือว่า ถ้าคำรับรองมีเงื่อนไขก็ดี หรือรับรองแต่เพียงบางส่วนก็ดี ท่านว่าเป็นรับรองเบี่ยงบ่าย"],["936","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๒ การรับรอง","มาตรา ๙๓๖ คำรับรองเบี่ยงบ่ายนั้น ผู้ทรงตั๋วแลกเงินจะบอกปัดเสียก็ได้ และถ้าไม่ได้คำรับรองอันไม่เบี่ยงบ่าย จะถือเอาว่าตั๋วเงินนั้นเป็นอันขาดความเชื่อถือรับรองก็ได้\nถ้าผู้ทรงรับเอาคำรับรองเบี่ยงบ่าย และผู้สั่งจ่ายหรือผู้สลักหลังมิได้ให้อำนาจแก่ผู้ทรงโดยแสดงออกชัดหรือโดยปริยายให้รับเอาคำรับรองเบี่ยงบ่ายเช่นนั้นก็ดี หรือไม่ยินยอมด้วยในภายหลังก็ดี ท่านว่าผู้สั่งจ่ายหรือผู้สลักหลังนั้น ๆ ย่อมหลุดพ้นจากความรับผิดตามตั๋วเงินนั้น แต่บทบัญญัติ ทั้งนี้ ท่านมิให้ใช้ไปถึงการรับรองแต่บางส่วนซึ่งได้บอกกล่าวก่อนแล้วโดยชอบ\nถ้าผู้สั่งจ่ายหรือผู้สลักหลังตั๋วเงินรับคำบอกกล่าวการรับรองเบี่ยงบ่ายแล้วไม่โต้แย้งไปยังผู้ทรงภายในเวลาอันสมควร ท่านให้ถือว่าผู้สั่งจ่ายหรือผู้สลักหลังนั้นเป็นอันได้ยินยอมด้วยกับการนั้นแล้ว"],["937","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๒ การรับรอง","มาตรา ๙๓๗ ผู้จ่ายได้ทำการรับรองตั๋วแลกเงินแล้วย่อมต้องผูกพันในอันจะจ่ายเงินจำนวนที่รับรองตามเนื้อความแห่งคำรับรองของตน"],["938","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๓ อาวัล","มาตรา ๙๓๘ ตั๋วแลกเงินจะมีผู้ค้ำประกันรับประกันการใช้เงินทั้งจำนวนหรือแต่บางส่วนก็ได้ ซึ่งท่านเรียกว่า “อาวัล”\nอันอาวัลนั้นบุคคลภายนอกคนใดคนหนึ่งจะเป็นผู้รับ หรือแม้คู่สัญญาแห่งตั๋วเงินนั้นฝ่ายใดฝ่ายหนึ่งจะเป็นผู้รับก็ได้"],["939","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๓ อาวัล","มาตรา ๙๓๙ อันการรับอาวัลย่อมทำให้กันด้วยเขียนลงในตั๋วเงินนั้นเอง หรือที่ใบประจำต่อ\nในการนี้พึงใช้ถ้อยคำสำนวนว่า “ใช้ได้เป็นอาวัล” หรือสำนวนอื่นใดทำนองเดียวกันนั้น และลงลายมือชื่อผู้รับอาวัล\nอนึ่ง เพียงแต่ลงลายมือชื่อของผู้รับอาวัลในด้านหน้าแห่งตั๋วเงิน ท่านก็จัดว่าเป็นคำรับอาวัลแล้ว เว้นแต่ในกรณีที่เป็นลายมือชื่อของผู้จ่ายหรือผู้สั่งจ่าย\nในคำรับอาวัลต้องระบุว่ารับประกันผู้ใด หากมิได้ระบุ ท่านให้ถือว่ารับประกันผู้สั่งจ่าย"],["940","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๓ อาวัล","มาตรา ๙๔๐ ผู้รับอาวัลย่อมต้องผูกพันเป็นอย่างเดียวกันกับบุคคลซึ่งตนประกัน\nแม้ถึงว่าความรับผิดใช้เงินอันผู้รับอาวัลได้ประกันอยู่นั้น จะตกเป็นใช้ไม่ได้ด้วยเหตุใด ๆ นอกจากเพราะทำผิดแบบระเบียบ ท่านว่าข้อที่สัญญารับอาวัลนั้นก็ยังคงสมบูรณ์\nเมื่อผู้รับอาวัลได้ใช้เงินไปตามตั๋วแลกเงินแล้ว ย่อมได้สิทธิในอันจะไล่เบี้ยเอาแก่บุคคลซึ่งตนได้ประกันไว้ กับทั้งบุคคลทั้งหลายผู้รับผิดแทนตัวผู้นั้น"],["941","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๔ การใช้เงิน","มาตรา ๙๔๑ อันตั๋วแลกเงินนั้น ย่อมจะพึงใช้เงินในวันถึงกำหนด และถึงกำหนดวันใด ผู้ทรงต้องนำตั๋วเงินไปยื่นเพื่อให้ใช้เงินในวันนั้น"],["942","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๔ การใช้เงิน","มาตรา ๙๔๒ อันจะบังคับให้ผู้ทรงตั๋วแลกเงินรับเงินใช้ก่อนตั๋วเงินถึงกำหนดนั้น ท่านว่าหาอาจจะทำได้ไม่\nอนึ่ง ผู้จ่ายคนใดใช้เงินไปแต่ก่อนเวลาตั๋วเงินถึงกำหนด ท่านว่าย่อมทำเช่นนั้นด้วยเสี่ยงเคราะห์ของตนเอง"],["943","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๔ การใช้เงิน","มาตรา ๙๔๓ อันการถึงกำหนดแห่งตั๋วแลกเงินซึ่งสั่งให้ใช้เงินเมื่อสิ้นระยะเวลาอันใดอันหนึ่งนับแต่วันได้เห็นนั้น ท่านให้กำหนดนับแต่วันรับรอง หรือวันคัดค้าน\nถ้าไม่มีคำคัดค้าน และคำรับรองมิได้ลงวัน ท่านให้ถือว่าผู้รับรองได้ให้คำรับรองนั้นในวันท้ายแห่งกำหนดเวลาซึ่งจำกัดไว้ตามกฎหมาย หรือตามสัญญาเพื่อการยื่นตั๋วนั้น"],["944","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๔ การใช้เงิน","มาตรา ๙๔๔ อันตั๋วแลกเงินซึ่งให้ใช้เงินเมื่อได้เห็นนั้น ท่านว่าย่อมจะพึงใช้เงินในวันเมื่อยื่นตั๋ว ทั้งนี้ ต้องยื่นให้ใช้เงินภายในกำหนดเวลา ซึ่งบังคับไว้เพื่อการยื่นให้รับรองตั๋วเงินชนิดให้ใช้เงินในเวลาใดเวลาหนึ่งภายหลังได้เห็นนั้น"],["945","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๔ การใช้เงิน","มาตรา ๙๔๕ การใช้เงินจะเรียกเอาได้ต่อเมื่อได้เวนตั๋วแลกเงินให้ ผู้ใช้เงินจะให้ผู้ทรงลงลายมือชื่อรับเงินในตั๋วเงินนั้นก็ได้"],["946","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๔ การใช้เงิน","มาตรา ๙๔๖ อันตั๋วแลกเงินนั้น ถ้าเขาจะใช้เงินให้แต่เพียงบางส่วน ท่านว่าผู้ทรงจะบอกปัดเสียไม่ยอมรับเอาก็ได้\nถ้าและรับเอาเงินที่เขาใช้แต่เพียงบางส่วน ผู้ทรงต้องบันทึกข้อความนั้นลงไว้ในตั๋วเงิน และส่งมอบใบรับให้แก่ผู้ใช้เงิน"],["947","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๔ การใช้เงิน","มาตรา ๙๔๗ ถ้าตั๋วแลกเงินมิได้ยื่นเพื่อให้ใช้เงินในวันถึงกำหนดไซร้ ท่านว่าผู้รับรองจะเปลื้องตนให้พ้นจากความรับผิดโดยวางจำนวนเงินที่ค้างชำระตามตั๋วนั้นไว้ก็ได้"],["948","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๔ การใช้เงิน","มาตรา ๙๔๘ ถ้าผู้ทรงตั๋วแลกเงินยอมผ่อนเวลาให้แก่ผู้จ่ายไซร้ ท่านว่าผู้ทรงสิ้นสิทธิที่จะไล่เบี้ยเอาแก่ผู้เป็นคู่สัญญาคนก่อน ๆ ซึ่งมิได้ตกลงในการผ่อนเวลานั้น"],["949","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๔ การใช้เงิน","มาตรา ๙๔๙ ภายในบังคับแห่งบทบัญญัติมาตรา ๑๐๐๙ บุคคลผู้ใช้เงินในเวลาถึงกำหนดย่อมเป็นอันหลุดพ้นจากความรับผิด เว้นแต่ตนจะได้ทำการฉ้อฉลหรือมีความประมาทเลินเล่ออย่างร้ายแรง อนึ่ง บุคคลซึ่งกล่าวนี้จำต้องพิสูจน์ให้เห็นจริงว่าได้มีการสลักหลังติดต่อกันเรียบร้อยไม่ขาดสาย แต่ไม่จำต้องพิสูจน์ลายมือชื่อของเหล่าผู้สลักหลัง"],["950","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๕ การสอดเข้าแก้หน้า","มาตรา ๙๕๐ ผู้สั่งจ่ายหรือผู้สลักหลังจะระบุบุคคลผู้หนึ่งผู้ใดไว้ก็ได้ว่าเป็นผู้จะรับรอง หรือใช้เงินยามประสงค์ ณ สถานที่ใช้เงิน\nภายในเงื่อนบังคับดังจะกล่าวต่อไปข้างหน้า บุคคลผู้หนึ่งผู้ใดจะรับรองหรือใช้เงินตามตั๋วแลกเงินในฐานเป็นผู้สอดเข้าแก้หน้าบุคคลใดผู้ลงลายมือชื่อในตั๋วนั้นก็ได้\nผู้สอดเข้าแก้หน้านั้นจะเป็นบุคคลภายนอกก็ได้ แม้จะเป็นผู้จ่ายหรือบุคคลซึ่งต้องรับผิดโดยตั๋วเงินนั้นอยู่แล้วก็ได้ ห้ามแต่ผู้รับรองเท่านั้น\nผู้สอดเข้าแก้หน้าจำต้องให้คำบอกกล่าวโดยไม่ชักช้า เพื่อให้คู่สัญญาฝ่ายซึ่งตนเข้าแก้หน้านั้นทราบการที่ตนเข้าแก้หน้า"],["951","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๕ การสอดเข้าแก้หน้า","มาตรา ๙๕๑ การรับรองด้วยสอดเข้าแก้หน้า ย่อมมีได้ในบรรดากรณีซึ่งผู้ทรงมีสิทธิไล่เบี้ยได้ก่อนถึงกำหนดตามตั๋วเงินอันเป็นตั๋วสามารถจะรับรองได้\nการรับรองด้วยสอดเข้าแก้หน้านั้น ผู้ทรงจะบอกปัดเสียก็ได้ แม้ถึงว่าบุคคลผู้ซึ่งบ่งไว้ว่าจะเป็นผู้รับรอง หรือใช้เงินยามประสงค์นั้นจะเป็นผู้เสนอเข้ารับรองก็บอกปัดได้\nถ้าผู้ทรงยอมให้เขารับรองแล้ว ผู้ทรงย่อมเสียสิทธิไล่เบี้ยก่อนถึงกำหนดเอาแก่คู่สัญญาทั้งหลายซึ่งต้องรับผิดต่อตน"],["952","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๕ การสอดเข้าแก้หน้า","มาตรา ๙๕๒ อันการรับรองด้วยสอดเข้าแก้หน้านั้น ย่อมทำด้วยเขียนระบุความลงบนตั๋วแลกเงิน และลงลายมือชื่อของผู้สอดเข้าแก้หน้าเป็นสำคัญ อนึ่ง ต้องระบุลงไว้ว่าการรับรองนั้นทำให้เพื่อผู้ใด ถ้ามิได้ระบุไว้เช่นนั้น ท่านให้ถือว่าทำให้เพื่อผู้สั่งจ่าย"],["953","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๕ การสอดเข้าแก้หน้า","มาตรา ๙๕๓ ผู้รับรองด้วยสอดเข้าแก้หน้าย่อมต้องรับผิดต่อผู้ทรงตั๋วเงินนั้น และรับผิดต่อผู้สลักหลังทั้งหลายภายหลังคู่สัญญาฝ่ายซึ่งตนเข้าแก้หน้าอย่างเดียวกันกับที่คู่สัญญาฝ่ายนั้นต้องรับผิดอยู่เอง"],["954","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๕ การสอดเข้าแก้หน้า","มาตรา ๙๕๔ อันการใช้เงินเพื่อแก้หน้าย่อมมีได้ในบรรดากรณีซึ่งผู้ทรงมีสิทธิไล่เบี้ยเมื่อตั๋วเงินถึงกำหนดหรือก่อนถึงกำหนด\nการใช้เงินนั้น ท่านว่าอย่างช้าที่สุดต้องทำในวันรุ่งขึ้น แต่วันท้ายแห่งกำหนดเวลาซึ่งจำกัดอนุญาตไว้ให้ทำคำคัดค้านการไม่ใช้เงิน"],["955","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๕ การสอดเข้าแก้หน้า","มาตรา ๙๕๕ ถ้าตั๋วแลกเงินได้รับรองเพื่อแก้หน้าแล้วก็ดี หรือได้มีตัวบุคคลระบุว่าเป็นผู้จะใช้เงินยามประสงค์แล้วก็ดี ผู้ทรงต้องยื่นตั๋วเงินนั้นต่อบุคคลนั้น ๆ ณ สถานที่ใช้เงิน และถ้าจำเป็นก็ต้องจัดการทำคำคัดค้านการไม่ใช้เงินอย่างช้าที่สุดในวันรุ่งขึ้นแต่วันท้ายแห่งกำหนดเวลาอันจำกัดไว้เพื่อทำคำคัดค้าน\nถ้าไม่คัดค้านภายในกำหนดเวลานั้น ท่านว่าคู่สัญญาฝ่ายที่ได้ระบุตัวผู้ใช้เงินยามประสงค์ หรือคู่สัญญาฝ่ายซึ่งได้มีผู้รับรองตั๋วเงินให้แล้วนั้น กับทั้งบรรดาผู้สลักหลังในภายหลังย่อมเป็นอันหลุดพ้นจากความรับผิด"],["956","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๕ การสอดเข้าแก้หน้า","มาตรา ๙๕๖ การใช้เงินเพื่อแก้หน้านั้น ใช้เพื่อคู่สัญญาฝ่ายใดต้องใช้จงเต็มจำนวนอันคู่สัญญาฝ่ายนั้นจะต้องใช้ เว้นแต่ค่าชักส่วนลดดังบัญญัติไว้ในมาตรา ๙๖๘ (๔)\nผู้ทรงคนใดบอกปัดไม่ยอมรับเงินอันเขาใช้ให้ ท่านว่าผู้ทรงคนนั้นย่อมเสียสิทธิในอันจะไล่เบี้ยเอาแก่บุคคลทั้งหลายเหล่านั้นซึ่งพอที่จะได้หลุดพ้นจากความรับผิดเพราะการใช้เงินนั้น"],["957","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๕ การสอดเข้าแก้หน้า","มาตรา ๙๕๗ การใช้เงินเพื่อแก้หน้าต้องทำให้เป็นหลักฐานด้วยใบรับเขียนลงในตั๋วแลกเงิน ระบุความว่าได้ใช้เงินเพื่อบุคคลผู้ใด ถ้ามิได้ระบุตัวไว้ดังนั้น ท่านให้ถือว่าการใช้เงินนั้นได้ทำไปเพื่อผู้สั่งจ่าย\nตั๋วแลกเงินกับทั้งคำคัดค้านหากว่าได้ทำคัดค้าน ต้องส่งให้แก่บุคคลผู้ใช้เงินเพื่อแก้หน้า"],["958","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๕ การสอดเข้าแก้หน้า","มาตรา ๙๕๘ บุคคลผู้ใช้เงินเพื่อแก้หน้าย่อมรับช่วงสิทธิทั้งปวงของผู้ทรงอันมีต่อคู่สัญญาฝ่ายซึ่งตนได้ใช้เงินแทนไป และต่อคู่สัญญาทั้งหลายผู้ต้องรับผิดต่อคู่สัญญาฝ่ายนั้น แต่หาอาจจะสลักหลังตั๋วแลกเงินนั้นอีกต่อไปได้ไม่\nอนึ่ง บรรดาผู้ซึ่งสลักหลังภายหลังคู่สัญญาฝ่ายซึ่งเขาได้ใช้เงินแทนไปนั้น ย่อมหลุดพ้นจากความรับผิด\nในกรณีแข่งกันเข้าใช้เงินเพื่อแก้หน้า ท่านว่าการใช้เงินรายใดจะให้ผลปลดหนี้มากรายที่สุด พึงนิยมเอารายนั้นเป็นดียิ่ง\nถ้าไม่ดำเนินตามวิธีดังกล่าวนี้ ท่านว่าผู้ใช้เงินทั้งที่รู้เช่นนั้นย่อมเสียสิทธิในอันจะไล่เบี้ยเอาแก่บุคคลทั้งหลายซึ่งพอที่จะได้หลุดพ้นจากความรับผิด"],["959","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๖ สิทธิไล่เบี้ยเพราะเขาไม่รับรองหรือไม่ใช้เงิน","มาตรา ๙๕๙ ผู้ทรงตั๋วแลกเงินจะใช้สิทธิไล่เบี้ยเอาแก่บรรดาผู้สลักหลัง ผู้สั่งจ่าย และบุคคลอื่น ๆ ซึ่งต้องรับผิดตามตั๋วเงินนั้นก็ได้ คือ\nก) ไล่เบี้ยได้เมื่อตั๋วเงินถึงกำหนดในกรณีไม่ใช้เงิน\nข) ไล่เบี้ยได้แม้ทั้งตั๋วเงินยังไม่ถึงกำหนดในกรณีดังจะกล่าวต่อไปนี้ คือ\n(๑) ถ้าเขาบอกปัดไม่รับรองตั๋วเงิน\n(๒) ถ้าผู้จ่ายหากจะได้รับรองหรือไม่ก็ตาม ตกเป็นคนล้มละลาย หรือได้งดเว้นการใช้หนี้ แม้การงดเว้นใช้หนี้นั้น จะมิได้มีคำพิพากษาเป็นหลักฐานก็ตาม หรือถ้าผู้จ่ายถูกยึดทรัพย์และการยึดทรัพย์นั้นไร้ผล\n(๓) ถ้าผู้สั่งจ่ายตั๋วเงินชนิดไม่จำเป็นต้องให้ผู้ใดรับรองนั้นตกเป็นคนล้มละลาย"],["960","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๖ สิทธิไล่เบี้ยเพราะเขาไม่รับรองหรือไม่ใช้เงิน","มาตรา ๙๖๐ การที่ตั๋วแลกเงินขาดรับรองหรือขาดใช้เงินนั้น ต้องทำให้เป็นหลักฐานตามแบบระเบียบด้วยเอกสารฉบับหนึ่ง เรียกว่าคำคัดค้าน\nคำคัดค้านการไม่ใช้เงินต้องทำในวันซึ่งจะพึงใช้เงินตามตั๋วนั้น หรือวันใดวันหนึ่งภายในสามวันต่อแต่นั้นไป\nคำคัดค้านการไม่รับรองต้องทำภายในจำกัดเวลาซึ่งกำหนดไว้เพื่อการยื่นตั๋วเงินให้เขารับรอง หรือภายในสามวันต่อแต่นั้นไป\nเมื่อมีคำคัดค้านการไม่รับรองขึ้นแล้วก็เป็นอันไม่ต้องยื่นเพื่อใช้เงิน และไม่ต้องทำคำคัดค้านการไม่ใช้เงิน\nในกรณีทั้งหลายซึ่งกล่าวไว้ในมาตรา ๙๕๙ ข) (๒) นั้น ท่านว่าผู้ทรงยังหาอาจจะใช้สิทธิไล่เบี้ยได้ไม่ จนกว่าจะได้ยื่นตั๋วเงินให้ผู้จ่ายใช้เงิน และได้ทำคำคัดค้านขึ้นแล้ว\nในกรณีทั้งหลายดังกล่าวไว้ในมาตรา ๙๕๙ ข) (๓) นั้น ท่านว่าถ้าเอาคำพิพากษาซึ่งสั่งให้ผู้สั่งจ่ายเป็นคนล้มละลายออกแสดง ก็เป็นการเพียงพอที่จะทำให้ผู้ทรงสามารถใช้สิทธิไล่เบี้ยได้"],["961","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๖ สิทธิไล่เบี้ยเพราะเขาไม่รับรองหรือไม่ใช้เงิน","มาตรา ๙๖๑ คำคัดค้านนั้นให้นายอำเภอ หรือผู้ทำการแทนนายอำเภอ หรือทนายความผู้ได้รับอนุญาตเพื่อการนี้เป็นผู้ทำ\nรัฐมนตรีกระทรวงยุติธรรมมีอำนาจออกกฎข้อบังคับเพื่อปฏิบัติการให้เป็นไปตามบทบัญญัติแห่งประมวลกฎหมายนี้ อันว่าด้วยการออกใบอนุญาตและการทำคำคัดค้าน รวมทั้งกำหนดอัตราค่าฤชาธรรมเนียมอันเกี่ยวกับการนั้น"],["962","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๖ สิทธิไล่เบี้ยเพราะเขาไม่รับรองหรือไม่ใช้เงิน","มาตรา ๙๖๒ ในคำคัดค้านนั้นนอกจากชื่อ ตำแหน่ง และลายมือชื่อของผู้ทำ ต้องมีสำเนาตั๋วเงินกับรายการสลักหลังทั้งหมดตรงถ้อยตรงคำกับระบุความดังจะกล่าวต่อไปนี้ คือ\n(๑) ชื่อ หรือยี่ห้อของบุคคลผู้คัดค้านและผู้ถูกคัดค้าน\n(๒) มูล หรือเหตุที่ต้องทำคำคัดค้านตั๋วเงิน การทวงถามและคำตอบ ถ้ามี หรือข้อที่ว่าหาตัวผู้จ่ายหรือผู้รับรองไม่พบ\n(๓) ถ้ามีการรับรอง หรือใช้เงินเพื่อแก้หน้า ให้แถลงลักษณะแห่งการเข้าแก้หน้าทั้งชื่อหรือยี่ห้อของผู้รับรองหรือผู้ใช้เงินเพื่อแก้หน้าและชื่อบุคคลซึ่งเขาเข้าแก้หน้านั้นด้วย\n(๔) สถานที่และวันทำคำคัดค้าน\nให้ผู้ทำคำคัดค้านส่งมอบคำคัดค้านแก่ผู้ร้องขอให้ทำ และให้ผู้ทำคำคัดค้านรีบส่งคำบอกกล่าวการคัดค้านนั้นไปยังผู้ถูกคัดค้าน ถ้าทราบภูมิลำเนาก็ให้ส่งโดยจดหมายลงทะเบียนไปรษณีย์ หรือส่งมอบไว้ ณ ภูมิลำเนาของผู้นั้นก็ได้ ถ้าไม่ทราบภูมิลำเนาก็ให้ปิดสำเนาคำคัดค้านไว้ยังที่ซึ่งเห็นได้ง่าย ณ ที่ว่าการอำเภอประจำท้องที่อันผู้ถูกคัดค้านมีถิ่นที่อยู่ครั้งหลังที่สุด"],["963","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๖ สิทธิไล่เบี้ยเพราะเขาไม่รับรองหรือไม่ใช้เงิน","มาตรา ๙๖๓ ผู้ทรงต้องให้คำบอกกล่าวการที่เขาไม่รับรองตั๋วแลกเงิน หรือไม่ใช้เงินนั้นไปยังผู้สลักหลังถัดตนขึ้นไปกับทั้งผู้สั่งจ่ายด้วยภายในเวลาสี่วันต่อจากวันคัดค้าน หรือต่อจากวันยื่นตั๋วในกรณีที่มีข้อกำหนดว่า “ไม่จำต้องมีคำคัดค้าน”\nผู้สลักหลังทุก ๆ คนต้องให้คำบอกกล่าวไปยังผู้สลักหลังถัดตนขึ้นไปภายในสองวัน ให้ทราบคำบอกกล่าวอันตนได้รับ จดแจ้งให้ทราบชื่อและสำนักของผู้ที่ได้ให้คำบอกกล่าวมาก่อน ๆ นั้นด้วย ทำเช่นนี้ติดต่อกันไปโดยลำดับจนกระทั่งถึงผู้สั่งจ่าย อนึ่ง จำกัดเวลาซึ่งกล่าวมานั้น ท่านนับแต่เมื่อคนหนึ่ง ๆ ได้รับคำบอกกล่าวแต่คนก่อน\nถ้าผู้สลักหลังคนหนึ่งคนใดมิได้ระบุสำนักของตนไว้ก็ดี หรือได้ระบุแต่อ่านไม่ได้ความก็ดี ท่านว่าสุดแต่คำบอกกล่าวได้ส่งไปยังผู้สลักหลังคนก่อนก็เป็นอันพอแล้ว\nบุคคลผู้จะต้องให้คำบอกกล่าว จะทำคำบอกกล่าวเป็นรูปอย่างใดก็ได้ทั้งสิ้น แม้เพียงแต่ด้วยส่งตั๋วแลกเงินคืนก็ใช้ได้ อนึ่ง ต้องพิสูจน์ได้ว่าได้ส่งคำบอกกล่าวภายในเวลากำหนด\nถ้าส่งคำบอกกล่าวเป็นหนังสือจดทะเบียนไปรษณีย์ หากว่าหนังสือนั้นได้ส่งไปรษณีย์ภายในเวลากำหนดดังกล่าวมานั้นไซร้ ท่านให้ถือว่าคำบอกกล่าวเป็นอันได้ส่งภายในจำกัดเวลาบังคับแล้ว\nบุคคลซึ่งมิได้ให้คำบอกกล่าวภายในจำกัดเวลาดังได้ว่ามานั้นหาเสียสิทธิไล่เบี้ยไม่ แต่จะต้องรับผิดเพื่อความเสียหายอย่างใด ๆ อันเกิดแต่ความประมาทเลินเล่อของตน แต่ท่านมิให้คิดค่าสินไหมทดแทนเกินกว่าจำนวนในตั๋วแลกเงิน"],["964","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๖ สิทธิไล่เบี้ยเพราะเขาไม่รับรองหรือไม่ใช้เงิน","มาตรา ๙๖๔ ด้วยข้อกำหนดเขียนลงไว้ว่า “ไม่จำเป็นต้องมีคำคัดค้าน” ก็ดี “ไม่มีคัดค้าน” ก็ดี หรือสำนวนอื่นใดทำนองนั้นก็ดี ผู้สั่งจ่ายหรือผู้สลักหลังจะยอมปลดเปลื้องผู้ทรงจากการทำคำคัดค้านการไม่รับรองหรือการไม่ใช้เงินก็ได้ เพื่อตนจะได้ใช้สิทธิไล่เบี้ย\nข้อกำหนดอันนี้ ย่อมไม่ปลดผู้ทรงให้พ้นจากหน้าที่นำตั๋วเงินยื่นภายในเวลากำหนด หรือจากหน้าที่ให้คำบอกกล่าวตั๋วเงินขาดความเชื่อถือแก่ผู้สลักหลังคนก่อนหรือผู้สั่งจ่าย อนึ่ง หน้าที่นำสืบว่าไม่ปฏิบัติให้เป็นไปตามกำหนดเวลาจำกัดนั้น ย่อมตกอยู่แก่บุคคลผู้แสวงจะใช้ความข้อนั้นเป็นข้อต่อสู้ผู้ทรงตั๋วแลกเงิน\nข้อกำหนดอันนี้ ถ้าผู้สั่งจ่ายเป็นผู้เขียนลงไปแล้ว ย่อมเป็นผลตลอดถึงคู่สัญญาทั้งปวงบรรดาที่ได้ลงลายมือชื่อในตั๋วเงินนั้น ถ้าและทั้งมีข้อกำหนดดังนี้แล้ว ผู้ทรงยังขืนทำคำคัดค้านไซร้ ท่านว่าผู้ทรงต้องเป็นผู้ออกค่าใช้จ่ายเพื่อการนั้น หากว่าข้อกำหนดนั้นผู้สลักหลังเป็นผู้เขียนลง และถ้ามีคัดค้านทำขึ้นไซร้ ท่านว่าค่าใช้จ่ายในการคัดค้านนั้น อาจจะเรียกเอาใช้ได้จากคู่สัญญาอื่น ๆ บรรดาที่ได้ลงลายมือชื่อในตั๋วเงินนั้น"],["965","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๖ สิทธิไล่เบี้ยเพราะเขาไม่รับรองหรือไม่ใช้เงิน","มาตรา ๙๖๕ ในกรณีตั๋วเงินภายในประเทศ ถ้าผู้จ่ายบันทึกลงไว้ในตั๋วแลกเงินเป็นข้อความบอกปัดไม่รับรองหรือไม่ยอมใช้เงิน ทั้งลงวันที่บอกปัดลงลายมือชื่อไว้ด้วยแล้ว ท่านว่าคำคัดค้านนั้นก็เป็นอันไม่จำเป็นต้องทำ และผู้ทรงต้องส่งคำบอกกล่าวขาดความเชื่อถือไปยังบุคคลซึ่งตนจำนงจะไล่เบี้ยภายในสี่วันต่อจากวันเขาบอกปัดไม่รับรองนั้น"],["966","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๖ สิทธิไล่เบี้ยเพราะเขาไม่รับรองหรือไม่ใช้เงิน","มาตรา ๙๖๖ คำบอกกล่าวขาดความเชื่อถือในกรณีไม่รับรองหรือไม่ใช้เงินนั้น ต้องมีรายการคือ วันที่ลงในตั๋วแลกเงิน ชื่อหรือยี่ห้อของผู้สั่งจ่ายและของผู้จ่าย จำนวนเงินในตั๋วเงิน วันถึงกำหนดใช้เงิน ชื่อหรือยี่ห้อและสำนักของผู้ทรงตั๋วเงิน วันที่คัดค้านหรือวันที่บอกปัดไม่รับรองหรือไม่ใช้เงิน กับข้อความว่าเขาไม่รับรองหรือไม่ใช้เงินตามตั๋วเงินนั้น"],["967","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๖ สิทธิไล่เบี้ยเพราะเขาไม่รับรองหรือไม่ใช้เงิน","มาตรา ๙๖๗ ในเรื่องตั๋วแลกเงินนั้น บรรดาบุคคลผู้สั่งจ่ายก็ดี รับรองก็ดี สลักหลังก็ดี หรือรับประกันด้วยอาวัลก็ดี ย่อมต้องร่วมกันรับผิดต่อผู้ทรง\nผู้ทรงย่อมมีสิทธิว่ากล่าวเอาความแก่บรรดาบุคคลเหล่านี้เรียงตัวหรือรวมกันก็ได้ โดยมิพักต้องดำเนินตามลำดับที่คนเหล่านั้นมาต้องผูกพัน\nสิทธิเช่นเดียวกันนี้ ย่อมมีแก่บุคคลทุกคนซึ่งได้ลงลายมือชื่อในตั๋วเงินและเข้าถือเอาตั๋วเงินนั้น ในการที่จะใช้บังคับเอาแก่ผู้ที่มีความผูกพันอยู่แล้วก่อนตน\nการว่ากล่าวเอาความแก่คู่สัญญาคนหนึ่ง ซึ่งต้องรับผิดย่อมไม่ตัดหนทางที่จะว่ากล่าวเอาความแก่คู่สัญญาคนอื่น ๆ แม้ทั้งจะเป็นฝ่ายอยู่ในลำดับภายหลังบุคคลที่ได้ว่ากล่าวเอาความมาก่อน"],["968","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๖ สิทธิไล่เบี้ยเพราะเขาไม่รับรองหรือไม่ใช้เงิน","มาตรา ๙๖๘ ผู้ทรงจะเรียกร้องเอาเงินใช้จากบุคคลซึ่งตนใช้สิทธิไล่เบี้ยนั้นก็ได้ คือ\n(๑) จำนวนเงินในตั๋วแลกเงินซึ่งเขาไม่รับรองหรือไม่ใช้กับทั้งดอกเบี้ยด้วย หากว่ามีข้อกำหนดไว้ว่าให้คิดดอกเบี้ย\n(๒) ดอกเบี้ยอัตราร้อยละห้าต่อปีนับแต่วันถึงกำหนด\n(๓) ค่าใช้จ่ายในการคัดค้าน และในการส่งคำบอกกล่าวของผู้ทรงไปยังผู้สลักหลังถัดจากตนขึ้นไปและผู้สั่งจ่าย กับทั้งค่าใช้จ่ายอื่น ๆ\n(๔) ค่าชักส่วนลดซึ่งถ้าไม่มีข้อตกลงกันไว้ ท่านให้คิดร้อยละ ในต้นเงินอันจะพึงใช้ตามตั๋วเงิน และไม่ว่ากรณีจะเป็นอย่างไร ท่านมิให้คิดสูงกว่าอัตรานี้\nถ้าใช้สิทธิไล่เบี้ยก่อนถึงกำหนด ท่านให้หักลดจำนวนเงินในตั๋วเงินลงให้ร้อยละห้า"],["969","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๖ สิทธิไล่เบี้ยเพราะเขาไม่รับรองหรือไม่ใช้เงิน","มาตรา ๙๖๙ คู่สัญญาฝ่ายซึ่งเข้าถือเอาและใช้เงินตามตั๋วแลกเงิน อาจจะเรียกเอาเงินใช้จากคู่สัญญาทั้งหลายซึ่งต้องรับผิดต่อตนได้ คือ\n(๑) เงินเต็มจำนวนซึ่งตนได้ใช้ไป\n(๒) ดอกเบี้ยในจำนวนเงินนั้น คิดอัตราร้อยละห้าต่อปีนับแต่วันที่ได้ใช้เงินไป\n(๓) ค่าใช้จ่ายต่าง ๆ อันตนต้องออกไป\n(๔) ค่าชักส่วนลดจากต้นเงินจำนวนในตั๋วแลกเงิน ตามที่กำหนดไว้ในมาตรา ๙๖๘\nอนุมาตรา (๔)"],["970","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๖ สิทธิไล่เบี้ยเพราะเขาไม่รับรองหรือไม่ใช้เงิน","มาตรา ๙๗๐ คู่สัญญาทุกฝ่ายซึ่งต้องรับผิดและถูกไล่เบี้ย หรืออยู่ในฐานจะถูกไล่เบี้ยได้นั้น อาจจะใช้เงินแล้วเรียกให้เขาสละตั๋วเงินให้แก่ตนได้ รวมทั้งคำคัดค้านและบัญชีรับเงินด้วย\nผู้สลักหลังทุกคนซึ่งเข้าถือเอาและใช้เงินตามตั๋วแลกเงินแล้ว จะขีดฆ่าคำสลักหลังของตนเองและของเหล่าผู้สลักหลังภายหลังตนนั้นเสียก็ได้"],["971","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๖ สิทธิไล่เบี้ยเพราะเขาไม่รับรองหรือไม่ใช้เงิน","มาตรา ๙๗๑ ผู้สั่งจ่ายก็ดี ผู้รับรองก็ดี ผู้สลักหลังคนก่อนก็ดี ซึ่งเขาสลักหลังหรือโอนตั๋วแลกเงินให้อีกทอดหนึ่งนั้น หามีสิทธิจะไล่เบี้ยเอาแก่คู่สัญญาฝ่ายซึ่งตนย่อมต้องรับผิดต่อเขาอยู่ก่อนแล้วตามตั๋วเงินนั้นได้ไม่"],["972","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๖ สิทธิไล่เบี้ยเพราะเขาไม่รับรองหรือไม่ใช้เงิน","มาตรา ๙๗๒ ในกรณีใช้สิทธิไล่เบี้ยภายหลังการรับรองแต่บางส่วน ท่านว่าคู่สัญญาฝ่ายซึ่งใช้เงินอันเป็นจำนวนเขาไม่รับรองนั้น อาจจะเรียกให้จดระบุความที่ใช้เงินนี้ลงไว้ในตั๋วเงิน และเรียกให้ทำใบรับให้แก่ตนได้ อนึ่ง ผู้ทรงตั๋วเงินต้องให้สำเนาตั๋วเงินอันรับรองว่าถูกต้องแก่คู่สัญญาฝ่ายนั้นพร้อมทั้งคำคัดค้านด้วย เพื่อให้เขาสามารถใช้สิทธิไล่เบี้ยในภายหลังได้สืบไป"],["973","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๖ สิทธิไล่เบี้ยเพราะเขาไม่รับรองหรือไม่ใช้เงิน","มาตรา ๙๗๓ เมื่อกำหนดเวลาจำกัดซึ่งจะกล่าวต่อไปนี้ได้ล่วงพ้นไปแล้ว คือ\n(๑) กำหนดเวลาสำหรับยื่นตั๋วแลกเงินชนิดให้ใช้เงินเมื่อได้เห็น หรือในระยะเวลาอย่างใดอย่างหนึ่งภายหลังได้เห็น\n(๒) กำหนดเวลาสำหรับทำคำคัดค้านการไม่รับรองหรือการไม่ใช้เงิน\n(๓) กำหนดเวลาสำหรับยื่นตั๋วเพื่อให้ใช้เงิน ในกรณีที่มีข้อกำหนดว่า “ไม่จำต้องมีคำคัดค้าน”\nท่านว่าผู้ทรงย่อมสิ้นสิทธิที่จะไล่เบี้ยเอาแก่เหล่าผู้สลักหลัง ผู้สั่งจ่าย และคู่สัญญาอื่น ๆ ผู้ต้องรับผิด เว้นแต่ผู้รับรอง\nอนึ่ง ถ้าไม่ยื่นตั๋วแลกเงินเพื่อให้เขารับรองภายในเวลาจำกัดดังผู้สั่งจ่ายได้กำหนดไว้ ท่านว่าผู้ทรงย่อมเสียสิทธิที่จะไล่เบี้ยทั้งเพื่อการที่เขาไม่ใช้เงิน และเพื่อการที่เขาไม่รับรอง เว้นแต่จะปรากฏจากข้อกำหนดว่า ผู้สั่งจ่ายหมายเพียงแต่จะปลดตนเองให้พ้นจากประกันการรับรอง\nถ้าข้อกำหนดจำกัดเวลายื่นตั๋วแลกเงินนั้นมีอยู่ที่คำสลักหลัง ท่านว่าเฉพาะแต่ผู้สลักหลังเท่านั้นจะอาจเอาประโยชน์ในข้อกำหนดนั้นได้"],["974","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๖ สิทธิไล่เบี้ยเพราะเขาไม่รับรองหรือไม่ใช้เงิน","มาตรา ๙๗๔ การยื่นตั๋วแลกเงินก็ดี การทำคำคัดค้านก็ดี ถ้ามีเหตุจำเป็นอันมิอาจก้าวล่วงเสียได้มาขัดขวางมิให้ทำได้ภายในกำหนดเวลาจำกัดสำหรับการนั้นไซร้ ท่านให้ยืดกำหนดเวลาออกไปอีกได้\nเหตุจำเป็นอันมิอาจก้าวล่วงเสียได้ดังว่ามานั้น ผู้ทรงต้องบอกกล่าวแก่ผู้สลักหลังคนถัดตนขึ้นไปโดยไม่ชักช้า และคำบอกกล่าวนั้นต้องเขียนระบุลงในตั๋วเงิน หรือใบประจำต่อ ต้องลงวันและลงลายมือชื่อของผู้ทรง การอื่น ๆ นอกจากที่กล่าวนี้ ท่านให้บังคับตามบทบัญญัติมาตรา ๙๖๓\nเมื่อเหตุจำเป็นอันมิอาจก้าวล่วงเสียได้นั้นสุดสิ้นลงแล้ว ผู้ทรงต้องยื่นตั๋วเงินให้เขารับรองหรือใช้เงินโดยไม่ชักช้า และถ้าจำเป็นก็ทำคำคัดค้านขึ้น\nถ้าเหตุจำเป็นอันมิอาจก้าวล่วงเสียได้นั้น ยังคงมีอยู่ต่อไปจนเป็นเวลากว่าสามสิบวันภายหลังตั๋วเงินถึงกำหนดไซร้ ท่านว่าจะใช้สิทธิไล่เบี้ยก็ได้ และถ้าเช่นนั้นการยื่นตั๋วเงินก็ดี การทำคำคัดค้านก็ดี เป็นอันไม่จำเป็นต้องทำ\nในส่วนตั๋วเงินชนิดที่ให้ใช้เงินเมื่อได้เห็น หรือให้ใช้เงินในระยะเวลาอย่างหนึ่งอย่างใดภายหลังได้เห็นนั้น กำหนดสามสิบวันเช่นว่ามานี้ ท่านให้นับแต่วันที่ผู้ทรงได้ให้คำบอกกล่าวเหตุจำเป็นอันมิอาจก้าวล่วงเสียได้นั้นแก่ผู้สลักหลังถัดตนขึ้นไป และถึงแม้ว่าจะเป็นการก่อนล่วงกำหนดเวลายื่นตั๋วเงิน ก็ให้นับเช่นนั้น"],["975","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๗ ตั๋วแลกเงินเป็นสำรับ","มาตรา ๙๗๕ อันตั๋วแลกเงินนั้น นอกจากชนิดที่สั่งจ่ายแก่ผู้ถือแล้ว จะออกไปเป็นคู่ฉีกความต้องกันสองฉบับหรือกว่านั้นก็อาจจะออกได้\nคู่ฉีกเหล่านี้ต้องมีหมายลำดับลงไว้ในตัวตราสารนั้นเอง มิฉะนั้นคู่ฉีกแต่ละฉบับย่อมใช้ได้เป็นตั๋วแลกเงินฉบับหนึ่ง ๆ แยกเป็นตั๋วเงินต่างฉบับกัน\nบุคคลทุกคนซึ่งเป็นผู้ทรงตั๋วเงินอันมิได้ระบุว่าได้ออกเป็นตั๋วเดี่ยวนั้น จะเรียกให้ส่งมอบคู่ฉีกสองฉบับหรือกว่านั้นแก่ตนก็ได้ โดยยอมให้คิดค่าใช้จ่ายเอาแก่ตน ในการนี้ผู้ทรงต้องว่ากล่าวไปยังผู้สลักหลังคนถัดตนขึ้นไป และผู้สลักหลังคนนั้นก็จำต้องช่วยผู้ทรงว่ากล่าวไปยังผู้ที่สลักหลังให้แก่ตนต่อไปอีก สืบเนื่องกันไปเช่นนี้ตลอดสายจนกระทั่งถึงผู้สั่งจ่าย อนึ่ง ผู้สลักหลังทั้งหลายจำต้องเขียนคำสลักหลังของตนเป็นความเดียวกันลงในฉบับคู่ฉีกใหม่แห่งตั๋วสำรับนั้นอีกด้วย"],["976","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๗ ตั๋วแลกเงินเป็นสำรับ","มาตรา ๙๗๖ ถ้าผู้ทรงตั๋วแลกเงินสำรับหนึ่งสลักหลังคู่ฉีกสองฉบับหรือกว่านั้นให้แก่บุคคลต่างคนกัน ท่านว่าผู้ทรงย่อมต้องรับผิดตามคู่ฉีกเช่นว่านั้นทุก ๆ ฉบับ และผู้สลักหลังภายหลังผู้ทรงทุก ๆ คนก็ต้องรับผิดตามคู่ฉีกอันตนเองได้สลักหลังลงไปนั้น เสมือนดังว่าคู่ฉีกที่ว่านั้นแยกเป็นตั๋วเงินต่างฉบับกัน"],["977","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๗ ตั๋วแลกเงินเป็นสำรับ","มาตรา ๙๗๗ ถ้าคู่ฉีกสองฉบับหรือกว่านั้นในสำรับหนึ่ง ได้เปลี่ยนมือไปยังผู้ทรงโดยชอบด้วยกฎหมายต่างคนกันไซร้ ในระหว่างผู้ทรงเหล่านั้นด้วยกัน คนใดได้ไปเป็นสิทธิก่อน ท่านให้ถือว่าคนนั้นเป็นเจ้าของอันแท้จริงแห่งตั๋วเงินนั้น แต่ความใด ๆ ในบทมาตรานี้ไม่กระทบกระทั่งถึงสิทธิของบุคคลผู้ทำการโดยชอบด้วยกฎหมายรับรองหรือใช้เงินไปตามคู่ฉีกฉบับซึ่งเขายื่นแก่ตนก่อน"],["978","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๗ ตั๋วแลกเงินเป็นสำรับ","มาตรา ๙๗๘ คำรับรองนั้นจะเขียนลงในคู่ฉีกฉบับใดก็ได้ และจะต้องเขียนลงในคู่ฉีกแต่เพียงฉบับเดียวเท่านั้น\nถ้าผู้จ่ายรับรองลงไปกว่าฉบับหนึ่ง และคู่ฉีกซึ่งรับรองเช่นนั้นตกไปถึงมือผู้ทรงโดยชอบด้วยกฎหมายต่างคนกันไซร้ ท่านว่าผู้จ่ายจะต้องรับผิดตามคู่ฉีกนั้น ๆ ทุกฉบับ เสมือนดังว่าแยกเป็นตั๋วเงินต่างฉบับกัน"],["979","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๗ ตั๋วแลกเงินเป็นสำรับ","มาตรา ๙๗๙ ถ้าผู้รับรองตั๋วเงินซึ่งออกเป็นสำรับใช้เงินไปโดยมิได้เรียกให้ส่งมอบคู่ฉีกฉบับซึ่งมีคำรับรองของตนนั้นให้แก่ตนและในเวลาตั๋วเงินถึงกำหนด คู่ฉีกฉบับนั้นไปตกอยู่ในมือผู้ทรงโดยชอบด้วยกฎหมายคนใดคนหนึ่งไซร้ ท่านว่าผู้รับรองจะต้องรับผิดต่อผู้ทรงคู่ฉีกฉบับนั้น"],["980","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๗ ตั๋วแลกเงินเป็นสำรับ","มาตรา ๙๘๐ ภายในบังคับแห่งบทบัญญัติทั้งหลายซึ่งกล่าวมาก่อนนั้น ถ้าคู่ฉีกฉบับใดแห่งตั๋วเงินออกเป็นสำรับได้หลุดพ้นไปด้วยการใช้เงินหรือประการอื่นฉบับหนึ่งแล้ว ท่านว่าตั๋วเงินทั้งสำรับก็ย่อมหลุดพ้นไปตามกัน"],["981","b3t21","หมวด ๒ ตั๋วแลกเงิน","ส่วนที่ ๗ ตั๋วแลกเงินเป็นสำรับ","มาตรา ๙๘๑ คู่สัญญาซึ่งส่งคู่ฉีกฉบับหนึ่งไปให้เขารับรอง ต้องเขียนแถลงลงในคู่ฉีกฉบับอื่นว่าคู่ฉีกฉบับโน้นอยู่ในมือบุคคลชื่อไร ส่วนบุคคลคนนั้นก็จำต้องสละตั๋วให้แก่ผู้ทรงโดยชอบด้วยกฎหมายแห่งคู่ฉีกฉบับอื่นนั้น\nถ้าบุคคลคนนั้นบอกปัดไม่ยอมให้ ท่านว่าผู้ทรงยังจะใช้สิทธิไล่เบี้ยไม่ได้จนกว่าจะได้ทำคัดค้านระบุความดังต่อไปนี้ คือ\n(๑) ว่าคู่ฉีกฉบับซึ่งได้ส่งไปเพื่อรับรองนั้น เขาไม่สละให้แก่ตนเมื่อทวงถาม\n(๒) ว่าไม่สามารถจะให้เขารับรองหรือใช้เงินด้วยคู่ฉีกฉบับอื่นได้"],["982","b3t21","หมวด ๓ ตั๋วสัญญาใช้เงิน","","มาตรา ๙๘๒ อันว่าตั๋วสัญญาใช้เงินนั้น คือหนังสือตราสารซึ่งบุคคลหนึ่ง เรียกว่าผู้ออกตั๋ว ให้คำมั่นสัญญาว่าจะใช้เงินจำนวนหนึ่งให้แก่บุคคลอีกคนหนึ่ง หรือใช้ให้ตามคำสั่งของบุคคลอีกคนหนึ่ง เรียกว่าผู้รับเงิน"],["983","b3t21","หมวด ๓ ตั๋วสัญญาใช้เงิน","","มาตรา ๙๘๓ ตั๋วสัญญาใช้เงินนั้น ต้องมีรายการดังจะกล่าวต่อไปนี้ คือ\n(๑) คำบอกชื่อว่าเป็นตั๋วสัญญาใช้เงิน\n(๒) คำมั่นสัญญาอันปราศจากเงื่อนไขว่าจะใช้เงินเป็นจำนวนแน่นอน\n(๓) วันถึงกำหนดใช้เงิน\n(๔) สถานที่ใช้เงิน\n(๕) ชื่อ หรือยี่ห้อของผู้รับเงิน\n(๖) วันและสถานที่ออกตั๋วสัญญาใช้เงิน\n(๗) ลายมือชื่อผู้ออกตั๋ว"],["984","b3t21","หมวด ๓ ตั๋วสัญญาใช้เงิน","","มาตรา ๙๘๔ ตราสารอันมีรายการขาดตกบกพร่องไปจากที่ท่านระบุบังคับไว้ในมาตราก่อนนี้ ย่อมไม่สมบูรณ์เป็นตั๋วสัญญาใช้เงิน เว้นแต่ในกรณีดังจะกล่าวต่อไปนี้ คือ\nตั๋วสัญญาใช้เงินซึ่งไม่ระบุเวลาใช้เงิน ท่านให้ถือว่าพึงใช้เงินเมื่อได้เห็น\nถ้าสถานที่ใช้เงินมิได้แถลงไว้ในตั๋วสัญญาใช้เงิน ท่านให้ถือเอาภูมิลำเนาของผู้ออกตราสารนั้นเป็นสถานที่ใช้เงิน\nถ้าตั๋วสัญญาใช้เงินไม่ระบุสถานที่ออกตั๋ว ท่านให้ถือว่าตั๋วนั้นได้ออก ณ ภูมิลำเนาของผู้ออกตั๋ว\nถ้ามิได้ลงวันออกตั๋ว ท่านว่าผู้ทรงโดยชอบด้วยกฎหมายคนหนึ่งคนใดทำการโดยสุจริตจะจดวันตามที่ถูกต้องแท้จริงลงก็ได้"],["985","b3t21","หมวด ๓ ตั๋วสัญญาใช้เงิน","","มาตรา ๙๘๕ บทบัญญัติทั้งหลายในหมวด ๒ ว่าด้วยตั๋วแลกเงินดังจะกล่าวต่อไปนี้ ท่านให้ยกมาบังคับในเรื่องตั๋วสัญญาใช้เงินเพียงเท่าที่ไม่ขัดกับสภาพแห่งตราสารชนิดนี้คือบทมาตรา ๙๑๑ มาตรา ๙๑๓ มาตรา ๙๑๖ มาตรา ๙๑๗ มาตรา ๙๑๙ มาตรา ๙๒๐ มาตรา ๙๒๒ ถึงมาตรา ๙๒๖ มาตรา ๙๓๘ ถึงมาตรา ๙๔๗ มาตรา ๙๔๙ มาตรา ๙๕๐ มาตรา ๙๕๔ ถึงมาตรา ๙๕๙ มาตรา ๙๖๗ ถึงมาตรา ๙๗๑\nถ้าเป็นตั๋วสัญญาใช้เงินที่ออกมาแต่ต่างประเทศ ท่านให้นำบทบัญญัติต่อไปนี้มาใช้บังคับด้วย คือบทมาตรา ๙๖๐ ถึงมาตรา ๙๖๔ มาตรา ๙๗๓ มาตรา ๙๗๔"],["986","b3t21","หมวด ๓ ตั๋วสัญญาใช้เงิน","","มาตรา ๙๘๖ ผู้ออกตั๋วสัญญาใช้เงินย่อมต้องผูกพันเป็นอย่างเดียวกันกับผู้รับรองตั๋วแลกเงิน\nตั๋วสัญญาใช้เงินซึ่งให้ใช้เงินในเวลาใดเวลาหนึ่งภายหลังได้เห็นนั้น ต้องนำยื่นให้ผู้ออกตั๋วจดรับรู้ภายในจำกัดเวลาดังกำหนดไว้ในมาตรา ๙๒๘ กำหนดเวลานี้ให้นับแต่วันจดรับรู้ซึ่งลงลายมือชื่อผู้ออกตั๋ว ถ้าผู้ออกตั๋วบอกปัดไม่ยอมจดรับรู้และลงวันไซร้ การที่เขาบอกปัดเช่นนี้ท่านว่าต้องทำให้เป็นหลักฐานขึ้นด้วยคำคัดค้าน และวันคัดค้านนั้นให้ถือเป็นวันเริ่มต้นในการนับกำหนดเวลาแต่ได้เห็น"],["987","b3t21","หมวด ๔ เช็ค","","มาตรา ๙๘๗ อันว่าเช็คนั้น คือหนังสือตราสารซึ่งบุคคลคนหนึ่ง เรียกว่าผู้สั่งจ่าย สั่งธนาคารให้ใช้เงินจำนวนหนึ่งเมื่อทวงถามให้แก่บุคคลอีกคนหนึ่ง หรือให้ใช้ตามคำสั่งของบุคคลอีกคนหนึ่ง อันเรียกว่าผู้รับเงิน"],["988","b3t21","หมวด ๔ เช็ค","","มาตรา ๙๘๘ อันเช็คนั้น ต้องมีรายการดังกล่าวต่อไปนี้ คือ\n(๑) คำบอกชื่อว่าเป็นเช็ค\n(๒) คำสั่งอันปราศจากเงื่อนไขให้ใช้เงินเป็นจำนวนแน่นอน\n(๓) ชื่อ หรือยี่ห้อและสำนักของธนาคาร\n(๔) ชื่อ หรือยี่ห้อของผู้รับเงิน หรือคำจดแจ้งว่าให้ใช้เงินแก่ผู้ถือ\n(๕) สถานที่ใช้เงิน\n(๖) วันและสถานที่ออกเช็ค\n(๗) ลายมือชื่อผู้สั่งจ่าย"],["989","b3t21","หมวด ๔ เช็ค","","มาตรา ๙๘๙ บทบัญญัติทั้งหลายในหมวด ๒ อันว่าด้วยตั๋วแลกเงินดังจะกล่าวต่อไปนี้ ท่านให้ยกมาบังคับในเรื่องเช็คเพียงเท่าที่ไม่ขัดกับสภาพแห่งตราสารชนิดนี้ คือบทมาตรา ๙๑๐ มาตรา ๙๑๔ ถึงมาตรา ๙๒๓ มาตรา ๙๒๕ มาตรา ๙๒๖ มาตรา ๙๓๘ ถึงมาตรา ๙๔๐ มาตรา ๙๔๕ มาตรา ๙๔๖ มาตรา ๙๕๙ มาตรา ๙๖๗ มาตรา ๙๗๑\nถ้าเป็นเช็คที่ออกมาแต่ต่างประเทศ ท่านให้นำบทบัญญัติดังต่อไปนี้มาใช้บังคับด้วย คือบทมาตรา ๙๒๔ มาตรา ๙๖๐ ถึงมาตรา ๙๖๔ มาตรา ๙๗๓ ถึงมาตรา ๙๗๗ มาตรา ๙๘๐"],["990","b3t21","หมวด ๔ เช็ค","","มาตรา ๙๙๐ ผู้ทรงเช็คต้องยื่นเช็คแก่ธนาคารเพื่อให้ใช้เงิน คือว่าถ้าเป็นเช็คให้ใช้เงินในเมืองเดียวกันกับที่ออกเช็คต้องยื่นภายในเดือนหนึ่งนับแต่วันออกเช็คนั้น ถ้าเป็นเช็คให้ใช้เงินที่อื่นต้องยื่นภายในสามเดือน ถ้ามิฉะนั้นท่านว่าผู้ทรงสิ้นสิทธิที่จะไล่เบี้ยเอาแก่ผู้สลักหลังทั้งปวง ทั้งเสียสิทธิอันมีต่อผู้สั่งจ่ายด้วยเพียงเท่าที่จะเกิดความเสียหายอย่างหนึ่งอย่างใดแก่ผู้สั่งจ่ายเพราะการที่ละเลยเสียไม่ยื่นเช็คนั้น\nอนึ่ง ผู้ทรงเช็คซึ่งผู้สั่งจ่ายหลุดพ้นจากความรับผิดไปแล้วนั้น ท่านให้รับช่วงสิทธิของผู้สั่งจ่ายคนนั้นอันมีต่อธนาคาร"],["991","b3t21","หมวด ๔ เช็ค","","มาตรา ๙๙๑ ธนาคารจำต้องใช้เงินตามเช็คซึ่งผู้เคยค้ากับธนาคารได้ออกเบิกเงินแก่ตน เว้นแต่ในกรณีดังกล่าวต่อไปนี้ คือ\n(๑) ไม่มีเงินในบัญชีของผู้เคยค้าคนนั้นเป็นเจ้าหนี้พอจะจ่ายตามเช็คนั้น หรือ\n(๒) เช็คนั้นยื่นเพื่อให้ใช้เงินเมื่อพ้นเวลาหกเดือนนับแต่วันออกเช็ค หรือ\n(๓) ได้มีคำบอกกล่าวว่าเช็คนั้นหายหรือถูกลักไป"],["992","b3t21","หมวด ๔ เช็ค","","มาตรา ๙๙๒ หน้าที่และอำนาจของธนาคารซึ่งจะใช้เงินตามเช็คอันเบิกแก่ตนนั้น ท่านว่าเป็นอันสุดสิ้นไปเมื่อกรณีเป็นดังจะกล่าวต่อไปนี้ คือ\n(๑) มีคำบอกห้ามการใช้เงิน\n(๒) รู้ว่าผู้สั่งจ่ายตาย\n(๓) รู้ว่าศาลได้มีคำสั่งรักษาทรัพย์ชั่วคราว หรือคำสั่งให้ผู้สั่งจ่ายเป็นคนล้มละลาย หรือได้มีประกาศโฆษณาคำสั่งเช่นนั้น"],["993","b3t21","หมวด ๔ เช็ค","","มาตรา ๙๙๓ ถ้าธนาคารเขียนข้อความลงลายมือชื่อบนเช็ค เช่นคำว่า “ใช้ได้” หรือ “ใช้เงินได้” หรือคำใด ๆ อันแสดงผลอย่างเดียวกัน ท่านว่าธนาคารต้องผูกพันในฐานเป็นลูกหนี้ชั้นต้นในอันจะต้องใช้เงินแก่ผู้ทรงตามเช็คนั้น\nถ้าผู้ทรงเช็คเป็นผู้จัดการให้ธนาคารลงข้อความรับรองดังว่านั้น ท่านว่าผู้สั่งจ่ายและผู้สลักหลังทั้งปวงเป็นอันหลุดพ้นจากความรับผิดตามเช็คนั้น\nถ้าธนาคารลงข้อความรับรองดังนั้น โดยคำขอร้องของผู้สั่งจ่าย ท่านว่าผู้สั่งจ่ายและปวงผู้สลักหลังก็หาหลุดพ้นไปไม่"],["994","b3t21","หมวด ๔ เช็ค","","มาตรา ๙๙๔ ถ้าในเช็คมีเส้นขนานคู่ขีดขวางไว้ข้างด้านหน้า กับมีหรือไม่มีคำว่า “และบริษัท” หรือคำย่ออย่างใด ๆ แห่งข้อความนี้อยู่ในระหว่างเส้นทั้งสองนั้นไซร้ เช็คนั้นชื่อว่าเป็นเช็คขีดคร่อมทั่วไป และจะใช้เงินตามเช็คนั้นได้แต่เฉพาะให้แก่ธนาคารเท่านั้น\nถ้าในระวางเส้นทั้งสองนั้นกรอกชื่อธนาคารอันหนึ่งอันใดลงไว้โดยเฉพาะ เช็คเช่นนั้นชื่อว่าเป็นเช็คขีดคร่อมเฉพาะ และจะใช้เงินตามเช็คนั้นได้เฉพาะให้แก่ธนาคารอันนั้น"],["995","b3t21","หมวด ๔ เช็ค","","มาตรา ๙๙๕ (๑) เช็คไม่มีขีดคร่อม ผู้สั่งจ่ายหรือผู้ทรงคนใดคนหนึ่งจะขีดคร่อมเสียก็ได้ และจะทำเป็นขีดคร่อมทั่วไปหรือขีดคร่อมเฉพาะก็ได้\n(๒) เช็คขีดคร่อมทั่วไป ผู้ทรงจะทำให้เป็นขีดคร่อมเฉพาะเสียก็ได้\n(๓) เช็คขีดคร่อมทั่วไปก็ดี ขีดคร่อมเฉพาะก็ดี ผู้ทรงจะเติมคำลงว่า“ห้ามเปลี่ยนมือ” ก็ได้\n(๔) เช็คขีดคร่อมเฉพาะให้แก่ธนาคารใด ธนาคารนั้นจะซ้ำขีดคร่อมเฉพาะให้ไปแก่ธนาคารอื่นเพื่อเรียกเก็บเงินก็ได้\n(๕) เช็คไม่มีขีดคร่อมก็ดี เช็คขีดคร่อมทั่วไปก็ดี ส่งไปยังธนาคารใดเพื่อให้เรียกเก็บเงิน ธนาคารนั้นจะลงขีดคร่อมเฉพาะให้แก่ตนเองก็ได้"],["996","b3t21","หมวด ๔ เช็ค","","มาตรา ๙๙๖ การขีดคร่อมเช็คตามที่อนุญาตไว้ในมาตราก่อนนั้น ท่านว่าเป็นส่วนสำคัญอันหนึ่งของเช็ค ใครจะลบล้างย่อมไม่เป็นการชอบด้วยกฎหมาย"],["997","b3t21","หมวด ๔ เช็ค","","มาตรา ๙๙๗ เช็คขีดคร่อมเฉพาะให้แก่ธนาคารกว่าธนาคารหนึ่งขึ้นไปเมื่อนำเบิกเอาแก่ธนาคารใด ท่านให้ธนาคารนั้นบอกปัดเสียอย่าใช้เงินให้ เว้นแต่ที่ขีดคร่อมให้แก่ธนาคารในฐานเป็นตัวแทนเรียกเก็บเงิน\nธนาคารใดซึ่งเขานำเช็คเบิกขืนใช้เงินไปตามเช็คที่ขีดคร่อมอย่างว่ามานั้นก็ดี ใช้เงินตามเช็คอันเขาขีดคร่อมทั่วไปเป็นประการอื่นนอกจากใช้ให้แก่ธนาคารอันใดอันหนึ่งก็ดี ใช้เงินตามเช็คอันเขาขีดคร่อมเฉพาะเป็นประการอื่นนอกจากใช้ให้แก่ธนาคารซึ่งเขาเจาะจงขีดคร่อมให้โดยเฉพาะ หรือแก่ธนาคารตัวแทนเรียกเก็บเงินของธนาคารนั้นก็ดี ท่านว่าธนาคารซึ่งใช้เงินไปดังกล่าวนี้จะต้องรับผิดต่อผู้เป็นเจ้าของอันแท้จริงแห่งเช็คนั้น ในการที่เขาจะต้องเสียหายอย่างใด ๆ เพราะการที่ตนใช้เงินไปตามเช็คดังนั้น\nแต่หากเช็คใดเขานำยื่นเพื่อให้ใช้เงิน และเมื่อยื่นไม่ปรากฏว่าเป็นเช็คขีดคร่อมก็ดี หรือไม่ปรากฏว่ามีรอยขีดคร่อมอันได้ลบล้างหรือแก้ไขเปลี่ยนแปลงเพิ่มเติมเป็นประการอื่นนอกจากที่อนุญาตไว้โดยกฎหมายก็ดี เช็คเช่นนี้ถ้าธนาคารใดใช้เงินไปโดยสุจริตและปราศจากประมาทเลินเล่อ ท่านว่าธนาคารนั้นไม่ต้องรับผิดหรือต้องมีหน้าที่รับใช้เงินอย่างใด ๆ"],["998","b3t21","หมวด ๔ เช็ค","","มาตรา ๙๙๘ ธนาคารใดซึ่งเขานำเช็คขีดคร่อมเบิกเงิน ใช้เงินไปตามเช็คนั้นโดยสุจริตและปราศจากประมาทเลินเล่อ กล่าวคือว่าถ้าเป็นเช็คขีดคร่อมทั่วไปก็ใช้เงินให้แก่ธนาคารอันใดอันหนึ่ง ถ้าเป็นเช็คขีดคร่อมเฉพาะก็ใช้ให้แก่ธนาคารซึ่งเขาเจาะจงขีดคร่อมให้โดยเฉพาะ หรือใช้ให้แก่ธนาคารตัวแทนเรียกเก็บเงินของธนาคารนั้นไซร้ ท่านว่าธนาคารซึ่งใช้เงินไปตามเช็คนั้นฝ่ายหนึ่ง กับถ้าเช็คตกไปถึงมือผู้รับเงินแล้ว ผู้สั่งจ่ายอีกฝ่ายหนึ่งต่างมีสิทธิเป็นอย่างเดียวกัน และเข้าอยู่ในฐานอันเดียวกันเสมือนดังว่าเช็คนั้นได้ใช้เงินให้แก่ผู้เป็นเจ้าของอันแท้จริงแล้ว"],["999","b3t21","หมวด ๔ เช็ค","","มาตรา ๙๙๙ บุคคลใดได้เช็คขีดคร่อมของเขามาซึ่งมีคำว่า “ห้ามเปลี่ยนมือ” ท่านว่าบุคคลนั้นไม่มีสิทธิในเช็คนั้นยิ่งไปกว่า และไม่สามารถให้สิทธิในเช็คนั้นต่อไปได้ดีกว่าสิทธิของบุคคลอันตนได้เช็คของเขามา"],["1000","b3t21","หมวด ๔ เช็ค","","มาตรา ๑๐๐๐ ธนาคารใดได้รับเงินไว้เพื่อผู้เคยค้าของตนโดยสุจริตและปราศจากประมาทเลินเล่อ อันเป็นเงินเขาใช้ให้ตามเช็คขีดคร่อมทั่วไปก็ดี ขีดคร่อมเฉพาะให้แก่ตนก็ดี หากปรากฏว่าผู้เคยค้านั้นไม่มีสิทธิหรือมีสิทธิเพียงอย่างบกพร่องในเช็คนั้นไซร้ ท่านว่าเพียงแต่เหตุที่ได้รับเงินไว้หาทำให้ธนาคารนั้นต้องรับผิดต่อผู้เป็นเจ้าของอันแท้จริงแห่งเช็คนั้นแต่อย่างหนึ่งอย่างใดไม่"],["1001","b3t21","หมวด ๕ อายุความ","","มาตรา ๑๐๐๑ ในคดีฟ้องผู้รับรองตั๋วแลกเงินก็ดี ผู้ออกตั๋วสัญญาใช้เงินก็ดี ท่านห้ามมิให้ฟ้องเมื่อพ้นเวลาสามปีนับแต่วันตั๋วนั้น ๆ ถึงกำหนดใช้เงิน"],["1002","b3t21","หมวด ๕ อายุความ","","มาตรา ๑๐๐๒ ในคดีที่ผู้ทรงตั๋วเงินฟ้องผู้สลักหลังและผู้สั่งจ่าย ท่านห้ามมิให้ฟ้องเมื่อพ้นเวลาปีหนึ่งนับแต่วันที่ได้ลงในคำคัดค้านซึ่งได้ทำขึ้นภายในเวลาอันถูกต้องตามกำหนด หรือนับแต่วันตั๋วเงินถึงกำหนด ในกรณีที่มีข้อกำหนดไว้ว่า “ไม่จำต้องมีคำคัดค้าน”"],["1003","b3t21","หมวด ๕ อายุความ","","มาตรา ๑๐๐๓ ในคดีผู้สลักหลังทั้งหลายฟ้องไล่เบี้ยกันเองและไล่เบี้ยเอาแก่ผู้สั่งจ่ายแห่งตั๋วเงิน ท่านห้ามมิให้ฟ้องคดีเมื่อพ้นเวลาหกเดือนนับแต่วันที่ผู้สลักหลังเข้าถือเอาตั๋วเงินและใช้เงิน หรือนับแต่วันที่ผู้สลักหลังนั้นเองถูกฟ้อง"],["1004","b3t21","หมวด ๕ อายุความ","","มาตรา ๑๐๐๔ เมื่ออายุความสะดุดหยุดลงเพราะการอันหนึ่งอันใด ซึ่งกระทำแก่คู่สัญญาแห่งตั๋วเงินฝ่ายใดฝ่ายหนึ่ง ท่านว่าย่อมมีผลสะดุดหยุดลงเพียงแต่แก่คู่สัญญาฝ่ายนั้น"],["1005","b3t21","หมวด ๕ อายุความ","","มาตรา ๑๐๐๕ ถ้าตั๋วเงินได้ทำขึ้นหรือได้โอนหรือสลักหลังไปแล้วในมูลหนี้อันหนึ่งอันใด และสิทธิตามตั๋วเงินนั้นมาสูญสิ้นไปเพราะอายุความก็ดี หรือเพราะละเว้นไม่ดำเนินการให้ต้องตามวิธีใด ๆ อันจะพึงต้องทำก็ดี ท่านว่าหนี้เดิมนั้นก็ยังคงมีอยู่ตามหลักกฎหมายอันแพร่หลายทั่วไป เท่าที่ลูกหนี้มิได้ต้องเสียหายแต่การนั้น เว้นแต่จะได้ตกลงกันไว้เป็นอย่างอื่น"],["1006","b3t21","หมวด ๖ ตั๋วเงินปลอม ตั๋วเงินถูกลัก และตั๋วเงินหาย","","มาตรา ๑๐๐๖ การที่ลายมือชื่ออันหนึ่งในตั๋วเงินเป็นลายมือปลอม ย่อมไม่กระทบกระทั่งถึงความสมบูรณ์แห่งลายมือชื่ออื่น ๆ ในตั๋วเงินนั้น"],["1007","b3t21","หมวด ๖ ตั๋วเงินปลอม ตั๋วเงินถูกลัก และตั๋วเงินหาย","","มาตรา ๑๐๐๗ ถ้าข้อความในตั๋วเงินใด หรือในคำรับรองตั๋วเงินรายใด มีผู้แก้ไขเปลี่ยนแปลงในข้อสำคัญโดยที่คู่สัญญาทั้งปวงผู้ต้องรับผิดตามตั๋วเงินมิได้ยินยอมด้วยหมดทุกคนไซร้ ท่านว่าตั๋วเงินนั้นก็เป็นอันเสีย เว้นแต่ยังคงใช้ได้ต่อคู่สัญญาซึ่งเป็นผู้ทำการแก้ไขเปลี่ยนแปลงนั้น หรือได้ยินยอมด้วยกับการแก้ไขเปลี่ยนแปลงนั้น กับทั้งผู้สลักหลังในภายหลัง\nแต่หากตั๋วเงินใดได้มีผู้แก้ไขเปลี่ยนแปลงในข้อสำคัญ แต่ความเปลี่ยนแปลงนั้นไม่ประจักษ์ และตั๋วเงินนั้นตกอยู่ในมือผู้ทรงโดยชอบด้วยกฎหมายไซร้ ท่านว่าผู้ทรงคนนั้นจะเอาประโยชน์จากตั๋วเงินนั้นก็ได้เสมือนดังว่ามิได้มีการแก้ไขเปลี่ยนแปลงเลย และจะบังคับการใช้เงินตามเนื้อความเดิมแห่งตั๋วนั้นก็ได้\nกล่าวโดยเฉพาะ การแก้ไขเปลี่ยนแปลงเช่นจะกล่าวต่อไปนี้ ท่านถือว่าเป็นการแก้ไขเปลี่ยนแปลงในข้อสำคัญ คือแก้ไขเปลี่ยนแปลงอย่างใด ๆ แก่วันที่ลง จำนวนเงินอันจะพึงใช้ เวลาใช้เงิน สถานที่ใช้เงิน กับทั้งเมื่อตั๋วเงินเขารับรองไว้ทั่วไปไม่เจาะจงสถานที่ใช้เงิน ไปเติมความระบุสถานที่ใช้เงินเข้าโดยที่ผู้รับรองมิได้ยินยอมด้วย"],["1008","b3t21","หมวด ๖ ตั๋วเงินปลอม ตั๋วเงินถูกลัก และตั๋วเงินหาย","","มาตรา ๑๐๐๘ ภายในบังคับแห่งบทบัญญัติทั้งหลายในประมวลกฎหมายนี้ เมื่อใดลายมือชื่อในตั๋วเงินเป็นลายมือปลอมก็ดี เป็นลายมือชื่อลงไว้โดยที่บุคคลซึ่งอ้างเอาเป็นเจ้าของลายมือชื่อนั้นมิได้มอบอำนาจให้ลงก็ดี ท่านว่าลายมือชื่อปลอมหรือลงปราศจากอำนาจเช่นนั้นเป็นอันใช้ไม่ได้เลย ใครจะอ้างอิงอาศัยแสวงสิทธิอย่างหนึ่งอย่างใดเพื่อยึดหน่วงตั๋วเงินไว้ก็ดี เพื่อทำให้ตั๋วนั้นหลุดพ้นก็ดี หรือเพื่อบังคับการใช้เงินเอาแก่คู่สัญญาแห่งตั๋วนั้นคนใดคนหนึ่งก็ดี ท่านว่าไม่อาจจะทำได้เป็นอันขาด เว้นแต่คู่สัญญาฝ่ายซึ่งจะพึงถูกยึดหน่วงหรือถูกบังคับใช้เงินนั้นจะอยู่ในฐานเป็นผู้ต้องตัดบทมิให้ยกข้อลายมือชื่อปลอม หรือข้อลงลายมือชื่อปราศจากอำนาจนั้นขึ้นเป็นข้อต่อสู้\nแต่ข้อความใด ๆ อันกล่าวมาในมาตรานี้ ท่านมิให้กระทบกระทั่งถึงการให้สัตยาบันแก่ลายมือชื่อซึ่งลงไว้โดยปราศจากอำนาจแต่หากไม่ถึงแก่เป็นลายมือปลอม"],["1009","b3t21","หมวด ๖ ตั๋วเงินปลอม ตั๋วเงินถูกลัก และตั๋วเงินหาย","","มาตรา ๑๐๐๙ ถ้ามีผู้นำตั๋วเงินชนิดจะพึงใช้เงินตามเขาสั่งเมื่อทวงถามมาเบิกต่อธนาคารใด และธนาคารนั้นได้ใช้เงินให้ไปตามทางค้าปกติโดยสุจริตและปราศจากประมาทเลินเล่อไซร้ ท่านว่าธนาคารไม่มีหน้าที่จะต้องนำสืบว่าการสลักหลังของผู้รับเงิน หรือการสลักหลังในภายหลังรายใด ๆ ได้ทำไปด้วยอาศัยรับมอบอำนาจแต่บุคคลซึ่งอ้างเอาเป็นเจ้าของคำสลักหลังนั้น และถึงแม้ว่ารายการสลักหลังนั้นจะเป็นสลักหลังปลอมหรือปราศจากอำนาจก็ตาม ท่านให้ถือว่าธนาคารได้ใช้เงินไปถูกระเบียบ"],["1010","b3t21","หมวด ๖ ตั๋วเงินปลอม ตั๋วเงินถูกลัก และตั๋วเงินหาย","","มาตรา ๑๐๑๐ เมื่อผู้ทรงตั๋วเงินซึ่งหายหรือถูกลักทราบเหตุแล้ว ในทันใดนั้นต้องบอกกล่าวเป็นหนังสือไปยังผู้ออกตั๋วเงิน ผู้จ่าย ผู้สมอ้างยามประสงค์ ผู้รับรองเพื่อแก้หน้าและผู้รับอาวัล ตามแต่มี เพื่อให้บอกปัดไม่ใช้เงินตามตั๋วเงินนั้น"],["1011","b3t21","หมวด ๖ ตั๋วเงินปลอม ตั๋วเงินถูกลัก และตั๋วเงินหาย","","มาตรา ๑๐๑๑ ถ้าตั๋วเงินหายไปแต่ก่อนเวลาล่วงเลยกำหนดใช้เงิน ท่านว่าบุคคลซึ่งได้เป็นผู้ทรงตั๋วเงินนั้นจะร้องขอไปยังผู้สั่งจ่ายให้ ๆ ตั๋วเงินเป็นเนื้อความเดียวกันแก่ตนใหม่อีกฉบับหนึ่งก็ได้ และในการนี้ถ้าเขาประสงค์ก็วางประกันให้ไว้แก่ผู้สั่งจ่าย เพื่อไว้ทดแทนที่เขาหากจะต้องเสียหายแก่ผู้หนึ่งผู้ใดในกรณีที่ตั๋วเงินซึ่งว่าหายนั้นจะกลับหาได้\nอนึ่ง ผู้สั่งจ่ายรับคำขอร้องดังว่ามานั้นแล้ว หากบอกปัดไม่ยอมให้ตั๋วเงินคู่ฉบับเช่นนั้น อาจจะถูกบังคับให้ออกให้ก็ได้"],["1012","b3t22","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๐๑๒ อันว่าสัญญาจัดตั้งห้างหุ้นส่วนหรือบริษัทนั้น คือสัญญาซึ่งบุคคลตั้งแต่สองคนขึ้นไปตกลงเข้ากันเพื่อกระทำกิจการร่วมกัน ด้วยประสงค์จะแบ่งปันกำไรอันจะพึงได้แต่กิจการที่ทำนั้น"],["1013","b3t22","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๐๑๓ อันห้างหุ้นส่วนหรือบริษัทนั้น ท่านกำหนดเป็นสามประเภท คือ\n(๑) ห้างหุ้นส่วนสามัญ\n(๒) ห้างหุ้นส่วนจำกัด\n(๓) บริษัทจำกัด"],["1014","b3t22","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๐๑๔ บรรดาสำนักงานสำหรับจดทะเบียนห้างหุ้นส่วนและบริษัททั้งหลายนั้น ให้รัฐมนตรีเจ้ากระทรวงซึ่งบัญชาการจดทะเบียนห้างหุ้นส่วนและบริษัทเป็นผู้ออกกฎข้อบังคับจัดตั้งขึ้น"],["1015","b3t22","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๐๑๕ ห้างหุ้นส่วนหรือบริษัทเมื่อได้จดทะเบียนตามบัญญัติแห่งลักษณะนี้แล้ว ท่านจัดว่าเป็นนิติบุคคลต่างหากจากผู้เป็นหุ้นส่วนหรือผู้ถือหุ้นทั้งหลายซึ่งรวมเข้ากันเป็นหุ้นส่วนหรือบริษัทนั้น"],["1016","b3t22","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๐๑๖ การจดทะเบียนห้างหุ้นส่วนหรือบริษัท การแก้ไขข้อความที่ได้จดทะเบียนไว้ในภายหลัง และการจดทะเบียนอย่างอื่นตามลักษณะ ๒๒ หุ้นส่วนและบริษัท ที่กำหนดให้จดทะเบียน ให้จดทะเบียน ณ สำนักงานทะเบียนหุ้นส่วนบริษัทที่สำนักงานแห่งใหญ่ตั้งอยู่หรือตามที่รัฐมนตรีเจ้ากระทรวงประกาศกำหนด"],["1017","b3t22","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๐๑๗ ถ้าข้อความหรือข้อมูลที่จะใช้ในการจดทะเบียนหรือประกาศโฆษณาเกิดขึ้นในต่างประเทศ ให้เริ่มนับระยะเวลาสำหรับการจดทะเบียนหรือประกาศโฆษณา ตั้งแต่เมื่อข้อความหรือข้อมูลนั้นมาถึงสำนักงานแห่งใหญ่ของห้างหุ้นส่วนหรือบริษัท"],["1018","b3t22","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๐๑๘ ในการจดทะเบียน ท่านให้เสียค่าธรรมเนียมตามกฎข้อบังคับซึ่งรัฐมนตรีเจ้ากระทรวงตั้งไว้"],["1019","b3t22","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๐๑๙ ถ้าคำขอจดทะเบียนหรือเอกสารซึ่งต้องจดทะเบียนไม่มีรายการบริบูรณ์ตามที่บังคับไว้ในลักษณะนี้ ว่าให้จดแจ้งก็ดี หรือถ้ารายการอันใดซึ่งจดแจ้งในคำขอหรือในเอกสารนั้นขัดกับกฎหมายก็ดี หรือถ้าเอกสารใดซึ่งกำหนดไว้ว่าให้ส่งด้วยกันกับคำขอจดทะเบียนยังขาดอยู่มิได้ส่งให้ครบก็ดี หรือถ้าไม่ปฏิบัติตามเงื่อนไขข้ออื่นซึ่งกฎหมายบังคับไว้ก็ดี นายทะเบียนจะไม่ยอมรับจดทะเบียนก็ได้ จนกว่าคำขอจดทะเบียนหรือเอกสารนั้นจะได้ทำให้บริบูรณ์หรือแก้ไขให้ถูกต้อง หรือได้ส่งเอกสารซึ่งกำหนดไว้นั้นครบทุกสิ่งอันหรือได้ปฏิบัติตามเงื่อนไขข้อนั้นแล้ว"],["1020","b3t22","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๐๒๐ บุคคลทุกคนเมื่อได้เสียค่าธรรมเนียมตามที่กำหนดในกฎกระทรวงแล้วชอบที่จะตรวจเอกสารซึ่งนายทะเบียนเก็บรักษาไว้ได้ หรือจะขอให้คัดสำเนาหรือเนื้อความในเอกสารฉบับใดๆ พร้อมด้วยคำรับรองว่าถูกต้องมอบให้ก็ได้\nผู้มีส่วนได้เสียของห้างหุ้นส่วนหรือบริษัทใดๆ เมื่อได้เสียค่าธรรมเนียมตามที่กำหนดในกฎกระทรวงแล้ว ชอบที่จะขอให้นายทะเบียนทำใบสำคัญแสดงการจดทะเบียนห้างหุ้นส่วนหรือบริษัทนั้นให้ก็ได้"],["1020/1","b3t22","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๐๒๐/๑ ให้รัฐมนตรีเจ้ากระทรวงมีอำนาจออกกฎกระทรวงกำหนด ลด หรือ ยกเว้นค่าธรรมเนียมที่ออกตามมาตรา ๑๐๑๘ และมาตรา ๑๐๒๐\nกฎกระทรวงตามวรรคหนึ่ง จะกำหนดค่าธรรมเนียมให้แตกต่างกันตามรูปแบบการทำธุรกรรมก็ได้"],["1021","b3t22","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๐๒๑ นายทะเบียนทุกคนจะต้องแต่งย่อรายการซึ่งได้ลงทะเบียนส่งไปลงพิมพ์โฆษณาในหนังสือราชกิจจานุเบกษาเป็นคราว ๆ ตามแบบซึ่งรัฐมนตรีเจ้ากระทรวงจะได้กำหนดให้"],["1022","b3t22","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๐๒๒ เมื่อได้พิมพ์โฆษณาดังนั้นแล้ว ท่านให้ถือว่าบรรดาเอกสารและข้อความซึ่งลงทะเบียนอันได้กล่าวถึงในย่อรายการนั้น เป็นอันรู้แก่บุคคลทั้งปวงไม่เลือกว่าเป็นผู้เกี่ยวข้องด้วยห้างหุ้นส่วนหรือด้วยบริษัทนั้น หรือที่ไม่เกี่ยวข้อง"],["1023","b3t22","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๐๒๓ ผู้เป็นหุ้นส่วนก็ดี ห้างหุ้นส่วนก็ดี หรือบริษัทก็ดี จะถือเอาประโยชน์แก่บุคคลภายนอกเพราะเหตุที่มีสัญญาหรือเอกสาร หรือข้อความอันบังคับให้จดทะเบียนตามลักษณะนี้ยังไม่ได้ จนกว่าจะได้จดทะเบียนแล้ว แต่ฝ่ายบุคคลภายนอกจะถือเอาประโยชน์เช่นว่านั้นได้\nแต่ถึงกระนั้นก็ดี ผู้เป็นหุ้นส่วน ผู้ถือหุ้น ห้างหุ้นส่วน หรือบริษัทซึ่งได้รับชำระหนี้ก่อนจดทะเบียนนั้นย่อมไม่จำต้องคืน"],["1023/1","b3t22","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๐๒๓/๑ ห้างหุ้นส่วนหรือบริษัทจะยกมาตรา ๑๐๒๓ ขึ้นต่อสู้บุคคลภายนอกผู้สุจริตเพื่อไม่ให้ต้องรับผิดโดยอ้างว่าผู้เป็นหุ้นส่วน ห้างหุ้นส่วน บริษัทหรือกรรมการไม่มีอำนาจกระทำการมิได้"],["1024","b3t22","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๐๒๔ ในระหว่างผู้เป็นหุ้นส่วนด้วยกันก็ดี หรือในระหว่างผู้ถือหุ้นด้วยกันก็ดี ในระหว่างผู้เป็นหุ้นส่วนกับห้างหุ้นส่วนก็ดี ในระหว่างผู้ถือหุ้นกับบริษัทก็ดี ท่านให้สันนิษฐานไว้ก่อนว่าบรรดาสมุดบัญชีเอกสารของห้างหุ้นส่วนหรือบริษัท หรือของผู้ชำระบัญชีห้างหุ้นส่วนหรือบริษัทใด ๆ นั้น ย่อมเป็นพยานหลักฐานอันถูกต้องตามข้อความที่ได้บันทึกไว้ในนั้นทุกประการ"],["1025","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๑ บทวิเคราะห์","มาตรา ๑๐๒๕ อันว่าห้างหุ้นส่วนสามัญนั้น คือห้างหุ้นส่วนประเภทซึ่งผู้เป็นหุ้นส่วนหมดทุกคนต้องรับผิดร่วมกันเพื่อหนี้ทั้งปวงของหุ้นส่วนโดยไม่มีจำกัด"],["1026","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๒๖ ผู้เป็นหุ้นส่วนทุกคนต้องมีสิ่งหนึ่งสิ่งใดมาลงหุ้นด้วยในห้างหุ้นส่วน\nสิ่งที่นำมาลงหุ้นด้วยนั้น จะเป็นเงินหรือทรัพย์สินสิ่งอื่นหรือลงแรงงานก็ได้"],["1027","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๒๗ ในเมื่อมีกรณีเป็นข้อสงสัย ท่านให้สันนิษฐานไว้ก่อนว่าสิ่งซึ่งนำมาลงหุ้นด้วยกันนั้นมีค่าเท่ากัน"],["1028","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๒๘ ถ้าผู้เป็นหุ้นส่วนคนใดได้ลงแต่แรงงานของตนเข้าเป็นหุ้น และในสัญญาเข้าหุ้นส่วนมิได้ตีราคาค่าแรงไว้ ท่านให้คำนวณส่วนกำไรของผู้ที่เป็นหุ้นส่วนด้วยลงแรงงานเช่นนั้น เสมอด้วยส่วนถัวเฉลี่ยของผู้เป็นหุ้นส่วนซึ่งได้ลงเงินหรือลงทรัพย์สินเข้าหุ้นในการนั้น"],["1029","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๒๙ ถ้าผู้เป็นหุ้นส่วนคนหนึ่งเอาทรัพย์สินมาให้ใช้เป็นการลงหุ้นด้วยไซร้ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนคนนั้นกับห้างหุ้นส่วนในเรื่องส่งมอบและซ่อมแซมก็ดี ความรับผิดเพื่อชำรุดบกพร่องก็ดี ความรับผิดเพื่อการรอนสิทธิก็ดี ข้อยกเว้นความรับผิดก็ดี ท่านให้บังคับตามบทบัญญัติแห่งประมวลกฎหมายนี้ ว่าด้วยเช่าทรัพย์"],["1030","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๓๐ ถ้าผู้เป็นหุ้นส่วนคนหนึ่งให้กรรมสิทธิ์ในทรัพย์สินอันใดอันหนึ่งเป็นการลงหุ้นด้วยไซร้ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนคนนั้นกับห้างหุ้นส่วนในเรื่องส่งมอบและซ่อมแซมก็ดี ความรับผิดเพื่อชำรุดบกพร่องก็ดี ความรับผิดเพื่อการรอนสิทธิก็ดี ข้อยกเว้นความรับผิดก็ดี ท่านให้บังคับตามบทบัญญัติแห่งประมวลกฎหมายนี้ ว่าด้วยซื้อขาย"],["1031","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๓๑ ถ้าผู้เป็นหุ้นส่วนคนใดละเลยไม่ส่งมอบส่วนลงหุ้นของตนเสียเลย ท่านว่าต้องส่งคำบอกกล่าวเป็นจดหมายจดทะเบียนไปรษณีย์ไปยังผู้เป็นหุ้นส่วนคนนั้น ให้ส่งมอบส่วนลงหุ้นของตนมาภายในเวลาอันสมควร มิฉะนั้นผู้เป็นหุ้นส่วนคนอื่น ๆ จะลงเนื้อเห็นพร้อมกัน หรือโดยเสียข้างมากด้วยกันสุดแต่ข้อสัญญา ให้เอาผู้เป็นหุ้นส่วนคนนั้นออกเสียได้"],["1032","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๓๒ ห้ามมิให้เปลี่ยนแปลงข้อสัญญาเดิมแห่งห้างหุ้นส่วนหรือประเภทแห่งกิจการ นอกจากด้วยความยินยอมของผู้เป็นหุ้นส่วนหมดด้วยกันทุกคน เว้นแต่จะมีข้อตกลงกันไว้เป็นอย่างอื่น"],["1033","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๓๓ ถ้าผู้เป็นหุ้นส่วนมิได้ตกลงกันไว้ในกระบวนจัดการห้างหุ้นส่วนไซร้ ท่านว่าผู้เป็นหุ้นส่วนย่อมจัดการห้างหุ้นส่วนนั้นได้ทุกคน แต่ผู้เป็นหุ้นส่วนคนหนึ่งคนใดจะเข้าทำสัญญาอันใดซึ่งผู้เป็นหุ้นส่วนอีกคนหนึ่งทักท้วงนั้นไม่ได้\nในกรณีเช่นนี้ ท่านให้ถือว่าผู้เป็นหุ้นส่วนย่อมเป็นหุ้นส่วนผู้จัดการทุกคน"],["1034","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๓๔ ถ้าได้ตกลงกันไว้ว่าการงานของห้างหุ้นส่วนนั้นจักให้เป็นไปตามเสียงข้างมากแห่งผู้เป็นหุ้นส่วนไซร้ ท่านให้ผู้เป็นหุ้นส่วนคนหนึ่งมีเสียงเป็นคะแนนหนึ่ง โดยไม่ต้องคำนึงถึงจำนวนที่ลงหุ้นด้วยมากหรือน้อย"],["1035","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๓๕ ถ้าได้ตกลงกันไว้ว่าจะให้ผู้เป็นหุ้นส่วนหลายคนจัดการห้างหุ้นส่วนไซร้ หุ้นส่วนผู้จัดการแต่ละคนจะจัดการห้างหุ้นส่วนนั้นก็ได้ แต่หุ้นส่วนผู้จัดการคนหนึ่งคนใดจะทำการอันใดซึ่งหุ้นส่วนผู้จัดการอีกคนหนึ่งทักท้วงนั้นไม่ได้"],["1036","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๓๖ อันหุ้นส่วนผู้จัดการนั้น จะเอาออกจากตำแหน่งได้ต่อเมื่อผู้เป็นหุ้นส่วนทั้งหลายอื่นยินยอมพร้อมกัน เว้นแต่จะได้ตกลงกันไว้เป็นอย่างอื่น"],["1037","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๓๗ ถึงแม้ว่าผู้เป็นหุ้นส่วนทั้งหลายได้ตกลงให้ผู้เป็นหุ้นส่วนคนเดียวหรือหลายคนเป็นผู้จัดการห้างหุ้นส่วนก็ดี ผู้เป็นหุ้นส่วนทุกคนนอกจากผู้จัดการย่อมมีสิทธิที่จะไต่ถามถึงการงานของห้างหุ้นส่วนที่จัดอยู่นั้นได้ทุกเมื่อ และมีสิทธิที่จะตรวจและคัดสำเนาสมุด บัญชี และเอกสารใด ๆ ของห้างหุ้นส่วนได้ด้วย"],["1038","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๓๘ ห้ามมิให้ผู้เป็นหุ้นส่วนประกอบกิจการอย่างหนึ่งอย่างใดซึ่งมีสภาพดุจเดียวกัน และเป็นการแข่งขันกับกิจการของห้างหุ้นส่วนนั้น ไม่ว่าทำเพื่อประโยชน์ตนหรือประโยชน์ผู้อื่น โดยมิได้รับความยินยอมของผู้เป็นหุ้นส่วนคนอื่น ๆ\nถ้าผู้เป็นหุ้นส่วนคนใดทำการฝ่าฝืนต่อบทบัญญัติมาตรานี้ไซร้ ผู้เป็นหุ้นส่วนคนอื่น ๆ ชอบที่จะเรียกเอาผลกำไรซึ่งผู้นั้นหาได้ทั้งหมด หรือเรียกเอาค่าสินไหมทดแทนเพื่อการที่ห้างหุ้นส่วนได้รับความเสียหายเพราะเหตุนั้น แต่ท่านห้ามมิให้ฟ้องเรียกเมื่อพ้นเวลาปีหนึ่งนับแต่วันทำการฝ่าฝืน"],["1039","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๓๙ ผู้เป็นหุ้นส่วนจำต้องจัดการงานของห้างหุ้นส่วนด้วยความระมัดระวังให้มากเสมือนกับจัดการงานของตนเองฉะนั้น"],["1040","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๔๐ ห้ามมิให้ชักนำเอาบุคคลผู้อื่นเข้ามาเป็นหุ้นส่วนในห้างหุ้นส่วนโดยมิได้รับความยินยอมของผู้เป็นหุ้นส่วนหมดด้วยกันทุกคน เว้นแต่จะได้ตกลงกันไว้เป็นอย่างอื่น"],["1041","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๔๑ ถ้าผู้เป็นหุ้นส่วนคนใดคนหนึ่งโอนส่วนกำไรของตนในห้างหุ้นส่วนทั้งหมดก็ดี หรือแต่บางส่วนก็ดีให้แก่บุคคลภายนอกโดยมิได้รับความยินยอมของผู้เป็นหุ้นส่วนทั้งหลายอื่นไซร้ ท่านว่าบุคคลภายนอกนั้นจะกลายเป็นเข้าหุ้นส่วนด้วยก็หามิได้"],["1042","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๔๒ ความเกี่ยวพันระหว่างหุ้นส่วนผู้จัดการกับผู้เป็นหุ้นส่วนทั้งหลายอื่นนั้น ท่านให้บังคับด้วยบทบัญญัติแห่งประมวลกฎหมายนี้ ว่าด้วยตัวแทน"],["1043","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๔๓ ถ้าผู้เป็นหุ้นส่วนอันมิได้เป็นผู้จัดการเอื้อมเข้ามาจัดการงานของห้างหุ้นส่วนก็ดี หรือผู้เป็นหุ้นส่วนซึ่งเป็นผู้จัดการกระทำล่วงขอบอำนาจของตนก็ดี ท่านให้บังคับด้วยบทบัญญัติแห่งประมวลกฎหมายนี้ ว่าด้วยจัดการงานนอกสั่ง"],["1044","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๔๔ อันส่วนกำไรก็ดี ส่วนขาดทุนก็ดี ของผู้เป็นหุ้นส่วนทุก ๆ คนนั้น ย่อมเป็นไปตามส่วนที่ลงหุ้น"],["1045","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๔๕ ถ้าหุ้นส่วนของผู้ใดได้กำหนดไว้แต่เพียงข้างฝ่ายกำไรว่าจะแบ่งเอาเท่าไร หรือกำหนดแต่เพียงข้างขาดทุนว่าจะยอมขาดเท่าไรฉะนี้ไซร้ ท่านให้สันนิษฐานไว้ก่อนว่าหุ้นส่วนของผู้นั้นมีส่วนกำไรและส่วนขาดทุนเป็นอย่างเดียวกัน"],["1046","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๔๖ ผู้เป็นหุ้นส่วนไม่ว่าคนหนึ่งคนใดหามีสิทธิจะได้รับบำเหน็จเพื่อที่ได้จัดการงานของห้างหุ้นส่วนนั้นไม่ เว้นแต่จะได้มีความตกลงกันไว้เป็นอย่างอื่น"],["1047","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๔๗ ถ้าชื่อของผู้เป็นหุ้นส่วนซึ่งออกจากหุ้นส่วนไปแล้วยังคงใช้เรียกขานติดเป็นชื่อห้างหุ้นส่วนอยู่ ท่านว่าผู้เป็นหุ้นส่วนนั้นชอบที่จะเรียกให้งดใช้ชื่อของตนเสียได้"],["1048","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๒ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนด้วยกันเอง","มาตรา ๑๐๔๘ ผู้เป็นหุ้นส่วนคนหนึ่งจะเรียกเอาส่วนของตนจากหุ้นส่วนอื่น ๆ แม้ในกิจการค้าขายอันใดซึ่งไม่ปรากฏชื่อของตนก็ได้"],["1049","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๓ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนกับบุคคลภายนอก","มาตรา ๑๐๔๙ ผู้เป็นหุ้นส่วนจะถือเอาสิทธิใด ๆ แก่บุคคลภายนอกในกิจการค้าขายซึ่งไม่ปรากฏชื่อของตนนั้นหาได้ไม่"],["1050","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๓ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนกับบุคคลภายนอก","มาตรา ๑๐๕๐ การใด ๆ อันผู้เป็นหุ้นส่วนคนใดคนหนึ่งได้จัดทำไปในทางที่เป็นธรรมดาการค้าขายของห้างหุ้นส่วนนั้น ท่านว่าผู้เป็นหุ้นส่วนหมดทุกคนย่อมมีความผูกพันในการนั้น ๆ ด้วย และจะต้องรับผิดร่วมกันโดยไม่จำกัดจำนวนในการชำระหนี้ อันได้ก่อให้เกิดขึ้นเพราะจัดการไปเช่นนั้น"],["1051","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๓ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนกับบุคคลภายนอก","มาตรา ๑๐๕๑ ผู้เป็นหุ้นส่วนซึ่งออกจากหุ้นส่วนไปแล้วยังคงต้องรับผิดในหนี้ซึ่งห้างหุ้นส่วนได้ก่อให้เกิดขึ้นก่อนที่ตนได้ออกจากหุ้นส่วนไป"],["1052","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๓ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนกับบุคคลภายนอก","มาตรา ๑๐๕๒ บุคคลผู้เข้าเป็นหุ้นส่วนในห้างหุ้นส่วนย่อมต้องรับผิดในหนี้ใด ๆ ซึ่งห้างหุ้นส่วนได้ก่อให้เกิดขึ้นก่อนที่ตนเข้ามาเป็นหุ้นส่วนด้วย"],["1053","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๓ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนกับบุคคลภายนอก","มาตรา ๑๐๕๓ ห้างหุ้นส่วนซึ่งมิได้จดทะเบียนนั้น ถึงแม้จะมีข้อจำกัดอำนาจของหุ้นส่วนคนหนึ่งในการที่จะผูกพันผู้เป็นหุ้นส่วนคนอื่น ๆ ท่านว่าข้อจำกัดเช่นนั้นก็หามีผลถึงบุคคลภายนอกไม่"],["1054","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๓ ความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนกับบุคคลภายนอก","มาตรา ๑๐๕๔ บุคคลใดแสดงตนว่าเป็นหุ้นส่วนด้วยวาจาก็ดี ด้วยลายลักษณ์อักษรก็ดี ด้วยกิริยาก็ดี ด้วยยินยอมให้เขาใช้ชื่อตนเป็นชื่อห้างหุ้นส่วนก็ดี หรือรู้แล้วไม่คัดค้านปล่อยให้เขาแสดงว่าตนเป็นหุ้นส่วนก็ดี ท่านว่าบุคคลนั้นย่อมต้องรับผิดต่อบุคคลภายนอกในบรรดาหนี้ของห้างหุ้นส่วนเสมือนเป็นหุ้นส่วน\nถ้าผู้เป็นหุ้นส่วนคนหนึ่งคนใดตายไปแล้ว และห้างหุ้นส่วนนั้นยังคงค้าต่อไปในชื่อเดิมของห้าง ท่านว่าเหตุเพียงที่คงใช้ชื่อเดิมนั้นก็ดี หรือใช้ชื่อของหุ้นส่วนผู้ตายควบอยู่ด้วยก็ดี หาทำให้ความรับผิดมีแก่กองทรัพย์มรดกของผู้ตายเพื่อหนี้ใด ๆ อันห้างหุ้นส่วนได้ก่อให้เกิดขึ้นภายหลังมรณะนั้นไม่"],["1055","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๔ การเลิกและชำระบัญชีห้างหุ้นส่วนสามัญ","มาตรา ๑๐๕๕ ห้างหุ้นส่วนสามัญย่อมเลิกกันด้วยเหตุดังกล่าวต่อไปนี้\n(๑) ถ้าในสัญญาทำไว้มีกำหนดกรณีอันใดเป็นเหตุที่จะเลิกกัน เมื่อมีกรณีนั้น\n(๒) ถ้าสัญญาทำไว้เฉพาะกำหนดกาลใด เมื่อสิ้นกำหนดกาลนั้น\n(๓) ถ้าสัญญาทำไว้เฉพาะเพื่อทำกิจการอย่างหนึ่งอย่างใดแต่อย่างเดียว เมื่อเสร็จการนั้น\n(๔) เมื่อผู้เป็นหุ้นส่วนคนใดคนหนึ่งให้คำบอกกล่าวแก่ผู้เป็นหุ้นส่วนคนอื่น ๆ ตามกำหนดดังบัญญัติไว้ในมาตรา ๑๐๕๖\n(๕) เมื่อผู้เป็นหุ้นส่วนคนใดคนหนึ่งตาย หรือล้มละลาย หรือตกเป็นผู้ไร้ความสามารถ"],["1056","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๔ การเลิกและชำระบัญชีห้างหุ้นส่วนสามัญ","มาตรา ๑๐๕๖ ถ้าห้างหุ้นส่วนได้ตั้งขึ้นไม่มีกำหนดการอย่างหนึ่งอย่างใดเป็นยุติ ท่านว่าจะเลิกได้ต่อเมื่อผู้เป็นหุ้นส่วนคนใดคนหนึ่งบอกเลิกเมื่อสิ้นรอบปีในทางบัญชีเงินของห้างหุ้นส่วนนั้น และผู้เป็นหุ้นส่วนนั้นต้องบอกกล่าวความจำนงจะเลิกล่วงหน้าไม่น้อยกว่าหกเดือน"],["1057","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๔ การเลิกและชำระบัญชีห้างหุ้นส่วนสามัญ","มาตรา ๑๐๕๗ ถ้าผู้เป็นหุ้นส่วนคนใดร้องขอเมื่อมีกรณีอย่างใดอย่างหนึ่งดังจะกล่าวต่อไปนี้ ศาลอาจสั่งให้ห้างหุ้นส่วนสามัญเลิกกันเสียก็ได้ คือ\n(๑) เมื่อผู้เป็นหุ้นส่วนคนใดคนหนึ่งนอกจากผู้ร้องฟ้องนั้น ล่วงละเมิดบทบังคับใด ๆ อันเป็นข้อสาระสำคัญซึ่งสัญญาหุ้นส่วนกำหนดไว้แก่ตน โดยจงใจหรือเลินเล่ออย่างร้ายแรง\n(๒) เมื่อกิจการของห้างหุ้นส่วนนั้นจะทำไปก็มีแต่ขาดทุนอย่างเดียวและไม่มีหวังว่าจะกลับฟื้นตัวได้อีก\n(๓) เมื่อมีเหตุอื่นใด ๆ ทำให้ห้างหุ้นส่วนนั้นเหลือวิสัยที่จะดำรงคงอยู่ต่อไปได้"],["1058","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๔ การเลิกและชำระบัญชีห้างหุ้นส่วนสามัญ","มาตรา ๑๐๕๘ เมื่อเหตุอันใดอันหนึ่งเกิดขึ้นเกี่ยวด้วยผู้เป็นหุ้นส่วนคนหนึ่งซึ่งตามความในมาตรา ๑๐๕๗ หรือมาตรา ๑๐๖๗ เป็นเหตุให้ผู้เป็นหุ้นส่วนทั้งหลายนอกนั้นมีสิทธิจะเรียกให้เลิกห้างหุ้นส่วนได้ไซร้ ในเมื่อผู้เป็นหุ้นส่วนเหล่านั้นยื่นคำร้อง ท่านว่าศาลจะสั่งให้กำจัดหุ้นส่วนผู้ต้นเหตุคนนั้นออกเสียจากห้างหุ้นส่วนแทนสั่งให้เลิกห้างหุ้นส่วนก็ได้\nในการแบ่งทรัพย์สินระหว่างห้างหุ้นส่วนกับผู้เป็นหุ้นส่วนซึ่งถูกกำจัดนั้น ท่านให้ตีราคาทรัพย์สินของห้างหุ้นส่วนตามราคาที่เป็นอยู่ในเวลาแรกยื่นคำร้องขอให้จำกัด"],["1059","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๔ การเลิกและชำระบัญชีห้างหุ้นส่วนสามัญ","มาตรา ๑๐๕๙ ถ้าเมื่อสิ้นกำหนดการซึ่งได้ตกลงกันไว้และผู้เป็นหุ้นส่วนทั้งหลายหรือผู้เป็นหุ้นส่วนซึ่งเคยได้จัดการอยู่ในระหว่างกำหนดนั้น ยังคงดำเนินการค้าของห้างหุ้นส่วนอยู่ต่อไปโดยมิได้ชำระบัญชีหรือชำระเงินกันให้เสร็จไปไซร้ ท่านให้ถือว่าผู้เป็นหุ้นส่วนทั้งปวงได้ตกลงคงทำการเป็นหุ้นส่วนกันสืบไปโดยไม่มีกำหนดการ"],["1060","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๔ การเลิกและชำระบัญชีห้างหุ้นส่วนสามัญ","มาตรา ๑๐๖๐ ในกรณีอย่างใดอย่างหนึ่งซึ่งกล่าวไว้ในมาตรา ๑๐๕๕ อนุมาตรา ๔ หรือ อนุมาตรา ๕ นั้น ถ้าผู้เป็นหุ้นส่วนที่ยังอยู่รับซื้อหุ้นของผู้ที่ออกจากหุ้นส่วนไปไซร้ ท่านว่าสัญญาหุ้นส่วนนั้นก็ยังคงใช้ได้ต่อไปในระหว่างผู้เป็นหุ้นส่วนที่ยังอยู่ด้วยกัน"],["1061","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๔ การเลิกและชำระบัญชีห้างหุ้นส่วนสามัญ","มาตรา ๑๐๖๑ เมื่อห้างหุ้นส่วนเลิกกันแล้วก็ให้จัดการชำระบัญชี เว้นแต่จะได้ตกลงกันให้จัดการทรัพย์สินโดยวิธีอื่นในระหว่างผู้เป็นหุ้นส่วนด้วยกัน หรือว่าห้างหุ้นส่วนนั้นศาลได้พิพากษาให้ล้มละลาย\nถ้าการเลิกห้างหุ้นส่วนนั้นได้เป็นไปโดยที่เจ้าหนี้เฉพาะตัวของผู้เป็นหุ้นส่วนคนใดคนหนึ่งได้ให้คำบอกกล่าวก็ดี หรือโดยที่ผู้เป็นหุ้นส่วนคนใดคนหนึ่งล้มละลายก็ดี ท่านว่าจะงดการชำระบัญชีเสียได้ต่อเมื่อเจ้าหนี้คนนั้น หรือเจ้าพนักงานรักษาทรัพย์ยินยอมด้วย\nการชำระบัญชีนั้น ให้ผู้เป็นหุ้นส่วนทั้งหมดด้วยกันจัดทำหรือให้บุคคลอื่นซึ่งผู้เป็นหุ้นส่วนได้ตั้งแต่งขึ้นนั้นเป็นผู้จัดทำ\nการตั้งแต่งผู้ชำระบัญชี ให้วินิจฉัยชี้ขาดโดยคะแนนเสียงข้างมากของผู้เป็นหุ้นส่วน"],["1062","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๔ การเลิกและชำระบัญชีห้างหุ้นส่วนสามัญ","มาตรา ๑๐๖๒ การชำระบัญชี ให้ทำโดยลำดับดังนี้ คือ\n(๑) ให้ชำระหนี้ทั้งหลายซึ่งค้างชำระแก่บุคคลภายนอก\n(๒) ให้ชดใช้เงินทดรองและค่าใช้จ่ายซึ่งผู้เป็นหุ้นส่วนได้ออกของตนไปเพื่อจัดการค้าของห้าง\n(๓) ให้คืนทุนทรัพย์ซึ่งผู้เป็นหุ้นส่วนแต่ละคนได้ลงเป็นหุ้น\nถ้ายังมีทรัพย์เหลืออยู่อีกเท่าไร ก็ให้เฉลี่ยแจกเป็นกำไรในระหว่างผู้เป็นหุ้นส่วน"],["1063","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๔ การเลิกและชำระบัญชีห้างหุ้นส่วนสามัญ","มาตรา ๑๐๖๓ ถ้าเมื่อได้ชำระหนี้ซึ่งค้างชำระแก่บุคคลภายนอกและชดใช้เงินทดรองและค่าใช้จ่ายแล้ว สินทรัพย์ที่ยังอยู่ไม่พอจะคืนแก่ผู้เป็นหุ้นส่วนให้ครบจำนวนที่ลงหุ้นไซร้ ส่วนที่ขาดนี้คือขาดทุน ซึ่งต้องคิดเฉลี่ยช่วยกันขาด"],["1064","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๕ การจดทะเบียนห้างหุ้นส่วนสามัญ","มาตรา ๑๐๖๔ อันห้างหุ้นส่วนสามัญนั้น จะจดทะเบียนก็ได้\nการลงทะเบียนนั้น ท่านบังคับให้มีรายการดังนี้ คือ\n(๑) ชื่อห้างหุ้นส่วน\n(๒) วัตถุที่ประสงค์ของห้างหุ้นส่วน\n(๓) ที่ตั้งสำนักงานแห่งใหญ่และสาขาทั้งปวง\n(๔) ชื่อและที่สำนักกับทั้งอาชีวะของผู้เป็นหุ้นส่วนทุก ๆ คน ถ้าผู้เป็นหุ้นส่วนคนใดมีชื่อยี่ห้อ ก็ให้ลงทะเบียนทั้งชื่อและยี่ห้อด้วย\n(๕) ชื่อหุ้นส่วนผู้จัดการ ในเมื่อได้ตั้งแต่งให้เป็นผู้จัดการแต่เพียงบางคน\n(๖) ถ้ามีข้อจำกัดอำนาจของหุ้นส่วนผู้จัดการประการใดให้ลงไว้ด้วย\n(๗) ตราซึ่งใช้เป็นสำคัญของห้างหุ้นส่วน\nข้อความซึ่งลงทะเบียนนั้น จะลงรายการอื่น ๆ อีกอันคู่สัญญาเห็นสมควรจะให้ประชาชนทราบด้วยก็ได้\nการลงทะเบียนนั้น ต้องลงลายมือชื่อของผู้เป็นหุ้นส่วนทุกคน และต้องประทับตราของห้างหุ้นส่วนนั้นด้วย\nให้พนักงานทะเบียนทำใบสำคัญแสดงการจดทะเบียนส่งมอบให้แก่ห้างหุ้นส่วนนั้นฉบับหนึ่ง"],["1064/1","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๕ การจดทะเบียนห้างหุ้นส่วนสามัญ","มาตรา ๑๐๖๔/๑ หุ้นส่วนผู้จัดการคนใดในห้างหุ้นส่วนจดทะเบียนจะลาออกจากตำแหน่ง ให้ยื่นใบลาออกต่อหุ้นส่วนผู้จัดการอื่นคนหนึ่งคนใด การลาออกมีผลนับแต่วันที่ใบลาออกไปถึงหุ้นส่วนผู้จัดการอื่นนั้น\nในกรณีที่ห้างหุ้นส่วนจดทะเบียนมีหุ้นส่วนผู้จัดการคนเดียว ให้หุ้นส่วนผู้จัดการที่จะลาออกจากตำแหน่งแจ้งเป็นหนังสือให้ผู้เป็นหุ้นส่วนคนหนึ่งคนใดทราบเพื่อนัดประชุมและพิจารณาตั้งผู้จัดการคนใหม่ พร้อมกับแนบใบลาออกไปด้วย การลาออกมีผลนับแต่วันที่ใบลาออกไปถึงหุ้นส่วนผู้นั้น\nหุ้นส่วนผู้จัดการซึ่งลาออกตามวรรคหนึ่งหรือวรรคสอง จะแจ้งการลาออกของตนให้นายทะเบียนทราบด้วยก็ได้"],["1064/2","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๕ การจดทะเบียนห้างหุ้นส่วนสามัญ","มาตรา ๑๐๖๔/๒ เมื่อมีการเปลี่ยนแปลงหุ้นส่วนผู้จัดการ ให้ห้างหุ้นส่วนจดทะเบียนนำความไปจดทะเบียนภายในสิบสี่วันนับแต่วันที่มีการเปลี่ยนแปลง"],["1065","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๕ การจดทะเบียนห้างหุ้นส่วนสามัญ","มาตรา ๑๐๖๕ ผู้เป็นหุ้นส่วนอาจถือประโยชน์แก่บุคคลภายนอกในบรรดาสิทธิอันห้างหุ้นส่วนจดทะเบียนนั้นได้มา แม้ในกิจการซึ่งไม่ปรากฏชื่อของตน"],["1066","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๕ การจดทะเบียนห้างหุ้นส่วนสามัญ","มาตรา ๑๐๖๖ ห้ามมิให้ผู้เป็นหุ้นส่วนคนหนึ่งคนใดในห้างหุ้นส่วนจดทะเบียนประกอบกิจการอย่างหนึ่งอย่างใดอันมีสภาพเป็นอย่างเดียวกัน และเป็นการแข่งขันกับกิจการของห้างหุ้นส่วนนั้น ไม่ว่าทำเพื่อประโยชน์ตนหรือเพื่อประโยชน์ผู้อื่น หรือไปเข้าเป็นหุ้นส่วนไม่จำกัดความรับผิดในห้างหุ้นส่วนอื่น ซึ่งประกอบกิจการอันมีสภาพเป็นอย่างเดียวกัน และแข่งขันกับกิจการของห้างหุ้นส่วนจดทะเบียนนั้น เว้นไว้แต่จะได้รับคำยินยอมของผู้เป็นหุ้นส่วนอื่นทั้งหมด\nแต่ข้อห้ามเช่นว่ามานี้ ท่านว่าจะไม่พึงใช้ได้ ถ้าหากผู้เป็นหุ้นส่วนทั้งหลายได้รู้อยู่แล้วในเวลาเมื่อลงทะเบียนห้างหุ้นส่วนนั้นว่า ผู้เป็นหุ้นส่วนคนหนึ่งได้ทำกิจการ หรือเข้าเป็นหุ้นส่วนอยู่ในห้างหุ้นส่วนอื่นอันมีวัตถุที่ประสงค์อย่างเดียวกัน และในสัญญาเข้าหุ้นส่วนที่ทำไว้ต่อกันนั้นก็ไม่ได้บังคับให้ถอนตัวออก"],["1067","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๕ การจดทะเบียนห้างหุ้นส่วนสามัญ","มาตรา ๑๐๖๗ ถ้าผู้เป็นหุ้นส่วนคนใดกระทำการฝ่าฝืนต่อบทบัญญัติในมาตราก่อนนี้ไซร้ ท่านว่าห้างหุ้นส่วนซึ่งจดทะเบียนนั้นชอบที่จะเรียกเอาผลกำไรอันผู้นั้นหาได้ทั้งหมด หรือเรียกเอาค่าสินไหมทดแทนเพื่อความเสียหายซึ่งห้างหุ้นส่วนได้รับเพราะเหตุนั้น\nแต่ทั้งนี้ท่านห้ามมิให้ฟ้องเรียกเมื่อพ้นเวลาปีหนึ่งนับแต่วันทำการฝ่าฝืน\nอนึ่ง บทบัญญัติมาตรานี้ไม่ลบล้างสิทธิของผู้เป็นหุ้นส่วนทั้งหลายนอกนั้น ในอันจะเรียกให้เลิกห้างหุ้นส่วน"],["1068","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๕ การจดทะเบียนห้างหุ้นส่วนสามัญ","มาตรา ๑๐๖๘ ความรับผิดของผู้เป็นหุ้นส่วนในห้างหุ้นส่วนจดทะเบียน อันเกี่ยวแก่หนี้ซึ่งห้างหุ้นส่วนได้ก่อให้เกิดขึ้นก่อนที่ตนออกจากหุ้นส่วนนั้น ย่อมมีจำกัดเพียงสองปีนับแต่เมื่อออกจากหุ้นส่วน"],["1069","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๕ การจดทะเบียนห้างหุ้นส่วนสามัญ","มาตรา ๑๐๖๙ นอกจากในกรณีทั้งหลายที่บัญญัติไว้ในมาตรา ๑๐๕๕ ท่านว่าห้างหุ้นส่วนจดทะเบียนย่อมเลิกกันเมื่อห้างหุ้นส่วนนั้นล้มละลาย"],["1070","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๕ การจดทะเบียนห้างหุ้นส่วนสามัญ","มาตรา ๑๐๗๐ เมื่อใดห้างหุ้นส่วนซึ่งจดทะเบียนผิดนัดชำระหนี้ เมื่อนั้นเจ้าหนี้ของห้างหุ้นส่วนนั้นชอบที่จะเรียกให้ชำระหนี้เอาแต่ผู้เป็นหุ้นส่วนคนใดคนหนึ่งก็ได้"],["1071","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๕ การจดทะเบียนห้างหุ้นส่วนสามัญ","มาตรา ๑๐๗๑ ในกรณีที่กล่าวไว้ในมาตรา ๑๐๗๐ นั้น ถ้าผู้เป็นหุ้นส่วนนำพิสูจน์ได้ว่า\n(๑) สินทรัพย์ของห้างหุ้นส่วนยังมีพอที่จะชำระหนี้ได้ทั้งหมดหรือบางส่วน และ\n(๒) การที่จะบังคับเอาแก่ห้างหุ้นส่วนนั้นไม่เป็นการยากฉะนี้ไซร้\nศาลจะบังคับให้เอาสินทรัพย์ของห้างหุ้นส่วนนั้นชำระหนี้ก่อนก็ได้ สุดแต่ศาลจะเห็นสมควร"],["1072","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๕ การจดทะเบียนห้างหุ้นส่วนสามัญ","มาตรา ๑๐๗๒ ถ้าห้างหุ้นส่วนซึ่งจดทะเบียนยังมิได้เลิกกันตราบใด เจ้าหนี้ของผู้เป็นหุ้นส่วนเฉพาะตัวย่อมใช้สิทธิได้แต่เพียงในผลกำไรหรือเงินซึ่งห้างหุ้นส่วนค้างชำระแก่ผู้เป็นหุ้นส่วนคนนั้นเท่านั้น ถ้าห้างหุ้นส่วนนั้นเลิกกันแล้ว เจ้าหนี้ย่อมใช้สิทธิได้ตลอดจนถึงหุ้นของผู้เป็นหุ้นส่วนคนนั้นอันมีในสินทรัพย์ของห้างหุ้นส่วน"],["1073","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๖ การควบห้างหุ้นส่วนจดทะเบียนเข้ากัน","มาตรา ๑๐๗๓ ห้างหุ้นส่วนจดทะเบียนห้างหนึ่งจะควบเข้าเป็นอันเดียวกับห้างหุ้นส่วนจดทะเบียนอีกห้างหนึ่งก็ได้ โดยความยินยอมของผู้เป็นหุ้นส่วนทั้งหมด เว้นแต่จะได้ตกลงกันไว้เป็นอย่างอื่น"],["1074","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๖ การควบห้างหุ้นส่วนจดทะเบียนเข้ากัน","มาตรา ๑๐๗๔ เมื่อห้างหุ้นส่วนจดทะเบียนห้างใดปลงใจจะควบเข้ากันกับห้างอื่น ห้างหุ้นส่วนนั้นต้องโฆษณาในหนังสือพิมพ์แห่งท้องที่นั้นสองครั้งเป็นอย่างน้อย และส่งคำบอกกล่าวความประสงค์ที่จะควบเข้ากันนั้นแก่บรรดาผู้ซึ่งห้างหุ้นส่วนรู้ว่าเป็นเจ้าหนี้ และขอให้เจ้าหนี้ผู้มีข้อคัดค้านอย่างหนึ่งอย่างใดในการที่จะทำนั้นส่งคำคัดค้านไปภายในสามเดือนนับแต่วันบอกกล่าว\nถ้าไม่มีใครคัดค้านภายในกำหนดเวลาเช่นว่านั้น ก็ให้พึงถือว่าไม่มีคัดค้าน\nถ้ามีคัดค้านไซร้ ท่านมิให้ห้างหุ้นส่วนจัดการควบเข้ากัน เว้นแต่จะได้ใช้หนี้ที่เรียกร้องหรือให้ประกันเพื่อหนี้นั้นแล้ว"],["1075","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๖ การควบห้างหุ้นส่วนจดทะเบียนเข้ากัน","มาตรา ๑๐๗๕ เมื่อห้างได้ควบเข้ากันแล้ว ต่างห้างก็ต่างมีหน้าที่จะต้องนำความนั้นไปจดลงทะเบียน ว่าได้ควบเข้ากันเป็นห้างหุ้นส่วนขึ้นใหม่"],["1076","b3t22","หมวด ๒ ห้างหุ้นส่วนสามัญ","ส่วนที่ ๖ การควบห้างหุ้นส่วนจดทะเบียนเข้ากัน","มาตรา ๑๐๗๖ ห้างหุ้นส่วนใหม่นี้ย่อมได้ไปทั้งสิทธิทั้งต้องอยู่ในความรับผิดของห้างหุ้นส่วนเดิมที่ได้ควบเข้ากันนั้นทั้งสิ้น"],["1077","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๗๗ อันห้างหุ้นส่วนจำกัดนั้น คือห้างหุ้นส่วนประเภทหนึ่งซึ่งมีผู้เป็นหุ้นส่วนสองจำพวกดังจะกล่าวต่อไปนี้ คือ\n(๑) ผู้เป็นหุ้นส่วนคนเดียวหรือหลายคนซึ่งมีจำกัดความรับผิดเพียงไม่เกินจำนวนเงินที่ตนรับจะลงหุ้นในห้างหุ้นส่วนนั้นจำพวกหนึ่ง และ\n(๒) ผู้เป็นหุ้นส่วนคนเดียวหรือหลายคนซึ่งต้องรับผิดร่วมกันในบรรดาหนี้ของห้างหุ้นส่วนไม่มีจำกัดจำนวนอีกจำพวกหนึ่ง"],["1078","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๗๘ อันห้างหุ้นส่วนจำกัดนั้น ท่านบังคับว่าต้องจดทะเบียน\nการลงทะเบียนนั้น ต้องมีรายการดังต่อไปนี้ คือ\n(๑) ชื่อห้างหุ้นส่วน\n(๒) ข้อแถลงความว่าเป็นห้างหุ้นส่วนจำกัด และวัตถุที่ประสงค์ของห้างหุ้นส่วนนั้น\n(๓) ที่ตั้งสำนักงานแห่งใหญ่และสำนักงานสาขาทั้งปวง\n(๔) ชื่อ ยี่ห้อ สำนัก และอาชีวะของผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดและจำนวนเงินซึ่งเขาเหล่านั้นได้ลงหุ้นด้วยในห้างหุ้นส่วน\n(๕) ชื่อ ยี่ห้อ สำนัก และอาชีวะของผู้เป็นหุ้นส่วนจำพวกไม่จำกัดความรับผิด\n(๖) ชื่อหุ้นส่วนผู้จัดการ\n(๗) ถ้ามีข้อจำกัดอำนาจหุ้นส่วนผู้จัดการอันจะผูกพันห้างหุ้นส่วนนั้นประการใดให้ลงไว้ด้วย\nข้อความซึ่งลงทะเบียนนั้น จะลงรายการอื่น ๆ อีกอันคู่สัญญาเห็นสมควรจะให้ประชาชนทราบด้วยก็ได้\nการลงทะเบียนนั้น ต้องลงลายมือชื่อของผู้เป็นหุ้นส่วนทุกคน และต้องประทับตราของห้างหุ้นส่วนนั้นด้วย\nให้พนักงานทะเบียนทำใบสำคัญแสดงการจดทะเบียนส่งมอบให้แก่ห้างหุ้นส่วนนั้นฉบับหนึ่ง"],["1078/1","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๗๘/๑ หุ้นส่วนผู้จัดการคนใดจะลาออกจากตำแหน่ง ให้ยื่นใบลาออกต่อหุ้นส่วนผู้จัดการคนหนึ่งคนใด การลาออกมีผลนับแต่วันที่ใบลาออกไปถึงหุ้นส่วนผู้จัดการอื่นนั้น\nในกรณีที่ห้างหุ้นส่วนจำกัดมีหุ้นส่วนผู้จัดการคนเดียว ให้หุ้นส่วนผู้จัดการที่จะลาออกจากตำแหน่งแจ้งเป็นหนังสือให้ผู้เป็นหุ้นส่วนคนหนึ่งคนใดทราบเพื่อนัดประชุมและพิจารณาตั้งหุ้นส่วนผู้จัดการคนใหม่ พร้อมกับแนบใบลาออกไปด้วย การลาออกมีผลนับแต่วันที่ใบลาออกไปถึงหุ้นส่วนผู้นั้น\nหุ้นส่วนผู้จัดการซึ่งลาออกตามวรรคหนึ่งหรือวรรคสอง จะแจ้งการลาออกของตนให้นายทะเบียนทราบด้วยก็ได้"],["1078/2","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๗๘/๒ เมื่อมีการเปลี่ยนแปลงหุ้นส่วนผู้จัดการ ให้ห้างหุ้นส่วนจำกัดนำความไปจดทะเบียนภายในสิบสี่วันนับแต่วันที่มีการเปลี่ยนแปลง"],["1079","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๗๙ อันห้างหุ้นส่วนจำกัดนั้น ถ้ายังมิได้จดทะเบียนอยู่ตราบใดท่านให้ถือว่าเป็นห้างหุ้นส่วนสามัญซึ่งผู้เป็นหุ้นส่วนทั้งหมดย่อมต้องรับผิดร่วมกันในบรรดาหนี้ของห้างหุ้นส่วนโดยไม่มีจำกัดจำนวน จนกว่าจะได้จดทะเบียน"],["1080","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๘๐ บทบัญญัติว่าด้วยห้างหุ้นส่วนสามัญข้อใด ๆ หากมิได้ยกเว้นหรือแก้ไขเปลี่ยนแปลงไปโดยบทบัญญัติแห่งหมวด ๓ นี้ ท่านให้นำมาใช้บังคับแก่ห้างหุ้นส่วนจำกัดด้วย\nถ้าผู้เป็นหุ้นส่วนจำพวกไม่จำกัดความรับผิดนั้นมีอยู่หลายคนด้วยกัน ท่านให้ใช้บทบัญญัติสำหรับห้างหุ้นส่วนสามัญเป็นวิธีบังคับในความเกี่ยวพันระหว่างคนเหล่านั้นเอง และความเกี่ยวพันระหว่างผู้เป็นหุ้นส่วนเหล่านั้นกับห้างหุ้นส่วน"],["1081","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๘๑ ห้ามมิให้เอาชื่อของผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดมาเรียกขานระคนเป็นชื่อห้าง"],["1082","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๘๒ ถ้าผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดคนใดยินยอมโดยแสดงออกชัดหรือโดยปริยายให้ใช้ชื่อของตนระคนเป็นชื่อห้างไซร้ ท่านว่าผู้เป็นหุ้นส่วนคนนั้นจะต้องรับผิดต่อบุคคลภายนอกเสมือนดังว่าเป็นหุ้นส่วนจำพวกไม่จำกัดความรับผิดฉะนั้น\nแต่ในระหว่างผู้เป็นหุ้นส่วนกันเองนั้น ความรับผิดของผู้เป็นหุ้นส่วนเช่นนี้ ท่านให้คงบังคับตามสัญญาหุ้นส่วน"],["1083","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๘๓ การลงหุ้นของผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดนั้น ท่านว่าต้องให้ลงเป็นเงินหรือทรัพย์สินอย่างอื่น ๆ"],["1084","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๘๔ ห้ามมิให้แบ่งเงินปันผลหรือดอกเบี้ยให้แก่ผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิด นอกจากผลกำไรซึ่งห้างหุ้นส่วนทำมาค้าได้\nถ้าทุนของห้างหุ้นส่วนลดน้อยลงไปเพราะค้าขายขาดทุน ท่านห้ามมิให้แบ่งเงินปันผลหรือดอกเบี้ยให้แก่ผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิด จนกว่าทุนซึ่งขาดไปนั้นจะได้คืนมาเต็มจำนวนเดิม\nแต่ถ้าผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดคนใดได้รับเงินปันผลหรือดอกเบี้ยไปแล้วโดยสุจริต ท่านว่าหาอาจจะบังคับให้เขาคืนเงินนั้นได้ไม่"],["1085","b3t22","หมวด ๓ ห้างหุ้นส่วนจำกัด","","มาตรา ๑๐๘๕ ถ้าผู้เป็นหุ้นส่วนจำพวกจำกัดความรับผิดได้แสดงด้วยจดหมายหรือใบแจ้งความหรือด้วยวิธีอย่างอื่นให้บุคคลภายนอกทราบว่าตนได้ลงหุ้นไว้มากกว่าจำนวนซึ่งได้จดทะเบียนเพียงใด ท่านว่าผู้นั้นจะต้องรับ
