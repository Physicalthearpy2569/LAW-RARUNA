กระทำอย่างอื่นอันแสดงได้ว่าเป็นการให้สัตยาบัน"],["181","b1t4","หมวด ๓ โมฆะกรรมและโมฆียะกรรม","","มาตรา ๑๘๑ โมฆียะกรรมนั้นจะบอกล้างมิได้เมื่อพ้นเวลาหนึ่งปีนับแต่เวลาที่อาจให้สัตยาบันได้ หรือเมื่อพ้นเวลาสิบปีนับแต่ได้ทำนิติกรรมอันเป็นโมฆียะนั้น"],["182","b1t4","หมวด ๔ เงื่อนไขและเงื่อนเวลา","","มาตรา ๑๘๒ ข้อความใดอันบังคับไว้ให้นิติกรรมเป็นผลหรือสิ้นผลต่อเมื่อมีเหตุการณ์อันไม่แน่นอนว่าจะเกิดขึ้นหรือไม่ในอนาคต ข้อความนั้นเรียกว่าเงื่อนไข"],["183","b1t4","หมวด ๔ เงื่อนไขและเงื่อนเวลา","","มาตรา ๑๘๓ นิติกรรมใดมีเงื่อนไขบังคับก่อน นิติกรรมนั้นย่อมเป็นผลต่อเมื่อเงื่อนไขนั้นสำเร็จแล้ว\nนิติกรรมใดมีเงื่อนไขบังคับหลัง นิติกรรมนั้นย่อมสิ้นผลในเมื่อเงื่อนไขนั้นสำเร็จแล้ว\nถ้าคู่กรณีแห่งนิติกรรมได้แสดงเจตนาไว้ด้วยกันว่า ความสำเร็จแห่งเงื่อนไขนั้นให้มีผลย้อนหลังไปถึงเวลาใดเวลาหนึ่งก่อนสำเร็จ ก็ให้เป็นไปตามเจตนาเช่นนั้น"],["184","b1t4","หมวด ๔ เงื่อนไขและเงื่อนเวลา","","มาตรา ๑๘๔ ในระหว่างที่เงื่อนไขยังไม่สำเร็จ คู่กรณีฝ่ายหนึ่งฝ่ายใดแห่งนิติกรรมอันอยู่ในบังคับเงื่อนไขจะต้องงดเว้นไม่กระทำการอย่างหนึ่งอย่างใดให้เป็นที่เสื่อมเสียประโยชน์แก่คู่กรณีอีกฝ่ายหนึ่ง ซึ่งจะพึงได้จากความสำเร็จแห่งเงื่อนไขนั้น"],["185","b1t4","หมวด ๔ เงื่อนไขและเงื่อนเวลา","","มาตรา ๑๘๕ ในระหว่างที่เงื่อนไขยังมิได้สำเร็จนั้น สิทธิและหน้าที่ต่าง ๆ ของคู่กรณีมีอย่างไร จะจำหน่าย จะรับมรดก จะจัดการป้องกันรักษา หรือจะทำประกันไว้ประการใดตามกฎหมายก็ย่อมทำได้"],["186","b1t4","หมวด ๔ เงื่อนไขและเงื่อนเวลา","","มาตรา ๑๘๖ ถ้าความสำเร็จแห่งเงื่อนไขจะเป็นทางให้คู่กรณีฝ่ายใดเสียเปรียบ และคู่กรณีฝ่ายนั้นกระทำการโดยไม่สุจริตจนเป็นเหตุให้เงื่อนไขนั้นไม่สำเร็จให้ถือว่าเงื่อนไขนั้นสำเร็จแล้ว\nถ้าความสำเร็จแห่งเงื่อนไขจะเป็นทางให้คู่กรณีฝ่ายใดได้เปรียบ และคู่กรณีฝ่ายนั้นกระทำการโดยไม่สุจริตจนเป็นเหตุให้เงื่อนไขนั้นสำเร็จ ให้ถือว่าเงื่อนไขนั้นมิได้สำเร็จเลย"],["187","b1t4","หมวด ๔ เงื่อนไขและเงื่อนเวลา","","มาตรา ๑๘๗ ถ้าเงื่อนไขสำเร็จแล้วในเวลาทำนิติกรรม หากเป็นเงื่อนไขบังคับก่อนให้ถือว่านิติกรรมนั้นไม่มีเงื่อนไข หากเป็นเงื่อนไขบังคับหลังให้ถือว่านิติกรรมนั้นเป็นโมฆะ\nถ้าเป็นอันแน่นอนในเวลาทำนิติกรรมว่าเงื่อนไขไม่อาจสำเร็จได้ หากเป็นเงื่อนไขบังคับก่อน ให้ถือว่านิติกรรมนั้นเป็นโมฆะ หากเป็นเงื่อนไขบังคับหลังให้ถือว่านิติกรรมนั้นไม่มีเงื่อนไข\nตราบใดที่คู่กรณียังไม่รู้ว่าเงื่อนไขได้สำเร็จแล้วตามวรรคหนึ่ง หรือไม่อาจสำเร็จได้ตามวรรคสอง ตราบนั้นคู่กรณียังมีสิทธิและหน้าที่ตามมาตรา ๑๘๔ และมาตรา ๑๘๕"],["188","b1t4","หมวด ๔ เงื่อนไขและเงื่อนเวลา","","มาตรา ๑๘๘ นิติกรรมใดมีเงื่อนไขอันไม่ชอบด้วยกฎหมาย หรือขัดต่อความสงบเรียบร้อยหรือศีลธรรมอันดีของประชาชน นิติกรรมนั้นเป็นโมฆะ"],["189","b1t4","หมวด ๔ เงื่อนไขและเงื่อนเวลา","","มาตรา ๑๘๙ นิติกรรมใดมีเงื่อนไขบังคับก่อนและเงื่อนไขนั้นเป็นการพ้นวิสัย นิติกรรมนั้นเป็นโมฆะ\nนิติกรรมใดมีเงื่อนไขบังคับหลังและเงื่อนไขนั้นเป็นการพ้นวิสัย ให้ถือว่านิติกรรมนั้นไม่มีเงื่อนไข"],["190","b1t4","หมวด ๔ เงื่อนไขและเงื่อนเวลา","","มาตรา ๑๙๐ นิติกรรมใดมีเงื่อนไขบังคับก่อนและเป็นเงื่อนไขอันจะสำเร็จได้หรือไม่ สุดแล้วแต่ใจของฝ่ายลูกหนี้ นิติกรรมนั้นเป็นโมฆะ"],["191","b1t4","หมวด ๔ เงื่อนไขและเงื่อนเวลา","","มาตรา ๑๙๑ นิติกรรมใดมีเงื่อนเวลาเริ่มต้นกำหนดไว้ ห้ามมิให้ทวงถามให้ปฏิบัติการตามนิติกรรมนั้นก่อนถึงเวลาที่กำหนด\nนิติกรรมใดมีเงื่อนเวลาสิ้นสุดกำหนดไว้ นิติกรรมนั้นย่อมสิ้นผลเมื่อถึงเวลาที่กำหนด"],["192","b1t4","หมวด ๔ เงื่อนไขและเงื่อนเวลา","","มาตรา ๑๙๒ เงื่อนเวลาเริ่มต้นหรือเงื่อนเวลาสิ้นสุดนั้น ให้สันนิษฐานไว้ก่อนว่ากำหนดไว้เพื่อประโยชน์แก่ฝ่ายลูกหนี้ เว้นแต่จะปรากฏโดยเนื้อความแห่งตราสารหรือโดยพฤติการณ์แห่งกรณีว่าได้ตั้งใจจะให้เป็นประโยชน์แก่ฝ่ายเจ้าหนี้หรือแก่คู่กรณีทั้งสองฝ่ายด้วยกัน\nถ้าเงื่อนเวลาเป็นประโยชน์แก่ฝ่ายใด ฝ่ายนั้นจะสละประโยชน์นั้นเสียก็ได้ หากไม่กระทบกระเทือนถึงประโยชน์อันคู่กรณีอีกฝ่ายหนึ่งจะพึงได้รับจากเงื่อนเวลานั้น"],["193","b1t4","หมวด ๔ เงื่อนไขและเงื่อนเวลา","","มาตรา ๑๙๓ ในกรณีดังต่อไปนี้ ฝ่ายลูกหนี้จะถือเอาประโยชน์แห่งเงื่อนเวลาเริ่มต้นหรือเงื่อนเวลาสิ้นสุดมิได้\n(๑) ลูกหนี้ถูกศาลสั่งพิทักษ์ทรัพย์เด็ดขาดตามกฎหมายว่าด้วยล้มละลาย\n(๒) ลูกหนี้ไม่ให้ประกันในเมื่อจำต้องให้\n(๓) ลูกหนี้ได้ทำลาย หรือทำให้ลดน้อยถอยลงซึ่งประกันอันได้ให้ไว้\n(๔) ลูกหนี้นำทรัพย์สินของบุคคลอื่นมาให้เป็นประกันโดยเจ้าของทรัพย์สินนั้นมิได้ยินยอมด้วย"],["193/1","b1t5","","","มาตรา ๑๙๓/๑ การนับระยะเวลาทั้งปวง ให้บังคับตามบทบัญญัติแห่งลักษณะนี้ เว้นแต่จะมีกฎหมาย คำสั่งศาล ระเบียบข้อบังคับ หรือนิติกรรมกำหนดเป็นอย่างอื่น"],["193/2","b1t5","","","มาตรา ๑๙๓/๒ การคำนวณระยะเวลา ให้คำนวณเป็นวัน แต่ถ้ากำหนดเป็นหน่วยเวลาที่สั้นกว่าวัน ก็ให้คำนวณตามหน่วยเวลาที่กำหนดนั้น"],["193/3","b1t5","","","มาตรา ๑๙๓/๓ ถ้ากำหนดระยะเวลาเป็นหน่วยเวลาที่สั้นกว่าวันให้เริ่มต้นนับในขณะที่เริ่มการนั้น\nถ้ากำหนดระยะเวลาเป็นวัน สัปดาห์ เดือนหรือปี มิให้นับวันแรกแห่งระยะเวลานั้นรวมเข้าด้วยกัน เว้นแต่จะเริ่มการในวันนั้นเองตั้งแต่เวลาที่ถือได้ว่าเป็นเวลาเริ่มต้นทำการงานกันตามประเพณี"],["193/4","b1t5","","","มาตรา ๑๙๓/๔ ในทางคดีความ ในทางราชการ หรือทางธุรกิจการค้าและอุตสาหกรรม วัน หมายความว่า เวลาทำการตามที่ได้กำหนดขึ้นโดยกฎหมาย คำสั่งศาล หรือระเบียบข้อบังคับ หรือเวลาทำการตามปกติของกิจการนั้น แล้วแต่กรณี"],["193/5","b1t5","","","มาตรา ๑๙๓/๕ ถ้ากำหนดระยะเวลาเป็นสัปดาห์ เดือนหรือปี ให้คำนวณตามปีปฏิทิน\nถ้าระยะเวลามิได้กำหนดนับแต่วันต้นแห่งสัปดาห์ วันต้นแห่งเดือนหรือปี ระยะเวลาย่อมสิ้นสุดลงในวันก่อนหน้าจะถึงวันแห่งสัปดาห์ เดือนหรือปีสุดท้ายอันเป็นวันตรงกับวันเริ่มระยะเวลานั้น ถ้าในระยะเวลานับเป็นเดือนหรือปีนั้นไม่มีวันตรงกันในเดือนสุดท้าย ให้ถือเอาวันสุดท้ายแห่งเดือนนั้นเป็นวันสิ้นสุดระยะเวลา"],["193/6","b1t5","","","มาตรา ๑๙๓/๖ ถ้าระยะเวลากำหนดเป็นเดือนและวัน หรือกำหนดเป็นเดือนและส่วนของเดือน ให้นับจำนวนเดือนเต็มก่อน แล้วจึงนับจำนวนวันหรือส่วนของเดือนเป็นวัน\nถ้าระยะเวลากำหนดเป็นส่วนของปี ให้คำนวณส่วนของปีเป็นเดือนก่อนหากมีส่วนของเดือน ให้นับส่วนของเดือนเป็นวัน\nการคำนวณส่วนของเดือนตามวรรคหนึ่งและวรรคสอง ให้ถือว่าเดือนหนึ่งมีสามสิบวัน"],["193/7","b1t5","","","มาตรา ๑๙๓/๗ ถ้ามีการขยายระยะเวลาออกไปโดยมิได้มีกำหนดวันเริ่มต้นแห่งระยะเวลาที่ขยายออกไป ให้นับวันที่ต่อจากวันสุดท้ายของระยะเวลาเดิมเป็นวันเริ่มต้น"],["193/8","b1t5","","","มาตรา ๑๙๓/๘ ถ้าวันสุดท้ายของระยะเวลาเป็นวันหยุดทำการตามประกาศเป็นทางการ หรือตามประเพณี ให้นับวันที่เริ่มทำการใหม่ต่อจากวันที่หยุดทำการนั้นเป็นวันสุดท้ายของระยะเวลา"],["193/9","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๙ สิทธิเรียกร้องใด ๆ ถ้ามิได้ใช้บังคับภายในระยะเวลาที่กฎหมายกำหนด สิทธิเรียกร้องนั้นเป็นอันขาดอายุความ"],["193/10","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๑๐ สิทธิเรียกร้องที่ขาดอายุความ ลูกหนี้มีสิทธิที่จะปฏิเสธการชำระหนี้ตามสิทธิเรียกร้องนั้นได้"],["193/11","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๑๑ อายุความที่กฎหมายกำหนดไว้นั้น คู่กรณีจะตกลงกันให้งดใช้หรือขยายออกหรือย่นเข้าไม่ได้"],["193/12","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๑๒ อายุความให้เริ่มนับแต่ขณะที่อาจบังคับสิทธิเรียกร้องได้เป็นต้นไป ถ้าเป็นสิทธิเรียกร้องให้งดเว้นกระทำการอย่างใด ให้เริ่มนับแต่เวลาแรกที่ฝ่าฝืนกระทำการนั้น"],["193/13","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๑๓ สิทธิเรียกร้องที่เจ้าหนี้ยังไม่อาจบังคับได้จนกว่าจะได้ทวงถามให้ลูกหนี้ชำระหนี้ก่อน ให้เริ่มนับอายุความตั้งแต่เวลาแรกที่อาจทวงถามได้เป็นต้นไป แต่ถ้าลูกหนี้ยังไม่ต้องชำระหนี้จนกว่าระยะเวลาหนึ่งจะได้ล่วงพ้นไปแล้วนับแต่เวลาที่ได้ทวงถามนั้น ให้เริ่มนับอายุความตั้งแต่ระยะเวลานั้นได้สิ้นสุดไปแล้ว"],["193/14","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๑๔ อายุความย่อมสะดุดหยุดลงในกรณีดังต่อไปนี้\n(๑) ลูกหนี้รับสภาพหนี้ต่อเจ้าหนี้ตามสิทธิเรียกร้องโดยทำเป็นหนังสือรับสภาพหนี้ให้ ชำระหนี้ให้บางส่วน ชำระดอกเบี้ย ให้ประกัน หรือกระทำการใด ๆ อันปราศจากข้อสงสัยแสดงให้เห็นเป็นปริยายว่ายอมรับสภาพหนี้ตามสิทธิเรียกร้อง\n(๒) เจ้าหนี้ได้ฟ้องคดีเพื่อตั้งหลักฐานสิทธิเรียกร้องหรือเพื่อให้ชำระหนี้\n(๓) เจ้าหนี้ได้ยื่นคำขอรับชำระหนี้ในคดีล้มละลาย\n(๔) เจ้าหนี้ได้มอบข้อพิพาทให้อนุญาโตตุลาการพิจารณา\n(๕) เจ้าหนี้ได้กระทำการอื่นใดอันมีผลเป็นอย่างเดียวกันกับการฟ้องคดี"],["193/15","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๑๕ เมื่ออายุความสะดุดหยุดลงแล้ว ระยะเวลาที่ล่วงไปก่อนนั้นไม่นับเข้าในอายุความ\nเมื่อเหตุที่ทำให้อายุความสะดุดหยุดลงสิ้นสุดเวลาใด ให้เริ่มนับอายุความใหม่ตั้งแต่เวลานั้น"],["193/16","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๑๖ หนี้ใดซึ่งตามมูลแห่งหนี้นั้น เจ้าหนี้จะได้รับชำระหนี้เป็นคราว ๆ เจ้าหนี้มีสิทธิเรียกให้ลูกหนี้ทำหนังสือรับสภาพหนี้ให้ในเวลาใดเวลาหนึ่งก่อนอายุความครบบริบูรณ์ เพื่อเป็นหลักฐานว่าอายุความสะดุดหยุดลง"],["193/17","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๑๗ ในกรณีที่อายุความสะดุดหยุดลงเพราะเหตุตามมาตรา ๑๙๓/๑๔ (๒) หากคดีนั้นได้มีคำพิพากษาถึงที่สุดให้ยกคำฟ้อง หรือคดีเสร็จไปโดยการจำหน่ายคดีเพราะเหตุถอนฟ้อง หรือทิ้งฟ้อง ให้ถือว่าอายุความไม่เคยสะดุดหยุดลง\nในกรณีที่คดีนั้นศาลไม่รับหรือคืนหรือให้ยกคำฟ้องเพราะเหตุคดีไม่อยู่ในอำนาจศาล หรือศาลให้ยกคำฟ้องโดยไม่ตัดสิทธิโจทก์ที่จะฟ้องใหม่ และปรากฏว่าอายุความครบกำหนดไปแล้วในระหว่างการพิจารณา หรือจะครบกำหนดภายในหกสิบวันนับแต่วันที่คำพิพากษาหรือคำสั่งนั้นถึงที่สุด ให้เจ้าหนี้มีสิทธิฟ้องคดีเพื่อตั้งหลักฐานสิทธิเรียกร้องหรือเพื่อให้ชำระหนี้ภายในหกสิบวันนับแต่วันที่คำพิพากษาหรือคำสั่งนั้นถึงที่สุด"],["193/18","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๑๘ ให้นำมาตรา ๑๙๓/๑๗ มาใช้บังคับแก่กรณีที่อายุความสะดุดหยุดลงเพราะเหตุตามมาตรา ๑๙๓/๑๔ (๓) (๔) และ (๕) โดยอนุโลม"],["193/19","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๑๙ ในขณะที่อายุความจะครบกำหนดนั้น ถ้ามีเหตุสุดวิสัยมาขัดขวางมิให้เจ้าหนี้กระทำการตามมาตรา ๑๙๓/๑๔ ให้อายุความนั้นยังไม่ครบกำหนดจนกว่าจะพ้นสามสิบวันนับแต่วันที่เหตุสุดวิสัยนั้นได้สิ้นสุดลง"],["193/20","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๒๐ อายุความสิทธิเรียกร้องของผู้เยาว์หรือของบุคคลวิกลจริตอันศาลจะสั่งให้เป็นคนไร้ความสามารถหรือไม่ก็ตาม ถ้าจะครบกำหนดลงในขณะที่บุคคลดังกล่าวยังไม่ลุถึงความสามารถเต็มภูมิ หรือในระหว่างหนึ่งปีนับแต่วันที่บุคคลดังกล่าวไม่มีผู้แทนโดยชอบธรรมหรือผู้อนุบาล อายุความนั้นยังไม่ครบกำหนดจนกว่าจะครบหนึ่งปีนับแต่วันที่บุคคลนั้นได้ลุถึงความสามารถเต็มภูมิหรือได้มีผู้แทนโดยชอบธรรมหรือผู้อนุบาล แล้วแต่กรณี แต่ถ้าอายุความสิทธิเรียกร้องนั้นมีระยะเวลาน้อยกว่าหนึ่งปีก็ให้นำกำหนดระยะเวลาที่สั้นกว่านั้นมาใช้แทนกำหนดระยะเวลาหนึ่งปีดังกล่าว"],["193/21","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๒๑ อายุความสิทธิเรียกร้องของผู้เยาว์หรือของคนไร้ความสามารถหรือของคนเสมือนไร้ความสามารถ ที่จะฟ้องร้องผู้แทนโดยชอบธรรมหรือผู้อนุบาลหรือผู้พิทักษ์ของตนนั้น ถ้าจะครบกำหนดลงในขณะที่บุคคลดังกล่าวยังไม่ลุถึงความสามารถเต็มภูมิ หรือในระหว่างหนึ่งปีนับแต่วันที่บุคคลดังกล่าวไม่มีผู้แทนโดยชอบธรรมหรือผู้อนุบาลหรือผู้พิทักษ์ อายุความนั้นยังไม่ครบกำหนดจนกว่าจะครบหนึ่งปีนับแต่วันที่บุคคลนั้นได้ลุถึงความสามารถเต็มภูมิหรือได้มีผู้แทนโดยชอบธรรมหรือผู้อนุบาลหรือผู้พิทักษ์ แล้วแต่กรณี แต่ถ้าอายุความสิทธิเรียกร้องนั้นมีระยะเวลาน้อยกว่าหนึ่งปี ก็ให้นำกำหนดระยะเวลาที่สั้นกว่านั้นมาใช้แทนกำหนดระยะเวลาหนึ่งปีดังกล่าว"],["193/22","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๒๒ อายุความสิทธิเรียกร้องระหว่างคู่สมรส ถ้าจะครบกำหนดก่อนหรือภายในหนึ่งปีนับแต่วันที่การสมรสสิ้นสุดลง อายุความนั้นยังไม่ครบกำหนดจนกว่าจะครบหนึ่งปีนับแต่วันที่การสมรสสิ้นสุดลง"],["193/23","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๒๓ อายุความสิทธิเรียกร้องอันเป็นคุณหรือเป็นโทษแก่ผู้ตาย ถ้าจะครบกำหนดภายในหนึ่งปีนับแต่วันตาย อายุความนั้นยังไม่ครบกำหนดจนกว่าจะครบหนึ่งปีนับแต่วันตาย"],["193/24","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๒๔ เมื่ออายุความครบกำหนดแล้ว ลูกหนี้จะสละประโยชน์แห่งอายุความนั้นเสียก็ได้ แต่การสละประโยชน์เช่นว่านี้ไม่มีผลกระทบกระเทือนสิทธิของบุคคลภายนอกหรือผู้ค้ำประกัน"],["193/25","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๒๕ เมื่ออายุความครบกำหนดแล้ว ให้มีผลย้อนหลังขึ้นไปถึงวันที่เริ่มนับอายุความ"],["193/26","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๒๖ เมื่อสิทธิเรียกร้องส่วนที่เป็นประธานขาดอายุความให้สิทธิเรียกร้องส่วนที่เป็นอุปกรณ์นั้นขาดอายุความด้วย แม้ว่าอายุความของสิทธิเรียกร้องส่วนที่เป็นอุปกรณ์นั้นจะยังไม่ครบกำหนดก็ตาม"],["193/27","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๒๗ ผู้รับจำนอง ผู้รับจำนำ ผู้ทรงสิทธิยึดหน่วง หรือผู้ทรงบุริมสิทธิเหนือทรัพย์สินของลูกหนี้อันตนได้ยึดถือไว้ ยังคงมีสิทธิบังคับชำระหนี้จากทรัพย์สินที่จำนอง จำนำ หรือที่ได้ยึดถือไว้ แม้ว่าสิทธิเรียกร้องส่วนที่เป็นประธานจะขาดอายุความแล้วก็ตาม แต่จะใช้สิทธินั้นบังคับให้ชำระดอกเบี้ยที่ค้างย้อนหลังเกินห้าปีขึ้นไปไม่ได้"],["193/28","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๒๘ การชำระหนี้ตามสิทธิเรียกร้องซึ่งขาดอายุความแล้วนั้นไม่ว่ามากน้อยเพียงใดจะเรียกคืนไม่ได้ แม้ว่าผู้ชำระหนี้จะไม่รู้ว่าสิทธิเรียกร้องขาดอายุความแล้วก็ตาม\nบทบัญญัติในวรรคหนึ่ง ให้ใช้บังคับแก่การที่ลูกหนี้รับสภาพความรับผิดโดยมีหลักฐานเป็นหนังสือ หรือโดยการให้ประกันด้วย แต่จะอ้างความข้อนี้ขึ้นเป็นโทษแก่ผู้ค้ำประกันเดิมไม่ได้"],["193/29","b1t6","หมวด ๑ บทเบ็ดเสร็จทั่วไป","","มาตรา ๑๙๓/๒๙ เมื่อไม่ได้ยกอายุความขึ้นเป็นข้อต่อสู้ ศาลจะอ้างเอาอายุความมาเป็นเหตุยกฟ้องไม่ได้"],["193/30","b1t6","หมวด ๒ กำหนดอายุความ","","มาตรา ๑๙๓/๓๐ อายุความนั้น ถ้าประมวลกฎหมายนี้หรือกฎหมายอื่นมิได้บัญญัติไว้โดยเฉพาะให้มีกำหนดสิบปี"],["193/31","b1t6","หมวด ๒ กำหนดอายุความ","","มาตรา ๑๙๓/๓๑ สิทธิเรียกร้องของรัฐที่จะเรียกเอาค่าภาษีอากรให้มีกำหนดอายุความสิบปี ส่วนสิทธิเรียกร้องของรัฐที่จะเรียกเอาหนี้อย่างอื่นให้บังคับตามบทบัญญัติในลักษณะนี้"],["193/32","b1t6","หมวด ๒ กำหนดอายุความ","","มาตรา ๑๙๓/๓๒ สิทธิเรียกร้องที่เกิดขึ้นโดยคำพิพากษาของศาลที่ถึงที่สุด หรือโดยสัญญาประนีประนอมยอมความ ให้มีกำหนดอายุความสิบปี ทั้งนี้ ไม่ว่าสิทธิเรียกร้องเดิมจะมีกำหนดอายุความเท่าใด"],["193/33","b1t6","หมวด ๒ กำหนดอายุความ","","มาตรา ๑๙๓/๓๓ สิทธิเรียกร้องดังต่อไปนี้ให้มีกำหนดอายุความห้าปี\n(๑) ดอกเบี้ยค้างชำระ\n(๒) เงินที่ต้องชำระเพื่อผ่อนทุนคืนเป็นงวด ๆ\n(๓) ค่าเช่าทรัพย์สินค้างชำระ เว้นแต่ค่าเช่าสังหาริมทรัพย์ตามมาตรา ๑๙๓/๓๔ (๖)\n(๔) เงินค้างจ่าย คือ เงินเดือน เงินปี เงินบำนาญ ค่าอุปการะเลี้ยงดูและเงินอื่น ๆ ในลักษณะทำนองเดียวกับที่มีการกำหนดจ่ายเป็นระยะเวลา\n(๕) สิทธิเรียกร้องตามมาตรา ๑๙๓/๓๔ (๑) (๒) และ (๕) ที่ไม่อยู่ในบังคับอายุความสองปี"],["193/34","b1t6","หมวด ๒ กำหนดอายุความ","","มาตรา ๑๙๓/๓๔ สิทธิเรียกร้องดังต่อไปนี้ ให้มีกำหนดอายุความสองปี\n(๑) ผู้ประกอบการค้าหรืออุตสาหกรรม ผู้ประกอบหัตถกรรม ผู้ประกอบศิลปอุตสาหกรรมหรือช่างฝีมือ เรียกเอาค่าของที่ได้ส่งมอบ ค่าการงานที่ได้ทำ หรือค่าดูแลกิจการของผู้อื่น รวมทั้งเงินที่ได้ออกทดรองไป เว้นแต่เป็นการที่ได้ทำเพื่อกิจการของฝ่ายลูกหนี้นั้นเอง\n(๒) ผู้ประกอบเกษตรกรรมหรือการป่าไม้ เรียกเอาค่าของที่ได้ส่งมอบอันเป็นผลิตผลทางเกษตรหรือป่าไม้ เฉพาะที่ใช้สอยในบ้านเรือนของฝ่ายลูกหนี้นั้นเอง\n(๓) ผู้ขนส่งคนโดยสารหรือสิ่งของหรือผู้รับส่งข่าวสาร เรียกเอาค่าโดยสาร ค่าระวาง ค่าเช่า ค่าธรรมเนียม รวมทั้งเงินที่ได้ออกทดรองไป\n(๔) ผู้ประกอบธุรกิจโรงแรมหรือหอพัก ผู้ประกอบธุรกิจในการจำหน่ายอาหารและเครื่องดื่ม หรือผู้ประกอบธุรกิจสถานบริการตามกฎหมายว่าด้วยสถานบริการเรียกเอาค่าที่พัก อาหารหรือเครื่องดื่ม ค่าบริการหรือค่าการงานที่ได้ทำให้แก่ผู้มาพักหรือใช้บริการ รวมทั้งเงินที่ได้ออกทดรองไป\n(๕) ผู้ขายสลากกินแบ่ง สลากกินรวบ หรือสลากที่คล้ายคลึงกัน เรียกเอาค่าขายสลาก เว้นแต่เป็นการขายเพื่อการขายต่อ\n(๖) ผู้ประกอบธุรกิจในการให้เช่าสังหาริมทรัพย์ เรียกเอาค่าเช่า\n(๗) บุคคลซึ่งมิได้เข้าอยู่ในประเภทที่ระบุไว้ใน (๑) แต่เป็นผู้ประกอบธุรกิจในการดูแลกิจการของผู้อื่นหรือรับทำการงานต่าง ๆ เรียกเอาสินจ้างอันจะพึงได้รับในการนั้น รวมทั้งเงินที่ได้ออกทดรองไป\n(๘) ลูกจ้างซึ่งรับใช้การงานส่วนบุคคล เรียกเอาค่าจ้างหรือสินจ้างอย่างอื่น เพื่อการงานที่ทำ รวมทั้งเงินที่ได้ออกทดรองไป หรือนายจ้างเรียกเอาคืนซึ่งเงินเช่นว่านั้นที่ตนได้จ่ายล่วงหน้าไป\n(๙) ลูกจ้างไม่ว่าจะเป็นลูกจ้างประจำ ลูกจ้างชั่วคราว หรือลูกจ้างรายวัน รวมทั้งผู้ฝึกหัดงาน เรียกเอาค่าจ้างหรือสินจ้างอย่างอื่น รวมทั้งเงินที่ได้ออกทดรองไป หรือนายจ้างเรียกเอาคืนซึ่งเงินเช่นว่านั้นที่ตนได้จ่ายล่วงหน้าไป\n(๑๐) ครูสอนผู้ฝึกหัดงาน เรียกเอาค่าฝึกสอนและค่าใช้จ่ายอย่างอื่นตามที่ได้ตกลงกันไว้ รวมทั้งเงินที่ได้ออกทดรองไป\n(๑๑) เจ้าของสถานศึกษาหรือสถานพยาบาล เรียกเอาค่าธรรมเนียมการเรียนและค่าธรรมเนียมอื่น ๆ หรือค่ารักษาพยาบาลและค่าใช้จ่ายอย่างอื่น รวมทั้งเงินที่ได้ออกทดรองไป\n(๑๒) ผู้รับคนไว้เพื่อการบำรุงเลี้ยงดูหรือฝึกสอน เรียกเอาค่าการงานที่ทำให้ รวมทั้งเงินที่ได้ออกทดรองไป\n(๑๓) ผู้รับเลี้ยงหรือฝึกสอนสัตว์ เรียกเอาค่าการงานที่ทำให้ รวมทั้งเงินที่ได้ออกทดรองไป\n(๑๔) ครูหรืออาจารย์ เรียกเอาค่าสอน\n(๑๕) ผู้ประกอบวิชาชีพเวชกรรม ทันตกรรม การพยาบาล การผดุงครรภ์ ผู้ประกอบการบำบัดโรคสัตว์ หรือผู้ประกอบโรคศิลปะสาขาอื่น เรียกเอาค่าการงานที่ทำให้รวมทั้งเงินที่ได้ออกทดรองไป\n(๑๖) ทนายความหรือผู้ประกอบวิชาชีพทางกฎหมาย รวมทั้งพยานผู้เชี่ยวชาญเรียกเอาค่าการงานที่ทำให้ รวมทั้งเงินที่ได้ออกทดรองไป หรือคู่ความเรียกเอาคืนซึ่งเงินเช่นว่านั้นที่ตนได้จ่ายล่วงหน้าไป\n(๑๗) ผู้ประกอบวิชาชีพวิศวกรรม สถาปัตยกรรม ผู้สอบบัญชี หรือผู้ประกอบวิชาชีพอิสระอื่น เรียกเอาค่าการงานที่ทำให้ รวมทั้งเงินที่ได้ออกทดรองไป หรือผู้ว่าจ้างให้ประกอบการงานดังกล่าวเรียกเอาคืนซึ่งเงินเช่นว่านั้นที่ตนได้จ่ายล่วงหน้าไป"],["193/35","b1t6","หมวด ๒ กำหนดอายุความ","","มาตรา ๑๙๓/๓๕ ภายใต้บังคับมาตรา ๑๙๓/๒๗ สิทธิเรียกร้องที่เกิดขึ้นจากการที่ลูกหนี้รับสภาพความรับผิดโดยมีหลักฐานเป็นหนังสือหรือโดยการให้ประกันตามมาตรา ๑๙๓/๒๘ วรรคสอง ให้มีกำหนดอายุความสองปีนับแต่วันที่ได้รับสภาพความรับผิดหรือให้ประกัน"],["194","b2t1","หมวด ๑ วัตถุแห่งหนี้","","มาตรา ๑๙๔ ด้วยอำนาจแห่งมูลหนี้ เจ้าหนี้ย่อมมีสิทธิจะเรียกให้ลูกหนี้ชำระหนี้ได้ อนึ่ง การชำระหนี้ด้วยงดเว้นการอันใดอันหนึ่งก็ย่อมมีได้"],["195","b2t1","หมวด ๑ วัตถุแห่งหนี้","","มาตรา ๑๙๕ เมื่อทรัพย์ซึ่งเป็นวัตถุแห่งหนี้นั้นได้ระบุไว้แต่เพียงเป็นประเภท และถ้าตามสภาพแห่งนิติกรรม หรือตามเจตนาของคู่กรณีไม่อาจจะกำหนดได้ว่าทรัพย์นั้นจะพึงเป็นชนิดอย่างไรไซร้ ท่านว่าลูกหนี้จะต้องส่งมอบทรัพย์ชนิดปานกลาง\nถ้าลูกหนี้ได้กระทำการอันตนจะพึงต้องทำเพื่อส่งมอบทรัพย์สิ่งนั้นทุกประการแล้วก็ดี หรือถ้าลูกหนี้ได้เลือกกำหนดทรัพย์ที่จะส่งมอบแล้วด้วยความยินยอมของเจ้าหนี้ก็ดี ท่านว่าทรัพย์นั้นจึงเป็นวัตถุแห่งหนี้จำเดิมแต่เวลานั้นไป"],["196","b2t1","หมวด ๑ วัตถุแห่งหนี้","","มาตรา ๑๙๖ ถ้าหนี้เงินได้แสดงไว้เป็นเงินต่างประเทศ ท่านว่าจะส่งใช้เป็นเงินไทยก็ได้\nการเปลี่ยนเงินนี้ ให้คิดตามอัตราแลกเปลี่ยนเงิน ณ สถานที่และในเวลาที่ใช้เงิน"],["197","b2t1","หมวด ๑ วัตถุแห่งหนี้","","มาตรา ๑๙๗ ถ้าหนี้เงินจะพึงส่งใช้ด้วยเงินตราชนิดหนึ่งชนิดใดโดยเฉพาะ อันเป็นชนิดที่ยกเลิกไม่ใช้กันแล้วในเวลาที่จะต้องส่งเงินใช้หนี้นั้นไซร้ การส่งใช้เงินท่านให้ถือเสมือนหนึ่งว่ามิได้ระบุไว้ให้ใช้เป็นเงินตราชนิดนั้น"],["198","b2t1","หมวด ๑ วัตถุแห่งหนี้","","มาตรา ๑๙๘ ถ้าการอันมีกำหนดพึงกระทำเพื่อชำระหนี้นั้นมีหลายอย่าง แต่จะต้องกระทำเพียงการใดการหนึ่งแต่อย่างเดียวไซร้ ท่านว่าสิทธิที่จะเลือกทำการอย่างใดนั้นตกอยู่แก่ฝ่ายลูกหนี้ เว้นแต่จะได้ตกลงกันกำหนดไว้เป็นอย่างอื่น"],["199","b2t1","หมวด ๑ วัตถุแห่งหนี้","","มาตรา ๑๙๙ การเลือกนั้นท่านให้ทำด้วยแสดงเจตนาแก่คู่กรณีอีกฝ่ายหนึ่ง\nการชำระหนี้ได้เลือกทำเป็นอย่างใดแล้ว ท่านให้ถือว่าอย่างนั้นอย่างเดียวเป็นการชำระหนี้อันกำหนดให้กระทำแต่ต้นมา"],["200","b2t1","หมวด ๑ วัตถุแห่งหนี้","","มาตรา ๒๐๐ ถ้าจะต้องเลือกภายในระยะเวลาอันมีกำหนด และฝ่ายที่มีสิทธิจะเลือก มิได้เลือกภายในระยะเวลานั้นไซร้ ท่านว่าสิทธิที่จะเลือกนั้นย่อมตกไปอยู่แก่อีกฝ่ายหนึ่ง\nถ้ามิได้กำหนดระยะเวลาให้เลือกไซร้ เมื่อหนี้ถึงกำหนดชำระ ฝ่ายที่ไม่มีสิทธิจะเลือกอาจกำหนดเวลาพอสมควรแก่เหตุ แล้วบอกกล่าวให้ฝ่ายโน้นใช้สิทธิเลือกภายในเวลาอันนั้น"],["201","b2t1","หมวด ๑ วัตถุแห่งหนี้","","มาตรา ๒๐๑ ถ้าบุคคลภายนอกจะพึงเป็นผู้เลือก ท่านให้กระทำด้วยแสดงเจตนาแก่ลูกหนี้ และลูกหนี้จะต้องแจ้งความนั้นแก่เจ้าหนี้\nถ้าบุคคลภายนอกนั้นไม่อาจจะเลือกได้ก็ดี หรือไม่เต็มใจจะเลือกก็ดี ท่านว่าสิทธิที่จะเลือกตกไปอยู่แก่ฝ่ายลูกหนี้"],["202","b2t1","หมวด ๑ วัตถุแห่งหนี้","","มาตรา ๒๐๒ ถ้าการอันจะพึงต้องทำเพื่อชำระหนี้นั้นมีหลายอย่าง และอย่างใดอย่างหนึ่งตกเป็นอันพ้นวิสัยจะทำได้มาแต่ต้นก็ดี หรือกลายเป็นพ้นวิสัยในภายหลังก็ดี ท่านให้จำกัดหนี้นั้นไว้เพียงการชำระหนี้อย่างอื่นที่ไม่พ้นวิสัย อนึ่ง การจำกัดอันนี้ย่อมไม่เกิดมีขึ้น หากว่าการชำระหนี้กลายเป็นพ้นวิสัยเพราะพฤติการณ์อันใดอันหนึ่งซึ่งฝ่ายที่ไม่มีสิทธิจะเลือกนั้นต้องรับผิดชอบ"],["203","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๐๓ ถ้าเวลาอันจะพึงชำระหนี้นั้นมิได้กำหนดลงไว้ หรือจะอนุมานจากพฤติการณ์ทั้งปวงก็ไม่ได้ไซร้ ท่านว่าเจ้าหนี้ย่อมจะเรียกให้ชำระหนี้ได้โดยพลัน และฝ่ายลูกหนี้ก็ย่อมจะชำระหนี้ของตนได้โดยพลันดุจกัน\nถ้าได้กำหนดเวลาไว้ แต่หากกรณีเป็นที่สงสัย ท่านให้สันนิษฐานไว้ก่อนว่าเจ้าหนี้จะเรียกให้ชำระหนี้ก่อนถึงเวลานั้นหาได้ไม่ แต่ฝ่ายลูกหนี้จะชำระหนี้ก่อนกำหนดนั้นก็ได้"],["204","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๐๔ ถ้าหนี้ถึงกำหนดชำระแล้ว และภายหลังแต่นั้นเจ้าหนี้ได้ให้คำเตือนลูกหนี้แล้ว ลูกหนี้ยังไม่ชำระหนี้ไซร้ ลูกหนี้ได้ชื่อว่าผิดนัดเพราะเขาเตือนแล้ว\nถ้าได้กำหนดเวลาชำระหนี้ไว้ตามวันแห่งปฏิทิน และลูกหนี้มิได้ชำระหนี้ตามกำหนดไซร้ ท่านว่าลูกหนี้ตกเป็นผู้ผิดนัดโดยมิพักต้องเตือนเลย วิธีเดียวกันนี้ท่านให้ใช้บังคับแก่กรณีที่ต้องบอกกล่าวล่วงหน้าก่อนการชำระหนี้ ซึ่งได้กำหนดเวลาลงไว้อาจคำนวณนับได้โดยปฏิทินนับแต่วันที่ได้บอกกล่าว"],["205","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๐๕ ตราบใดการชำระหนี้นั้นยังมิได้กระทำลงเพราะพฤติการณ์อันใดอันหนึ่งซึ่งลูกหนี้ไม่ต้องรับผิดชอบ ตราบนั้นลูกหนี้ยังหาได้ชื่อว่าผิดนัดไม่"],["206","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๐๖ ในกรณีหนี้อันเกิดแต่มูลละเมิด ลูกหนี้ได้ชื่อว่าผิดนัดมาแต่เวลาที่ทำละเมิด"],["207","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๐๗ ถ้าลูกหนี้ขอปฏิบัติการชำระหนี้ และเจ้าหนี้ไม่รับชำระหนี้นั้นโดยปราศจากมูลเหตุอันจะอ้างกฎหมายได้ไซร้ ท่านว่าเจ้าหนี้ตกเป็นผู้ผิดนัด"],["208","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๐๘ การชำระหนี้จะให้สำเร็จผลเป็นอย่างใด ลูกหนี้จะต้องขอปฏิบัติการชำระหนี้ต่อเจ้าหนี้เป็นอย่างนั้นโดยตรง\nแต่ถ้าเจ้าหนี้ได้แสดงแก่ลูกหนี้ว่า จะไม่รับชำระหนี้ก็ดี หรือเพื่อที่จะชำระหนี้จำเป็นที่เจ้าหนี้จะต้องกระทำการอย่างใดอย่างหนึ่งก่อนก็ดี ลูกหนี้จะบอกกล่าวแก่เจ้าหนี้ว่า ได้เตรียมการที่จะชำระหนี้ไว้พร้อมเสร็จแล้ว ให้เจ้าหนี้รับชำระหนี้นั้นเท่านี้ก็นับว่าเป็นการเพียงพอแล้ว ในกรณีเช่นนี้ท่านว่าคำบอกกล่าวของลูกหนี้นั้นก็เสมอกับคำขอปฏิบัติการชำระหนี้"],["209","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๐๙ ถ้าได้กำหนดเวลาไว้เป็นแน่นอนเพื่อให้เจ้าหนี้กระทำการอันใด ท่านว่าที่จะขอปฏิบัติการชำระหนี้นั้น จะต้องทำก็แต่เมื่อเจ้าหนี้ทำการอันนั้นภายในเวลากำหนด"],["210","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๑๐ ถ้าลูกหนี้จำต้องชำระหนี้ส่วนของตนต่อเมื่อเจ้าหนี้ชำระหนี้ตอบแทนด้วยไซร้ แม้ถึงว่าเจ้าหนี้จะได้เตรียมพร้อมที่จะรับชำระหนี้ตามที่ลูกหนี้ขอปฏิบัตินั้นแล้วก็ดี หากไม่เสนอที่จะทำการชำระหนี้ตอบแทนตามที่จะพึงต้องทำ เจ้าหนี้ก็เป็นอันได้ชื่อว่าผิดนัด"],["211","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๑๑ ในเวลาที่ลูกหนี้ขอปฏิบัติการชำระหนี้นั้นก็ดี หรือในเวลาที่กำหนดไว้ให้เจ้าหนี้ทำการอย่างใดอย่างหนึ่ง โดยกรณีที่บัญญัติไว้ในมาตรา ๒๐๙ นั้นก็ดี ถ้าลูกหนี้มิได้อยู่ในฐานะที่จะสามารถชำระหนี้ได้ไซร้ ท่านว่าเจ้าหนี้ยังหาผิดนัดไม่"],["212","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๑๒ ถ้ามิได้กำหนดเวลาชำระหนี้ไว้ก็ดี หรือถ้าลูกหนี้มีสิทธิที่จะชำระหนี้ได้ก่อนเวลากำหนดก็ดี การที่เจ้าหนี้มีเหตุขัดข้องชั่วคราวไม่อาจรับชำระหนี้ที่เขาขอปฏิบัติแก่ตนได้นั้น หาทำให้เจ้าหนี้ตกเป็นผู้ผิดนัดไม่ เว้นแต่ลูกหนี้จะได้บอกกล่าวการชำระหนี้ไว้ล่วงหน้าโดยเวลาอันสมควร"],["213","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๑๓ ถ้าลูกหนี้ละเลยเสียไม่ชำระหนี้ของตน เจ้าหนี้จะร้องขอต่อศาลให้สั่งบังคับชำระหนี้ก็ได้ เว้นแต่สภาพแห่งหนี้จะไม่เปิดช่องให้ทำเช่นนั้นได้\nเมื่อสภาพแห่งหนี้ไม่เปิดช่องให้บังคับชำระหนี้ได้ ถ้าวัตถุแห่งหนี้เป็นอันให้กระทำการอันหนึ่งอันใด เจ้าหนี้จะร้องขอต่อศาลให้สั่งบังคับให้บุคคลภายนอกกระทำการอันนั้นโดยให้ลูกหนี้เสียค่าใช้จ่ายให้ก็ได้ แต่ถ้าวัตถุแห่งหนี้เป็นอันให้กระทำนิติกรรมอย่างใดอย่างหนึ่งไซร้ ศาลจะสั่งให้ถือเอาตามคำพิพากษาแทนการแสดงเจตนาของลูกหนี้ก็ได้\nส่วนหนี้ซึ่งมีวัตถุเป็นอันจะให้งดเว้นการอันใด เจ้าหนี้จะเรียกร้องให้รื้อถอนการที่ได้กระทำลงแล้วนั้นโดยให้ลูกหนี้เสียค่าใช้จ่าย และให้จัดการอันควรเพื่อกาลภายหน้าด้วยก็ได้\nอนึ่ง บทบัญญัติในวรรคทั้งหลายที่กล่าวมาก่อนนี้ หากระทบกระทั่งถึงสิทธิที่จะเรียกเอาค่าเสียหายไม่"],["214","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๑๔ ภายใต้บังคับบทบัญญัติแห่งมาตรา ๗๓๓ เจ้าหนี้มีสิทธิที่จะให้ชำระหนี้ของตนจากทรัพย์สินของลูกหนี้จนสิ้นเชิง รวมทั้งเงินและทรัพย์สินอื่น ๆ\nซึ่งบุคคลภายนอกค้างชำระแก่ลูกหนี้ด้วย"],["215","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๑๕ เมื่อลูกหนี้ไม่ชำระหนี้ให้ต้องตามความประสงค์อันแท้จริงแห่งมูลหนี้ไซร้ เจ้าหนี้จะเรียกเอาค่าสินไหมทดแทนเพื่อความเสียหายอันเกิดแต่การนั้นก็ได้"],["216","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๑๖ ถ้าโดยเหตุผิดนัด การชำระหนี้กลายเป็นอันไร้ประโยชน์แก่เจ้าหนี้ เจ้าหนี้จะบอกปัดไม่รับชำระหนี้ และจะเรียกเอาค่าสินไหมทดแทนเพื่อการไม่ชำระหนี้ก็ได้"],["217","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๑๗ ลูกหนี้จะต้องรับผิดชอบในความเสียหายบรรดาที่เกิดแต่ความประมาทเลินเล่อในระหว่างเวลาที่ตนผิดนัด ทั้งจะต้องรับผิดชอบในการที่การชำระหนี้กลายเป็นพ้นวิสัยเพราะอุบัติเหตุอันเกิดขึ้นในระหว่างเวลาที่ผิดนัดนั้นด้วย เว้นแต่ความเสียหายนั้น ถึงแม้ว่าตนจะได้ชำระหนี้ทันเวลากำหนดก็คงจะต้องเกิดมีอยู่นั่นเอง"],["218","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๑๘ ถ้าการชำระหนี้กลายเป็นพ้นวิสัยจะทำได้ เพราะพฤติการณ์อันใดอันหนึ่งซึ่งลูกหนี้ต้องรับผิดชอบไซร้ ท่านว่าลูกหนี้จะต้องใช้ค่าสินไหมทดแทนให้แก่เจ้าหนี้เพื่อค่าเสียหายอย่างใด ๆ อันเกิดแต่การไม่ชำระหนี้นั้น\nในกรณีที่การชำระหนี้กลายเป็นพ้นวิสัยแต่เพียงบางส่วน ถ้าหากว่าส่วนที่ยังเป็นวิสัยจะทำได้นั้นจะเป็นอันไร้ประโยชน์แก่เจ้าหนี้แล้ว เจ้าหนี้จะไม่ยอมรับชำระหนี้ส่วนที่ยังเป็นวิสัยจะทำได้นั้นแล้ว และเรียกค่าสินไหมทดแทนเพื่อการไม่ชำระหนี้เสียทั้งหมดทีเดียวก็ได้"],["219","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๑๙ ถ้าการชำระหนี้กลายเป็นพ้นวิสัยเพราะพฤติการณ์อันใดอันหนึ่งซึ่งเกิดขึ้นภายหลังที่ได้ก่อหนี้ และซึ่งลูกหนี้ไม่ต้องรับผิดชอบนั้นไซร้ ท่านว่าลูกหนี้เป็นอันหลุดพ้นจากการชำระหนี้นั้น\nถ้าภายหลังที่ได้ก่อหนี้ขึ้นแล้วนั้น ลูกหนี้กลายเป็นคนไม่สามารถจะชำระหนี้ได้ไซร้ ท่านให้ถือเสมือนว่าเป็นพฤติการณ์ที่ทำให้การชำระหนี้ตกเป็นอันพ้นวิสัยฉะนั้น"],["220","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๒๐ ลูกหนี้ต้องรับผิดชอบในความผิดของตัวแทนแห่งตนกับทั้งของบุคคลที่ตนใช้ในการชำระหนี้นั้นโดยขนาดเสมอกับว่าเป็นความผิดของตนเองฉะนั้น แต่บทบัญญัติแห่งมาตรา ๓๗๓ หาใช้บังคับแก่กรณีเช่นนี้ด้วยไม่"],["221","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๒๑ หนี้เงินอันต้องเสียดอกเบี้ยนั้น ท่านว่าจะคิดดอกเบี้ยในระหว่างที่เจ้าหนี้ผิดนัดหาได้ไม่"],["222","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๒๒ การเรียกเอาค่าเสียหายนั้น ได้แก่เรียกค่าสินไหมทดแทนเพื่อความเสียหายเช่นที่ตามปกติย่อมเกิดขึ้นแต่การไม่ชำระหนี้นั้น\nเจ้าหนี้จะเรียกค่าสินไหมทดแทนได้ แม้กระทั่งเพื่อความเสียหายอันเกิดแต่พฤติการณ์พิเศษ หากว่าคู่กรณีที่เกี่ยวข้องได้คาดเห็นหรือควรจะได้คาดเห็นพฤติการณ์เช่นนั้นล่วงหน้าก่อนแล้ว"],["223","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๒๓ ถ้าฝ่ายผู้เสียหายได้มีส่วนทำความผิดอย่างใดอย่างหนึ่งก่อให้เกิดความเสียหายด้วยไซร้ ท่านว่าหนี้อันจะต้องใช้ค่าสินไหมทดแทนแก่ฝ่ายผู้เสียหายมากน้อยเพียงใดนั้น ต้องอาศัยพฤติการณ์เป็นประมาณ ข้อสำคัญก็คือว่าความเสียหายนั้นได้เกิดขึ้นเพราะฝ่ายไหนเป็นผู้ก่อยิ่งหย่อนกว่ากันเพียงไร\nวิธีเดียวกันนี้ท่านให้ใช้แม้ทั้งที่ความผิดของฝ่ายผู้ที่เสียหายจะมีแต่เพียงละเลยไม่เตือนลูกหนี้ให้รู้สึกถึงอันตรายแห่งการเสียหายอันเป็นอย่างร้ายแรงผิดปกติ ซึ่งลูกหนี้ไม่รู้หรือไม่อาจจะรู้ได้ หรือเพียงแต่ละเลยไม่บำบัดปัดป้อง หรือบรรเทาความเสียหายนั้นด้วย อนึ่ง บทบัญญัติแห่งมาตรา ๒๒๐ นั้นท่านให้นำมาใช้บังคับด้วยโดยอนุโลม"],["224","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๒๔ หนี้เงินนั้น ให้คิดดอกเบี้ยในระหว่างเวลาผิดนัดในอัตราที่กำหนดตามมาตรา ๗ บวกด้วยอัตราเพิ่มร้อยละสองต่อปี ถ้าเจ้าหนี้อาจจะเรียกดอกเบี้ยได้สูงกว่านั้นโดยอาศัยเหตุอย่างอื่นอันชอบด้วยกฎหมาย ก็ให้คงส่งดอกเบี้ยต่อไปตามนั้น\nห้ามมิให้คิดดอกเบี้ยซ้อนดอกเบี้ยในระหว่างผิดนัด\nการพิสูจน์ค่าเสียหายอย่างอื่นนอกจากนั้น ให้พิสูจน์ได้"],["224/1","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๒๔/๑ ถ้าลูกหนี้มีหน้าที่ผ่อนชำระหนี้เงินเป็นงวด และลูกหนี้ผิดนัดไม่ชำระหนี้ในงวดใด เจ้าหนี้อาจเรียกดอกเบี้ยในระหว่างเวลาผิดนัดได้เฉพาะจากต้นเงินของงวดที่ลูกหนี้ผิดนัดนั้น\nข้อตกลงใดขัดกับความในวรรคหนึ่ง ข้อตกลงนั้นเป็นโมฆะ"],["225","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๑ การไม่ชำระหนี้","มาตรา ๒๒๕ ถ้าลูกหนี้จำต้องใช้ค่าสินไหมทดแทนเพื่อราคาวัตถุอันได้เสื่อมเสียไประหว่างผิดนัดก็ดี หรือวัตถุอันไม่อาจส่งมอบได้เพราะเหตุอย่างใดอย่างหนึ่งอันเกิดขึ้นระหว่างผิดนัดก็ดี ท่านว่าเจ้าหนี้จะเรียกดอกเบี้ยในจำนวนที่จะต้องใช้เป็นค่าสินไหมทดแทนคิดตั้งแต่เวลาอันเป็นฐานที่ตั้งแห่งการกะประมาณราคานั้นก็ได้ วิธีเดียวกันนี้ท่านให้ใช้ตลอดถึงการที่ลูกหนี้จำต้องใช้ค่าสินไหมทดแทนเพื่อการที่ราคาวัตถุตกต่ำ เพราะวัตถุนั้นเสื่อมเสียลงในระหว่างเวลาที่ผิดนัดนั้นด้วย"],["226","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๒ รับช่วงสิทธิ","มาตรา ๒๒๖ บุคคลผู้รับช่วงสิทธิของเจ้าหนี้ ชอบที่จะใช้สิทธิทั้งหลายบรรดาที่เจ้าหนี้มีอยู่โดยมูลหนี้ รวมทั้งประกันแห่งหนี้นั้นได้ในนามของตนเอง\nช่วงทรัพย์ ได้แก่เอาทรัพย์สินอันหนึ่งเข้าแทนที่ทรัพย์สินอีกอันหนึ่ง ในฐานะนิตินัยอย่างเดียวกันกับทรัพย์สินอันก่อน"],["227","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๒ รับช่วงสิทธิ","มาตรา ๒๒๗ เมื่อเจ้าหนี้ได้รับค่าสินไหมทดแทนความเสียหายเต็มตามราคาทรัพย์หรือสิทธิซึ่งเป็นวัตถุแห่งหนี้นั้นแล้ว ท่านว่าลูกหนี้ย่อมเข้าสู่ฐานะเป็นผู้รับช่วงสิทธิของเจ้าหนี้อันเกี่ยวกับทรัพย์หรือสิทธินั้น ๆ ด้วยอำนาจกฎหมาย"],["228","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๒ รับช่วงสิทธิ","มาตรา ๒๒๘ ถ้าพฤติการณ์ซึ่งทำให้การชำระหนี้เป็นอันพ้นวิสัยนั้น เป็นผลให้ลูกหนี้ได้มาซึ่งของแทนก็ดี หรือได้สิทธิเรียกร้องค่าสินไหมทดแทนเพื่อทรัพย์อันจะพึงได้แก่ตนนั้นก็ดี ท่านว่าเจ้าหนี้จะเรียกให้ส่งมอบของแทนที่ได้รับไว้ หรือจะเข้าเรียกเอาค่าสินไหมทดแทนเสียเองก็ได้\nถ้าเจ้าหนี้มีสิทธิเรียกร้องค่าสินไหมทดแทนเพราะการไม่ชำระหนี้ และถ้าใช้สิทธินั้นดังได้ระบุไว้ในวรรคต้นไซร้ ค่าสินไหมทดแทนอันจะพึงใช้แก่เจ้าหนี้นั้นย่อมลดจำนวนลงเพียงเสมอราคาแห่งของแทนซึ่งลูกหนี้ได้รับไว้ หรือเสมอจำนวนค่าสินไหมทดแทนที่ลูกหนี้จะเรียกร้องได้นั้น"],["229","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๒ รับช่วงสิทธิ","มาตรา ๒๒๙ การรับช่วงสิทธิย่อมมีขึ้นด้วยอำนาจกฎหมายและย่อมสำเร็จเป็นประโยชน์แก่บุคคลดังจะกล่าวต่อไปนี้ คือ\n(๑) บุคคลซึ่งเป็นเจ้าหนี้อยู่เอง และมาใช้หนี้ให้แก่เจ้าหนี้อีกคนหนึ่งผู้มีสิทธิจะได้รับใช้หนี้ก่อนตน เพราะเขามีบุริมสิทธิ หรือมีสิทธิจำนำจำนอง\n(๒) บุคคลผู้ได้ไปซึ่งอสังหาริมทรัพย์ใด และเอาเงินราคาค่าซื้อใช้ให้แก่ผู้รับจำนองทรัพย์นั้นเสร็จไป\n(๓) บุคคลผู้มีความผูกพันร่วมกับผู้อื่น หรือเพื่อผู้อื่นในอันจะต้องใช้หนี้ มีส่วนได้เสียด้วยในการใช้หนี้นั้น และเข้าใช้หนี้นั้น"],["230","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๒ รับช่วงสิทธิ","มาตรา ๒๓๐ ถ้าในการที่เจ้าหนี้นำบังคับยึดทรัพย์อันหนึ่งอันใดของลูกหนี้นั้น บุคคลผู้ใดจะต้องเสี่ยงภัยเสียสิทธิในทรัพย์อันนั้นเพราะการบังคับยึดทรัพย์ไซร้ ท่านว่าบุคคลผู้นั้นมีสิทธิจะเข้าใช้หนี้เสียแทนได้ อนึ่ง ผู้ครองทรัพย์อันหนึ่งอันใด ถ้าจะต้องเสี่ยงภัยเสียสิทธิครองทรัพย์นั้นไปเพราะการบังคับยึดทรัพย์ ก็ย่อมมีสิทธิจะทำได้เช่นเดียวกับที่ว่ามานั้น\nถ้าบุคคลภายนอกผู้ใดมาใช้หนี้แทนจนเป็นที่พอใจของเจ้าหนี้แล้ว บุคคลผู้นั้นย่อมเข้ารับช่วงสิทธิเรียกร้องของเจ้าหนี้ แต่สิทธิเรียกร้องอันนี้จะบังคับให้เป็นที่เสื่อมเสียแก่เจ้าหนี้หาได้ไม่"],["231","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๒ รับช่วงสิทธิ","มาตรา ๒๓๑ ถ้าทรัพย์สินที่จำนอง จำนำ หรืออยู่ในบังคับบุริมสิทธิประการอื่นนั้น เป็นทรัพย์อันได้เอาประกันภัยไว้ไซร้ ท่านว่าสิทธิจำนอง จำนำ หรือบุริมสิทธิอย่างอื่นนั้นย่อมครอบไปถึงสิทธิที่จะเรียกร้องเอาแก่ผู้รับประกันภัยด้วย\nในกรณีที่เป็นอสังหาริมทรัพย์ ถ้าผู้รับประกันภัยได้รู้ หรือควรจะได้รู้ว่ามีจำนอง หรือบุริมสิทธิอย่างอื่นไซร้ ท่านยังมิให้ผู้รับประกันภัยใช้เงินให้แก่ผู้เอาประกันภัย จนกว่าจะได้บอกกล่าวเจตนาเช่นนั้นไปยังผู้รับจำนอง หรือเจ้าหนี้มีบุริมสิทธิคนอื่นแล้ว และมิได้รับคำคัดค้านการที่จะใช้เงินนั้นมาภายในเดือนหนึ่งนับแต่วันบอกกล่าว แต่สิทธิอย่างใด ๆ ที่ได้ไปจดทะเบียน ณ หอทะเบียนที่ดินนั้น ท่านให้ถือว่าเป็นอันรู้ถึงผู้รับประกันภัย วิธีเดียวกันนี้ท่านให้ใช้ตลอดถึงการจำนองสังหาริมทรัพย์ที่กฎหมายอนุญาตให้ทำได้นั้นด้วย\nในกรณีที่เป็นสังหาริมทรัพย์ ผู้รับประกันภัยจะใช้เงินให้แก่ผู้เอาประกันภัยโดยตรงก็ได้ เว้นแต่ตนจะได้รู้หรือควรจะได้รู้ว่าทรัพย์นั้นตกอยู่ในบังคับจำนำ หรือบุริมสิทธิอย่างอื่น\nผู้รับประกันภัยไม่ต้องรับผิดต่อเจ้าหนี้ ถ้าทรัพย์สินอันได้เอาประกันภัยไว้นั้นได้คืนมา หรือได้จัดของแทนให้\nวิธีเดียวกันนี้ท่านให้อนุโลมใช้บังคับแก่กรณีบังคับซื้อกับทั้งกรณีที่ต้องใช้ค่าเสียหายอันควรจะได้แก่เจ้าของทรัพย์สิน เพราะเหตุทรัพย์สินทำลายหรือบุบสลายนั้นด้วย"],["232","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๒ รับช่วงสิทธิ","มาตรา ๒๓๒ ถ้าตามความในมาตราก่อนนี้เป็นอันว่าจะเอาเงินจำนวนหนึ่งให้แทนทรัพย์สินที่ทำลายหรือบุบสลายไซร้ เงินจำนวนนี้ท่านยังมิให้ส่งมอบแก่ผู้รับจำนอง ผู้รับจำนำ หรือเจ้าหนี้มีบุริมสิทธิคนอื่น ก่อนที่หนี้ซึ่งได้เอาทรัพย์นี้เป็นประกันไว้นั้นจะถึงกำหนด และถ้าคู่กรณีไม่สามารถจะตกลงกับลูกหนี้ได้ไซร้ ท่านว่าต่างฝ่ายต่างมีสิทธิที่จะเรียกร้องให้นำเงินจำนวนนั้นไปวางไว้ ณ สำนักงานวางทรัพย์เพื่อประโยชน์อันร่วมกัน เว้นแต่ลูกหนี้จะหาประกันให้ไว้ตามสมควร"],["233","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๓ การใช้สิทธิเรียกร้องของลูกหนี้","มาตรา ๒๓๓ ถ้าลูกหนี้ขัดขืนไม่ยอมใช้สิทธิเรียกร้องหรือเพิกเฉยเสียไม่ใช้สิทธิเรียกร้อง เป็นเหตุให้เจ้าหนี้ต้องเสียประโยชน์ไซร้ ท่านว่าเจ้าหนี้จะใช้สิทธิเรียกร้องนั้นในนามของตนเองแทนลูกหนี้เพื่อป้องกันสิทธิของตนในมูลหนี้นั้นก็ได้ เว้นแต่ในข้อที่เป็นการของลูกหนี้ส่วนตัวโดยแท้"],["234","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๓ การใช้สิทธิเรียกร้องของลูกหนี้","มาตรา ๒๓๔ เจ้าหนี้ผู้ใช้สิทธิเรียกร้องของลูกหนี้นั้นจะต้องขอหมายเรียกลูกหนี้มาในคดีนั้นด้วย"],["235","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๓ การใช้สิทธิเรียกร้องของลูกหนี้","มาตรา ๒๓๕ เจ้าหนี้จะใช้สิทธิเรียกร้องของลูกหนี้เรียกเงินเต็มจำนวนที่ยังค้างชำระแก่ลูกหนี้ โดยไม่ต้องคำนึงถึงจำนวนที่ค้างชำระแก่ตนก็ได้ ถ้าจำเลยยอมใช้เงินเพียงเท่าจำนวนที่ลูกหนี้เดิมค้างชำระแก่เจ้าหนี้นั้น คดีก็เป็นเสร็จกันไป แต่ถ้าลูกหนี้เดิมได้เข้าชื่อเป็นโจทก์ด้วย ลูกหนี้เดิมจะขอให้ศาลพิจารณาพิพากษาต่อไปในส่วนจำนวนเงินที่ยังเหลือติดค้างอยู่ก็ได้\nแต่อย่างไรก็ดี ท่านมิให้เจ้าหนี้ได้รับมากไปกว่าจำนวนที่ค้างชำระแก่ตนนั้นเลย"],["236","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๓ การใช้สิทธิเรียกร้องของลูกหนี้","มาตรา ๒๓๖ จำเลยมีข้อต่อสู้ลูกหนี้เดิมอยู่อย่างใด ๆ ท่านว่าจะยกขึ้นต่อสู้เจ้าหนี้ได้ทั้งนั้น เว้นแต่ข้อต่อสู้ซึ่งเกิดขึ้นเมื่อยื่นฟ้องแล้ว"],["237","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๔ เพิกถอนการฉ้อฉล","มาตรา ๒๓๗ เจ้าหนี้ชอบที่จะร้องขอให้ศาลเพิกถอนเสียได้ซึ่งนิติกรรมใด ๆ อันลูกหนี้ได้กระทำลงทั้งรู้อยู่ว่าจะเป็นทางให้เจ้าหนี้เสียเปรียบ แต่ความข้อนี้ท่านมิให้ใช้บังคับ ถ้าปรากฏว่าในขณะที่ทำนิติกรรมนั้น บุคคลซึ่งเป็นผู้ได้ลาภงอกแต่การนั้นมิได้รู้เท่าถึงข้อความจริงอันเป็นทางให้เจ้าหนี้ต้องเสียเปรียบนั้นด้วย แต่หากกรณีเป็นการทำให้โดยเสน่หา ท่านว่าเพียงแต่ลูกหนี้เป็นผู้รู้ฝ่ายเดียวเท่านั้นก็พอแล้วที่จะขอเพิกถอนได้\nบทบัญญัติดังกล่าวมาในวรรคก่อนนี้ ท่านมิให้ใช้บังคับแก่นิติกรรมใดอันมิได้มีวัตถุเป็นสิทธิในทรัพย์สิน"],["238","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๔ เพิกถอนการฉ้อฉล","มาตรา ๒๓๘ การเพิกถอนดังกล่าวมาในบทมาตราก่อนนั้นไม่อาจกระทบกระทั่งถึงสิทธิของบุคคลภายนอกอันได้มาโดยสุจริตก่อนเริ่มฟ้องคดีขอเพิกถอน\nอนึ่ง ความที่กล่าวมาในวรรคก่อนนี้ ท่านมิให้ใช้บังคับ ถ้าสิทธินั้นได้มาโดยเสน่หา"],["239","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๔ เพิกถอนการฉ้อฉล","มาตรา ๒๓๙ การเพิกถอนนั้นย่อมได้เป็นประโยชน์แก่เจ้าหนี้หมดทุกคน"],["240","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๔ เพิกถอนการฉ้อฉล","มาตรา ๒๔๐ การเรียกร้องขอเพิกถอนนั้น ท่านห้ามมิให้ฟ้องร้องเมื่อพ้นปีหนึ่งนับแต่เวลาที่เจ้าหนี้ได้รู้ต้นเหตุอันเป็นมูลให้เพิกถอน หรือพ้นสิบปีนับแต่ได้ทำนิติกรรมนั้น"],["241","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๕ สิทธิยึดหน่วง","มาตรา ๒๔๑ ผู้ใดเป็นผู้ครองทรัพย์สินของผู้อื่น และมีหนี้อันเป็นคุณประโยชน์แก่ตนเกี่ยวด้วยทรัพย์สินซึ่งครองนั้นไซร้ ท่านว่าผู้นั้นจะยึดหน่วงทรัพย์สินนั้นไว้จนกว่าจะได้ชำระหนี้ก็ได้ แต่ความที่กล่าวนี้ท่านมิให้ใช้บังคับ เมื่อหนี้นั้นยังไม่ถึงกำหนด\nอนึ่ง บทบัญญัติในวรรคก่อนนี้ ท่านมิให้ใช้บังคับ ถ้าการที่เข้าครอบครองนั้นเริ่มมาแต่ทำการอันใดอันหนึ่งซึ่งไม่ชอบด้วยกฎหมาย"],["242","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๕ สิทธิยึดหน่วง","มาตรา ๒๔๒ สิทธิยึดหน่วงอันใด ถ้าไม่สมกับลักษณะที่เจ้าหนี้รับภาระในมูลหนี้ก็ดี ไม่สมกับคำสั่งอันลูกหนี้ได้ให้ไว้ก่อนหรือให้ในเวลาที่ส่งมอบทรัพย์สินนั้นก็ดี หรือเป็นการขัดกับความสงบเรียบร้อยของประชาชนก็ดี สิทธิยึดหน่วงเช่นนั้นท่านให้ถือว่าหามีไม่เลย"],["243","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๕ สิทธิยึดหน่วง","มาตรา ๒๔๓ ในกรณีที่ลูกหนี้เป็นคนสินล้นพ้นตัวไม่สามารถใช้หนี้ เจ้าหนี้มีสิทธิจะยึดหน่วงทรัพย์สินไว้ได้ แม้ทั้งที่ยังไม่ถึงกำหนดเรียกร้อง ถ้าการที่ลูกหนี้ไม่สามารถใช้หนี้นั้นได้เกิดเป็นขึ้นหรือรู้ถึงเจ้าหนี้ต่อภายหลังเวลาที่ได้ส่งมอบทรัพย์สินไซร้ ถึงแม้ว่าจะไม่สมกับลักษณะที่เจ้าหนี้รับภาระในมูลหนี้ไว้เดิม หรือไม่สมกับคำสั่งอันลูกหนี้ได้ให้ไว้ก็ดี เจ้าหนี้ก็อาจจะใช้สิทธิยึดหน่วงได้"],["244","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๕ สิทธิยึดหน่วง","มาตรา ๒๔๔ ผู้ทรงสิทธิยึดหน่วงจะใช้สิทธิของตนแก่ทรัพย์สินทั้งหมดที่ยึดหน่วงไว้นั้นจนกว่าจะชำระหนี้สิ้นเชิงก็ได้"],["245","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๕ สิทธิยึดหน่วง","มาตรา ๒๔๕ ผู้ทรงสิทธิยึดหน่วงจะเก็บดอกผลแห่งทรัพย์สินที่ยึดหน่วงไว้ และจัดสรรเอาไว้เพื่อการชำระหนี้แก่ตนก่อนเจ้าหนี้คนอื่นก็ได้\nดอกผลเช่นว่านี้จะต้องจัดสรรเอาชำระดอกเบี้ยแห่งหนี้นั้นก่อน ถ้ายังมีเหลือจึงให้จัดสรรใช้ต้นเงิน"],["246","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๕ สิทธิยึดหน่วง","มาตรา ๒๔๖ ผู้ทรงสิทธิยึดหน่วงจำต้องจัดการดูแลรักษาทรัพย์สินที่ยึดหน่วงไว้นั้นตามสมควร เช่นจะพึงคาดหมายได้จากบุคคลในฐานะเช่นนั้น\nอนึ่ง ทรัพย์สินซึ่งยึดหน่วงไว้นั้น ถ้ามิได้รับความยินยอมของลูกหนี้ ท่านว่าผู้ทรงสิทธิยึดหน่วงหาอาจจะใช้สอยหรือให้เช่า หรือเอาไปทำเป็นหลักประกันได้ไม่ แต่ความที่กล่าวนี้ท่านมิให้ใช้บังคับไปถึงการใช้สอยเช่นที่จำเป็นเพื่อจะรักษาทรัพย์สินนั้นเอง\nถ้าผู้ทรงสิทธิยึดหน่วงกระทำการฝ่าฝืนบทบัญญัติใดที่กล่าวมานี้ ท่านว่าลูกหนี้จะเรียกร้องให้ระงับสิทธินั้นเสียก็ได้"],["247","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๕ สิทธิยึดหน่วง","มาตรา ๒๔๗ ถ้าผู้ทรงสิทธิยึดหน่วงต้องเสียค่าใช้จ่ายไปตามที่จำเป็นเกี่ยวด้วยทรัพย์สินอันตนยึดหน่วงไว้นั้นเพียงใด จะเรียกให้เจ้าทรัพย์ชดใช้ให้ก็ได้"],["248","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๕ สิทธิยึดหน่วง","มาตรา ๒๔๘ ภายในบังคับแห่งบทบัญญัติมาตรา ๑๙๓/๒๗ การใช้สิทธิยึดหน่วงหาทำให้อายุความแห่งหนี้สะดุดหยุดลงไม่"],["249","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๕ สิทธิยึดหน่วง","มาตรา ๒๔๙ ลูกหนี้จะเรียกร้องให้ระงับสิทธิยึดหน่วงด้วยหาประกันให้ไว้ตามสมควรก็ได้"],["250","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๕ สิทธิยึดหน่วง","มาตรา ๒๕๐ การครองทรัพย์สินสูญสิ้นไป สิทธิยึดหน่วงก็เป็นอันระงับสิ้นไปด้วย แต่ความที่กล่าวนี้ท่านมิให้ใช้บังคับแก่กรณีที่ทรัพย์สินอันยึดหน่วงไว้นั้นได้ให้เช่าไปหรือจำนำไว้ด้วยความยินยอมของลูกหนี้"],["251","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๕๑ ผู้ทรงบุริมสิทธิย่อมทรงไว้ซึ่งสิทธิเหนือทรัพย์สินของลูกหนี้ในการที่จะได้รับชำระหนี้อันค้างชำระแก่ตนจากทรัพย์สินนั้นก่อนเจ้าหนี้อื่น ๆ โดยนัยดังบัญญัติไว้ในประมวลกฎหมายนี้ หรือบทกฎหมายอื่น"],["252","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๕๒ บทบัญญัติแห่งมาตรา ๒๔๔ นั้นท่านให้ใช้บังคับตลอดถึงบุริมสิทธิด้วยตามแต่กรณี"],["253","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๕๓ ถ้าหนี้มีอยู่เป็นคุณแก่บุคคลผู้ใดในมูลอย่างหนึ่งอย่างใดดังจะกล่าวต่อไปนี้ บุคคลผู้นั้นย่อมมีบุริมสิทธิเหนือทรัพย์สินทั้งหมดของลูกหนี้ คือ\n(๑) ค่าใช้จ่ายเพื่อประโยชน์อันร่วมกัน\n(๒) ค่าปลงศพ\n(๓) ค่าภาษีอากร และเงินที่ลูกจ้างมีสิทธิได้รับเพื่อการงานที่ได้ทำให้แก่ลูกหนี้ซึ่งเป็นนายจ้าง\n(๔) ค่าเครื่องอุปโภคบริโภคอันจำเป็นประจำวัน"],["254","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๕๔ บุริมสิทธิในมูลค่าใช้จ่ายเพื่อประโยชน์อันร่วมกันนั้น ใช้สำหรับเอาค่าใช้จ่ายอันได้เสียไปเพื่อประโยชน์ของเจ้าหนี้หมดทุกคนร่วมกัน เกี่ยวด้วยการรักษา การชำระบัญชี หรือการเฉลี่ยทรัพย์สินของลูกหนี้\nถ้าค่าใช้จ่ายนั้นมิได้เสียไปเพื่อประโยชน์ของเจ้าหนี้หมดทุกคนไซร้ บุริมสิทธิย่อมจะใช้ได้แต่เฉพาะต่อเจ้าหนี้ผู้ที่ได้รับประโยชน์จากการนั้น"],["255","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๕๕ บุริมสิทธิในมูลค่าปลงศพนั้น ใช้สำหรับเอาค่าใช้จ่ายในการปลงศพตามควรแก่ฐานานุรูปของลูกหนี้"],["256","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๕๖ บุริมสิทธิในมูลค่าภาษีอากรนั้น ใช้สำหรับเอาบรรดาค่าภาษีอากรในที่ดิน ทรัพย์สิน หรือค่าภาษีอากรอย่างอื่นที่ลูกหนี้ยังค้างชำระอยู่ในปีปัจจุบันและก่อนนั้นขึ้นไปอีกปีหนึ่ง"],["257","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๕๗ บุริมสิทธิในเงินที่ลูกจ้างมีสิทธิได้รับเพื่อการงานที่ได้ทำให้แก่ลูกหนี้ซึ่งเป็นนายจ้างนั้น ให้ใช้สำหรับค่าจ้าง ค่าล่วงเวลา ค่าทำงานในวันหยุด ค่าล่วงเวลาในวันหยุด ค่าชดเชย ค่าชดเชยพิเศษ และเงินอื่นใดที่ลูกจ้างมีสิทธิได้รับเพื่อการงานที่ได้ทำให้ นับถอยหลังขึ้นไปสี่เดือนแต่รวมกันแล้วต้องไม่เกินหนึ่งแสนบาทต่อลูกจ้างคนหนึ่ง"],["258","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๕๘ บุริมสิทธิในมูลค่าเครื่องอุปโภคบริโภคอันจำเป็นประจำวันนั้น ใช้สำหรับเอาค่าเครื่องอุปโภคบริโภค ซึ่งยังค้างชำระอยู่นับถอยหลังขึ้นไปหกเดือน เช่น ค่าอาหาร เครื่องดื่ม โคมไฟ ฟืน ถ่าน อันจำเป็นเพื่อการทรงชีพของลูกหนี้ และบุคคลในสกุลซึ่งอยู่กับลูกหนี้และซึ่งลูกหนี้จำต้องอุปการะ กับทั้งคนใช้ของลูกหนี้ด้วย"],["259","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๕๙ ถ้าหนี้มีอยู่เป็นคุณแก่บุคคลผู้ใดในมูลอย่างหนึ่งอย่างใดดังจะกล่าวต่อไปนี้ บุคคลผู้นั้นย่อมมีบุริมสิทธิเหนือสังหาริมทรัพย์เฉพาะอย่างของลูกหนี้ คือ\n(๑) เช่าอสังหาริมทรัพย์\n(๒) พักอาศัยในโรงแรม\n(๓) รับขนคนโดยสาร หรือของ\n(๔) รักษาสังหาริมทรัพย์\n(๕) ซื้อขายสังหาริมทรัพย์\n(๖) ค่าเมล็ดพันธุ์ ไม้พันธุ์ หรือปุ๋ย\n(๗) ค่าแรงงานกสิกรรม หรืออุตสาหกรรม"],["260","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๖๐ บุริมสิทธิในมูลเช่าอสังหาริมทรัพย์นั้น ใช้สำหรับเอาค่าเช่าอสังหาริมทรัพย์และหนี้อย่างอื่นของผู้เช่าอันเกิดจากความเกี่ยวพันในเรื่องเช่า และมีอยู่เหนือสังหาริมทรัพย์ของผู้เช่าซึ่งอยู่ในหรือบนอสังหาริมทรัพย์นั้น"],["261","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๖๑ บุริมสิทธิของผู้ให้เช่าที่ดินนั้นมีอยู่เหนือสังหาริมทรัพย์ทั้งหลายอันผู้เช่าได้นำเข้ามาไว้บนที่ดินที่ให้เช่า หรือนำเข้ามาไว้ในเรือนโรงอันใช้ประกอบกับที่ดินนั้น และมีอยู่เหนือสังหาริมทรัพย์เช่นสำหรับที่ใช้ในที่ดินนั้น กับทั้งเหนือดอกผลอันเกิดจากที่ดินซึ่งอยู่ในครอบครองของผู้เช่านั้นด้วย\nบุริมสิทธิของผู้ให้เช่าเรือนโรงย่อมมีอยู่เหนือสังหาริมทรัพย์ ซึ่งผู้เช่านำเข้ามาไว้ในเรือนโรงนั้นด้วย"],["262","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๖๒ ถ้าการเช่าอสังหาริมทรัพย์ได้โอนไปก็ดี หรือได้ให้เช่าช่วงก็ดี บุริมสิทธิของผู้ให้เช่าเดิมย่อมครอบไปถึงสังหาริมทรัพย์ซึ่งผู้รับโอน หรือผู้เช่าช่วงได้นำเข้ามาไว้ในทรัพย์สินนั้นด้วย ความที่กล่าวนี้ท่านให้ใช้ได้ตลอดถึงเงินอันผู้โอน หรือผู้ให้เช่าช่วงจะพึงได้รับจากผู้รับโอนหรือผู้เช่าช่วงนั้นด้วย"],["263","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๖๓ ในกรณีที่ผู้เช่าต้องชำระบัญชีเฉลี่ยทรัพย์สินทั่วไปนั้น บุริมสิทธิของผู้ให้เช่าย่อมมีอยู่แต่เฉพาะสำหรับเอาใช้ค่าเช่าและหนี้อย่างอื่นเท่าที่มีในระยะกำหนดส่งค่าเช่าเพียงสามระยะ คือปัจจุบันระยะหนึ่ง ก่อนนั้นขึ้นไประยะหนึ่ง และต่อไปภายหน้าอีกระยะหนึ่งเท่านั้น และใช้สำหรับเอาค่าเสียหายซึ่งเกิดขึ้นในระยะกำหนดส่งค่าเช่าปัจจุบันและก่อนนั้นขึ้นไปอีกระยะหนึ่งด้วย"],["264","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๖๔ ในการเรียกร้องของผู้ให้เช่า ถ้าผู้ให้เช่าได้รับเงินประกันไว้ ผู้ให้เช่าย่อมมีบุริมสิทธิแต่เพียงในส่วนที่ไม่มีเงินประกัน"],["265","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๖๕ บุริมสิทธิในมูลพักอาศัยในโรงแรมนั้น ใช้สำหรับเอาเงินบรรดาที่ค้างชำระแก่เจ้าสำนักเพื่อการพักอาศัยและการอื่น ๆ อันได้จัดให้สำเร็จความปรารถนาแก่คนเดินทาง หรือแขกอาศัย รวมทั้งการชดใช้เงินทั้งหลายที่ได้ออกแทนไปและมีอยู่เหนือเครื่องเดินทาง หรือทรัพย์สินอย่างอื่นของคนเดินทาง หรือแขกอาศัยอันเอาไว้ในโรงแรม โฮเต็ล หรือสถานที่เช่นนั้น"],["266","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๖๖ ผู้ให้เช่าอสังหาริมทรัพย์ หรือเจ้าสำนักโรงแรม โฮเต็ล หรือสถานที่เช่นนั้น จะใช้บุริมสิทธิของตนบังคับทำนองเดียวกับผู้รับจำนำก็ได้ บทบัญญัติทั้งหลายแห่งประมวลกฎหมายนี้ว่าด้วยการบังคับจำนำนั้น ท่านให้นำมาใช้บังคับด้วยโดยอนุโลม"],["267","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๖๗ บุริมสิทธิในมูลรับขนนั้น ใช้สำหรับเอาค่าระวางพาหนะในการรับขนคนโดยสารหรือของ กับทั้งค่าใช้จ่ายอันเป็นอุปกรณ์ และเป็นบุริมสิทธิมีอยู่เหนือของและเครื่องเดินทางทั้งหมดอันอยู่ในมือของผู้ขนส่ง"],["268","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๖๘ ในกรณีดังได้ปรารภไว้ในความแปดมาตราก่อนนี้นั้น ผู้ให้เช่าอสังหาริมทรัพย์ก็ดี เจ้าสำนักโรงแรมก็ดี หรือผู้ขนส่งก็ดี จะใช้บุริมสิทธิของตนเหนือสังหาริมทรัพย์อันเป็นของบุคคลภายนอกก็ได้ เว้นแต่ตนจะได้รู้ในเวลาอันควรรู้ได้ว่าทรัพย์สินเหล่านั้นเป็นของบุคคลภายนอก\nถ้าอสังหาริมทรัพย์นั้นถูกลักหรือสูญหาย ท่านให้บังคับตามบทกฎหมายว่าด้วยการแสวงคืนครองทรัพย์"],["269","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๖๙ บุริมสิทธิในมูลรักษาสังหาริมทรัพย์นั้น ใช้สำหรับเอาค่าใช้จ่ายเพื่อรักษาสังหาริมทรัพย์ และมีอยู่เหนือสังหาริมทรัพย์อันนั้น\nอนึ่ง บุริมสิทธินี้ยังใช้สำหรับเอาค่าใช้จ่ายที่จำเป็นอันได้เสียไปเพื่อที่จะสงวนสิทธิ หรือรับสภาพสิทธิ หรือบังคับสิทธิ อันเกี่ยวด้วยสังหาริมทรัพย์นั้นอีกด้วย"],["270","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๗๐ บุริมสิทธิในมูลซื้อขายสังหาริมทรัพย์นั้น ใช้สำหรับเอาราคาซื้อขายและดอกเบี้ยในราคานั้น และมีอยู่เหนือสังหาริมทรัพย์อันนั้น"],["271","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๗๑ บุริมสิทธิในมูลค่าเมล็ดพันธุ์ ไม้พันธุ์ หรือปุ๋ยนั้น ใช้สำหรับเอาราคาค่าเมล็ดพันธุ์ ไม้พันธุ์ หรือปุ๋ย และดอกเบี้ยในราคานั้น และมีอยู่เหนือดอกผลอันเกิดงอกในที่ดินเพราะใช้สิ่งเหล่านั้นภายในปีหนึ่งนับแต่เวลาที่ใช้"],["272","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๗๒ บุริมสิทธิในมูลค่าแรงงานเพื่อกสิกรรมและอุตสาหกรรมนั้น ในส่วนบุคคลที่ได้ทำการงานกสิกรรม ใช้สำหรับเอาค่าจ้างนับถอยหลังขึ้นไปปีหนึ่ง และในส่วนบุคคลที่ได้ทำการงานอุตสาหกรรม ใช้สำหรับเอาค่าจ้างนับถอยหลังขึ้นไปสามเดือน และเป็นบุริมสิทธิมีอยู่เหนือดอกผลหรือสิ่งของที่ประดิษฐ์ขึ้นอันเกิดแต่แรงงานของบุคคลนั้น ๆ"],["273","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๗๓ ถ้าหนี้มีอยู่เป็นคุณแก่บุคคลผู้ใดในมูลอย่างหนึ่งอย่างใดดังจะกล่าวต่อไปนี้ บุคคลผู้นั้นย่อมมีบุริมสิทธิเหนืออสังหาริมทรัพย์เฉพาะอย่างของลูกหนี้ คือ\n(๑) รักษาอสังหาริมทรัพย์\n(๒) จ้างทำของเป็นการงานทำขึ้นบนอสังหาริมทรัพย์\n(๓) ซื้อขายอสังหาริมทรัพย์"],["274","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๗๔ บุริมสิทธิในมูลรักษาอสังหาริมทรัพย์นั้น ใช้สำหรับเอาค่าใช้จ่ายเพื่อรักษาอสังหาริมทรัพย์ และมีอยู่เหนืออสังหาริมทรัพย์อันนั้น\nอนึ่ง บทบัญญัติแห่งมาตรา ๒๖๙ วรรคสองนั้น ท่านให้นำมาใช้บังคับแก่กรณีที่กล่าวมาในวรรคก่อนนี้ด้วย"],["275","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๗๕ บุริมสิทธิในมูลจ้างทำของเป็นการงานทำขึ้นบนอสังหาริมทรัพย์นั้น ใช้สำหรับเอาสินจ้าง ค่าทำของเป็นการงานอันผู้ก่อสร้าง สถาปนิก หรือผู้รับจ้างได้ทำลงบนอสังหาริมทรัพย์ของลูกหนี้ และมีอยู่เหนืออสังหาริมทรัพย์อันนั้น\nอนึ่ง บุริมสิทธินี้ย่อมเกิดมีขึ้นต่อเมื่ออสังหาริมทรัพย์นั้นมีราคาเพิ่มขึ้นในปัจจุบันเพราะการที่ได้ทำขึ้นนั้น และมีอยู่เพียงเหนือราคาที่เพิ่มขึ้นเท่านั้น"],["276","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๗๖ บุริมสิทธิในมูลซื้อขายอสังหาริมทรัพย์นั้น ใช้สำหรับเอาราคาอสังหาริมทรัพย์และดอกเบี้ยในราคานั้นและมีอยู่เหนืออสังหาริมทรัพย์อันนั้น"],["277","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๗๗ เมื่อมีบุริมสิทธิสามัญหลายรายแย้งกัน ท่านให้ถือว่าบุริมสิทธิทั้งหลายนั้นมีลำดับที่จะให้ผลก่อนหลังดังที่ได้เรียงลำดับไว้ในมาตรา ๒๕๓\nเมื่อมีบุริมสิทธิสามัญแย้งกับบุริมสิทธิพิเศษ ท่านว่าบุริมสิทธิพิเศษย่อมอยู่ในลำดับก่อน แต่บุริมสิทธิในมูลค่าใช้จ่ายเพื่อประโยชน์ร่วมกันนั้นย่อมอยู่ในลำดับก่อนในฐานที่จะใช้สิทธินั้นต่อเจ้าหนี้ผู้ได้รับประโยชน์จากการนั้นหมดทุกคนด้วยกัน"],["278","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๗๘ เมื่อมีบุริมสิทธิแย้งกันหลายรายเหนือสังหาริมทรัพย์อันหนึ่งอันเดียวกัน ท่านให้ถือลำดับก่อนหลังดังที่เรียงไว้ต่อไปนี้ คือ\n(๑) บุริมสิทธิในมูลเช่าอสังหาริมทรัพย์ พักอาศัยในโรงแรมและรับขน\n(๒) บุริมสิทธิในมูลรักษาสังหาริมทรัพย์ แต่ถ้ามีบุคคลหลายคนเป็นผู้รักษา ท่านว่าผู้ที่รักษาภายหลังอยู่ในลำดับก่อนผู้ที่ได้รักษามาก่อน\n(๓) บุริมสิทธิในมูลซื้อขายสังหาริมทรัพย์ ค่าเมล็ดพันธุ์ ไม้พันธุ์ หรือปุ๋ย และค่าแรงงานกสิกรรมและอุตสาหกรรม\nถ้าบุคคลผู้ใดมีบุริมสิทธิอยู่ในลำดับเป็นที่หนึ่ง และรู้อยู่ในขณะที่ตนได้ประโยชน์แห่งหนี้มานั้น ว่ายังมีบุคคลอื่นซึ่งมีบุริมสิทธิอยู่ในลำดับที่สองหรือที่สามไซร้ ท่านห้ามมิให้บุคคลผู้นั้นใช้สิทธิในการที่ตนอยู่ในลำดับก่อนนั้นต่อบุคคลอื่นเช่นว่ามา และท่านห้ามมิให้ใช้สิทธินี้ต่อผู้ที่ได้รักษาทรัพย์ไว้เพื่อประโยชน์แก่บุคคลผู้มีบุริมสิทธิในลำดับที่หนึ่งนั้นเองด้วย\nในส่วนดอกผล ท่านให้บุคคลผู้ได้ทำการงานกสิกรรมอยู่ในลำดับที่หนึ่ง ผู้ส่งเมล็ดพันธุ์ ไม้พันธุ์ หรือปุ๋ย อยู่ในลำดับที่สอง และให้ผู้เช่าที่ดิน อยู่ในลำดับที่สาม"],["279","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๗๙ เมื่อมีบุริมสิทธิพิเศษแย้งกันหลายรายเหนืออสังหาริมทรัพย์อันหนึ่งอันเดียวกัน ท่านให้ถือลำดับก่อนหลังดังที่ได้เรียงลำดับไว้ในมาตรา ๒๗๓\nถ้าได้ซื้อขายอสังหาริมทรัพย์นั้นสืบต่อกันไปอีกไซร้ ลำดับก่อนหลังในระหว่างผู้ขายด้วยกันนั้น ท่านให้เป็นไปตามลำดับที่ได้ซื้อขายก่อนและหลัง"],["280","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๘๐ เมื่อบุคคลหลายคนมีบุริมสิทธิในลำดับเสมอกันเหนือทรัพย์อันหนึ่งอันเดียวกัน ท่านให้ต่างคนต่างได้รับชำระหนี้เฉลี่ยตามส่วนมากน้อยแห่งจำนวนที่ตนเป็นเจ้าหนี้"],["281","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๘๑ บุริมสิทธิอันมีอยู่เหนือสังหาริมทรัพย์นั้น ท่านห้ามมิให้ใช้ เมื่อบุคคลภายนอกได้ทรัพย์นั้นจากลูกหนี้และได้ส่งมอบทรัพย์ให้กันไปเสร็จแล้ว"],["282","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๘๒ เมื่อมีบุริมสิทธิแย้งกับสิทธิจำนำสังหาริมทรัพย์ ท่านว่าผู้รับจำนำย่อมมีสิทธิเป็นอย่างเดียวกันกับผู้ทรงบุริมสิทธิในลำดับที่หนึ่งดังที่เรียงไว้ในมาตรา ๒๗๘ นั้น"],["283","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๘๓ บุคคลผู้มีบุริมสิทธิสามัญต้องรับชำระหนี้เอาจากสังหาริมทรัพย์ของลูกหนี้ก่อน ต่อเมื่อยังไม่พอจึงให้เอาชำระหนี้จากอสังหาริมทรัพย์ได้\nในส่วนอสังหาริมทรัพย์นั้น ก็ต้องรับชำระหนี้เอาจากอสังหาริมทรัพย์ อันมิได้ตกอยู่ในฐานเป็นหลักประกันพิเศษเสียก่อน\nถ้าบุคคลใดมีบุริมสิทธิสามัญและละเลยด้วยความประมาทเลินเล่อไม่สอดเข้าแย้งขัดในการแบ่งเฉลี่ยทรัพย์ตามความที่กล่าวมาในวรรคทั้งสองข้างบนนี้ไซร้ อันบุคคลนั้นจะใช้บุริมสิทธิของตนต่อบุคคลภายนอกผู้ได้จดทะเบียนสิทธิไว้แล้ว เพื่อจะเอาใช้จนถึงขนาดเช่นที่ตนจะหากได้รับเพราะได้สอดเข้าแย้งขัดนั้น ท่านว่าหาอาจจะใช้ได้ไม่\nอนึ่ง บทบัญญัติที่กล่าวมาในวรรคทั้งสามข้างต้นนี้ท่านมิให้ใช้บังคับ หากว่าเงินที่ขายอสังหาริมทรัพย์ได้นั้นจะพึงต้องเอามาแบ่งเฉลี่ยก่อนเงินที่ขายทรัพย์สินอย่างอื่นก็ดี หรือหากว่าเงินที่ขายอสังหาริมทรัพย์อันตกอยู่ในฐานเป็นหลักประกันพิเศษนั้นจะพึงต้องเอามาแบ่งเฉลี่ยก่อนเงินที่ขายอสังหาริมทรัพย์อย่างอื่นก็ดุจกัน"],["284","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๘๔ บุริมสิทธิสามัญนั้น ถึงแม้จะมิได้ไปลงทะเบียนเกี่ยวด้วยอสังหาริมทรัพย์ก็ดี ย่อมจะยกขึ้นเป็นข้อต่อสู้เจ้าหนี้ใด ๆ ที่ไม่มีหลักประกันพิเศษนั้นได้ แต่ความที่กล่าวนี้ท่านมิให้ใช้ไปถึงการต่อสู้บุคคลภายนอกผู้ได้ไปลงทะเบียนสิทธิไว้"],["285","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๘๕ บุริมสิทธิในมูลรักษาอสังหาริมทรัพย์นั้น ถ้าหากว่าเมื่อทำการเพื่อบำรุงรักษานั้นสำเร็จแล้ว ไปบอกลงทะเบียนไว้โดยพลันไซร้ บุริมสิทธิก็คงให้ผลต่อไป"],["286","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๘๖ บุริมสิทธิในมูลจ้างทำของเป็นการงานทำขึ้นบนอสังหาริมทรัพย์นั้น หากทำรายการประมาณราคาชั่วคราวไปบอกลงทะเบียนไว้ก่อนเริ่มลงมือทำการไซร้ บุริมสิทธิก็คงให้ผลต่อไป แต่ถ้าราคาที่ทำจริงนั้นล้ำราคาที่ได้ประมาณไว้ชั่วคราว ท่านว่าบุริมสิทธิในส่วนจำนวนที่ล้ำอยู่นั้นหามีไม่\nส่วนการที่จะวินิจฉัยว่าอสังหาริมทรัพย์นั้นมีราคาเพิ่มขึ้นเพราะการอันได้ทำขึ้นบนอสังหาริมทรัพย์มากน้อยเพียงใดนั้น ท่านให้ศาลตั้งแต่งผู้เชี่ยวชาญขึ้นเป็นผู้กะประมาณ ในเวลาที่มีแย้งขัดในการแบ่งเฉลี่ย"],["287","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๘๗ บุริมสิทธิใดได้ไปจดลงทะเบียนแล้วตามบทบัญญัติแห่งมาตราทั้งสองข้างบนนี้ บุริมสิทธินั้นท่านว่าอาจจะใช้ได้ก่อนสิทธิจำนอง"],["288","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๘๘ บุริมสิทธิในมูลซื้อขายอสังหาริมทรัพย์นั้น หากว่าเมื่อไปลงทะเบียนสัญญาซื้อขายนั้น บอกลงทะเบียนไว้ด้วยว่าราคาหรือดอกเบี้ยในราคานั้นยังมิได้ชำระไซร้ บุริมสิทธินั้นก็คงให้ผลต่อไป"],["289","b2t1","หมวด ๒ ผลแห่งหนี้","ส่วนที่ ๖ บุริมสิทธิ","มาตรา ๒๘๙ ว่าถึงผลแห่งบุริมสิทธิ นอกจากที่ได้บัญญัติไว้ในมาตรา ๒๘๑ ถึงมาตรา ๒๘๘ นี้แล้ว ท่านให้นำบทบัญญัติทั้งหลายแห่งลักษณะจำนองมาใช้บังคับด้วยตามแต่กรณี"],["290","b2t1","หมวด ๓ ลูกหนี้และเจ้าหนี้หลายคน","","มาตรา ๒๙๐ ถ้าการชำระหนี้เป็นการอันจะแบ่งกันชำระได้ และมีบุคคลหลายคนเป็นลูกหนี้ก็ดี มีบุคคลหลายคนเป็นเจ้าหนี้ก็ดี เมื่อกรณีเป็นที่สงสัย ท่านว่าลูกหนี้แต่ละคนจะต้องรับผิดเพียงเป็นส่วนเท่า ๆ กัน และเจ้าหนี้แต่ละคนก็ชอบที่จะได้รับแต่เพียงเป็นส่วนเท่า ๆ กัน"],["291","b2t1","หมวด ๓ ลูกหนี้และเจ้าหนี้หลายคน","","มาตรา ๒๙๑ ถ้าบุคคลหลายคนจะต้องทำการชำระหนี้โดยทำนองซึ่งแต่ละคนจำต้องชำระหนี้สิ้นเชิงไซร้ แม้ถึงว่าเจ้าหนี้ชอบที่จะได้รับชำระหนี้สิ้นเชิงได้แต่เพียงครั้งเดียว (กล่าวคือลูกหนี้ร่วมกัน) ก็ดี เจ้าหนี้จะเรียกชำระหนี้จากลูกหนี้แต่คนใดคนหนึ่งสิ้นเชิงหรือแต่โดยส่วนก็ได้ตามแต่จะเลือก แต่ลูกหนี้ทั้งปวงก็ยังคงต้องผูกพันอยู่ทั่วทุกคนจนกว่าหนี้นั้นจะได้ชำระเสร็จสิ้นเชิง"],["292","b2t1","หมวด ๓ ลูกหนี้และเจ้าหนี้หลายคน","","มาตรา ๒๙๒ การที่ลูกหนี้ร่วมกันคนหนึ่งชำระหนี้นั้น ย่อมได้เป็นประโยชน์แก่ลูกหนี้คนอื่น ๆ ด้วย วิธีเดียวกันนี้ท่านให้ใช้บังคับแก่การใด ๆ อันพึงกระทำแทนชำระหนี้ วางทรัพย์สินแทนชำระหนี้ และหักกลบลบหนี้ด้วย\nลูกหนี้ร่วมกันคนหนึ่งมีสิทธิเรียกร้องอย่างไร ลูกหนี้คนอื่น ๆ จะเอาสิทธิอันนั้นไปใช้หักกลบลบหนี้หาได้ไม่"],["293","b2t1","หมวด ๓ ลูกหนี้และเจ้าหนี้หลายคน","","มาตรา ๒๙๓ การปลดหนี้ให้แก่ลูกหนี้ร่วมกันคนหนึ่งนั้น ย่อมเป็นไปเพื่อประโยชน์แก่ลูกหนี้คนอื่น ๆ เพียงเท่าส่วนของลูกหนี้ที่ได้ปลดให้ เว้นแต่จะได้ตกลงกันเป็นอย่างอื่น"],["294","b2t1","หมวด ๓ ลูกหนี้และเจ้าหนี้หลายคน","","มาตรา ๒๙๔ การที่เจ้าหนี้ผิดนัดต่อลูกหนี้ร่วมกันคนหนึ่งนั้น ย่อมได้เป็นคุณประโยชน์แก่ลูกหนี้คนอื่น ๆ ด้วย"],["295","b2t1","หมวด ๓ ลูกหนี้และเจ้าหนี้หลายคน","","มาตรา ๒๙๕ ข้อความจริงอื่นใด นอกจากที่ระบุไว้ในมาตรา ๒๙๒ ถึงมาตรา ๒๙๔ นั้น เมื่อเป็นเรื่องเท้าถึงตัวลูกหนี้ร่วมกันคนใดก็ย่อมเป็นไปเพื่อคุณและโทษแต่เฉพาะแก่ลูกหนี้คนนั้น เว้นแต่จะปรากฏว่าขัดกับสภาพแห่งหนี้นั้นเอง\nความที่ว่ามานี้ เมื่อจะกล่าวโดยเฉพาะก็คือว่าให้ใช้แก่การให้คำบอกกล่าว การผิดนัด การที่หยิบยกอ้างความผิด การชำระหนี้อันเป็นพ้นวิสัยแก่ฝ่ายลูกหนี้ร่วมกันคนหนึ่ง กำหนดอายุความหรือการที่อายุความสะดุดหยุดลง และการที่สิทธิเรียกร้องเกลื่อนกลืนกันไปกับหนี้สิน"],["296","b2t1","หมวด ๓ ลูกหนี้และเจ้าหนี้หลายคน","","มาตรา ๒๙๖ ในระหว่างลูกหนี้ร่วมกันทั้งหลายนั้น ท่านว่าต่างคนต่างต้องรับผิดเป็นส่วนเท่า ๆ กัน เว้นแต่จะได้กำหนดไว้เป็นอย่างอื่น ถ้าส่วนที่ลูกหนี้ร่วมกันคนใดคนหนึ่งจะพึงชำระนั้น เป็นอันจะเรียกเอาจากคนนั้นไม่ได้ไซร้ ยังขาดจำนวนอยู่เท่าไรลูกหนี้คนอื่น ๆ ซึ่งจำต้องออกส่วนด้วยนั้นก็ต้องรับใช้ แต่ถ้าลูกหนี้ร่วมกันคนใดเจ้าหนี้ได้ปลดให้หลุดพ้นจากหนี้อันร่วมกันนั้นแล้ว ส่วนที่ลูกหนี้คนนั้นจะพึงต้องชำระหนี้ก็ตกเป็นพับแก่เจ้าหนี้ไป"],["297","b2t1","หมวด ๓ ลูกหนี้และเจ้าหนี้หลายคน","","มาตรา ๒๙๗ ถ้าในสัญญาอันหนึ่งอันใดมีบุคคลหลายคนร่วมกันผูกพันตนในอันจะทำการชำระหนี้ไซร้ หากกรณีเป็นที่สงสัย ท่านว่าบุคคลเหล่านั้นจะต้องรับผิดเช่นอย่างเป็นลูกหนี้ร่วมกัน แม้ถึงว่าเป็นการอันจะแบ่งกันชำระหนี้ได้"],["298","b2t1","หมวด ๓ ลูกหนี้และเจ้าหนี้หลายคน","","มาตรา ๒๙๘ ถ้าบุคคลหลายคนมีสิทธิเรียกร้องการชำระหนี้โดยทำนองซึ่งแต่ละคนอาจจะเรียกให้ชำระหนี้สิ้นเชิงได้ไซร้ แม้ถึงว่าลูกหนี้จำต้องชำระหนี้สิ้นเชิงแต่เพียงครั้งเดียว (กล่าวคือเจ้าหนี้ร่วมกัน) ก็ดี ท่านว่าลูกหนี้จะชำระหนี้ให้แก่เจ้าหนี้แต่คนใดคนหนึ่งก็ได้ตามแต่จะเลือก ความข้อนี้ให้ใช้บังคับได้ แม้ทั้งที่เจ้าหนี้คนหนึ่งจะได้ยื่นฟ้องเรียกชำระหนี้ไว้แล้ว"],["299","b2t1","หมวด ๓ ลูกหนี้และเจ้าหนี้หลายคน","","มาตรา ๒๙๙ การที่เจ้าหนี้ร่วมกันคนหนึ่งผิดนัดนั้น ย่อมเป็นโทษแก่เจ้าหนี้คนอื่น ๆ ด้วย\nถ้าสิทธิเรียกร้องและหนี้สินนั้นเป็นอันเกลื่อนกลืนกันไปในเจ้าหนี้ร่วมกันคนหนึ่ง สิทธิของเจ้าหนี้คนอื่น ๆ อันมีต่อลูกหนี้ก็ย่อมเป็นอันระงับสิ้นไป\nนอกจากนี้ ท่านให้นำบทบัญญัติแห่งมาตรา ๒๙๒ มาตรา ๒๙๓ และมาตรา ๒๙๕ มาใช้บังคับด้วยโดยอนุโลม กล่าวโดยเฉพาะก็คือ แม้เจ้าหนี้ร่วมกันคนหนึ่งจะโอนสิทธิเรียกร้องให้แก่บุคคลอื่นไปก็หากระทบกระทั่งถึงสิทธิของเจ้าหนี้คนอื่น ๆ ด้วยไม่"],["300","b2t1","หมวด ๓ ลูกหนี้และเจ้าหนี้หลายคน","","มาตรา ๓๐๐ ในระหว่างเจ้าหนี้ร่วมกันนั้น ท่านว่าต่างคนชอบที่จะได้รับชำระหนี้เป็นส่วนเท่า ๆ กัน เว้นแต่จะได้กำหนดไว้เป็นอย่างอื่น"],["301","b2t1","หมวด ๓ ลูกหนี้และเจ้าหนี้หลายคน","","มาตรา ๓๐๑ ถ้าบุคคลหลายคนเป็นหนี้อันจะแบ่งกันชำระมิได้ ท่านว่าบุคคลเหล่านั้นต้องรับผิดเช่นอย่างลูกหนี้ร่วมกัน"],["302","b2t1","หมวด ๓ ลูกหนี้และเจ้าหนี้หลายคน","","มาตรา ๓๐๒ ถ้าการชำระหนี้เป็นการอันจะแบ่งกันชำระมิได้ และมีบุคคลหลายคนเป็นเจ้าหนี้ ถ้าบุคคลเหล่านั้นมิได้เป็นเจ้าหนี้ร่วมกันไซร้ ท่านว่าลูกหนี้ได้แต่จะชำระหนี้ให้ได้ประโยชน์แก่บุคคลเหล่านั้นทั้งหมดด้วยกัน และเจ้าหนี้แต่ละคนจะเรียกชำระหนี้ได้ก็แต่เพื่อได้ประโยชน์ด้วยกันหมดทุกคนเท่านั้น อนึ่ง เจ้าหนี้แต่ละคนจะเรียกให้ลูกหนี้วางทรัพย์ที่เป็นหนี้นั้นไว้เพื่อประโยชน์แห่งเจ้าหนี้หมดทุกคนด้วยกันก็ได้ หรือถ้าทรัพย์นั้นไม่ควรแก่การจะวางไว้ ก็ให้ส่งแก่ผู้พิทักษ์ทรัพย์ซึ่งศาลจะได้ตั้งแต่งขึ้น\nนอกจากนี้ ข้อความจริงใดที่เท้าถึงเจ้าหนี้คนหนึ่งเท่านั้น หาเป็นไปเพื่อคุณหรือโทษแก่เจ้าหนี้คนอื่น ๆ ด้วยไม่"],["303","b2t1","หมวด ๔ โอนสิทธิเรียกร้อง","","มาตรา ๓๐๓ สิทธิเรียกร้องนั้นท่านว่าจะพึงโอนกันได้ เว้นไว้แต่สภาพแห่งสิทธินั้นเองจะไม่เปิดช่องให้โอนกันได้\nความที่กล่าวมานี้ย่อมไม่ใช้บังคับ หากคู่กรณีได้แสดงเจตนาเป็นอย่างอื่น การแสดงเจตนาเช่นว่านี้ ท่านห้ามมิให้ยกขึ้นเป็นข้อต่อสู้บุคคลภายนอกผู้กระทำการโดยสุจริต"],["304","b2t1","หมวด ๔ โอนสิทธิเรียกร้อง","","มาตรา ๓๐๔ สิทธิเรียกร้องเช่นใด ตามกฎหมายศาลจะสั่งยึดไม่ได้ สิทธิเรียกร้องเช่นนั้น ท่านว่าจะโอนกันหาได้ไม่"],["305","b2t1","หมวด ๔ โอนสิทธิเรียกร้อง","","มาตรา ๓๐๕ เมื่อโอนสิทธิเรียกร้องไป สิทธิจำนอง จำนำ หรือหลักประกันทางธุรกิจที่มีอยู่เกี่ยวพันกับสิทธิเรียกร้องนั้นก็ดี สิทธิอันเกิดขึ้นแต่การค้ำประกันที่ให้ไว้เพื่อสิทธิเรียกร้องนั้นก็ดี ย่อมตกไปได้แก่ผู้รับโอนด้วย\nอนึ่ง ผู้รับโอนจะใช้บุริมสิทธิใด ๆ ที่ตนมีอยู่เกี่ยวด้วยสิทธิเรียกร้องในกรณีบังคับยึดทรัพย์หรือล้มละลายนั้นก็ได้"],["306","b2t1","หมวด ๔ โอนสิทธิเรียกร้อง","","มาตรา ๓๐๖ การโอนหนี้อันจะพึงต้องชำระแก่เจ้าหนี้คนหนึ่งโดยเฉพาะเจาะจงนั้น ถ้าไม่ทำเป็นหนังสือ ท่านว่าไม่สมบูรณ์ อนึ่ง การโอนหนี้นั้นท่านว่าจะยกขึ้นเป็นข้อต่อสู้ลูกหนี้หรือบุคคลภายนอกได้แต่เมื่อได้บอกกล่าวการโอนไปยังลูกหนี้ หรือลูกหนี้จะได้ยินยอมด้วยในการโอนนั้น คำบอกกล่าวหรือความยินยอมเช่นว่านี้ท่านว่าต้องทำเป็นหนังสือ\nถ้าลูกหนี้ทำให้พอแก่ใจผู้โอนด้วยการใช้เงิน หรือด้วยประการอื่นเสียแต่ก่อนได้รับบอกกล่าว หรือก่อนได้ตกลงให้โอนไซร้ ลูกหนี้นั้นก็เป็นอันหลุดพ้นจากหนี้"],["307","b2t1","หมวด ๔ โอนสิทธิเรียกร้อง","","มาตรา ๓๐๗ ถ้าพิพาทอ้างสิทธิในการโอนต่างราย โอนรายใดได้บอกกล่าวหรือตกลงกันก่อน โอนรายนั้นมีสิทธิดีกว่าโอนรายอื่น ๆ"],["308","b2t1","หมวด ๔ โอนสิทธิเรียกร้อง","","มาตรา ๓๐๘ ถ้าลูกหนี้ได้ให้ความยินยอมดังกล่าวมาในมาตรา ๓๐๖ โดยมิได้อิดเอื้อน ท่านว่าจะยกข้อต่อสู้ที่มีต่อผู้โอนขึ้นต่อสู้ผู้รับโอนนั้นหาได้ไม่ แต่ถ้าเพื่อจะระงับหนี้นั้น ลูกหนี้ได้ใช้เงินให้แก่ผู้โอนไปไซร้ ลูกหนี้จะเรียกคืนเงินนั้นก็ได้ หรือถ้าเพื่อการเช่นกล่าวมานั้นลูกหนี้รับภาระเป็นหนี้อย่างใดอย่างหนึ่งขึ้นใหม่ต่อผู้โอน จะถือเสมือนหนึ่งว่าหนี้นั้นมิได้ก่อขึ้นเลยก็ได้\nถ้าลูกหนี้เป็นแต่ได้รับคำบอกกล่าวการโอน ท่านว่าลูกหนี้มีข้อต่อสู้ผู้โอนก่อนเวลาที่ได้รับคำบอกกล่าวนั้นฉันใด ก็จะยกขึ้นเป็นข้อต่อสู้แก่ผู้รับโอนได้ฉันนั้น ถ้าลูกหนี้มีสิทธิเรียกร้องจากผู้โอน แต่สิทธินั้นยังไม่ถึงกำหนดในเวลาบอกกล่าวไซร้ ท่านว่าจะเอาสิทธิเรียกร้องนั้นมาหักกลบลบกันก็ได้ หากว่าสิทธินั้นจะได้ถึงกำหนดไม่ช้ากว่าเวลาถึงกำหนดแห่งสิทธิเรียกร้องอันได้โอนไปนั้น"],["309","b2t1","หมวด ๔ โอนสิทธิเรียกร้อง","","มาตรา ๓๐๙ การโอนหนี้อันพึงต้องชำระตามเขาสั่งนั้น ท่านว่าจะยกขึ้นเป็นข้อต่อสู้ลูกหนี้หรือบุคคลภายนอกคนอื่นได้ แต่เฉพาะเมื่อการโอนนั้นได้สลักหลังไว้ในตราสาร และตัวตราสารนั้นได้ส่งมอบให้แก่ผู้รับโอนไปด้วย"],["310","b2t1","หมวด ๔ โอนสิทธิเรียกร้อง","","มาตรา ๓๑๐ ในมูลหนี้อันพึงต้องชำระตามเขาสั่งนั้น ลูกหนี้มีสิทธิที่จะสอบสวนถึงตัวผู้ทรงตราสาร หรือสอบสวนความถูกต้องแท้จริงแห่งลายมือชื่อหรือดวงตราของผู้ทรงได้ แต่ก็หามีความผูกพันที่จะต้องทำถึงเพียงนั้นไม่ แต่ถ้าลูกหนี้ทำการโดยทุจริตหรือประมาทเลินเล่ออย่างร้ายแรงไซร้ การชำระหนี้นั้นก็ไม่เป็นอันสมบูรณ์"],["311","b2t1","หมวด ๔ โอนสิทธิเรียกร้อง","","มาตรา ๓๑๑ บทบัญญัติแห่งมาตราก่อนนี้ ท่านให้ใช้บังคับตลอดถึงกรณีที่มีกำหนดตัวเจ้าหนี้ระบุไว้ในตราสารซึ่งมีข้อความจดไว้ด้วยว่า ให้ชำระหนี้แก่ผู้ทรงตราสาร"],["312","b2t1","หมวด ๔ โอนสิทธิเรียกร้อง","","มาตรา ๓๑๒ ในมูลหนี้อันพึงต้องชำระตามเขาสั่งนั้น ลูกหนี้จะยกข้อต่อสู้ซึ่งมีต่อเจ้าหนี้เดิมขึ้นเป็นข้อต่อสู้ผู้รับโอนโดยสุจริตนั้นหาได้ไม่ เว้นแต่ที่ปรากฏในตัวตราสารนั้นเอง หรือที่มีขึ้นเป็นธรรมดาสืบจากลักษณะแห่งตราสารนั้น"],["313","b2t1","หมวด ๔ โอนสิทธิเรียกร้อง","","มาตรา ๓๑๓ บทบัญญัติแห่งมาตราก่อนนี้ ท่านให้ใช้บังคับตลอดถึงหนี้อันพึงต้องชำระแก่ผู้ถือนั้นด้วย แล้วแต่กรณี"],["314","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๑๔ อันการชำระหนี้นั้น ท่านว่าบุคคลภายนอกจะเป็นผู้ชำระก็ได้ เว้นแต่สภาพแห่งหนี้จะไม่เปิดช่องให้บุคคลภายนอกชำระ หรือจะขัดกับเจตนาอันคู่กรณีได้แสดงไว้\nบุคคลผู้ไม่มีส่วนได้เสียด้วยในการชำระหนี้นั้น จะเข้าชำระหนี้โดยขืนใจลูกหนี้หาได้ไม่"],["315","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๑๕ อันการชำระหนี้นั้นต้องทำให้แก่ตัวเจ้าหนี้หรือแก่บุคคลผู้มีอำนาจรับชำระหนี้แทนเจ้าหนี้ การชำระหนี้ทำให้แก่บุคคลผู้ไม่มีอำนาจรับชำระหนี้นั้น ถ้าเจ้าหนี้ให้สัตยาบันก็นับว่าสมบูรณ์"],["316","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๑๖ ถ้าการชำระหนี้นั้นได้ทำให้แก่ผู้ครองตามปรากฏแห่งสิทธิในมูลหนี้ ท่านว่าการชำระหนี้นั้นจะสมบูรณ์ก็แต่เมื่อบุคคลผู้ชำระหนี้ได้กระทำการโดยสุจริต"],["317","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๑๗ นอกจากกรณีที่กล่าวไว้ในมาตราก่อน การชำระหนี้แก่บุคคลผู้ไม่มีสิทธิจะได้รับนั้น ท่านว่าย่อมสมบูรณ์เพียงเท่าที่ตัวเจ้าหนี้ได้ลาภงอกขึ้นแต่การนั้น"],["318","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๑๘ บุคคลผู้ถือใบเสร็จเป็นสำคัญ ท่านนับว่าเป็นผู้มีสิทธิจะได้รับชำระหนี้ แต่ความที่กล่าวนี้ท่านมิให้ใช้ ถ้าบุคคลผู้ชำระหนี้รู้ว่าสิทธิเช่นนั้นหามีไม่ หรือไม่รู้เท่าถึงสิทธินั้น เพราะความประมาทเลินเล่อของตน"],["319","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๑๙ ถ้าศาลสั่งให้ลูกหนี้คนที่สามงดเว้นทำการชำระหนี้แล้ว ยังขืนชำระหนี้ให้แก่เจ้าหนี้ของตนเองไซร้ ท่านว่าเจ้าหนี้ผู้ที่ร้องขอให้ยึดทรัพย์จะเรียกให้ลูกหนี้คนที่สามนั้นทำการชำระหนี้อีกให้คุ้มกับความเสียหายอันตนได้รับก็ได้\nอนึ่ง ข้อความซึ่งกล่าวมาในวรรคข้างต้นนี้หาเป็นข้อขัดขวางในการที่ลูกหนี้คนที่สามจะใช้สิทธิไล่เบี้ยเอาแก่เจ้าหนี้ของตนเองนั้นไม่"],["320","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๒๐ อันจะบังคับให้เจ้าหนี้รับชำระหนี้แต่เพียงบางส่วน หรือให้รับชำระหนี้เป็นอย่างอื่นผิดไปจากที่จะต้องชำระแก่เจ้าหนี้นั้น ท่านว่าหาอาจจะบังคับได้ไม่"],["321","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๒๑ ถ้าเจ้าหนี้ยอมรับการชำระหนี้อย่างอื่นแทนการชำระหนี้ที่ได้ตกลงกันไว้ ท่านว่าหนี้นั้นก็เป็นอันระงับสิ้นไป\nถ้าเพื่อที่จะทำให้พอแก่ใจเจ้าหนี้นั้น ลูกหนี้รับภาระเป็นหนี้อย่างใดอย่างหนึ่งขึ้นใหม่ต่อเจ้าหนี้ไซร้ เมื่อกรณีเป็นที่สงสัย ท่านมิให้สันนิษฐานว่าลูกหนี้ได้ก่อหนี้นั้นขึ้นแทนการชำระหนี้\nถ้าชำระหนี้ด้วยออก ด้วยโอน หรือด้วยสลักหลังตั๋วเงิน หรือประทวนสินค้า ท่านว่าหนี้นั้นจะระงับสิ้นไปต่อเมื่อตั๋วเงิน หรือประทวนสินค้านั้นได้ใช้เงินแล้ว"],["322","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๒๒ ถ้าเอาทรัพย์ก็ดี สิทธิเรียกร้องจากบุคคลภายนอกก็ดี หรือสิทธิอย่างอื่นก็ดี ให้แทนการชำระหนี้ ท่านว่าลูกหนี้จะต้องรับผิด เพื่อชำรุดบกพร่องและเพื่อการรอนสิทธิทำนองเดียวกับผู้ขาย"],["323","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๒๓ ถ้าวัตถุแห่งหนี้เป็นอันให้ส่งมอบทรัพย์เฉพาะสิ่ง ท่านว่าบุคคลผู้ชำระหนี้จะต้องส่งมอบทรัพย์ตามสภาพที่เป็นอยู่ในเวลาที่จะพึงส่งมอบ\nลูกหนี้จำต้องรักษาทรัพย์นั้นไว้ด้วยความระมัดระวังเช่นอย่างวิญญูชนจะพึงสงวนทรัพย์สินของตนเอง จนกว่าจะได้ส่งมอบทรัพย์นั้น"],["324","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๒๔ เมื่อมิได้มีแสดงเจตนาไว้โดยเฉพาะเจาะจงว่าจะพึงชำระหนี้ ณ สถานที่ใดไซร้ หากจะต้องส่งมอบทรัพย์เฉพาะสิ่ง ท่านว่าต้องส่งมอบกัน ณ สถานที่ซึ่งทรัพย์นั้นได้อยู่ในเวลาเมื่อก่อให้เกิดหนี้นั้น ส่วนการชำระหนี้โดยประการอื่น ท่านว่าต้องชำระ ณ สถานที่ซึ่งเป็นภูมิลำเนาปัจจุบันของเจ้าหนี้"],["325","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๒๕ เมื่อมิได้มีแสดงเจตนาไว้ในข้อค่าใช้จ่ายในการชำระหนี้ ท่านว่าฝ่ายลูกหนี้พึงเป็นผู้ออกค่าใช้จ่าย แต่ถ้าค่าใช้จ่ายนั้นมีจำนวนเพิ่มขึ้นเพราะเจ้าหนี้ย้ายภูมิลำเนาก็ดี หรือเพราะการอื่นใดอันเจ้าหนี้ได้กระทำก็ดี ค่าใช้จ่ายเพิ่มขึ้นเท่าใดเจ้าหนี้ต้องเป็นผู้ออก"],["326","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๒๖ บุคคลผู้ชำระหนี้ชอบที่จะได้รับใบเสร็จเป็นสำคัญจากผู้รับชำระหนี้นั้น และถ้าหนี้นั้นได้ชำระสิ้นเชิงแล้ว ผู้ชำระหนี้ชอบที่จะได้รับเวนคืนเอกสารอันเป็นหลักฐานแห่งหนี้ หรือให้ขีดฆ่าเอกสารนั้นเสีย ถ้าและเอกสารนั้นสูญหาย บุคคลผู้ชำระหนี้ชอบที่จะให้จดแจ้งความข้อระงับหนี้ลงไว้ในใบเสร็จ หรือในเอกสารอีกฉบับหนึ่งต่างหากก็ได้\nถ้าหนี้นั้นได้ชำระแต่บางส่วนก็ดี หรือถ้าเอกสารนั้นยังให้สิทธิอย่างอื่นใดแก่เจ้าหนี้อยู่ก็ดี ท่านว่าลูกหนี้ชอบแต่ที่จะได้รับใบเสร็จไว้เป็นคู่มือ และให้จดแจ้งการชำระหนี้นั้นลงไว้ในเอกสาร"],["327","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๒๗ ในกรณีชำระดอกเบี้ย หรือชำระหนี้อย่างอื่นอันมีกำหนดชำระเป็นระยะเวลานั้น ถ้าเจ้าหนี้ออกใบเสร็จให้เพื่อระยะหนึ่งแล้วโดยมิได้อิดเอื้อน ท่านให้สันนิษฐานไว้ก่อนว่าเจ้าหนี้ได้รับชำระหนี้เพื่อระยะก่อน ๆ นั้นด้วยแล้ว\nถ้าเจ้าหนี้ออกใบเสร็จให้เพื่อการชำระต้นเงิน ท่านให้สันนิษฐานไว้ก่อนว่าเจ้าหนี้ได้รับดอกเบี้ยแล้ว\nถ้าเอกสารอันเป็นหลักฐานแห่งหนี้ได้เวนคืนแล้วไซร้ ท่านให้สันนิษฐานไว้ก่อนว่าหนี้นั้นเป็นอันระงับสิ้นไปแล้ว"],["328","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๒๘ ถ้าลูกหนี้ต้องผูกพันต่อเจ้าหนี้ในอันจะกระทำการเพื่อชำระหนี้เป็นการอย่างเดียวกันโดยมูลหนี้หลายราย และถ้าการที่ลูกหนี้ชำระหนี้นั้นไม่เพียงพอจะเปลื้องหนี้สินได้หมดทุกรายไซร้ เมื่อทำการชำระหนี้ ลูกหนี้ระบุว่าชำระหนี้สินรายใด ก็ให้หนี้สินรายนั้นเป็นอันได้เปลื้องไป\nถ้าลูกหนี้ไม่ระบุ ท่านว่าหนี้สินรายไหนถึงกำหนด ก็ให้รายนั้นเป็นอันได้เปลื้องไปก่อน ในระหว่างหนี้สินหลายรายที่ถึงกำหนดนั้น รายใดเจ้าหนี้มีประกันน้อยที่สุด ก็ให้รายนั้นเป็นอันได้เปลื้องไปก่อน ในระหว่างหนี้สินหลายรายที่มีประกันเท่า ๆ กัน ให้รายที่ตกหนักที่สุดแก่ลูกหนี้เป็นอันได้เปลื้องไปก่อน ในระหว่างหนี้สินหลายรายที่ตกหนักแก่ลูกหนี้เท่า ๆ กัน ให้หนี้สินรายเก่าที่สุดเป็นอันได้เปลื้องไปก่อน และถ้ามีหนี้สินหลายรายเก่าเท่า ๆ กัน ก็ให้หนี้ทุกรายเป็นอันได้เปลื้องไปตามส่วนมากและน้อย"],["329","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๒๙ ถ้านอกจากการชำระหนี้อันเป็นประธาน ลูกหนี้ยังจะต้องชำระดอกเบี้ยและเสียค่าฤชาธรรมเนียมอีกด้วยไซร้ หากการชำระหนี้ในครั้งหนึ่ง ๆ ไม่ได้ราคาเพียงพอจะเปลื้องหนี้สินได้ทั้งหมด ท่านให้เอาจัดใช้เป็นค่าฤชาธรรมเนียมเสียก่อนแล้วจึงใช้ดอกเบี้ย และในที่สุดจึงให้ใช้ในการชำระหนี้อันเป็นประธาน\nถ้าลูกหนี้ระบุให้จัดใช้เป็นประการอื่น ท่านว่าเจ้าหนี้จะบอกปัดไม่ยอมรับชำระหนี้ก็ได้"],["330","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๓๐ เมื่อขอปฏิบัติการชำระหนี้โดยชอบแล้ว บรรดาความรับผิดชอบอันเกิดแต่การไม่ชำระหนี้ ก็เป็นอันปลดเปลื้องไป นับแต่เวลาที่ขอปฏิบัติการชำระหนี้นั้น"],["331","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๓๑ ถ้าเจ้าหนี้บอกปัดไม่ยอมรับชำระหนี้ก็ดี หรือไม่สามารถจะรับชำระหนี้ได้ก็ดี หากบุคคลผู้ชำระหนี้วางทรัพย์อันเป็นวัตถุแห่งหนี้ไว้เพื่อประโยชน์แก่เจ้าหนี้แล้ว ก็ย่อมจะเป็นอันหลุดพ้นจากหนี้ได้ ความข้อนี้ท่านให้ใช้ตลอดถึงกรณีที่บุคคลผู้ชำระหนี้ไม่สามารถจะหยั่งรู้ถึงสิทธิ หรือไม่รู้ตัวเจ้าหนี้ได้แน่นอนโดยมิใช่เป็นความผิดของตน"],["332","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๓๒ ถ้าลูกหนี้จำต้องชำระหนี้ต่อเมื่อเจ้าหนี้จะต้องชำระหนี้ตอบแทนด้วยไซร้ ท่านว่าลูกหนี้จะกำหนดว่าต่อเมื่อเจ้าหนี้ชำระหนี้ตอบแทนจึงให้มีสิทธิรับเอาทรัพย์ที่วางไว้นั้นก็ได้"],["333","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๓๓ การวางทรัพย์นั้นต้องวาง ณ สำนักงานวางทรัพย์ประจำตำบลที่จะต้องชำระหนี้\nถ้าไม่มีบทบัญญัติแห่งกฎหมายหรือกฎข้อบังคับเฉพาะการในเรื่องสำนักงานวางทรัพย์ เมื่อบุคคลผู้ชำระหนี้ร้องขอ ศาลจะต้องกำหนดสำนักงานวางทรัพย์และตั้งแต่งผู้พิทักษ์ทรัพย์ที่วางนั้นขึ้น\nผู้วางต้องบอกกล่าวให้เจ้าหนี้ทราบการที่ได้วางทรัพย์นั้นโดยพลัน"],["334","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๓๔ ลูกหนี้มีสิทธิจะถอนทรัพย์ที่วางนั้นได้ ถ้าลูกหนี้ถอนทรัพย์นั้น ท่านให้ถือเสมือนว่ามิได้วางทรัพย์ไว้เลย\nสิทธิถอนทรัพย์นี้เป็นอันขาดในกรณีต่อไปนี้\n(๑) ถ้าลูกหนี้แสดงต่อสำนักงานวางทรัพย์ว่าตนยอมละสิทธิที่จะถอน\n(๒) ถ้าเจ้าหนี้แสดงต่อสำนักงานวางทรัพย์ว่าจะรับเอาทรัพย์นั้น\n(๓) ถ้าการวางทรัพย์นั้นได้เป็นไปโดยคำสั่งหรืออนุมัติของศาล และได้บอกกล่าวความนั้นแก่สำนักงานวางทรัพย์"],["335","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๓๕ สิทธิถอนทรัพย์นั้น ตามกฎหมาย ศาลจะสั่งยึดหาได้ไม่\nเมื่อได้ฟ้องคดีล้มละลายเกี่ยวกับทรัพย์สินของลูกหนี้แล้ว ท่านห้ามมิให้ใช้สิทธิถอนทรัพย์ในระหว่างพิจารณาคดีล้มละลาย"],["336","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๓๖ ถ้าทรัพย์อันเป็นวัตถุแห่งการชำระหนี้ไม่ควรแก่การจะวางไว้ก็ดี หรือเป็นที่พึงวิตกว่าทรัพย์นั้นเกลือกจะเสื่อมเสีย หรือทำลาย หรือบุบสลายได้ก็ดี เมื่อได้รับอนุญาตจากศาล บุคคลผู้ชำระหนี้จะเอาทรัพย์นั้นออกขายทอดตลาด แล้วเอาเงินที่ได้แต่การขายวางแทนทรัพย์นั้นก็ได้ ความข้อนี้ท่านให้ใช้ตลอดถึงกรณีที่ค่ารักษาทรัพย์จะแพงเกินควรนั้นด้วย"],["337","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๓๗ ท่านไม่อนุญาตให้เอาทรัพย์ออกขายทอดตลาดจนกว่าจะได้บอกให้เจ้าหนี้รู้ตัวก่อน การบอกนี้จะงดเสียก็ได้ ถ้าทรัพย์นั้นอาจเสื่อมทรามลง หรือภัยมีอยู่ในการที่จะหน่วงการขายทอดตลาดไว้\nในการที่จะขายทอดตลาดนั้น ท่านให้ลูกหนี้บอกกล่าวแก่เจ้าหนี้โดยไม่ชักช้า ถ้าละเลยเสียไม่บอกกล่าว ลูกหนี้จะต้องรับผิดใช้ค่าสินไหมทดแทน\nการบอกให้รู้ตัวและบอกกล่าวนี้ ถ้าไม่เป็นอันจะทำได้จะงดเสียก็ได้\nเวลาและสถานที่ที่จะขายทอดตลาด กับทั้งคำพรรณนาลักษณะแห่งทรัพย์นั้น ท่านให้ประกาศโฆษณาให้ประชาชนทราบ"],["338","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๓๘ ค่าฤชาธรรมเนียมในการวางทรัพย์หรือขายทอดตลาดนั้น ให้ฝ่ายเจ้าหนี้เป็นผู้ออก เว้นแต่ลูกหนี้จะได้ถอนทรัพย์ที่วาง"],["339","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๑ การชำระหนี้","มาตรา ๓๓๙ สิทธิของเจ้าหนี้เหนือทรัพย์ที่วางไว้นั้นเป็นอันระงับสิ้นไปเมื่อพ้นเวลาสิบปี นับแต่ได้รับคำบอกกล่าวการวางทรัพย์\nอนึ่ง เมื่อสิทธิของเจ้าหนี้ระงับสิ้นไปแล้วถึงแม้ลูกหนี้จะได้ละสิทธิถอนทรัพย์ ก็ยังชอบที่จะถอนทรัพย์นั้นได้"],["340","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๒ ปลดหนี้","มาตรา ๓๔๐ ถ้าเจ้าหนี้แสดงเจตนาต่อลูกหนี้ว่าจะปลดหนี้ให้ ท่านว่าหนี้นั้นก็เป็นอันระงับสิ้นไป\nถ้าหนี้มีหนังสือเป็นหลักฐาน การปลดหนี้ก็ต้องทำเป็นหนังสือด้วย หรือต้องเวนคืนเอกสารอันเป็นหลักฐานแห่งหนี้ให้แก่ลูกหนี้ หรือขีดฆ่าเอกสารนั้นเสีย"],["341","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๓ หักกลบลบหนี้","มาตรา ๓๔๑ ถ้าบุคคลสองคนต่างมีความผูกพันซึ่งกันและกัน โดยมูลหนี้อันมีวัตถุเป็นอย่างเดียวกัน และหนี้ทั้งสองรายนั้นถึงกำหนดจะชำระไซร้ ท่านว่าลูกหนี้ฝ่ายใดฝ่ายหนึ่งย่อมจะหลุดพ้นจากหนี้ของตนด้วยหักกลบลบกันได้เพียงเท่าจำนวนที่ตรงกันในมูลหนี้ทั้งสองฝ่ายนั้น เว้นแต่สภาพแห่งหนี้ฝ่ายหนึ่งจะไม่เปิดช่องให้หักกลบลบกันได้\nบทบัญญัติดังกล่าวมาในวรรคก่อนนี้ท่านมิให้ใช้บังคับ หากเป็นการขัดกับเจตนาอันคู่กรณีได้แสดงไว้ แต่เจตนาเช่นนี้ท่านห้ามมิให้ยกขึ้นเป็นข้อต่อสู้บุคคลภายนอกผู้กระทำการโดยสุจริต"],["342","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๓ หักกลบลบหนี้","มาตรา ๓๔๒ หักกลบลบหนี้นั้น ทำได้ด้วยคู่กรณีฝ่ายหนึ่งแสดงเจตนาแก่อีกฝ่ายหนึ่ง การแสดงเจตนาเช่นนี้ท่านว่าจะมีเงื่อนไขหรือเงื่อนเวลาเริ่มต้นหรือเวลาสิ้นสุดอีกด้วยหาได้ไม่\nการแสดงเจตนาดังกล่าวมาในวรรคก่อนนี้ ท่านว่ามีผลย้อนหลังขึ้นไปจนถึงเวลาซึ่งหนี้ทั้งสองฝ่ายนั้นจะอาจหักกลบลบกันได้เป็นครั้งแรก"],["343","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๓ หักกลบลบหนี้","มาตรา ๓๔๓ การหักกลบลบหนี้นั้น ถึงแม้ว่าสถานที่ซึ่งจะต้องชำระหนี้ทั้งสองจะต่างกัน ก็หักกันได้ แต่ฝ่ายผู้ขอหักหนี้จะต้องใช้ค่าเสียหายให้แก่อีกฝ่ายหนึ่งเพื่อความเสียหายอย่างหนึ่งอย่างใดอันเกิดแต่การนั้น"],["344","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๓ หักกลบลบหนี้","มาตรา ๓๔๔ สิทธิเรียกร้องใดยังมีข้อต่อสู้อยู่ สิทธิเรียกร้องนั้นท่านว่าหาอาจจะเอามาหักกลบลบหนี้ได้ไม่ อนึ่ง อายุความย่อมไม่ตัดรอนการหักกลบลบหนี้ แม้สิทธิเรียกร้องขาดอายุความแล้ว แต่ว่าในเวลาที่อาจจะหักกลบลบกับสิทธิเรียกร้องฝ่ายอื่นได้นั้น สิทธิยังไม่ขาด"],["345","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๓ หักกลบลบหนี้","มาตรา ๓๔๕ หนี้รายใดเกิดแต่การอันมิชอบด้วยกฎหมายเป็นมูล ท่านห้ามมิให้ลูกหนี้ถือเอาประโยชน์แห่งหนี้รายนั้นเพื่อหักกลบลบหนี้กับเจ้าหนี้"],["346","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๓ หักกลบลบหนี้","มาตรา ๓๔๖ สิทธิเรียกร้องรายใด ตามกฎหมายศาลจะสั่งยึดมิได้ สิทธิเรียกร้องรายนั้นหาอาจจะเอาไปหักกลบลบหนี้ได้ไม่"],["347","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๓ หักกลบลบหนี้","มาตรา ๓๔๗ ลูกหนี้คนที่สามหากได้รับคำสั่งศาลห้ามมิให้ใช้เงินแล้ว จะยกเอาหนี้ซึ่งตนได้มาภายหลังแต่นั้นขึ้นเป็นข้อต่อสู้เจ้าหนี้ผู้ที่ขอให้ยึดทรัพย์นั้น ท่านว่าหาอาจจะยกได้ไม่"],["348","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๓ หักกลบลบหนี้","มาตรา ๓๔๘ ถ้าคู่กรณีต่างฝ่ายต่างมีสิทธิเรียกร้องหลายราย อันควรแก่การที่จะใช้หักกลบลบหนี้ได้ไซร้ ฝ่ายผู้ที่ขอหักหนี้จะระบุก็ได้ว่าพึงเอาสิทธิเรียกร้องรายใดบ้างเข้าหักกลบลบกัน ถ้าการหักกลบลบหนี้ได้แสดงโดยมิได้ระบุเช่นนั้นก็ดี หรือถ้าระบุ แต่อีกฝ่ายหนึ่งท้วงขัดข้องโดยไม่ชักช้าก็ดี ท่านให้นำบทบัญญัติแห่งมาตรา ๓๒๘ วรรคสอง มาใช้บังคับโดยอนุโลม\nถ้าฝ่ายที่ขอหักกลบลบหนี้ยังเป็นหนี้ค่าดอกเบี้ยและค่าฤชาธรรมเนียมแก่อีกฝ่ายหนึ่งอยู่ นอกจากการชำระหนี้อันเป็นประธานนั้นด้วยไซร้ ท่านให้นำบทบัญญัติแห่งมาตรา ๓๒๙ มาใช้บังคับโดยอนุโลม"],["349","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๔ แปลงหนี้ใหม่","มาตรา ๓๔๙ เมื่อคู่กรณีที่เกี่ยวข้องได้ทำสัญญาเปลี่ยนสิ่งซึ่งเป็นสาระสำคัญแห่งหนี้ไซร้ ท่านว่าหนี้นั้นเป็นอันระงับสิ้นไปด้วยแปลงหนี้ใหม่\nถ้าทำหนี้มีเงื่อนไขให้กลายเป็นหนี้ปราศจากเงื่อนไขก็ดี เพิ่มเติมเงื่อนไขเข้าในหนี้อันปราศจากเงื่อนไขก็ดี เปลี่ยนเงื่อนไขก็ดี ท่านถือว่าเป็นอันเปลี่ยนสิ่งซึ่งเป็นสาระสำคัญแห่งหนี้นั้น\nถ้าแปลงหนี้ใหม่ด้วยเปลี่ยนตัวเจ้าหนี้ ท่านให้บังคับด้วยบทบัญญัติทั้งหลายแห่งประมวลกฎหมายนี้ ว่าด้วยโอนสิทธิเรียกร้อง"],["350","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๔ แปลงหนี้ใหม่","มาตรา ๓๕๐ แปลงหนี้ใหม่ด้วยเปลี่ยนตัวลูกหนี้นั้น จะทำเป็นสัญญาระหว่างเจ้าหนี้กับลูกหนี้คนใหม่ก็ได้ แต่จะทำโดยขืนใจลูกหนี้เดิมหาได้ไม่"],["351","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๔ แปลงหนี้ใหม่","มาตรา ๓๕๑ ถ้าหนี้อันจะพึงเกิดขึ้นเพราะแปลงหนี้ใหม่นั้นมิได้เกิดมีขึ้นก็ดี ได้ยกเลิกเสียเพราะมูลแห่งหนี้ไม่ชอบด้วยกฎหมาย หรือเพราะเหตุอย่างใดอย่างหนึ่งอันมิรู้ถึงคู่กรณีก็ดี ท่านว่าหนี้เดิมนั้นก็ยังหาระงับสิ้นไปไม่"],["352","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๔ แปลงหนี้ใหม่","มาตรา ๓๕๒ คู่กรณีในการแปลงหนี้ใหม่อาจโอนสิทธิจำนำ หรือจำนองที่ได้ให้ไว้เป็นประกันหนี้เดิมนั้นไปเป็นประกันหนี้รายใหม่ได้ เพียงเท่าที่เป็นประกันวัตถุแห่งหนี้เดิม แต่หลักประกันเช่นว่านี้ ถ้าบุคคลภายนอกเป็นผู้ให้ไว้ไซร้ ท่านว่าจำต้องได้รับความยินยอมของบุคคลภายนอกนั้นด้วยจึงโอนได้"],["353","b2t1","หมวด ๕ ความระงับหนี้","ส่วนที่ ๕ หนี้เกลื่อนกลืนกัน","มาตรา ๓๕๓ ถ้าสิทธิและความรับผิดในหนี้รายใดตกอยู่แก่บุคคลคนเดียวกัน ท่านว่าหนี้รายนั้นเป็นอันระงับสิ้นไป เว้นแต่เมื่อหนี้นั้นตกไปอยู่ในบังคับแห่งสิทธิของบุคคลภายนอก หรือเมื่อสลักหลังตั๋วเงินกลับคืนตามความในมาตรา ๙๑๗ วรรคสาม"],["354","b2t2","หมวด ๑ ก่อให้เกิดสัญญา","","มาตรา ๓๕๔ คำเสนอจะทำสัญญาอันบ่งระยะเวลาให้ทำคำสนองนั้น ท่านว่าไม่อาจจะถอนได้ภายในระยะเวลาที่บ่งไว้"],["355","b2t2","หมวด ๑ ก่อให้เกิดสัญญา","","มาตรา ๓๕๕ บุคคลทำคำเสนอไปยังผู้อื่นซึ่งอยู่ห่างกันโดยระยะทาง และมิได้บ่งระยะเวลาให้ทำคำสนอง จะถอนคำเสนอของตนเสียภายในเวลาอันควรคาดหมายว่าจะได้รับคำบอกกล่าวสนองนั้น ท่านว่าหาอาจจะถอนได้ไม่"],["356","b2t2","หมวด ๑ ก่อให้เกิดสัญญา","","มาตรา ๓๕๖ คำเสนอทำแก่บุคคลผู้อยู่เฉพาะหน้า โดยมิได้บ่งระยะเวลาให้ทำคำสนองนั้น เสนอ ณ ที่ใดเวลาใดก็ย่อมจะสนองรับได้แต่ ณ ที่นั้นเวลานั้น ความข้อนี้ท่านให้ใช้ตลอดถึงการที่บุคคลคนหนึ่งทำคำเสนอไปยังบุคคลอีกคนหนึ่งทางโทรศัพท์ด้วย"],["357","b2t2","หมวด ๑ ก่อให้เกิดสัญญา","","มาตรา ๓๕๗ คำเสนอใดเขาบอกปัดไปยังผู้เสนอแล้วก็ดี หรือมิได้สนองรับภายในเวลากำหนดดังกล่าวมาในมาตราทั้งสามก่อนนี้ก็ดี คำเสนอนั้นท่านว่าเป็นอันสิ้นความผูกพันแต่นั้นไป"],["358","b2t2","หมวด ๑ ก่อให้เกิดสัญญา","","มาตรา ๓๕๘ ถ้าคำบอกกล่าวสนองมาถึงล่วงเวลา แต่เป็นที่เห็นประจักษ์ว่าคำบอกกล่าวนั้นได้ส่งโดยทางการซึ่งตามปกติควรจะมาถึงภายในเวลากำหนดไซร้ ผู้เสนอต้องบอกกล่าวแก่คู่กรณีอีกฝ่ายหนึ่งโดยพลันว่าคำสนองนั้นมาถึงเนิ่นช้า เว้นแต่จะได้บอกกล่าวเช่นนั้นก่อนแล้ว\nถ้าผู้เสนอละเลยไม่บอกกล่าวดังว่ามาในวรรคต้น ท่านให้ถือว่าคำบอกกล่าวสนองนั้นมิได้ล่วงเวลา"],["359","b2t2","หมวด ๑ ก่อให้เกิดสัญญา","","มาตรา ๓๕๙ ถ้าคำสนองมาถึงล่วงเวลา ท่านให้ถือว่าคำสนองนั้นกลายเป็นคำเสนอขึ้นใหม่\nคำสนองอันมีข้อความเพิ่มเติม มีข้อจำกัด หรือมีข้อแก้ไขอย่างอื่นประกอบด้วยนั้น ท่านให้ถือว่าเป็นคำบอกปัดไม่รับทั้งเป็นคำเสนอขึ้นใหม่ด้วยในตัว"],["360","b2t2","หมวด ๑ ก่อให้เกิดสัญญา","","มาตรา ๓๖๐ บทบัญญัติแห่งมาตรา ๑๖๙ วรรคสอง นั้น ท่านมิให้ใช้บังคับ ถ้าหากว่าขัดกับเจตนาอันผู้เสนอได้แสดง หรือหากว่าก่อนจะสนองรับนั้น คู่กรณีอีกฝ่ายหนึ่งได้รู้อยู่แล้วว่าผู้เสนอตายหรือตกเป็นผู้ไร้ความสามารถ"],["361","b2t2","หมวด ๑ ก่อให้เกิดสัญญา","","มาตรา ๓๖๑ อันสัญญาระหว่างบุคคลซึ่งอยู่ห่างกันโดยระยะทางนั้น ย่อมเกิดเป็นสัญญาขึ้นแต่เวลาเมื่อคำบอกกล่าวสนองไปถึงผู้เสนอ\nถ้าตามเจตนาอันผู้เสนอได้แสดง หรือตามปกติประเพณีไม่จำเป็นจะต้องมีคำบอกกล่าวสนองไซร้ ท่านว่าสัญญานั้นเกิดเป็นสัญญาขึ้นในเวลาเมื่อมีการอันใดอันหนึ่งขึ้น อันจะพึงสันนิษฐานได้ว่าเป็นการแสดงเจตนาสนองรับ"],["362","b2t2","หมวด ๑ ก่อให้เกิดสัญญา","","มาตรา ๓๖๒ บุคคลออกโฆษณาให้คำมั่นว่าจะให้รางวัลแก่ผู้ซึ่งกระทำการอันใด ท่านว่าจำต้องให้รางวัลแก่บุคคลใด ๆ ผู้ได้กระทำการอันนั้น แม้ถึงมิใช่ว่าผู้นั้นจะได้กระทำเพราะเห็นแก่รางวัล"],["363","b2t2","หมวด ๑ ก่อให้เกิดสัญญา","","มาตรา ๓๖๓ ในกรณีที่กล่าวมาในมาตราก่อนนี้ เมื่อยังไม่มีใครทำการสำเร็จดังบ่งไว้นั้นอยู่ตราบใด ผู้ให้คำมั่นจะถอนคำมั่นของตนเสียโดยวิธีเดียวกับที่โฆษณานั้นก็ได้ เว้นแต่จะได้แสดงไว้ในโฆษณานั้นว่าจะไม่ถอน\nถ้าคำมั่นนั้นไม่อาจจะถอนโดยวิธีดังกล่าวมาก่อน จะถอนโดยวิธีอื่นก็ได้ แต่ถ้าเช่นนั้นการถอนจะเป็นอันสมบูรณ์ใช้ได้เพียงเฉพาะต่อบุคคลที่รู้\nถ้าผู้ให้คำมั่นได้กำหนดระยะเวลาให้ด้วยเพื่อทำการอันบ่งนั้นไซร้ ท่านให้สันนิษฐานไว้ก่อนว่าผู้ให้คำมั่นได้สละสิทธิที่จะถอนคำมั่นนั้นเสียแล้ว"],["364","b2t2","หมวด ๑ ก่อให้เกิดสัญญา","","มาตรา ๓๖๔ ถ้าบุคคลหลายคนกระทำการอันบ่งไว้ในโฆษณา ท่านว่าเฉพาะแต่คนที่ทำได้ก่อนใครหมดเท่านั้นมีสิทธิจะได้รับรางวัล\nถ้าบุคคลหลายคนกระทำการอันนั้นได้พร้อมกัน ท่านว่าแต่ละคนมีสิทธิจะได้รับรางวัลเป็นส่วนแบ่งเท่า ๆ กัน แต่ถ้ารางวัลนั้นมีสภาพแบ่งไม่ได้ก็ดี หรือถ้าตามข้อความแห่งคำมั่นนั้น บุคคลแต่คนเดียวจะพึงรับรางวัลก็ดี ท่านให้วินิจฉัยด้วยวิธีจับสลาก\nบทบัญญัติดังกล่าวมาในวรรคทั้งสองข้างต้นนั้นท่านมิให้ใช้บังคับ ถ้าในโฆษณานั้นแสดงเจตนาไว้เป็นอย่างอื่น"],["365","b2t2","หมวด ๑ ก่อให้เกิดสัญญา","","มาตรา ๓๖๕ คำมั่นจะให้รางวัลอันมีความประสงค์เป็นการประกวดชิงรางวัลนั้น จะสมบูรณ์ก็ต่อเมื่อได้กำหนดระยะเวลาไว้ในคำโฆษณาด้วย\nการที่จะตัดสินว่าผู้ประกวดคนไหนได้กระทำสำเร็จตามเงื่อนไขในคำมั่นภายในเวลากำหนดหรือไม่ก็ดี หรือตัดสินในระหว่างผู้ประกวดหลายคนนั้นว่าคนไหนดีกว่ากันอย่างไรก็ดี ให้ผู้ชี้ขาดซึ่งได้ระบุชื่อไว้ในโฆษณานั้นเป็นผู้ตัดสิน หรือถ้ามิได้ระบุชื่อผู้ชี้ขาดไว้ ก็ให้ผู้ให้คำมั่นเป็นผู้ตัดสิน คำตัดสินอันนี้ย่อมผูกพันผู้ที่เกี่ยวข้องด้วยทุกฝ่าย\nถ้าได้คะแนนทำดีเสมอกัน ท่านให้นำบทบัญญัติแห่งมาตรา ๓๖๔ วรรคสอง มาใช้บังคับ แล้วแต่กรณี\nการโอนกรรมสิทธิ์ในทรัพย์ที่ทำขึ้นประกวดนั้น ผู้ให้คำมั่นจะเรียกให้โอนแก่ตนได้ต่อเมื่อได้ระบุไว้ในโฆษณาว่าจะพึงโอนเช่นนั้น"],["366","b2t2","หมวด ๑ ก่อให้เกิดสัญญา","","มาตรา ๓๖๖ ข้อความใด ๆ แห่งสัญญาอันคู่สัญญาแม้เพียงฝ่ายเดียวได้แสดงไว้ว่าเป็นสาระสำคัญอันจะต้องตกลงกันหมดทุกข้อนั้น หากคู่สัญญายังไม่ตกลงกันได้หมดทุกข้ออยู่ตราบใด เมื่อกรณีเป็นที่สงสัย ท่านนับว่ายังมิได้มีสัญญาต่อกัน การที่ได้ทำความเข้าใจกันไว้เฉพาะบางสิ่งบางอย่าง ถึงแม้ว่าจะได้จดลงไว้ก็หาเป็นการผูกพันไม่\nถ้าได้ตกลงกันว่าสัญญาอันมุ่งจะทำนั้นจะต้องทำเป็นหนังสือไซร้ เมื่อกรณีเป็นที่สงสัย ท่านนับว่ายังมิได้มีสัญญาต่อกันจนกว่าจะได้ทำขึ้นเป็นหนังสือ"],["367","b2t2","หมวด ๑ ก่อให้เกิดสัญญา","","มาตรา ๓๖๗ สัญญาใดคู่สัญญาได้ถือว่าเป็นอันได้ทำกันขึ้นแล้ว แต่แท้จริงยังมิได้ตกลงกันในข้อหนึ่งข้อใดอันจะต้องทำความตกลงให้สำเร็จ ถ้าจะพึงอนุมานได้ว่า ถึงหากจะไม่ทำความตกลงกันในข้อนี้ได้ สัญญานั้นก็จะได้ทำขึ้นไซร้ ท่านว่าข้อความส่วนที่ได้ตกลงกันแล้วก็ย่อมเป็นอันสมบูรณ์"],["368","b2t2","หมวด ๑ ก่อให้เกิดสัญญา","","มาตรา ๓๖๘ สัญญานั้นท่านให้ตีความไปตามความประสงค์ในทางสุจริต โดยพิเคราะห์ถึงปกติประเพณีด้วย"],["369","b2t2","หมวด ๒ ผลแห่งสัญญา","","มาตรา ๓๖๙ ในสัญญาต่างตอบแทนนั้น คู่สัญญาฝ่ายหนึ่งจะไม่ยอมชำระหนี้จนกว่าอีกฝ่ายหนึ่งจะชำระหนี้หรือขอปฏิบัติการชำระหนี้ก็ได้ แต่ความข้อนี้ท่านมิให้ใช้บังคับ ถ้าหนี้ของคู่สัญญาอีกฝ่ายหนึ่งยังไม่ถึงกำหนด"],["370","b2t2","หมวด ๒ ผลแห่งสัญญา","","มาตรา ๓๗๐ ถ้าสัญญาต่างตอบแทนมีวัตถุที่ประสงค์เป็นการก่อให้เกิดหรือโอนทรัพยสิทธิในทรัพย์เฉพาะสิ่ง และทรัพย์นั้นสูญหรือเสียหายไปด้วยเหตุอย่างใดอย่างหนึ่งอันจะโทษลูกหนี้มิได้ไซร้ ท่านว่าการสูญหรือเสียหายนั้นตกเป็นพับแก่เจ้าหนี้\nถ้าไม่ใช่ทรัพย์เฉพาะสิ่ง ท่านให้ใช้บทบัญญัติที่กล่าวมาในวรรคก่อนนี้บังคับแต่เวลาที่ทรัพย์นั้นกลายเป็นทรัพย์เฉพาะสิ่งตามบทบัญญัติแห่งมาตรา ๑๙๕ วรรคสอง นั้นไป"],["371","b2t2","หมวด ๒ ผลแห่งสัญญา","","มาตรา ๓๗๑ บทบัญญัติที่กล่าวมาในมาตราก่อนนี้ท่านมิให้ใช้บังคับ ถ้าเป็นสัญญาต่างตอบแทนมีเงื่อนไขบังคับก่อน และทรัพย์อันเป็นวัตถุแห่งสัญญานั้นสูญหรือทำลายลงในระหว่างที่เงื่อนไขยังไม่สำเร็จ\nถ้าทรัพย์นั้นเสียหายเพราะเหตุอย่างใดอย่างหนึ่งอันจะโทษเจ้าหนี้มิได้ และเมื่อเงื่อนไขนั้นสำเร็จแล้ว เจ้าหนี้จะเรียกให้ชำระหนี้โดยลดส่วนอันตนจะต้องชำระหนี้ตอบแทนนั้นลงหรือเลิกสัญญานั้นเสียก็ได้ แล้วแต่จะเลือก แต่ในกรณีที่ต้นเหตุเสียหายเกิดเพราะฝ่ายลูกหนี้นั้น ท่านว่าหากระทบกระทั่งถึงสิทธิของเจ้าหนี้ที่จะเรียกค่าสินไหมทดแทนไม่"],["372","b2t2","หมวด ๒ ผลแห่งสัญญา","","มาตรา ๓๗๒ นอกจากกรณีที่กล่าวไว้ในสองมาตราก่อน ถ้าการชำระหนี้ตกเป็นพ้นวิสัยเพราะเหตุอย่างใดอย่างหนึ่งอันจะโทษฝ่ายหนึ่งฝ่ายใดก็ไม่ได้ไซร้ ท่านว่าลูกหนี้หามีสิทธิจะรับชำระหนี้ตอบแทนไม่\nถ้าการชำระหนี้ตกเป็นพ้นวิสัยเพราะเหตุอย่างใดอย่างหนึ่งอันจะโทษเจ้าหนี้ได้ ลูกหนี้ก็หาเสียสิทธิที่จะรับชำระหนี้ตอบแทนไม่ แต่ว่าลูกหนี้ได้อะไรไว้เพราะการปลดหนี้ก็ดี หรือใช้คุณวุฒิความสามารถของตนเป็นประการอื่นเป็นเหตุให้ได้อะไรมา หรือแกล้งละเลยเสียไม่ขวนขวายเอาอะไรที่สามารถจะทำได้ก็ดี มากน้อยเท่าไร จะต้องเอามาหักกับจำนวนอันตนจะได้รับชำระหนี้ตอบแทน วิธีเดียวกันนี้ท่านให้ใช้ตลอดถึงกรณีที่การชำระหนี้อันฝ่ายหนึ่งยังค้างชำระอยู่นั้นตกเป็นพ้นวิสัย เพราะพฤติการณ์อันใดอันหนึ่งซึ่งฝ่ายนั้นมิต้องรับผิดชอบ ในเวลาเมื่ออีกฝ่ายหนึ่งผิดนัดไม่รับชำระหนี้"],["373","b2t2","หมวด ๒ ผลแห่งสัญญา","","มาตรา ๓๗๓ ความตกลงทำไว้ล่วงหน้าเป็นข้อความยกเว้นมิให้ลูกหนี้ต้องรับผิดเพื่อกลฉ้อฉลหรือความประมาทเลินเล่ออย่างร้ายแรงของตนนั้น ท่านว่าเป็นโมฆะ"],["374","b2t2","หมวด ๒ ผลแห่งสัญญา","","มาตรา ๓๗๔ ถ้าคู่สัญญาฝ่ายหนึ่งทำสัญญาตกลงว่าจะชำระหนี้แก่บุคคลภายนอกไซร้ ท่านว่าบุคคลภายนอกมีสิทธิจะเรียกชำระหนี้จากลูกหนี้โดยตรงได้\nในกรณีดังกล่าวมาในวรรคต้นนั้น สิทธิของบุคคลภายนอกย่อมเกิดมีขึ้นตั้งแต่เวลาที่แสดงเจตนาแก่ลูกหนี้ว่าจะถือเอาประโยชน์จากสัญญานั้น"],["375","b2t2","หมวด ๒ ผลแห่งสัญญา","","มาตรา ๓๗๕ เมื่อสิทธิของบุคคลภายนอกได้เกิดมีขึ้นตามบทบัญญัติแห่งมาตราก่อนแล
